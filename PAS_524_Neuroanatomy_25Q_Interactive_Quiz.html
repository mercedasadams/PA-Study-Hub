<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAS 524 Neuroanatomy Interactive Quiz</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1f2430;--muted:#687083;--p:#6c5ce7;--pl:#efedff;--line:#dfe3eb;--g:#16784b;--gl:#eaf7f0;--r:#ad3434;--rl:#fff0f0}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);line-height:1.45}
.wrap{max-width:960px;margin:auto;padding:22px} h1{margin:0;font-size:clamp(1.6rem,3vw,2.25rem)} .sub{color:var(--muted);margin:.3rem 0 1rem}
.top{display:flex;justify-content:space-between;gap:15px;align-items:start} .score{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:800;white-space:nowrap}
.progressbox{height:9px;background:#e4e7ee;border-radius:99px;overflow:hidden;margin:14px 0} #progress{height:100%;width:0;background:var(--p)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:15px} .qnav{padding:7px 0;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
.qnav.now{outline:2px solid var(--p)} .qnav.good{background:var(--gl);border-color:#9bd4b6} .qnav.bad{background:var(--rl);border-color:#e5afaf}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 28px #0000000a}
.tags{display:flex;gap:7px;flex-wrap:wrap} .tag{font-size:.78rem;font-weight:800;padding:4px 8px;background:#f0f1f5;border-radius:999px;color:#525969} .tag.hi{background:#fff5d8;color:#715500}
.stem{font-size:1.12rem;font-weight:800;margin:14px 0 18px} .opts{display:grid;gap:9px} .orow{display:flex;gap:8px}
.opt{flex:1;text-align:left;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-size:1rem} .opt:hover{border-color:#a99ff0}
.opt.sel{border:2px solid var(--p);background:var(--pl)} .opt.elim{opacity:.36;text-decoration:line-through} .opt.ca{border:2px solid var(--g);background:var(--gl)} .opt.wa{border:2px solid var(--r);background:var(--rl)}
.x{width:42px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:900;color:#777} .x.on{background:#eee;color:#111}
button{font:inherit} .btn{padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-weight:800} .btn.primary{background:var(--p);color:#fff;border-color:var(--p)} .btn:disabled{opacity:.45;cursor:not-allowed}
.actions,.bottom{display:flex;gap:10px;margin-top:16px} .bottom{justify-content:space-between} .feedback{border-top:1px solid var(--line);margin-top:18px;padding-top:17px} .res{font-weight:900;font-size:1.08rem} .res.good{color:var(--g)} .res.bad{color:var(--r)}
.exp{margin-top:7px;border:1px solid var(--line);border-radius:10px;padding:9px 11px} .exp.correct{background:var(--gl);border-color:#9bd4b6} .note{color:var(--muted);font-size:.87rem;margin-top:14px}
.summary{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:none} .summary.show{display:block}
@media(max-width:650px){.top{flex-direction:column}.grid{grid-template-columns:repeat(5,1fr)}.wrap{padding:13px}.card{padding:18px}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>🧠 PAS 524 Neuroanatomy Quiz</h1><p class="sub">25 questions • PANCE/Bloom-style • Week 1 Neuroanatomy, Localization & Diagnostics</p></div><div class="score" id="score"></div></div>
<div class="actions"><button class="btn" id="tog">Hide navigator</button><button class="btn" id="reset">Reset quiz</button></div>
<div class="progressbox"><div id="progress"></div></div><div class="grid" id="grid"></div>
<div class="card"><div class="tags"><span class="tag" id="num"></span><span class="tag" id="cat"></span><span class="tag" id="lvl"></span><span class="tag hi" id="hi"></span></div>
<div class="stem" id="stem"></div><div class="opts" id="opts"></div>
<div class="actions"><button class="btn primary" id="submit">Submit answer</button></div><div id="fb" class="feedback" hidden></div>
<div class="bottom"><button class="btn" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div>
<div class="note">Use ✕ to cross out distractors. Each answer letter A–E is correct exactly 5 times.</div></div>
<div class="summary" id="summary"></div></div>
<script>
const Q=[{"cat": "ANS", "lvl": "Apply", "hi": "Core", "q": "A lesion disrupts parasympathetic outflow. Which origin pattern matches the affected division?", "o": ["T1–L2 thoracolumbar outflow", "CN III, VII, IX, X plus S2–S4 craniosacral outflow", "C1–C8 cervical outflow", "L1–L5 lumbar outflow", "CN V, VIII, XI plus S1–S3 outflow"], "a": "B", "x": ["Sympathetic outflow is thoracolumbar T1–L2.", "Correct: parasympathetic outflow is craniosacral—CN III, VII, IX, X and S2–S4.", "Not the pattern in the lecture.", "Not the pattern in the lecture.", "These are not the parasympathetic origins listed in the lecture."]}, {"cat": "Cerebrum", "lvl": "Analyze", "hi": "High-yield", "q": "A patient has right-sided weakness and impaired expressive language. Which lobe is most likely involved?", "o": ["Parietal", "Temporal", "Occipital", "Frontal", "Cerebellar"], "a": "D", "x": ["Parietal is somatosensory/spatial.", "Temporal is memory, receptive language and hearing.", "Occipital is vision.", "Correct: frontal lobe includes voluntary motor function and expressive language.", "Cerebellum coordinates movement; it does not produce aphasia."]}, {"cat": "Cerebrum", "lvl": "Apply", "hi": "High-yield", "q": "A very small lacunar infarct causes a large pure motor deficit. Which structure best explains this?", "o": ["Internal capsule", "Corpus callosum", "Postcentral gyrus", "Occipital cortex", "Cerebellar vermis"], "a": "A", "x": ["Correct: tightly packed corticospinal/corticobulbar fibers make small internal-capsule lesions clinically large.", "Corpus callosum connects hemispheres.", "Postcentral gyrus is primary sensory cortex.", "Occipital cortex is visual.", "Vermis is cerebellar."]}, {"cat": "Basal Ganglia", "lvl": "Understand", "hi": "Core", "q": "Which structure group modulates and refines movement initiated by the cortex by balancing facilitation and inhibition?", "o": ["Meninges", "Dorsal columns", "Occipital cortex", "Choroid plexus", "Basal ganglia"], "a": "E", "x": ["Protective CNS coverings.", "Sensory tract for vibration/proprioception/fine touch.", "Visual cortex.", "Produces CSF.", "Correct: this is the lecture's core basal-ganglia function."]}, {"cat": "Diencephalon", "lvl": "Understand", "hi": "Core", "q": "Which sensory modality is the major exception to the rule that information relays through the thalamus before reaching cortex?", "o": ["Vision", "Hearing", "Smell", "Somatosensation", "Pain/temperature"], "a": "C", "x": ["Vision relays through the thalamus/LGN.", "Hearing relays through the thalamus.", "Correct: the lecture emphasizes 'everything except smell.'", "Somatosensation relays through the thalamus.", "Pain/temperature relays through the thalamus."]}, {"cat": "Brainstem", "lvl": "Analyze", "hi": "Very high-yield", "q": "A patient has a left cranial nerve palsy and right-sided body weakness. Where does this pattern localize?", "o": ["Left cortex", "Right cortex", "Left brainstem", "Right cerebellum", "Left peripheral nerve"], "a": "C", "x": ["Cortex does not classically give crossed CN/body findings.", "Same reason; the pattern points to brainstem.", "Correct: ipsilateral CN deficit + contralateral body deficit = crossed brainstem finding.", "Cerebellum causes coordination deficits.", "One peripheral nerve cannot explain crossed face/body deficits."]}, {"cat": "Cranial Nerves", "lvl": "Apply", "hi": "Core", "q": "A midbrain lesion causes impaired eye movement and pupillary constriction. Which cranial nerve is most directly involved?", "o": ["CN III", "CN V", "CN VII", "CN IX", "CN XII"], "a": "A", "x": ["Correct: CN III controls eye movement and pupillary constriction and is associated with the midbrain.", "CN V is facial sensation/mastication, mainly pons.", "CN VII is facial movement/taste, pons.", "CN IX is swallowing/posterior taste, medulla.", "CN XII controls tongue movement, medulla."]}, {"cat": "Cerebellum", "lvl": "Analyze", "hi": "High-yield", "q": "Strength and sensation are normal, but a patient has a wide-based gait, dysmetria and intention tremor. Where is the lesion?", "o": ["Motor cortex", "Dorsal root ganglion", "Neuromuscular junction", "Cerebellum", "Anterior horn"], "a": "D", "x": ["Motor cortex lesions cause weakness/UMN signs.", "DRG lesions are sensory.", "NMJ disease causes fatigable weakness.", "Correct: normal strength/sensation with abnormal coordination localizes to cerebellum.", "Anterior horn disease causes LMN weakness."]}, {"cat": "Corticospinal Tract", "lvl": "Analyze", "hi": "Very high-yield", "q": "A left corticospinal lesion occurs above the pyramidal decussation. Which deficit is expected?", "o": ["Left weakness", "Right weakness", "Bilateral flaccid weakness", "Right pain/temperature loss only", "Left vibration loss only"], "a": "B", "x": ["Below the decussation, corticospinal deficits are ipsilateral.", "Correct: above the medullary crossing, weakness is contralateral.", "Not the expected unilateral UMN pattern.", "Pain/temp is spinothalamic.", "Vibration/proprioception is DCML."]}, {"cat": "DCML", "lvl": "Apply", "hi": "Very high-yield", "q": "Joint position and vibration are being tested. Which pathway carries these modalities, and where does it cross?", "o": ["Spinothalamic; spinal cord", "Corticospinal; medulla", "Spinocerebellar; pons", "Corticobulbar; midbrain", "DCML; medulla"], "a": "E", "x": ["Spinothalamic carries pain/temp.", "Corticospinal is motor.", "Not the lecture's pathway for conscious vibration/proprioception.", "Corticobulbar is motor.", "Correct: DCML ascends ipsilaterally and crosses in the medulla."]}, {"cat": "Spinothalamic", "lvl": "Apply", "hi": "Very high-yield", "q": "A pathway crosses within about 1–2 spinal levels after entering the cord. Which modality does it carry?", "o": ["Voluntary motor", "Fine touch", "Conscious proprioception", "Pain and temperature", "Vision"], "a": "D", "x": ["Motor = corticospinal.", "Fine touch = DCML.", "Proprioception = DCML.", "Correct: spinothalamic carries pain/temp and crosses low in the cord.", "Vision uses the optic pathway."]}, {"cat": "Spinal Cord", "lvl": "Analyze", "hi": "Very high-yield", "q": "A hemicord lesion produces ipsilateral loss of vibration/proprioception and contralateral loss of pain/temperature below the lesion. What explains this?", "o": ["Both tracts cross at the optic chiasm", "Both cross immediately in the cord", "DCML crosses in medulla; spinothalamic crosses in spinal cord", "DCML never crosses; spinothalamic crosses in thalamus", "Both remain ipsilateral to cortex"], "a": "C", "x": ["Optic chiasm is visual.", "DCML does not cross immediately in the cord.", "Correct: different decussation levels create the Brown-Séquard pattern.", "DCML crosses in the medulla.", "Both eventually cross."]}, {"cat": "Meninges", "lvl": "Apply", "hi": "High-yield", "q": "Head trauma tears bridging veins. In which space does blood classically collect?", "o": ["Epidural", "Subarachnoid", "Ventricular", "Intracerebral", "Subdural"], "a": "E", "x": ["Epidural is between skull/dura and contains meningeal vessels.", "Subarachnoid contains CSF and vessels.", "Not the meningeal space associated with bridging veins.", "Not the space emphasized for bridging veins.", "Correct: bridging veins are associated with the subdural space."]}, {"cat": "CSF", "lvl": "Analyze", "hi": "High-yield", "q": "The cerebral aqueduct becomes obstructed. Which ventricles enlarge upstream?", "o": ["Lateral and third ventricles", "Fourth ventricle only", "Third and fourth only", "All ventricles equally from impaired absorption", "No ventricles"], "a": "A", "x": ["Correct: blocked aqueduct causes noncommunicating hydrocephalus with enlarged lateral + third ventricles.", "Fourth is downstream.", "Fourth is downstream from the aqueduct.", "Equal enlargement from impaired absorption is communicating hydrocephalus.", "An obstruction changes ventricular size."]}, {"cat": "Visual Pathway", "lvl": "Analyze", "hi": "Very high-yield", "q": "A pituitary mass compresses the optic chiasm. Which visual field defect is expected?", "o": ["Monocular blindness", "Bitemporal hemianopsia", "Right homonymous hemianopia", "Left homonymous hemianopia", "Bilateral central scotomas"], "a": "B", "x": ["Optic nerve lesion causes monocular loss.", "Correct: optic chiasm compression causes bitemporal hemianopsia.", "Postchiasmal lesions cause homonymous loss.", "Postchiasmal lesions cause homonymous loss.", "Not the classic pattern emphasized."]}, {"cat": "Visual Pathway", "lvl": "Apply", "hi": "Very high-yield", "q": "A lesion occurs in the left optic tract. Which general visual pattern should result?", "o": ["Loss of the opposite visual field in both eyes", "Loss of vision only in the left eye", "Bitemporal loss", "Loss of the same-side field in both eyes", "Complete bilateral blindness"], "a": "A", "x": ["Correct: optic tract/radiation/cortex lesions produce contralateral homonymous field loss.", "Monocular loss = optic nerve.", "Bitemporal = optic chiasm.", "Postchiasmal loss is opposite visual field.", "A unilateral tract lesion does not cause total bilateral blindness."]}, {"cat": "Glia", "lvl": "Apply", "hi": "High-yield", "q": "A demyelinating process affects CNS myelin. Which glial cell is primarily involved?", "o": ["Astrocyte", "Microglia", "Ependymal cell", "Schwann cell", "Oligodendrocyte"], "a": "E", "x": ["Astrocytes support BBB/nutrition/scar.", "Microglia are CNS immune cells.", "Ependymal cells line ventricles.", "Schwann cells myelinate PNS.", "Correct: oligodendrocytes myelinate CNS; lecture links this to MS."]}, {"cat": "Glia", "lvl": "Apply", "hi": "High-yield", "q": "Peripheral demyelination slows nerve conduction. Which cell type is affected?", "o": ["Oligodendrocyte", "Schwann cell", "Astrocyte", "Microglia", "Ependymal cell"], "a": "B", "x": ["CNS myelin.", "Correct: Schwann cells myelinate PNS; lecture links this to GBS.", "CNS support/BBB.", "CNS immune cell.", "Ventricular lining/CSF."]}, {"cat": "Neurophysiology", "lvl": "Understand", "hi": "Core", "q": "Which ion movement is emphasized during neuronal depolarization?", "o": ["Potassium influx", "Calcium efflux", "Sodium influx", "Chloride efflux", "Potassium efflux"], "a": "C", "x": ["Not the lecture's depolarization event.", "Not the lecture's depolarization event.", "Correct: Na+ channels open at threshold and sodium enters.", "Not the emphasized mechanism.", "K+ efflux is repolarization."]}, {"cat": "UMN vs LMN", "lvl": "Analyze", "hi": "Very high-yield", "q": "Weakness is accompanied by spasticity, hyperreflexia and an upgoing Babinski response. Which lesion type fits best?", "o": ["Peripheral sensory lesion", "Neuromuscular junction lesion", "Primary muscle lesion", "Upper motor neuron lesion", "Lower motor neuron lesion"], "a": "D", "x": ["Does not explain motor pattern.", "NMJ = fatigable weakness.", "Muscle = usually symmetric proximal weakness.", "Correct: classic UMN signs.", "LMN = flaccidity, hyporeflexia, atrophy, fasciculations."]}, {"cat": "UMN vs LMN", "lvl": "Analyze", "hi": "Very high-yield", "q": "Weakness is accompanied by marked atrophy, fasciculations, decreased tone and absent reflexes. Which system is involved?", "o": ["Cerebellar", "Upper motor neuron", "Occipital", "Thalamic", "Lower motor neuron"], "a": "E", "x": ["Cerebellar disease is coordination without primary weakness.", "UMN causes spasticity/hyperreflexia.", "Occipital = vision.", "Thalamus = relay station.", "Correct: classic LMN pattern."]}, {"cat": "Reflex Arc", "lvl": "Apply", "hi": "Very high-yield", "q": "The efferent limb of the stretch reflex is interrupted. Through which root would that lower motor neuron normally exit?", "o": ["Dorsal root", "Ventral root", "Posterior column", "Dorsal root ganglion", "Spinothalamic tract"], "a": "B", "x": ["Afferent sensory limb enters dorsally.", "Correct: LMN efferent fibers exit via ventral root.", "Sensory tract.", "Sensory cell bodies.", "Pain/temp tract."]}, {"cat": "Localization", "lvl": "Analyze", "hi": "Very high-yield", "q": "Weakness occurs with aphasia and a new focal seizure. Which level should be localized first?", "o": ["Peripheral nerve", "Spinal cord", "Cerebral cortex", "Neuromuscular junction", "Muscle"], "a": "C", "x": ["Peripheral nerve = distal weakness/sensory loss/hyporeflexia.", "Spinal cord = sensory level/bilateral/bowel-bladder.", "Correct: weakness + aphasia/seizure/neglect points to cortex.", "NMJ = fatigable weakness.", "Muscle = symmetric proximal weakness."]}, {"cat": "Localization", "lvl": "Analyze", "hi": "Very high-yield", "q": "Bilateral leg weakness, a clear truncal sensory level and urinary retention develop together. Where is the lesion most likely?", "o": ["Cortex", "Brainstem", "Cerebellum", "Spinal cord", "Peripheral nerve"], "a": "D", "x": ["Cortex usually adds aphasia/seizure/neglect.", "Brainstem gives crossed findings/CN palsies.", "Cerebellum gives coordination deficits.", "Correct: sensory level + bilateral findings + bowel/bladder = spinal cord.", "One peripheral nerve cannot explain this pattern."]}, {"cat": "Diagnostics", "lvl": "Evaluate", "hi": "High-yield", "q": "A patient presents after acute head trauma with concern for intracranial hemorrhage. Which study best matches the lecture's recommended first-line approach?", "o": ["CT head", "EEG", "PET", "Nerve conduction studies", "Functional MRI"], "a": "A", "x": ["Correct: CT is fast and first-line for acute stroke, trauma and hemorrhage.", "EEG evaluates cortical electrical activity.", "PET assesses metabolic activity.", "NCS evaluates peripheral nerves.", "fMRI is used for functional mapping."]}], L=["A","B","C","D","E"]; let cur=0;
let S=Q.map(()=>({sel:null,done:false,ok:false,elim:[]}));
const $=id=>document.getElementById(id);
function stats(){let d=S.filter(s=>s.done).length,c=S.filter(s=>s.ok).length;$("score").textContent=`${d} / ${Q.length} answered · ${c} correct`;$("progress").style.width=(d/Q.length*100)+"%"; if(d===Q.length) summary();}
function nav(){let g=$("grid");g.innerHTML="";S.forEach((s,i)=>{let b=document.createElement("button");b.className="qnav"+(i===cur?" now":"")+(s.done?(s.ok?" good":" bad"):"");b.textContent=i+1;b.onclick=()=>{cur=i;render()};g.appendChild(b)})}
function render(){let q=Q[cur],s=S[cur];$("num").textContent=`Question ${cur+1} of ${Q.length}`;$("cat").textContent=q.cat;$("lvl").textContent="Bloom: "+q.lvl;$("hi").textContent=q.hi;$("stem").textContent=q.q;$("opts").innerHTML="";
q.o.forEach((t,i)=>{let row=document.createElement("div");row.className="orow";let b=document.createElement("button"),l=L[i];b.className="opt"+(s.sel===l?" sel":"")+(s.elim.includes(l)?" elim":"")+(s.done&&l===q.a?" ca":"")+(s.done&&s.sel===l&&l!==q.a?" wa":"");b.disabled=s.done;b.innerHTML=`<b>${l}.</b> ${t}`;b.onclick=()=>{s.sel=l;s.elim=s.elim.filter(z=>z!==l);render()};let x=document.createElement("button");x.className="x"+(s.elim.includes(l)?" on":"");x.textContent="✕";x.disabled=s.done;x.onclick=()=>{if(s.elim.includes(l))s.elim=s.elim.filter(z=>z!==l);else{s.elim.push(l);if(s.sel===l)s.sel=null}render()};row.append(b,x);$("opts").appendChild(row)});
$("submit").disabled=s.done||!s.sel;$("submit").textContent=s.done?"Answer submitted":"Submit answer";$("prev").disabled=cur===0;$("next").disabled=cur===Q.length-1;
if(s.done){$("fb").hidden=false;$("fb").innerHTML=`<div class="res ${s.ok?"good":"bad"}">${s.ok?"✓ Correct":"✗ Incorrect — correct answer: "+q.a}</div>`;q.x.forEach((e,i)=>{let d=document.createElement("div");d.className="exp"+(L[i]===q.a?" correct":"");d.innerHTML=`<b>${L[i]}.</b> ${e}`;$("fb").appendChild(d)})}else{$("fb").hidden=true;$("fb").innerHTML=""} nav();stats();window.scrollTo({top:0,behavior:"smooth"})}
$("submit").onclick=()=>{let s=S[cur];if(!s.sel||s.done)return;s.done=true;s.ok=s.sel===Q[cur].a;render()};$("prev").onclick=()=>{if(cur){cur--;render()}};$("next").onclick=()=>{if(cur<Q.length-1){cur++;render()}};
$("tog").onclick=()=>{let g=$("grid"),h=g.style.display==="none";g.style.display=h?"grid":"none";$("tog").textContent=h?"Hide navigator":"Show navigator"};
$("reset").onclick=()=>{if(confirm("Reset all answers?")){S=Q.map(()=>({sel:null,done:false,ok:false,elim:[]}));cur=0;$("summary").classList.remove("show");render()}};
function summary(){let c=S.filter(s=>s.ok).length,m=S.map((s,i)=>!s.ok?i+1:null).filter(Boolean),b=$("summary");b.classList.add("show");b.innerHTML=`<h2>Quiz complete</h2><p><b>Score: ${c} / ${Q.length} (${Math.round(c/Q.length*100)}%)</b></p><p>${m.length?"Review questions: "+m.join(", "):"Perfect score."}</p>`}
render();
</script></body></html>
