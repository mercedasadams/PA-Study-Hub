":"E","text":"Azathioprine accelerates the onset of action of infliximab","rationale":"This is not the taught rationale for the combination.","isCorrect":false}]},{"qnum":48,"module":"Module K, ILO 4","topic":"JAK inhibitor risk-benefit discussion","bloom":"Evaluate","task":"Treatment sequencing/risk discussion","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient with moderate-to-severe ulcerative colitis has failed an adequate trial of a TNF-alpha inhibitor and a second biologic class. Her provider is considering an oral small-molecule agent.","question":"Which of the following is most important to discuss before starting this class of medication?","correctLetter":"C","options":[{"letter":"A","text":"Increased risk of nephrotoxicity requiring routine renal biopsy","rationale":"This is not a taught concern or monitoring requirement for JAK inhibitors.","isCorrect":false},{"letter":"B","text":"Mandatory concurrent use with a second JAK inhibitor for efficacy","rationale":"JAK inhibitors are generally not combined with other JAK inhibitors or biologics; they are typically used as monotherapy.","isCorrect":false},{"letter":"C","text":"Increased risk of major adverse cardiovascular events (MACE)","rationale":"JAK inhibitors (tofacitinib, upadacitinib) are oral, third-line agents used after biologic failure, with MACE as the key safety concern requiring risk-benefit discussion.","isCorrect":true},{"letter":"D","text":"Complete absence of infection risk compared to biologics","rationale":"JAK inhibitors carry increased infection risk, similar to biologics, not an absence of risk.","isCorrect":false},{"letter":"E","text":"Requirement for IV administration in a monitored setting","rationale":"JAK inhibitors are oral agents, which is part of what distinguishes them from the injectable biologics.","isCorrect":false}]},{"qnum":49,"module":"Module K, ILO 8","topic":"Formulation selection for rectal-only disease","bloom":"Apply","task":"Prescribing/formulation selection","blueprint":"Drafting a prescription","vignette":"A patient has ulcerative proctitis with inflammation confined to the rectum.","question":"Which formulation would provide the most direct mucosal contact with the least systemic exposure?","correctLetter":"D","options":[{"letter":"A","text":"Oral extended-release mesalamine","rationale":"Extended-release formulations are used for disease throughout the entire colon (pancolitis), not disease confined to the rectum.","isCorrect":false},{"letter":"B","text":"Oral budesonide DR","rationale":"This formulation targets the terminal ileum/proximal colon, not disease confined to the rectum.","isCorrect":false},{"letter":"C","text":"IV methylprednisolone","rationale":"IV systemic steroids are reserved for severe/hospitalized flares, not mild disease confined to the rectum.","isCorrect":false},{"letter":"D","text":"Mesalamine suppository","rationale":"For disease confined to the rectum, a suppository delivers drug directly to the site of inflammation with minimal systemic absorption.","isCorrect":true},{"letter":"E","text":"Oral azathioprine","rationale":"This is a maintenance immunomodulator, not a formulation choice for direct mucosal contact.","isCorrect":false}]},{"qnum":50,"module":"Module K, ILO 9","topic":"Lactulose titration for hepatic encephalopathy","bloom":"Apply","task":"Patient counseling/titration","blueprint":"Monitoring pharmacologic regimens and adjusting as appropriate","vignette":"A patient with cirrhosis and hepatic encephalopathy is started on lactulose.","question":"Which of the following reflects the appropriate titration target for counseling this patient?","correctLetter":"E","options":[{"letter":"A","text":"Titrate to complete cessation of bowel movements to prevent ammonia absorption","rationale":"This is the opposite of the taught goal; stopping bowel movements would not help clear ammonia and is not the titration target.","isCorrect":false},{"letter":"B","text":"Use a fixed dose without titration regardless of bowel movement frequency","rationale":"Lactulose is specifically titrated based on bowel movement frequency, not given as a fixed, non-adjusted dose.","isCorrect":false},{"letter":"C","text":"Titrate to at least 6 bowel movements per day for maximal ammonia clearance","rationale":"This exceeds the taught target and risks excessive diarrhea and dehydration, which could worsen mental status.","isCorrect":false},{"letter":"D","text":"Titrate based on serum potassium rather than bowel movement frequency","rationale":"The taught titration parameter is bowel movement frequency (2-3 soft BM/day), not serum potassium.","isCorrect":false},{"letter":"E","text":"Titrate the dose to achieve 2-3 soft bowel movements per day","rationale":"Lactulose is titrated to a target of 2-3 soft bowel movements per day for hepatic encephalopathy — enough to adequately trap and excrete ammonia without causing excessive diarrhea or dehydration.","isCorrect":true}]}];
const TOTAL = 50;
const state = {}; // qnum -> { selected: letter|null, struck: Set, answered: bool }

QUESTIONS.forEach(q => { state[q.qnum] = { selected: null, struck: new Set(), answered: false }; });

const root = document.getElementById("examRoot");
const jumpnav = document.getElementById("jumpnav");

function render() {
  root.innerHTML = "";
  jumpnav.innerHTML = "";
  QUESTIONS.forEach(q => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "q" + q.qnum;

    const metaRow = document.createElement("div");
    metaRow.className = "meta-row";
    const topicSpan = document.createElement("span");
    topicSpan.className = "topic-tag locked";
    topicSpan.textContent = "Topic revealed after you answer";
    topicSpan.id = "topic" + q.qnum;
    metaRow.innerHTML = `<span class="qnum-badge">Q${q.qnum}</span>`;
    metaRow.appendChild(topicSpan);
    card.appendChild(metaRow);

    if (q.vignette) {
      const v = document.createElement("div");
      v.className = "vignette";
      v.textContent = q.vignette;
      card.appendChild(v);
    }

    const qt = document.createElement("div");
    qt.className = "question-text";
    qt.textContent = q.question;
    card.appendChild(qt);

    q.options.forEach(opt => {
      const row = document.createElement("div");
      row.className = "option-row";
      row.dataset.letter = opt.letter;

      const letterEl = document.createElement("div");
      letterEl.className = "opt-letter";
      letterEl.textContent = opt.letter;

      const textEl = document.createElement("div");
      textEl.className = "opt-text";
      textEl.textContent = opt.text;
      textEl.addEventListener("click", () => selectAnswer(q.qnum, opt.letter));

      const strikeBtn = document.createElement("button");
      strikeBtn.className = "strike-btn";
      strikeBtn.type = "button";
      strikeBtn.textContent = "strike";
      strikeBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleStrike(q.qnum, opt.letter); });

      row.appendChild(letterEl);
      row.appendChild(textEl);
      row.appendChild(strikeBtn);
      card.appendChild(row);
    });

    const submitRow = document.createElement("div");
    submitRow.className = "submit-q-row";
    const submitBtn = document.createElement("button");
    submitBtn.className = "submit-q-btn";
    submitBtn.type = "button";
    submitBtn.textContent = "Submit Answer";
    submitBtn.disabled = true;
    submitBtn.id = "submitq" + q.qnum;
    submitBtn.addEventListener("click", () => submitQuestion(q.qnum));
    const hint = document.createElement("span");
    hint.className = "submit-q-hint";
    hint.textContent = "Select an option above, then submit to see the rationale.";
    hint.id = "hint" + q.qnum;
    submitRow.appendChild(submitBtn);
    submitRow.appendChild(hint);
    card.appendChild(submitRow);

    const rat = document.createElement("div");
    rat.className = "rationale-block";
    card.appendChild(rat);

    const metaFoot = document.createElement("div");
    metaFoot.className = "meta-footer";
    metaFoot.innerHTML = `<span><b>Bloom:</b> ${q.bloom}</span><span><b>Task:</b> ${escapeHtml(q.task)}</span><span><b>Blueprint:</b> ${escapeHtml(q.blueprint)}</span><span><b>Source:</b> ${escapeHtml(q.module)} — ${escapeHtml(q.topic)}</span>`;
    card.appendChild(metaFoot);

    root.appendChild(card);

    const jn = document.createElement("a");
    jn.href = "#q" + q.qnum;
    jn.textContent = q.qnum;
    jn.id = "jn" + q.qnum;
    jumpnav.appendChild(jn);
  });
  refreshCardUI();
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function selectAnswer(qnum, letter) {
  const st = state[qnum];
  if (st.answered) return;
  st.selected = (st.selected === letter) ? null : letter;
  refreshCardUI(qnum);
  document.getElementById("submitq" + qnum).disabled = !st.selected;
}

function toggleStrike(qnum, letter) {
  const st = state[qnum];
  if (st.answered) return;
  if (st.struck.has(letter)) st.struck.delete(letter); else st.struck.add(letter);
  refreshCardUI(qnum);
}

function refreshCardUI(onlyQnum) {
  const list = onlyQnum ? [onlyQnum] : QUESTIONS.map(q => q.qnum);
  list.forEach(qnum => {
    const st = state[qnum];
    const card = document.getElementById("q" + qnum);
    const rows = card.querySelectorAll(".option-row");
    rows.forEach(row => {
      const letter = row.dataset.letter;
      const textEl = row.querySelector(".opt-text");
      const strikeBtn = row.querySelector(".strike-btn");
      row.classList.toggle("selected", st.selected === letter);
      textEl.classList.toggle("struck", st.struck.has(letter));
      strikeBtn.classList.toggle("active", st.struck.has(letter));
    });
  });
}

function submitQuestion(qnum) {
  const st = state[qnum];
  if (st.answered || !st.selected) return;
  st.answered = true;

  const q = QUESTIONS.find(x => x.qnum === qnum);
  const card = document.getElementById("q" + qnum);
  card.classList.add("answered");

  // reveal topic
  const topicSpan = document.getElementById("topic" + qnum);
  topicSpan.textContent = q.topic;
  topicSpan.classList.remove("locked");
  topicSpan.classList.add("revealed");

  const isCorrect = st.selected === q.correctLetter;

  const rows = card.querySelectorAll(".option-row");
  const ratBlock = card.querySelector(".rationale-block");
  let ratHtml = "";
  rows.forEach(row => {
    const letter = row.dataset.letter;
    const opt = q.options.find(o => o.letter === letter);
    if (opt.isCorrect) row.classList.add("correct-answer");
    if (st.selected === letter && !opt.isCorrect) row.classList.add("chosen-wrong");
    if (opt.isCorrect) {
      row.querySelector(".opt-text").insertAdjacentHTML("beforeend", ' <span class="result-icon correct">✓ CORRECT</span>');
      ratHtml += `<div class="r-line"><b class="correct-label">Why ${letter} is correct:</b> ${escapeHtml(opt.rationale)}</div>`;
    } else {
      if (st.selected === letter) {
        row.querySelector(".opt-text").insertAdjacentHTML("beforeend", ' <span class="result-icon wrong">✗ your answer</span>');
      }
      ratHtml += `<div class="r-line"><b class="wrong-label">Why ${letter} is wrong:</b> ${escapeHtml(opt.rationale)}</div>`;
    }
  });
  ratBlock.innerHTML = ratHtml;

  const jn = document.getElementById("jn" + qnum);
  jn.classList.remove("jn-answered");
  jn.classList.add(isCorrect ? "jn-correct" : "jn-wrong");

  updateStats();
}

function updateStats() {
  const answeredList = Object.values(state).filter(s => s.answered);
  const answeredCount = answeredList.length;
  const correctCount = answeredList.filter(s => {
    const q = QUESTIONS.find(x => state[x.qnum] === s);
    return s.selected === q.correctLetter;
  }).length;

  document.getElementById("answeredPill").textContent = answeredCount + " / " + TOTAL + " answered";
  document.getElementById("progressBar").style.width = (answeredCount / TOTAL * 100) + "%";

  const scorePill = document.getElementById("scorePill");
  if (answeredCount > 0) {
    scorePill.style.display = "inline-block";
    const pct = Math.round(correctCount / answeredCount * 100);
    scorePill.textContent = "Score so far: " + correctCount + " / " + answeredCount + " (" + pct + "%)";
  }

  const banner = document.getElementById("scoreBanner");
  if (answeredCount === TOTAL) {
    const byBloom = {};
    QUESTIONS.forEach(q => {
      const s = state[q.qnum];
      byBloom[q.bloom] = byBloom[q.bloom] || { correct: 0, total: 0 };
      byBloom[q.bloom].total++;
      if (s.selected === q.correctLetter) byBloom[q.bloom].correct++;
    });
    const pct = Math.round(correctCount / TOTAL * 100);
    const bloomSummary = Object.keys(byBloom).sort().map(b => {
      const v = byBloom[b];
      return b + ": " + v.correct + "/" + v.total;
    }).join("   ·   ");
    banner.style.display = "block";
    banner.classList.add("finished");
    banner.innerHTML = `🎉 Exam complete — you scored ${correctCount} / ${TOTAL} (${pct}%)` +
      `<div class="sb-sub">By Bloom level — ${bloomSummary}</div>` +
      `<div class="sb-sub">Use the number grid above to jump back to any question and re-read its rationale (green = correct, red = missed).</div>`;
  } else if (answeredCount > 0) {
    banner.style.display = "block";
    banner.classList.remove("finished");
    banner.innerHTML = `In progress — ${correctCount} / ${answeredCount} correct so far` +
      `<div class="sb-sub">${TOTAL - answeredCount} question${TOTAL - answeredCount === 1 ? "" : "s"} left to go.</div>`;
  }
}

render();
</script>
</body>
</html>
