<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GI Pharmacology — 50-Question PANCE-Style Exam</title>
<style>
  :root {
    --navy: #1F3864;
    --teal: #0E7C7B;
    --gold: #B7791F;
    --red: #B00020;
    --green: #1E7A3D;
    --light: #EAF1F8;
    --bg: #F6F8FB;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Calibri, system-ui, sans-serif;
    background: linear-gradient(180deg, #eef3fa 0%, var(--bg) 320px);
    margin: 0;
    padding: 0 0 80px;
    color: #1a1a1a;
  }
  header.top {
    background: linear-gradient(120deg, var(--navy), #2c4a7c);
    color: white;
    padding: 28px 24px 22px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  header.top h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.3px; }
  header.top .sub { opacity: 0.9; font-size: 14px; }
  header.top .emoji { font-size: 28px; margin-right: 6px; }

  .statbar {
    position: sticky; top: 0; z-index: 50;
    background: white;
    border-bottom: 2px solid var(--light);
    padding: 10px 20px;
    display: flex; gap: 18px; align-items: center; justify-content: center;
    flex-wrap: wrap;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .pill {
    background: var(--light); color: var(--navy); padding: 6px 14px;
    border-radius: 999px; font-weight: 600;
  }
  .pill.gold { background: #FFF3DA; color: #7a5209; }
  .pill.green { background: #E4F6E8; color: var(--green); }
  #progressBarWrap { flex: 1 1 220px; max-width: 320px; height: 10px; background: var(--light); border-radius: 6px; overflow: hidden; }
  #progressBar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal), var(--navy)); transition: width .25s; }

  main { max-width: 880px; margin: 0 auto; padding: 24px 18px; }

  .jumpnav {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-bottom: 26px;
  }
  .jumpnav a {
    display: block; text-align: center; padding: 6px 0; font-size: 12px;
    border-radius: 6px; background: white; border: 1px solid #dde5ef;
    color: var(--navy); text-decoration: none; font-weight: 600;
  }
  .jumpnav a.jn-answered { background: var(--light); border-color: var(--teal); }
  .jumpnav a.jn-correct { background: #E4F6E8; border-color: var(--green); color: var(--green); }
  .jumpnav a.jn-wrong { background: #FBE7EA; border-color: var(--red); color: var(--red); }

  .card {
    background: white;
    border-radius: 14px;
    padding: 20px 22px 16px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(20,40,80,0.07);
    border: 1px solid #e7edf5;
    scroll-margin-top: 70px;
  }
  .card.answered { border-color: #d7e0ee; }
  .card .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; flex-wrap: wrap; gap: 6px;
  }
  .qnum-badge {
    background: var(--navy); color: white; font-weight: 800; font-size: 13px;
    padding: 4px 12px; border-radius: 999px;
  }
  .topic-tag { font-size: 12px; color: #9aa5b3; font-style: italic; }
  .topic-tag.locked::before { content: "🔒 "; }
  .topic-tag.revealed { color: #6b7a90; }
  .topic-tag.revealed::before { content: ""; }

  .vignette {
    background: var(--light);
    border-left: 4px solid var(--navy);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .question-text { font-weight: 600; margin: 6px 0 14px; font-size: 15px; line-height: 1.45; }

  .option-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid #dfe6ef; border-radius: 9px; padding: 9px 12px;
    margin-bottom: 8px; transition: background .15s, border-color .15s;
  }
  .option-row:not(.disabled-hover):hover { background: #f5f9ff; border-color: var(--teal); }
  .opt-letter {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    background: var(--navy); color: white; font-weight: 700; font-size: 12.5px;
    display: flex; align-items: center; justify-content: center;
  }
  .opt-text { flex: 1; cursor: pointer; font-size: 14.5px; line-height: 1.4; }
  .opt-text.struck { text-decoration: line-through; color: #9aa5b3; }
  .strike-btn {
    flex: 0 0 auto; font-size: 11px; border: 1px solid #c9d3e0; background: white;
    color: #5a6675; border-radius: 6px; padding: 4px 8px; cursor: pointer;
  }
  .strike-btn:hover { background: #eef2f7; }
  .strike-btn.active { background: #fdeeee; border-color: var(--red); color: var(--red); }

  .option-row.selected { border-color: var(--teal); background: #eefaf8; }
  .option-row.selected .opt-letter { background: var(--teal); }

  .submit-q-row { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .submit-q-btn {
    background: var(--teal); color: white; border: none; padding: 8px 20px;
    border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13.5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .submit-q-btn:hover { background: #0a5f5e; }
  .submit-q-btn:disabled { background: #c3cad4; cursor: not-allowed; box-shadow: none; }
  .submit-q-hint { font-size: 12px; color: #9aa5b3; }
  .card.answered .submit-q-row { display: none; }

  /* Post-answer review coloring (per question) */
  .card.answered .option-row.correct-answer { border-color: var(--green); background: #eef9f0; }
  .card.answered .option-row.correct-answer .opt-letter { background: var(--green); }
  .card.answered .option-row.chosen-wrong { border-color: var(--red); background: #fdeeee; }
  .card.answered .option-row.chosen-wrong .opt-letter { background: var(--red); }
  .card.answered .opt-text { cursor: default; }
  .card.answered .strike-btn { display: none; }

  .result-icon { font-size: 13px; font-weight: 800; margin-left: 6px; }
  .result-icon.correct { color: var(--green); }
  .result-icon.wrong { color: var(--red); }

  .rationale-block {
    display: none;
    margin-top: 12px;
    background: #fbfbfb;
    border: 1px dashed #cfd8e3;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .card.answered .rationale-block { display: block; }
  .rationale-block .r-line { margin-bottom: 6px; }
  .rationale-block .r-line:last-child { margin-bottom: 0; }
  .rationale-block b.correct-label { color: var(--green); }
  .rationale-block b.wrong-label { color: var(--red); }

  .meta-footer {
    display: none;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #eef1f5;
    font-size: 11.5px; color: #7a8698; gap: 14px; flex-wrap: wrap;
  }
  .card.answered .meta-footer { display: flex; }
  .meta-footer span b { color: #4c5a70; }

  #scoreBanner {
    display: none;
    position: sticky; top: 54px; z-index: 40;
    margin: 0 auto 20px; max-width: 880px;
    background: linear-gradient(120deg, var(--gold), #d9a441);
    color: white; text-align: center; padding: 14px 20px; border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    font-weight: 700; font-size: 16px;
  }
  #scoreBanner.finished { background: linear-gradient(120deg, var(--green), #2e9e5b); }
  #scoreBanner .sb-sub { font-weight: 500; font-size: 12.5px; margin-top: 4px; opacity: 0.95; }

  footer.pagefoot { text-align: center; color: #93a0b2; font-size: 12px; margin-top: 30px; }
</style>
</head>

<script>
const QUESTIONS = [{"qnum":1,"module":"Module K, ILO 2","topic":"PPI mechanism of action","bloom":"Remember","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Which of the following best describes the mechanism by which proton pump inhibitors suppress gastric acid secretion?","correctLetter":"A","options":[{"letter":"A","text":"Irreversible covalent binding to the activated H+/K+ ATPase after acid-catalyzed conversion to a reactive intermediate","rationale":"PPIs are acid-labile prodrugs that are converted to a reactive sulfenamide cation in the acidic canalicular space of the activated proton pump. That cation covalently and irreversibly binds the H+/K+ ATPase, permanently inactivating that pump molecule until the parietal cell synthesizes a replacement (~18 hours).","isCorrect":true},{"letter":"B","text":"Reversible competitive antagonism of histamine at the H2 receptor","rationale":"This describes H2 receptor antagonists (e.g., famotidine), a separate class with a different, reversible mechanism.","isCorrect":false},{"letter":"C","text":"Direct chemical neutralization of hydrochloric acid within the gastric lumen","rationale":"This describes antacids (e.g., calcium carbonate), which act by simple acid-base neutralization, not enzyme inhibition.","isCorrect":false},{"letter":"D","text":"Reversible ionic binding to the potassium-binding site of the proton pump","rationale":"This describes the potassium-competitive acid blocker vonoprazan, which binds reversibly/ionically rather than covalently.","isCorrect":false},{"letter":"E","text":"Inhibition of gastrin release from antral G cells","rationale":"Reduced gastrin is a downstream physiologic consequence of decreased acid secretion, not the primary mechanism taught for PPIs.","isCorrect":false}]},{"qnum":2,"module":"Module K, ILO 1, 7","topic":"GERD step therapy","bloom":"Apply","task":"Treatment","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A 48-year-old man reports heartburn occurring 4-5 times per week for the past 2 months, worse after large meals and when lying down. He has been using calcium carbonate tablets as needed without adequate relief. He denies dysphagia, weight loss, or GI bleeding.","question":"Which of the following is the most appropriate next step in management?","correctLetter":"B","options":[{"letter":"A","text":"Continue calcium carbonate but increase the dosing frequency","rationale":"Antacids provide only PRN symptomatic relief; increasing frequency does not address persistent, troublesome symptoms.","isCorrect":false},{"letter":"B","text":"Initiate a proton pump inhibitor once daily for 4-8 weeks","rationale":"Symptoms occurring more than twice weekly and not controlled with antacids meet the definition of moderate-severe/persistent GERD, for which a PPI daily for 4-8 weeks is the preferred first-line prescription therapy.","isCorrect":true},{"letter":"C","text":"Begin combination therapy with a PPI plus an H2 receptor antagonist","rationale":"PPI and H2RA are not typically combined as initial therapy; this combination is reserved for refractory cases.","isCorrect":false},{"letter":"D","text":"Start sucralfate four times daily","rationale":"Sucralfate is a mucosal protective agent used for ulcer healing, not standard first-line GERD therapy.","isCorrect":false},{"letter":"E","text":"Refer directly for antireflux surgery","rationale":"Surgery is considered after an adequate trial of medical therapy, not as an initial step.","isCorrect":false}]},{"qnum":3,"module":"Module K, ILO 7","topic":"Chronic PPI adverse effects","bloom":"Understand","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A 68-year-old woman on omeprazole for the past 4 years for erosive esophagitis presents with fatigue. Laboratory testing reveals a low serum vitamin B12 level.","question":"Which of the following best explains this laboratory finding?","correctLetter":"C","options":[{"letter":"A","text":"Omeprazole directly binds and inactivates circulating vitamin B12","rationale":"This is not a described mechanism of PPI-associated B12 deficiency.","isCorrect":false},{"letter":"B","text":"Omeprazole induces autoimmune destruction of gastric parietal cells","rationale":"This describes a separate process (pernicious anemia), not a taught PPI adverse effect.","isCorrect":false},{"letter":"C","text":"Chronic acid suppression impairs release of vitamin B12 from dietary protein","rationale":"Prolonged acid suppression is a recognized risk of long-term PPI therapy, contributing to vitamin B12 deficiency along with hypomagnesemia and reduced bone mineral density.","isCorrect":true},{"letter":"D","text":"Omeprazole causes chronic occult GI bleeding leading to B12 loss","rationale":"PPIs are used to treat/prevent GI bleeding sources, not cause them; this is not the mechanism taught for PPI-related B12 deficiency.","isCorrect":false},{"letter":"E","text":"Omeprazole increases renal clearance of vitamin B12","rationale":"Increased renal clearance of B12 was not discussed as a PPI effect.","isCorrect":false}]},{"qnum":4,"module":"Module K, ILO 7","topic":"PPI adverse effect management","bloom":"Apply","task":"Monitoring/management","blueprint":"Monitoring and follow-up of pharmacologic regimens","vignette":"A 54-year-old man on long-term pantoprazole develops new watery diarrhea for the past 5 days without fever. Stool studies are pending.","question":"Which of the following is the most appropriate immediate action?","correctLetter":"D","options":[{"letter":"A","text":"Increase the pantoprazole dose to control symptoms","rationale":"Increasing acid suppression would not address diarrhea and could worsen the underlying risk.","isCorrect":false},{"letter":"B","text":"Add loperamide and continue the PPI as prescribed","rationale":"Treating symptomatically while continuing a possible contributing agent delays the appropriate step of holding the PPI.","isCorrect":false},{"letter":"C","text":"Switch to an equivalent dose of an H2 receptor antagonist without further workup","rationale":"Switching acid-suppression classes does not address the recommended step of stopping therapy and investigating the diarrhea.","isCorrect":false},{"letter":"D","text":"Discontinue the proton pump inhibitor while awaiting stool studies","rationale":"Chronic PPI use is associated with alteration of GI flora and increased risk of C. difficile infection; the recommended action when diarrhea develops is to stop the PPI while the etiology is investigated.","isCorrect":true},{"letter":"E","text":"Reassure the patient that this is an expected effect and continue current therapy","rationale":"New diarrhea after years of stable use is not simply expected; it warrants holding the PPI given the C. difficile association.","isCorrect":false}]},{"qnum":5,"module":"Module K, ILO 1","topic":"Sucralfate drug interaction","bloom":"Analyze","task":"Drug interaction","blueprint":"Drug interactions, including presentation and treatment","vignette":"A 45-year-old woman with a seizure disorder controlled on phenytoin is being treated for a duodenal ulcer. Her provider is considering adding sucralfate to her regimen.","question":"Which of the following statements about this combination is most accurate?","correctLetter":"E","options":[{"letter":"A","text":"Sucralfate has no clinically significant interactions with oral medications","rationale":"This contradicts the taught interaction between sucralfate and phenytoin (as well as fluoroquinolones and warfarin).","isCorrect":false},{"letter":"B","text":"Sucralfate increases phenytoin absorption, risking toxicity","rationale":"The interaction goes in the opposite direction — sucralfate binds and reduces phenytoin absorption.","isCorrect":false},{"letter":"C","text":"Sucralfate should be given simultaneously with phenytoin to enhance mucosal protection","rationale":"Simultaneous administration would worsen the binding interaction rather than improve outcomes.","isCorrect":false},{"letter":"D","text":"Phenytoin inactivates sucralfate, requiring an alternative ulcer agent","rationale":"This reverses the relationship; sucralfate affects phenytoin absorption, not the other way around.","isCorrect":false},{"letter":"E","text":"Sucralfate may bind phenytoin in the gastrointestinal tract and reduce its absorption, so doses should be separated","rationale":"Sucralfate is known to bind fluoroquinolones, phenytoin, and warfarin in the gut, reducing their absorption; dosing should be separated to avoid subtherapeutic phenytoin levels.","isCorrect":true}]},{"qnum":6,"module":"Module K, ILO 2","topic":"P-CAB vs. PPI","bloom":"Understand","task":"Pharmacology comparison","blueprint":"Pharmacokinetics, pharmacogenomics, and pharmacodynamics","vignette":"","question":"Vonoprazan differs from traditional proton pump inhibitors in which of the following ways?","correctLetter":"A","options":[{"letter":"A","text":"It is not a prodrug and reversibly binds both active and inactive proton pumps","rationale":"Vonoprazan is a potassium-competitive acid blocker that is acid-stable (not a prodrug) and binds the proton pump reversibly/ionically, including pumps that are not yet activated — giving it a more rapid onset than PPIs.","isCorrect":true},{"letter":"B","text":"It requires enteric coating to survive gastric acid before activation","rationale":"This describes PPIs, which need enteric coating and acid-triggered activation; vonoprazan does not require this.","isCorrect":false},{"letter":"C","text":"It has a shorter plasma half-life than most proton pump inhibitors","rationale":"Vonoprazan's half-life (~8 hours) is actually longer than the typical PPI half-life of 1-2 hours.","isCorrect":false},{"letter":"D","text":"It works by competitively blocking histamine at the H2 receptor","rationale":"This describes H2 receptor antagonists, a different drug class altogether.","isCorrect":false},{"letter":"E","text":"It requires several days of dosing before reaching its full effect, similar to omeprazole","rationale":"Vonoprazan has a rapid onset of action since it binds both active and inactive pumps immediately, unlike PPIs, which require days to inactivate enough of the pump pool.","isCorrect":false}]},{"qnum":7,"module":"Module K, ILO 1","topic":"H2 blocker pregnancy caution","bloom":"Apply","task":"Special population/contraindication","blueprint":"Special populations requiring drug/dose modification","vignette":"A 32-year-old woman who is 28 weeks pregnant has GERD symptoms that have not responded adequately to antacids and lifestyle changes. Her provider is selecting a pharmacologic agent.","question":"Which of the following should be avoided in this patient?","correctLetter":"B","options":[{"letter":"A","text":"Famotidine","rationale":"Famotidine was not flagged with the pregnancy-specific caution given to cimetidine.","isCorrect":false},{"letter":"B","text":"Cimetidine","rationale":"Cimetidine crosses the placenta and is specifically noted as not recommended in pregnancy or breastfeeding, distinguishing it from the other H2 blockers in this class.","isCorrect":true},{"letter":"C","text":"Calcium carbonate","rationale":"This antacid was not flagged as contraindicated in pregnancy.","isCorrect":false},{"letter":"D","text":"Magnesium hydroxide","rationale":"This antacid was not flagged as contraindicated in pregnancy in this course.","isCorrect":false},{"letter":"E","text":"Sucralfate","rationale":"Sucralfate has minimal systemic absorption and was not flagged as contraindicated in pregnancy.","isCorrect":false}]},{"qnum":8,"module":"Module K, ILO 1","topic":"NSAID-induced ulcer prevention","bloom":"Evaluate","task":"Treatment strategy","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A 60-year-old man with a history of a prior duodenal ulcer requires daily ibuprofen for osteoarthritis. His provider wants to minimize his risk of a recurrent NSAID-induced ulcer while maintaining adequate pain control.","question":"Which of the following strategies best reflects the approach taught for this scenario?","correctLetter":"C","options":[{"letter":"A","text":"Add an H2 receptor antagonist to the current NSAID regimen","rationale":"H2 receptor antagonists were specifically taught as not effective for NSAID-induced ulcer prevention.","isCorrect":false},{"letter":"B","text":"Add misoprostol as monotherapy without changing the NSAID","rationale":"Misoprostol alone, without addressing the causative NSAID, is not the complete taught strategy, and it carries significant adverse effects.","isCorrect":false},{"letter":"C","text":"Switch to a COX-2 selective NSAID and/or add a proton pump inhibitor","rationale":"The taught approach to reducing NSAID-induced ulcer risk is to change the NSAID (dose reduction, discontinuation, or switching to a COX-2 selective agent such as celecoxib) and add a PPI, which works best for prevention; misoprostol is an alternative but has a heavier adverse effect burden.","isCorrect":true},{"letter":"D","text":"Continue the current regimen since ulcer risk is unrelated to NSAID selection","rationale":"NSAID selection directly affects ulcer risk (e.g., COX-1 vs. COX-2 selectivity), so this statement is incorrect.","isCorrect":false},{"letter":"E","text":"Switch to aspirin, which carries a lower gastrointestinal risk than ibuprofen","rationale":"Aspirin is also an NSAID that inhibits COX and carries its own significant GI risk; it is not a safer substitute.","isCorrect":false}]},{"qnum":9,"module":"Module K, ILO 1","topic":"H. pylori first-line regimen","bloom":"Remember","task":"Treatment","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"","question":"Which of the following regimens is considered first-line therapy for Helicobacter pylori eradication?","correctLetter":"D","options":[{"letter":"A","text":"A proton pump inhibitor and clarithromycin alone for 7 days","rationale":"Dual therapy with only two agents for a shortened duration is not the taught first-line regimen, and clarithromycin resistance is a significant concern.","isCorrect":false},{"letter":"B","text":"Amoxicillin monotherapy for 14 days","rationale":"Monotherapy with a single antibiotic is inadequate for H. pylori eradication.","isCorrect":false},{"letter":"C","text":"An H2 receptor antagonist plus metronidazole for 10 days","rationale":"H2 receptor antagonists are not recommended for H. pylori treatment; a PPI is used instead.","isCorrect":false},{"letter":"D","text":"A proton pump inhibitor, metronidazole, tetracycline, and bismuth subsalicylate for 14 days","rationale":"Bismuth quadruple therapy was explicitly taught as first-line/gold-standard treatment for H. pylori eradication.","isCorrect":true},{"letter":"E","text":"A proton pump inhibitor plus levofloxacin as initial therapy","rationale":"Levofloxacin-based therapy is reserved as a salvage option after initial treatment failure, not first-line.","isCorrect":false}]},{"qnum":10,"module":"Module K, ILO 1","topic":"Confirming H. pylori eradication","bloom":"Apply","task":"Diagnostic testing/monitoring","blueprint":"Monitoring and follow-up of pharmacologic regimens","vignette":"A patient completes a 14-day course of bismuth quadruple therapy for H. pylori infection. Her provider wants to confirm eradication.","question":"Which of the following is the most appropriate approach?","correctLetter":"E","options":[{"letter":"A","text":"Perform a urea breath test immediately after the last dose of antibiotics","rationale":"Testing immediately after treatment risks a false-negative result; a 4-week interval is recommended.","isCorrect":false},{"letter":"B","text":"Continue the PPI through testing to reduce false negatives","rationale":"The PPI should be held for 2 weeks before testing, not continued, to avoid a false-negative result.","isCorrect":false},{"letter":"C","text":"Order serum H. pylori antibody titers 1 week after treatment","rationale":"Serologic testing was not the taught method for confirming eradication in this course.","isCorrect":false},{"letter":"D","text":"Repeat upper endoscopy with biopsy 1 week after treatment","rationale":"This is not the taught follow-up testing method or timeframe for this purpose.","isCorrect":false},{"letter":"E","text":"Perform a urea breath test at least 4 weeks after completing treatment, holding the PPI for 2 weeks beforehand","rationale":"This is the taught protocol for confirming eradication — testing too soon or while still on acid suppression risks a false-negative result.","isCorrect":true}]},{"qnum":11,"module":"Module K, ILO 1","topic":"H. pylori antibiotic mechanisms","bloom":"Understand","task":"Mechanism (antimicrobial)","blueprint":"Mechanism of action","vignette":"","question":"In bismuth quadruple therapy for H. pylori, which of the following antibiotics acts primarily by inhibiting bacterial protein synthesis?","correctLetter":"A","options":[{"letter":"A","text":"Tetracycline","rationale":"Tetracycline inhibits bacterial protein synthesis, as taught in the antibiotic mechanism breakdown for H. pylori regimens.","isCorrect":true},{"letter":"B","text":"Metronidazole","rationale":"Metronidazole works by breaking down bacterial DNA, not by inhibiting protein synthesis.","isCorrect":false},{"letter":"C","text":"Amoxicillin","rationale":"Amoxicillin, a penicillin, inhibits bacterial cell wall synthesis (and is not part of the bismuth quadruple regimen).","isCorrect":false},{"letter":"D","text":"Rifabutin","rationale":"Rifabutin inhibits bacterial RNA synthesis.","isCorrect":false},{"letter":"E","text":"Levofloxacin","rationale":"Levofloxacin, a fluoroquinolone, inhibits bacterial DNA synthesis.","isCorrect":false}]},{"qnum":12,"module":"Module K, ILO 1","topic":"Antibiotic resistance patterns","bloom":"Understand","task":"Epidemiology/treatment selection","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A provider is selecting an H. pylori regimen and reviewing national antibiotic resistance data discussed in lecture.","question":"Which of the following antibiotics has one of the highest reported resistance rates nationally, making regimen selection more challenging?","correctLetter":"B","options":[{"letter":"A","text":"Amoxicillin","rationale":"Amoxicillin resistance rates remain low, which is why it is increasingly favored in newer regimens.","isCorrect":false},{"letter":"B","text":"Metronidazole","rationale":"Metronidazole resistance was cited at approximately 42% nationally, a major driver of treatment failure and regimen selection.","isCorrect":true},{"letter":"C","text":"Tetracycline","rationale":"Tetracycline resistance rates remain comparatively low, favoring its continued use in quadruple therapy.","isCorrect":false},{"letter":"D","text":"Bismuth subsalicylate","rationale":"This is not a conventional antibiotic subject to the same resistance patterns discussed.","isCorrect":false},{"letter":"E","text":"Rifabutin","rationale":"Rifabutin is a newer option not flagged with the high resistance concern given to metronidazole.","isCorrect":false}]},{"qnum":13,"module":"Module K, ILO 1","topic":"Misoprostol contraindication","bloom":"Analyze","task":"Contraindication","blueprint":"Contraindications","vignette":"A 29-year-old woman with rheumatoid arthritis who takes daily NSAIDs for symptom control is being considered for misoprostol to reduce her risk of NSAID-induced ulcer.","question":"Which of the following in her history would make misoprostol an inappropriate choice?","correctLetter":"C","options":[{"letter":"A","text":"She has a history of seasonal allergies","rationale":"This is not a contraindication to misoprostol.","isCorrect":false},{"letter":"B","text":"She drinks 1-2 cups of coffee daily","rationale":"This is not a contraindication to misoprostol.","isCorrect":false},{"letter":"C","text":"She and her partner are actively trying to conceive","rationale":"Misoprostol is Pregnancy Category X and an abortifacient with a box warning for birth defects, miscarriage, and uterine rupture — it is contraindicated in anyone who could become pregnant.","isCorrect":true},{"letter":"D","text":"She has well-controlled hypothyroidism","rationale":"This is not a contraindication to misoprostol.","isCorrect":false},{"letter":"E","text":"She takes a daily multivitamin","rationale":"This is not a contraindication to misoprostol.","isCorrect":false}]},{"qnum":14,"module":"Module K, ILO 1, 8","topic":"Sucralfate administration timing","bloom":"Apply","task":"Patient counseling/administration","blueprint":"Pharmacokinetics, pharmacogenomics, and pharmacodynamics","vignette":"A patient with a duodenal ulcer is prescribed sucralfate four times daily. She also takes a proton pump inhibitor and uses an as-needed antacid.","question":"Which counseling point is most important for this patient?","correctLetter":"D","options":[{"letter":"A","text":"Sucralfate should always be taken with the antacid to enhance mucosal protection","rationale":"This is the opposite of correct counseling — concurrent antacid use can impair sucralfate activation.","isCorrect":false},{"letter":"B","text":"Sucralfate has significant systemic absorption requiring renal dose adjustment","rationale":"Sucralfate has minimal systemic absorption, and renal dose adjustment was not taught as a consideration.","isCorrect":false},{"letter":"C","text":"Sucralfate should be taken on an empty stomach simultaneously with the PPI for best effect","rationale":"Simultaneous administration with a PPI undermines the acidic environment sucralfate needs to activate.","isCorrect":false},{"letter":"D","text":"Sucralfate requires an acidic environment to activate and should not be taken at the same time as the antacid or PPI","rationale":"Sucralfate must be activated in an acidic environment; co-administration with acid-suppressing or acid-neutralizing agents can reduce its effectiveness, so doses should be separated.","isCorrect":true},{"letter":"E","text":"Sucralfate replaces the need for continued PPI therapy in all patients","rationale":"Sucralfate is a symptomatic/protective adjunct; it does not universally replace acid-suppression therapy.","isCorrect":false}]},{"qnum":15,"module":"Module K, ILO 1","topic":"Stress ulcer prophylaxis","bloom":"Apply","task":"Treatment/prevention","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient in the intensive care unit has been on mechanical ventilation for 3 days and is being assessed for stress-related mucosal damage prophylaxis.","question":"Which of the following is most appropriate for prophylaxis in this setting?","correctLetter":"E","options":[{"letter":"A","text":"Oral sucralfate as first-line therapy","rationale":"Sucralfate is described as an alternative (via NG tube), not first-line, for stress ulcer prophylaxis.","isCorrect":false},{"letter":"B","text":"Oral misoprostol","rationale":"Misoprostol was not taught as an option for stress ulcer prophylaxis in critically ill patients.","isCorrect":false},{"letter":"C","text":"IV promethazine","rationale":"Promethazine is an antiemetic and is unrelated to stress ulcer prophylaxis.","isCorrect":false},{"letter":"D","text":"Oral calcium carbonate as needed","rationale":"PRN oral antacid dosing does not provide the reliable, continuous acid suppression needed for high-risk ICU prophylaxis.","isCorrect":false},{"letter":"E","text":"IV pantoprazole","rationale":"IV PPI (or IV famotidine) is the typical approach for stress ulcer prophylaxis in critically ill patients; oral/NG options are used when the patient can tolerate them.","isCorrect":true}]},{"qnum":16,"module":"Module K, ILO 3","topic":"Long-term laxative use in LTC","bloom":"Apply","task":"Treatment selection","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A 78-year-old nursing home resident with a history of stroke and neurogenic bowel dysfunction requires a laxative for ongoing management of chronic constipation.","question":"Which class of laxative is most appropriate for long-term use in this setting?","correctLetter":"A","options":[{"letter":"A","text":"Stimulant laxatives","rationale":"Stimulant laxatives (e.g., senna, bisacodyl) were specifically taught as the preferred class for long-term use in long-term-care and neurologically impaired patients.","isCorrect":true},{"letter":"B","text":"Bulk-forming laxatives","rationale":"Bulk-forming laxatives require adequate patient cooperation and fluid intake, which limits their use in this population, and they were not the class highlighted for long-term care.","isCorrect":false},{"letter":"C","text":"Lubricant laxatives","rationale":"Lubricant laxatives carry aspiration risk and were not the taught long-term-care answer.","isCorrect":false},{"letter":"D","text":"GC-C agonists","rationale":"GC-C agonists were discussed for CIC/IBS-C in the general adult population, not specifically flagged for this population.","isCorrect":false},{"letter":"E","text":"5-HT4 receptor agonists","rationale":"5-HT4 agonists were discussed for chronic idiopathic constipation generally, not specifically flagged for long-term-care patients.","isCorrect":false}]},{"qnum":17,"module":"Module K, ILO 3","topic":"Osmotic laxative selection in renal impairment","bloom":"Analyze","task":"Special population/drug selection","blueprint":"Special populations requiring drug/dose modification","vignette":"A 66-year-old man with stage 4 chronic kidney disease needs an osmotic laxative for constipation.","question":"Which of the following would be the safest choice given his renal function?","correctLetter":"B","options":[{"letter":"A","text":"Magnesium citrate","rationale":"Magnesium-based osmotic laxatives carry electrolyte disturbance/accumulation risk, especially with impaired renal clearance.","isCorrect":false},{"letter":"B","text":"Polyethylene glycol","rationale":"PEG is the electrolyte-safe exception among osmotic laxatives, making it the safest choice in a patient with impaired renal clearance of electrolytes.","isCorrect":true},{"letter":"C","text":"Magnesium hydroxide","rationale":"Prolonged use should be avoided in renal insufficiency due to hypermagnesemia risk.","isCorrect":false},{"letter":"D","text":"Sodium phosphate rectal enema","rationale":"Sodium-based products carry electrolyte/volume concerns and should be used cautiously in renal impairment.","isCorrect":false},{"letter":"E","text":"Magnesium sulfate","rationale":"This magnesium salt carries the same electrolyte disturbance risk as other magnesium-based osmotic laxatives.","isCorrect":false}]},{"qnum":18,"module":"Module K, ILO 3","topic":"GC-C agonist mechanism","bloom":"Remember","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Which of the following best describes the mechanism of action of linaclotide?","correctLetter":"C","options":[{"letter":"A","text":"Selective stimulation of ClC-2 chloride channels in intestinal epithelial cells","rationale":"This describes lubiprostone's mechanism, a chloride channel activator, not a GC-C agonist.","isCorrect":false},{"letter":"B","text":"Osmotic retention of water via nonabsorbable sugar fermentation","rationale":"This describes lactulose's mechanism as an osmotic laxative.","isCorrect":false},{"letter":"C","text":"Agonism of guanylate cyclase-C, increasing intracellular cGMP and activating CFTR to increase chloride and fluid secretion into the intestinal lumen","rationale":"This is the taught mechanism for linaclotide and plecanatide, the GC-C agonist class.","isCorrect":true},{"letter":"D","text":"Agonism of the 5-HT4 receptor, enhancing peristaltic contractions","rationale":"This describes prucalopride's mechanism.","isCorrect":false},{"letter":"E","text":"Antagonism of peripheral mu-opioid receptors in the intestine","rationale":"This describes the mechanism of PAMORAs (e.g., methylnaltrexone), not GC-C agonists.","isCorrect":false}]},{"qnum":19,"module":"Module K, ILO 3","topic":"GC-C agonist pediatric warning","bloom":"Apply","task":"Contraindication/counseling","blueprint":"Contraindications","vignette":"A mother asks about starting linaclotide for her 5-year-old son's chronic constipation after reading about it online.","question":"Which of the following is the most appropriate response?","correctLetter":"D","options":[{"letter":"A","text":"Linaclotide is safe and effective at any age with appropriate dose adjustment","rationale":"This contradicts the taught black box warning against use under age 6.","isCorrect":false},{"letter":"B","text":"Linaclotide should be combined with a stimulant laxative for pediatric patients","rationale":"This does not address the fundamental contraindication in this age group.","isCorrect":false},{"letter":"C","text":"Linaclotide is only available by prescription for adults over 65","rationale":"This is not an accurate age restriction taught for this medication.","isCorrect":false},{"letter":"D","text":"Linaclotide carries a boxed warning against use in children under 6 due to a risk of severe dehydration","rationale":"GC-C agonists carry a black box warning against use in children under 6, based on mortality shown in juvenile animal studies related to dehydration risk.","isCorrect":true},{"letter":"E","text":"Linaclotide requires renal dose adjustment in pediatric patients but is otherwise unrestricted","rationale":"The key concern taught is the black box warning against use under age 6, not renal dosing.","isCorrect":false}]},{"qnum":20,"module":"Module K, ILO 3, 9","topic":"Opioid-induced constipation in palliative care","bloom":"Apply","task":"Treatment selection","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient with metastatic cancer receiving high-dose opioids for pain control has not had a bowel movement in 5 days despite scheduled docusate and senna. She is receiving palliative care and has failed multiple other laxative regimens.","question":"Which of the following is the most appropriate next step?","correctLetter":"E","options":[{"letter":"A","text":"Naloxegol","rationale":"Naloxegol is indicated for opioid-induced constipation in patients with chronic non-cancer pain, not specifically the palliative-care-refractory population.","isCorrect":false},{"letter":"B","text":"Alvimopan","rationale":"Alvimopan is approved for short-term, inpatient use to reduce postoperative ileus after bowel resection, not for this scenario.","isCorrect":false},{"letter":"C","text":"Loperamide","rationale":"Loperamide is an antidiarrheal that would worsen, not treat, constipation.","isCorrect":false},{"letter":"D","text":"Increase the opioid dose to reduce breakthrough pain-related straining","rationale":"Increasing the opioid dose does not address constipation and would likely worsen it.","isCorrect":false},{"letter":"E","text":"Methylnaltrexone","rationale":"Methylnaltrexone is specifically indicated for opioid-induced constipation in palliative care patients who are unresponsive to other laxative therapy.","isCorrect":true}]},{"qnum":21,"module":"Module K, ILO 3","topic":"Naloxegol drug interaction","bloom":"Analyze","task":"Drug interaction","blueprint":"Drug interactions, including presentation and treatment","vignette":"A patient taking naloxegol for opioid-induced constipation is newly prescribed clarithromycin for a sinus infection.","question":"Which of the following is the most appropriate concern regarding this combination?","correctLetter":"A","options":[{"letter":"A","text":"Clarithromycin, a strong CYP3A4 inhibitor, may increase naloxegol concentrations and its associated risks","rationale":"Naloxegol is contraindicated with strong CYP3A4 inhibitors such as clarithromycin, ketoconazole, and diltiazem due to the risk of increased drug concentrations.","isCorrect":true},{"letter":"B","text":"Clarithromycin will decrease naloxegol's effectiveness by inducing its metabolism","rationale":"Clarithromycin is a CYP3A4 inhibitor, not an inducer, and the concern is increased (not decreased) naloxegol levels.","isCorrect":false},{"letter":"C","text":"This combination poses no clinically significant interaction","rationale":"This is a specifically taught contraindicated combination.","isCorrect":false},{"letter":"D","text":"Clarithromycin will precipitate opioid withdrawal in this patient","rationale":"This is not the taught mechanism of concern for this interaction.","isCorrect":false},{"letter":"E","text":"Naloxegol will reduce the antibiotic efficacy of clarithromycin","rationale":"The interaction concern flows in the other direction — clarithromycin affects naloxegol levels, not the reverse.","isCorrect":false}]},{"qnum":22,"module":"Module K, ILO 9","topic":"Docusate counseling","bloom":"Understand","task":"Patient counseling","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient recovering from labor and delivery is prescribed docusate for opioid-associated constipation prevention.","question":"Which of the following counseling points is most appropriate?","correctLetter":"B","options":[{"letter":"A","text":"Take the medication only if abdominal pain or nausea develops","rationale":"Abdominal pain and N/V are actually contraindications to starting docusate, not indications for its use.","isCorrect":false},{"letter":"B","text":"Take the medication with a full glass of water, and avoid combining it with mineral oil","rationale":"Docusate should be taken with a full glass of water, and combining it with mineral oil increases systemic absorption of the oil, which should be avoided.","isCorrect":true},{"letter":"C","text":"This medication is most effective when taken with mineral oil to enhance absorption","rationale":"This combination should be avoided, not encouraged.","isCorrect":false},{"letter":"D","text":"Expect a bowel movement within 15-60 minutes of the first dose","rationale":"This onset describes glycerin suppositories, not docusate, which is used for prophylaxis rather than rapid relief.","isCorrect":false},{"letter":"E","text":"This medication is a stimulant laxative and works best taken at bedtime","rationale":"Docusate is a stool softener, not a stimulant laxative.","isCorrect":false}]},{"qnum":23,"module":"Module K, ILO 3","topic":"Traveler's diarrhea","bloom":"Apply","task":"Treatment/OTC selection","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A 24-year-old man is planning international travel to an area with unreliable food and water safety. He wants an over-the-counter medication to keep on hand in case he develops diarrhea.","question":"Which of the following would be most appropriate?","correctLetter":"C","options":[{"letter":"A","text":"Diphenoxylate/atropine","rationale":"This agent works similarly but is prescription-only, not an OTC option.","isCorrect":false},{"letter":"B","text":"Cholestyramine","rationale":"This bile acid sequestrant treats bile-acid-related diarrhea, not the acute infectious diarrhea of travel.","isCorrect":false},{"letter":"C","text":"Loperamide","rationale":"Loperamide was specifically taught as the OTC drug of choice for traveler's diarrhea.","isCorrect":true},{"letter":"D","text":"Docusate","rationale":"Docusate is a stool softener for constipation, unrelated to diarrhea treatment.","isCorrect":false},{"letter":"E","text":"Psyllium","rationale":"Psyllium is a bulk-forming laxative for constipation, not indicated for traveler's diarrhea prevention/treatment.","isCorrect":false}]},{"qnum":24,"module":"Module K, ILO 3","topic":"Diphenoxylate/atropine combination rationale","bloom":"Understand","task":"Mechanism/rationale","blueprint":"Prescribing, monitoring, and regulating controlled substances","vignette":"","question":"Atropine is combined with diphenoxylate in the branded antidiarrheal product for which of the following reasons?","correctLetter":"D","options":[{"letter":"A","text":"To potentiate the antidiarrheal effect of diphenoxylate","rationale":"This is not the taught rationale; the purpose is abuse deterrence.","isCorrect":false},{"letter":"B","text":"To counteract diphenoxylate-induced hypertension","rationale":"This is not a taught adverse effect or rationale for the combination.","isCorrect":false},{"letter":"C","text":"To prevent diphenoxylate from crossing the blood-brain barrier","rationale":"This is not the taught mechanism; the combination's purpose is abuse deterrence.","isCorrect":false},{"letter":"D","text":"To discourage misuse of the opioid component at supratherapeutic doses","rationale":"Atropine is added specifically to deter abuse — its unpleasant anticholinergic effects at high doses discourage taking excess amounts of the opioid diphenoxylate.","isCorrect":true},{"letter":"E","text":"To reduce the risk of GI bleeding associated with diphenoxylate","rationale":"This is not a taught concern or rationale for the combination.","isCorrect":false}]},{"qnum":25,"module":"Module K, ILO 3","topic":"Antimotility agent contraindication in colitis","bloom":"Apply","task":"Contraindication","blueprint":"Contraindications","vignette":"A patient with ulcerative colitis presents with fever, abdominal distension, and bloody diarrhea. Her provider is concerned about toxic megacolon.","question":"Which class of antidiarrheal medication should be avoided in this presentation?","correctLetter":"E","options":[{"letter":"A","text":"Bile acid sequestrants","rationale":"These were not flagged with this specific contraindication in severe colitis.","isCorrect":false},{"letter":"B","text":"Adsorbents","rationale":"These were not flagged with this specific contraindication in severe colitis.","isCorrect":false},{"letter":"C","text":"Oral rehydration solutions","rationale":"These are supportive, nonpharmacologic measures and are not contraindicated.","isCorrect":false},{"letter":"D","text":"Bismuth subsalicylate","rationale":"This agent was not flagged with the toxic megacolon caution given to opioid antimotility agents.","isCorrect":false},{"letter":"E","text":"Opioid receptor agonists (e.g., loperamide)","rationale":"Opioid antimotility agents can contribute to or worsen toxic megacolon in patients with severe colitis and should be avoided when fever, severe abdominal pain, or a swollen abdomen are present.","isCorrect":true}]},{"qnum":26,"module":"Module K, ILO 3","topic":"Bile acid sequestrant indication matching","bloom":"Analyze","task":"Treatment matched to pathophysiology","blueprint":"Indications for use","vignette":"A patient with Crohn disease who underwent ileal resection develops chronic watery diarrhea attributed to bile acid malabsorption.","question":"Which of the following medications would most directly address the underlying mechanism of her diarrhea?","correctLetter":"A","options":[{"letter":"A","text":"Cholestyramine","rationale":"Bile acid sequestrants bind excess fecal bile acids in the gut, directly addressing diarrhea caused by bile acid malabsorption (e.g., after ileal resection).","isCorrect":true},{"letter":"B","text":"Loperamide","rationale":"This is a general antimotility agent that slows transit but does not target the bile acid malabsorption mechanism.","isCorrect":false},{"letter":"C","text":"Rifaximin","rationale":"This non-absorbed antibiotic targets bacterial overgrowth-related conditions, not bile acid malabsorption specifically.","isCorrect":false},{"letter":"D","text":"Bismuth subsalicylate","rationale":"This agent's antimicrobial/anti-secretory mechanism does not target bile acid malabsorption.","isCorrect":false},{"letter":"E","text":"Diphenoxylate/atropine","rationale":"This is a general antimotility agent, not a targeted treatment for bile acid malabsorption.","isCorrect":false}]},{"qnum":27,"module":"Module K, ILO 3","topic":"CINV prophylaxis regimen","bloom":"Apply","task":"Treatment","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient is about to begin a highly emetogenic chemotherapy regimen.","question":"Which combination of antiemetics reflects the standard approach for this scenario?","correctLetter":"B","options":[{"letter":"A","text":"A phenothiazine alone","rationale":"Monotherapy with an older, less potent agent is not the taught standard for highly emetogenic regimens.","isCorrect":false},{"letter":"B","text":"A 5-HT3 receptor antagonist, an NK1 receptor antagonist, and dexamethasone","rationale":"This three-drug combination is the taught standard for prevention of highly emetogenic chemotherapy-induced nausea and vomiting.","isCorrect":true},{"letter":"C","text":"Metoclopramide and a benzodiazepine alone","rationale":"This combination lacks the taught core agents (5-HT3 and NK1 antagonists plus dexamethasone) for highly emetogenic chemotherapy.","isCorrect":false},{"letter":"D","text":"An antihistamine and scopolamine","rationale":"These agents target the vestibular pathway for motion sickness, not chemotherapy-induced nausea.","isCorrect":false},{"letter":"E","text":"Bismuth subsalicylate and a 5-HT3 receptor antagonist","rationale":"Bismuth subsalicylate is not part of the taught CINV prevention regimen.","isCorrect":false}]},{"qnum":28,"module":"Module K, ILO 3","topic":"5-HT3 antagonist selection with cardiac risk","bloom":"Analyze","task":"Treatment selection with contraindication","blueprint":"Contraindications","vignette":"A 70-year-old woman with a known prolonged QT interval requires an antiemetic for postoperative nausea.","question":"Which of the following would be the most appropriate choice given her cardiac history?","correctLetter":"C","options":[{"letter":"A","text":"Ondansetron","rationale":"This first-generation 5-HT3 antagonist carries a QT prolongation caution.","isCorrect":false},{"letter":"B","text":"Granisetron","rationale":"This first-generation 5-HT3 antagonist carries a QT prolongation caution.","isCorrect":false},{"letter":"C","text":"Palonosetron","rationale":"Palonosetron, the second-generation 5-HT3 antagonist, does not carry the QT prolongation risk associated with the first-generation agents or droperidol.","isCorrect":true},{"letter":"D","text":"Dolasetron","rationale":"This first-generation 5-HT3 antagonist carries a QT prolongation caution.","isCorrect":false},{"letter":"E","text":"Droperidol","rationale":"Droperidol carries a QT prolongation risk and is generally reserved for patients unresponsive to other agents.","isCorrect":false}]},{"qnum":29,"module":"Module K, ILO 3","topic":"CTZ anatomy","bloom":"Remember","task":"Pathophysiology","blueprint":"Mechanism of action","vignette":"","question":"The chemoreceptor trigger zone is uniquely positioned to detect circulating toxins and drugs because it is located:","correctLetter":"D","options":[{"letter":"A","text":"Within the vestibular apparatus","rationale":"The vestibular apparatus is a separate emesis pathway (M1/H1 receptors), distinct from the CTZ.","isCorrect":false},{"letter":"B","text":"Directly innervated only by vagal afferents from the GI tract","rationale":"The CTZ integrates broader signaling, and its defining anatomic feature is its location outside the BBB, not exclusive vagal innervation.","isCorrect":false},{"letter":"C","text":"Within the limbic system","rationale":"This is not the anatomic location taught for the CTZ.","isCorrect":false},{"letter":"D","text":"Outside the blood-brain barrier","rationale":"The CTZ's location outside the blood-brain barrier allows it direct access to circulating drugs, toxins, and metabolic byproducts, making it a key trigger point for drug- and toxin-induced emesis.","isCorrect":true},{"letter":"E","text":"Behind the blood-brain barrier, protected from systemic circulation","rationale":"This is the opposite of the CTZ's defining feature — it lies outside the BBB.","isCorrect":false}]},{"qnum":30,"module":"Module K, ILO 3","topic":"Metoclopramide adverse effect","bloom":"Apply","task":"Adverse effect identification","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient on chronic metoclopramide for diabetic gastroparesis develops involuntary, repetitive movements of her tongue and face.","question":"Which of the following adverse effects is she most likely experiencing?","correctLetter":"E","options":[{"letter":"A","text":"Serotonin syndrome","rationale":"This is not the adverse effect specifically associated with metoclopramide in this course.","isCorrect":false},{"letter":"B","text":"Anticholinergic toxicity","rationale":"Metoclopramide's signature adverse effect concern is tardive dyskinesia, not anticholinergic toxicity.","isCorrect":false},{"letter":"C","text":"Malignant hyperthermia","rationale":"This is not a taught adverse effect of metoclopramide.","isCorrect":false},{"letter":"D","text":"QT prolongation","rationale":"QT prolongation is the signature concern for droperidol and first-generation 5-HT3 antagonists, not metoclopramide.","isCorrect":false},{"letter":"E","text":"Tardive dyskinesia","rationale":"Tardive dyskinesia is the box-warning adverse effect specifically associated with chronic metoclopramide use, related to its D2-antagonist activity.","isCorrect":true}]},{"qnum":31,"module":"Module K, ILO 3","topic":"Opioid-induced nausea mechanism","bloom":"Analyze","task":"Pathophysiology/mechanism matching","blueprint":"Mechanism of action","vignette":"A patient develops nausea and vomiting shortly after starting a new opioid analgesic.","question":"Which receptor is most likely primarily responsible for triggering this adverse effect?","correctLetter":"A","options":[{"letter":"A","text":"Dopamine (D2) receptors in the chemoreceptor trigger zone","rationale":"The CTZ is rich in D2 and opioid receptors, making it the primary site through which opioids (and other circulating drugs/toxins) trigger emesis.","isCorrect":true},{"letter":"B","text":"5-HT3 receptors on vagal afferents in the GI tract","rationale":"This pathway is primarily responsible for chemotherapy- and radiation-induced nausea from mucosal irritation, not opioid-induced nausea.","isCorrect":false},{"letter":"C","text":"H1 receptors in the vestibular system","rationale":"This pathway mediates motion sickness, not opioid-induced nausea.","isCorrect":false},{"letter":"D","text":"NK1 receptors in the vomiting center","rationale":"NK1 receptors are primarily relevant to highly emetogenic chemotherapy, not the primary opioid-induced nausea pathway.","isCorrect":false},{"letter":"E","text":"M1 receptors in the vestibular nuclei","rationale":"This pathway mediates motion sickness, not opioid-induced nausea.","isCorrect":false}]},{"qnum":32,"module":"Module K, ILO 9","topic":"ODT administration counseling","bloom":"Apply","task":"Patient counseling/administration","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient with severe nausea is prescribed ondansetron orally disintegrating tablets.","question":"Which of the following counseling points is correct?","correctLetter":"B","options":[{"letter":"A","text":"Swallow the tablet whole with a full glass of water","rationale":"This describes standard tablet administration, not the correct ODT technique.","isCorrect":false},{"letter":"B","text":"Ensure hands are dry, place the tablet on or under the tongue, and allow it to dissolve completely before swallowing","rationale":"ODTs dissolve on contact with moisture, so dry hands are needed for handling; the tablet should be placed on/under the tongue and allowed to fully dissolve, then swallowed — no water is required.","isCorrect":true},{"letter":"C","text":"Dissolve the tablet in water before drinking the solution","rationale":"This is not the correct administration technique for an ODT.","isCorrect":false},{"letter":"D","text":"Chew the tablet thoroughly before swallowing","rationale":"ODTs should dissolve on/under the tongue, not be chewed.","isCorrect":false},{"letter":"E","text":"Take the tablet with food to improve absorption","rationale":"Food timing is not part of the taught ODT counseling; the technique focuses on dry hands and sublingual dissolution.","isCorrect":false}]},{"qnum":33,"module":"Module K, ILO 3","topic":"5-HT3 antagonist hepatic dosing","bloom":"Evaluate","task":"Special population dosing","blueprint":"Special populations requiring drug/dose modification","vignette":"A patient with severe hepatic impairment requires an antiemetic for chemotherapy-induced nausea. Her oncologist is reviewing dosing considerations.","question":"Which of the following statements about 5-HT3 receptor antagonists in hepatic impairment is accurate?","correctLetter":"C","options":[{"letter":"A","text":"5-HT3 receptor antagonists require no dose adjustment regardless of hepatic function","rationale":"This contradicts the taught recommendation for dose reduction in hepatic insufficiency.","isCorrect":false},{"letter":"B","text":"5-HT3 receptor antagonists are contraindicated in any degree of hepatic impairment","rationale":"Dose adjustment, not absolute contraindication, is the taught approach.","isCorrect":false},{"letter":"C","text":"Dose reduction is recommended for 5-HT3 receptor antagonists in hepatic insufficiency","rationale":"Dose reduction in hepatic insufficiency was specifically taught as a consideration for this drug class.","isCorrect":true},{"letter":"D","text":"5-HT3 receptor antagonists should be replaced entirely by NK1 antagonists in hepatic impairment","rationale":"This is not the taught approach; NK1 antagonists actually undergo extensive hepatic metabolism and require their own caution in hepatic impairment.","isCorrect":false},{"letter":"E","text":"5-HT3 receptor antagonists require dose adjustment only in renal, not hepatic, impairment","rationale":"The taught adjustment is specifically for hepatic insufficiency.","isCorrect":false}]},{"qnum":34,"module":"Module K, ILO 3","topic":"Motion sickness vs. CINV pathway","bloom":"Understand","task":"Pathophysiology/mechanism","blueprint":"Mechanism of action","vignette":"A patient asks why her ondansetron, which controls her chemotherapy-related nausea well, does not help her motion sickness during car rides.","question":"Which of the following best explains this?","correctLetter":"D","options":[{"letter":"A","text":"Ondansetron is inactivated by gastric acid before it can act on the vestibular system","rationale":"This is not the taught explanation; the issue is receptor/pathway mismatch, not drug inactivation.","isCorrect":false},{"letter":"B","text":"Motion sickness is mediated by NK1 receptors, which ondansetron does not block","rationale":"Motion sickness is mediated by the vestibular pathway (M1/H1), not NK1 receptors.","isCorrect":false},{"letter":"C","text":"Ondansetron only works when administered intravenously","rationale":"Ondansetron is effective via multiple routes, including oral; this is not the explanation for its lack of efficacy in motion sickness.","isCorrect":false},{"letter":"D","text":"Motion sickness is mediated by the vestibular system via M1 and H1 receptors, not the 5-HT3 receptors targeted by ondansetron","rationale":"Motion sickness works through a different signaling pathway (vestibular M1/H1 receptors) than the 5-HT3 pathway ondansetron targets, which is why 5-HT3 antagonists are not useful for motion sickness.","isCorrect":true},{"letter":"E","text":"Motion sickness requires a much higher dose of ondansetron than is typically prescribed","rationale":"This is not the taught explanation; the issue is that ondansetron targets the wrong pathway for motion sickness, not a dosing issue.","isCorrect":false}]},{"qnum":35,"module":"Module K, ILO 3","topic":"Motion sickness prophylaxis","bloom":"Apply","task":"Treatment selection","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient scheduled for a multi-day cruise wants a reliable, well-tolerated option to prevent motion sickness for the duration of the trip.","question":"Which of the following would be most appropriate?","correctLetter":"E","options":[{"letter":"A","text":"Meclizine, taken immediately after symptoms begin","rationale":"Meclizine should be taken 30-60 minutes before travel for prevention, not after symptoms begin.","isCorrect":false},{"letter":"B","text":"Ondansetron, taken daily throughout the cruise","rationale":"Ondansetron does not work for motion sickness, as it targets a different receptor pathway.","isCorrect":false},{"letter":"C","text":"Simethicone, taken before each meal","rationale":"Simethicone treats intestinal gas, not motion sickness.","isCorrect":false},{"letter":"D","text":"Loperamide, taken as needed for nausea","rationale":"Loperamide is an antidiarrheal and is not indicated for motion sickness.","isCorrect":false},{"letter":"E","text":"Scopolamine transdermal patch, applied behind the ear","rationale":"The scopolamine patch is excellent for sustained motion sickness prevention and is applied behind the ear, with replacement every 72 hours — well suited for a multi-day trip.","isCorrect":true}]},{"qnum":36,"module":"Module K, ILO 4","topic":"Lubiprostone sex-specific indication","bloom":"Apply","task":"Indication/special population","blueprint":"Indications for use","vignette":"A 45-year-old man with chronic idiopathic constipation asks about starting lubiprostone after seeing an advertisement mentioning its use for IBS with constipation.","question":"Which of the following is accurate regarding this medication?","correctLetter":"A","options":[{"letter":"A","text":"Lubiprostone's IBS-C indication is approved for women only, though its chronic idiopathic constipation indication applies to all adults","rationale":"Lubiprostone's IBS-C indication is specifically women-only, with no demonstrated efficacy in men for that indication, while its CIC indication covers all adults.","isCorrect":true},{"letter":"B","text":"Lubiprostone is equally effective for IBS-C in men and women","rationale":"This contradicts the taught sex-specific indication for IBS-C.","isCorrect":false},{"letter":"C","text":"Lubiprostone is contraindicated in men for any indication","rationale":"Lubiprostone's CIC indication applies to all adults, including men; only the IBS-C indication is women-only.","isCorrect":false},{"letter":"D","text":"Lubiprostone is FDA-approved for IBS-C in men over age 65 only","rationale":"This is not an accurate description of the taught indication.","isCorrect":false},{"letter":"E","text":"Lubiprostone's efficacy for IBS-C has not been studied in either sex","rationale":"Efficacy data specifically support use in women for the IBS-C indication.","isCorrect":false}]},{"qnum":37,"module":"Module K, ILO 4","topic":"Eluxadoline contraindication","bloom":"Analyze","task":"Contraindication","blueprint":"Contraindications","vignette":"A patient with IBS-D who has previously undergone cholecystectomy is being considered for eluxadoline.","question":"Which of the following is most important to consider before prescribing?","correctLetter":"B","options":[{"letter":"A","text":"Eluxadoline requires a functioning gallbladder only for optimal absorption, not safety","rationale":"This understates the risk — gallbladder absence is a safety contraindication, not merely an absorption concern.","isCorrect":false},{"letter":"B","text":"Eluxadoline is contraindicated in patients without a gallbladder due to increased risk of sphincter of Oddi spasm and pancreatitis","rationale":"Absence of a gallbladder is a specific contraindication for eluxadoline due to this serious risk; risk is further increased with more than 3 alcoholic drinks per day.","isCorrect":true},{"letter":"C","text":"Eluxadoline is safest in post-cholecystectomy patients due to reduced bile acid interaction","rationale":"This is the opposite of the taught contraindication.","isCorrect":false},{"letter":"D","text":"Eluxadoline dosing should simply be reduced by half in patients without a gallbladder","rationale":"Dose reduction is not the taught approach; absence of a gallbladder is a contraindication, not a dosing adjustment scenario.","isCorrect":false},{"letter":"E","text":"Gallbladder status has no bearing on eluxadoline safety or dosing","rationale":"Gallbladder status is a critical safety consideration for this medication.","isCorrect":false}]},{"qnum":38,"module":"Module K, ILO 4","topic":"Alosetron mechanism differentiation","bloom":"Understand","task":"Mechanism differentiation","blueprint":"Mechanism of action","vignette":"A patient asks why alosetron, a 5-HT3 receptor antagonist like ondansetron, is not used to treat her nausea but instead is prescribed for her severe diarrhea-predominant IBS.","question":"Which of the following best explains this difference?","correctLetter":"C","options":[{"letter":"A","text":"Alosetron has no significant affinity for 5-HT3 receptors","rationale":"Alosetron is still a 5-HT3 antagonist with affinity for the receptor; the distinction is location of action, not lack of affinity.","isCorrect":false},{"letter":"B","text":"Alosetron is metabolized to an inactive form before reaching the central nervous system","rationale":"This is not the taught mechanism for alosetron's selective GI action.","isCorrect":false},{"letter":"C","text":"Alosetron acts selectively on 5-HT3 receptors in the GI tract rather than the chemoreceptor trigger zone","rationale":"Alosetron does not act on the CTZ's 5-HT3 receptors the way ondansetron-class antiemetics do; it acts selectively on GI-tract 5-HT3 receptors, which is why it treats IBS-D rather than nausea/vomiting.","isCorrect":true},{"letter":"D","text":"Alosetron only works when combined with dexamethasone","rationale":"This combination is relevant to CINV regimens, a different drug class/indication, not alosetron.","isCorrect":false},{"letter":"E","text":"Alosetron requires activation by gastric acid, unlike ondansetron","rationale":"This is not the taught mechanism for alosetron's selective action.","isCorrect":false}]},{"qnum":39,"module":"Module K, ILO 4","topic":"Antispasmodic formulation selection","bloom":"Apply","task":"Treatment/formulation selection","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient with IBS experiences sudden, severe abdominal cramping episodes and has difficulty swallowing pills during an acute attack.","question":"Which of the following would best address her needs?","correctLetter":"D","options":[{"letter":"A","text":"Oral dicyclomine tablets","rationale":"This antispasmodic requires swallowing, which is difficult for this patient during an acute attack.","isCorrect":false},{"letter":"B","text":"Oral loperamide","rationale":"Loperamide treats diarrhea, not the acute cramping/spasm described.","isCorrect":false},{"letter":"C","text":"Rectal mesalamine suppository","rationale":"Mesalamine is used for inflammatory bowel disease, not IBS cramping.","isCorrect":false},{"letter":"D","text":"Sublingual hyoscyamine","rationale":"Hyoscyamine has a sublingual formulation that allows for faster onset without needing to swallow during an attack, making it well suited to this patient's needs.","isCorrect":true},{"letter":"E","text":"Oral amitriptyline","rationale":"Low-dose amitriptyline is used for chronic pain prevention, not acute attack relief, and requires swallowing a pill.","isCorrect":false}]},{"qnum":40,"module":"Module K, ILO 4","topic":"Low-dose TCA dosing rationale","bloom":"Understand","task":"Pharmacology/dosing rationale","blueprint":"Pharmacokinetics, pharmacogenomics, and pharmacodynamics","vignette":"A patient with IBS-D and chronic abdominal pain is started on amitriptyline 10 mg at bedtime. She asks whether this will also treat her underlying depression.","question":"Which of the following is the most accurate response?","correctLetter":"E","options":[{"letter":"A","text":"This is a standard antidepressant dose that will treat both conditions simultaneously","rationale":"This dose is specifically below the antidepressant threshold.","isCorrect":false},{"letter":"B","text":"This dose will only be effective for depression, not IBS pain","rationale":"This reverses the actual relationship — the low dose targets pain modulation, not depression.","isCorrect":false},{"letter":"C","text":"This medication requires combination with an SSRI to treat either condition","rationale":"No such combination requirement was taught for this use.","isCorrect":false},{"letter":"D","text":"This dose is used specifically to reduce colonic motility, unrelated to pain","rationale":"While anticholinergic effects may reduce stool frequency, the primary taught rationale for this low dose is pain modulation via neuromodulation.","isCorrect":false},{"letter":"E","text":"This dose is below the threshold needed for an antidepressant effect and is used instead for pain modulation","rationale":"Low-dose amitriptyline (e.g., 10 mg) is used off-label for chronic IBS pain via neuromodulation of visceral afferents; it is not high enough to treat depression.","isCorrect":true}]},{"qnum":41,"module":"Module K, ILO 4","topic":"First-line therapy for mild-moderate UC","bloom":"Apply","task":"Treatment","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A 30-year-old woman is newly diagnosed with mild-to-moderate ulcerative colitis limited to the rectosigmoid colon.","question":"Which of the following is the most appropriate initial pharmacologic therapy?","correctLetter":"A","options":[{"letter":"A","text":"Mesalamine","rationale":"5-ASAs such as mesalamine are first-line for induction and maintenance of remission in mild-moderate ulcerative colitis.","isCorrect":true},{"letter":"B","text":"Azathioprine","rationale":"This immunomodulator is for maintenance only, generally used after or alongside other therapy, not as initial mild-moderate UC treatment.","isCorrect":false},{"letter":"C","text":"Infliximab","rationale":"Biologics are reserved for moderate-severe disease, not first-line mild-moderate UC.","isCorrect":false},{"letter":"D","text":"Methotrexate","rationale":"Methotrexate is used for maintenance in Crohn disease specifically, not ulcerative colitis.","isCorrect":false},{"letter":"E","text":"Tofacitinib","rationale":"This JAK inhibitor is reserved for moderate-severe UC after biologic failure, not first-line mild disease.","isCorrect":false}]},{"qnum":42,"module":"Module K, ILO 4","topic":"Sulfasalazine adverse effect mechanism","bloom":"Analyze","task":"Adverse effect/pathophysiology","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient started on sulfasalazine for ulcerative colitis develops fever, rash, and hemolytic anemia.","question":"This reaction is most likely due to which component of the drug?","correctLetter":"B","options":[{"letter":"A","text":"Mesalamine","rationale":"Mesalamine is responsible for the therapeutic benefit, not the adverse effects, of sulfasalazine.","isCorrect":false},{"letter":"B","text":"Sulfapyridine","rationale":"Sulfasalazine is a prodrug cleaved by colonic bacteria into mesalamine, responsible for the therapeutic benefit, and sulfapyridine, responsible for most of the adverse effects, including the reaction described.","isCorrect":true},{"letter":"C","text":"The azo bond linking the two components","rationale":"The azo bond is cleaved by colonic bacteria to release the active components; it is not itself responsible for the described adverse effects.","isCorrect":false},{"letter":"D","text":"Balsalazide","rationale":"This is a different 5-ASA prodrug, not a component of sulfasalazine.","isCorrect":false},{"letter":"E","text":"5-aminosalicylic acid","rationale":"This is another name for mesalamine, which is responsible for the therapeutic benefit, not the adverse effects.","isCorrect":false}]},{"qnum":43,"module":"Module K, ILO 4, 8","topic":"Mesalamine-antacid interaction","bloom":"Apply","task":"Drug interaction/counseling","blueprint":"Drug interactions, including presentation and treatment","vignette":"A patient taking oral mesalamine for ulcerative colitis also uses an antacid occasionally for heartburn.","question":"Which counseling point is most appropriate?","correctLetter":"C","options":[{"letter":"A","text":"No separation is needed since mesalamine is unaffected by GI pH","rationale":"This contradicts the taught pH-sensitivity of mesalamine.","isCorrect":false},{"letter":"B","text":"The antacid should be taken at the same time to enhance mesalamine absorption","rationale":"Taking them together would worsen premature release, not enhance therapeutic effect at the colon.","isCorrect":false},{"letter":"C","text":"Separate the antacid from the mesalamine dose by about 2 hours, since raising GI pH can cause premature drug release","rationale":"Mesalamine release/absorption is pH-dependent; raising GI pH can cause the drug to release before reaching the colon, so antacid dosing should be separated by about 2 hours.","isCorrect":true},{"letter":"D","text":"This interaction only applies to rectal mesalamine formulations","rationale":"The pH-timing counseling point applies to oral mesalamine use, not specifically rectal formulations.","isCorrect":false},{"letter":"E","text":"Switch to balsalazide only if this interaction becomes symptomatic, otherwise no change is needed","rationale":"While balsalazide is not pH-affected, the appropriate immediate counseling for a patient already on mesalamine is dose separation, not waiting for symptoms.","isCorrect":false}]},{"qnum":44,"module":"Module K, ILO 4","topic":"Budesonide first-line indication","bloom":"Remember","task":"Treatment","blueprint":"Indications for use","vignette":"","question":"Which of the following corticosteroids is considered first-line to induce remission in Crohn disease due to its topical action and extensive first-pass hepatic metabolism?","correctLetter":"D","options":[{"letter":"A","text":"Prednisone","rationale":"Prednisone is the most common systemic oral steroid for IBD flares generally but is not the specifically taught first-line agent for inducing Crohn remission due to topical action/first-pass metabolism.","isCorrect":false},{"letter":"B","text":"Hydrocortisone","rationale":"Hydrocortisone is used systemically and rectally but is not the taught first-line topical-acting agent for Crohn remission.","isCorrect":false},{"letter":"C","text":"Methylprednisolone","rationale":"This is a systemic steroid option, not the taught topical-acting first-line agent for Crohn disease.","isCorrect":false},{"letter":"D","text":"Budesonide","rationale":"Budesonide is first-line to induce remission in Crohn disease, offering topical action with fewer systemic effects due to extensive first-pass metabolism.","isCorrect":true},{"letter":"E","text":"Dexamethasone","rationale":"Dexamethasone is primarily discussed in this course as an antiemetic adjunct, not the first-line IBD induction steroid.","isCorrect":false}]},{"qnum":45,"module":"Module K, ILO 4, 8","topic":"Budesonide formulation reasoning","bloom":"Analyze","task":"Pharmacokinetics/formulation reasoning","blueprint":"Pharmacokinetics, pharmacogenomics, and pharmacodynamics","vignette":"A gastroenterology resident asks why delayed-release budesonide is used for ileocecal Crohn disease when Crohn disease can affect the entire GI tract from mouth to anus.","question":"Which of the following best explains this?","correctLetter":"E","options":[{"letter":"A","text":"Budesonide is absorbed systemically and treats the entire GI tract regardless of release site","rationale":"Budesonide's action is topical/local at its release site, not systemic throughout the GI tract.","isCorrect":false},{"letter":"B","text":"Crohn disease only ever affects the terminal ileum, matching the drug's release site","rationale":"Crohn disease can affect any part of the GI tract from mouth to anus; the drug's release site is limited, not the disease's distribution.","isCorrect":false},{"letter":"C","text":"Delayed-release budesonide converts to a systemic steroid, unlike extended-release formulations","rationale":"No such conversion difference was taught; both formulations act topically, differing only in release location extent.","isCorrect":false},{"letter":"D","text":"The choice of delayed- vs. extended-release has no effect on where the drug acts in the colon","rationale":"This directly contradicts the taught distinction between the two formulations' release locations.","isCorrect":false},{"letter":"E","text":"Budesonide is only released in the lower GI tract regardless of formulation, so it targets the ileocecal region rather than the disease's full potential extent","rationale":"Budesonide (delayed- or extended-release) is only released in the lower GI tract; delayed-release targets a smaller ileocecal area, while extended-release covers more of the colon — but neither reaches the upper GI tract, so it is used where the drug can act, not where the disease necessarily extends.","isCorrect":true}]},{"qnum":46,"module":"Module K, ILO 4","topic":"Azathioprine pre-treatment screening","bloom":"Apply","task":"Monitoring/screening prior to therapy","blueprint":"Monitoring and follow-up of pharmacologic regimens","vignette":"A patient with Crohn disease is about to start azathioprine for maintenance of remission.","question":"Which of the following should be obtained before initiating therapy?","correctLetter":"A","options":[{"letter":"A","text":"TPMT (thiopurine methyltransferase) testing","rationale":"Screening for TPMT deficiency is required before starting azathioprine or 6-mercaptopurine, since deficient patients cannot adequately metabolize these purine analogs, risking toxicity.","isCorrect":true},{"letter":"B","text":"CYP2C19 genotype testing","rationale":"This is relevant to vonoprazan's minimal CYP2C19-dependent metabolism discussed elsewhere in the course, not to thiopurine screening.","isCorrect":false},{"letter":"C","text":"HLA-B*5701 testing","rationale":"This was not discussed in relation to azathioprine in this course.","isCorrect":false},{"letter":"D","text":"G6PD deficiency screening","rationale":"This was not discussed in relation to azathioprine in this course.","isCorrect":false},{"letter":"E","text":"Factor V Leiden testing","rationale":"This was not discussed in relation to azathioprine in this course.","isCorrect":false}]},{"qnum":47,"module":"Module K, ILO 4","topic":"Immunomodulator + biologic combination rationale","bloom":"Analyze","task":"Treatment rationale","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient with Crohn disease started on infliximab is also prescribed azathioprine.","question":"Which of the following best describes the rationale for this combination?","correctLetter":"B","options":[{"letter":"A","text":"Azathioprine and infliximab share the same mechanism, providing redundant coverage","rationale":"These drugs have different mechanisms (purine synthesis inhibition vs. TNF-alpha binding); the rationale is reducing immunogenicity, not redundant mechanism coverage.","isCorrect":false},{"letter":"B","text":"Azathioprine decreases the formation of antidrug antibodies against infliximab, helping maintain its effectiveness over time","rationale":"Combining an immunomodulator with infliximab decreases immunogenicity/antidrug antibody formation, which would otherwise reduce the biologic's effectiveness over time.","isCorrect":true},{"letter":"C","text":"Azathioprine reverses the immunosuppressive effects of infliximab to reduce infection risk","rationale":"The goal is to preserve/enhance infliximab's effect, not reverse its immunosuppressive action.","isCorrect":false},{"letter":"D","text":"Combination therapy is required before any biologic can be initiated","rationale":"No such universal requirement was taught.","isCorrect":false},{"letter
