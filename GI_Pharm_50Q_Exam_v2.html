monitoring","bloom":"Understand","task":"Adverse effect/monitoring","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient on long-term mesalamine for ulcerative colitis maintenance is due for routine labs.","question":"Which organ function should be specifically monitored due to a recognized 5-ASA adverse effect?","correctLetter":"E","options":[{"letter":"A","text":"Hepatic function, due to a risk of direct hepatotoxicity with mesalamine","rationale":"The specifically taught organ-toxicity concern for 5-ASAs is renal (interstitial nephritis), not primary hepatotoxicity.","isCorrect":false},{"letter":"B","text":"Thyroid function, due to a risk of mesalamine-induced hypothyroidism","rationale":"Thyroid dysfunction is not a recognized adverse effect of mesalamine taught in this course.","isCorrect":false},{"letter":"C","text":"Bone marrow function, due to a risk of mesalamine-induced pancytopenia","rationale":"Bone marrow suppression is a concern with thiopurines like azathioprine, not the specific taught concern for mesalamine.","isCorrect":false},{"letter":"D","text":"Cardiac function, due to a risk of mesalamine-induced cardiomyopathy","rationale":"This is not a recognized or taught adverse effect of mesalamine.","isCorrect":false},{"letter":"E","text":"Renal function, due to a risk of interstitial nephritis with mesalamine","rationale":"5-ASAs, including mesalamine, carry a risk of interstitial nephritis, so periodic renal function monitoring is recommended during long-term therapy.","isCorrect":true}]},{"qnum":46,"module":"Module K, ILO 4","topic":"Natalizumab PML risk vs. vedolizumab gut selectivity","bloom":"Analyze","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient asks why her provider chose vedolizumab over natalizumab for her Crohn disease, when both are integrin inhibitors.","question":"Which of the following best explains this choice?","correctLetter":"A","options":[{"letter":"A","text":"Natalizumab blocks both alpha4-beta1 and alpha4-beta7 integrins, carrying a risk of progressive multifocal leukoencephalopathy (PML) from impaired CNS immune surveillance, while vedolizumab's gut-selective action avoids this risk","rationale":"Natalizumab's broader integrin blockade affects lymphocyte trafficking into the central nervous system, carrying a boxed warning for PML; vedolizumab was specifically developed to be gut-selective, targeting only alpha4-beta7, avoiding this CNS-related risk.","isCorrect":true},{"letter":"B","text":"Natalizumab is less effective than vedolizumab for Crohn disease","rationale":"The key distinguishing factor taught is the difference in safety profile (PML risk) related to integrin selectivity, not a difference in general effectiveness.","isCorrect":false},{"letter":"C","text":"Vedolizumab requires no pre-treatment screening, while natalizumab does not require any either","rationale":"This does not address the actual taught distinction, which is CNS-related PML risk from natalizumab's broader integrin blockade.","isCorrect":false},{"letter":"D","text":"Natalizumab works only in ulcerative colitis, not Crohn disease","rationale":"This is not the taught distinction between these two integrin inhibitors; the key difference relates to integrin selectivity and PML risk.","isCorrect":false},{"letter":"E","text":"Vedolizumab and natalizumab carry an identical PML risk","rationale":"This is incorrect; vedolizumab's gut-selective mechanism is specifically designed to avoid the PML risk associated with natalizumab's broader integrin blockade.","isCorrect":false}]},{"qnum":47,"module":"Module K, ILO 4","topic":"JAK inhibitor infection/VTE risk","bloom":"Analyze","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient starting tofacitinib for ulcerative colitis asks about risks beyond the cardiovascular warning she already discussed with her provider.","question":"Which of the following additional risks should also be discussed?","correctLetter":"B","options":[{"letter":"A","text":"Increased risk of nephrogenic diabetes insipidus","rationale":"This is not a recognized or taught adverse effect of JAK inhibitors.","isCorrect":false},{"letter":"B","text":"Increased risk of serious infections, including herpes zoster reactivation, and venous thromboembolism","rationale":"In addition to the MACE risk, JAK inhibitors carry boxed warnings for serious infection (including herpes zoster reactivation) and venous thromboembolism, given their broad immunosuppressive and hematologic effects.","isCorrect":true},{"letter":"C","text":"Increased risk of hypertensive crisis specific to this drug class only","rationale":"This is not the primary additional risk taught for JAK inhibitors beyond MACE; infection and VTE risk are the specifically emphasized concerns.","isCorrect":false},{"letter":"D","text":"No additional risks beyond the cardiovascular warning are associated with this drug class","rationale":"JAK inhibitors carry additional boxed warnings for infection and thrombosis risk beyond the cardiovascular concern.","isCorrect":false},{"letter":"E","text":"Increased risk of hypothyroidism requiring routine thyroid panels","rationale":"This is not a taught adverse effect of JAK inhibitors in this course.","isCorrect":false}]},{"qnum":48,"module":"Module K, ILO 9","topic":"Corticosteroid tapering rationale","bloom":"Apply","task":"Patient counseling","blueprint":"Monitoring pharmacologic regimens and adjusting as appropriate","vignette":"A patient with a Crohn disease flare who has been on prednisone for 6 weeks feels much better and wants to simply stop taking it.","question":"Which of the following is the most appropriate counseling point?","correctLetter":"C","options":[{"letter":"A","text":"It is safe to stop the medication abruptly once symptoms improve","rationale":"This risks adrenal insufficiency after several weeks of therapy; a taper is required instead.","isCorrect":false},{"letter":"B","text":"The dose should be doubled for one additional week before stopping","rationale":"This is not the taught approach; a gradual downward taper, not a dose increase, is appropriate before discontinuation.","isCorrect":false},{"letter":"C","text":"The corticosteroid must be gradually tapered rather than stopped abruptly, to avoid adrenal insufficiency","rationale":"Prolonged corticosteroid use suppresses the hypothalamic-pituitary-adrenal axis; abrupt discontinuation after weeks of therapy risks adrenal insufficiency, so a gradual taper is required.","isCorrect":true},{"letter":"D","text":"Corticosteroids can be stopped abruptly as long as the patient feels well","rationale":"Feeling well does not eliminate the risk of adrenal insufficiency from abrupt discontinuation after prolonged use.","isCorrect":false},{"letter":"E","text":"Tapering is only necessary if the patient has been on therapy for more than one year","rationale":"The taught threshold for tapering concern is much shorter than one year; several weeks of therapy already warrants a gradual taper.","isCorrect":false}]},{"qnum":49,"module":"Module K, ILO 8","topic":"Enema vs. suppository selection by disease extent","bloom":"Analyze","task":"Prescribing/formulation selection","blueprint":"Drafting a prescription","vignette":"A patient has left-sided ulcerative colitis with inflammation extending proximally to the splenic flexure.","question":"Which formulation would provide more adequate mucosal coverage than a standard suppository alone?","correctLetter":"D","options":[{"letter":"A","text":"Mesalamine suppository alone","rationale":"A suppository's reach is largely limited to the rectum and would not adequately cover disease extending to the splenic flexure.","isCorrect":false},{"letter":"B","text":"Oral budesonide DR","rationale":"This formulation targets the ileocecal region and is not the taught choice for left-sided colitis requiring topical rectal coverage.","isCorrect":false},{"letter":"C","text":"IV methylprednisolone","rationale":"IV systemic steroids are reserved for severe or hospitalized flares, not the taught first approach for topical coverage of left-sided disease.","isCorrect":false},{"letter":"D","text":"Mesalamine enema","rationale":"A suppository provides coverage limited to the rectum, whereas an enema reaches further proximally, making it more appropriate for disease extending to the splenic flexure than a suppository alone.","isCorrect":true},{"letter":"E","text":"Oral azathioprine","rationale":"This is a systemic maintenance immunomodulator, not a formulation choice for direct topical mucosal coverage.","isCorrect":false}]},{"qnum":50,"module":"Module K, ILO 9","topic":"IBD medication adherence during remission","bloom":"Apply","task":"Patient counseling","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient with ulcerative colitis in remission on maintenance mesalamine tells her provider she feels great and wants to stop taking her medication since she has no symptoms.","question":"Which of the following is the most appropriate counseling point?","correctLetter":"E","options":[{"letter":"A","text":"It is safe to stop maintenance therapy once symptoms resolve for at least one month","rationale":"Symptom resolution reflects treatment effectiveness, not disease resolution; the taught approach is to continue maintenance therapy, not stop it based on symptom-free duration.","isCorrect":false},{"letter":"B","text":"Maintenance therapy can be switched to an as-needed dosing schedule once in remission","rationale":"This is not the taught approach for maintenance IBD therapy, which is meant to be continued consistently to sustain remission.","isCorrect":false},{"letter":"C","text":"Stopping maintenance therapy has no impact on future flare risk","rationale":"This contradicts the taught relationship between maintenance therapy adherence and reduced flare risk.","isCorrect":false},{"letter":"D","text":"The medication should be stopped and only restarted if two flares occur within a year","rationale":"This is not the taught approach; continuous maintenance therapy is recommended to prevent flares in the first place, not restarted reactively after repeated flares.","isCorrect":false},{"letter":"E","text":"Maintenance therapy should be continued even during remission, as stopping increases the risk of relapse","rationale":"Feeling well on maintenance therapy reflects the medication's effectiveness, not resolution of the underlying disease; stopping maintenance therapy during remission is associated with an increased risk of flare and, for some biologics, increased risk of antidrug antibody formation if restarted later.","isCorrect":true}]}];
const TOTAL = 50;
const state = {}; // qnum -> { selected: letter|null, struck: Set, answered: bool }

QUESTIONS.forEach(q => { state[q.qnum] = { selected: null, struck: new Set(), answered: false }; });

const root = document.getElementById("examRoot");
const jumpnav = document.getElementById("jumpnav");

function render() {
  root.innerHTML = "";
  jumpnav.innerHTML = "";
  QUESTIONS.forEach(q => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "q" + q.qnum;

    const metaRow = document.createElement("div");
    metaRow.className = "meta-row";
    const topicSpan = document.createElement("span");
    topicSpan.className = "topic-tag locked";
    topicSpan.textContent = "Topic revealed after you answer";
    topicSpan.id = "topic" + q.qnum;
    metaRow.innerHTML = `<span class="qnum-badge">Q${q.qnum}</span>`;
    metaRow.appendChild(topicSpan);
    card.appendChild(metaRow);

    if (q.vignette) {
      const v = document.createElement("div");
      v.className = "vignette";
      v.textContent = q.vignette;
      card.appendChild(v);
    }

    const qt = document.createElement("div");
    qt.className = "question-text";
    qt.textContent = q.question;
    card.appendChild(qt);

    q.options.forEach(opt => {
      const row = document.createElement("div");
      row.className = "option-row";
      row.dataset.letter = opt.letter;

      const letterEl = document.createElement("div");
      letterEl.className = "opt-letter";
      letterEl.textContent = opt.letter;

      const textEl = document.createElement("div");
      textEl.className = "opt-text";
      textEl.textContent = opt.text;
      textEl.addEventListener("click", () => selectAnswer(q.qnum, opt.letter));

      const strikeBtn = document.createElement("button");
      strikeBtn.className = "strike-btn";
      strikeBtn.type = "button";
      strikeBtn.textContent = "strike";
      strikeBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleStrike(q.qnum, opt.letter); });

      row.appendChild(letterEl);
      row.appendChild(textEl);
      row.appendChild(strikeBtn);
      card.appendChild(row);
    });

    const submitRow = document.createElement("div");
    submitRow.className = "submit-q-row";
    const submitBtn = document.createElement("button");
    submitBtn.className = "submit-q-btn";
    submitBtn.type = "button";
    submitBtn.textContent = "Submit Answer";
    submitBtn.disabled = true;
    submitBtn.id = "submitq" + q.qnum;
    submitBtn.addEventListener("click", () => submitQuestion(q.qnum));
    const hint = document.createElement("span");
    hint.className = "submit-q-hint";
    hint.textContent = "Select an option above, then submit to see the rationale.";
    hint.id = "hint" + q.qnum;
    submitRow.appendChild(submitBtn);
    submitRow.appendChild(hint);
    card.appendChild(submitRow);

    const rat = document.createElement("div");
    rat.className = "rationale-block";
    card.appendChild(rat);

    const metaFoot = document.createElement("div");
    metaFoot.className = "meta-footer";
    metaFoot.innerHTML = `<span><b>Bloom:</b> ${q.bloom}</span><span><b>Task:</b> ${escapeHtml(q.task)}</span><span><b>Blueprint:</b> ${escapeHtml(q.blueprint)}</span><span><b>Source:</b> ${escapeHtml(q.module)} — ${escapeHtml(q.topic)}</span>`;
    card.appendChild(metaFoot);

    root.appendChild(card);

    const jn = document.createElement("a");
    jn.href = "#q" + q.qnum;
    jn.textContent = q.qnum;
    jn.id = "jn" + q.qnum;
    jumpnav.appendChild(jn);
  });
  refreshCardUI();
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function selectAnswer(qnum, letter) {
  const st = state[qnum];
  if (st.answered) return;
  st.selected = (st.selected === letter) ? null : letter;
  refreshCardUI(qnum);
  document.getElementById("submitq" + qnum).disabled = !st.selected;
}

function toggleStrike(qnum, letter) {
  const st = state[qnum];
  if (st.answered) return;
  if (st.struck.has(letter)) st.struck.delete(letter); else st.struck.add(letter);
  refreshCardUI(qnum);
}

function refreshCardUI(onlyQnum) {
  const list = onlyQnum ? [onlyQnum] : QUESTIONS.map(q => q.qnum);
  list.forEach(qnum => {
    const st = state[qnum];
    const card = document.getElementById("q" + qnum);
    const rows = card.querySelectorAll(".option-row");
    rows.forEach(row => {
      const letter = row.dataset.letter;
      const textEl = row.querySelector(".opt-text");
      const strikeBtn = row.querySelector(".strike-btn");
      row.classList.toggle("selected", st.selected === letter);
      textEl.classList.toggle("struck", st.struck.has(letter));
      strikeBtn.classList.toggle("active", st.struck.has(letter));
    });
  });
}

function submitQuestion(qnum) {
  const st = state[qnum];
  if (st.answered || !st.selected) return;
  st.answered = true;

  const q = QUESTIONS.find(x => x.qnum === qnum);
  const card = document.getElementById("q" + qnum);
  card.classList.add("answered");

  // reveal topic
  const topicSpan = document.getElementById("topic" + qnum);
  topicSpan.textContent = q.topic;
  topicSpan.classList.remove("locked");
  topicSpan.classList.add("revealed");

  const isCorrect = st.selected === q.correctLetter;

  const rows = card.querySelectorAll(".option-row");
  const ratBlock = card.querySelector(".rationale-block");
  let ratHtml = "";
  rows.forEach(row => {
    const letter = row.dataset.letter;
    const opt = q.options.find(o => o.letter === letter);
    if (opt.isCorrect) row.classList.add("correct-answer");
    if (st.selected === letter && !opt.isCorrect) row.classList.add("chosen-wrong");
    if (opt.isCorrect) {
      row.querySelector(".opt-text").insertAdjacentHTML("beforeend", ' <span class="result-icon correct">✓ CORRECT</span>');
      ratHtml += `<div class="r-line"><b class="correct-label">Why ${letter} is correct:</b> ${escapeHtml(opt.rationale)}</div>`;
    } else {
      if (st.selected === letter) {
        row.querySelector(".opt-text").insertAdjacentHTML("beforeend", ' <span class="result-icon wrong">✗ your answer</span>');
      }
      ratHtml += `<div class="r-line"><b class="wrong-label">Why ${letter} is wrong:</b> ${escapeHtml(opt.rationale)}</div>`;
    }
  });
  ratBlock.innerHTML = ratHtml;

  const jn = document.getElementById("jn" + qnum);
  jn.classList.remove("jn-answered");
  jn.classList.add(isCorrect ? "jn-correct" : "jn-wrong");

  updateStats();
}

function updateStats() {
  const answeredList = Object.values(state).filter(s => s.answered);
  const answeredCount = answeredList.length;
  const correctCount = answeredList.filter(s => {
    const q = QUESTIONS.find(x => state[x.qnum] === s);
    return s.selected === q.correctLetter;
  }).length;

  document.getElementById("answeredPill").textContent = answeredCount + " / " + TOTAL + " answered";
  document.getElementById("progressBar").style.width = (answeredCount / TOTAL * 100) + "%";

  const scorePill = document.getElementById("scorePill");
  if (answeredCount > 0) {
    scorePill.style.display = "inline-block";
    const pct = Math.round(correctCount / answeredCount * 100);
    scorePill.textContent = "Score so far: " + correctCount + " / " + answeredCount + " (" + pct + "%)";
  }

  const banner = document.getElementById("scoreBanner");
  if (answeredCount === TOTAL) {
    const byBloom = {};
    QUESTIONS.forEach(q => {
      const s = state[q.qnum];
      byBloom[q.bloom] = byBloom[q.bloom] || { correct: 0, total: 0 };
      byBloom[q.bloom].total++;
      if (s.selected === q.correctLetter) byBloom[q.bloom].correct++;
    });
    const pct = Math.round(correctCount / TOTAL * 100);
    const bloomSummary = Object.keys(byBloom).sort().map(b => {
      const v = byBloom[b];
      return b + ": " + v.correct + "/" + v.total;
    }).join("   ·   ");
    banner.style.display = "block";
    banner.classList.add("finished");
    banner.innerHTML = `🎉 Exam complete — you scored ${correctCount} / ${TOTAL} (${pct}%)` +
      `<div class="sb-sub">By Bloom level — ${bloomSummary}</div>` +
      `<div class="sb-sub">Use the number grid above to jump back to any question and re-read its rationale (green = correct, red = missed).</div>`;
  } else if (answeredCount > 0) {
    banner.style.display = "block";
    banner.classList.remove("finished");
    banner.innerHTML = `In progress — ${correctCount} / ${answeredCount} correct so far` +
      `<div class="sb-sub">${TOTAL - answeredCount} question${TOTAL - answeredCount === 1 ? "" : "s"} left to go.</div>`;
  }
}

render();
</script>
</body>
</html>
