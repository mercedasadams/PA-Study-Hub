<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GI Pharmacology — 50-Question PANCE-Style Exam (Version 2)</title>
<style>
  :root {
    --navy: #1F3864;
    --teal: #0E7C7B;
    --gold: #B7791F;
    --red: #B00020;
    --green: #1E7A3D;
    --light: #EAF1F8;
    --bg: #F6F8FB;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Calibri, system-ui, sans-serif;
    background: linear-gradient(180deg, #eef3fa 0%, var(--bg) 320px);
    margin: 0;
    padding: 0 0 80px;
    color: #1a1a1a;
  }
  header.top {
    background: linear-gradient(120deg, var(--navy), #2c4a7c);
    color: white;
    padding: 28px 24px 22px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  header.top h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.3px; }
  header.top .sub { opacity: 0.9; font-size: 14px; }
  header.top .emoji { font-size: 28px; margin-right: 6px; }

  .statbar {
    position: sticky; top: 0; z-index: 50;
    background: white;
    border-bottom: 2px solid var(--light);
    padding: 10px 20px;
    display: flex; gap: 18px; align-items: center; justify-content: center;
    flex-wrap: wrap;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .pill {
    background: var(--light); color: var(--navy); padding: 6px 14px;
    border-radius: 999px; font-weight: 600;
  }
  .pill.gold { background: #FFF3DA; color: #7a5209; }
  .pill.green { background: #E4F6E8; color: var(--green); }
  #progressBarWrap { flex: 1 1 220px; max-width: 320px; height: 10px; background: var(--light); border-radius: 6px; overflow: hidden; }
  #progressBar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal), var(--navy)); transition: width .25s; }

  main { max-width: 880px; margin: 0 auto; padding: 24px 18px; }

  .jumpnav {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-bottom: 26px;
  }
  .jumpnav a {
    display: block; text-align: center; padding: 6px 0; font-size: 12px;
    border-radius: 6px; background: white; border: 1px solid #dde5ef;
    color: var(--navy); text-decoration: none; font-weight: 600;
  }
  .jumpnav a.jn-answered { background: var(--light); border-color: var(--teal); }
  .jumpnav a.jn-correct { background: #E4F6E8; border-color: var(--green); color: var(--green); }
  .jumpnav a.jn-wrong { background: #FBE7EA; border-color: var(--red); color: var(--red); }

  .card {
    background: white;
    border-radius: 14px;
    padding: 20px 22px 16px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(20,40,80,0.07);
    border: 1px solid #e7edf5;
    scroll-margin-top: 70px;
  }
  .card.answered { border-color: #d7e0ee; }
  .card .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; flex-wrap: wrap; gap: 6px;
  }
  .qnum-badge {
    background: var(--navy); color: white; font-weight: 800; font-size: 13px;
    padding: 4px 12px; border-radius: 999px;
  }
  .topic-tag { font-size: 12px; color: #9aa5b3; font-style: italic; }
  .topic-tag.locked::before { content: "🔒 "; }
  .topic-tag.revealed { color: #6b7a90; }
  .topic-tag.revealed::before { content: ""; }

  .vignette {
    background: var(--light);
    border-left: 4px solid var(--navy);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .question-text { font-weight: 600; margin: 6px 0 14px; font-size: 15px; line-height: 1.45; }

  .option-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid #dfe6ef; border-radius: 9px; padding: 9px 12px;
    margin-bottom: 8px; transition: background .15s, border-color .15s;
  }
  .option-row:not(.disabled-hover):hover { background: #f5f9ff; border-color: var(--teal); }
  .opt-letter {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    background: var(--navy); color: white; font-weight: 700; font-size: 12.5px;
    display: flex; align-items: center; justify-content: center;
  }
  .opt-text { flex: 1; cursor: pointer; font-size: 14.5px; line-height: 1.4; }
  .opt-text.struck { text-decoration: line-through; color: #9aa5b3; }
  .strike-btn {
    flex: 0 0 auto; font-size: 11px; border: 1px solid #c9d3e0; background: white;
    color: #5a6675; border-radius: 6px; padding: 4px 8px; cursor: pointer;
  }
  .strike-btn:hover { background: #eef2f7; }
  .strike-btn.active { background: #fdeeee; border-color: var(--red); color: var(--red); }

  .option-row.selected { border-color: var(--teal); background: #eefaf8; }
  .option-row.selected .opt-letter { background: var(--teal); }

  .submit-q-row { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .submit-q-btn {
    background: var(--teal); color: white; border: none; padding: 8px 20px;
    border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13.5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .submit-q-btn:hover { background: #0a5f5e; }
  .submit-q-btn:disabled { background: #c3cad4; cursor: not-allowed; box-shadow: none; }
  .submit-q-hint { font-size: 12px; color: #9aa5b3; }
  .card.answered .submit-q-row { display: none; }

  /* Post-answer review coloring (per question) */
  .card.answered .option-row.correct-answer { border-color: var(--green); background: #eef9f0; }
  .card.answered .option-row.correct-answer .opt-letter { background: var(--green); }
  .card.answered .option-row.chosen-wrong { border-color: var(--red); background: #fdeeee; }
  .card.answered .option-row.chosen-wrong .opt-letter { background: var(--red); }
  .card.answered .opt-text { cursor: default; }
  .card.answered .strike-btn { display: none; }

  .result-icon { font-size: 13px; font-weight: 800; margin-left: 6px; }
  .result-icon.correct { color: var(--green); }
  .result-icon.wrong { color: var(--red); }

  .rationale-block {
    display: none;
    margin-top: 12px;
    background: #fbfbfb;
    border: 1px dashed #cfd8e3;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .card.answered .rationale-block { display: block; }
  .rationale-block .r-line { margin-bottom: 6px; }
  .rationale-block .r-line:last-child { margin-bottom: 0; }
  .rationale-block b.correct-label { color: var(--green); }
  .rationale-block b.wrong-label { color: var(--red); }

  .meta-footer {
    display: none;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #eef1f5;
    font-size: 11.5px; color: #7a8698; gap: 14px; flex-wrap: wrap;
  }
  .card.answered .meta-footer { display: flex; }
  .meta-footer span b { color: #4c5a70; }

  #scoreBanner {
    display: none;
    position: sticky; top: 54px; z-index: 40;
    margin: 0 auto 20px; max-width: 880px;
    background: linear-gradient(120deg, var(--gold), #d9a441);
    color: white; text-align: center; padding: 14px 20px; border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    font-weight: 700; font-size: 16px;
  }
  #scoreBanner.finished { background: linear-gradient(120deg, var(--green), #2e9e5b); }
  #scoreBanner .sb-sub { font-weight: 500; font-size: 12.5px; margin-top: 4px; opacity: 0.95; }

  footer.pagefoot { text-align: center; color: #93a0b2; font-size: 12px; margin-top: 30px; }
</style>
</head>

<script>
const QUESTIONS = [{"qnum":1,"module":"Module K, ILO 9","topic":"PPI administration timing","bloom":"Apply","task":"Patient counseling","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient newly prescribed omeprazole for GERD asks when she should take her daily dose.","question":"Which of the following is the most appropriate counseling point?","correctLetter":"A","options":[{"letter":"A","text":"Take the dose 30-60 minutes before the first meal of the day","rationale":"PPIs are prodrugs that require activation in actively secreting parietal cells; taking the dose 30-60 minutes before eating maximizes the number of pumps available for irreversible binding, producing the greatest acid-suppressing effect.","isCorrect":true},{"letter":"B","text":"Take the dose at bedtime on an empty stomach","rationale":"This does not align with peak parietal cell pump activation around a meal, and is not the taught administration counseling.","isCorrect":false},{"letter":"C","text":"Take the dose immediately after eating a large meal","rationale":"Taking the dose after eating misses the window of maximal pump activation that dosing before a meal provides.","isCorrect":false},{"letter":"D","text":"Take the dose with an antacid to enhance activation","rationale":"PPIs do not require an antacid for activation; they are activated by the parietal cell's own acidic environment.","isCorrect":false},{"letter":"E","text":"Timing does not matter as long as it is taken once daily","rationale":"Timing relative to meals is specifically taught as important for maximizing PPI effectiveness.","isCorrect":false}]},{"qnum":2,"module":"Module K, ILO 1","topic":"Aluminum vs. magnesium antacid GI effects","bloom":"Understand","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"","question":"A patient switches from a magnesium hydroxide antacid to an aluminum hydroxide antacid because the magnesium product was causing diarrhea. Which adverse effect should she now be counseled to expect from the aluminum-containing product?","correctLetter":"B","options":[{"letter":"A","text":"Diarrhea","rationale":"Diarrhea is the effect associated with magnesium, not aluminum, antacids.","isCorrect":false},{"letter":"B","text":"Constipation","rationale":"Aluminum-containing antacids are classically associated with constipation, while magnesium-containing antacids are associated with diarrhea — an inverse relationship taught for these two antacid cations.","isCorrect":true},{"letter":"C","text":"Hypermagnesemia","rationale":"This is a magnesium-specific concern and would not occur with an aluminum-only product.","isCorrect":false},{"letter":"D","text":"Metabolic alkalosis","rationale":"This is more classically associated with sodium bicarbonate-containing antacids, not aluminum hydroxide.","isCorrect":false},{"letter":"E","text":"Increased gastric acid secretion (acid rebound)","rationale":"Acid rebound is not the taught hallmark adverse effect of aluminum hydroxide.","isCorrect":false}]},{"qnum":3,"module":"Module K, ILO 1","topic":"Milk-alkali syndrome","bloom":"Analyze","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A 70-year-old woman who has been taking calcium carbonate tablets throughout the day for chronic heartburn presents with nausea, confusion, and is found to have hypercalcemia, metabolic alkalosis, and acute kidney injury.","question":"Which of the following is the most likely explanation for her presentation?","correctLetter":"C","options":[{"letter":"A","text":"Magnesium toxicity from her antacid","rationale":"Her antacid is calcium-, not magnesium-, based, and the described triad (hypercalcemia, alkalosis, AKI) is specific to milk-alkali syndrome, not hypermagnesemia.","isCorrect":false},{"letter":"B","text":"Aluminum toxicity from her antacid","rationale":"Aluminum toxicity is not associated with hypercalcemia and metabolic alkalosis; it is not the explanation for this presentation.","isCorrect":false},{"letter":"C","text":"Milk-alkali syndrome from excessive calcium carbonate intake","rationale":"The triad of hypercalcemia, metabolic alkalosis, and renal insufficiency in a patient taking large amounts of calcium carbonate is characteristic of milk-alkali syndrome, a recognized risk of excessive calcium-containing antacid use.","isCorrect":true},{"letter":"D","text":"Acute PPI-induced nephritis","rationale":"She is taking calcium carbonate, not a PPI, and PPI-associated nephritis does not typically present with hypercalcemia and metabolic alkalosis.","isCorrect":false},{"letter":"E","text":"Expected, benign effect of calcium carbonate requiring no action","rationale":"This presentation reflects a serious, recognized toxicity, not a benign expected effect.","isCorrect":false}]},{"qnum":4,"module":"Module K, ILO 1","topic":"Sodium bicarbonate antacid caution","bloom":"Apply","task":"Special population/contraindication","blueprint":"Special populations requiring drug/dose modification","vignette":"A 66-year-old man with heart failure and a sodium-restricted diet asks about using an OTC antacid for occasional heartburn.","question":"Which of the following antacid ingredients should he be counseled to avoid?","correctLetter":"D","options":[{"letter":"A","text":"Calcium carbonate","rationale":"Calcium carbonate does not carry the same sodium-load concern that sodium bicarbonate does.","isCorrect":false},{"letter":"B","text":"Aluminum hydroxide","rationale":"Aluminum hydroxide does not carry a significant sodium load.","isCorrect":false},{"letter":"C","text":"Magnesium hydroxide","rationale":"Magnesium hydroxide does not carry a significant sodium load.","isCorrect":false},{"letter":"D","text":"Sodium bicarbonate","rationale":"Sodium bicarbonate-containing antacids carry a significant sodium load and are systemically absorbed, making them inappropriate for patients on sodium-restricted diets or with heart failure.","isCorrect":true},{"letter":"E","text":"Simethicone","rationale":"Simethicone is an anti-gas agent, not a sodium-containing antacid, and carries no such caution.","isCorrect":false}]},{"qnum":5,"module":"Module K, ILO 2","topic":"H2RA vs. PPI onset/duration","bloom":"Understand","task":"Pharmacology comparison","blueprint":"Pharmacokinetics, pharmacogenomics, and pharmacodynamics","vignette":"A patient wants fast relief for an isolated episode of heartburn happening right now, rather than a medication that builds to full effect over several days.","question":"Which class of acid suppressant would provide more rapid onset of relief in this situation?","correctLetter":"E","options":[{"letter":"A","text":"Proton pump inhibitors","rationale":"PPIs take days to reach their full acid-suppressing effect, making them less suited to immediate relief of a single acute episode.","isCorrect":false},{"letter":"B","text":"Potassium-competitive acid blockers taken as a loading dose only","rationale":"This is not the taught first-line approach for immediate, isolated symptom relief in this course.","isCorrect":false},{"letter":"C","text":"Sucralfate","rationale":"Sucralfate is a mucosal protectant for ulcer healing, not a rapid-onset acid suppressant for isolated heartburn.","isCorrect":false},{"letter":"D","text":"Misoprostol","rationale":"Misoprostol is used for NSAID-ulcer prevention, not for rapid relief of an acute heartburn episode.","isCorrect":false},{"letter":"E","text":"H2 receptor antagonists","rationale":"H2 receptor antagonists have a more rapid onset of action (often within 30-60 minutes) compared to PPIs, which require several days of dosing to reach maximal acid suppression as more proton pumps are progressively inactivated.","isCorrect":true}]},{"qnum":6,"module":"Module K, ILO 1","topic":"PPI effect on absorption of other drugs","bloom":"Analyze","task":"Drug interaction","blueprint":"Drug interactions, including presentation and treatment","vignette":"A patient with HIV on an antiretroviral regimen that requires an acidic environment for adequate absorption is started on omeprazole for GERD.","question":"Which of the following best describes the concern with this combination?","correctLetter":"A","options":[{"letter":"A","text":"Reduced gastric acidity from the PPI may decrease absorption of the pH-dependent antiretroviral","rationale":"Because PPIs substantially raise gastric pH, they can impair the dissolution and absorption of certain drugs (classically azole antifungals and some antiretrovirals) that require an acidic environment to be absorbed.","isCorrect":true},{"letter":"B","text":"The PPI will increase absorption of the antiretroviral, risking toxicity","rationale":"The concern with acid suppression and pH-dependent drugs is reduced, not increased, absorption.","isCorrect":false},{"letter":"C","text":"This combination has no clinically relevant interaction","rationale":"This is a recognized, clinically relevant interaction requiring consideration of timing or an alternative acid suppressant.","isCorrect":false},{"letter":"D","text":"The antiretroviral will inactivate the PPI's mechanism of action","rationale":"This does not describe the taught direction of this interaction, which centers on pH-dependent absorption of the other drug.","isCorrect":false},{"letter":"E","text":"The interaction only matters if the PPI is given intravenously","rationale":"The absorption concern applies to oral PPI dosing, since it is the resulting rise in gastric pH that affects the other drug's absorption.","isCorrect":false}]},{"qnum":7,"module":"Module K, ILO 1, 6","topic":"GERD alarm symptoms requiring workup","bloom":"Apply","task":"Diagnostic testing","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A 58-year-old man reports several months of heartburn along with new difficulty swallowing solid food and a 12-pound unintentional weight loss.","question":"Which of the following is the most appropriate next step?","correctLetter":"B","options":[{"letter":"A","text":"Start empiric PPI therapy and reassess symptoms in 8 weeks","rationale":"This approach is appropriate for uncomplicated GERD without alarm symptoms, not when dysphagia and weight loss are present.","isCorrect":false},{"letter":"B","text":"Refer for upper endoscopy rather than starting empiric PPI therapy alone","rationale":"Dysphagia and unintentional weight loss are alarm symptoms that warrant endoscopic evaluation to rule out stricture, esophagitis, or malignancy, rather than proceeding with empiric medical therapy alone.","isCorrect":true},{"letter":"C","text":"Recommend an OTC antacid as needed","rationale":"This under-treats a presentation with alarm symptoms that require further workup.","isCorrect":false},{"letter":"D","text":"Increase dietary fiber and reassess in one month","rationale":"This does not address the need for prompt evaluation of alarm symptoms.","isCorrect":false},{"letter":"E","text":"Add an H2 receptor antagonist to antacids without further workup","rationale":"This escalates acid-suppression therapy without addressing the need for endoscopic evaluation given the alarm symptoms.","isCorrect":false}]},{"qnum":8,"module":"Module K, ILO 1","topic":"Combination magnesium/aluminum antacid rationale","bloom":"Understand","task":"Pharmacology rationale","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"","question":"Many OTC antacid products combine magnesium hydroxide and aluminum hydroxide in a single formulation. What is the primary rationale for this combination?","correctLetter":"C","options":[{"letter":"A","text":"To increase the total acid-neutralizing capacity beyond what either agent could achieve alone","rationale":"This is not the primary rationale taught for the combination; the key reason is balancing bowel effects, not maximizing neutralizing capacity.","isCorrect":false},{"letter":"B","text":"To reduce the risk of milk-alkali syndrome","rationale":"Milk-alkali syndrome is specifically associated with calcium carbonate, not magnesium/aluminum combinations.","isCorrect":false},{"letter":"C","text":"To offset the opposing GI motility effects of each ingredient (magnesium's diarrhea and aluminum's constipation)","rationale":"Combining magnesium hydroxide (which tends to cause diarrhea) with aluminum hydroxide (which tends to cause constipation) helps balance out these opposing bowel effects, improving tolerability.","isCorrect":true},{"letter":"D","text":"To allow for less frequent dosing than either ingredient alone","rationale":"Dosing frequency was not the taught rationale for combining these two ingredients.","isCorrect":false},{"letter":"E","text":"To reduce systemic sodium load in patients with heart failure","rationale":"Sodium load is a concern specific to sodium bicarbonate, not magnesium or aluminum hydroxide.","isCorrect":false}]},{"qnum":9,"module":"Module K, ILO 1","topic":"H. pylori regimen in penicillin allergy","bloom":"Apply","task":"Special population","blueprint":"Special populations requiring drug/dose modification","vignette":"A patient with a documented severe penicillin allergy requires treatment for a newly diagnosed H. pylori infection.","question":"Which of the following is the most appropriate approach to regimen selection?","correctLetter":"D","options":[{"letter":"A","text":"Use standard amoxicillin-containing triple therapy at a reduced dose","rationale":"Reducing the dose of a drug the patient is allergic to does not eliminate the allergy risk; amoxicillin should be avoided altogether.","isCorrect":false},{"letter":"B","text":"Desensitize the patient to penicillin prior to any H. pylori treatment","rationale":"This is not the taught first-line approach when an amoxicillin-free regimen (bismuth quadruple therapy) is readily available.","isCorrect":false},{"letter":"C","text":"Treat with a proton pump inhibitor alone, omitting antibiotics","rationale":"PPI monotherapy does not eradicate H. pylori; antibiotic therapy is required.","isCorrect":false},{"letter":"D","text":"Use bismuth quadruple therapy, which does not include amoxicillin","rationale":"Bismuth quadruple therapy (PPI, bismuth subsalicylate, metronidazole, and tetracycline) avoids amoxicillin entirely, making it an appropriate choice for a patient with a penicillin allergy.","isCorrect":true},{"letter":"E","text":"Substitute amoxicillin with a cephalosporin, which carries no cross-reactivity risk","rationale":"Cephalosporins can carry cross-reactivity risk with penicillin allergy and are not the taught substitution for this scenario.","isCorrect":false}]},{"qnum":10,"module":"Module K, ILO 1","topic":"H. pylori salvage therapy","bloom":"Apply","task":"Treatment","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient completed bismuth quadruple therapy for H. pylori infection but a urea breath test 4 weeks later confirms persistent infection.","question":"Which of the following is most appropriate for salvage therapy?","correctLetter":"E","options":[{"letter":"A","text":"Repeat the identical bismuth quadruple regimen for a second 14-day course","rationale":"Repeating the same failed regimen does not address likely antibiotic resistance and is not the taught salvage approach.","isCorrect":false},{"letter":"B","text":"Discontinue treatment, since a second course carries no benefit","rationale":"Salvage therapy with a different regimen is the taught next step, not treatment discontinuation.","isCorrect":false},{"letter":"C","text":"Switch to H2 receptor antagonist monotherapy","rationale":"H2 receptor antagonists are not used for H. pylori eradication at any stage of therapy.","isCorrect":false},{"letter":"D","text":"Add a fifth antibiotic to the original regimen without changing agents","rationale":"This is not the taught salvage strategy; changing to different antibiotic classes is the recommended approach.","isCorrect":false},{"letter":"E","text":"A levofloxacin-based or rifabutin-based regimen","rationale":"After failure of an initial regimen, salvage therapy using a different antibiotic class — such as a levofloxacin-based or rifabutin-based regimen — is the taught approach to avoid antibiotics the organism has already been exposed to.","isCorrect":true}]},{"qnum":11,"module":"Module K, ILO 1","topic":"Misoprostol mechanism","bloom":"Remember","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Which of the following best describes the mechanism of action of misoprostol in preventing NSAID-induced ulcers?","correctLetter":"A","options":[{"letter":"A","text":"It is a prostaglandin E1 analog that increases gastric mucus and bicarbonate secretion while decreasing acid secretion","rationale":"Misoprostol replaces the protective prostaglandins that NSAIDs suppress via COX inhibition, restoring mucosal defense (mucus/bicarbonate) while also modestly reducing acid output.","isCorrect":true},{"letter":"B","text":"It irreversibly inhibits the H+/K+ ATPase on the parietal cell","rationale":"This describes the PPI mechanism, not misoprostol.","isCorrect":false},{"letter":"C","text":"It competitively blocks histamine at the H2 receptor","rationale":"This describes H2 receptor antagonists, not misoprostol.","isCorrect":false},{"letter":"D","text":"It binds ulcer craters to form a protective barrier","rationale":"This describes sucralfate's mechanism, not misoprostol's.","isCorrect":false},{"letter":"E","text":"It eradicates H. pylori through direct antibacterial activity","rationale":"Misoprostol has no antibacterial activity against H. pylori.","isCorrect":false}]},{"qnum":12,"module":"Module K, ILO 1","topic":"Misoprostol common adverse effect","bloom":"Understand","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient started on misoprostol for NSAID-ulcer prevention calls to report new abdominal cramping and loose stools since starting the medication.","question":"Which of the following is the most likely explanation?","correctLetter":"B","options":[{"letter":"A","text":"This indicates a new NSAID-induced ulcer has developed despite therapy","rationale":"Cramping and diarrhea shortly after starting misoprostol are a known adverse effect of the drug itself, not a typical presentation of a new ulcer.","isCorrect":false},{"letter":"B","text":"This is a common, expected adverse effect of misoprostol related to its prostaglandin activity on the bowel","rationale":"Diarrhea and abdominal cramping are common, dose-related adverse effects of misoprostol due to its prostaglandin-mediated effects on intestinal smooth muscle and secretion.","isCorrect":true},{"letter":"C","text":"This suggests the patient has developed an allergic reaction requiring epinephrine","rationale":"These symptoms are a known dose-related adverse effect, not an anaphylactic reaction.","isCorrect":false},{"letter":"D","text":"This is a sign of C. difficile infection related to recent antibiotic use","rationale":"Nothing in this scenario suggests recent antibiotic use; this presentation is a well-described misoprostol adverse effect.","isCorrect":false},{"letter":"E","text":"This indicates misoprostol is not being absorbed properly","rationale":"These symptoms reflect an expected pharmacologic effect of the absorbed drug, not malabsorption.","isCorrect":false}]},{"qnum":13,"module":"Module K, ILO 1","topic":"Cimetidine antiandrogenic effects","bloom":"Understand","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A middle-aged man on long-term cimetidine for peptic ulcer disease reports new breast tenderness and enlargement.","question":"Which of the following best explains this finding?","correctLetter":"C","options":[{"letter":"A","text":"Famotidine has the same effect and should also be avoided","rationale":"This antiandrogenic effect is specifically associated with cimetidine, not famotidine.","isCorrect":false},{"letter":"B","text":"This is an unrelated, coincidental finding requiring no further evaluation of his medication","rationale":"This is a recognized, medication-related adverse effect of cimetidine, not an unrelated coincidence.","isCorrect":false},{"letter":"C","text":"Cimetidine has antiandrogenic activity that can cause gynecomastia with prolonged use","rationale":"Cimetidine is uniquely associated with antiandrogenic effects among the H2 receptor antagonists, including gynecomastia and, less commonly, impotence, with prolonged use.","isCorrect":true},{"letter":"D","text":"This indicates a drug interaction between cimetidine and an unlisted testosterone supplement","rationale":"No such supplement is mentioned; the effect is a direct, described property of cimetidine itself.","isCorrect":false},{"letter":"E","text":"This is a sign of cimetidine-induced hyperthyroidism","rationale":"This is not the mechanism taught for cimetidine's association with gynecomastia.","isCorrect":false}]},{"qnum":14,"module":"Module K, ILO 1","topic":"PPI-clopidogrel interaction mechanism","bloom":"Analyze","task":"Mechanism/drug interaction","blueprint":"Mechanism of action","vignette":"A patient on clopidogrel after coronary stent placement is also taking omeprazole for GERD. His cardiologist is concerned about reduced antiplatelet effectiveness.","question":"Which of the following best explains the mechanism of this interaction?","correctLetter":"D","options":[{"letter":"A","text":"Omeprazole increases gastric pH, directly degrading clopidogrel before absorption","rationale":"The interaction is a CYP2C19 metabolic effect, not a pH-related degradation or absorption issue.","isCorrect":false},{"letter":"B","text":"Omeprazole displaces clopidogrel from plasma protein binding sites","rationale":"This is not the taught mechanism of this interaction.","isCorrect":false},{"letter":"C","text":"Clopidogrel inhibits omeprazole's proton pump binding, reducing acid suppression","rationale":"This reverses the direction of the interaction; the concern is omeprazole's effect on clopidogrel activation, not the reverse.","isCorrect":false},{"letter":"D","text":"Omeprazole competes for CYP2C19, reducing conversion of clopidogrel to its active metabolite","rationale":"Clopidogrel is a prodrug requiring CYP2C19-mediated activation; omeprazole (and other PPIs with strong CYP2C19 affinity) can competitively inhibit this pathway, reducing formation of the active antiplatelet metabolite.","isCorrect":true},{"letter":"E","text":"Omeprazole accelerates renal clearance of clopidogrel's active metabolite","rationale":"This is not the taught mechanism; the interaction occurs at the level of hepatic activation via CYP2C19, not renal clearance.","isCorrect":false}]},{"qnum":15,"module":"Module K, ILO 9","topic":"Bismuth subsalicylate counseling","bloom":"Apply","task":"Patient counseling","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient starting bismuth subsalicylate as part of quadruple therapy for H. pylori calls, concerned about black stools and a black-appearing tongue.","question":"Which of the following is the most appropriate response?","correctLetter":"E","options":[{"letter":"A","text":"This indicates active gastrointestinal bleeding and the medication should be stopped immediately","rationale":"This describes a benign, expected bismuth effect, not a sign of bleeding requiring discontinuation.","isCorrect":false},{"letter":"B","text":"This is a sign of liver toxicity requiring immediate liver function testing","rationale":"Black stools/tongue from bismuth are not indicative of liver toxicity.","isCorrect":false},{"letter":"C","text":"This indicates a missed dose of tetracycline in the regimen","rationale":"This finding is unrelated to tetracycline dosing and is a direct, benign effect of the bismuth component.","isCorrect":false},{"letter":"D","text":"This is an allergic reaction to bismuth requiring discontinuation","rationale":"This is a normal, benign pharmacologic effect, not an allergic reaction.","isCorrect":false},{"letter":"E","text":"This is a harmless, expected effect of bismuth and does not indicate GI bleeding","rationale":"Black stools and black tongue are well-known, benign effects of bismuth subsalicylate and should be distinguished from melena, which is a concerning sign of upper GI bleeding.","isCorrect":true}]},{"qnum":16,"module":"Module K, ILO 9","topic":"Bulk-forming laxative counseling","bloom":"Apply","task":"Patient counseling","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient is started on psyllium for chronic constipation.","question":"Which counseling point is most important for this patient?","correctLetter":"A","options":[{"letter":"A","text":"Take each dose with a full glass of water and maintain adequate fluid intake throughout the day","rationale":"Bulk-forming laxatives absorb water to increase stool bulk; inadequate fluid intake with these agents can lead to worsened constipation or even bowel obstruction, making adequate hydration essential counseling.","isCorrect":true},{"letter":"B","text":"Take the dose on an empty stomach without water to maximize effect","rationale":"This is the opposite of appropriate counseling; inadequate fluid intake with a bulk-forming laxative raises the risk of obstruction.","isCorrect":false},{"letter":"C","text":"Expect a bowel movement within 30 minutes of the first dose","rationale":"Bulk-forming laxatives typically take 12-72 hours to produce an effect, not 30 minutes.","isCorrect":false},{"letter":"D","text":"This medication should not be combined with dietary fiber","rationale":"There is no taught restriction against combining psyllium with dietary fiber sources.","isCorrect":false},{"letter":"E","text":"This medication is a stimulant laxative and should be limited to short-term use","rationale":"Psyllium is a bulk-forming agent, not a stimulant laxative, and is appropriate for long-term use with adequate fluid intake.","isCorrect":false}]},{"qnum":17,"module":"Module K, ILO 3","topic":"Bulk-forming laxative mechanism","bloom":"Remember","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Which of the following best describes the mechanism of action of psyllium?","correctLetter":"B","options":[{"letter":"A","text":"It directly stimulates the myenteric plexus to increase colonic motility","rationale":"This describes the mechanism of stimulant laxatives (e.g., senna, bisacodyl), not bulk-forming agents.","isCorrect":false},{"letter":"B","text":"It absorbs water within the intestinal lumen to increase stool bulk and stimulate peristalsis","rationale":"Bulk-forming laxatives like psyllium work by absorbing water to form a gel-like bulk, which increases stool volume and mechanically stimulates peristalsis.","isCorrect":true},{"letter":"C","text":"It draws water into the bowel lumen through an osmotic gradient created by nonabsorbable sugars","rationale":"This describes the mechanism of osmotic laxatives like lactulose, not psyllium.","isCorrect":false},{"letter":"D","text":"It softens stool by allowing water and fat to penetrate it","rationale":"This describes the mechanism of stool softeners such as docusate, not psyllium.","isCorrect":false},{"letter":"E","text":"It lubricates the stool surface to ease passage","rationale":"This describes lubricant laxatives such as mineral oil, not bulk-forming agents.","isCorrect":false}]},{"qnum":18,"module":"Module K, ILO 3","topic":"Stimulant laxative mechanism","bloom":"Remember","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Senna and bisacodyl produce their laxative effect primarily through which mechanism?","correctLetter":"C","options":[{"letter":"A","text":"Osmotic retention of water via a nonabsorbable solute","rationale":"This describes osmotic laxatives like polyethylene glycol or lactulose, not stimulant laxatives.","isCorrect":false},{"letter":"B","text":"Activation of guanylate cyclase-C in intestinal epithelial cells","rationale":"This describes the mechanism of GC-C agonists such as linaclotide, not stimulant laxatives.","isCorrect":false},{"letter":"C","text":"Direct stimulation of the myenteric plexus, increasing colonic motility and secretion","rationale":"Stimulant laxatives act on the enteric nervous system (myenteric plexus) to increase peristaltic contractions and intestinal fluid secretion.","isCorrect":true},{"letter":"D","text":"Softening of stool through surfactant activity","rationale":"This describes docusate's mechanism, not stimulant laxatives.","isCorrect":false},{"letter":"E","text":"Antagonism of peripheral mu-opioid receptors in the gut","rationale":"This describes PAMORAs (e.g., methylnaltrexone), not stimulant laxatives.","isCorrect":false}]},{"qnum":19,"module":"Module K, ILO 3","topic":"Chronic stimulant laxative overuse","bloom":"Understand","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient has been self-treating chronic constipation with daily senna tablets for over a year without medical guidance.","question":"Which of the following is a recognized concern with this pattern of long-term stimulant laxative use?","correctLetter":"D","options":[{"letter":"A","text":"Progressive hypermagnesemia requiring renal monitoring","rationale":"This is a concern with magnesium-based osmotic laxatives, not stimulant laxatives like senna.","isCorrect":false},{"letter":"B","text":"Vitamin B12 deficiency from impaired parietal cell function","rationale":"This is associated with chronic acid suppression (e.g., PPIs), not stimulant laxative use.","isCorrect":false},{"letter":"C","text":"Increased risk of C. difficile infection","rationale":"This risk is associated with chronic PPI use, not chronic stimulant laxative use.","isCorrect":false},{"letter":"D","text":"Laxative dependency and pigmentary changes of the colonic mucosa (melanosis coli)","rationale":"Chronic, unsupervised stimulant laxative use is associated with laxative dependency and melanosis coli, a benign pigmentation change of the colon from chronic anthraquinone exposure.","isCorrect":true},{"letter":"E","text":"QT interval prolongation with long-term use","rationale":"This is not a recognized effect of chronic stimulant laxative use.","isCorrect":false}]},{"qnum":20,"module":"Module K, ILO 9","topic":"Glycerin suppository onset","bloom":"Apply","task":"Treatment/administration","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A parent asks for a fast-acting option to relieve their toddler's acute constipation before a pediatrician visit later that day.","question":"Which of the following would provide the most rapid relief?","correctLetter":"E","options":[{"letter":"A","text":"Psyllium","rationale":"Bulk-forming laxatives take 12-72 hours to act, which is not fast enough for this scenario.","isCorrect":false},{"letter":"B","text":"Polyethylene glycol","rationale":"Osmotic agents like PEG typically take 1-3 days for full effect, not the rapid onset needed here.","isCorrect":false},{"letter":"C","text":"Linaclotide","rationale":"GC-C agonists are not rapid-onset agents and are not the taught option for fast pediatric relief.","isCorrect":false},{"letter":"D","text":"Docusate","rationale":"Stool softeners like docusate take 1-3 days to work and are used for prevention, not rapid relief.","isCorrect":false},{"letter":"E","text":"Glycerin suppository","rationale":"Glycerin suppositories act rapidly, typically producing a bowel movement within 15-60 minutes, making them well suited for fast, short-term relief, including in pediatric patients.","isCorrect":true}]},{"qnum":21,"module":"Module K, ILO 3","topic":"Lubiprostone adverse effect counseling","bloom":"Apply","task":"Patient counseling","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient starting lubiprostone for chronic idiopathic constipation asks how to reduce the nausea she has read can occur with this medication.","question":"Which of the following is the most appropriate counseling point?","correctLetter":"A","options":[{"letter":"A","text":"Take the medication with food to reduce the likelihood of nausea","rationale":"Nausea is a common adverse effect of lubiprostone, particularly with the first dose, and taking it with food is a taught strategy to reduce this effect.","isCorrect":true},{"letter":"B","text":"Take the medication on an empty stomach to reduce nausea","rationale":"Taking lubiprostone on an empty stomach is more likely to worsen, not reduce, nausea.","isCorrect":false},{"letter":"C","text":"Nausea indicates an allergic reaction and the drug should be stopped immediately","rationale":"Nausea is a common, expected adverse effect, not typically an allergic reaction requiring immediate discontinuation.","isCorrect":false},{"letter":"D","text":"Double the next dose to build tolerance faster","rationale":"This is not appropriate or taught counseling and could worsen adverse effects.","isCorrect":false},{"letter":"E","text":"Nausea with lubiprostone indicates it should be combined with a stimulant laxative","rationale":"This does not address the nausea and is not the taught counseling point for this adverse effect.","isCorrect":false}]},{"qnum":22,"module":"Module K, ILO 3","topic":"Prucalopride mechanism/indication","bloom":"Understand","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Prucalopride is distinguished from linaclotide in the treatment of chronic idiopathic constipation by which of the following?","correctLetter":"B","options":[{"letter":"A","text":"Prucalopride works by increasing intestinal chloride secretion through ClC-2 channels","rationale":"This describes lubiprostone's mechanism, not prucalopride's.","isCorrect":false},{"letter":"B","text":"Prucalopride is a selective 5-HT4 receptor agonist that enhances colonic peristaltic contractions, rather than a secretagogue","rationale":"Prucalopride works by stimulating 5-HT4 receptors to promote colonic motility (a prokinetic mechanism), which is distinct from linaclotide's secretagogue mechanism of increasing intestinal fluid via GC-C/cGMP activation.","isCorrect":true},{"letter":"C","text":"Prucalopride is a bulk-forming agent that requires high fluid intake","rationale":"Prucalopride is a prokinetic 5-HT4 agonist, not a bulk-forming laxative.","isCorrect":false},{"letter":"D","text":"Prucalopride and linaclotide share an identical mechanism of action","rationale":"These two agents work through distinct mechanisms — motility enhancement versus fluid secretion — and are not identical.","isCorrect":false},{"letter":"E","text":"Prucalopride works by antagonizing peripheral opioid receptors","rationale":"This describes PAMORAs (e.g., methylnaltrexone), not prucalopride.","isCorrect":false}]},{"qnum":23,"module":"Module K, ILO 3","topic":"Rifaximin indications","bloom":"Remember","task":"Indication","blueprint":"Indications for use","vignette":"","question":"Rifaximin, a nonabsorbed oral antibiotic, is indicated for which of the following conditions?","correctLetter":"C","options":[{"letter":"A","text":"GERD, peptic ulcer disease, and H. pylori eradication","rationale":"These are indications for acid-suppressing and mucosal-protective agents, not rifaximin.","isCorrect":false},{"letter":"B","text":"Opioid-induced constipation and chronic idiopathic constipation","rationale":"These are indications for PAMORAs, secretagogues, and other laxative classes, not rifaximin.","isCorrect":false},{"letter":"C","text":"Traveler's diarrhea, hepatic encephalopathy, and IBS with diarrhea","rationale":"Rifaximin's poor systemic absorption allows it to act locally in the gut, giving it FDA-approved indications spanning traveler's diarrhea, hepatic encephalopathy (reducing ammonia-producing gut bacteria), and IBS-D.","isCorrect":true},{"letter":"D","text":"Chemotherapy-induced nausea and vomiting","rationale":"This is an indication for antiemetic classes such as 5-HT3 antagonists, not rifaximin.","isCorrect":false},{"letter":"E","text":"Ulcerative colitis and Crohn disease maintenance therapy","rationale":"These are indications for 5-ASAs, immunomodulators, and biologics, not rifaximin.","isCorrect":false}]},{"qnum":24,"module":"Module K, ILO 3","topic":"Bismuth subsalicylate contraindication in children","bloom":"Apply","task":"Contraindication","blueprint":"Contraindications","vignette":"A parent asks about giving bismuth subsalicylate to her 10-year-old son, who has diarrhea and is recovering from a suspected viral illness with a low-grade fever.","question":"Which of the following is the most appropriate response?","correctLetter":"D","options":[{"letter":"A","text":"Bismuth subsalicylate is safe and preferred for pediatric viral diarrhea","rationale":"This contradicts the salicylate-related Reye syndrome risk in children with viral illness.","isCorrect":false},{"letter":"B","text":"Bismuth subsalicylate should be avoided in children only due to a risk of black stools","rationale":"Black stools are a benign, expected effect; the actual concern in this population is the salicylate-related Reye syndrome risk.","isCorrect":false},{"letter":"C","text":"Bismuth subsalicylate is contraindicated in all children due to opioid content","rationale":"Bismuth subsalicylate does not contain an opioid; the relevant concern here is its salicylate component.","isCorrect":false},{"letter":"D","text":"Bismuth subsalicylate should be avoided in children and teenagers with a viral illness due to the risk of Reye syndrome","rationale":"Bismuth subsalicylate contains a salicylate, and salicylates are associated with Reye syndrome when given to children or teenagers with viral illnesses, so this agent should be avoided in this scenario.","isCorrect":true},{"letter":"E","text":"There is no specific pediatric concern with this medication","rationale":"The salicylate component creates a specific, well-recognized pediatric concern (Reye syndrome) in the setting of viral illness.","isCorrect":false}]},{"qnum":25,"module":"Module K, ILO 3","topic":"Loperamide supratherapeutic dose cardiotoxicity","bloom":"Analyze","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient is brought to the emergency department after intentionally taking loperamide at many times the recommended dose in an attempt to self-manage opioid withdrawal symptoms. He is found to have a markedly prolonged QT interval and ventricular arrhythmia.","question":"Which of the following best explains this presentation?","correctLetter":"E","options":[{"letter":"A","text":"This represents a typical, benign adverse effect at any loperamide dose","rationale":"Cardiotoxicity at standard OTC doses is not expected; this effect is specifically associated with supratherapeutic dosing.","isCorrect":false},{"letter":"B","text":"This is an anticholinergic toxidrome unrelated to the loperamide dose","rationale":"This presentation reflects a dose-dependent cardiac conduction effect of loperamide, not a classic anticholinergic toxidrome.","isCorrect":false},{"letter":"C","text":"This indicates an allergic reaction to loperamide requiring epinephrine","rationale":"QT prolongation and arrhythmia from high-dose loperamide reflect direct cardiac channel effects, not an allergic reaction.","isCorrect":false},{"letter":"D","text":"Loperamide has no known cardiac effects regardless of dose","rationale":"This contradicts the recognized dose-dependent cardiotoxicity risk of loperamide misuse.","isCorrect":false},{"letter":"E","text":"Supratherapeutic loperamide doses can cause cardiac sodium and potassium channel blockade, leading to QT prolongation and arrhythmia","rationale":"At doses far exceeding the recommended maximum, loperamide can cross into the central nervous system and cause significant cardiac conduction abnormalities, including QT prolongation and life-threatening arrhythmias — a recognized risk with loperamide misuse.","isCorrect":true}]},{"qnum":26,"module":"Module K, ILO 3","topic":"Octreotide for refractory secretory diarrhea","bloom":"Apply","task":"Treatment","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient with a neuroendocrine tumor has severe, refractory secretory diarrhea that has not responded to standard antidiarrheal agents.","question":"Which of the following would be most appropriate to control her diarrhea?","correctLetter":"A","options":[{"letter":"A","text":"Octreotide","rationale":"Octreotide, a somatostatin analog, is used for severe secretory diarrhea, particularly related to neuroendocrine tumors, when standard antidiarrheal agents have failed.","isCorrect":true},{"letter":"B","text":"Loperamide at a higher-than-recommended dose","rationale":"Increasing loperamide beyond the recommended dose is unsafe due to cardiotoxicity risk and is not the taught approach for refractory secretory diarrhea.","isCorrect":false},{"letter":"C","text":"Docusate","rationale":"Docusate is a stool softener for constipation and has no role in treating secretory diarrhea.","isCorrect":false},{"letter":"D","text":"Psyllium","rationale":"A bulk-forming laxative is not the taught approach for severe secretory diarrhea from a neuroendocrine tumor.","isCorrect":false},{"letter":"E","text":"Simethicone","rationale":"Simethicone treats gas, not secretory diarrhea.","isCorrect":false}]},{"qnum":27,"module":"Module K, ILO 3","topic":"Scopolamine adverse effects","bloom":"Understand","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A patient using a scopolamine patch for motion sickness prevention reports dry mouth, blurred vision, and difficulty urinating.","question":"Which of the following best explains these findings?","correctLetter":"B","options":[{"letter":"A","text":"These are serotonergic adverse effects related to 5-HT3 receptor blockade","rationale":"Scopolamine does not act on 5-HT3 receptors; these findings reflect anticholinergic, not serotonergic, activity.","isCorrect":false},{"letter":"B","text":"These are anticholinergic adverse effects related to scopolamine's mechanism of action","rationale":"Scopolamine is an anticholinergic (antimuscarinic) agent, and dry mouth, blurred vision, and urinary retention are classic anticholinergic adverse effects of this drug class.","isCorrect":true},{"letter":"C","text":"These findings indicate a dopamine-related extrapyramidal reaction","rationale":"This describes a different adverse effect profile (associated with D2-antagonist antiemetics like metoclopramide), not scopolamine's anticholinergic effects.","isCorrect":false},{"letter":"D","text":"These findings suggest an allergic contact dermatitis reaction to the patch","rationale":"Dry mouth, blurred vision, and urinary retention are systemic anticholinergic effects, not signs of a local contact dermatitis reaction.","isCorrect":false},{"letter":"E","text":"These findings are unrelated to the medication and warrant an unrelated workup","rationale":"These are well-recognized, medication-related anticholinergic effects of scopolamine.","isCorrect":false}]},{"qnum":28,"module":"Module K, ILO 3","topic":"Dronabinol indication","bloom":"Remember","task":"Indication","blueprint":"Indications for use","vignette":"","question":"Dronabinol is most appropriately indicated for which of the following?","correctLetter":"C","options":[{"letter":"A","text":"First-line prevention of highly emetogenic chemotherapy-induced nausea","rationale":"Dronabinol is not the taught first-line option; the standard first-line combination includes a 5-HT3 antagonist, an NK1 antagonist, and dexamethasone.","isCorrect":false},{"letter":"B","text":"Motion sickness prevention prior to travel","rationale":"This is not the taught indication for dronabinol; scopolamine and meclizine are the agents taught for motion sickness.","isCorrect":false},{"letter":"C","text":"Chemotherapy-induced nausea and vomiting refractory to conventional antiemetics","rationale":"Dronabinol, a synthetic cannabinoid, is indicated for CINV that has not responded adequately to conventional antiemetic therapy.","isCorrect":true},{"letter":"D","text":"Opioid-induced constipation","rationale":"This is not an indication for dronabinol; PAMORAs and other laxative classes are used for this indication.","isCorrect":false},{"letter":"E","text":"H. pylori eradication as part of quadruple therapy","rationale":"Dronabinol has no role in H. pylori eradication regimens.","isCorrect":false}]},{"qnum":29,"module":"Module K, ILO 3","topic":"NK1 antagonist drug interaction","bloom":"Analyze","task":"Drug interaction","blueprint":"Drug interactions, including presentation and treatment","vignette":"A patient about to start aprepitant as part of her chemotherapy antiemetic regimen is also taking warfarin for a mechanical heart valve.","question":"Which of the following is the most important consideration regarding this combination?","correctLetter":"D","options":[{"letter":"A","text":"This combination has no clinically significant interaction","rationale":"This is a recognized interaction requiring increased INR monitoring, not one that can be disregarded.","isCorrect":false},{"letter":"B","text":"Aprepitant will have no effect on warfarin because it is dosed for only a few days","rationale":"Even short courses of aprepitant can meaningfully affect CYP2C9 activity and warfarin levels, warranting monitoring.","isCorrect":false},{"letter":"C","text":"Warfarin will reduce the antiemetic effectiveness of aprepitant","rationale":"The concern flows in the direction of aprepitant affecting warfarin metabolism, not the reverse.","isCorrect":false},{"letter":"D","text":"Aprepitant affects CYP3A4 and CYP2C9 activity, which can alter warfarin levels and requires closer INR monitoring","rationale":"Aprepitant is both a substrate and modulator of CYP3A4 and can induce CYP2C9, the enzyme responsible for warfarin metabolism, creating a clinically significant interaction that requires closer INR monitoring during and after the antiemetic course.","isCorrect":true},{"letter":"E","text":"This interaction only matters if aprepitant is given intravenously","rationale":"The CYP-mediated interaction is a concern regardless of the oral or IV formulation used.","isCorrect":false}]},{"qnum":30,"module":"Module K, ILO 3","topic":"Promethazine IV extravasation warning","bloom":"Apply","task":"Adverse effect","blueprint":"Adverse effects, reactions, and toxicities","vignette":"A nurse is preparing to administer IV promethazine for a patient's nausea and asks about a specific administration-related safety concern with this medication.","question":"Which of the following is the most important safety concern to relay?","correctLetter":"E","options":[{"letter":"A","text":"IV promethazine carries a significant risk of tardive dyskinesia with a single dose","rationale":"Tardive dyskinesia is a concern with chronic dopamine-antagonist use (e.g., metoclopramide), not the specific IV administration hazard taught for promethazine.","isCorrect":false},{"letter":"B","text":"IV promethazine must be given as a rapid IV push for effectiveness","rationale":"Rapid IV push administration increases the risk of the serious tissue injury associated with this drug, and is not recommended safety practice.","isCorrect":false},{"letter":"C","text":"IV promethazine has no unique administration-related safety concerns compared to oral dosing","rationale":"The IV route carries a specific, serious boxed warning for tissue injury that does not apply to oral administration.","isCorrect":false},{"letter":"D","text":"IV promethazine should always be co-administered with an opioid to prevent injection site pain","rationale":"This is not a taught or appropriate safety practice for promethazine administration.","isCorrect":false},{"letter":"E","text":"IV extravasation of promethazine can cause severe tissue injury, including necrosis, and carries a boxed warning","rationale":"Promethazine carries a boxed warning for severe tissue damage, including gangrene, if the IV formulation extravasates or is inadvertently given intra-arterially, making careful IV administration technique essential.","isCorrect":true}]},{"qnum":31,"module":"Module K, ILO 3","topic":"Antihistamine antiemetic mechanism","bloom":"Remember","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Diphenhydramine's antiemetic effect for vestibular-related nausea is primarily due to which mechanism?","correctLetter":"A","options":[{"letter":"A","text":"Antagonism of H1 receptors along the vestibular pathway","rationale":"First-generation antihistamines like diphenhydramine block H1 receptors involved in the vestibular pathway to the vomiting center, making them useful for vestibular-related nausea such as motion sickness or vertigo.","isCorrect":true},{"letter":"B","text":"Antagonism of 5-HT3 receptors in the GI tract","rationale":"This describes the mechanism of agents like ondansetron, not antihistamines.","isCorrect":false},{"letter":"C","text":"Antagonism of dopamine D2 receptors in the chemoreceptor trigger zone","rationale":"This describes the mechanism of agents like metoclopramide and prochlorperazine, not diphenhydramine's vestibular action.","isCorrect":false},{"letter":"D","text":"Antagonism of NK1 receptors in the vomiting center","rationale":"This describes the mechanism of agents like aprepitant, not diphenhydramine.","isCorrect":false},{"letter":"E","text":"Agonism of cannabinoid receptors in the central nervous system","rationale":"This describes dronabinol's mechanism, not diphenhydramine's.","isCorrect":false}]},{"qnum":32,"module":"Module K, ILO 9","topic":"Ondansetron timing for chemotherapy","bloom":"Apply","task":"Administration/dosing","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient is scheduled to begin a chemotherapy infusion known to be highly emetogenic.","question":"Which of the following reflects the appropriate timing of her ondansetron dose relative to chemotherapy?","correctLetter":"B","options":[{"letter":"A","text":"Administer ondansetron only after nausea symptoms begin","rationale":"Waiting until symptoms appear is a reactive rather than preventive approach and is not the taught standard for highly emetogenic regimens.","isCorrect":false},{"letter":"B","text":"Administer ondansetron prior to starting the chemotherapy infusion","rationale":"Antiemetics such as ondansetron are most effective when given prior to the emetogenic stimulus, allowing therapeutic drug levels to be present before nausea-triggering chemotherapy begins.","isCorrect":true},{"letter":"C","text":"Administer ondansetron 24 hours after the chemotherapy infusion is complete","rationale":"This delayed timing would not provide coverage during the period of highest emetogenic risk.","isCorrect":false},{"letter":"D","text":"Timing relative to the chemotherapy infusion does not affect ondansetron's efficacy","rationale":"Pre-treatment timing is specifically taught as important for maximizing antiemetic efficacy in this setting.","isCorrect":false},{"letter":"E","text":"Administer ondansetron only if a 5-HT3 antagonist was not already used in a prior cycle","rationale":"This is not the taught approach; ondansetron is dosed prior to each emetogenic chemotherapy administration as indicated.","isCorrect":false}]},{"qnum":33,"module":"Module K, ILO 1","topic":"Metoclopramide prokinetic use","bloom":"Understand","task":"Indication/mechanism","blueprint":"Indications for use","vignette":"A patient with diabetic gastroparesis is prescribed metoclopramide, in addition to its antiemetic use.","question":"Which of the following best explains why metoclopramide is useful in this condition?","correctLetter":"C","options":[{"letter":"A","text":"It reduces gastric acid secretion through H+/K+ ATPase inhibition","rationale":"This describes a PPI's mechanism, not metoclopramide's prokinetic action.","isCorrect":false},{"letter":"B","text":"It relaxes the pyloric sphincter through direct opioid receptor antagonism","rationale":"This is not the taught mechanism by which metoclopramide improves gastric emptying.","isCorrect":false},{"letter":"C","text":"It has prokinetic activity that increases gastric motility and accelerates gastric emptying","rationale":"In addition to its antiemetic D2-antagonist activity in the CTZ, metoclopramide has prokinetic effects that enhance gastric motility, making it useful for conditions like gastroparesis where delayed gastric emptying is the underlying problem.","isCorrect":true},{"letter":"D","text":"It increases mucosal bicarbonate secretion to protect against acid injury","rationale":"This describes a cytoprotective mechanism (like misoprostol's), not metoclopramide's prokinetic action.","isCorrect":false},{"letter":"E","text":"It has no effect on GI motility and is used only for its antiemetic properties in this condition","rationale":"Metoclopramide's prokinetic effect on gastric emptying is precisely why it is useful in gastroparesis, beyond its antiemetic action.","isCorrect":false}]},{"qnum":34,"module":"Module K, ILO 9","topic":"Meclizine timing for travel","bloom":"Apply","task":"Patient counseling","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient wants to take meclizine before a car trip to prevent motion sickness.","question":"Which of the following is the most appropriate counseling point regarding timing?","correctLetter":"D","options":[{"letter":"A","text":"Take the dose only after nausea symptoms have already started","rationale":"This is a reactive approach; meclizine is intended for prevention and works best when taken before symptoms begin.","isCorrect":false},{"letter":"B","text":"Take the dose immediately upon waking, regardless of when travel begins","rationale":"This is not the taught timing principle; dosing should be tied to travel timing (30-60 minutes prior), not wake time.","isCorrect":false},{"letter":"C","text":"Meclizine requires several days of dosing before it becomes effective","rationale":"Meclizine does not require a multi-day lead-in period; it is effective when taken shortly before travel.","isCorrect":false},{"letter":"D","text":"Take the dose approximately 30-60 minutes before travel begins","rationale":"Meclizine, like other agents used for motion sickness prevention, is most effective when taken before symptom onset, approximately 30-60 minutes prior to travel.","isCorrect":true},{"letter":"E","text":"Timing does not matter as long as one dose is taken sometime that day","rationale":"Timing relative to travel onset is specifically important for preventive effectiveness.","isCorrect":false}]},{"qnum":35,"module":"Module K, ILO 1","topic":"Simethicone vs. alpha-galactosidase mechanism","bloom":"Understand","task":"Mechanism differentiation","blueprint":"Mechanism of action","vignette":"A patient asks about the difference between simethicone and alpha-galactosidase (Beano) for treating intestinal gas.","question":"Which of the following best describes the difference in how these two products work?","correctLetter":"E","options":[{"letter":"A","text":"Both agents work by the same enzymatic mechanism, breaking down lactose","rationale":"Lactose breakdown is the mechanism of lactase (Lactaid), not simethicone or alpha-galactosidase, and the two agents do not share an identical mechanism.","isCorrect":false},{"letter":"B","text":"Simethicone is an enzyme, while alpha-galactosidase mechanically disperses gas bubbles","rationale":"This reverses the actual mechanisms of the two products.","isCorrect":false},{"letter":"C","text":"Both agents work systemically after being absorbed into the bloodstream","rationale":"Both simethicone and alpha-galactosidase act locally within the GI tract and are not systemically absorbed to produce their effect.","isCorrect":false},{"letter":"D","text":"Simethicone reduces gas production by altering colonic bacterial flora","rationale":"This describes a different type of mechanism (e.g., antibiotic effect) and is not how simethicone works; it acts mechanically on existing gas bubbles.","isCorrect":false},{"letter":"E","text":"Simethicone mechanically reduces the surface tension of gas bubbles, while alpha-galactosidase is an enzyme that breaks down gas-producing oligosaccharides before they reach colonic bacteria","rationale":"Simethicone acts as an anti-foaming agent that coalesces small gas bubbles for easier passage, whereas alpha-galactosidase is an enzyme taken with food that breaks down complex sugars (as in beans and vegetables) before colonic bacteria can ferment them into gas.","isCorrect":true}]},{"qnum":36,"module":"Module K, ILO 4","topic":"Eluxadoline controlled substance status","bloom":"Understand","task":"Prescribing considerations","blueprint":"Prescribing, monitoring, and regulating controlled substances","vignette":"","question":"Eluxadoline is classified as a Schedule IV controlled substance primarily because of which property?","correctLetter":"A","options":[{"letter":"A","text":"Its mu-opioid receptor agonist activity, which carries potential for abuse","rationale":"Eluxadoline acts on mu-opioid (agonist), delta-opioid (antagonist), and kappa-opioid (agonist) receptors; its mu-opioid agonist activity gives it abuse potential, leading to its Schedule IV classification.","isCorrect":true},{"letter":"B","text":"Its structural similarity to benzodiazepines","rationale":"Eluxadoline is not structurally related to benzodiazepines; its scheduling relates to its opioid receptor activity.","isCorrect":false},{"letter":"C","text":"Its association with severe hepatotoxicity","rationale":"While hepatic considerations exist for many drugs, the Schedule IV classification is specifically due to its opioid receptor activity, not hepatotoxicity.","isCorrect":false},{"letter":"D","text":"Its stimulant effects on the central nervous system","rationale":"Eluxadoline does not have stimulant properties; its scheduling relates to opioid receptor agonism.","isCorrect":false},{"letter":"E","text":"Its use exclusively in inpatient, monitored settings","rationale":"This is not the reason for its scheduling status, and eluxadoline is used in the outpatient setting.","isCorrect":false}]},{"qnum":37,"module":"Module K, ILO 4","topic":"Alosetron restricted prescribing program","bloom":"Apply","task":"Prescribing considerations","blueprint":"Prescribing, monitoring, and regulating controlled substances","vignette":"A provider wants to prescribe alosetron for a patient with severe, refractory IBS-D.","question":"Which of the following is true regarding prescribing this medication?","correctLetter":"B","options":[{"letter":"A","text":"Alosetron can be prescribed by any provider without restriction, like most other IBS medications","rationale":"Alosetron requires enrollment in a restricted prescribing program due to its safety profile, unlike most other IBS medications.","isCorrect":false},{"letter":"B","text":"Alosetron is available only through a restricted prescribing program due to safety concerns identified after its initial approval","rationale":"Alosetron was withdrawn from the market after post-marketing reports of ischemic colitis and severe constipation, then reintroduced under a restricted prescribing program limited to providers who enroll and meet specific criteria, reserved for severe IBS-D refractory to other therapy.","isCorrect":true},{"letter":"C","text":"Alosetron is only available over-the-counter for mild IBS symptoms","rationale":"Alosetron is a prescription medication reserved for severe, refractory IBS-D under a restricted program, not an OTC option for mild symptoms.","isCorrect":false},{"letter":"D","text":"Alosetron requires no special monitoring given its excellent safety profile","rationale":"This contradicts the reason for its restricted prescribing program, which exists specifically due to safety concerns.","isCorrect":false},{"letter":"E","text":"Alosetron is first-line therapy for all IBS subtypes","rationale":"Alosetron is specifically indicated for severe IBS-D refractory to conventional therapy, not first-line for all subtypes.","isCorrect":false}]},{"qnum":38,"module":"Module K, ILO 4","topic":"Dicyclomine anticholinergic contraindication","bloom":"Apply","task":"Contraindication","blueprint":"Contraindications","vignette":"A patient with a history of narrow-angle glaucoma is being considered for dicyclomine to manage IBS-related abdominal cramping.","question":"Which of the following is the most appropriate concern?","correctLetter":"C","options":[{"letter":"A","text":"Dicyclomine has no interaction with glaucoma and can be used without precaution","rationale":"This contradicts the well-recognized anticholinergic risk of precipitating angle-closure glaucoma.","isCorrect":false},{"letter":"B","text":"Dicyclomine is safer than other antispasmodics in glaucoma due to its selective GI action","rationale":"Dicyclomine's anticholinergic activity is systemic, not GI-selective, and carries the same glaucoma risk as other anticholinergic antispasmodics.","isCorrect":false},{"letter":"C","text":"Dicyclomine's anticholinergic activity can precipitate an acute angle-closure glaucoma attack","rationale":"Dicyclomine is an anticholinergic antispasmodic, and anticholinergic agents can increase intraocular pressure and precipitate an acute attack in patients with narrow/angle-closure glaucoma, making this a significant contraindication.","isCorrect":true},{"letter":"D","text":"The concern is reduced tear production causing discomfort, not intraocular pressure","rationale":"While dry eyes can occur with anticholinergics, the significant contraindication in narrow-angle glaucoma is the risk of precipitating an acute attack via increased intraocular pressure.","isCorrect":false},{"letter":"E","text":"Dicyclomine should be combined with a miotic eye drop to allow safe use","rationale":"This is not the taught approach; anticholinergic antispasmodics are generally avoided in this population rather than combined with other agents to enable use.","isCorrect":false}]},{"qnum":39,"module":"Module K, ILO 4","topic":"TCA vs. SSRI selection by IBS subtype","bloom":"Analyze","task":"Treatment selection","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A provider is choosing between a low-dose tricyclic antidepressant and an SSRI for a patient with IBS and significant psychological comorbidity, considering the patient's predominant bowel habit.","question":"Which of the following best reflects the rationale for this choice based on IBS subtype?","correctLetter":"D","options":[{"letter":"A","text":"TCAs and SSRIs have identical effects on GI transit and the choice does not depend on bowel habit","rationale":"These two antidepressant classes have differing effects on GI motility that are relevant to subtype-based selection.","isCorrect":false},{"letter":"B","text":"SSRIs should be preferred in IBS-D because they accelerate transit further","rationale":"This is the opposite of the intended rationale; a prokinetic effect would not be desirable in diarrhea-predominant disease.","isCorrect":false},{"letter":"C","text":"TCAs should be avoided in all IBS subtypes due to universal worsening of constipation","rationale":"TCAs are specifically considered beneficial in IBS-D due to their gut-slowing anticholinergic effect, not universally avoided.","isCorrect":false},{"letter":"D","text":"A TCA's anticholinergic, gut-slowing effect may benefit IBS-D, while an SSRI's prokinetic serotonergic effect may benefit IBS-C","rationale":"Low-dose TCAs have anticholinergic properties that slow GI transit, which can be helpful in diarrhea-predominant IBS, whereas SSRIs can have a mild prokinetic effect that may be more suitable for constipation-predominant IBS.","isCorrect":true},{"letter":"E","text":"Neither class has any role in IBS management regardless of psychological comorbidity","rationale":"Both classes have a recognized role in IBS management, particularly when psychological comorbidity and bowel habit are considered together.","isCorrect":false}]},{"qnum":40,"module":"Module K, ILO 9","topic":"Antispasmodic timing before meals","bloom":"Apply","task":"Patient counseling","blueprint":"Maintaining knowledge of relevant pharmacologic agents","vignette":"A patient with IBS notices her cramping is worst shortly after eating and asks how to best time her antispasmodic medication.","question":"Which of the following is the most appropriate counseling point?","correctLetter":"E","options":[{"letter":"A","text":"Take the antispasmodic only after cramping has already started","rationale":"This reactive timing misses the opportunity to prevent the anticipated postprandial cramping and is not the taught counseling point.","isCorrect":false},{"letter":"B","text":"Take the antispasmodic at bedtime regardless of meal timing","rationale":"This does not address her specific postprandial pattern of cramping, which is best managed by pre-meal dosing.","isCorrect":false},{"letter":"C","text":"Timing relative to meals does not affect antispasmodic efficacy","rationale":"Pre-meal timing is specifically relevant to preventing the postprandial cramping pattern she describes.","isCorrect":false},{"letter":"D","text":"Take a double dose after the largest meal of the day only","rationale":"This is not the taught dosing strategy; the standard counseling point is to take the dose before meals, not double it afterward.","isCorrect":false},{"letter":"E","text":"Take the antispasmodic approximately 30 minutes before meals to prevent postprandial cramping","rationale":"Antispasmodics are most effective when timed to precede the gastrocolic reflex that occurs after eating, so taking the dose about 30 minutes before meals helps prevent postprandial cramping.","isCorrect":true}]},{"qnum":41,"module":"Module K, ILO 4","topic":"Vedolizumab mechanism","bloom":"Remember","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Which of the following best describes the mechanism of action of vedolizumab?","correctLetter":"A","options":[{"letter":"A","text":"It selectively inhibits the alpha4-beta7 integrin, blocking gut-specific lymphocyte trafficking to inflamed intestinal tissue","rationale":"Vedolizumab is a gut-selective biologic that targets the alpha4-beta7 integrin, preventing lymphocytes from adhering to and migrating into inflamed gut tissue, while sparing trafficking to the central nervous system.","isCorrect":true},{"letter":"B","text":"It neutralizes circulating TNF-alpha throughout the body","rationale":"This describes anti-TNF agents like infliximab, not vedolizumab's gut-selective integrin mechanism.","isCorrect":false},{"letter":"C","text":"It inhibits IL-12 and IL-23 signaling","rationale":"This describes ustekinumab's mechanism, not vedolizumab's.","isCorrect":false},{"letter":"D","text":"It inhibits Janus kinase enzymes involved in cytokine signaling","rationale":"This describes JAK inhibitors like tofacitinib, not vedolizumab.","isCorrect":false},{"letter":"E","text":"It inhibits purine synthesis, reducing lymphocyte proliferation","rationale":"This describes azathioprine's mechanism, not vedolizumab's.","isCorrect":false}]},{"qnum":42,"module":"Module K, ILO 4","topic":"Ustekinumab mechanism","bloom":"Remember","task":"Mechanism of action","blueprint":"Mechanism of action","vignette":"","question":"Which of the following best describes the mechanism of action of ustekinumab?","correctLetter":"B","options":[{"letter":"A","text":"It selectively blocks gut lymphocyte trafficking via alpha4-beta7 integrin inhibition","rationale":"This describes vedolizumab's mechanism, not ustekinumab's.","isCorrect":false},{"letter":"B","text":"It binds the shared p40 subunit of IL-12 and IL-23, blocking their downstream inflammatory signaling","rationale":"Ustekinumab targets the p40 subunit shared by interleukin-12 and interleukin-23, inhibiting the inflammatory pathways these cytokines drive in Crohn disease and ulcerative colitis.","isCorrect":true},{"letter":"C","text":"It neutralizes TNF-alpha to reduce systemic inflammation","rationale":"This describes anti-TNF agents like infliximab or adalimumab, not ustekinumab.","isCorrect":false},{"letter":"D","text":"It reversibly inhibits the H+/K+ ATPase on gastric parietal cells","rationale":"This describes a PPI's mechanism and is unrelated to ustekinumab's immunologic target.","isCorrect":false},{"letter":"E","text":"It binds fecal bile acids to reduce diarrhea","rationale":"This describes bile acid sequestrants like cholestyramine, an entirely different drug class from ustekinumab.","isCorrect":false}]},{"qnum":43,"module":"Module K, ILO 4","topic":"Biologic pre-treatment screening","bloom":"Apply","task":"Monitoring/screening prior to therapy","blueprint":"Monitoring and follow-up of pharmacologic regimens","vignette":"A patient with Crohn disease is about to start infliximab therapy.","question":"Which of the following should be obtained before initiating this medication?","correctLetter":"C","options":[{"letter":"A","text":"TPMT (thiopurine methyltransferase) testing","rationale":"TPMT testing is required before starting thiopurines like azathioprine, not biologics such as infliximab.","isCorrect":false},{"letter":"B","text":"G6PD deficiency screening","rationale":"This is not a required screening test before starting anti-TNF biologic therapy.","isCorrect":false},{"letter":"C","text":"Screening for latent tuberculosis and hepatitis B","rationale":"Anti-TNF biologics suppress immune surveillance and can reactivate latent tuberculosis or hepatitis B; screening for both is required before starting therapy.","isCorrect":true},{"letter":"D","text":"HLA-B*5701 testing","rationale":"This test is unrelated to anti-TNF biologic initiation in this course.","isCorrect":false},{"letter":"E","text":"Factor V Leiden testing","rationale":"This is not a required pre-treatment screening test for biologic therapy in IBD.","isCorrect":false}]},{"qnum":44,"module":"Module K, ILO 4","topic":"Methotrexate in Crohn disease with folic acid","bloom":"Apply","task":"Treatment/monitoring","blueprint":"Selecting appropriate pharmacologic therapy and dosing","vignette":"A patient with Crohn disease is started on methotrexate for maintenance of remission.","question":"Which of the following should also be prescribed to reduce methotrexate-related adverse effects?","correctLetter":"D","options":[{"letter":"A","text":"Vitamin B12 supplementation","rationale":"B12 supplementation is not the taught co-prescription for methotrexate; folic acid is specifically indicated for this purpose.","isCorrect":false},{"letter":"B","text":"Calcium and vitamin D supplementation","rationale":"This is a general bone health consideration in chronic corticosteroid use, not the specific taught adjunct for methotrexate.","isCorrect":false},{"letter":"C","text":"A proton pump inhibitor","rationale":"This is not the taught adjunct medication for reducing methotrexate-related adverse effects.","isCorrect":false},{"letter":"D","text":"Folic acid supplementation","rationale":"Folic acid supplementation is routinely co-prescribed with methotrexate to reduce adverse effects such as GI upset and stomatitis without diminishing its therapeutic effect.","isCorrect":true},{"letter":"E","text":"A stimulant laxative","rationale":"This does not address methotrexate's adverse effect profile and is not the taught co-prescription.","isCorrect":false}]},{"qnum":45,"module":"Module K, ILO 4","topic":"5-ASA nephrotoxicity
