present with all classic features; atypical presentations common with retrocecal or pelvic appendix positions.","level":0}]},{"label":"Key Physical Exam Signs","bullets":[{"text":"McBurney point: tenderness 1/3 distance from ASIS to umbilicus (sensitivity 50–94%, specificity 75–86%).","level":0},{"text":"Rovsing sign: RLQ pain with LLQ palpation.","level":0},{"text":"Psoas sign: RLQ pain with passive right hip extension (retrocecal appendix).","level":0},{"text":"Obturator sign: RLQ pain with right hip flexion + internal rotation (pelvic appendix).","level":0},{"text":"Rebound tenderness: pain on release of pressure (suggests peritonitis).","level":0}]},{"label":"Laboratory Evaluation","bullets":[{"text":"CBC with differential: mild leukocytosis (WBC >10,000/μL) in 67–90% of patients, ~80% with a left shift; WBC sensitivity ~70–80%, specificity ~55–65% — a normal WBC does NOT rule out appendicitis. Higher WBC correlates with gangrenous/perforated appendicitis.","level":0},{"text":"Urinalysis to rule out UTI; β-hCG mandatory in women of reproductive age to exclude ectopic pregnancy.","level":0}]},{"label":"Scoring Systems","bullets":[{"text":"Alvarado score (MANTRELS mnemonic): most widely studied; <4 makes appendicitis unlikely, 4–6 warrants imaging, ≥7 suggests surgical consultation. ACEP notes accuracy is insufficient to use alone without imaging.","level":0},{"text":"Appendicitis Inflammatory Response (AIR) score: incorporates CRP and may outperform Alvarado in accuracy.","level":0}]},{"label":"Diagnostic Imaging","bullets":[{"text":"**CT abdomen/pelvis with IV contrast is first-line in adults in the US (sensitivity 96%, specificity 96%)**: dilated appendix ≥7 mm, wall thickening/hyperenhancement, periappendiceal fat stranding, appendicoliths (present in ~40% of cases, associated with 38.7% vs. 4.4% perforation rate); complicated findings include wall defect, extraluminal gas, abscess, free fluid.","level":0},{"text":"Ultrasound is first-line in children and pregnant patients (no radiation).","level":0},{"text":"MRI used when CT is contraindicated (pregnancy, radiation concerns); sensitivity 95%, specificity 92%.","level":0}]},{"label":"Classification / Complications","bullets":[{"text":"Uncomplicated (~75–80%): inflamed appendix without perforation. Complicated (~20–25%): gangrenous, perforated, with abscess or phlegmon.","level":0},{"text":"Perforation risk increases with symptom duration >24 hours; risk factors include male sex, older age, appendicoliths.","level":0}]},{"label":"Management","bullets":[{"text":"**Laparoscopic appendectomy is the gold standard** — less postoperative pain, faster recovery, earlier discharge vs. open surgery. Emergent surgery required for perforation with generalized peritonitis.","level":0},{"text":"Antibiotics-first approach for selected uncomplicated cases: ~70% of uncomplicated cases treated successfully with antibiotics alone (piperacillin-tazobactam monotherapy, or cephalosporin/fluoroquinolone + metronidazole for 7–10 days). Over 5 years, 30–40% of antibiotic-treated patients will ultimately undergo appendectomy.","level":0},{"text":"Appendicolith, mass, or appendix >13 mm on CT predicts ~40% nonsurgical failure rate — these patients should get surgery.","level":0},{"text":"Complicated appendicitis with abscess/phlegmon: IV antibiotics ± percutaneous drainage initially; interval appendectomy may be considered, particularly in patients ≥35 years (to rule out underlying neoplasm).","level":0}]},{"label":"Special Populations","bullets":[{"text":"Pregnant patients: most common in the 2nd trimester; perforation rates up to 55% (vs. 4–19% general population) due to delayed/atypical presentation. PE signs unreliable (gravid uterus displaces appendix). Imaging: US first → MRI if equivocal (avoid CT). Appendectomy advised when diagnosis is reasonably certain.","level":0},{"text":"Pediatric patients: US is first-line imaging; MRI or CT if equivocal. Pediatric Appendicitis Score (PAS) aids risk stratification.","level":0},{"text":"Elderly patients: more likely to present atypically (generalized pain, lack of leukocytosis), higher rates of complicated appendicitis; luminal obstruction by appendicolith or mass more common — always consider underlying malignancy.","level":0}]},{"label":"Pearls","bullets":[{"text":"Pain before vomiting (>90% sensitive) — distinguishes from gastroenteritis, where vomiting often precedes pain.","level":0},{"text":"Migrating periumbilical → RLQ pain is the strongest clinical predictor.","level":0},{"text":"McBurney point is the single most important physical exam sign.","level":0},{"text":"Appendicoliths on CT = higher perforation risk and higher antibiotic failure rate.","level":0},{"text":"In pregnancy: US → MRI (not CT); perforation risk is much higher.","level":0},{"text":"Nonoperative management is an option for uncomplicated appendicitis without appendicoliths, but ~1 in 3 patients will eventually need surgery.","level":0}]}]},{"name":"Celiac Disease","sections":[{"label":"Epidemiology / Genetics","bullets":[{"text":"Affects approximately 1% of the population; an immune-mediated enteropathy triggered by gluten (wheat, barley, rye) in genetically susceptible individuals.","level":0},{"text":"Nearly all patients carry HLA-DQ2 (>90%) or HLA-DQ8 (5–10%); absence of both essentially rules out celiac disease (high negative predictive value).","level":0},{"text":"However, ~35% of the general population carries these alleles, so their presence alone is insufficient for diagnosis.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"Undigested gluten peptides cross the gut lining; tissue transglutaminase (tTG) modifies these peptides, causing strong binding to HLA-DQ2/DQ8 receptors, triggering adaptive and innate immune responses.","level":0},{"text":"Chronic inflammation damages the small intestine — flattened villi (villous atrophy), enlarged crypts (crypt hyperplasia), and immune cell infiltration — impairing absorption of vitamins, minerals, and water.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Classic GI symptoms: diarrhea (~40–50% of patients), bloating, abdominal pain, constipation, steatorrhea, weight loss.","level":0},{"text":"Iron-deficiency anemia refractory to oral supplementation (~32% of adults); osteoporosis/osteopenia (up to 60% of patients).","level":0},{"text":"**Dermatitis herpetiformis**: intensely pruritic, papulovesicular rash on extensor surfaces (elbows, knees, buttocks); diagnosed by granular IgA deposits on perilesional skin biopsy — pathognomonic.","level":0},{"text":"Elevated liver transaminases; neuropsychiatric symptoms (peripheral neuropathy, cerebellar ataxia, migraine); reproductive (infertility, recurrent miscarriage, delayed menarche); pediatric (growth failure, delayed puberty, dental enamel defects).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Serologic-then-biopsy algorithm per ACG guidelines. **1st line: IgA anti-tissue transglutaminase (tTG-IgA)** — sensitivity ~93%, specificity ~98%.","level":0},{"text":"Simultaneously check total serum IgA — selective IgA deficiency occurs in 2–3% of celiac patients and causes false-negative IgA-based tests (use IgG-based testing if deficient).","level":0},{"text":"Confirmatory test in adults: upper endoscopy with ≥4 duodenal biopsies (lesions can be patchy) showing villous atrophy, crypt hyperplasia, >25 intraepithelial lymphocytes.","level":0},{"text":"Endomysial antibody (EMA-IgA): near 100% specificity, used as a confirmatory test.","level":0},{"text":"In children (ESPGHAN guidelines): diagnosis can be made without biopsy if tTG-IgA ≥10× ULN and a separate test is positive for EMA.","level":0},{"text":"Critical point: testing must be performed while the patient is on a gluten-containing diet — a gluten-free diet causes false negatives.","level":0}]},{"label":"Associated Conditions / Screening","bullets":[{"text":"First-degree relatives ~5–10%; Type 1 diabetes 1.6–16.4%; autoimmune thyroid disease (Hashimoto's, Graves') increased.","level":0},{"text":"Down syndrome, Turner syndrome, Williams syndrome — increased risk; selective IgA deficiency — increased risk.","level":0},{"text":"Dermatitis herpetiformis ~100% (DH is essentially celiac disease of the skin).","level":0}]},{"label":"Treatment","bullets":[{"text":"**Strict lifelong gluten-free diet (GFD) is the only effective treatment** — avoid wheat, barley, and rye; dietitian referral recommended at diagnosis.","level":0},{"text":"Symptoms typically improve within days to weeks; diarrhea resolves in ~80% within 60 days. Mucosal healing takes months to years.","level":0},{"text":"tTG-IgA should decline on GFD and is used to monitor adherence; full normalization may take >2 years.","level":0}]},{"label":"Baseline and Follow-up Workup","bullets":[{"text":"CBC, iron/ferritin, folate, vitamins B12/D/A/E, zinc, copper; liver enzymes (AST/ALT); TSH (screen for autoimmune thyroid disease); DEXA scan for bone density in adults; pneumococcal vaccination (hyposplenism risk); screen first-degree relatives.","level":0}]},{"label":"Complications","bullets":[{"text":"Refractory celiac disease: persistent symptoms/villous atrophy despite strict GFD for ≥6–12 months. Type I has no malignant potential; **Type II can progress to enteropathy-associated T-cell lymphoma (EATL).**","level":0},{"text":"Non-Hodgkin lymphoma risk significantly elevated, particularly in the first years after diagnosis and with poor dietary adherence.","level":0},{"text":"Small bowel adenocarcinoma risk increased ~3×; GFD adherence appears to reduce lymphoma risk over time.","level":0}]},{"label":"Pearls","bullets":[{"text":"Celiac disease = HLA-DQ2/DQ8 + gluten + tTG deamidation → villous atrophy.","level":0},{"text":"Best initial test: tTG-IgA (always check total IgA). Best confirmatory test in adults: duodenal biopsy.","level":0},{"text":"Dermatitis herpetiformis = granular IgA on skin biopsy = celiac disease.","level":0},{"text":"Associated with Type 1 diabetes, autoimmune thyroid disease, Down syndrome.","level":0},{"text":"Complication to fear: refractory celiac disease type II → EATL.","level":0}]}]},{"name":"Intussusception","sections":[{"label":"Definition","bullets":[{"text":"Telescoping of one segment of bowel (intussusceptum) into the lumen of an adjacent segment (intussuscipiens).","level":0},{"text":"One of the most common causes of intestinal obstruction in infants and young children.","level":0}]},{"label":"Epidemiology / Risk Factors","bullets":[{"text":"Peak age 5–9 months, with most cases between 3 months and 5 years; boys affected 2–8× more often than girls.","level":0},{"text":"Incidence: approximately 35 per 100,000 infants.","level":0},{"text":"75% of ileocolic intussusceptions are idiopathic; the remainder are associated with a pathologic lead point (10–25%).","level":0},{"text":"Viral infections (especially adenovirus and HHV-6) are associated, likely through lymphoid hyperplasia acting as a trigger.","level":0}]},{"label":"Common Lead Points","bullets":[{"text":"Lymphoid hyperplasia (most common) — following viral/bacterial infection.","level":0},{"text":"Meckel's diverticulum; intestinal polyps; duplication cysts; lymphoma.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"The intussusceptum drags its mesentery into the intussuscipiens → venous congestion → bowel wall edema → arterial compromise → ischemia → necrosis → perforation if untreated.","level":0},{"text":"Most common type: ileocolic (ileum telescopes through the ileocecal valve into the cecum/ascending colon).","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"**Classic triad**: intermittent colicky abdominal pain, currant jelly stool, palpable sausage-shaped mass.","level":0},{"text":"Most common symptoms: intermittent episodic abdominal pain/irritability (>90%), vomiting (often nonbilious initially, ~70%), bloody stools.","level":0},{"text":"Children <12 months more likely to present with emesis, irritability, and guaiac-positive/grossly bloody stools.","level":0},{"text":"High-yield pearl: young infants can present atypically with lethargy or altered mental status — consider intussusception even without classic GI symptoms.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"**Ultrasound is the diagnostic modality of choice — sensitivity >98%, specificity 88–100%.**","level":0},{"text":"Classic findings: \"target sign/doughnut sign\" (transverse view), \"pseudo-kidney sign\" (longitudinal view).","level":0},{"text":"Abdominal radiographs less sensitive but may show absence of gas in the RLQ/ascending colon, a soft-tissue mass, or signs of obstruction/perforation.","level":0}]},{"label":"Management","bullets":[{"text":"Medical/surgical emergency — delay increases risk of surgical intervention and mortality.","level":0},{"text":"**1st line: non-operative enema reduction** (pneumatic with air or hydrostatic with saline/contrast) in hemodynamically stable patients without perforation. Air (pneumatic) enema generally preferred — faster, lower radiation, fewer complications if perforation occurs.","level":0},{"text":"Pressure maintained at 80–120 mmHg; \"rule of threes\" — if no progress after three 5-minute attempts, reduction is likely unsuccessful. Success rate ~66–71%.","level":0},{"text":"If tension pneumoperitoneum occurs: immediate needle decompression at the midline infraumbilical location.","level":0},{"text":"Recurrence after successful reduction: ~5–9%; dexamethasone may reduce recurrence rates.","level":0},{"text":"Surgery indicated when: hemodynamically unstable/peritonitic, evidence of perforation, failed enema reduction, or identified pathologic lead point.","level":0}]},{"label":"Pearls","bullets":[{"text":"Intussusception in a child >5 years → think pathologic lead point (lymphoma, polyp, Meckel's).","level":0},{"text":"Lethargy in an infant with no clear etiology → consider intussusception.","level":0},{"text":"Currant jelly stool = blood mixed with mucus from mucosal sloughing (a late finding).","level":0},{"text":"Most common location = ileocolic. Best initial test = ultrasound (target sign). Best initial treatment = air enema reduction.","level":0},{"text":"Contraindications to enema reduction: perforation, peritonitis, hemodynamic instability.","level":0}]}]},{"name":"Small Bowel Obstruction (SBO)","sections":[{"label":"Epidemiology / Etiology","bullets":[{"text":"Accounts for ~15% of acute surgical GI admissions, with ~350,000 cases annually in the US.","level":0},{"text":"**Adhesions — 65%** (most common cause overall; prior abdominal surgery is the #1 risk factor).","level":0},{"text":"Hernias — 10% (incarcerated inguinal, ventral, or internal hernias; highest strangulation rate ~33%).","level":0},{"text":"Neoplasms — 5%. Crohn disease — 5%. Other (volvulus, gallstone ileus, intussusception, strictures, foreign bodies) — 15%.","level":0},{"text":"Special population: prior Roux-en-Y gastric bypass patients are at high risk for closed-loop obstruction from internal hernias and may not present with classic signs.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"Mechanical obstruction → proximal bowel dilation (swallowed air, accumulated secretions) → increased intraluminal pressure → decreased mucosal perfusion → bacterial overgrowth → risk of ischemia, strangulation, and perforation.","level":0},{"text":"Bowel ischemia increases mortality from ~3% to 30%.","level":0}]},{"label":"Clinical Presentation — The Classic Tetrad","bullets":[{"text":"Colicky abdominal pain (intermittent, crampy; becomes constant when peristalsis ceases).","level":0},{"text":"Nausea and vomiting (bilious = distal to ampulla of Vater; feculent = distal or long-standing obstruction).","level":0},{"text":"Abdominal distension; obstipation/constipation.","level":0}]},{"label":"Physical Exam","bullets":[{"text":"Tympany to percussion, abdominal distension; high-pitched \"tinkling\" bowel sounds early → absent late (neither sensitive nor specific).","level":0},{"text":"Red flags for strangulation/ischemia: fever, tachycardia, hypotension, involuntary guarding, rebound tenderness, abdominal rigidity.","level":0}]},{"label":"Key Classifications","bullets":[{"text":"Partial vs. complete: partial allows some gas/fluid passage; complete does not (higher surgical/strangulation rates).","level":0},{"text":"Simple vs. complicated: simple = no vascular compromise; complicated = ischemia, strangulation, or perforation (requires urgent surgery).","level":0},{"text":"Closed-loop obstruction: bowel obstructed at two points, trapping a segment — surgical emergency, high risk of rapid ischemia, will not resolve nonoperatively.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Labs: CBC (leukocytosis, bandemia), BMP (electrolyte derangements, AKI from dehydration), lactate (elevated suggests ischemia), lipase (rule out pancreatitis).","level":0},{"text":"Abdominal x-ray (KUB): may show dilated small bowel loops with air-fluid levels but cannot exclude SBO (limited sensitivity).","level":0},{"text":"**CT abdomen/pelvis with IV contrast is the gold standard** — dilated proximal bowel (>3 cm) with decompressed distal bowel, a transition point, signs of ischemia (decreased/absent bowel wall enhancement, wall thickening, mesenteric edema, ascites, pneumatosis intestinalis, portal venous gas).","level":0},{"text":"Small bowel feces sign — particulate matter in dilated small bowel; its absence may predict need for surgery.","level":0}]},{"label":"Management","bullets":[{"text":"Nonoperative management successful in ~65–80% of cases (especially partial SBO): NPO, IV fluid resuscitation/electrolyte correction, NGT decompression, surgery consult, serial abdominal exams/labs.","level":0},{"text":"Gastrografin (water-soluble contrast) is both diagnostic and therapeutic — contrast reaching the colon on follow-up x-ray (typically 8–24 hours) predicts nonoperative success.","level":0},{"text":"Most patients improve within 2–5 days; failure to improve by 3–5 days suggests need for surgery.","level":0},{"text":"Indications for surgery: peritonitis or strangulation/ischemia signs, closed-loop obstruction, irreducible hernia, complete obstruction failing to resolve, failure of nonoperative management (persistent pain, no return of bowel function, NGT output >500 mL after 72 hours).","level":0}]},{"label":"Differential Diagnosis","bullets":[{"text":"Paralytic (adynamic) ileus, large bowel obstruction, colonic pseudo-obstruction (Ogilvie syndrome), mesenteric ischemia, narcotic bowel.","level":0},{"text":"Key differentiator: SBO is a mechanical obstruction with a transition point, whereas ileus involves diffusely dilated bowel without a transition point.","level":0}]},{"label":"Mortality","bullets":[{"text":"Uncomplicated SBO: ~3–10%. SBO with bowel necrosis/perforation: up to 30%.","level":0},{"text":"Delay in treatment >24 hours is independently associated with increased death and complications.","level":0}]}]},{"name":"Small Bowel Polyps & Polyposis Syndromes","sections":[{"label":"Overview","bullets":[{"text":"The small bowel comprises 90% of the GI mucosal surface area but accounts for only ~3% of GI tract tumors.","level":0},{"text":"Small bowel polyps are most clinically significant in the context of hereditary polyposis syndromes.","level":0},{"text":"Sporadic benign lesions (lipomas, leiomyomas, neurofibromas, adenomas) also occur but are far less commonly tested.","level":0}]},{"label":"Key Polyposis Syndromes","bullets":[{"text":"**Peutz-Jeghers (PJS)** — STK11 gene (AD); hamartomatous polyps (arborizing smooth muscle bands); mucocutaneous pigmentation (lips, buccal mucosa), small bowel intussusception; cancer risk: 93% lifetime any cancer, small bowel 13%, CRC 39%, breast 54%, pancreas 11–36%.","level":0},{"text":"**Familial Adenomatous Polyposis (FAP)** — APC gene (AD); adenomatous polyps; >100 colonic adenomas, duodenal adenomas common, desmoid tumors, CHRPE, osteomas; CRC ~100% untreated, duodenal cancer 1–10%.","level":0},{"text":"**Juvenile Polyposis (JPS)** — SMAD4 or BMPR1A (AD); juvenile/inflammatory polyps; GI bleeding/anemia in childhood, SMAD4 carriers → HHT overlap; CRC up to 39–68%, gastric cancer (especially with SMAD4).","level":0},{"text":"**Cowden/PTEN Hamartoma Tumor Syndrome** — PTEN (AD); hamartomas, ganglioneuromas, mixed polyps; macrocephaly, trichilemmomas, oral papillomas, Lhermitte-Duclos disease; increased breast, thyroid, endometrial, renal, and colorectal cancer risk.","level":0}]},{"label":"Peutz-Jeghers Syndrome — Detail","bullets":[{"text":"The prototype for small bowel polyposis; autosomal dominant, caused by a mutation in the STK11 gene.","level":0},{"text":"Mucocutaneous pigmentation (dark blue/brown macules on lips, buccal mucosa, perioral area, hands, feet) present in >95% of patients, often appearing in infancy before GI symptoms.","level":0},{"text":"Small bowel polyps present in 75% of cases, most commonly jejunum > ileum > duodenum; histology shows arborizing muscularis mucosae through the lamina propria, covered by hyperplastic glandular mucosa.","level":0},{"text":"Most feared complication: intussusception — by age 20, ~half of PJS patients present with small bowel obstruction from intussusception. Polyps >15 mm should be treated to prevent this.","level":0},{"text":"Cancer risk is extraordinary: absolute risk of any cancer between ages 15–64 is ~93% (relative risk 15.2); the small intestine has the highest relative risk (RR 520) of any organ.","level":0},{"text":"Surveillance begins at age 8 with EGD, colonoscopy, and small bowel imaging (capsule endoscopy or MR enterography), repeated every 2–3 years.","level":0}]},{"label":"FAP and the Small Bowel","bullets":[{"text":"Duodenal adenomas occur in the majority of FAP patients and represent the leading cause of cancer death after prophylactic colectomy.","level":0},{"text":"Jejunal and ileal polyps also carry malignant potential via the adenoma-carcinoma sequence and require periodic surveillance and endoscopic resection.","level":0}]},{"label":"Clinical Presentation (All Causes)","bullets":[{"text":"GI bleeding (occult or overt) with iron deficiency anemia — most common presentation.","level":0},{"text":"Abdominal pain and distention; intussusception and bowel obstruction (especially PJS).","level":0},{"text":"Many small bowel polyps are asymptomatic, discovered incidentally or during surveillance.","level":0}]},{"label":"Diagnosis and Management","bullets":[{"text":"Capsule endoscopy is the primary noninvasive modality for small bowel visualization; MR enterography is complementary, with similar diagnostic yield for lesions ≥15 mm.","level":0},{"text":"Double-balloon enteroscopy (DBE): allows both diagnosis and therapeutic polypectomy throughout the small bowel, largely replacing surgical resection as 1st-line management.","level":0},{"text":"Small bowel polyps ≥10 mm in PJS should be removed to prevent intussusception; in FAP, resection is recommended for every adenoma >1 cm.","level":0},{"text":"When surgery is required (e.g., intussusception), a \"clean sweep\" approach with intraoperative enteroscopy to remove all polyps decreases the need for repeat surgery.","level":0}]},{"label":"Pearls","bullets":[{"text":"Dark macules crossing the vermillion border of the lip + small bowel intussusception in a young patient = Peutz-Jeghers syndrome (STK11 gene).","level":0},{"text":"Hamartomatous polyp with arborizing smooth muscle = PJ polyp.","level":0},{"text":"SMAD4 mutation + juvenile polyps + epistaxis/telangiectasias = JPS-HHT overlap.","level":0},{"text":"Duodenal adenomas in a patient with known FAP = leading cause of cancer death post-colectomy.","level":0}]}]}],"questions":[{"q":"What is the difference between true gastritis and reactive gastritis?","a":"True gastritis involves an inflammatory cell infiltrate; reactive gastritis (from NSAIDs, alcohol, bile reflux) causes mucosal injury/overgrowth with very little true inflammation."},{"q":"What is the most common cause of chronic gastritis worldwide?","a":"Helicobacter pylori infection."},{"q":"What autoantibodies are associated with autoimmune gastritis?","a":"Anti-parietal cell antibodies and anti-intrinsic factor antibodies."},{"q":"What is the gold standard for diagnosing gastritis?","a":"Histology, obtained via endoscopic biopsy."},{"q":"What is the first-line H. pylori eradication regimen per the ACG guideline?","a":"Bismuth quadruple therapy for 14 days — PPI + bismuth + tetracycline + metronidazole."},{"q":"Describe the Correa Cascade progression to gastric cancer.","a":"Normal tissue → chronic gastritis → atrophic gastritis → intestinal metaplasia → dysplasia → gastric adenocarcinoma."},{"q":"What are the \"Big Three P's\" of gastroparesis etiology?","a":"Idiopathic, Diabetic, and Postsurgical."},{"q":"What is the gold standard test for diagnosing gastroparesis?","a":"4-hour gastric emptying scintigraphy using a labeled low-fat egg-white meal."},{"q":"What is the only FDA-approved medication for gastroparesis, and what is its major safety concern?","a":"Metoclopramide; it carries a Black Box Warning for tardive dyskinesia (avoid use beyond 12 weeks)."},{"q":"What are the \"Big Three\" etiologies of peptic ulcer disease?","a":"H. pylori infection, NSAIDs/aspirin, and idiopathic."},{"q":"How does the pain pattern of a duodenal ulcer differ from a gastric ulcer?","a":"Duodenal ulcer pain improves with eating and worsens 2–3 hours later (often nocturnal); gastric ulcer pain is postprandial with nausea, vomiting, and weight loss."},{"q":"What is the gold standard diagnostic test for peptic ulcer disease?","a":"EGD (upper endoscopy)."},{"q":"Why must gastric ulcers always be biopsied?","a":"To rule out malignancy."},{"q":"What underlying condition should be suspected when ulcers are multiple, distal (jejunal), or refractory to PPI therapy?","a":"Zollinger-Ellison syndrome."},{"q":"What is the classic presentation of infantile hypertrophic pyloric stenosis?","a":"Nonbilious, projectile vomiting in a \"hungry vomiter.\""},{"q":"What acid-base/electrolyte abnormality is classically seen with pyloric stenosis?","a":"Hypochloremic, hypokalemic metabolic alkalosis."},{"q":"What is the gold standard imaging study for diagnosing pyloric stenosis?","a":"Abdominal ultrasound."},{"q":"What is the definitive surgical treatment for pyloric stenosis?","a":"Ramstedt pyloromyotomy."},{"q":"What does bilious vomiting in an infant suggest, as opposed to nonbilious vomiting?","a":"Obstruction distal to the ampulla of Vater (e.g., malrotation with midgut volvulus — a surgical emergency)."},{"q":"What clinical sign strongly suggests an upper GI bleed?","a":"Hematemesis (bloody or coffee-ground emesis)."},{"q":"What is the most common cause of upper GI bleeding?","a":"Peptic ulcer disease."},{"q":"What is the most common cause of lower GI bleeding?","a":"Diverticulosis."},{"q":"What scoring system is best validated for predicting need for intervention or death in upper GI bleeding, and what score identifies low-risk patients safe for outpatient management?","a":"The Glasgow-Blatchford Score (GBS); a GBS ≤1 identifies low-risk patients."},{"q":"In endoscopic hemostasis for GI bleeding, why should epinephrine injection never be used alone?","a":"It must be combined with a second modality (thermal therapy or clips) for adequate hemostasis."},{"q":"What two types of medications should be started empirically at presentation for suspected variceal bleeding?","a":"Antibiotics (e.g., ceftriaxone) and a vasoactive drug (e.g., octreotide or terlipressin)."},{"q":"What is the key pathophysiologic mechanism of acute appendicitis?","a":"Appendiceal luminal obstruction leading to increased intraluminal pressure, ischemia, necrosis, and perforation."},{"q":"What is the most common cause of appendiceal obstruction in young adults?","a":"Lymphoid follicular hyperplasia."},{"q":"What physical exam finding is the single most important sign of appendicitis?","a":"McBurney point tenderness."},{"q":"What lab test is mandatory in women of reproductive age with suspected appendicitis?","a":"Beta-hCG, to exclude ectopic pregnancy."},{"q":"What is the first-line imaging modality for appendicitis in adults, and what is preferred in children/pregnant patients?","a":"CT abdomen/pelvis with IV contrast in adults; ultrasound in children and pregnant patients."},{"q":"What percentage of patients with uncomplicated appendicitis can be successfully treated with antibiotics alone?","a":"Approximately 70%."},{"q":"What genetic markers are associated with celiac disease?","a":"HLA-DQ2 and HLA-DQ8."},{"q":"What is the pathognomonic skin finding of celiac disease, and how is it diagnosed?","a":"Dermatitis herpetiformis, diagnosed by granular IgA deposits on perilesional skin biopsy."},{"q":"What is the first-line serologic test for celiac disease, and what must be checked simultaneously?","a":"IgA anti-tissue transglutaminase (tTG-IgA); total serum IgA must be checked to rule out selective IgA deficiency."},{"q":"Why must celiac disease testing be performed while the patient is still eating gluten?","a":"A gluten-free diet before testing causes false-negative results."},{"q":"What is the only effective treatment for celiac disease?","a":"A strict, lifelong gluten-free diet."},{"q":"What is the feared malignant complication of refractory celiac disease type II?","a":"Enteropathy-associated T-cell lymphoma (EATL)."},{"q":"What is the classic triad of intussusception?","a":"Intermittent colicky abdominal pain, currant jelly stool, and a palpable sausage-shaped mass."},{"q":"What is the most common lead point of intussusception in children, and what is the most common anatomic type?","a":"Lymphoid hyperplasia; the ileocolic type."},{"q":"What is the diagnostic modality of choice for intussusception, and what is the classic ultrasound finding?","a":"Ultrasound; the \"target/doughnut sign.\""},{"q":"What is the first-line treatment for intussusception in a stable patient without perforation?","a":"Non-operative enema reduction (air/pneumatic enema preferred)."},{"q":"What is the most common cause of small bowel obstruction overall?","a":"Adhesions, typically from prior abdominal surgery."},{"q":"What is the classic clinical tetrad of small bowel obstruction?","a":"Colicky abdominal pain, nausea/vomiting, abdominal distension, and obstipation/constipation."},{"q":"What CT finding differentiates a mechanical small bowel obstruction from an ileus?","a":"SBO shows a transition point; ileus shows diffusely dilated bowel without a transition point."},{"q":"What type of small bowel obstruction is considered a surgical emergency due to risk of rapid ischemia?","a":"Closed-loop obstruction."},{"q":"What contrast agent, when used diagnostically, can also predict successful nonoperative management of SBO if it reaches the colon?","a":"Gastrografin (water-soluble contrast)."},{"q":"What gene mutation causes Peutz-Jeghers syndrome, and what is its most feared small bowel complication?","a":"STK11 gene mutation; intussusception."},{"q":"What is the characteristic physical exam finding in Peutz-Jeghers syndrome?","a":"Mucocutaneous pigmentation — dark blue/brown macules on the lips, buccal mucosa, perioral area, hands, and feet."},{"q":"In familial adenomatous polyposis (FAP), what is the leading cause of cancer death after prophylactic colectomy?","a":"Duodenal adenomas/duodenal cancer."},{"q":"What is the primary noninvasive diagnostic modality for visualizing small bowel polyps, and what technique allows both diagnosis and therapeutic polypectomy throughout the small bowel?","a":"Capsule endoscopy; double-balloon enteroscopy (DBE)."}],"examQuestions":[{"stem":"A 55-year-old man undergoes endoscopic biopsy for chronic dyspepsia. Pathology shows corpus-predominant glandular atrophy with antral sparing, and labs reveal iron deficiency anemia and low B12. Which underlying mechanism best explains this pattern?","options":["COX-1 inhibition reducing prostaglandin-mediated mucosal defense","Autoantibodies directed against parietal cells and intrinsic factor","Fibroblast activation from long-standing acid exposure","Eosinophil-mediated epithelial injury triggered by food antigens","Direct bacterial disruption of epithelial tight junctions by a flagellated organism"],"correctIndex":1,"explanations":["This describes NSAID-induced gastropathy, which does not classically produce corpus-predominant atrophy with autoimmune serologies.","Correct — autoimmune gastritis involves autoantibodies against parietal cells and intrinsic factor, causing corpus-predominant atrophy with antral sparing and malabsorption of B12/iron.","This describes stricture formation, unrelated to this atrophic/autoimmune pattern.","This describes eosinophilic esophagitis, a distinct disease process from gastric autoimmune atrophy.","This describes H. pylori gastritis, which more classically produces antral-predominant or pangastritis patterns rather than the antral-sparing pattern described."],"topic":"Gastritis"},{"stem":"A 60-year-old man with chronic H. pylori infection has endoscopic biopsies showing gastric atrophy and intestinal metaplasia. Using the staging system referenced in lecture to assess neoplasia risk, which stage would be most concerning and warrant closer surveillance?","options":["OLGA stage I","OLGA stage II","There is no meaningful staging distinction","OLGA stage III–IV","OLGA stage 0"],"correctIndex":3,"explanations":["Stage I carries near-zero neoplasia risk.","Stage II carries near-zero neoplasia risk.","The OLGA system is specifically designed to stratify neoplasia risk, so this is incorrect.","Correct — OLGA stages III–IV carry significantly elevated neoplasia risk and warrant closer attention.","Stage 0 carries near-zero neoplasia risk."],"topic":"Gastritis"},{"stem":"A patient with chronic gastritis is being evaluated for H. pylori eradication. Which first-line regimen is preferred per the ACG guideline referenced in lecture?","options":["Bismuth quadruple therapy for 14 days","A single antibiotic for 5 days","PPI monotherapy indefinitely","H2 blocker monotherapy for 8 weeks","Triple therapy with a PPI, clarithromycin, and amoxicillin for 7 days"],"correctIndex":0,"explanations":["Correct — bismuth quadruple therapy for 14 days is the preferred first-line regimen per the ACG guideline referenced in lecture.","Single-antibiotic therapy is inadequate for H. pylori eradication.","PPI monotherapy alone does not eradicate H. pylori.","H2 blocker monotherapy does not eradicate H. pylori.","This shorter triple regimen is not the preferred first-line option described in this lecture."],"topic":"Gastritis"},{"stem":"A 45-year-old woman with dyspepsia and no alarm features is being evaluated. She is 55 years old. According to the dyspepsia workup discussed in lecture, what is the most appropriate initial approach?","options":["CT abdomen with contrast as the first step","No further evaluation is needed","Test-and-treat for H. pylori, since she is under 60 without alarm features","Immediate surgical referral","EGD regardless of age or alarm features"],"correctIndex":2,"explanations":["CT is not the described first step for uncomplicated dyspepsia.","Some evaluation (test-and-treat) is indicated for her symptoms.","Correct — for patients under 60 without alarm features, a test-and-treat strategy for H. pylori is preferred over endoscopy given the low malignancy risk in this age group.","Surgical referral is not indicated without a confirmed diagnosis.","EGD is reserved for those 60 and older with new-onset dyspepsia or those with alarm features."],"topic":"Gastritis"},{"stem":"A patient with chronic atrophic gastritis related to autoimmune destruction of parietal cells is at increased risk for which type of gastric tumor, according to lecture?","options":["Gastric lymphoma","Krukenberg tumor","Type 1 gastric neuroendocrine tumor","Gastrointestinal stromal tumor","Squamous cell carcinoma"],"correctIndex":2,"explanations":["Gastric lymphoma is not the tumor type specifically linked to autoimmune gastritis in this lecture.","Krukenberg tumor refers to metastatic disease to the ovary, not a primary complication of autoimmune gastritis discussed here.","Correct — Type 1 gastric neuroendocrine tumors can form when overactive gastrin secretion (driven by autoimmune gastritis and achlorhydria) causes hyperplasia of certain gastric cells.","GIST is not the tumor type linked to autoimmune gastritis in this lecture.","Squamous cell carcinoma is an esophageal tumor type, not a described complication of gastric autoimmune atrophy."],"topic":"Gastritis"},{"stem":"A 68-year-old woman presents with early satiety, postprandial fullness, nausea, and vomiting. Mechanical obstruction has been excluded by EGD. She has no history of diabetes and takes no opioids or anticholinergic medications. Which etiology is statistically most likely to explain her gastroparesis?","options":["Diabetic gastroparesis","Medication-induced gastroparesis","Connective tissue disease-related gastroparesis","Postsurgical gastroparesis","Idiopathic gastroparesis"],"correctIndex":4,"explanations":["Diabetic gastroparesis accounts for roughly 25% of cases, and she has no diabetes history.","She is not taking medications associated with delayed gastric emptying.","No connective tissue disease history is provided to support this etiology.","She has no surgical history provided to suggest a postsurgical cause.","Correct — idiopathic gastroparesis is the largest etiologic group when no clear cause, such as diabetes, surgery, or medications, is identified."],"topic":"Gastroparesis"},{"stem":"A patient is scheduled for gastric emptying scintigraphy to evaluate for gastroparesis. Which pretest step is essential to avoid a false-positive result?","options":["Ensure blood glucose is above 300 mg/dL on the day of testing","No pretest preparation is required","Discontinue medications that delay gastric emptying 48–72 hours before testing","Perform the test only after eating a high-fat meal","Continue all opioid and anticholinergic medications as usual"],"correctIndex":2,"explanations":["Hyperglycemia itself delays gastric emptying and should be controlled below 180–250 mg/dL before testing, not elevated.","Pretest preparation, including medication holds and glucose control, is essential for accurate results.","Correct — medications that delay gastric emptying, such as opioids, anticholinergics, prokinetics, and antiemetics, should be held 48–72 hours before testing.","The test uses a standardized low-fat egg-white meal, not a high-fat meal.","Continuing these medications risks a false impression of delayed emptying not representative of the patient's baseline."],"topic":"Gastroparesis"},{"stem":"A patient begins metoclopramide for gastroparesis. After several months of use, she develops involuntary repetitive movements of her face and tongue. Which adverse effect has occurred, and what does this suggest about her treatment duration?","options":["Tardive dyskinesia; use beyond 12 weeks should generally be avoided","QT prolongation; medication should be increased","Anaphylaxis; medication should be restarted at a lower dose","Hyperthyroidism; medication has no restriction on duration","Serotonin syndrome; medication should be continued"],"correctIndex":0,"explanations":["Correct — metoclopramide carries a Black Box Warning for tardive dyskinesia, and use beyond 12 weeks should generally be avoided.","This describes tardive dyskinesia, not QT prolongation, and the medication should be stopped, not increased.","This does not describe an anaphylactic reaction.","This is not a thyroid-related adverse effect.","This does not describe serotonin syndrome, and continuing the medication would worsen this adverse effect."],"topic":"Gastroparesis"},{"stem":"A patient with gastroparesis has failed dietary modification and metoclopramide, and continues to have significant nausea and vomiting. Which next-line intervention has largely replaced surgical pyloroplasty and botulinum toxin injection for refractory cases?","options":["Erythromycin as a permanent long-term therapy","Long-term opioid therapy for symptom control","Gastric per-oral endoscopic myotomy (G-POEM)","Corticosteroid taper","Immediate total gastrectomy"],"correctIndex":2,"explanations":["Erythromycin is limited by tachyphylaxis and is not a long-term solution, nor has it replaced these other interventions.","Opioids can worsen gastroparesis and are not a treatment for it.","Correct — G-POEM has largely replaced surgical pyloroplasty and botulinum toxin injection for refractory gastroparesis.","Corticosteroids are not a described treatment for gastroparesis.","Total gastrectomy is not the described next step for refractory gastroparesis."],"topic":"Gastroparesis"},{"stem":"A researcher is studying the mechanism of diabetic gastroparesis. Damage to which specific cell type within the gastric wall is most directly implicated in the loss of normal pacemaker activity?","options":["G cells","Goblet cells","Interstitial cells of Cajal","Chief cells","Parietal cells"],"correctIndex":2,"explanations":["G cells secrete gastrin, unrelated to pacemaker function.","Goblet cells secrete mucus in the intestine/colon, unrelated to gastric pacemaker activity.","Correct — loss of the interstitial cells of Cajal, the stomach's pacemaker cells, is implicated in diabetic gastroparesis.","Chief cells secrete pepsinogen, unrelated to pacemaker function.","Parietal cells secrete acid and intrinsic factor, unrelated to pacemaker activity."],"topic":"Gastroparesis"},{"stem":"A 40-year-old man presents with dyspepsia. His workup reveals peptic ulcer disease. Based on the etiology breakdown discussed in lecture, which single cause accounts for the largest proportion of PUD cases?","options":["H. pylori infection","Zollinger-Ellison syndrome","Idiopathic causes","NSAID/aspirin use","Critical illness stress ulceration"],"correctIndex":0,"explanations":["Correct — H. pylori accounts for approximately 42% of PUD cases, the largest single cause described.","Zollinger-Ellison syndrome is a rare cause of PUD, not the most common.","Idiopathic causes account for approximately 22%, the third most common category.","NSAIDs/aspirin account for approximately 36% of cases, the second most common cause.","Critical illness (stress ulcers) is a minor contributor, not the leading cause."],"topic":"Peptic Ulcer Disease"},{"stem":"A patient with a bleeding peptic ulcer is being risk-stratified using a validated bleeding score. According to lecture, a Glasgow-Blatchford Score of what value identifies patients who may be safely managed as outpatients?","options":["Score of 10 or higher","Score of 1 or less","Score of 5–7","There is no validated score for this purpose","Score of 15 or higher"],"correctIndex":1,"explanations":["A higher score suggests greater risk, not eligibility for outpatient management.","Correct — a GBS of ≤1 identifies very low-risk patients who may be safely managed as outpatients.","This range is not the described threshold for safe outpatient management.","The GBS is explicitly described as a validated score for this purpose.","A score this high would indicate significant risk, not eligibility for outpatient management."],"topic":"Peptic Ulcer Disease"},{"stem":"A patient with a perforated peptic ulcer is found on exploration to have a defect on the anterior wall of the duodenum. Based on the anatomic tendencies discussed in lecture, why are anterior duodenal ulcers more likely to cause this particular complication compared to posterior ulcers?","options":["Anterior location has no bearing on complication type","Anterior ulcers are more likely to free perforate into the peritoneum, while posterior ulcers are more likely to erode into adjacent vascular structures","Posterior ulcers are more likely to perforate into the peritoneum than anterior ulcers","Anterior ulcers exclusively cause gastric outlet obstruction","Anterior ulcers always heal spontaneously without complication"],"correctIndex":1,"explanations":["Anatomic location is explicitly linked to complication type in this lecture.","Correct — anterior duodenal ulcers are more likely to freely perforate into the peritoneum, while posterior ulcers are more likely to erode into vascular structures such as the gastroduodenal artery.","This reverses the correct anatomic relationship described in lecture.","Gastric outlet obstruction relates to pyloric scarring, not specifically anterior duodenal ulcer location.","Anterior ulcers are not universally benign and can perforate."],"topic":"Peptic Ulcer Disease"},{"stem":"A patient presents with recurrent peptic ulcers that are refractory to standard-dose PPI therapy, with endoscopy revealing an unusually distal jejunal ulcer. Which diagnostic test should be obtained to evaluate for a rare underlying cause?","options":["Fasting serum gastrin level","Serum lipase","Anti-tissue transglutaminase antibody","Alpha-fetoprotein","Fecal calprotectin"],"correctIndex":0,"explanations":["Correct — refractory, multiple, or distally located (jejunal) ulcers should raise suspicion for Zollinger-Ellison syndrome, evaluated with a fasting serum gastrin level.","Serum lipase evaluates for pancreatitis, not gastrin-secreting tumors.","Anti-tTG antibody evaluates for celiac disease, not ZES.","AFP is a hepatocellular carcinoma marker, unrelated to this presentation.","Fecal calprotectin evaluates for intestinal inflammation, not ZES."],"topic":"Peptic Ulcer Disease"},{"stem":"A patient with confirmed PUD and active NSAID use is counseled on modifying therapy. Per the risk factor and treatment discussion in lecture, which combination represents the best strategy if NSAID therapy cannot be discontinued in a high-risk patient?","options":["Add an H2 blocker only, with no other changes","Increase the NSAID dose to reduce total pills needed","Continue the NSAID with no additional therapy","Switch to a COX-2 selective agent combined with a PPI","Add an SSRI to counteract gastric effects"],"correctIndex":3,"explanations":["An H2 blocker alone is not the described optimal strategy for high-risk patients.","Increasing the NSAID dose would increase, not decrease, ulcer risk.","Continuing the NSAID without additional protection is inappropriate in a high-risk patient.","Correct — combining a COX-2 selective agent with a PPI is the recommended approach for the highest-risk patients who cannot discontinue NSAID therapy.","Adding an SSRI would actually increase, not decrease, bleeding risk in this context."],"topic":"Peptic Ulcer Disease"},{"stem":"A 3-week-old male infant, born full-term to a first-time mother, presents with forceful vomiting immediately after feeds. The vomitus does not contain bile, and the infant remains eager to feed again shortly after vomiting. Which additional history or exam finding would most support the leading diagnosis?","options":["Petechial rash on the trunk","A palpable olive-shaped mass in the right upper quadrant","Currant jelly stools","Bilious vomiting with abdominal distension","Delayed passage of meconium at birth"],"correctIndex":1,"explanations":["A petechial rash is not a described finding for this condition.","Correct — a palpable olive-shaped mass in the RUQ/epigastrium supports the diagnosis of infantile hypertrophic pyloric stenosis, consistent with this presentation.","Currant jelly stools are associated with intussusception, not pyloric stenosis.","Bilious vomiting would suggest an obstruction distal to the ampulla of Vater, not this proximal process.","Delayed meconium passage suggests Hirschsprung disease, not pyloric stenosis."],"topic":"Pyloric Stenosis"},{"stem":"An infant with confirmed hypertrophic pyloric stenosis has been vomiting gastric contents for several days. Laboratory studies would most likely reveal which acid-base and electrolyte pattern?","options":["Hyperchloremic, hyperkalemic metabolic acidosis","Normal electrolytes with respiratory alkalosis","Hypercalcemia with metabolic acidosis","Hypochloremic, hypokalemic metabolic alkalosis","Hyponatremia with respiratory acidosis"],"correctIndex":3,"explanations":["This is the opposite of the expected pattern from loss of gastric acid.","This does not reflect the classic electrolyte derangement described for this condition.","Hypercalcemia is not the described finding in pyloric stenosis.","Correct — persistent vomiting of gastric HCl causes hypochloremic, hypokalemic metabolic alkalosis with paradoxical aciduria.","This does not reflect the classic pattern described for pyloric stenosis."],"topic":"Pyloric Stenosis"},{"stem":"An infant is diagnosed with pyloric stenosis via ultrasound. Before proceeding to pyloromyotomy, what is the most critical preoperative step?","options":["Initiation of oral rehydration therapy only","Administration of broad-spectrum IV antibiotics as the priority","Immediate surgery without delay, regardless of electrolyte status","Correction of dehydration and electrolyte abnormalities, particularly chloride and potassium, with IV fluids","Placement of a nasogastric tube for decompression as the sole intervention"],"correctIndex":3,"explanations":["Oral rehydration is inadequate for a vomiting infant with significant electrolyte derangement.","Antibiotics are not the described priority for this noninfectious surgical emergency.","Surgery without correcting electrolytes first increases anesthetic risk, particularly for apnea from alkalosis.","Correct — correcting dehydration and electrolyte abnormalities, especially chloride and potassium, is critical before surgery to reduce anesthetic risk.","NGT decompression is not the primary described preoperative priority for this condition."],"topic":"Pyloric Stenosis"},{"stem":"An ultrasound performed on an infant with suspected pyloric stenosis shows a pyloric muscle thickness of 4 mm and a pyloric canal length of 18 mm, along with a target sign on transverse imaging. How should these findings be interpreted?","options":["Nondiagnostic, requiring an upper GI barium study regardless","Consistent with malrotation with volvulus","Consistent with the diagnosis of pyloric stenosis","Consistent with intussusception","Normal pylorus, no further workup needed"],"correctIndex":2,"explanations":["Ultrasound with these classic findings is diagnostic; a barium study is not routinely required.","Malrotation with volvulus is not diagnosed by these pyloric measurements.","Correct — pyloric muscle thickness ≥3 mm and canal length ≥14–16 mm, along with a target sign, are diagnostic of pyloric stenosis on ultrasound.","Intussusception is diagnosed by a different target/doughnut sign location and a pseudokidney sign, not pyloric measurements.","These measurements exceed the normal thresholds and are not a normal finding."],"topic":"Pyloric Stenosis"},{"stem":"A patient presents with melena and is found to have a disproportionately elevated BUN relative to creatinine. A Glasgow-Blatchford Score is calculated. According to lecture, which GBS value predicts a likely need for endoscopic therapy?","options":["A GBS applies only to lower GI bleeding","A GBS of 1","A GBS is not useful for this purpose","A GBS of 0","A GBS of 7 or higher"],"correctIndex":4,"explanations":["The GBS is specifically discussed in the context of upper GI bleeding risk stratification.","A GBS of 1 also falls in the low-risk range for outpatient management.","The GBS is explicitly validated for predicting need for intervention or death in upper GI bleeding.","A GBS of 0 suggests very low risk, not a predicted need for intervention.","Correct — a GBS ≥7 predicts a likely need for endoscopic therapy."],"topic":"GI Bleeding"},{"stem":"A patient presents with hematochezia and hemodynamic instability. Which diagnostic approach is most appropriate as the initial study to localize the source of bleeding, given the inability to tolerate bowel preparation and colonoscopy at this time?","options":["Barium enema","Colonoscopy after bowel prep","Upper GI series with barium","CT angiography","Capsule endoscopy"],"correctIndex":3,"explanations":["Barium enema is not the described initial study for acute unstable GI bleeding.","Colonoscopy requires bowel prep and hemodynamic stability, both of which are problematic in this unstable patient.","An upper GI series would not address a lower GI bleeding source suggested by hematochezia.","Correct — for hemodynamically unstable patients or those with suspected ongoing bleeding, CT angiography is the initial study to localize the bleeding source.","Capsule endoscopy is not appropriate for acute unstable lower GI bleeding evaluation."],"topic":"GI Bleeding"},{"stem":"A patient with acute lower GI bleeding is risk-stratified using the Oakland score. According to lecture, what threshold identifies patients at low risk for adverse events who are generally safe for outpatient management?","options":["A score of exactly 20","A score of 8 or less out of a possible 35","There is no validated threshold described","A score of 30 or higher","A score of 8 or higher out of a possible 15"],"correctIndex":1,"explanations":["This value was not identified as the threshold in lecture.","Correct — an Oakland score of ≤8 out of a possible 35 identifies patients at low risk who are generally safe for outpatient management.","The Oakland score is explicitly described as a validated risk-stratification tool.","A high score like this would suggest higher, not lower, risk.","This does not match the described scoring range (out of 35, not 15)."],"topic":"GI Bleeding"},{"stem":"Approximately what proportion of acute lower GI bleeding episodes stop spontaneously without intervention, according to lecture?","options":["About 50%","About 25%","About 95%","About 75%","About 10%"],"correctIndex":3,"explanations":["This underestimates the proportion described in lecture.","This underestimates the proportion described in lecture.","This overestimates the proportion described in lecture.","Correct — approximately 75% of LGIB episodes stop spontaneously.","This underestimates the proportion described in lecture."],"topic":"GI Bleeding"},{"stem":"A patient with cirrhosis presents with GI bleeding. According to the pearls discussed in lecture, what should the initial management assumption be regarding the source of bleeding, and what should be started empirically?","options":["Assume an ischemic colitis source; start anticoagulation","Assume a Mallory-Weiss source; start antifungals","Assume a variceal source; start antibiotics and vasopressors empirically","Assume a malignancy source; start chemotherapy","Assume a diverticular source; start antibiotics only"],"correctIndex":2,"explanations":["Anticoagulation would worsen active GI bleeding and is not indicated here.","Antifungals are not indicated for this presentation.","Correct — in cirrhotic patients with GI bleeding, a variceal source should be assumed until proven otherwise, with empiric antibiotics and vasopressors started.","Chemotherapy is not an acute management step for GI bleeding.","Diverticulosis is not the assumed source in a cirrhotic patient with GI bleeding per this lecture's guidance."],"topic":"GI Bleeding"},{"stem":"A 22-year-old woman presents with five days of worsening right lower quadrant pain, anorexia, nausea, and subjective fevers. On exam, she has pain in the RLQ when the examiner palpates the LLQ. Which physical exam sign is being elicited?","options":["Psoas sign","Rovsing sign","Obturator sign","McBurney point tenderness","Murphy sign"],"correctIndex":1,"explanations":["Psoas sign involves passive right hip extension, not LLQ palpation.","Correct — Rovsing sign is RLQ pain elicited with palpation of the LLQ.","Obturator sign involves hip flexion with internal rotation, not LLQ palpation.","McBurney point tenderness is direct tenderness at a specific RLQ location, not pain referred from the LLQ.","Murphy sign relates to gallbladder pathology, not appendicitis."],"topic":"Appendicitis"},{"stem":"A pathophysiology question asks a student to explain why early appendicitis classically causes vague periumbilical pain before localizing to the right lower quadrant. Which explanation is correct?","options":["There is no physiologic explanation; the pattern is coincidental","Somatic nerve stimulation occurs first, followed later by visceral stimulation","The pain pattern is due to referred cardiac innervation","Direct irritation of the parietal peritoneum from the start of the disease process","Initial visceral afferent stimulation via T8–T10 nerves, followed by somatic nerve stimulation once inflammation reaches the parietal peritoneum"],"correctIndex":4,"explanations":["This pain pattern has a clear, described physiologic explanation.","This reverses the correct sequence of visceral-then-somatic pain.","Cardiac innervation is unrelated to appendiceal pain pathways.","Parietal peritoneal irritation occurs later in the process, not at the start.","Correct — early distension stimulates visceral T8–T10 afferents causing vague periumbilical pain, while later parietal peritoneal involvement causes somatic, localized RLQ pain."],"topic":"Appendicitis"},{"stem":"A 34-year-old man presents with classic signs and symptoms of appendicitis. His Alvarado score is calculated as 8. According to lecture, what is the most appropriate next step based on this score alone?","options":["Discharge home, appendicitis is unlikely","No further evaluation of any kind is needed","The Alvarado score should never guide any decision","Obtain imaging before further action","Surgical consultation, as this score suggests probable appendicitis"],"correctIndex":4,"explanations":["A score this high does not suggest discharge; it suggests probable appendicitis.","Additional evaluation, including imaging, is generally still pursued per ACEP guidance referenced in lecture.","The Alvarado score is explicitly discussed as a tool that helps guide decision-making, albeit with limitations.","While ACEP notes imaging is often still obtained, the specific action tied to a score ≥7 in this framework is surgical consultation.","Correct — an Alvarado score ≥7 suggests surgical consultation, as it indicates a higher likelihood of appendicitis, though ACEP notes it should not be used alone without imaging."],"topic":"Appendicitis"},{"stem":"A CT scan performed for suspected appendicitis identifies a dilated appendix measuring 9 mm with periappendiceal fat stranding and a calcified appendicolith. Based on data discussed in lecture, how does the presence of this appendicolith affect prognosis?","options":["It is only seen in pediatric patients","It rules out the need for any antibiotics","It indicates the appendix is definitely benign and requires no further action","It has no effect on perforation risk or treatment outcomes","It is associated with a substantially higher perforation rate and higher likelihood of failing nonoperative antibiotic management"],"correctIndex":4,"explanations":["Appendicoliths are not exclusive to pediatric patients.","Antibiotics remain part of the treatment approach regardless of this finding.","This finding is unrelated to malignancy risk and does not eliminate the need for treatment.","This finding does affect prognosis and treatment planning per the data discussed in lecture.","Correct — appendicoliths are associated with a substantially higher perforation rate and a higher likelihood (~40%) of failing nonoperative antibiotic therapy."],"topic":"Appendicitis"},{"stem":"A 29-year-old woman who is 20 weeks pregnant presents with RLQ pain concerning for appendicitis. Physical exam findings are unreliable due to uterine displacement of the appendix. What is the recommended imaging approach in this specific clinical scenario?","options":["Ultrasound first, followed by MRI if equivocal, avoiding CT if possible","PET/CT scan as the first study","MRI only, with no role for ultrasound","CT abdomen/pelvis with contrast as the first study","No imaging is recommended during pregnancy"],"correctIndex":0,"explanations":["Correct — ultrasound is used first in pregnancy, followed by MRI if equivocal, to avoid CT when possible.","PET/CT is not the described approach for suspected appendicitis in pregnancy.","Ultrasound is used first in this algorithm, not bypassed in favor of MRI alone.","CT is avoided if possible in pregnancy due to radiation exposure.","Imaging remains important for diagnosis even during pregnancy."],"topic":"Appendicitis"},{"stem":"A 70-year-old man presents with vague generalized abdominal pain and is found to have a normal WBC count. Compared to younger patients, which statement about appendicitis in this age group is most accurate based on lecture?","options":["Elderly patients are more likely to present atypically and have higher rates of complicated appendicitis","Elderly patients never require imaging for diagnosis","Age has no bearing on presentation or outcomes","Elderly patients have a lower rate of underlying malignancy as a cause","Elderly patients present more classically and have lower complication rates"],"correctIndex":0,"explanations":["Correct — elderly patients more often present atypically (generalized pain, lack of leukocytosis) and have higher rates of complicated appendicitis.","Imaging remains important in elderly patients, particularly given atypical presentations.","Age is explicitly discussed as affecting presentation and outcomes in this population.","Elderly patients have a higher, not lower, likelihood of luminal obstruction from malignancy, and this should always be considered.","This is the opposite of what is described for elderly patients."],"topic":"Appendicitis"},{"stem":"A patient with confirmed uncomplicated appendicitis without an appendicolith elects to pursue an antibiotics-first, nonoperative approach rather than immediate appendectomy. Which statement most accurately reflects the expected outcome over the next several years, according to lecture?","options":["This approach is never appropriate under any circumstances","Nearly all patients will avoid surgery permanently","Antibiotics-first treatment is only appropriate for perforated appendicitis","Antibiotics-first treatment has a 0% failure rate","About 30–40% of antibiotic-treated patients will eventually undergo appendectomy over 5 years"],"correctIndex":4,"explanations":["This approach is described as appropriate for selected uncomplicated cases.","A meaningful proportion still eventually require surgery, so this is inaccurate.","This approach is described for uncomplicated, not perforated, appendicitis.","This approach has a documented failure rate, so a 0% failure rate is inaccurate.","Correct — approximately 30–40% of antibiotic-treated patients will ultimately undergo appendectomy within 5 years."],"topic":"Appendicitis"},{"stem":"A 30-year-old woman with chronic diarrhea, bloating, and iron deficiency anemia refractory to oral iron supplementation undergoes serologic testing. Her tTG-IgA is negative, but her total serum IgA is also low. What is the most appropriate next step?","options":["Start a gluten-free diet without further testing","Conclude she does not have celiac disease and stop workup","Order EMA-IgA only, with no other changes","Repeat the same tTG-IgA test in one year","Proceed with IgG-based celiac testing given selective IgA deficiency"],"correctIndex":4,"explanations":["Starting a gluten-free diet before completing testing would compromise future diagnostic accuracy.","A negative tTG-IgA in the setting of IgA deficiency can be falsely negative, so this conclusion would be premature.","EMA-IgA would have the same IgA-deficiency limitation as tTG-IgA.","Repeating the same IgA-based test would not resolve the false-negative issue caused by IgA deficiency.","Correct — selective IgA deficiency occurs in 2–3% of celiac patients and causes false-negative IgA-based tests, warranting IgG-based testing instead."],"topic":"Celiac Disease"},{"stem":"A patient is being tested for celiac disease and has been following a strict gluten-free diet for the past three months due to self-directed dietary changes. Her tTG-IgA returns negative. How should this result be interpreted?","options":["This result is unaffected by her diet","It may be falsely negative because testing should be performed while on a gluten-containing diet","No further testing is ever needed","It confirms she never had celiac disease","It reliably excludes celiac disease"],"correctIndex":1,"explanations":["Diet significantly affects the accuracy of this testing, contrary to this statement.","Correct — testing must be performed while the patient is on a gluten-containing diet, since a gluten-free diet causes false-negative results.","Further testing (potentially including a gluten challenge) may be needed given this confounder.","This result cannot confirm the absence of celiac disease given the confounding diet history.","A negative result in this setting cannot be assumed reliable given her dietary changes."],"topic":"Celiac Disease"},{"stem":"A 28-year-old man presents with an intensely itchy, blistering rash on his elbows and knees. Skin biopsy of the perilesional skin reveals granular IgA deposits. Which systemic condition is most strongly associated with this finding?","options":["Zollinger-Ellison syndrome","Crohn disease","Autoimmune gastritis","Celiac disease","Eosinophilic esophagitis"],"correctIndex":3,"explanations":["ZES is not associated with this skin finding.","Crohn disease is not associated with this specific pathognomonic skin biopsy finding.","Autoimmune gastritis is not associated with this rash or skin biopsy pattern.","Correct — granular IgA deposits on perilesional skin biopsy in the setting of this rash (dermatitis herpetiformis) are pathognomonic for celiac disease.","EoE is not associated with this specific rash and skin biopsy finding."],"topic":"Celiac Disease"},{"stem":"A patient with biopsy-confirmed celiac disease has been strictly gluten-free for 8 months but continues to have persistent diarrhea and villous atrophy on repeat biopsy. Refractory celiac disease is suspected. Which subtype carries risk of progression to enteropathy-associated T-cell lymphoma?","options":["Type I refractory celiac disease","This complication is unrelated to refractory disease subtype","Type II refractory celiac disease","Neither type carries malignant potential","Both types carry equal risk"],"correctIndex":2,"explanations":["Type I refractory celiac disease has no malignant potential.","The malignant potential is specifically linked to the refractory disease subtype (Type II).","Correct — Type II refractory celiac disease can progress to enteropathy-associated T-cell lymphoma (EATL).","Type II specifically does carry malignant potential.","The two types carry different, not equal, malignant potential."],"topic":"Celiac Disease"},{"stem":"Which of the following patient populations should be screened for celiac disease due to a substantially increased prevalence, according to the associated conditions discussed in lecture?","options":["Patients with well-controlled asthma only","Patients with essential hypertension only","Patients with seasonal allergic rhinitis only","Patients with Type 1 diabetes","Patients with a remote history of appendectomy"],"correctIndex":3,"explanations":["Asthma alone was not identified as a high-risk group for celiac disease in this lecture.","Hypertension alone was not identified as a high-risk group for celiac disease in this lecture.","Seasonal allergic rhinitis alone was not identified as a high-risk group for celiac disease in this lecture.","Correct — patients with Type 1 diabetes have an increased prevalence of celiac disease (1.6–16.4%) and should be screened.","Prior appendectomy alone was not identified as a risk factor for celiac disease in this lecture."],"topic":"Celiac Disease"},{"stem":"A 4-year-old boy is being evaluated for celiac disease. His tTG-IgA level is more than 10 times the upper limit of normal, and a separate test for EMA is positive. According to the pediatric-specific guidance discussed in lecture, what is the most appropriate next step?","options":["CT enterography is required to confirm the diagnosis","Duodenal biopsy is mandatory regardless of serology results","No diagnosis can be made without a family history","Diagnosis can be made without biopsy given these serologic findings","A gluten challenge must be performed before any diagnosis"],"correctIndex":3,"explanations":["CT enterography is not the described diagnostic requirement for pediatric celiac disease.","The lecture specifically describes a pathway that avoids biopsy in children meeting these criteria.","Family history is not a required component for diagnosis in this scenario.","Correct — per ESPGHAN guidance referenced in lecture, a celiac diagnosis can be made without biopsy if tTG-IgA is at least 10 times the upper limit of normal and a separate EMA test is positive.","A gluten challenge is not the described next step when these criteria are already met."],"topic":"Celiac Disease"},{"stem":"An 8-month-old previously healthy infant develops sudden episodes of drawing his knees to his chest with crying, followed by periods of appearing well, and then vomiting. His stool contains blood mixed with mucus. Which diagnosis is most consistent with this presentation, and what is the most likely underlying lead point in this age group?","options":["Pyloric stenosis; hypertrophied pyloric muscle","Toxic megacolon; ulcerative colitis","Intussusception; lymphoid hyperplasia, often following a viral illness","Malrotation with volvulus; Meckel diverticulum","Appendicitis; fecalith obstruction"],"correctIndex":2,"explanations":["Pyloric stenosis presents with nonbilious projectile vomiting in a slightly younger infant, not this colicky/bloody stool pattern.","Toxic megacolon is a complication of colitis, not the primary diagnosis suggested by this presentation.","Correct — this describes intussusception, and lymphoid hyperplasia, often following a viral illness, is the most common lead point in this age group.","Malrotation with volvulus classically presents with bilious vomiting in a younger infant, not this intermittent colicky pattern with bloody mucus stool.","Appendicitis is uncommon in this age group and does not classically present this way."],"topic":"Intussusception"},{"stem":"An infant with suspected intussusception undergoes abdominal ultrasound. Which finding on transverse imaging would confirm this diagnosis?","options":["Target/doughnut sign","Bird beak sign","Corkscrew sign","String sign","Double bubble sign"],"correctIndex":0,"explanations":["Correct — the target/doughnut sign on transverse ultrasound view is the classic finding of intussusception.","A bird beak sign is associated with achalasia on barium swallow, not intussusception.","A corkscrew sign is associated with diffuse esophageal spasm, not intussusception.","A string sign is associated with pyloric narrowing on barium studies, not intussusception ultrasound.","A double bubble sign is associated with duodenal atresia, not the finding described here."],"topic":"Intussusception"},{"stem":"An infant with confirmed intussusception is hemodynamically stable with no evidence of perforation. What is the recommended first-line treatment?","options":["Non-operative enema reduction, with air/pneumatic enema generally preferred","Immediate colostomy","Long-term antibiotic therapy alone","Observation with no intervention","Immediate exploratory laparotomy"],"correctIndex":0,"explanations":["Correct — non-operative enema reduction, with air/pneumatic enema generally preferred, is first-line therapy in a stable patient without perforation.","Colostomy is not the first-line treatment for intussusception.","Antibiotics alone do not address the mechanical intussusception.","This is a time-sensitive emergency requiring intervention, not observation alone.","Surgery is reserved for specific indications such as instability, perforation, or failed enema reduction, not as the first-line approach in a stable patient."],"topic":"Intussusception"},{"stem":"During attempted pneumatic reduction of an intussusception, the radiologist notes no progress after three separate 5-minute attempts at 80–120 mmHg pressure. What does this suggest, and what should be considered next?","options":["This is a normal expected step with no clinical significance","The reduction is likely unsuccessful, per the \\\"rule of threes,\\\" and surgical evaluation should be considered","The reduction is likely successful; no further action needed","The patient should be discharged home regardless of outcome","Pressure should be increased indefinitely until successful"],"correctIndex":1,"explanations":["This finding has clear clinical significance regarding reduction success.","Correct — per the \\\"rule of threes,\\\" if there is no progress after three 5-minute attempts, reduction is likely unsuccessful, and surgical evaluation should be considered.","No progress after repeated attempts suggests failure, not success.","Discharge would be inappropriate without confirming successful reduction or pursuing further management.","Pressure is not increased indefinitely; there are defined attempt limits described in lecture."],"topic":"Intussusception"},{"stem":"A 7-year-old boy presents with intussusception. Compared to the typical infant presentation, which additional consideration is most important in this older age group, according to lecture?","options":["Enema reduction is contraindicated in all children over age 5","No additional workup is needed regardless of age","Antibiotics alone are curative in this age group","This age group cannot develop intussusception","A pathologic lead point, such as a polyp, lymphoma, or Meckel diverticulum, should be suspected"],"correctIndex":4,"explanations":["Enema reduction remains an option depending on clinical stability, not an absolute contraindication based on age alone.","Age-specific considerations are explicitly discussed in this lecture.","Antibiotics do not address the mechanical intussusception itself.","Intussusception can occur in this age group, though it is less common and prompts additional evaluation.","Correct — intussusception in a child older than 5 years should raise suspicion for a pathologic lead point such as lymphoma, polyp, or Meckel diverticulum."],"topic":"Intussusception"},{"stem":"A patient presents with colicky abdominal pain, distension, and obstipation. Imaging reveals dilated proximal bowel with a discrete transition point and decompressed distal bowel. Which prior history is the most common risk factor for this presentation?","options":["History of celiac disease","Prior abdominal surgery leading to adhesions","Recent viral gastroenteritis","History of Barrett esophagus","Chronic NSAID use"],"correctIndex":1,"explanations":["Celiac disease is not identified as a leading cause of SBO in this lecture.","Correct — adhesions, most commonly from prior abdominal surgery, are the leading cause of small bowel obstruction.","Viral gastroenteritis is not the leading cause of SBO described in lecture.","Barrett esophagus is unrelated to small bowel obstruction risk.","NSAID use is a risk factor for peptic ulcer disease, not the leading cause of SBO."],"topic":"Small Bowel Obstruction"},{"stem":"A patient with a small bowel obstruction is found to have bowel trapped between two points of obstruction on CT imaging. Why is this specific pattern considered more dangerous than a simple obstruction?","options":["It has the lowest risk of any SBO subtype","It carries a high risk of rapid ischemia and will not resolve with nonoperative management, making it a surgical emergency","It requires no different management than partial SBO","It is only seen in patients with Crohn disease","It always resolves spontaneously without treatment"],"correctIndex":1,"explanations":["This pattern carries higher, not lower, risk compared to other SBO types.","Correct — closed-loop obstruction carries a high risk of rapid ischemia and requires urgent surgical management rather than nonoperative treatment.","This pattern requires more urgent management than a typical partial SBO.","This can occur regardless of Crohn disease history.","This pattern is a surgical emergency, not something that resolves spontaneously."],"topic":"Small Bowel Obstruction"},{"stem":"A patient with partial small bowel obstruction is being managed nonoperatively with NPO status, IV fluids, and NGT decompression. Water-soluble contrast is administered, and follow-up imaging at 12 hours shows contrast in the colon. What does this finding suggest?","options":["This indicates a closed-loop obstruction","Surgery is immediately required regardless of this finding","This finding has no prognostic value","Nonoperative management is likely to succeed","This confirms bowel ischemia"],"correctIndex":3,"explanations":["This finding suggests passage of contrast, which would be atypical for a closed-loop obstruction.","This finding actually supports continued nonoperative management rather than mandating surgery.","This finding has clear prognostic value regarding treatment success.","Correct — contrast reaching the colon on follow-up x-ray, typically at 8–24 hours, predicts that nonoperative management is likely to succeed.","This finding does not directly indicate ischemia; it reflects contrast transit."],"topic":"Small Bowel Obstruction"},{"stem":"A patient with small bowel obstruction has persistent pain, no return of bowel function, and NGT output exceeding 500 mL after 72 hours of nonoperative management. What is the most appropriate next step?","options":["Increase oral intake to stimulate bowel function","Discharge home with outpatient follow-up","Add antibiotics only, with no other change in management","Continue nonoperative management indefinitely","Proceed to surgery given failure of nonoperative management"],"correctIndex":4,"explanations":["Oral intake would be inappropriate and potentially dangerous in ongoing obstruction.","Discharge would be inappropriate given ongoing obstruction and failed conservative management.","Antibiotics alone do not address a failed nonoperative trial requiring surgical intervention.","Persistent findings after 72 hours indicate failure of nonoperative management, warranting a change in approach.","Correct — failure of nonoperative management, indicated by persistent pain, no return of bowel function, and high NGT output, is an indication for surgery."],"topic":"Small Bowel Obstruction"},{"stem":"A patient with small bowel obstruction develops fever, tachycardia, hypotension, and rebound tenderness. Which underlying process do these findings suggest, and what does it indicate about mortality risk?","options":["Simple obstruction; mortality remains around 3%","These findings are unrelated to prognosis","This is an expected finding in all SBO cases and does not change management","This indicates the obstruction has already resolved","Bowel ischemia/strangulation; mortality increases significantly, up to around 30%"],"correctIndex":4,"explanations":["These signs suggest a complicated process, not simple obstruction, and would change the mortality estimate.","These findings are directly tied to worse prognosis in SBO.","These findings indicate a change in management is needed, given the associated mortality risk.","These findings suggest worsening, not resolution, of the obstruction.","Correct — these red-flag findings suggest ischemia/strangulation, which increases mortality substantially compared to uncomplicated SBO."],"topic":"Small Bowel Obstruction"},{"stem":
