esis is a hepatic function unrelated to vagal tone.","Correct — since the vagus is generally stimulatory to motility/secretion, its loss decreases acid secretion and can delay gastric emptying.","Vagotomy removes parasympathetic input, not sympathetic."],"topic":"ENS/Motility/Hormones"},{"stem":"A medical student is surprised to learn that the majority of the body's serotonin is produced in the gastrointestinal tract rather than the brain. Which statement best reflects the physiologic relationship between gut and brain serotonin pools?","options":["Serotonin is produced only by Kupffer cells in the liver","Gut serotonin freely crosses the blood-brain barrier to influence mood","Gut-derived serotonin does not cross the blood-brain barrier, so central and peripheral pools are functionally separate","All serotonin is produced exclusively in the CNS","Gut serotonin production has no known clinical relevance"],"correctIndex":2,"explanations":["Kupffer cells are hepatic immune cells, unrelated to serotonin production.","Serotonin does not cross the blood-brain barrier.","Correct — despite ~90-95% of serotonin being produced in the gut, it does not cross the BBB, keeping central and peripheral pools separate.","Most serotonin is actually produced in the gut, not the CNS.","Gut-brain axis dysfunction has recognized clinical relevance (e.g., IBS, functional dyspepsia)."],"topic":"ENS/Motility/Hormones"},{"stem":"A physiology exam question asks students to differentiate between two types of small intestinal motility: one propels contents forward via coordinated relaxation ahead of and contraction behind the bolus, and another consists of localized ring contractions that mix chyme without net forward movement. Which pair correctly matches these descriptions, in order?","options":["Peristalsis then receptive relaxation","Peristalsis then segmentation","Receptive relaxation then segmentation","Migrating motor complex then peristalsis","Segmentation then peristalsis"],"correctIndex":1,"explanations":["Receptive relaxation does not mix chyme via ring contractions.","Correct — peristalsis propels forward; segmentation mixes locally.","Receptive relaxation is a gastric fundus phenomenon, not the forward-propelling motion.","The MMC is an interdigestive pattern, not the forward-propelling motion described first.","This reverses the correct order."],"topic":"ENS/Motility/Hormones"},{"stem":"A patient with a gastrin-secreting tumor develops markedly elevated gastric acid output. Which cells normally secrete this hormone, and from what location?","options":["I cells in the duodenum","K cells in the duodenum/jejunum","L cells in the ileum/colon","S cells in the duodenum","G cells in the gastric antrum"],"correctIndex":4,"explanations":["I cells secrete CCK, not directly involved in acid stimulation.","K cells secrete GIP, an incretin.","L cells secrete GLP-1, an incretin.","S cells secrete secretin, which decreases acid.","Correct — G cells in the antrum secrete gastrin, which increases gastric acid secretion."],"topic":"ENS/Motility/Hormones"},{"stem":"A patient with chronic pancreatic insufficiency undergoes a secretin stimulation test to evaluate ductal cell function. This hormone is normally released by which cells, and what physiologic effect does it have?","options":["I cells in the duodenum; increases pancreatic enzymes","G cells in the antrum; increases gastric acid","K cells in the duodenum/jejunum; increases insulin release","S cells in the duodenum; increases bicarbonate and decreases gastric acid","M cells in the duodenum; triggers the migrating motor complex"],"correctIndex":3,"explanations":["This describes CCK, not secretin.","This describes gastrin, not secretin.","This describes GIP, not secretin.","Correct — secretin is released by S cells and increases bicarbonate secretion while decreasing gastric acid.","This describes motilin, not secretin."],"topic":"ENS/Motility/Hormones"},{"stem":"After a fatty meal, a hormone is released from duodenal I cells that stimulates both pancreatic enzyme secretion and gallbladder contraction with bile release. Which hormone is this?","options":["Secretin","Gastrin","GLP-1","Cholecystokinin (CCK)","Motilin"],"correctIndex":3,"explanations":["Secretin primarily affects bicarbonate secretion, not gallbladder contraction.","Gastrin primarily affects gastric acid secretion.","GLP-1 primarily affects insulin release and gastric emptying/appetite.","Correct — CCK from I cells increases pancreatic enzyme release and stimulates bile release/gallbladder contraction.","Motilin triggers the interdigestive migrating motor complex."],"topic":"ENS/Motility/Hormones"},{"stem":"A patient enrolled in a diabetes drug trial receives an agent that mimics a naturally occurring intestinal hormone released from L cells in the ileum and colon, which increases insulin secretion while slowing gastric emptying and reducing appetite. Which native hormone is being mimicked?","options":["Motilin","GLP-1","CCK","GIP","Gastrin"],"correctIndex":1,"explanations":["Motilin triggers the MMC, unrelated to insulin/appetite.","Correct — GLP-1 from L cells increases insulin, decreases gastric emptying, and decreases appetite.","CCK stimulates enzymes/bile, not primarily insulin/appetite.","GIP is also an incretin but is released from K cells in the duodenum/jejunum, not L cells in the ileum/colon.","Gastrin is unrelated to insulin or appetite regulation."],"topic":"ENS/Motility/Hormones"},{"stem":"A fasting patient's small intestine exhibits a cyclic pattern of intense contractile activity that sweeps residual contents toward the colon between meals. Which hormone triggers this pattern, and from what cells is it released?","options":["CCK from I cells","GIP from K cells","Gastrin from G cells","Secretin from S cells","Motilin from M cells in the duodenum"],"correctIndex":4,"explanations":["CCK relates to postprandial enzyme/bile release, not the interdigestive pattern described.","GIP relates to insulin release.","Gastrin relates to acid secretion.","Secretin relates to bicarbonate secretion.","Correct — motilin, released from M cells in the duodenum, triggers the migrating motor complex."],"topic":"ENS/Motility/Hormones"},{"stem":"A patient with progressive solid food dysphagia requires a study that allows both direct visualization of the esophageal mucosa and the ability to obtain tissue for biopsy. Which study best meets both needs?","options":["EGD","Capsule endoscopy","Abdominal ultrasound","KUB","Barium swallow"],"correctIndex":0,"explanations":["Correct — EGD allows direct visualization plus biopsy capability.","Capsule endoscopy images the small bowel, not typically the esophagus, and does not allow biopsy.","Abdominal ultrasound is not used to evaluate the esophageal mucosa.","KUB is a plain abdominal x-ray, not useful for esophageal mucosal evaluation.","Barium swallow shows contour/motility but does not allow biopsy."],"topic":"Diagnostics"},{"stem":"A patient with suspected small bowel bleeding of unclear source swallows a small device that transmits images as it passes through the GI tract. What is this study called, and what limitation should be considered?","options":["Barium swallow; assesses motility only","EGD; allows biopsy of the stomach only","Colonoscopy; allows biopsy but requires bowel prep","ERCP; both diagnostic and therapeutic","Capsule endoscopy; images the small bowel but does not allow biopsy or therapeutic intervention"],"correctIndex":4,"explanations":["Barium swallow is a fluoroscopic contrast study, not a capsule.","EGD is a separate scope-based procedure, not a swallowed capsule.","Colonoscopy is a separate flexible scope procedure performed via the anus, not a swallowed capsule.","ERCP is an invasive scope procedure for the biliary/pancreatic ducts, unrelated to capsule endoscopy.","Correct — capsule endoscopy images the small bowel as it passes through but cannot obtain biopsies or provide therapy."],"topic":"Diagnostics"},{"stem":"A radiology resident reviewing a normal abdominal x-ray notes that one region of bowel shows folds running the entire diameter of the lumen and is located centrally, while another region shows thicker folds that only partially cross the lumen, located peripherally with a gas/stool mixture. These findings respectively describe:","options":["Cecum then sigmoid colon","Stomach then duodenum","Small bowel then large bowel","Duodenum then jejunum","Large bowel then small bowel"],"correctIndex":2,"explanations":["Both are large bowel segments and would not show this contrast.","This does not match the described fold patterns.","Correct — small bowel folds (valvulae conniventes) cross the full lumen and are central, while large bowel haustra are partial and peripheral with gas/stool.","Both are small bowel segments and would not show this contrast.","This reverses the correct order."],"topic":"Diagnostics"},{"stem":"A trauma radiologist notes loss of the normally sharp, triangular outline adjacent to the lumbar spine on a supine abdominal film. This finding should raise concern for pathology in which anatomic space?","options":["Retroperitoneal space","Pleural space","Subcutaneous space","Pericardial space","Intraperitoneal space only"],"correctIndex":0,"explanations":["Correct — loss of the crisp psoas muscle margin can indicate retroperitoneal pathology.","The pleural space is unrelated to psoas visualization on an abdominal film.","The subcutaneous space is not associated with psoas outline changes.","The pericardial space is unrelated to abdominal imaging.","The psoas margin is a retroperitoneal structure, not an intraperitoneal marker."],"topic":"Diagnostics"},{"stem":"A clinician orders liver enzyme testing and explains that one enzyme is considered more specific for hepatocyte injury than the other, since it is found in significant quantities in fewer other tissues. Which enzyme is more liver-specific?","options":["Lipase","GGT","AST","ALP","ALT"],"correctIndex":4,"explanations":["Lipase is a pancreatic enzyme, unrelated to hepatocyte injury.","GGT was not identified in this lecture as the more specific hepatocyte injury marker.","AST is also found in cardiac and skeletal muscle, making it less liver-specific.","ALP is associated with cholestasis and bone, not hepatocyte injury specificity.","Correct — ALT is considered more liver-specific than AST."],"topic":"Diagnostics"},{"stem":"A patient with suspected liver disease needs an initial imaging study that uses sound waves, involves no radiation, and can quickly assess for structural abnormalities, tumors, or gallstones. Which study should be obtained first?","options":["ERCP","Ultrasound","CT with contrast","Elastography only","MRI"],"correctIndex":1,"explanations":["ERCP is an invasive procedure for the biliary/pancreatic ducts, not initial liver imaging.","Correct — ultrasound is the most widely used, first-line liver imaging modality, using sound waves with no radiation.","CT involves radiation and is not first-line for this initial evaluation.","Elastography measures fibrosis/fat content specifically, not general first-line structural assessment.","MRI is superior for lesion characterization but is not the first-line/most widely used initial study."],"topic":"Diagnostics"},{"stem":"A patient with suspected liver fibrosis undergoes a noninvasive study measuring liver stiffness and fat content, potentially avoiding the need for a more invasive procedure. Which study is being described?","options":["Cholecystogram","Elastography (FibroScan or MR elastography)","ERCP","HIDA scan","Barium swallow"],"correctIndex":1,"explanations":["Cholecystogram is an older test for gallstones.","Correct — elastography noninvasively measures liver fibrosis and fat content, potentially reducing the need for biopsy.","ERCP is invasive and assesses ducts, not liver stiffness.","HIDA scan assesses gallbladder emptying, not liver stiffness.","Barium swallow assesses the esophagus, unrelated to liver fibrosis."],"topic":"Diagnostics"},{"stem":"A patient with right upper quadrant pain and suspected gallstones undergoes an initial imaging study, followed by a nuclear medicine study to assess gallbladder emptying when the diagnosis remains unclear. Which two studies are being described, in order?","options":["ERCP then cholecystogram","Ultrasound then HIDA scan","CT then MRCP","KUB then colonoscopy","MRI then EUS"],"correctIndex":1,"explanations":["ERCP is invasive and used for stone removal/stenting, not typically the initial study.","Correct — ultrasound is first-line for RUQ pain/gallstones, followed by a HIDA scan to assess gallbladder emptying if needed.","CT is not first-line for gallstones, and MRCP is not a nuclear emptying study.","KUB and colonoscopy are not used to evaluate gallbladder pathology.","MRI/EUS are not the first-line pairing described in this lecture."],"topic":"Diagnostics"},{"stem":"A patient with a bile duct stricture requires a procedure that can both visualize the biliary tree via endoscopy and fluoroscopy and also allow for stent placement or stone removal in the same session. Which procedure is this?","options":["Barium esophagram","Capsule endoscopy","Abdominal ultrasound","MRCP","ERCP"],"correctIndex":4,"explanations":["Barium esophagram evaluates the esophagus, unrelated to the biliary tree.","Capsule endoscopy images the small bowel only, with no therapeutic capability.","Ultrasound is imaging only.","MRCP is noninvasive imaging only, without therapeutic capability.","Correct — ERCP combines endoscopy and fluoroscopy and allows therapeutic intervention (stents, stone removal)."],"topic":"Diagnostics"},{"stem":"A patient with acute abdominal pain and suspected pancreatitis requires both a laboratory marker that is more pancreas-specific than amylase and a first-line imaging study considered the gold standard for evaluating pancreatitis or a mass. Which pairing is correct?","options":["CEA; EUS","AFP; MRCP","Amylase; MRI","ALT; ultrasound","Lipase; CT abdomen/pelvis"],"correctIndex":4,"explanations":["CEA is a colorectal tumor marker, unrelated to pancreatitis.","AFP is a hepatocellular carcinoma marker, unrelated to pancreatitis.","Amylase is less pancreas-specific than lipase, and MRI is not the described gold-standard first-line study.","ALT reflects hepatocyte injury, not pancreatic injury.","Correct — lipase is more pancreas-specific, and CT abdomen/pelvis is the gold-standard first-line imaging for pancreatitis/mass."],"topic":"Diagnostics"},{"stem":"A pregnant patient presents with clinical concern for acute appendicitis. Following the imaging principles outlined in this lecture, which initial imaging modality should be selected to avoid fetal radiation exposure, and which modality would be preferred in a nonpregnant adult?","options":["MRI in pregnancy; colonoscopy in adults","Ultrasound in pregnancy; CT in nonpregnant adults","Barium enema in pregnancy; MRCP in adults","HIDA scan in pregnancy; EGD in adults","CT in pregnancy; ultrasound in adults"],"correctIndex":1,"explanations":["MRI was not identified as the first study for pregnant appendicitis in this lecture, and colonoscopy is not used for suspected appendicitis.","Correct — per this lecture's clinical correlation summary, suspected appendicitis is evaluated with CT in adults or ultrasound in children/pregnant patients.","Barium enema/MRCP are not the studies identified for appendicitis.","HIDA scan/EGD are not used to evaluate suspected appendicitis.","This reverses the correct pairing, and CT carries radiation risk in pregnancy."],"topic":"Diagnostics"}],"mcQuestions":[{"stem":"What are the four core functions of the GI tract?","options":["Chew, swallow, ferment, and store.","Secrete, filter, excrete, and detoxify.","Absorb, metabolize, synthesize, and store.","Ingest, circulate, filter, and excrete.","Ingest, digest, absorb, and eliminate."],"correctIndex":4},{"stem":"According to this lecture, which organs are classically retroperitoneal (\"SAD PUCKER\")?","options":["The transverse colon, sigmoid colon, and rectum.","The ileum, cecum, and transverse colon.","The gallbladder, cecum, and appendix.","The duodenum, ascending/descending colon, pancreas, and kidneys.","The stomach, liver, spleen, and jejunum."],"correctIndex":3},{"stem":"What is the greater omentum sometimes called, due to its protective role in the abdomen?","options":["The \"silent organ.\"","The \"second brain.\"","The \"master gland.\"","The \"gatekeeper.\"","The \"abdominal policeman.\""],"correctIndex":4},{"stem":"Name the three phases of swallowing (deglutition).","options":["Cephalic, gastric, and intestinal phases.","Voluntary, reflexive, and peristaltic phases.","Pharyngeal, gastric, and colonic phases.","Oral, gastric, and duodenal phases.","Oral, pharyngeal, and esophageal phases."],"correctIndex":4},{"stem":"Which phase of swallowing is voluntary, and which are involuntary?","options":["The oral phase is voluntary; the pharyngeal and esophageal phases are involuntary.","The pharyngeal phase is voluntary; the oral and esophageal phases are involuntary.","All three phases of swallowing are voluntary.","The esophageal phase is voluntary; the oral and pharyngeal phases are involuntary.","All three phases of swallowing are involuntary."],"correctIndex":0},{"stem":"At what vertebral level does the esophagus pass through the diaphragm?","options":["T6.","T12.","T10 (the esophageal hiatus).","L1.","T8."],"correctIndex":2},{"stem":"What type of epithelium lines the esophagus?","options":["Pseudostratified ciliated columnar epithelium.","Simple columnar epithelium.","Simple cuboidal epithelium.","Keratinized stratified squamous epithelium.","Nonkeratinized stratified squamous epithelium."],"correctIndex":4},{"stem":"Why is the lower esophageal sphincter (LES) called a \"physiologic\" rather than an anatomic sphincter?","options":["It is formed by the cricopharyngeus muscle rather than a true sphincter.","It is located outside the abdominal cavity, unlike the UES.","There is no true muscular ring at the GE junction — its tone comes from the crural diaphragm and the angle of His.","It contracts independently of any neural or muscular input.","It is composed entirely of smooth muscle unlike the skeletal muscle UES."],"correctIndex":2},{"stem":"What is the Z line, and why is it clinically important?","options":["The junction between the stomach and duodenum; a landmark for peptic ulcer surveillance.","The squamocolumnar junction where esophageal squamous epithelium transitions to gastric columnar epithelium; it is a key endoscopic landmark for Barrett's esophagus surveillance.","The junction between the pancreas and duodenum; a landmark for pancreatitis staging.","The junction between the ileum and cecum; a landmark for Crohn disease surveillance.","The junction between the rectum and anal canal; a landmark for hemorrhoid classification."],"correctIndex":1},{"stem":"List the regions of the stomach in order from proximal to distal.","options":["Cardia → fundus → pyloric antrum → body → pyloric canal.","Fundus → cardia → body → pyloric canal → pyloric antrum.","Cardia → body → fundus → pyloric antrum → pyloric canal.","Pyloric canal → pyloric antrum → body → fundus → cardia.","Cardia → fundus → body → pyloric antrum → pyloric canal."],"correctIndex":4},{"stem":"What gastric cell type secretes HCl and intrinsic factor?","options":["G cells.","Parietal cells.","Chief cells.","Goblet cells.","Mucous cells."],"correctIndex":1},{"stem":"What gastric cell type secretes pepsinogen?","options":["G cells.","Paneth cells.","Enterochromaffin cells.","Chief cells.","Parietal cells."],"correctIndex":3},{"stem":"What gastric cell type secretes gastrin, and where are they located?","options":["I cells, located in the duodenum.","Parietal cells, located in the fundus.","G cells, located in the antrum.","S cells, located in the duodenum.","Chief cells, located in the body."],"correctIndex":2},{"stem":"Name the three phases of gastric acid secretion.","options":["Gastric, duodenal, and colonic phases.","Fasting, fed, and interdigestive phases.","Cephalic, hepatic, and renal phases.","Cephalic, gastric, and intestinal phases.","Oral, pharyngeal, and esophageal phases."],"correctIndex":3},{"stem":"What part of the stomach stores swallowed air/food before digestion begins?","options":["The cardia.","The pyloric antrum.","The fundus (via receptive relaxation).","The body.","The pyloric canal."],"correctIndex":2},{"stem":"What are the three segments of the small intestine, in order?","options":["Jejunum, duodenum, and ileum.","Cecum, jejunum, and ileum.","Ileum, jejunum, and duodenum.","Duodenum, ileum, and jejunum.","Duodenum, jejunum, and ileum."],"correctIndex":4},{"stem":"What structure sits within the C-loop of the duodenum?","options":["The spleen.","The head of the pancreas.","The left kidney.","The gallbladder.","The tail of the pancreas."],"correctIndex":1},{"stem":"What gland in the duodenum neutralizes acidic chyme?","options":["Crypts of Lieberkühn.","Gastric pits.","Paneth cell glands.","Peyer's patches.","Brunner's glands."],"correctIndex":4},{"stem":"What distinguishes the jejunum from the ileum anatomically?","options":["The jejunum and ileum are histologically identical and cannot be distinguished.","The jejunum has a thicker wall, taller plicae circulares, and fewer/longer vascular arcades; the ileum has a thinner wall, Peyer's patches, and more/shorter vascular arcades.","The jejunum has a thinner wall and Peyer's patches; the ileum has a thicker wall and taller plicae circulares.","The jejunum contains teniae coli; the ileum contains haustra.","The jejunum has no plicae circulares; the ileum has the tallest plicae circulares."],"correctIndex":1},{"stem":"What is absorbed primarily in the ileum, and what cofactor is required for one of these substances?","options":["Bile salts and vitamin B12; B12 absorption requires intrinsic factor.","Iron and calcium; iron absorption requires intrinsic factor.","Sugars and amino acids; absorption requires bile salts as a cofactor.","Fat-soluble vitamins; absorption requires pepsin as a cofactor.","Water and electrolytes; absorption requires aldosterone as a cofactor."],"correctIndex":0},{"stem":"What structures amplify the absorptive surface area of the small intestine, from largest to smallest scale?","options":["Microvilli → villi → plicae circulares.","Haustra → teniae coli → crypts.","Plicae circulares → villi → microvilli.","Villi → plicae circulares → microvilli.","Rugae → gastric pits → microvilli."],"correctIndex":2},{"stem":"What cell type in the small intestine crypts provides antimicrobial defense?","options":["Kupffer cells.","Goblet cells.","Enterocytes.","Paneth cells.","Enteroendocrine cells."],"correctIndex":3},{"stem":"What structures are unique to the gross anatomy of the colon (not found in the small intestine)?","options":["Vascular arcades and mesenteric folds.","Rugae, gastric pits, and gastric glands.","Teniae coli, haustra, and epiploic appendages.","Plicae circulares, villi, and microvilli.","Peyer's patches and Brunner's glands."],"correctIndex":2},{"stem":"What anatomic landmark corresponds to the base of the appendix?","options":["The splenic flexure.","The ileocecal valve.","McBurney's point.","The hepatic flexure.","The linea semilunaris."],"correctIndex":2},{"stem":"Why does the colon lack villi?","options":["It has flat mucosa with straight crypts instead, since its main job is water/electrolyte absorption rather than nutrient absorption.","It lacks epithelium entirely in favor of a mucus-only lining.","It has villi identical to the small intestine but they are microscopic and not visible.","Its main job is nutrient absorption, so villi are replaced by microvilli only.","It has taller villi than the small intestine to compensate for reduced length."],"correctIndex":0},{"stem":"What do colonic microbiota produce through fermentation of fiber, and what vitamin do they synthesize?","options":["Bile acids; they also synthesize vitamin A.","Ketone bodies; they also synthesize vitamin D.","Short-chain fatty acids (SCFAs); they also synthesize vitamin K.","Long-chain fatty acids; they also synthesize vitamin B12.","Amino acids; they also synthesize vitamin C."],"correctIndex":2},{"stem":"What spinal cord levels provide autonomic (involuntary) innervation to the rectum for defecation?","options":["L1–L2, via lumbar splanchnic nerves.","S1 only, via the pudendal nerve.","T8–T10, via splanchnic nerves.","C3–C5, via the phrenic nerve.","S2–S4, via pelvic splanchnic nerves."],"correctIndex":4},{"stem":"What spinal cord levels provide somatic (voluntary) innervation for continence?","options":["S2–S4, via pelvic splanchnic nerves.","C3–C5, via the phrenic nerve.","L1–L2, via lumbar splanchnic nerves.","T8–T10, via splanchnic nerves.","S1 only, via the pudendal nerve."],"correctIndex":2},{"stem":"What ligament divides the right and left lobes of the liver on its diaphragmatic surface?","options":["The falciform ligament.","The phrenicocolic ligament.","The gastrocolic ligament.","The hepatoduodenal ligament.","The gastrosplenic ligament."],"correctIndex":0},{"stem":"What three structures make up the portal triad?","options":["A branch of the portal vein, the common bile duct, and the cystic artery.","A branch of the portal vein, the gastroduodenal artery, and the pyloric vein.","A branch of the portal vein, a branch of the hepatic artery, and a bile duct.","A branch of the splenic artery, the pancreatic duct, and the hepatic vein.","A branch of the hepatic vein, a branch of the renal artery, and a lymphatic vessel."],"correctIndex":2},{"stem":"What percentage of the liver's blood flow comes from the portal vein versus the hepatic artery?","options":["The portal vein supplies ~75%; the hepatic artery supplies the rest.","The hepatic artery supplies ~90%; the portal vein supplies ~10%.","The portal vein supplies ~90%; the hepatic artery supplies ~10%.","The portal vein and hepatic artery each supply ~50%.","The hepatic artery supplies ~75%; the portal vein supplies the rest."],"correctIndex":0},{"stem":"In the hepatic lobule, which direction does blood flow, and which direction does bile flow?","options":["Blood flows from the central vein toward the portal triad; bile flows in the same direction as blood.","Blood flows from the portal triad toward the central vein via sinusoids; bile flows the opposite direction, from hepatocytes to bile canaliculi to the portal triad's bile ducts.","Blood and bile both flow from the portal triad toward the central vein.","Blood flows from the portal triad toward the central vein; bile also flows toward the central vein.","Blood flows from the central vein toward the portal triad; bile flows from the portal triad toward the central vein."],"correctIndex":1},{"stem":"What cell type patrols the hepatic sinusoids?","options":["Paneth cells.","Stellate cells, functioning only in a phagocytic capacity.","Goblet cells.","Kupffer cells.","Enterochromaffin cells."],"correctIndex":3},{"stem":"What waste product does the liver convert ammonia into for excretion?","options":["Uric acid.","Urea.","Creatinine.","Ketones.","Bilirubin."],"correctIndex":1},{"stem":"Where do the common bile duct and the main pancreatic duct join?","options":["At the porta hepatis.","At the duodenal cap.","At the pylorus.","At the ampulla of Vater.","At the cystic triangle (of Calot)."],"correctIndex":3},{"stem":"What structures bound the cystic triangle (of Calot), and what important vessel does it contain?","options":["Bounded by the falciform ligament, porta hepatis, and gallbladder; it contains the portal vein.","Bounded by the cystic duct, common hepatic duct, and the liver edge; it contains the cystic artery.","Bounded by the cystic duct, portal vein, and hepatic artery; it contains the splenic artery.","Bounded by the stomach, spleen, and pancreas; it contains the splenic vein.","Bounded by the common bile duct, pancreatic duct, and duodenum; it contains the gastroduodenal artery."],"correctIndex":1},{"stem":"What are the two pancreatic ducts, and which is the main duct?","options":["The main duct of Wirsung and the accessory duct of Santorini; the duct of Wirsung is the main duct.","The hepatic duct and the pancreatic duct; the hepatic duct is the main duct.","The main duct of Santorini and the accessory duct of Wirsung; the duct of Santorini is the main duct.","The duct of Wirsung and the ampulla of Vater; the ampulla of Vater is the main duct.","The cystic duct and the common bile duct; the cystic duct is the main duct."],"correctIndex":0},{"stem":"What hormone stimulates pancreatic bicarbonate secretion, and what hormone stimulates pancreatic enzyme secretion?","options":["Gastrin stimulates bicarbonate secretion; motilin stimulates enzyme release.","Secretin stimulates bicarbonate secretion; CCK stimulates enzyme release.","Secretin and CCK both stimulate only bicarbonate secretion.","GIP stimulates bicarbonate secretion; GLP-1 stimulates enzyme release.","CCK stimulates bicarbonate secretion; secretin stimulates enzyme release."],"correctIndex":1},{"stem":"In what form are pancreatic proteases secreted, and why?","options":["As active enzymes, to allow immediate digestion within the pancreas.","As inactive zymogens, to allow storage in the gallbladder.","As active enzymes, but sequestered within Kupffer cells.","As inactive zymogens, to prevent autodigestion of the pancreas.","Bound to intrinsic factor, to prevent premature degradation."],"correctIndex":3},{"stem":"Which artery supplies the foregut, and to what point does it extend?","options":["The celiac trunk; it extends to the major duodenal papilla.","The inferior mesenteric artery; it extends to the pylorus.","The superior mesenteric artery; it extends to the major duodenal papilla.","The celiac trunk; it extends to the transverse colon.","The splenic artery; it extends to the ligament of Treitz."],"correctIndex":0},{"stem":"Which artery supplies the midgut, and to what point does it extend?","options":["The celiac trunk; it extends to the transverse colon.","The superior mesenteric artery (SMA); it extends to the transverse colon.","The SMA; it extends to the rectum.","The inferior mesenteric artery; it extends to the transverse colon.","The renal artery; it extends to the descending colon."],"correctIndex":1},{"stem":"Which artery supplies the hindgut, and to what point does it extend?","options":["The inferior mesenteric artery (IMA); it extends to the rectum.","The IMA; it extends to the transverse colon.","The internal iliac artery; it extends to the rectum.","The celiac trunk; it extends to the sigmoid colon.","The superior mesenteric artery; it extends to the rectum."],"correctIndex":0},{"stem":"What is the enteric nervous system (ENS) sometimes called, and roughly how many neurons does it contain?","options":["The \"master gland\"; it contains roughly 10–50 million neurons.","The \"second brain\"; it contains roughly 10–20 million neurons.","The \"gut sentinel\"; it contains roughly 50–100 thousand neurons.","The \"second brain\"; it contains roughly 200–600 million neurons.","The \"silent organ\"; it contains roughly 1–2 billion neurons."],"correctIndex":3},{"stem":"What does the myenteric (Auerbach's) plexus control, and what does the submucosal (Meissner's) plexus control?","options":["Both plexuses control motility exclusively, with no role in secretion.","The myenteric plexus controls secretion only; the submucosal plexus controls motility only.","The myenteric plexus controls blood flow only; the submucosal plexus controls motility only.","The submucosal plexus controls motility; the myenteric plexus controls secretion and blood flow.","The myenteric plexus controls motility; the submucosal plexus controls secretion and blood flow."],"correctIndex":4},{"stem":"What percentage of the body's serotonin is produced in the gut, and does it cross the blood-brain barrier?","options":["~90–95%; it freely crosses the blood-brain barrier.","~90–95%; it does not cross the blood-brain barrier.","~50%; it does not cross the blood-brain barrier.","~25%; it freely crosses the blood-brain barrier.","~10%; it does not cross the blood-brain barrier."],"correctIndex":1},{"stem":"What is the difference between peristalsis and segmentation?","options":["Peristalsis is a coordinated wave that propels contents forward; segmentation is localized ring contractions that mix chyme without propelling it.","Peristalsis mixes chyme without propelling it; segmentation propels contents forward only.","Peristalsis and segmentation are two names for the identical motility pattern.","Segmentation is a coordinated wave that propels contents forward; peristalsis is localized ring contractions that mix chyme.","Peristalsis occurs only in the colon; segmentation occurs only in the esophagus."],"correctIndex":0},{"stem":"Name the \"core three\" classic GI hormones and their cells of origin.","options":["Gastrin (I cells), secretin (K cells), and CCK (S cells).","Insulin (beta cells), glucagon (alpha cells), and somatostatin (delta cells).","Gastrin (S cells), secretin (G cells), and CCK (K cells).","Motilin (M cells), GIP (K cells), and GLP-1 (L cells).","Gastrin (G cells), secretin (S cells), and CCK (I cells)."],"correctIndex":4},{"stem":"What hormone triggers the migrating motor complex, and what cells secrete it?","options":["GLP-1, secreted by L cells.","Secretin, secreted by S cells.","CCK, secreted by I cells.","Motilin, secreted by M cells.","Gastrin, secreted by G cells."],"correctIndex":3},{"stem":"What is the first-line imaging study for suspected gallstones/RUQ pain, and what nuclear study assesses gallbladder emptying?","options":["Ultrasound is first-line; a HIDA scan assesses gallbladder emptying.","MRI is first-line; a PET scan assesses gallbladder emptying.","Plain x-ray is first-line; a cholescintigraphy scan is rarely used.","CT is first-line; an MRCP assesses gallbladder emptying.","Ultrasound is first-line; an ERCP assesses gallbladder emptying."],"correctIndex":0},{"stem":"What is the gold-standard, first-line imaging study for suspected pancreatitis or a pancreatic mass?","options":["EUS-FNA.","Plain abdominal x-ray.","MRCP.","CT abdomen/pelvis.","Abdominal ultrasound."],"correctIndex":3}]},{"id":"l2","number":2,"title":"Upper GI Disorders","week":"Week 12","filename":"Lecture 2 - Week 12 Upper GI Disorders","topics":[{"name":"Dysphagia — Overview & Diagnostic Approach","sections":[{"label":"Anatomy / Physiology Background","bullets":[{"text":"Esophagus spans ~25 cm from the upper esophageal sphincter to the gastric cardia. Upper 1/3 = skeletal muscle, middle 1/3 = mixed skeletal + smooth, lower 1/3 = smooth muscle.","level":0},{"text":"Lined by nonkeratinized stratified squamous epithelium; no serosa layer — perforation or mediastinal spread can be clinically severe.","level":0},{"text":"Swallowing phases: oral (voluntary bolus prep), pharyngeal (airway protection + upper sphincter relaxation), esophageal (primary peristaltic propagation) — coordinated by the vagus nerve (excitatory cholinergic/ACh neurons, inhibited by myenteric neurons releasing NO and VIP).","level":0},{"text":"Anti-reflux barrier: lower esophageal sphincter (LES) pressure, crural diaphragm, intra-abdominal esophageal segment. Clearance via peristalsis + gravity.","level":0}]},{"label":"Classification","bullets":[{"text":"Oropharyngeal dysphagia: difficulty initiating a swallow; coughing, choking, nasal regurgitation, wet/gurgling voice; caused by neurologic or neuromuscular disease.","level":0},{"text":"Esophageal dysphagia: swallowing begins normally, food feels stuck after swallowing; caused by structural or motility disorders.","level":0}]},{"label":"Solids vs. Liquids — Localizing Clue","bullets":[{"text":"Solids first (progressing to liquids as it worsens): peptic stricture, Schatzki ring, eosinophilic esophagitis, malignancy.","level":0},{"text":"Solids AND liquids from the start: achalasia, diffuse esophageal spasm, functional dysphagia.","level":0},{"text":"Intermittent solids: rings, eosinophilic esophagitis, intermittent food bolus obstruction.","level":0}]},{"label":"Alarm Symptoms","bullets":[{"text":"Progressive dysphagia, odynophagia, unintentional weight loss, overt GI bleeding, iron-deficiency anemia, persistent vomiting, early satiety, family history of upper GI malignancy, persistent adenopathy.","level":0},{"text":"**Current ASGE guidance: GERD + dysphagia, odynophagia, weight loss, bleeding, vomiting, or unexplained iron-deficiency anemia = get an EGD.**","level":0}]},{"label":"History / Examination","bullets":[{"text":"History: onset (acute/subacute/chronic), progressive vs. intermittent, solids/liquids/both, food impactions, atopy/asthma, medications associated with pill esophagitis (NSAIDs, iron, bisphosphonates), immunosuppression, alcohol use, prior radiation/caustic injury/surgery.","level":0},{"text":"Exam: hemodynamic status; signs of malnutrition (temporal wasting, cachexia, scaphoid abdomen); oral candidiasis; cervical masses/lymphadenopathy; neurologic findings; evidence of aspiration; stigmata of chronic liver disease (jaundice, spider angiomata, gynecomastia).","level":0}]},{"label":"Diagnostic Tools","bullets":[{"text":"EGD: checks for mucosal disease, obstruction, malignancy, bleeding; allows biopsy and therapy.","level":0},{"text":"Barium esophagram: checks structural anatomy — rings, diverticula, severe strictures, achalasia.","level":0},{"text":"Esophageal manometry: checks esophageal motor function — achalasia and other motility disorders.","level":0},{"text":"Ambulatory pH monitoring: establishes/quantifies reflux.","level":0}]},{"label":"Diagnostic Pathway","bullets":[{"text":"Determine oropharyngeal vs. esophageal first. Identify alarm symptoms → EGD. Persistent esophageal dysphagia → EGD.","level":0},{"text":"Add barium esophagram if Zenker diverticulum suspected or a subtle ring is suspected.","level":0},{"text":"If EGD does not explain dysphagia → esophageal manometry. Consider CT or endoscopic ultrasound if malignancy is suspected.","level":0}]}]},{"name":"GERD (Gastroesophageal Reflux Disease)","sections":[{"label":"Definition","bullets":[{"text":"Present when reflux of gastric contents produces troublesome symptoms.","level":0},{"text":"Common phenotypes: non-erosive reflux, erosive esophagitis, Barrett's esophagus.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"Failure of the anti-reflux barrier: transient LES relaxation, hiatal hernia (separates LES from the diaphragm), increased intra-abdominal pressure (obesity), delayed gastric emptying, mucosal sensitivity/impaired epithelial function.","level":0},{"text":"Causes of decreased LES tone: coffee, tobacco, alcohol, calcium channel blockers, nitrates.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Typical symptoms: heartburn, regurgitation, postprandial or positional symptoms.","level":0},{"text":"Extra-esophageal manifestations: chronic cough, laryngitis, asthma exacerbation, dental erosions.","level":0},{"text":"Avoid assuming GERD — rule out pulmonary/ENT/allergy causes first.","level":0}]},{"label":"Diagnosis","bullets":[{"text":"Classic symptoms → empiric once-daily PPI therapy for 8 weeks, provided there are no alarm symptoms.","level":0},{"text":"Perform EGD if: alarm symptoms present, or severe/refractory symptoms.","level":0},{"text":"If EGD is normal → ambulatory pH monitoring.","level":0}]},{"label":"Management","bullets":[{"text":"Initial: weight reduction (if obese); lifestyle changes (elevate head of bed, avoid meals 2–3 hours before bedtime, avoid acidic/spicy foods, tobacco cessation).","level":0},{"text":"Start PPI for 8 weeks, dosed 30–60 minutes before meals (usually before breakfast).","level":0},{"text":"Continue long-term PPI if: erosive esophagitis, Barrett's esophagus, or recurrent peptic stricture.","level":0},{"text":"Long-term PPI risks: hypomagnesemia, decreased B12 absorption, decreased bone density.","level":0}]},{"label":"Long-Term Complications","bullets":[{"text":"Progression: erosive esophagitis → ulceration → peptic stricture → Barrett's esophagus → esophageal adenocarcinoma.","level":0}]}]},{"name":"Barrett's Esophagus","sections":[{"label":"Pathophysiology","bullets":[{"text":"Chronic reflux allows acid/bile to reach the squamous mucosa, causing metaplastic transformation from normal squamous to columnar (intestinal) epithelium.","level":0},{"text":"Progression sequence: intestinal metaplasia → low-grade dysplasia → high-grade dysplasia → intramucosal adenocarcinoma → invasive adenocarcinoma.","level":0},{"text":"Molecular abnormalities involve the p53 pathway.","level":0}]},{"label":"Screening","bullets":[{"text":"High-risk population: male, >50 years old, White, tobacco use, obesity, first-degree relative with Barrett's or esophageal malignancy.","level":0},{"text":"EGD screening recommended in patients with chronic GERD.","level":0}]},{"label":"Diagnosis","bullets":[{"text":"EGD: visible columnar mucosa in the esophagus; histology confirms intestinal metaplasia.","level":0}]},{"label":"Management","bullets":[{"text":"Nondysplastic Barrett's: daily PPI; surveillance EGD every 5 years if <3 cm, every 3 years if >3 cm.","level":0},{"text":"Low-grade dysplasia: endoscopic resection.","level":0},{"text":"High-grade dysplasia or cancer: endoscopic resection + ablation, or surgery if resectable.","level":0}]}]},{"name":"Reflux Esophagitis","sections":[{"label":"Pathophysiology","bullets":[{"text":"Prolonged acid + pepsin contact disrupts epithelial tight junctions; erosions can progress to ulceration, bleeding, fibrosis, and Barrett's esophagus.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Endoscopic grading: Los Angeles Grades A–D; Grades C–D indicate severe mucosal injury.","level":0}]},{"label":"Treatment","bullets":[{"text":"PPI therapy; Grade C–D disease requires long-term maintenance therapy.","level":0},{"text":"Repeat EGD after 8 weeks/healing to evaluate for Barrett's esophagus.","level":0}]}]},{"name":"Pill-Induced Esophagitis","sections":[{"label":"Pathophysiology","bullets":[{"text":"A tablet lodges at an area of anatomic narrowing, causing prolonged mucosal contact and direct injury.","level":0}]},{"label":"Common Medications","bullets":[{"text":"Tetracyclines, bisphosphonates, potassium chloride tablets, iron supplements, NSAIDs, clindamycin.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Sudden odynophagia, retrosternal pain, dysphagia.","level":0}]},{"label":"Management","bullets":[{"text":"Stop the offending drug; PPI + supportive care; counsel patients to take pills upright with water.","level":0}]}]},{"name":"Infectious Esophagitis (Candida, HSV, CMV)","sections":[{"label":"Risk Factors","bullets":[{"text":"Advanced HIV, transplant recipients, chemotherapy, chronic steroid use, severe immunosuppression.","level":0}]},{"label":"Candida Esophagitis","bullets":[{"text":"White adherent plaques on endoscopy, ± oral thrush.","level":0},{"text":"Treatment: oral fluconazole.","level":0}]},{"label":"HSV Esophagitis","bullets":[{"text":"Multiple small \"volcano-like\" ulcers on endoscopy.","level":0},{"text":"Treatment: acyclovir.","level":0}]},{"label":"CMV Esophagitis","bullets":[{"text":"Large, linear longitudinal ulcers on endoscopy.","level":0},{"text":"Treatment: ganciclovir or valganciclovir.","level":0}]}]},{"name":"Eosinophilic Esophagitis (EoE)","sections":[{"label":"Pathophysiology","bullets":[{"text":"Chronic, antigen-driven immune-mediated disease. Food/environmental allergies activate Th2 lymphocytes → IL-4, 5, and 13 → eosinophil recruitment → epithelial injury.","level":0},{"text":"Chronic inflammation activates fibroblasts, causing rings, strictures, and decreased esophageal distensibility.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Adults: dysphagia and food impaction. Children: feeding difficulty, vomiting, abdominal pain, poor growth.","level":0},{"text":"Atopic disease is common in these patients.","level":0}]},{"label":"Diagnosis","bullets":[{"text":"EGD: rings, linear furrows, white exudates, edema with loss of vascularity.","level":0},{"text":"Note: endoscopy can appear entirely normal in some cases.","level":0}]},{"label":"Treatment","bullets":[{"text":"PPI therapy; swallowed topical steroids (budesonide, fluticasone).","level":0},{"text":"Food-elimination diet — start with 1–2 restrictions to identify triggers.","level":0},{"text":"Treatment-resistant disease: dupilumab.","level":0},{"text":"If strictures/narrowing present: endoscopic dilation.","level":0}]}]},{"name":"Esophageal Strictures","sections":[{"label":"Pathophysiology","bullets":[{"text":"Persistent epithelial injury → inflammation → fibroblast activation → collagen remodeling → progressive luminal narrowing.","level":0},{"text":"Etiologies: chronic acid reflux, EoE, radiation, caustic ingestions, medication injury, malignancy.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Progressive solid-food dysphagia, food impaction, weight loss if advanced.","level":0},{"text":"When very severe: progresses to liquid dysphagia as well.","level":0}]},{"label":"Evaluation","bullets":[{"text":"EGD with biopsy. Barium esophagram if proximal narrowing suspected or anatomy uncertain.","level":0},{"text":"CT chest/abdomen when extrinsic malignancy is suspected.","level":0}]},{"label":"Treatment","bullets":[{"text":"Treat the underlying cause: PPI for peptic strictures, steroids for EoE.","level":0},{"text":"Endoscopic balloon or bougie dilation.","level":0},{"text":"Always counsel patients about perforation risk with dilation.","level":0}]}]},{"name":"Esophageal Rings & Webs","sections":[{"label":"Schatzki Ring","bullets":[{"text":"Thin, circumferential mucosal ring; sometimes associated with reflux and EoE.","level":0},{"text":"Symptoms: intermittent solid dysphagia — the classic \"steakhouse syndrome.\"","level":0},{"text":"Treatment: dilation.","level":0}]},{"label":"Esophageal Webs","bullets":[{"text":"Thin, cervical mucosal membranes; may be associated with iron deficiency anemia — think Plummer-Vinson syndrome.","level":0},{"text":"Treatment: dilation + treatment of the underlying iron deficiency.","level":0}]}]},{"name":"Achalasia","sections":[{"label":"Pathophysiology","bullets":[{"text":"Degeneration of inhibitory neurons in the myenteric plexus → loss of nitric oxide (NO) → unopposed cholinergic (ACh) activity → incomplete LES relaxation.","level":0},{"text":"Chronic outflow obstruction causes proximal esophageal dilation and food/saliva retention.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Dysphagia to solids and liquids (progressive), regurgitation, nocturnal cough, chest discomfort, weight loss.","level":0}]},{"label":"Evaluation","bullets":[{"text":"Barium swallow: dilated esophagus with \"bird beak\" narrowing.","level":0},{"text":"**High-resolution manometry — gold standard.**","level":0},{"text":"EGD used to exclude an obstructing tumor (pseudoachalasia).","level":0}]},{"label":"Treatment","bullets":[{"text":"Goal: reduce EG junction resistance (innervation cannot be restored).","level":0},{"text":"Options: pneumatic dilation, Heller myotomy, botulinum toxin injection.","level":0},{"text":"POEM (peroral endoscopic myotomy) if patient is not a good surgical candidate.","level":0},{"text":"Always reassess symptoms post-treatment to ensure resolution; esophagectomy is a last resort.","level":0}]}]},{"name":"Diffuse Esophageal Spasm (DES)","sections":[{"label":"Pathophysiology","bullets":[{"text":"Impaired inhibitory neural signaling → premature contractions. LES relaxation is preserved (unlike achalasia).","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Dysphagia to solids and liquids; episodic chest pain; symptoms may be triggered by very hot/cold liquids.","level":0}]},{"label":"Diagnosis","bullets":[{"text":"Barium swallow: \"corkscrew\" appearance.","level":0},{"text":"Manometry: normal EGJ relaxation with premature contractions in at least 20% of swallows.","level":0}]},{"label":"Treatment","bullets":[{"text":"Smooth muscle relaxants: calcium channel blockers, nitrates.","level":0},{"text":"Exclude cardiac disease; treat concurrent reflux.","level":0},{"text":"POEM reserved for refractory cases only.","level":0}]}]},{"name":"Hypercontractile Esophagus","sections":[{"label":"Overview","bullets":[{"text":"Characterized by excessive, vigorous esophageal contractions.","level":0},{"text":"Treat based on symptoms rather than manometry numbers alone.","level":0}]}]},{"name":"Pseudoachalasia","sections":[{"label":"Overview","bullets":[{"text":"Results from a secondary obstruction — a tumor causing extrinsic compression (esophageal or gastric malignancy) or neurologic injury.","level":0},{"text":"Suspect when symptoms include rapid symptom progression, marked weight loss, and older age (mimics achalasia but has a secondary/malignant cause).","level":0}]}]},{"name":"Zenker Diverticulum","sections":[{"label":"Pathophysiology","bullets":[{"text":"An esophageal (pharyngoesophageal) diverticulum containing mucosa and submucosa only (not the full esophageal wall).","level":0},{"text":"Forms through Killian's triangle due to cricopharyngeal dysfunction.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Oropharyngeal dysphagia, regurgitation of undigested food, halitosis, coughing after meals.","level":0}]},{"label":"Diagnosis / Treatment","bullets":[{"text":"Diagnosis: barium swallow.","level":0},{"text":"Treatment: cricopharyngeal myotomy.","level":0}]}]},{"name":"Upper GI Bleeding — Overview","sections":[{"label":"Definition / Presentation","bullets":[{"text":"Bleeding proximal to the ligament of Treitz.","level":0},{"text":"Presentation: hematemesis, coffee-ground emesis, melena, hematochezia (if rapid/high-volume bleeding), syncope, shock.","level":0},{"text":"Diagnostics: elevated BUN-to-creatinine ratio is a supportive clue.","level":0}]},{"label":"Causes","bullets":[{"text":"Peptic ulcer disease, esophagitis, esophageal ulcer, Mallory-Weiss tear, Boerhaave syndrome, malignancy (also esophageal varices — see separate entry).","level":0}]},{"label":"Initial Stabilization","bullets":[{"text":"Airway > Breathing > Circulation. Two large-bore IVs.","level":0},{"text":"Labs: CBC, CMP, PT/PTT, type and screen.","level":0},{"text":"Treatment: IV crystalloid fluids + packed RBC transfusion; hemoglobin transfusion threshold of 7 g/dL for most patients (8 g/dL if actively bleeding).","level":0},{"text":"Call GI for an EGD.","level":0}]}]},{"name":"Mallory-Weiss Tear","sections":[{"label":"Pathophysiology","bullets":[{"text":"Sudden rise in intragastric pressure during retching/vomiting causes a longitudinal mucosal laceration near the gastroesophageal junction.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Associated with repetitive vomiting, heavy alcohol exposure, pregnancy-associated hyperemesis, eating disorders.","level":0}]},{"label":"Diagnosis / Treatment","bullets":[{"text":"Diagnosis: EGD.","level":0},{"text":"Treatment: supportive care + PPI; most heal spontaneously. If actively bleeding on EGD: endoscopic clipping or thermal therapy.","level":0}]}]},{"name":"Boerhaave Syndrome","sections":[{"label":"Overview","bullets":[{"text":"Full-thickness esophageal tear with perforation (in contrast to the mucosal-only tear of Mallory-Weiss).","level":0},{"text":"Presents with chest pain, mediastinitis, and systemic symptoms.","level":0},{"text":"**A GI emergency.**","level":0}]}]},{"name":"Esophageal Varices","sections":[{"label":"Pathophysiology","bullets":[{"text":"Cirrhosis → resistance to portal flow → portal hypertension → distal esophageal veins enlarge, with risk of rupture.","level":0},{"text":"Typically seen in advanced liver disease.","level":0}]},{"label":"Screening / Prophylaxis","bullets":[{"text":"Screening: EGD in newly diagnosed cirrhotic patients.","level":0},{"text":"Primary prophylaxis: nonselective beta blockers (propranolol, nadolol, carvedilol).","level":0}]},{"label":"Acute Variceal Hemorrhage — Management","bullets":[{"text":"Resuscitate: ABCs, IV fluids, packed RBC transfusion.","level":0},{"text":"Start therapy: octreotide (reduces portal hypertension by inhibiting splanchnic vasodilation).","level":0},{"text":"Antibiotic prophylaxis: ceftriaxone (bacteria can translocate across the gut wall in cirrhotic patients).","level":0},{"text":"Stabilize, then proceed to emergent EGD.","level":0},{"text":"Can temporize with balloon tamponade (Blakemore-Sengstaken tube) if needed.","level":0},{"text":"PPI given to reduce acid.","level":0}]}]},{"name":"Peptic Ulcer Disease","sections":[{"label":"Definition / Causes","bullets":[{"text":"Mucosal break in the stomach or duodenum due to acid injury.","level":0},{"text":"Causes: H. pylori, NSAIDs/aspirin, critical illness, smoking; less common — Zollinger-Ellison syndrome, viral ulcers, Crohn disease.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Burning/gnawing epigastric pain, dyspepsia, early satiety, nausea.","level":0},{"text":"Alarm features: GI bleeding or anemia, unintentional weight loss, progressive dysphagia, older patient with new or progressive symptoms.","level":0}]},{"label":"H. Pylori","bullets":[{"text":"Gram-negative organism that survives in the gastric mucus layer; produces urease, converting urea into ammonia to create a less acidic microenvironment, and attaches to gastric epithelial cells.","level":0},{"text":"Diagnosis: urea breath test, stool antigen test, or EGD (biopsy/rapid urease test). Discontinue PPIs for at least 4 weeks before noninvasive testing.","level":0}]},{"label":"H. Pylori Treatment","bullets":[{"text":"Quadruple therapy for 14 days: PPI BID + bismuth 4× daily + tetracycline 500 mg 4× daily + metronidazole 500 mg 4× daily.","level":0},{"text":"Confirm eradication: repeat urea breath test at least 4 weeks after completing PPI and antibiotics.","level":0}]},{"label":"General Treatment","bullets":[{"text":"Stop NSAIDs; consider a COX-2 agent if NSAID therapy must continue.","level":0},{"text":"PPI for 4–8 weeks (longer for large or complicated ulcers). Test for and treat H. pylori.","level":0}]},{"label":"Complications","bullets":[{"text":"Bleeding — most common complication.","level":0},{"text":"Perforation — sudden severe abdominal pain, free air under the diaphragm.","level":0},{"text":"Penetration — ulcer extends into an adjacent organ; posterior duodenal ulcers characteristically penetrate into the pancreas.","level":0},{"text":"Gastric outlet obstruction — inflammation/scarring near the pylorus.","level":0},{"text":"Malignancy (particularly with gastric ulcers).","level":0}]}]},{"name":"High-Yield Comparisons (Lecture Summary)","sections":[{"label":"Diagnostic Pathway Summary","bullets":[{"text":"Heartburn without alarm symptoms → empiric PPI.","level":0},{"text":"Heartburn with alarm symptoms → EGD.","level":0},{"text":"Progressive solid dysphagia → EGD and biopsy.","level":0},{"text":"Solids and liquid dysphagia → EGD and/or manometry.","level":0},{"text":"Oropharyngeal symptoms → speech/swallow evaluation and barium swallow.","level":0},{"text":"Suspected Zenker diverticulum → barium esophagram.","level":0},{"text":"Suspected achalasia → barium esophagram ± high-resolution manometry.","level":0}]},{"label":"Key Comparisons","bullets":[{"text":"Esophageal vs. oropharyngeal dysphagia: esophageal = food sticks after initiation; oropharyngeal = difficulty initiating, with coughing or aspiration.","level":0},{"text":"GERD vs. EoE: GERD = heartburn/regurgitation; EoE = food impaction/intermittent solid dysphagia.","level":0},{"text":"Peptic stricture vs. cancer: peptic = smooth, distal narrowing with a long GERD history; cancer = irregular narrowing, rapid progression, weight loss.","level":0},{"text":"Achalasia vs. DES: achalasia = impaired LES relaxation; DES = preserved LES relaxation with premature contractions.","level":0},{"text":"Mallory-Weiss vs. Boerhaave: Mallory-Weiss = mucosal bleeding only; Boerhaave = transmural perforation.","level":0}]}]}],"questions":[{"q":"What does progressive dysphagia to solids only (initially), later progressing to liquids, suggest?","a":"A mechanical/structural cause — e.g., peptic stricture, Schatzki ring, eosinophilic esophagitis, or malignancy."},{"q":"What does dysphagia to both solids and liquids from the onset suggest?","a":"A motility disorder — e.g., achalasia or diffuse esophageal spasm."},{"q":"Per ASGE guidance, what combination of symptoms in a GERD patient warrants an EGD?","a":"GERD plus dysphagia, odynophagia, weight loss, bleeding, vomiting, or unexplained iron-deficiency anemia."},{"q":"What are the three components of the anti-reflux barrier?","a":"LES pressure, the crural diaphragm, and the intra-abdominal esophageal segment."},{"q":"What is the gold standard test for esophageal motility disorders?","a":"High-resolution manometry."},{"q":"What are the three common phenotypes of GERD?","a":"Non-erosive reflux, erosive esophagitis, and Barrett's esophagus."},{"q":"What lifestyle modifications are recommended as initial GERD management?","a":"Weight reduction if obese, elevating the head of bed, avoiding meals 2–3 hours before bedtime, avoiding acidic/spicy foods, and tobacco cessation."},{"q":"What are three long-term risks of PPI therapy?","a":"Hypomagnesemia, decreased B12 absorption, and decreased bone density."},{"q":"What is the progression sequence of Barrett's esophagus to cancer?","a":"Intestinal metaplasia → low-grade dysplasia → high-grade dysplasia → intramucosal adenocarcinoma → invasive adenocarcinoma."},{"q":"What are the high-risk demographic factors for Barrett's esophagus screening?","a":"Male sex, age >50, White race, tobacco use, obesity, and a first-degree relative with Barrett's or esophageal malignancy."},{"q":"What is the surveillance interval for nondysplastic Barrett's esophagus based on segment length?","a":"Every 5 years if the segment is <3 cm, every 3 years if >3 cm."},{"q":"What endoscopic grading system is used to classify the severity of reflux esophagitis?","a":"The Los Angeles Grading system (Grades A–D)."},{"q":"Name three medications commonly implicated in pill-induced esophagitis.","a":"Any three of: tetracyclines, bisphosphonates, potassium chloride tablets, iron supplements, NSAIDs, clindamycin."},{"q":"What patient counseling point helps prevent pill-induced esophagitis?","a":"Take pills upright with water."},{"q":"What endoscopic finding is characteristic of Candida esophagitis, and what is the treatment?","a":"White adherent plaques; treated with oral fluconazole."},{"q":"How do HSV and CMV esophagitis ulcers differ endoscopically?","a":"HSV causes multiple small \"volcano-like\" ulcers; CMV causes large, linear longitudinal ulcers."},{"q":"What cytokines drive the pathophysiology of eosinophilic esophagitis?","a":"IL-4, IL-5, and IL-13, via Th2 lymphocyte activation."},{"q":"What are the classic endoscopic findings in eosinophilic esophagitis?","a":"Rings, linear furrows, white exudates, and edema with loss of vascularity."},{"q":"What are the treatment options for eosinophilic esophagitis?","a":"PPI therapy, swallowed topical steroids (budesonide, fluticasone), a food-elimination diet, dupilumab for resistant disease, and endoscopic dilation if strictures are present."},{"q":"What is the classic presentation of a Schatzki ring?","a":"Intermittent solid food dysphagia — the classic \"steakhouse syndrome.\""},{"q":"What syndrome should be considered when esophageal webs are associated with iron deficiency anemia?","a":"Plummer-Vinson syndrome."},{"q":"What is the underlying pathophysiology of achalasia?","a":"Degeneration of inhibitory neurons in the myenteric plexus causes loss of nitric oxide and unopposed cholinergic activity, leading to incomplete LES relaxation."},{"q":"What classic finding is seen on barium swallow in achalasia?","a":"A \"bird beak\" narrowing with a dilated proximal esophagus."},{"q":"What are the treatment options for achalasia?","a":"Pneumatic dilation, Heller myotomy, botulinum toxin injection, and POEM for patients who are not good surgical candidates."},{"q":"How does diffuse esophageal spasm differ from achalasia in terms of LES relaxation?","a":"LES relaxation is preserved in diffuse esophageal spasm, whereas it is impaired in achalasia."},{"q":"What classic finding is seen on barium swallow in diffuse esophageal spasm?","a":"A \"corkscrew\" appearance."},{"q":"What condition should be suspected when a patient has rapid symptom progression, marked weight loss, and older age, mimicking achalasia?","a":"Pseudoachalasia, from a secondary obstruction such as malignancy."},{"q":"What anatomic structure does a Zenker diverticulum form through?","a":"Killian's triangle."},{"q":"What is the classic clinical presentation of Zenker diverticulum?","a":"Oropharyngeal dysphagia, regurgitation of undigested food, halitosis, and coughing after meals."},{"q":"What is the definitive treatment for Zenker diverticulum?","a":"Cricopharyngeal myotomy."},{"q":"What defines upper GI bleeding anatomically?","a":"Bleeding that originates proximal to the ligament of Treitz."},{"q":"What lab finding is classically elevated in upper GI bleeding?","a":"The BUN-to-creatinine ratio."},{"q":"What is the hemoglobin transfusion threshold for most patients with GI bleeding, and what threshold applies if actively bleeding?","a":"7 g/dL for most patients; 8 g/dL if actively bleeding."},{"q":"What is the pathophysiology of a Mallory-Weiss tear?","a":"A sudden rise in intragastric pressure during retching/vomiting causes a longitudinal mucosal laceration near the gastroesophageal junction."},{"q":"What patient history is classically associated with Mallory-Weiss tears?","a":"Repetitive vomiting, heavy alcohol use, pregnancy-associated hyperemesis, and eating disorders."},{"q":"How does Boerhaave syndrome differ from a Mallory-Weiss tear?","a":"Boerhaave syndrome is a full-thickness esophageal tear/perforation, while a Mallory-Weiss tear is a mucosal-only laceration."},{"q":"What is the pathophysiology of esophageal varices?","a":"Cirrhosis causes resistance to portal flow and portal hypertension, leading to enlargement of the distal esophageal veins with risk of rupture."},{"q":"What medication class is used for primary prophylaxis against variceal bleeding?","a":"Nonselective beta blockers (propranolol, nadolol, carvedilol)."},{"q":"What medication reduces portal hypertension by inhibiting splanchnic vasodilation during acute variceal hemorrhage?","a":"Octreotide."},{"q":"Why are antibiotics (e.g., ceftriaxone) given during acute variceal hemorrhage?","a":"Due to the risk of bacterial translocation across the gut wall in cirrhotic patients."},{"q":"What device can be used to temporize an acute variceal hemorrhage?","a":"Balloon tamponade (Blakemore-Sengstaken tube)."},{"q":"What are the main causes of peptic ulcer disease discussed in this lecture?","a":"H. pylori, NSAIDs/aspirin, critical illness, and smoking (less commonly Zollinger-Ellison syndrome, viral ulcers, Crohn disease)."},{"q":"How does H. pylori survive in the acidic gastric environment?","a":"It produces urease, which converts urea into ammonia to create a less acidic microenvironment."},{"q":"What must be discontinued for at least 4 weeks before noninvasive H. pylori testing?","a":"Proton pump inhibitors."},{"q":"What is the quadruple therapy regimen for H. pylori eradication, and for how long is it given?","a":"PPI BID + bismuth 4x daily + tetracycline 500 mg 4x daily + metronidazole 500 mg 4x daily, for 14 days."},{"q":"How and when should H. pylori eradication be confirmed?","a":"Repeat urea breath test at least 4 weeks after completing the PPI and antibiotics."},{"q":"Into which adjacent organ do posterior duodenal ulcers characteristically penetrate?","a":"The pancreas."},{"q":"What is the most common complication of peptic ulcer disease?","a":"Bleeding."},{"q":"What finding on imaging suggests peptic ulcer perforation?","a":"Free air under the diaphragm."},{"q":"How can a peptic stricture be distinguished from esophageal cancer based on history and endoscopic appearance?","a":"Peptic stricture shows smooth, distal narrowing with a long GERD history; cancer shows irregular narrowing with rapid progression and weight loss."}],"examQuestions":[{"stem":"A 62-year-old man reports that solid food increasingly feels stuck in his chest a few seconds after swallowing, though liquids pass without difficulty. He denies coughing, choking, or nasal regurgitation during the swallow itself. Which category of dysphagia does this represent, and what type of cause is most likely?","options":["Esophageal dysphagia; structural or motility cause","Oropharyngeal dysphagia; neuromuscular cause","Oropharyngeal dysphagia; motility cause","Esophageal dysphagia; psychiatric cause","Oropharyngeal dysphagia; structural cause"],"correctIndex":0,"explanations":["Correct — swallowing begins normally with food sticking afterward, defining esophageal dysphagia, caused by structural or motility disorders.","Oropharyngeal dysphagia causes difficulty initiating the swallow with coughing/choking, not the pattern described.","This is esophageal, not oropharyngeal, dysphagia based on the presentation.","This is not described as a psychiatric complaint.","Oropharyngeal dysphagia is not defined by a structural-only cause, and the presentation doesn't fit oropharyngeal dysphagia."],"topic":"Dysphagia Approach"},{"stem":"A 68-year-old woman with several months of gradually worsening solid food dysphagia now also has difficulty with liquids and has lost 12 pounds. According to the alarm-symptom framework discussed in lecture, what is the most appropriate next step?","options":["Speech and swallow evaluation only","Empiric PPI trial without further workup","Reassurance and re-evaluation in 6 months","Ambulatory pH monitoring only","EGD"],"correctIndex":4,"explanations":["Speech/swallow evaluation is used for suspected oropharyngeal dysphagia, not this esophageal pattern with alarm features.","Alarm features warrant EGD rather than an empiric trial alone.","Progressive dysphagia and weight loss are alarm features requiring prompt endoscopic evaluation, not reassurance.","pH monitoring is used to quantify reflux, not to evaluate alarm symptoms of this severity.","Correct — progressive dysphagia with weight loss are alarm symptoms that mandate EGD."],"topic":"Dysphagia Approach"},{"stem":"A 40-year-old woman with long-standing GERD reports her dysphagia and heartburn have not improved with an empiric PPI trial. Her EGD is unremarkable, and biopsies are normal. What is the most appropriate next diagnostic step according to the lecture's diagnostic pathway?","options":["Discontinue further workup","Esophageal manometry","Barium swallow only","Repeat EGD in one week","CT chest with contrast"],"correctIndex":1,"explanations":["Further evaluation is warranted since her symptoms persist despite treatment.","Correct — when EGD does not explain dysphagia, the next step is esophageal manometry to evaluate for a motility disorder.","Barium swallow is added when Zenker diverticulum or a subtle ring is suspected, not as the default next step after a normal EGD.","Repeating EGD immediately does not add diagnostic value when the mucosa already appears normal.","CT chest is not the described next step in this pathway."],"topic":"Dysphagia Approach"},{"stem":"A 34-year-old man with obesity reports heartburn that worsens after large meals and when lying flat at night. He also drinks coffee daily and smokes cigarettes. Which mechanism most directly explains why these factors worsen his symptoms?","options":["They increase lower esophageal sphincter tone","They stimulate excess intrinsic factor secretion","They increase gastric acid pH","They promote transient LES relaxation and reduce LES tone, allowing reflux","They accelerate gastric emptying, preventing reflux"],"correctIndex":3,"explanations":["These factors decrease, not increase, LES tone.","Intrinsic factor is unrelated to reflux pathophysiology.","These factors do not raise gastric pH; if anything, symptoms relate to acid exposure, not pH elevation.","Correct — obesity (increased intra-abdominal pressure), coffee, and tobacco all promote reduced LES tone/transient relaxation, permitting reflux.","Delayed, not accelerated, gastric emptying is a mechanism that worsens GERD."],"topic":"GERD"},{"stem":"A patient with chronic heartburn undergoes EGD, which reveals long, confluent areas of esophageal mucosal breaks. According to the Los Angeles classification discussed in lecture, this severity grade most directly changes management by requiring:","options":["Discontinuation of all acid suppression","A one-time course of antacids only","Long-term maintenance PPI therapy","No specific management change compared to milder grades","Immediate surgical fundoplication with no medical trial"],"correctIndex":2,"explanations":["Acid suppression should be continued long-term, not discontinued.","Antacids alone are insufficient for this severity of mucosal injury.","Correct — Los Angeles Grade C–D reflux esophagitis (severe mucosal injury) requires long-term maintenance PPI therapy.","More severe grades (C–D) do require a change in management compared to milder disease.","Surgery is not the described first step; medical therapy is escalated first."],"topic":"GERD"},{"stem":"A 30-year-old woman was recently diagnosed with erosive esophagitis on EGD and started on a PPI. She asks how long she needs to continue therapy. Based on the lecture's guidance regarding indications for continuing long-term PPI use, which response is most accurate?","options":["She should switch immediately to an H2 blocker instead","She should continue long-term PPI since she has erosive esophagitis","PPIs should never be used for more than 8 weeks under any circumstance","She only needs lifestyle modification, no medication is needed","She may stop once heartburn resolves, regardless of endoscopic findings"],"correctIndex":1,"explanations":["There is no indication to switch to an H2 blocker in this scenario.","Correct — continued long-term PPI therapy is indicated for erosive esophagitis, Barrett's esophagus, or recurrent peptic stricture.","This lecture describes 8 weeks as an initial course, with continuation indicated for certain findings like erosive esophagitis.","Lifestyle modification alone is insufficient for confirmed erosive esophagitis.","Symptom resolution alone does not guide duration in the presence of erosive disease; continued therapy is indicated based on endoscopic findings."],"topic":"GERD"},{"stem":"A patient started on a PPI for GERD returns one year later reporting new muscle cramps and paresthesias. Laboratory testing reveals a low serum electrolyte level. Which long-term PPI risk best explains this finding?","options":["Hyperkalemia","Increased B12 absorption","Hypomagnesemia","Hypermagnesemia","Increased bone density"],"correctIndex":2,"explanations":["Hyperkalemia was not identified as a long-term PPI risk in this lecture.","Long-term PPI use is associated with decreased, not increased, B12 absorption.","Correct — long-term PPI use is associated with hypomagnesemia, which can cause cramps and paresthesias.","This is the opposite of the described PPI risk.","Long-term PPI use is associated with decreased, not increased, bone density."],"topic":"GERD"},{"stem":"A 55-year-old man with a 15-year history of GERD undergoes surveillance EGD, which reveals visible columnar-appearing mucosa extending into the distal esophagus. Biopsy would be expected to show which histologic change to confirm the diagnosis?","options":["Neutrophilic microabscesses","Eosinophilic infiltration exceeding 15 per high-power field","Noncaseating granulomas","Granulomatous inflammation","Intestinal metaplasia"],"correctIndex":4,"explanations":["Neutrophilic microabscesses are not the defining histologic feature described for this condition.","Eosinophilic infiltration is the defining feature of eosinophilic esophagitis, not Barrett's esophagus.","Noncaseating granulomas are not a described feature of this condition.","Granulomatous inflammation is not the defining histology of this condition.","Correct — Barrett's esophagus is confirmed histologically by intestinal metaplasia of the distal esophageal mucosa."],"topic":"Barrett's Esophagus"},{"stem":"Which combination of patient characteristics most strongly places a patient in the high-risk category for Barrett's esophagus screening, as outlined in lecture?","options":["A 30-year-old Asian woman with occasional heartburn and no family history","A 25-year-old African American woman with a normal BMI","A 60-year-old woman with well-controlled asthma and no GERD","A 55-year-old White male smoker with obesity and chronic GERD","A 40-year-old nonsmoker with no reflux symptoms"],"correctIndex":3,"explanations":["This profile lacks the key risk factors (male sex, age >50, White race, tobacco, obesity, chronic GERD) emphasized in the lecture.","This profile lacks the described risk factors.","Without chronic GERD, this patient does not meet the described high-risk criteria.","Correct — male sex, age >50, White race, tobacco use, obesity, and chronic GERD together define the high-risk population for screening.","Without chronic GERD or other risk factors, this patient does not fit the high-risk profile."],"topic":"Barrett's Esophagus"},{"stem":"A patient is diagnosed with nondysplastic Barrett's esophagus with a segment length of 4 cm. According to the surveillance intervals discussed in lecture, how often should surveillance EGD be repeated?","options":["No further surveillance needed","Every 10 years","Every 5 years","Every 3 years","Every year"],"correctIndex":3,"explanations":["Ongoing surveillance is required for nondysplastic Barrett's esophagus.","Every 10 years is not an interval described for nondysplastic Barrett's.","Every 5 years applies to segments less than 3 cm, not this 4 cm segment.","Correct — segments greater than 3 cm warrant surveillance EGD every 3 years.","Annual surveillance is not the interval described for this segment length."],"topic":"Barrett's Esophagus"},{"stem":"A patient with confirmed high-grade dysplasia on Barrett's surveillance biopsy is being counseled on management options. Which of the following reflects the appropriate treatment approach described in lecture?","options":["Observation only until symptoms develop","Endoscopic resection with ablation, or surgery if resectable","Immediate esophagectomy is contraindicated in all cases","Reassurance and repeat biopsy in 5 years","Daily PPI alone with no additional intervention"],"correctIndex":1,"explanations":["Active intervention, not passive observation, is indicated for high-grade dysplasia.","Correct — high-grade dysplasia or cancer is managed with endoscopic resection plus ablation, or surgery if the lesion is resectable.","Surgery remains an option when resectable, so this is incorrect.","A 5-year interval is inappropriately long for high-grade dysplasia, which requires more urgent intervention.","PPI alone is insufficient management for high-grade dysplasia."],"topic":"Barrett's Esophagus"},{"stem":"A patient taking daily oral bisphosphonate therapy develops sudden odynophagia and retrosternal pain. Which counseling point would most likely have prevented this presentation?","options":["Take the medication only at bedtime","Take the medication with a large fatty meal","Take the medication with citrus juice for better absorption","Take the medication upright with a full glass of water","Take the medication lying down to improve absorption"],"correctIndex":3,"explanations":["Taking medication at bedtime while supine increases risk rather than preventing it.","A fatty meal is not the described preventive measure and does not address the mechanism of injury.","Citrus juice is not a described preventive strategy and is unrelated to the mechanism of pill esophagitis.","Correct — taking pills upright with water reduces the risk of the tablet lodging and causing direct mucosal injury.","Lying down increases the risk of prolonged mucosal contact and pill-induced esophagitis."],"topic":"Esophagitis Subtypes"},{"stem":"A patient with advanced HIV and a low CD4 count presents with odynophagia. Endoscopy reveals white adherent plaques along the esophageal mucosa. Which treatment is most appropriate?","options":["Topical corticosteroids","Oral vancomycin","Oral fluconazole","Oral acyclovir","IV ganciclovir"],"correctIndex":2,"explanations":["Topical corticosteroids are used for eosinophilic esophagitis, not infectious esophagitis.","Oral vancomycin is not a treatment discussed for infectious esophagitis in this lecture.","Correct — white adherent plaques in an immunosuppressed patient are consistent with Candida esophagitis, treated with oral fluconazole.","Acyclovir treats HSV esophagitis, which presents with small volcano-like ulcers, not white plaques.","Ganciclovir treats CMV esophagitis, which presents with large linear ulcers, not white plaques."],"topic":"Esophagitis Subtypes"},{"stem":"A transplant recipient on chronic immunosuppression develops odynophagia. Endoscopy shows large, linear, longitudinal ulcers in the esophagus. Which treatment is most appropriate?","options":["Acyclovir","PPI alone","Oral fluconazole","Swallowed budesonide","Ganciclovir or valganciclovir"],"correctIndex":4,"explanations":["Acyclovir treats HSV esophagitis, which presents with small, multiple, volcano-like ulcers, not large linear ulcers.","PPI alone does not treat the underlying infectious cause.","Fluconazole treats Candida esophagitis, which presents with white plaques, not linear ulcers.","Swallowed budesonide is used for eosinophilic esophagitis, not CMV.","Correct — large, linear, longitudinal ulcers are characteristic of CMV esophagitis, treated with ganciclovir or valganciclovir."],"topic":"Esophagitis Subtypes"},{"stem":"A 24-year-old man with a history of asthma and seasonal allergies presents with recurrent food impaction and dysphagia to solids. Endoscopy reveals concentric mucosal rings, linear furrows, and white exudates, though the mucosa can sometimes appear normal on other exams. Which additional history finding would be most consistent with this presentation?","options":["Long-standing alcohol use disorder","Chronic NSAID use for headaches","Recent initiation of bisphosphonate therapy","Recent solid organ transplant","Coexisting atopic disease"],"correctIndex":4,"explanations":["Alcohol use is not the classic associated history for this presentation.","NSAID use would suggest pill-induced or reflux esophagitis, not this pattern with atopy.","Bisphosphonate use would suggest pill-induced esophagitis, not this ring/furrow pattern.","Transplant history would raise concern for infectious esophagitis, not this eosinophil-driven pattern.","Correct — atopic disease is common in eosinophilic esophagitis, consistent with the described endoscopic findings and food impaction."],"topic":"Esophagitis Subtypes"},{"stem":"A patient recently diagnosed with eosinophilic esophagitis has failed a trial of PPI therapy and a food-elimination diet. Endoscopy now shows a stricture contributing to solid food dysphagia. In addition to considering swallowed topical steroids or dupilumab, what additional intervention should be considered specifically for the stricture?","options":["Emergent esophagectomy","Balloon tamponade","Endoscopic dilation","IV ganciclovir","Cricopharyngeal myotomy"],"corr
