let state = {
  lectureIndex: 0,
  mode: "guide", // "guide" | "quiz" | "mc" | "exam"
  quiz: {}, // per lecture id: { order, pos, flipped, results, showList }
  mc: {}, // per lecture id: { order, pos, results, selected, showList }
  exam: {}, // per lecture id: exam state (see initExamState)
};

const LETTERS = ["A", "B", "C", "D", "E"];

function initQuizState(lecture) {
  if (!state.quiz[lecture.id]) {
    state.quiz[lecture.id] = {
      order: lecture.questions.map((_, i) => i),
      pos: 0,
      flipped: false,
      results: {},
      showList: false,
    };
  }
  return state.quiz[lecture.id];
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Convert **bold** markers to <strong>
function renderInline(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function renderSidebar() {
  const nav = document.getElementById("lectureNav");
  const teaching = LECTURES.filter((l) => !l.examOnly);
  const finals = LECTURES.filter((l) => l.examOnly);

  let html = teaching
    .map(
      (l) => {
        const i = LECTURES.indexOf(l);
        return `
    <div class="lecture-nav-item ${i === state.lectureIndex ? "active" : ""}" data-idx="${i}">
      <div class="lecture-num">${l.number}</div>
      <div class="lecture-nav-text">
        <div class="lecture-nav-title">${escapeHtml(l.title)}</div>
        <div class="lecture-nav-week">${escapeHtml(l.week)}</div>
      </div>
    </div>
  `;
      }
    )
    .join("");

  if (finals.length) {
    html += `<div class="nav-section-label">Cumulative Review</div>`;
    html += finals
      .map((l) => {
        const i = LECTURES.indexOf(l);
        return `
    <div class="lecture-nav-item final-item ${i === state.lectureIndex ? "active" : ""}" data-idx="${i}">
      <div class="lecture-num">${l.number}</div>
      <div class="lecture-nav-text">
        <div class="lecture-nav-title">${escapeHtml(l.title)}</div>
        <div class="lecture-nav-week">${escapeHtml(l.week)}</div>
      </div>
    </div>
  `;
      })
      .join("");
  }

  nav.innerHTML = html;
  nav.querySelectorAll(".lecture-nav-item").forEach((el) => {
    el.addEventListener("click", () => {
      state.lectureIndex = parseInt(el.getAttribute("data-idx"), 10);
      const lecture = LECTURES[state.lectureIndex];
      state.mode = lecture.examOnly ? "exam" : "guide";
      renderAll();
      window.scrollTo({ top: 0, behavior: "auto" });
    });
  });
}

function renderMain() {
  const lecture = LECTURES[state.lectureIndex];
  const main = document.getElementById("main");

  const tabsHtml = lecture.examOnly
    ? ""
    : `
    <div class="mode-tabs">
      <div class="mode-tab ${state.mode === "guide" ? "active" : ""}" data-mode="guide">Study Guide</div>
      <div class="mode-tab ${state.mode === "quiz" ? "active" : ""}" data-mode="quiz">Question Bank (${lecture.questions.length})</div>
      <div class="mode-tab ${state.mode === "mc" ? "active" : ""}" data-mode="mc">Multiple Choice (${lecture.mcQuestions.length})</div>
      <div class="mode-tab exam-tab ${state.mode === "exam" ? "active" : ""}" data-mode="exam">Mock Exam (${lecture.examQuestions.length})</div>
    </div>
  `;

  main.innerHTML = `
    <div class="lecture-header">
      <div class="lecture-eyebrow">${lecture.examOnly ? "Final Assessment" : "Lecture " + lecture.number + " &middot; " + escapeHtml(lecture.week)}</div>
      <h2>${escapeHtml(lecture.title)}</h2>
      <div class="lecture-filename">${escapeHtml(lecture.filename)}</div>
    </div>
    ${tabsHtml}
    <div class="panel ${state.mode === "guide" ? "active" : ""}" id="guidePanel"></div>
    <div class="panel ${state.mode === "quiz" ? "active" : ""}" id="quizPanel"></div>
    <div class="panel ${state.mode === "mc" ? "active" : ""}" id="mcPanel"></div>
    <div class="panel ${state.mode === "exam" ? "active" : ""}" id="examPanel"></div>
  `;

  main.querySelectorAll(".mode-tab").forEach((el) => {
    el.addEventListener("click", () => {
      state.mode = el.getAttribute("data-mode");
      renderMain();
    });
  });

  if (!lecture.examOnly) {
    renderGuidePanel(lecture);
    renderQuizPanel(lecture);
    renderMcPanel(lecture);
  }
  renderExamPanel(lecture);
}

function renderGuidePanel(lecture) {
  const panel = document.getElementById("guidePanel");
  if (!panel) return;
  panel.innerHTML = `
    <div class="topic-toolbar">
      <button class="btn" id="expandAllBtn">Expand all</button>
      <button class="btn" id="collapseAllBtn">Collapse all</button>
    </div>
    <div id="topicList"></div>
  `;
  const list = document.getElementById("topicList");
  list.innerHTML = lecture.topics
    .map(
      (t, ti) => `
    <div class="topic-card" data-ti="${ti}">
      <div class="topic-header">
        <svg class="topic-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        <div class="topic-title">${ti + 1}. ${escapeHtml(t.name)}</div>
      </div>
      <div class="topic-body">
        ${t.sections
          .map(
            (sec) => `
          <div class="sub-section">
            <div class="sub-label">${escapeHtml(sec.label)}</div>
            <ul class="sub-list">
              ${sec.bullets.map((b) => `<li class="${b.level === 1 ? "lvl1" : ""}">${renderInline(b.text)}</li>`).join("")}
            </ul>
          </div>
        `
          )
          .join("")}
      </div>
    </div>
  `
    )
    .join("");

  list.querySelectorAll(".topic-header").forEach((h) => {
    h.addEventListener("click", () => {
      h.closest(".topic-card").classList.toggle("open");
    });
  });

  document.getElementById("expandAllBtn").addEventListener("click", () => {
    list.querySelectorAll(".topic-card").forEach((c) => c.classList.add("open"));
  });
  document.getElementById("collapseAllBtn").addEventListener("click", () => {
    list.querySelectorAll(".topic-card").forEach((c) => c.classList.remove("open"));
  });
}

function renderQuizPanel(lecture) {
  const panel = document.getElementById("quizPanel");
  if (!panel) return;
  const qs = initQuizState(lecture);

  const total = qs.order.length;
  const answeredCount = Object.keys(qs.results).length;
  const correctCount = Object.values(qs.results).filter((r) => r === "correct").length;
  const incorrectCount = Object.values(qs.results).filter((r) => r === "incorrect").length;

  if (qs.pos >= total) {
    panel.innerHTML = `
      <div class="complete-banner">
        <div class="big-score">${correctCount} / ${total}</div>
        <div class="sub">marked correct on this pass${incorrectCount ? " &middot; " + incorrectCount + " marked for review" : ""}</div>
        <button class="nav-btn primary" id="restartBtn">Restart this quiz</button>
        <button class="nav-btn" id="reviewMissedBtn" style="margin-left:8px;">Review missed only</button>
      </div>
      <div class="qa-list" id="qaList"></div>
    `;
    renderFullList(lecture, qs);
    document.getElementById("restartBtn").addEventListener("click", () => {
      qs.order = shuffleArray(lecture.questions.map((_, i) => i));
      qs.pos = 0;
      qs.flipped = false;
      qs.results = {};
      renderQuizPanel(lecture);
    });
    document.getElementById("reviewMissedBtn").addEventListener("click", () => {
      const missed = Object.keys(qs.results)
        .filter((k) => qs.results[k] === "incorrect")
        .map(Number);
      if (missed.length === 0) {
        alert("No missed questions to review — nice work!");
        return;
      }
      qs.order = missed;
      qs.pos = 0;
      qs.flipped = false;
      renderQuizPanel(lecture);
    });
    return;
  }

  const qIdx = qs.order[qs.pos];
  const item = lecture.questions[qIdx];
  const pct = total ? Math.round((qs.pos / total) * 100) : 0;
  const result = qs.results[qIdx];

  panel.innerHTML = `
    <div class="quiz-toolbar">
      <div class="quiz-progress">Card ${qs.pos + 1} of ${total}</div>
      <div class="quiz-score"><span class="correct">${correctCount} correct</span> &nbsp;&middot;&nbsp; <span class="incorrect">${incorrectCount} missed</span> &nbsp;&middot;&nbsp; ${answeredCount}/${total} answered</div>
      <div class="quiz-actions">
        <button class="btn" id="shuffleBtn">Shuffle</button>
        <button class="btn" id="restartMiniBtn">Restart</button>
        <button class="btn" id="toggleListBtn">${qs.showList ? "Hide" : "Show"} full list</button>
      </div>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>

    <div class="flashcard-wrap">
      <div class="flashcard ${qs.flipped ? "flipped" : ""}" id="flashcard">
        <div class="flash-face flash-front">
          <div class="flash-kicker">Question ${qs.pos + 1}</div>
          <div class="flash-text">${renderInline(item.q)}</div>
          <div class="flash-hint">Click card to reveal answer</div>
        </div>
        <div class="flash-face flash-back">
          <div class="flash-kicker">Answer</div>
          <div class="flash-text">${renderInline(item.a)}</div>
          <div class="flash-hint">Click card to flip back</div>
        </div>
      </div>
    </div>

    <div class="quiz-nav">
      <div class="quiz-nav-left">
        <button class="nav-btn" id="prevBtn" ${qs.pos === 0 ? "disabled" : ""}>&larr; Previous</button>
        <button class="nav-btn primary" id="nextBtn">${qs.pos === total - 1 ? "Finish" : "Next →"}</button>
      </div>
      <div class="quiz-self-score">
        <button class="self-score-btn got-it ${result === "correct" ? "selected" : ""}" id="gotItBtn">I got it &#10003;</button>
        <button class="self-score-btn missed ${result === "incorrect" ? "selected" : ""}" id="missedBtn">Missed it &#10007;</button>
      </div>
    </div>

    ${qs.showList ? '<div class="qa-list" id="qaList"></div>' : ""}
  `;

  document.getElementById("flashcard").addEventListener("click", () => {
    qs.flipped = !qs.flipped;
    renderQuizPanel(lecture);
  });
  document.getElementById("shuffleBtn").addEventListener("click", () => {
    qs.order = shuffleArray(lecture.questions.map((_, i) => i));
    qs.pos = 0;
    qs.flipped = false;
    renderQuizPanel(lecture);
  });
  document.getElementById("restartMiniBtn").addEventListener("click", () => {
    qs.order = lecture.questions.map((_, i) => i);
    qs.pos = 0;
    qs.flipped = false;
    qs.results = {};
    renderQuizPanel(lecture);
  });
  document.getElementById("toggleListBtn").addEventListener("click", () => {
    qs.showList = !qs.showList;
    renderQuizPanel(lecture);
  });
  document.getElementById("prevBtn").addEventListener("click", () => {
    if (qs.pos > 0) {
      qs.pos -= 1;
      qs.flipped = false;
      renderQuizPanel(lecture);
    }
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    qs.pos += 1;
    qs.flipped = false;
    renderQuizPanel(lecture);
  });
  document.getElementById("gotItBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    qs.results[qIdx] = "correct";
    renderQuizPanel(lecture);
  });
  document.getElementById("missedBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    qs.results[qIdx] = "incorrect";
    renderQuizPanel(lecture);
  });

  if (qs.showList) renderFullList(lecture, qs);
}

function renderFullList(lecture, qs) {
  const container = document.getElementById("qaList");
  if (!container) return;
  container.innerHTML = lecture.questions
    .map(
      (item, i) => `
    <div class="qa-item" data-i="${i}">
      <div class="qa-q"><span class="qa-num">${i + 1}.</span>${renderInline(item.q)}</div>
      <div class="qa-a">${renderInline(item.a)}</div>
    </div>
  `
    )
    .join("");
  container.querySelectorAll(".qa-item").forEach((el) => {
    el.addEventListener("click", () => el.classList.toggle("open"));
  });
}

/* ===================== MULTIPLE CHOICE (recall Q&A, A-E format) ===================== */

function initMcState(lecture) {
  if (!state.mc[lecture.id]) {
    state.mc[lecture.id] = {
      order: lecture.mcQuestions.map((_, i) => i),
      pos: 0,
      results: {}, // qIdx -> 'correct' | 'incorrect'
      selected: {}, // qIdx -> selected option index
      showList: false,
    };
  }
  return state.mc[lecture.id];
}

function renderMcPanel(lecture) {
  const panel = document.getElementById("mcPanel");
  if (!panel) return;
  const ms = initMcState(lecture);

  const total = ms.order.length;
  const answeredCount = Object.keys(ms.results).length;
  const correctCount = Object.values(ms.results).filter((r) => r === "correct").length;
  const incorrectCount = Object.values(ms.results).filter((r) => r === "incorrect").length;

  if (ms.pos >= total) {
    panel.innerHTML = `
      <div class="complete-banner">
        <div class="big-score">${correctCount} / ${total}</div>
        <div class="sub">correct on this pass${incorrectCount ? " &middot; " + incorrectCount + " missed" : ""}</div>
        <button class="nav-btn primary" id="mcRestartBtn">Restart this set</button>
        <button class="nav-btn" id="mcReviewMissedBtn" style="margin-left:8px;">Review missed only</button>
      </div>
      <div class="qa-list" id="mcList"></div>
    `;
    renderFullMcList(lecture, ms);
    document.getElementById("mcRestartBtn").addEventListener("click", () => {
      ms.order = shuffleArray(lecture.mcQuestions.map((_, i) => i));
      ms.pos = 0;
      ms.results = {};
      ms.selected = {};
      renderMcPanel(lecture);
    });
    document.getElementById("mcReviewMissedBtn").addEventListener("click", () => {
      const missed = Object.keys(ms.results)
        .filter((k) => ms.results[k] === "incorrect")
        .map(Number);
      if (missed.length === 0) {
        alert("No missed questions to review — nice work!");
        return;
      }
      ms.order = missed;
      ms.pos = 0;
      renderMcPanel(lecture);
    });
    return;
  }

  const qIdx = ms.order[ms.pos];
  const item = lecture.mcQuestions[qIdx];
  const pct = total ? Math.round((ms.pos / total) * 100) : 0;
  const selected = ms.selected[qIdx];
  const isGraded = selected !== undefined;

  panel.innerHTML = `
    <div class="quiz-toolbar">
      <div class="quiz-progress">Question ${ms.pos + 1} of ${total}</div>
      <div class="quiz-score"><span class="correct">${correctCount} correct</span> &nbsp;&middot;&nbsp; <span class="incorrect">${incorrectCount} missed</span> &nbsp;&middot;&nbsp; ${answeredCount}/${total} answered</div>
      <div class="quiz-actions">
        <button class="btn" id="mcShuffleBtn">Shuffle</button>
        <button class="btn" id="mcRestartMiniBtn">Restart</button>
        <button class="btn" id="mcToggleListBtn">${ms.showList ? "Hide" : "Show"} full list</button>
      </div>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>

    ${
      isGraded
        ? `<div class="exam-feedback-banner ${selected === item.correctIndex ? "correct" : "incorrect"}">
            ${selected === item.correctIndex ? "✓ Correct" : "✗ Incorrect &mdash; the correct answer is highlighted below."}
          </div>`
        : ""
    }

    <div class="exam-qcard">
      <div class="exam-stem">${renderInline(item.stem)}</div>
      <div class="exam-options">
        ${item.options
          .map((opt, oi) => {
            let cls = "exam-option";
            if (isGraded) {
              cls += " graded";
              if (oi === item.correctIndex) cls += " reveal-correct";
              else if (oi === selected) cls += " reveal-wrong-picked";
            } else if (oi === selected) {
              cls += " selected";
            }
            return `
          <div class="${cls}" data-oi="${oi}">
            <div class="exam-option-letter">${LETTERS[oi]}</div>
            <div class="exam-option-text">${renderInline(opt)}</div>
          </div>
        `;
          })
          .join("")}
      </div>
    </div>

    <div class="exam-bottom-nav">
      <button class="nav-btn" id="mcPrevBtn" ${ms.pos === 0 ? "disabled" : ""}>&larr; Previous</button>
      <button class="nav-btn primary" id="mcNextBtn" ${isGraded ? "" : "disabled"}>${ms.pos === total - 1 ? "Finish" : "Next →"}</button>
    </div>

    ${ms.showList ? '<div class="qa-list" id="mcList"></div>' : ""}
  `;

  document.getElementById("mcShuffleBtn").addEventListener("click", () => {
    ms.order = shuffleArray(lecture.mcQuestions.map((_, i) => i));
    ms.pos = 0;
    renderMcPanel(lecture);
  });
  document.getElementById("mcRestartMiniBtn").addEventListener("click", () => {
    ms.order = lecture.mcQuestions.map((_, i) => i);
    ms.pos = 0;
    ms.results = {};
    ms.selected = {};
    renderMcPanel(lecture);
  });
  document.getElementById("mcToggleListBtn").addEventListener("click", () => {
    ms.showList = !ms.showList;
    renderMcPanel(lecture);
  });

  if (!isGraded) {
    panel.querySelectorAll(".exam-option").forEach((el) => {
      el.addEventListener("click", () => {
        const oi = parseInt(el.getAttribute("data-oi"), 10);
        ms.selected[qIdx] = oi;
        ms.results[qIdx] = oi === item.correctIndex ? "correct" : "incorrect";
        renderMcPanel(lecture);
      });
    });
  }

  document.getElementById("mcPrevBtn").addEventListener("click", () => {
    if (ms.pos > 0) {
      ms.pos -= 1;
      renderMcPanel(lecture);
    }
  });
  document.getElementById("mcNextBtn").addEventListener("click", () => {
    if (!isGraded) return;
    ms.pos += 1;
    renderMcPanel(lecture);
  });

  if (ms.showList) renderFullMcList(lecture, ms);
}

function renderFullMcList(lecture, ms) {
  const container = document.getElementById("mcList");
  if (!container) return;
  container.innerHTML = lecture.mcQuestions
    .map((item, i) => {
      const selected = ms.selected[i];
      const graded = selected !== undefined;
      const answerLine = graded
        ? (selected === item.correctIndex ? "✓ " : "✗ ") + LETTERS[item.correctIndex] + ". " + item.options[item.correctIndex]
        : "Not yet answered";
      return `
    <div class="qa-item" data-i="${i}">
      <div class="qa-q"><span class="qa-num">${i + 1}.</span>${renderInline(item.stem)}</div>
      <div class="qa-a">${renderInline(answerLine)}</div>
    </div>
  `;
    })
    .join("");
  container.querySelectorAll(".qa-item").forEach((el) => {
    el.addEventListener("click", () => el.classList.toggle("open"));
  });
}

/* ===================== EXAM ENGINE ===================== */

function initExamState(lecture) {
  if (!state.exam[lecture.id]) {
    state.exam[lecture.id] = {
      phase: "intro", // intro | taking | review | results | reviewAnswers
      current: 0,
      reviewCurrent: 0,
      answers: {}, // qIdx -> selected option idx (locked once submittedQ[qIdx] is true)
      submittedQ: {}, // qIdx -> true once that question's answer has been submitted/graded
      crossed: {}, // qIdx -> array of crossed option indices
      flagged: {}, // qIdx -> true
      score: null,
    };
  }
  return state.exam[lecture.id];
}

function examCounts(lecture, ex) {
  const total = lecture.examQuestions.length;
  let answered = 0;
  let flagged = 0;
  for (let i = 0; i < total; i++) {
    if (ex.answers[i] !== undefined) answered++;
    if (ex.flagged[i]) flagged++;
  }
  return { total, answered, unanswered: total - answered, flagged };
}

function renderExamPanel(lecture) {
  const panel = document.getElementById("examPanel");
  if (!panel) return;
  const ex = initExamState(lecture);

  if (ex.phase === "intro") return renderExamIntro(lecture, panel, ex);
  if (ex.phase === "taking") return renderExamTaking(lecture, panel, ex);
  if (ex.phase === "review") return renderExamReview(lecture, panel, ex);
  if (ex.phase === "results") return renderExamResults(lecture, panel, ex);
  if (ex.phase === "reviewAnswers") return renderExamReviewAnswers(lecture, panel, ex);
}

function renderExamIntro(lecture, panel, ex) {
  const total = lecture.examQuestions.length;
  const inProgress = Object.keys(ex.answers).length > 0 && ex.score === null;
  panel.innerHTML = `
    <div class="exam-intro">
      <div class="exam-icon">${lecture.examOnly ? "★" : "Ex"}</div>
      <h3>${lecture.examOnly ? "Cumulative Final Exam" : lecture.title + " — Mock Exam"}</h3>
      <p>${total} exam-style questions, mostly clinical vignettes, written at second-semester PA exam difficulty and grounded only in this lecture's material. Answer one question at a time, flag anything you want to revisit, and cross out choices you've ruled out.</p>
      <ul>
        <li>Submit each answer to see instant feedback and rationale, right on that question, before moving on.</li>
        <li>Use the question navigator to jump to any question at any time.</li>
        <li>Cross-out marks a choice as ruled out &mdash; it does not select it.</li>
        <li>When you've gone through every question, finish the exam for a full results breakdown.</li>
      </ul>
      <button class="nav-btn gold" id="startExamBtn">${inProgress ? "Resume Exam" : "Start Exam"}</button>
      ${
        inProgress
          ? '<div class="exam-resume-note"><a href="#" id="restartFreshLink">Start over from scratch instead</a></div>'
          : ""
      }
    </div>
  `;
  document.getElementById("startExamBtn").addEventListener("click", () => {
    ex.phase = "taking";
    renderExamPanel(lecture);
  });
  const restartLink = document.getElementById("restartFreshLink");
  if (restartLink) {
    restartLink.addEventListener("click", (e) => {
      e.preventDefault();
      state.exam[lecture.id] = undefined;
      const fresh = initExamState(lecture);
      fresh.phase = "taking";
      renderExamPanel(lecture);
    });
  }
}

function renderExamNavGrid(lecture, ex, opts) {
  opts = opts || {};
  const mode = opts.mode || "taking"; // taking | reviewAnswers
  const questions = lecture.examQuestions;
  const current = mode === "reviewAnswers" ? ex.reviewCurrent : ex.current;

  const tiles = questions
    .map((q, i) => {
      let cls = "exam-navtile";
      const userAns = ex.answers[i];
      const graded = mode === "reviewAnswers" || !!ex.submittedQ[i];
      if (graded) {
        if (userAns === undefined) cls += "";
        else if (userAns === q.correctIndex) cls += " correct";
        else cls += " incorrect";
      } else if (userAns !== undefined) {
        cls += " answered";
      }
      if (ex.flagged[i]) cls += " flagged";
      if (i === current) cls += " current";
      return `<div class="${cls}" data-i="${i}" title="Question ${i + 1}">${i + 1}</div>`;
    })
    .join("");

  const legend =
    mode === "reviewAnswers"
      ? `<div class="exam-navlegend">
          <span><span class="legend-dot correct"></span>Correct</span>
          <span><span class="legend-dot incorrect"></span>Incorrect</span>
          <span><span class="legend-dot flagged"></span>Flagged</span>
        </div>`
      : `<div class="exam-navlegend">
          <span><span class="legend-dot correct"></span>Graded correct</span>
          <span><span class="legend-dot incorrect"></span>Graded incorrect</span>
          <span><span class="legend-dot answered"></span>Answered, not yet submitted</span>
          <span><span class="legend-dot unanswered"></span>Unanswered</span>
          <span><span class="legend-dot flagged"></span>Flagged</span>
        </div>`;

  return `<div class="exam-navtoggle-panel"><div class="exam-navgrid">${tiles}</div>${legend}</div>`;
}

// Shared markup for a graded (already-submitted) question: correct answer highlighted,
// user's wrong pick highlighted, rationale shown per relevant option, feedback banner on top.
function renderGradedFeedback(q, userAns) {
  const isCorrect = userAns === q.correctIndex;
  const banner = `
    <div class="exam-feedback-banner ${isCorrect ? "correct" : "incorrect"}">
      ${
        isCorrect
          ? "✓ Correct &mdash; " + renderInline((q.explanations[q.correctIndex] || "").replace(/^Correct\s*[—-]\s*/, ""))
          : "✗ Incorrect" + (userAns === undefined ? " &mdash; you left this question unanswered." : " &mdash; review the rationale below.")
      }
    </div>
  `;
  const optionsHtml = q.options
    .map((opt, oi) => {
      let cls = "exam-option graded";
      if (oi === q.correctIndex) cls += " reveal-correct";
      else if (oi === userAns) cls += " reveal-wrong-picked";
      return `
      <div class="${cls}">
        <div class="exam-option-letter">${LETTERS[oi]}</div>
        <div style="flex:1;">
          <div class="exam-option-text">${renderInline(opt)}${oi === userAns ? ' <em style="font-weight:600;">(your answer)</em>' : ""}</div>
          <div class="exam-option-rationale">${renderInline(q.explanations[oi])}</div>
        </div>
      </div>
    `;
    })
    .join("");
  return { banner, optionsHtml };
}

function renderExamTaking(lecture, panel, ex) {
  const questions = lecture.examQuestions;
  const total = questions.length;
  const i = ex.current;
  const q = questions[i];
  const counts = examCounts(lecture, ex);
  const selected = ex.answers[i];
  const crossedSet = ex.crossed[i] || [];
  const isFlagged = !!ex.flagged[i];
  const isSubmitted = !!ex.submittedQ[i];

  let bodyHtml;
  if (isSubmitted) {
    const { banner, optionsHtml } = renderGradedFeedback(q, ex.answers[i]);
    bodyHtml = `
      ${banner}
      <div class="exam-qcard">
        <div class="exam-qcard-head">
          <div>
            <div class="exam-qnum">Question ${i + 1}</div>
            <span class="exam-topic-chip">${escapeHtml(q.topic)}</span>
          </div>
          <button class="flag-btn ${isFlagged ? "active" : ""}" id="flagBtn">${isFlagged ? "⚑ Flagged" : "⚐ Flag for review"}</button>
        </div>
        <div class="exam-stem">${renderInline(q.stem)}</div>
        <div class="exam-options">${optionsHtml}</div>
      </div>
    `;
  } else {
    bodyHtml = `
      <div class="exam-qcard">
        <div class="exam-qcard-head">
          <div>
            <div class="exam-qnum">Question ${i + 1}</div>
          </div>
          <button class="flag-btn ${isFlagged ? "active" : ""}" id="flagBtn">${isFlagged ? "⚑ Flagged" : "⚐ Flag for review"}</button>
        </div>
        <div class="exam-stem">${renderInline(q.stem)}</div>
        <div class="exam-options">
          ${q.options
            .map((opt, oi) => {
              const isSel = selected === oi;
              const isCrossed = crossedSet.includes(oi);
              return `
            <div class="exam-option ${isSel ? "selected" : ""} ${isCrossed ? "crossed" : ""}" data-oi="${oi}">
              <div class="exam-option-letter">${LETTERS[oi]}</div>
              <div class="exam-option-text">${renderInline(opt)}</div>
              <div class="exam-option-strike ${isCrossed ? "active" : ""}" data-strike-oi="${oi}" title="Cross out this choice">&#10005;</div>
            </div>
          `;
            })
            .join("")}
        </div>
      </div>
    `;
  }

  const bottomNavHtml = isSubmitted
    ? `
      <button class="nav-btn" id="examPrevBtn" ${i === 0 ? "disabled" : ""}>&larr; Previous</button>
      ${
        i === total - 1
          ? '<button class="nav-btn gold" id="examReviewBtn">Finish Exam →</button>'
          : '<button class="nav-btn primary" id="examNextBtn">Next Question →</button>'
      }
    `
    : `
      <button class="nav-btn" id="examPrevBtn" ${i === 0 ? "disabled" : ""}>&larr; Previous</button>
      <button class="nav-btn primary" id="submitAnswerBtn" ${selected === undefined ? "disabled" : ""}>Submit Answer</button>
      ${
        i === total - 1
          ? '<button class="nav-btn gold" id="examReviewBtn">Review &amp; Submit →</button>'
          : '<button class="nav-btn" id="examNextBtn">Skip →</button>'
      }
    `;

  panel.innerHTML = `
    <div class="exam-topbar">
      <div class="exam-topbar-left">
        <span class="exam-qcount">Question ${i + 1} of ${total}</span>
        <span class="exam-timerlike">${counts.answered}/${total} answered${counts.flagged ? " &middot; " + counts.flagged + " flagged" : ""}</span>
      </div>
      <div class="exam-topbar-actions">
        <button class="btn" id="navToggleBtn">${ex._navOpen ? "Hide" : "Show"} navigator</button>
        <button class="btn" id="exitToReviewBtn">Review &amp; Submit</button>
      </div>
    </div>
    ${ex._navOpen ? renderExamNavGrid(lecture, ex, { mode: "taking" }) : ""}

    ${bodyHtml}

    <div class="exam-bottom-nav">
      ${bottomNavHtml}
    </div>
  `;

  document.getElementById("navToggleBtn").addEventListener("click", () => {
    ex._navOpen = !ex._navOpen;
    renderExamTaking(lecture, panel, ex);
  });
  document.getElementById("exitToReviewBtn").addEventListener("click", () => {
    ex.phase = "review";
    renderExamPanel(lecture);
  });
  panel.querySelectorAll(".exam-navtile").forEach((t) => {
    t.addEventListener("click", () => {
      ex.current = parseInt(t.getAttribute("data-i"), 10);
      renderExamTaking(lecture, panel, ex);
    });
  });
  const flagBtn = document.getElementById("flagBtn");
  if (flagBtn)
    flagBtn.addEventListener("click", () => {
      ex.flagged[i] = !ex.flagged[i];
      renderExamTaking(lecture, panel, ex);
    });

  if (!isSubmitted) {
    panel.querySelectorAll(".exam-option").forEach((el) => {
      el.addEventListener("click", (e) => {
        if (e.target.closest(".exam-option-strike")) return; // handled separately
        const oi = parseInt(el.getAttribute("data-oi"), 10);
        ex.answers[i] = oi;
        renderExamTaking(lecture, panel, ex);
      });
    });
    panel.querySelectorAll(".exam-option-strike").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const oi = parseInt(el.getAttribute("data-strike-oi"), 10);
        const arr = ex.crossed[i] || [];
        const idx = arr.indexOf(oi);
        if (idx >= 0) arr.splice(idx, 1);
        else arr.push(oi);
        ex.crossed[i] = arr;
        renderExamTaking(lecture, panel, ex);
      });
    });
    const submitAnswerBtn = document.getElementById("submitAnswerBtn");
    if (submitAnswerBtn)
      submitAnswerBtn.addEventListener("click", () => {
        if (ex.answers[i] === undefined) return;
        ex.submittedQ[i] = true;
        renderExamTaking(lecture, panel, ex);
      });
  }

  const prevBtn = document.getElementById("examPrevBtn");
  if (prevBtn)
    prevBtn.addEventListener("click", () => {
      if (ex.current > 0) {
        ex.current -= 1;
        renderExamTaking(lecture, panel, ex);
      }
    });
  const nextBtn = document.getElementById("examNextBtn");
  if (nextBtn)
    nextBtn.addEventListener("click", () => {
      ex.current = Math.min(total - 1, ex.current + 1);
      renderExamTaking(lecture, panel, ex);
    });
  const reviewBtn = document.getElementById("examReviewBtn");
  if (reviewBtn)
    reviewBtn.addEventListener("click", () => {
      ex.phase = "review";
      renderExamPanel(lecture);
    });
}

function renderExamReview(lecture, panel, ex) {
  const questions = lecture.examQuestions;
  const counts = examCounts(lecture, ex);

  panel.innerHTML = `
    <div class="exam-review-summary">
      <div class="exam-stat-pill"><div class="num">${counts.answered}/${counts.total}</div><div class="lbl">Answered</div></div>
      <div class="exam-stat-pill unanswered"><div class="num">${counts.unanswered}</div><div class="lbl">Unanswered</div></div>
      <div class="exam-stat-pill flagged"><div class="num">${counts.flagged}</div><div class="lbl">Flagged</div></div>
    </div>
    ${renderExamNavGrid(lecture, ex, { mode: "taking" })}
    <div class="exam-bottom-nav">
      <button class="nav-btn" id="backToExamBtn">&larr; Back to Exam</button>
      <button class="nav-btn gold" id="submitExamBtn">Submit Exam</button>
    </div>
  `;

  panel.querySelectorAll(".exam-navtile").forEach((t) => {
    t.addEventListener("click", () => {
      ex.current = parseInt(t.getAttribute("data-i"), 10);
      ex.phase = "taking";
      renderExamPanel(lecture);
    });
  });
  document.getElementById("backToExamBtn").addEventListener("click", () => {
    ex.phase = "taking";
    renderExamPanel(lecture);
  });
  document.getElementById("submitExamBtn").addEventListener("click", () => {
    if (counts.unanswered > 0) {
      const ok = confirm(
        "You have " + counts.unanswered + " unanswered question(s). Submit the exam anyway?"
      );
      if (!ok) return;
    }
    gradeExam(lecture, ex);
    ex.phase = "results";
    renderExamPanel(lecture);
  });
}

function gradeExam(lecture, ex) {
  const questions = lecture.examQuestions;
  let correct = 0;
  const topicStats = {}; // topic -> {correct, total}
  questions.forEach((q, i) => {
    const userAns = ex.answers[i];
    const isCorrect = userAns === q.correctIndex;
    if (isCorrect) correct++;
    if (!topicStats[q.topic]) topicStats[q.topic] = { correct: 0, total: 0 };
    topicStats[q.topic].total++;
    if (isCorrect) topicStats[q.topic].correct++;
  });
  ex.score = { correct, total: questions.length, topicStats };
}

function renderExamResults(lecture, panel, ex) {
  const questions = lecture.examQuestions;
  const score = ex.score || { correct: 0, total: questions.length, topicStats: {} };
  const pct = score.total ? Math.round((score.correct / score.total) * 100) : 0;

  // Weakest subtopics: lowest accuracy, require at least 1 miss, sorted by miss rate desc then miss count desc
  const weakTopics = Object.keys(score.topicStats)
    .map((topic) => {
      const s = score.topicStats[topic];
      return { topic, missed: s.total - s.correct, total: s.total, rate: (s.total - s.correct) / s.total };
    })
    .filter((t) => t.missed > 0)
    .sort((a, b) => b.rate - a.rate || b.missed - a.missed)
    .slice(0, 6);

  // Most-emphasized instructor concepts: topics with the most questions in this exam bank
  // (question allocation across topics tracked instructor emphasis during exam construction)
  const emphasisTopics = Object.keys(score.topicStats)
    .map((topic) => ({ topic, total: score.topicStats[topic].total }))
    .sort((a, b) => b.total - a.total)
    .slice(0, 6);

  // High-yield review list: pull correct-answer rationale from missed questions, deduped by topic
  const seenTopics = new Set();
  const highYield = [];
  questions.forEach((q, i) => {
    const userAns = ex.answers[i];
    if (userAns === q.correctIndex) return;
    if (seenTopics.has(q.topic)) return;
    seenTopics.add(q.topic);
    let fact = q.explanations[q.correctIndex] || "";
    fact = fact.replace(/^Correct\s*[—-]\s*/, "");
    highYield.push({ topic: q.topic, fact });
  });

  panel.innerHTML = `
    <div class="results-hero">
      <div class="score-big">${score.correct} / ${score.total}</div>
      <div class="score-pct">${pct}% correct</div>
      <div class="score-sub">${lecture.examOnly ? "Cumulative Final Exam" : lecture.title + " Mock Exam"} &middot; completed just now</div>
    </div>

    <div class="results-grid">
      <div class="results-card">
        <h4>Weakest Subtopics</h4>
        ${
          weakTopics.length
            ? weakTopics
                .map(
                  (t) => `<div class="weak-topic-row"><span class="wt-name">${escapeHtml(t.topic)}</span><span class="wt-frac">${t.missed}/${t.total} missed</span></div>`
                )
                .join("")
            : '<p style="font-size:13.5px;color:var(--text-muted);">No missed questions — excellent work across every subtopic.</p>'
        }
      </div>
      <div class="results-card">
        <h4>Most-Emphasized Concepts</h4>
        <ul>
          ${emphasisTopics.map((t) => `<li>${escapeHtml(t.topic)} <span style="color:var(--text-muted);">(${t.total} questions on this exam)</span></li>`).join("")}
        </ul>
      </div>
    </div>

    <div class="results-card" style="margin-bottom:20px;">
      <h4>High-Yield Review List</h4>
      ${
        highYield.length
          ? highYield
              .map(
                (h) => `<div class="hy-item"><span class="hy-topic">${escapeHtml(h.topic)}</span>${renderInline(h.fact)}</div>`
              )
              .join("")
          : '<p style="font-size:13.5px;color:var(--text-muted);">Nothing to review — you answered every question correctly.</p>'
      }
    </div>

    <div class="results-actions">
      <button class="nav-btn gold" id="reviewAnswersBtn">Review All Answers</button>
      <button class="nav-btn primary" id="retakeExamBtn">Retake Exam</button>
    </div>
  `;

  document.getElementById("reviewAnswersBtn").addEventListener("click", () => {
    ex.phase = "reviewAnswers";
    ex.reviewCurrent = 0;
    renderExamPanel(lecture);
  });
  document.getElementById("retakeExamBtn").addEventListener("click", () => {
    state.exam[lecture.id] = undefined;
    const fresh = initExamState(lecture);
    fresh.phase = "taking";
    renderExamPanel(lecture);
  });
}

function renderExamReviewAnswers(lecture, panel, ex) {
  const questions = lecture.examQuestions;
  const total = questions.length;
  const i = ex.reviewCurrent;
  const q = questions[i];
  const userAns = ex.answers[i];
  const isCorrect = userAns === q.correctIndex;
  const isFlagged = !!ex.flagged[i];

  panel.innerHTML = `
    <div class="exam-topbar">
      <div class="exam-topbar-left">
        <span class="exam-qcount">Reviewing Question ${i + 1} of ${total}</span>
        ${isFlagged ? '<span class="exam-timerlike">⚑ was flagged</span>' : ""}
      </div>
      <div class="exam-topbar-actions">
        <button class="btn" id="navToggleReviewBtn">${ex._navOpenReview ? "Hide" : "Show"} navigator</button>
        <button class="btn" id="backToResultsBtn">Back to Results</button>
      </div>
    </div>
    ${ex._navOpenReview ? renderExamNavGrid(lecture, ex, { mode: "reviewAnswers" }) : ""}

    <div class="exam-feedback-banner ${isCorrect ? "correct" : "incorrect"}">
      ${
        isCorrect
          ? "✓ Correct &mdash; " + renderInline((q.explanations[q.correctIndex] || "").replace(/^Correct\s*[—-]\s*/, ""))
          : "✗ Incorrect" + (userAns === undefined ? " &mdash; you left this question unanswered." : " &mdash; review the rationale below.")
      }
    </div>

    <div class="exam-qcard">
      <div class="exam-qcard-head">
        <div>
          <div class="exam-qnum">Question ${i + 1}</div>
          <span class="exam-topic-chip">${escapeHtml(q.topic)}</span>
        </div>
      </div>
      <div class="exam-stem">${renderInline(q.stem)}</div>
      <div class="exam-options">
        ${q.options
          .map((opt, oi) => {
            let cls = "exam-option";
            if (oi === q.correctIndex) cls += " reveal-correct";
            else if (oi === userAns) cls += " reveal-wrong-picked";
            return `
          <div class="${cls}">
            <div class="exam-option-letter">${LETTERS[oi]}</div>
            <div style="flex:1;">
              <div class="exam-option-text">${renderInline(opt)}${oi === userAns ? ' <em style="font-weight:600;">(your answer)</em>' : ""}</div>
              <div class="exam-option-rationale">${renderInline(q.explanations[oi])}</div>
            </div>
          </div>
        `;
          })
          .join("")}
      </div>
    </div>

    <div class="exam-bottom-nav">
      <button class="nav-btn" id="reviewPrevBtn" ${i === 0 ? "disabled" : ""}>&larr; Previous</button>
      <button class="nav-btn primary" id="reviewNextBtn" ${i === total - 1 ? "disabled" : ""}>Next →</button>
    </div>
  `;

  document.getElementById("navToggleReviewBtn").addEventListener("click", () => {
    ex._navOpenReview = !ex._navOpenReview;
    renderExamReviewAnswers(lecture, panel, ex);
  });
  panel.querySelectorAll(".exam-navtile").forEach((t) => {
    t.addEventListener("click", () => {
      ex.reviewCurrent = parseInt(t.getAttribute("data-i"), 10);
      renderExamReviewAnswers(lecture, panel, ex);
    });
  });
  document.getElementById("backToResultsBtn").addEventListener("click", () => {
    ex.phase = "results";
    renderExamPanel(lecture);
  });
  const prevBtn = document.getElementById("reviewPrevBtn");
  if (prevBtn)
    prevBtn.addEventListener("click", () => {
      if (ex.reviewCurrent > 0) {
        ex.reviewCurrent -= 1;
        renderExamReviewAnswers(lecture, panel, ex);
      }
    });
  const nextBtn = document.getElementById("reviewNextBtn");
  if (nextBtn)
    nextBtn.addEventListener("click", () => {
      if (ex.reviewCurrent < total - 1) {
        ex.reviewCurrent += 1;
        renderExamReviewAnswers(lecture, panel, ex);
      }
    });
}

function renderAll() {
  renderSidebar();
  renderMain();
}

renderAll();

</script>
