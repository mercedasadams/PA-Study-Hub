"A 16-year-old girl has dark blue-brown pigmented macules around her lips and on her buccal mucosa, present since infancy. She now presents with acute abdominal pain, and imaging reveals small bowel intussusception. Which gene mutation is most likely responsible for her underlying condition?","options":["APC","BMPR1A","STK11","SMAD4","PTEN"],"correctIndex":2,"explanations":["APC mutations cause FAP, which presents with colonic adenomas, not this pigmentation pattern.","BMPR1A mutations are also associated with juvenile polyposis, not this pigmentation pattern.","Correct — STK11 mutations cause Peutz-Jeghers syndrome, characterized by mucocutaneous pigmentation and hamartomatous polyps that predispose to intussusception.","SMAD4 mutations are associated with juvenile polyposis, not this pigmentation pattern.","PTEN mutations cause Cowden syndrome, not this pigmentation pattern."],"topic":"Small Bowel Polyps"},{"stem":"A patient with Peutz-Jeghers syndrome undergoes surveillance capsule endoscopy, which identifies a small bowel polyp measuring 17 mm. Based on lecture, what is the most appropriate management for this specific finding?","options":["Removal of the polyp, given its size and risk of triggering intussusception","Immediate surgical resection of the entire small bowel","Chemotherapy without tissue diagnosis","Repeat imaging in 10 years with no other action","No intervention needed regardless of size"],"correctIndex":0,"explanations":["Correct — small bowel polyps ≥15 mm (or ≥10 mm per general PJS management) should be removed to prevent intussusception.","Removal of the entire small bowel is not the described management for a single polyp of this size.","Chemotherapy without tissue diagnosis is not an appropriate management step for a polyp found on surveillance.","This size warrants more immediate action than a 10-year follow-up interval.","Polyps of this size in PJS carry meaningful risk and warrant removal."],"topic":"Small Bowel Polyps"},{"stem":"A patient with known familial adenomatous polyposis has undergone prophylactic colectomy. Several years later, she is found to have a duodenal adenoma. According to lecture, why is ongoing surveillance for this finding so important?","options":["Duodenal adenomas in FAP patients are the leading cause of cancer death after prophylactic colectomy","This finding requires no further monitoring once identified","Duodenal adenomas in FAP patients never progress to cancer","Duodenal adenomas are unrelated to the underlying APC mutation","Colectomy eliminates all future cancer risk in FAP patients"],"correctIndex":0,"explanations":["Correct — duodenal adenomas represent the leading cause of cancer death in FAP patients after prophylactic colectomy, making ongoing surveillance essential.","Ongoing surveillance and endoscopic resection are required for this finding.","Duodenal adenomas do carry malignant potential via the adenoma-carcinoma sequence.","Duodenal adenomas are a manifestation of the same underlying APC mutation.","Colectomy addresses colonic risk but does not eliminate risk from extracolonic sites such as the duodenum."],"topic":"Small Bowel Polyps"}],"mcQuestions":[{"stem":"What is the difference between true gastritis and reactive gastritis?","options":["True gastritis and reactive gastritis are histologically identical and cannot be distinguished.","True gastritis is caused only by NSAIDs; reactive gastritis is caused only by H. pylori.","True gastritis causes mucosal injury without inflammation; reactive gastritis involves an inflammatory cell infiltrate.","True gastritis affects only the antrum; reactive gastritis affects only the corpus.","True gastritis involves an inflammatory cell infiltrate; reactive gastritis (from NSAIDs, alcohol, bile reflux) causes mucosal injury/overgrowth with very little true inflammation."],"correctIndex":4},{"stem":"What is the most common cause of chronic gastritis worldwide?","options":["Alcohol use.","Bile reflux.","Helicobacter pylori infection.","NSAID use.","Autoimmune destruction of parietal cells."],"correctIndex":2},{"stem":"What autoantibodies are associated with autoimmune gastritis?","options":["Anti-tissue transglutaminase and anti-endomysial antibodies.","Anti-parietal cell antibodies and anti-intrinsic factor antibodies.","Anti-HBs and anti-HBc.","Anti-Saccharomyces cerevisiae and anti-nuclear antibodies.","p-ANCA and ASCA."],"correctIndex":1},{"stem":"What is the gold standard for diagnosing gastritis?","options":["Fasting serum gastrin level alone.","Abdominal ultrasound.","Urea breath test alone.","CT abdomen/pelvis with contrast.","Histology, obtained via endoscopic biopsy."],"correctIndex":4},{"stem":"What is the first-line H. pylori eradication regimen per the ACG guideline?","options":["Triple therapy for 7 days — PPI + clarithromycin + amoxicillin.","Bismuth quadruple therapy for 14 days — PPI + bismuth + tetracycline + metronidazole.","A single dose of amoxicillin plus a PPI.","PPI monotherapy for 8 weeks.","H2 blocker monotherapy for 14 days."],"correctIndex":1},{"stem":"Describe the Correa Cascade progression to gastric cancer.","options":["Normal tissue → hyperplastic polyp → adenomatous polyp → colorectal cancer.","Normal tissue → intestinal metaplasia → chronic gastritis → gastric adenocarcinoma directly.","Normal tissue → Barrett's esophagus → dysplasia → esophageal adenocarcinoma.","Normal tissue → chronic gastritis → atrophic gastritis → intestinal metaplasia → dysplasia → gastric adenocarcinoma.","Normal tissue → dysplasia → chronic gastritis → intestinal metaplasia → atrophic gastritis → gastric adenocarcinoma."],"correctIndex":3},{"stem":"What are the \"Big Three P's\" of gastroparesis etiology?","options":["Primary, Progressive, and Paraneoplastic.","Peptic, Pyloric, and Portal.","Idiopathic, Diabetic, and Postsurgical.","Pancreatic, Peritoneal, and Parasitic.","Postinfectious, Pharmacologic, and Psychiatric."],"correctIndex":2},{"stem":"What is the gold standard test for diagnosing gastroparesis?","options":["Upper GI barium series.","4-hour gastric emptying scintigraphy using a labeled low-fat egg-white meal.","Esophageal manometry.","Abdominal ultrasound.","Wireless motility capsule as the primary gold standard."],"correctIndex":1},{"stem":"What is the only FDA-approved medication for gastroparesis, and what is its major safety concern?","options":["Ondansetron; it carries a Black Box Warning for tardive dyskinesia.","Metoclopramide; it carries a Black Box Warning for irreversible renal failure.","Domperidone; it carries a Black Box Warning for QT prolongation requiring lifelong use.","Metoclopramide; it carries a Black Box Warning for tardive dyskinesia (avoid use beyond 12 weeks).","Erythromycin; it carries a Black Box Warning for hepatotoxicity."],"correctIndex":3},{"stem":"What are the \"Big Three\" etiologies of peptic ulcer disease?","options":["H. pylori infection, NSAIDs/aspirin, and idiopathic.","NSAIDs/aspirin, Zollinger-Ellison syndrome, and Crohn disease.","H. pylori infection, celiac disease, and IBD.","Idiopathic, viral ulcers, and critical illness.","H. pylori infection, smoking, and alcohol use."],"correctIndex":0},{"stem":"How does the pain pattern of a duodenal ulcer differ from a gastric ulcer?","options":["Duodenal ulcer pain radiates to the right shoulder; gastric ulcer pain radiates to the back.","Duodenal ulcer pain improves with eating and worsens 2–3 hours later (often nocturnal); gastric ulcer pain is postprandial with nausea, vomiting, and weight loss.","Duodenal ulcer pain is postprandial with weight loss; gastric ulcer pain improves with eating and worsens hours later.","Both duodenal and gastric ulcer pain occur only at night, with no relation to meals.","Duodenal ulcer pain is relieved by NSAIDs; gastric ulcer pain is worsened by antacids."],"correctIndex":1},{"stem":"What is the gold standard diagnostic test for peptic ulcer disease?","options":["EGD (upper endoscopy).","Abdominal ultrasound.","Urea breath test alone.","CT abdomen/pelvis with contrast.","Fasting serum gastrin level."],"correctIndex":0},{"stem":"Why must gastric ulcers always be biopsied?","options":["To rule out Zollinger-Ellison syndrome.","To confirm H. pylori status only.","To assess for perforation risk only.","To rule out malignancy.","To measure ulcer depth for staging."],"correctIndex":3},{"stem":"What underlying condition should be suspected when ulcers are multiple, distal (jejunal), or refractory to PPI therapy?","options":["Autoimmune gastritis.","Gastroparesis.","Zollinger-Ellison syndrome.","Celiac disease.","Chronic pancreatitis."],"correctIndex":2},{"stem":"What is the classic presentation of infantile hypertrophic pyloric stenosis?","options":["Bilious, forceful vomiting with abdominal distension.","Intermittent colicky pain with currant jelly stools.","Postprandial vomiting with a palpable epigastric mass and jaundice.","Effortless regurgitation of undigested food after meals.","Nonbilious, projectile vomiting in a \"hungry vomiter.\""],"correctIndex":4},{"stem":"What acid-base/electrolyte abnormality is classically seen with pyloric stenosis?","options":["Hyperchloremic, hyperkalemic metabolic acidosis.","Normal electrolytes with respiratory alkalosis.","Hypercalcemia with metabolic acidosis.","Hypochloremic, hypokalemic metabolic alkalosis.","Hyponatremia with respiratory acidosis."],"correctIndex":3},{"stem":"What is the gold standard imaging study for diagnosing pyloric stenosis?","options":["Plain abdominal x-ray.","Upper GI barium series.","CT abdomen/pelvis with contrast.","MRI abdomen.","Abdominal ultrasound."],"correctIndex":4},{"stem":"What is the definitive surgical treatment for pyloric stenosis?","options":["Whipple procedure.","Cricopharyngeal myotomy.","Ramstedt pyloromyotomy.","Rectopexy.","Lateral internal sphincterotomy."],"correctIndex":2},{"stem":"What does bilious vomiting in an infant suggest, as opposed to nonbilious vomiting?","options":["Gastroesophageal reflux disease with no obstruction.","Obstruction distal to the ampulla of Vater (e.g., malrotation with midgut volvulus — a surgical emergency).","A normal finding in infants under 6 weeks of age.","Obstruction proximal to the ampulla of Vater (e.g., pyloric stenosis).","A functional, non-obstructive process requiring no further workup."],"correctIndex":1},{"stem":"What clinical sign strongly suggests an upper GI bleed?","options":["Hematemesis (bloody or coffee-ground emesis).","Steatorrhea (floating, fatty stools).","Painless bright red blood on the toilet paper.","Currant jelly stools.","Hematochezia (bright red blood per rectum)."],"correctIndex":0},{"stem":"What is the most common cause of upper GI bleeding?","options":["Hemorrhoids.","Ischemic colitis.","Peptic ulcer disease.","Diverticulosis.","Colorectal polyps."],"correctIndex":2},{"stem":"What is the most common cause of lower GI bleeding?","options":["Peptic ulcer disease.","Diverticulosis.","Mallory-Weiss tear.","Gastritis.","Esophageal varices."],"correctIndex":1},{"stem":"What scoring system is best validated for predicting need for intervention or death in upper GI bleeding, and what score identifies low-risk patients safe for outpatient management?","options":["The Glasgow-Blatchford Score (GBS); a GBS ≥7 identifies low-risk patients.","The Rockall Score; a Rockall score ≤1 identifies low-risk patients.","The Glasgow-Blatchford Score (GBS); a GBS ≤1 identifies low-risk patients.","The Oakland Score; an Oakland score ≥8 identifies low-risk patients.","The Alvarado Score; an Alvarado score ≤1 identifies low-risk patients."],"correctIndex":2},{"stem":"In endoscopic hemostasis for GI bleeding, why should epinephrine injection never be used alone?","options":["It is only effective when combined with systemic antibiotics.","It must be combined with a second modality (thermal therapy or clips) for adequate hemostasis.","It must be combined with octreotide infusion for adequate hemostasis.","It has no hemostatic effect and is used only for pain control.","It increases the risk of perforation when used as monotherapy."],"correctIndex":1},{"stem":"What two types of medications should be started empirically at presentation for suspected variceal bleeding?","options":["Antiemetics (e.g., ondansetron) and a stimulant laxative.","Antibiotics (e.g., ceftriaxone) and a proton pump inhibitor only.","A beta blocker (e.g., propranolol) and an anticoagulant.","Antibiotics (e.g., ceftriaxone) and a vasoactive drug (e.g., octreotide or terlipressin).","A vasoactive drug (e.g., octreotide) and an antimotility agent."],"correctIndex":3},{"stem":"What is the key pathophysiologic mechanism of acute appendicitis?","options":["Appendiceal luminal obstruction leading to increased intraluminal pressure, ischemia, necrosis, and perforation.","Venous thrombosis of the appendiceal artery from a hypercoagulable state.","Direct bacterial invasion of the appendiceal serosa without luminal obstruction.","Autoimmune destruction of the appendiceal lymphoid tissue.","Chronic inflammation from dietary fiber deficiency alone."],"correctIndex":0},{"stem":"What is the most common cause of appendiceal obstruction in young adults?","options":["Foreign body ingestion.","Appendicoliths.","Parasitic infection.","Lymphoid follicular hyperplasia.","Neoplasm."],"correctIndex":3},{"stem":"What physical exam finding is the single most important sign of appendicitis?","options":["Rebound tenderness alone.","McBurney point tenderness.","Psoas sign.","Rovsing sign.","Obturator sign."],"correctIndex":1},{"stem":"What lab test is mandatory in women of reproductive age with suspected appendicitis?","options":["AFP, to exclude hepatocellular carcinoma.","CEA, to exclude colorectal malignancy.","CA 19-9, to exclude pancreatic malignancy.","CA 125, to exclude ovarian malignancy.","Beta-hCG, to exclude ectopic pregnancy."],"correctIndex":4},{"stem":"What is the first-line imaging modality for appendicitis in adults, and what is preferred in children/pregnant patients?","options":["Plain abdominal x-ray in adults; MRI in children and pregnant patients.","MRI in adults; CT abdomen/pelvis in children and pregnant patients.","Ultrasound in adults; CT abdomen/pelvis with IV contrast in children and pregnant patients.","CT abdomen/pelvis without contrast in all populations equally.","CT abdomen/pelvis with IV contrast in adults; ultrasound in children and pregnant patients."],"correctIndex":4},{"stem":"What percentage of patients with uncomplicated appendicitis can be successfully treated with antibiotics alone?","options":["Approximately 50%.","Approximately 30%.","Approximately 90%.","Approximately 10%.","Approximately 70%."],"correctIndex":4},{"stem":"What genetic markers are associated with celiac disease?","options":["HLA-DR3 and HLA-DR15.","HLA-Cw6 and HLA-DQ6.","HLA-DQ2 and HLA-DQ8.","HLA-B27 and HLA-DR4.","HLA-A3 and HLA-B7."],"correctIndex":2},{"stem":"What is the pathognomonic skin finding of celiac disease, and how is it diagnosed?","options":["Pyoderma gangrenosum, diagnosed by biopsy showing neutrophilic infiltrate.","Erythema nodosum, diagnosed by punch biopsy showing panniculitis.","Dermatitis herpetiformis, diagnosed by granular IgA deposits on perilesional skin biopsy.","Mucocutaneous pigmentation, diagnosed by biopsy showing melanin deposition.","Acanthosis nigricans, diagnosed by clinical appearance alone."],"correctIndex":2},{"stem":"What is the first-line serologic test for celiac disease, and what must be checked simultaneously?","options":["IgA anti-tissue transglutaminase (tTG-IgA); total serum albumin must be checked simultaneously.","IgA anti-tissue transglutaminase (tTG-IgA); total serum IgA must be checked to rule out selective IgA deficiency.","HLA-DQ2/DQ8 genetic testing; no additional test is needed.","Anti-parietal cell antibody; total serum IgA must be checked simultaneously.","EMA-IgG; total serum IgG must be checked to rule out selective IgG deficiency."],"correctIndex":1},{"stem":"Why must celiac disease testing be performed while the patient is still eating gluten?","options":["A gluten-free diet before testing causes false-positive results.","Gluten intake has no effect on serologic test accuracy.","Testing must be delayed until symptoms resolve on a gluten-free diet.","A gluten-free diet is required for at least 6 months before any testing.","A gluten-free diet before testing causes false-negative results."],"correctIndex":4},{"stem":"What is the only effective treatment for celiac disease?","options":["Pancreatic enzyme supplementation.","A short-term (3-month) gluten-free diet.","A low-FODMAP diet.","A strict, lifelong gluten-free diet.","Oral corticosteroids."],"correctIndex":3},{"stem":"What is the feared malignant complication of refractory celiac disease type II?","options":["Gastric adenocarcinoma.","Hepatocellular carcinoma.","Enteropathy-associated T-cell lymphoma (EATL).","Pancreatic adenocarcinoma.","Colorectal adenocarcinoma."],"correctIndex":2},{"stem":"What is the classic triad of intussusception?","options":["Pancreatic calcifications, steatorrhea, and diabetes mellitus.","Intermittent colicky abdominal pain, currant jelly stool, and a palpable sausage-shaped mass.","Fever, RUQ pain, and jaundice.","Ascites, bleeding, and caput medusae.","Nonbilious projectile vomiting, weight loss, and a palpable olive-shaped mass."],"correctIndex":1},{"stem":"What is the most common lead point of intussusception in children, and what is the most common anatomic type?","options":["Lymphoid hyperplasia; the ileocolic type.","Duplication cyst; the jejunojejunal type.","Lymphoma; the cecocolic type.","Intestinal polyp; the colocolic type.","Meckel diverticulum; the ileoileal type."],"correctIndex":0},{"stem":"What is the diagnostic modality of choice for intussusception, and what is the classic ultrasound finding?","options":["Ultrasound; the \"target/doughnut sign.\"","CT; the \"bird beak\" sign.","Barium enema; the \"string sign.\"","MRI; the \"apple core\" sign.","Plain x-ray; \"thumbprinting.\""],"correctIndex":0},{"stem":"What is the first-line treatment for intussusception in a stable patient without perforation?","options":["Immediate exploratory laparotomy.","Immediate colostomy.","Observation with no intervention.","Long-term antibiotic therapy alone.","Non-operative enema reduction (air/pneumatic enema preferred)."],"correctIndex":4},{"stem":"What is the most common cause of small bowel obstruction overall?","options":["Incarcerated hernias.","Volvulus.","Crohn disease.","Neoplasm.","Adhesions, typically from prior abdominal surgery."],"correctIndex":4},{"stem":"What is the classic clinical tetrad of small bowel obstruction?","options":["Colicky abdominal pain, nausea/vomiting, abdominal distension, and obstipation/constipation.","Postprandial pain, food fear, weight loss, and an abdominal bruit.","Fever, RUQ pain, jaundice, and altered mental status.","Diarrhea, tenesmus, hematochezia, and urgency.","Painless jaundice, weight loss, and a palpable gallbladder."],"correctIndex":0},{"stem":"What CT finding differentiates a mechanical small bowel obstruction from an ileus?","options":["SBO and ileus have identical, indistinguishable CT findings.","SBO shows free air under the diaphragm; ileus shows pneumatosis intestinalis.","SBO shows a transition point; ileus shows diffusely dilated bowel without a transition point.","SBO shows diffusely dilated bowel without a transition point; ileus shows a transition point.","SBO shows colonic dilation greater than 6 cm; ileus shows small bowel dilation only."],"correctIndex":2},{"stem":"What type of small bowel obstruction is considered a surgical emergency due to risk of rapid ischemia?","options":["Simple obstruction without vascular compromise.","Partial obstruction.","Adhesive obstruction responding to NGT decompression.","Closed-loop obstruction.","Paralytic ileus."],"correctIndex":3},{"stem":"What contrast agent, when used diagnostically, can also predict successful nonoperative management of SBO if it reaches the colon?","options":["Gastrografin (water-soluble contrast).","Gadolinium contrast.","Air contrast.","Barium sulfate contrast.","Iodinated IV contrast alone."],"correctIndex":0},{"stem":"What gene mutation causes Peutz-Jeghers syndrome, and what is its most feared small bowel complication?","options":["MLH1 gene mutation; endometrial cancer.","PTEN gene mutation; macrocephaly.","SMAD4 gene mutation; gastrointestinal bleeding.","STK11 gene mutation; intussusception.","APC gene mutation; colorectal cancer by age 20."],"correctIndex":3},{"stem":"What is the characteristic physical exam finding in Peutz-Jeghers syndrome?","options":["Mucocutaneous pigmentation — dark blue/brown macules on the lips, buccal mucosa, perioral area, hands, and feet.","A palpable olive-shaped mass in the epigastrium.","Café-au-lait spots and axillary freckling.","Telangiectasias of the lips, tongue, and fingertips.","Hundreds to thousands of colonic polyps visible on colonoscopy."],"correctIndex":0},{"stem":"In familial adenomatous polyposis (FAP), what is the leading cause of cancer death after prophylactic colectomy?","options":["Anal squamous cell carcinoma.","Pancreatic adenocarcinoma.","Hepatocellular carcinoma.","Duodenal adenomas/duodenal cancer.","Gastric adenocarcinoma."],"correctIndex":3},{"stem":"What is the primary noninvasive diagnostic modality for visualizing small bowel polyps, and what technique allows both diagnosis and therapeutic polypectomy throughout the small bowel?","options":["Capsule endoscopy; double-balloon enteroscopy (DBE).","Upper endoscopy; rubber band ligation.","CT enterography; laparoscopic resection only.","Barium enema; EUS-FNA.","Colonoscopy; ERCP."],"correctIndex":0}]},{"id":"l4","number":4,"title":"Colon & Rectal Disorders","week":"Week 13","filename":"Lecture 4 - Week 13 GI Lecture Colon and Rectal Disorders","topics":[{"name":"Constipation & Fecal Impaction","sections":[{"label":"Definition / Epidemiology","bullets":[{"text":"Constipation = passing < 3 stools per week; also includes difficulty passing stool, hard stools, and/or incomplete evacuation.","level":0},{"text":"Normal bowel habits vary widely between individuals.","level":0}]},{"label":"Etiology","bullets":[{"text":"Multi-variable: dietary habits (low fiber/fluid).","level":0},{"text":"Motor disorders: DM, hypothyroidism, colorectal cancer, celiac disease.","level":0},{"text":"Medications: **opioids**, ondansetron (Zofran), verapamil, and many others.","level":0}]},{"label":"Fecal Impaction (complication)","bullets":[{"text":"A solid, immobile bulk of stool in the rectum caused by decreased fecal mobility.","level":0},{"text":"Presents with severe abdominal pain and a heavy stool burden visible on x-ray.","level":0}]},{"label":"Treatment — Constipation","bullets":[{"text":"**1st line: high-fiber diet** — retains water, forms bulkier stool.","level":0},{"text":"Bulk-forming laxatives (psyllium, methylcellulose, polycarbophil, wheat dextrin) — usually combined with high-fiber diet.","level":0},{"text":"Osmotic laxatives — PEG (MiraLAX), synthetic sugars (lactulose, sorbitol), saline laxatives (Milk of Magnesia, magnesium citrate).","level":0},{"text":"Stimulant laxatives (senna, bisacodyl) — increase acetylcholine-mediated motility/peristalsis.","level":0},{"text":"Stool softeners/surfactants (docusate sodium, often + senna) — lower stool surface tension.","level":0},{"text":"Enemas/suppositories reserved for severe symptoms or recent impaction (glycerin/bisacodyl suppository; tap water or sodium phosphate enema — watch electrolytes/volume status).","level":0},{"text":"Use a step-wise approach: add one agent at a time; taper gradually (abrupt taper can cause refractory constipation).","level":0}]},{"label":"Treatment — Fecal Impaction","bullets":[{"text":"1st line: manual disimpaction followed by colon evacuation with PEG-electrolyte enema.","level":0},{"text":"If unsuccessful: water contrast enema (Gastrografin or Hypaque) under fluoroscopy.","level":0},{"text":"After disimpaction: daily MiraLAX or warm enemas for up to 3 days.","level":0},{"text":"Prevent recurrence: sorbitol, lactulose, and/or MiraLAX — goal of at least one stool every other day.","level":0}]}]},{"name":"Fecal Incontinence","sections":[{"label":"Definition / Risk Factors","bullets":[{"text":"Involuntary loss of solid or liquid feces.","level":0},{"text":"Risk factors: age, diarrhea, fecal urgency, urinary incontinence, DM, central adiposity.","level":0}]},{"label":"Etiology","bullets":[{"text":"**Acute diarrhea (most common)** — infection or new medication.","level":0},{"text":"Neurologic: sudden loss of sphincter control (spinal cord injury, cauda equina).","level":0},{"text":"Anorectal trauma: recent childbirth or anorectal surgery.","level":0},{"text":"Other: IBS, neurologic disease (Parkinson's, MS), diabetes mellitus.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"History is key: onset/duration/frequency/amount; associated diarrhea.","level":0},{"text":"Urge incontinence (desire to defecate but unable to retain stool) vs. passive incontinence (no awareness of need to defecate).","level":0},{"text":"Nocturnal incontinence suggests underlying bowel disorder (e.g., DM).","level":0},{"text":"Red flags for neurologic cause: sudden onset without change in bowel habits, low back/perineal pain, lower extremity motor/sensory symptoms, urinary incontinence.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Physical exam: perianal inspection (hemorrhoids, fistula, prolapse); anal wink reflex (absence suggests a neurologic process); DRE (impaction, tumor, sphincter tone).","level":0},{"text":"Labs usually not required.","level":0},{"text":"Persistent incontinence warrants endoscopic evaluation (flexible sigmoidoscopy).","level":0}]},{"label":"Treatment","bullets":[{"text":"1st line: supportive therapy — avoid triggering foods/activities; bulking agents and antidiarrheals (loperamide/Imodium) if diarrhea present.","level":0},{"text":"Refer to GI if no response.","level":0},{"text":"Next steps: biofeedback, injectable anal bulking agents, sacral nerve stimulation/testing, anal sphincteroplasty.","level":0},{"text":"Refractory disease may require colostomy or ileostomy.","level":0}]}]},{"name":"Paralytic (Adynamic) Ileus","sections":[{"label":"Pathophysiology","bullets":[{"text":"Functional bowel obstruction due to neurogenic failure of peristalsis, inhibiting propulsion of intestinal contents.","level":0}]},{"label":"Etiology","bullets":[{"text":"**Postoperative state (most common)** — hence early ambulation after surgery.","level":0},{"text":"Medications: opioids, antidiarrheals.","level":0},{"text":"Electrolyte abnormalities: hypokalemia, hypercalcemia, hypomagnesemia.","level":0},{"text":"Other illnesses: severe hypothyroidism, DM.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Similar to small bowel obstruction but slower onset: abdominal pain, nausea/vomiting, obstipation, distention, early satiety.","level":0},{"text":"PE: decreased/absent bowel sounds, abdominal distention and tympany, mild tenderness to palpation.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Labs: CBC, electrolytes, LFTs, amylase/lipase.","level":0},{"text":"Abdominal x-ray: diffuse dilated bowel loops WITHOUT a transition zone; paucity of gas in colon/rectum.","level":0},{"text":"CT abdomen/pelvis CONFIRMS diagnosis and differentiates ileus from mechanical obstruction.","level":0}]},{"label":"Treatment","bullets":[{"text":"Supportive care: NPO/bowel rest, advance diet as tolerated (start clear liquids).","level":0},{"text":"IV fluids and electrolyte replacement.","level":0},{"text":"Serial abdominal films, daily abdominal girths, symptom monitoring.","level":0},{"text":"NGT placement for decompression.","level":0},{"text":"Most post-operative ileus resolves within 1–3 days; watch for perforation → peritonitis → sepsis if worsening.","level":0}]}]},{"name":"Anal Fissures","sections":[{"label":"Epidemiology","bullets":[{"text":"Most common benign anorectal disease and one of the most common causes of anal bleeding.","level":0},{"text":"Often seen in infants and middle-aged adults.","level":0}]},{"label":"Etiology / Pathophysiology","bullets":[{"text":"Local trauma from constipation/hard stools (most common); also diarrhea, vaginal delivery, anal intercourse.","level":0},{"text":"Tearing of the anoderm in the distal anal canal → cycle of recurring anal pain and bleeding.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Anal pain exacerbated by defecation; BRBPR/hematochezia.","level":0},{"text":"Longitudinal tear in the anoderm, usually not extending proximal to the dentate line.","level":0},{"text":"90% located in the posterior midline of the anal canal.","level":0},{"text":"Acute: superficial laceration (\"paper cut\"). Chronic: raised edges exposing white, horizontally-oriented internal anal sphincter fibers ± sentinel pile.","level":0}]},{"label":"Treatment","bullets":[{"text":"Conservative: increased fiber diet/stool softeners, sitz baths, topical analgesics (lidocaine).","level":0},{"text":"Medical: topical vasodilators (nifedipine, nitroglycerin) — relax internal sphincter, increase blood flow, promote healing; typically ~1 month course.","level":0},{"text":"Surgical: lateral internal sphincterotomy (LIS) — reserved for failure of treatment > 2 months or chronic fissure changes (fibrosis, sentinel pile, rolled edges).","level":0}]}]},{"name":"Hemorrhoids","sections":[{"label":"Definition / Risk Factors","bullets":[{"text":"Abnormal engorgement/progression of anal cushions (normal vascular structures draining into superior/inferior hemorrhoidal veins).","level":0},{"text":"Types: internal (proximal to dentate line), external (distal to dentate line), mixed (straddle dentate line).","level":0},{"text":"Risk factors: age, diarrhea, pregnancy, pelvic tumors, prolonged sitting, straining, chronic constipation.","level":0}]},{"label":"Classification — Internal Hemorrhoids","bullets":[{"text":"Grade I: visualized on anoscopy, may bulge but no prolapse below dentate line.","level":0},{"text":"Grade II: prolapse with defecation/straining, reduce spontaneously.","level":0},{"text":"Grade III: prolapse with defecation/straining, require manual reduction.","level":0},{"text":"Grade IV: irreducible; may strangulate.","level":0}]},{"label":"Classification — External / Mixed","bullets":[{"text":"External: distal to dentate line; close to somatically innervated tissue → more painful, especially when thrombosed.","level":0},{"text":"Mixed: straddle the dentate line.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"~40% of patients are asymptomatic.","level":0},{"text":"Internal: perianal pruritus/irritation, leakage of rectal contents, painless BRBPR.","level":0},{"text":"Thrombosis (more common in external): acute perianal pain and palpable \"lump.\"","level":0},{"text":"PE: internal hemorrhoids usually not palpable on DRE; thrombosed hemorrhoid extremely tender; anoscopy shows bulging purplish-blue veins.","level":0}]},{"label":"Treatment","bullets":[{"text":"Asymptomatic / Grade I–II: conservative — high fiber/fluid diet, topical lidocaine-hydrocortisone, Preparation H (phenylephrine, petrolatum, mineral oil), sitz baths.","level":0},{"text":"Grade II–III refractory to conservative treatment: rubber band ligation (most common; internal only; **contraindicated** with coagulopathy, anticoagulation, or portal hypertension), sclerotherapy (high recurrence), infrared coagulation (more recurrence, fewer complications than banding).","level":0},{"text":"Grade IV: surgical hemorrhoidectomy.","level":0},{"text":"Acute thrombosed external hemorrhoid: office-based excision if within first 3 days of symptoms; OR excision if extensive bleeding/severe pain.","level":0}]}]},{"name":"Anorectal Abscess / Fistula","sections":[{"label":"Pathophysiology","bullets":[{"text":"Two phases of the same process, originating from an obstructed anal duct/crypt gland: abscess (acute infection) → fistula (chronic suppuration/tunnel from anal gland to skin).","level":0},{"text":"~50% of anorectal abscesses result in a chronic fistula.","level":0}]},{"label":"Etiology","bullets":[{"text":"Infectious: **Staphylococcus aureus (most common)**, E. coli, Proteus, Streptococcus.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Abscess: severe, constant anal pain worsened by sitting, coughing, and/or defecation; posterior wall is the most common site.","level":0},{"text":"Fistula: anal discharge and pain.","level":0},{"text":"Systemic infection: fever, malaise.","level":0},{"text":"PE: fluctuance or erythematous/indurated perianal skin; deep (e.g., supralevator) abscesses may have no external findings — require DRE/imaging (CT or MRI); purulent drainage if spontaneously draining.","level":0}]},{"label":"Treatment","bullets":[{"text":"**1st line: surgical drainage** — untreated abscess can lead to systemic infection.","level":0},{"text":"Post-surgical antibiotics: 5-day course of amoxicillin-clavulanate (Augmentin) 875/125 q8–12h, OR ciprofloxacin 500 mg BID + metronidazole (Flagyl) 500 mg q8h.","level":0},{"text":"Post-op \"WASH\" regimen: Warm water cleansing, Analgesics (topical lidocaine), Sitz baths, High fiber diet.","level":0}]}]},{"name":"Rectal Prolapse","sections":[{"label":"Overview","bullets":[{"text":"Rectal procidentia — a pelvic floor disorder seen most often in women (can occur in men).","level":0},{"text":"Complete: protrusion of all layers of the rectum through the anus.","level":0},{"text":"Partial: prolapse of the mucosa only.","level":0},{"text":"Occult (rectal intussusception): telescoping of bowel on itself without protruding through the anal verge (not a true prolapse).","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Symptoms: abdominal discomfort, incomplete bowel evacuation, rectal wall protrusion, altered bowel habits.","level":0},{"text":"PE: most common sign is full-thickness protrusion of rectum through the anus — must be differentiated from hemorrhoids.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Colonoscopy (screening), defecography (imaging of pelvic floor muscles during defecation), anorectal physiologic studies.","level":0}]},{"label":"Treatment","bullets":[{"text":"Surgical repair (rectopexy) — definitive treatment; recurrence and enlargement common if not repaired.","level":0},{"text":"Pelvic floor exercises as an adjunct.","level":0}]}]},{"name":"Irritable Bowel Syndrome (IBS)","sections":[{"label":"Overview / Epidemiology","bullets":[{"text":"Disorder of brain–gut interaction causing abdominal pain and altered bowel habits.","level":0},{"text":"Associated with fibromyalgia, chronic fatigue syndrome, GERD, psychiatric disorders.","level":0},{"text":"Onset typically teens to early 20s; more common in women.","level":0}]},{"label":"Clinical Presentation / Subtypes","bullets":[{"text":"IBS-C: predominant constipation. IBS-D: predominant diarrhea. IBS-M: mixed constipation/diarrhea. IBS-U: unclassified.","level":0},{"text":"Cramping abdominal pain, variable location, associated with defecation (may improve after); worsened by stress and/or certain foods.","level":0},{"text":"PE is usually benign.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Diagnosis of exclusion — rule out infection, celiac disease, and other causes first.","level":0},{"text":"Rome diagnostic criteria: recurrent abdominal pain, on average, several days per month over the past 3 months, associated with ≥2 of: related to defecation, change in stool frequency, change in stool form/appearance.","level":0}]},{"label":"Treatment","bullets":[{"text":"1st line: lifestyle modification — low fat, high fiber diet; avoid processed foods and foods high in sorbitol/fructose.","level":0},{"text":"IBS-C: PEG + fiber → add osmotic laxative if no improvement → linaclotide or lubiprostone (increase intestinal chloride/fluid secretion) if still refractory.","level":0},{"text":"IBS-D: loperamide (Imodium) → add bile acid sequestrant (cholestyramine) if no response → add anticholinergic (dicyclomine, methscopolamine) if still refractory.","level":0}]}]},{"name":"Diverticular Disease (Diverticulosis & Diverticulitis)","sections":[{"label":"Diverticulosis — Overview","bullets":[{"text":"Diverticula = sac-like protrusions of the colonic wall; diverticulosis = presence of diverticula.","level":0},{"text":"Most common in the left colon; the right colon is the most common source of bleeding (thinner walls).","level":0},{"text":"Risk factors: male sex, smoking, obesity, constipation, low-fiber diet, increasing age.","level":0}]},{"label":"Diverticulosis — Clinical / Diagnostics / Treatment","bullets":[{"text":"**Most common cause of acute lower GI bleeding** (painless hematochezia); increased risk with NSAID/aspirin use.","level":0},{"text":"Diagnostics: colonoscopy 1st line (after upper GI bleed ruled out); tagged RBC scan to localize the bleeding source.","level":0},{"text":"Treatment: bleeding stops spontaneously most of the time; lifestyle modification (high fiber diet, psyllium); endoscopic therapy (epinephrine injection) if significant bleeding.","level":0}]},{"label":"Diverticulitis — Pathophysiology / Clinical Presentation","bullets":[{"text":"Inflammation/necrosis of diverticula from micro- or macroperforation; sigmoid colon most common site (high intraluminal pressure).","level":0},{"text":"LLQ abdominal pain, nausea/vomiting, change in bowel habits (constipation or diarrhea).","level":0},{"text":"PE: LLQ tenderness, rebound tenderness, guarding; palpable mass if abscess present; signs of sepsis/peritonitis if perforated.","level":0}]},{"label":"Diverticulitis — Diagnostics","bullets":[{"text":"CBC with differential: leukocytosis.","level":0},{"text":"**1st line imaging: CT abdomen/pelvis with contrast** — bowel wall thickening (>4 mm), pericolonic fat stranding, diverticula.","level":0},{"text":"Stool studies to rule out infection.","level":0},{"text":"Colonoscopy CONTRAINDICATED acutely due to perforation risk.","level":0}]},{"label":"Diverticulitis — Treatment","bullets":[{"text":"~70% of cases can be managed without hospitalization.","level":0},{"text":"Inpatient criteria: complicated diverticulitis on CT (abscess, perforation, obstruction, fistula) OR uncomplicated diverticulitis with sepsis, uncontrolled pain, age >70, significant comorbidities (DM, recent cardiac event, chronic liver disease, ESRD), immunosuppression, inability to tolerate oral intake, compliance issues, or failed outpatient treatment.","level":0},{"text":"Uncomplicated (outpatient): PO metronidazole + ciprofloxacin/levofloxacin ×7–10 days; clear liquid diet, advance as tolerated.","level":0},{"text":"Complicated (inpatient): IV metronidazole + cipro/levo, or piperacillin-tazobactam (Zosyn) alternative; surgical drainage if abscess >3–4 cm; surgery if refractory, recurrent, or perforated.","level":0}]}]},{"name":"Toxic Megacolon","sections":[{"label":"Definition / Etiology","bullets":[{"text":"Total or segmental non-obstructive colonic dilation occurring with systemic toxicity.","level":0},{"text":"Causes: ulcerative colitis (complication), infectious colitis (CMV, C. difficile, Salmonella, Shigella, Campylobacter), radiation therapy, colorectal cancer.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Severe bloody diarrhea, abdominal pain, nausea/vomiting, tenesmus.","level":0},{"text":"PE: lower abdominal tenderness with distention plus signs of acute toxicity — fever, tachycardia, hypotension, dehydration, altered mental status; peritonitis signs (rigidity, guarding, rebound) if perforated.","level":0}]},{"label":"Diagnostic Criteria","bullets":[{"text":"Radiographic colonic dilation > 6 cm (abdominal x-ray and/or CT) **plus** ≥3 of: fever >38°C, HR >120 bpm, neutrophilic leukocytosis >10,000, anemia, **plus** ≥1 of: dehydration, altered mental status, electrolyte disturbance, hypotension.","level":0}]},{"label":"Treatment","bullets":[{"text":"Supportive: IV fluids/electrolyte replacement, bowel rest (NPO), broad-spectrum IV antibiotics (ceftriaxone + metronidazole), NGT decompression, avoid antimotility agents (opioids, anticholinergics).","level":0},{"text":"Treat underlying cause: UC → IV steroids; CMV colitis → IV ganciclovir; C. diff colitis → oral vancomycin/fidaxomicin.","level":0},{"text":"Colonic perforation (peritonitis/sepsis) → emergent surgery (partial or total colectomy).","level":0}]}]},{"name":"Inflammatory Bowel Disease — Crohn Disease & Ulcerative Colitis","sections":[{"label":"Shared Risk Factors","bullets":[{"text":"Race/ethnicity: more common in Jewish populations; increased in Caucasians vs. Hispanic/African populations.","level":0},{"text":"Onset age 15–35 (UC more common in males; Crohn's more common in females).","level":0},{"text":"Genetics: 10–30% have a first-degree relative with IBD.","level":0},{"text":"Smoking increases risk of Crohn disease.","level":0},{"text":"Low-fiber diet, history of GI infections, medications (NSAIDs, oral contraceptives, HRT).","level":0}]},{"label":"Crohn Disease — Pathophysiology","bullets":[{"text":"Idiopathic; **transmural** inflammation that can affect any part of the GI tract.","level":0},{"text":"Skip lesions — segments of normal bowel interspersed with diseased segments.","level":0},{"text":"**Terminal ileum is the most commonly involved segment; rectum is usually spared.**","level":0},{"text":"Can lead to fistulas, strictures, abscesses, fibrosis, bowel obstruction.","level":0}]},{"label":"Crohn Disease — Clinical Presentation","bullets":[{"text":"Crampy abdominal pain; chronic/persistent diarrhea WITHOUT gross blood.","level":0},{"text":"Fatigue/weight loss from malabsorption; electrolyte abnormalities (B12 deficiency, hypocalcemia).","level":0},{"text":"Ileocolitis: RLQ pain, diarrhea, fatigue, weight loss, fever, anorexia.","level":0},{"text":"Severe disease: perianal disease, abscess, fistula.","level":0}]},{"label":"Crohn Disease — Diagnostics","bullets":[{"text":"Ileocolonoscopy with biopsy: segmental disease, cobblestoning of mucosa, aphthous focal ulcerations, strictures.","level":0},{"text":"Biopsy: transmural inflammation, focal lesions ± noncaseating granulomas.","level":0},{"text":"Imaging: MR enterography preferred (avoids radiation, comparable accuracy).","level":0},{"text":"Labs: + anti-Saccharomyces cerevisiae antibodies (ASCA), iron/B12 deficiency, elevated CRP/ESR.","level":0}]},{"label":"Ulcerative Colitis — Pathophysiology","bullets":[{"text":"Chronic inflammation limited to the **mucosal/submucosal layers only**.","level":0},{"text":"Involves the rectum and extends proximally in a **continuous, circumferential** pattern.","level":0},{"text":"40–50% of cases are limited to the rectum/rectosigmoid.","level":0}]},{"label":"Ulcerative Colitis — Clinical Presentation","bullets":[{"text":"Hematochezia (gross bright red/maroon blood), diarrhea with blood, LLQ abdominal pain.","level":0},{"text":"Increased urgency, tenesmus.","level":0},{"text":"Systemic symptoms if severe/infectious: fever, fatigue, malaise, weight loss.","level":0}]},{"label":"Ulcerative Colitis — Diagnostics","bullets":[{"text":"Flexible sigmoidoscopy/colonoscopy — avoid during severe flare (perforation risk). Shows uniform mucosal erythema, granularity, ulceration.","level":0},{"text":"Biopsy: nonspecific — crypt abscess/atrophy, goblet cell depletion, mucosal lymphocyte/plasma cell infiltration.","level":0},{"text":"Double contrast barium enema: \"lead pipe/stovepipe\" sign (loss of haustral markings).","level":0},{"text":"Labs: + p-ANCA (perinuclear anti-neutrophil cytoplasmic antibody), elevated ESR/CRP, anemia of chronic disease, leukocytosis if severe.","level":0}]},{"label":"Treatment — Crohn Disease","bullets":[{"text":"Immune-mediated disease — goal is immune system control; step-up approach based on location.","level":0},{"text":"Limited/right colon or left-sided disease: oral glucocorticoids (prednisone, budesonide) ± oral 5-ASA (mesalamine); taper over time.","level":0},{"text":"Severe/refractory: immunomodulators (azathioprine, 6-mercaptopurine, methotrexate); biologics — anti-TNF agents (adalimumab, infliximab).","level":0},{"text":"Follow-up: repeat flex sig/colonoscopy in 6–12 months; close monitoring of acute flares.","level":0}]},{"label":"Treatment — Ulcerative Colitis","bullets":[{"text":"Immune-mediated disease; approach depends on location/severity.","level":0},{"text":"Mild-moderate right-sided: topical (rectal) 5-ASA/mesalamine suppository 1st line → add topical glucocorticoid → oral 5-ASA → oral steroids.","level":0},{"text":"Left-sided/extensive colitis: combination oral + topical 5-ASA up front → add topical glucocorticoid → budesonide MMX → oral steroids.","level":0},{"text":"Refractory to steroids: anti-TNF or anti-integrin therapy (vedolizumab).","level":0},{"text":"Severe colitis with significant bleeding requiring hospitalization: IV steroids.","level":0}]}]},{"name":"Acute Mesenteric Ischemia","sections":[{"label":"Etiology","bullets":[{"text":"**Acute arterial occlusion** — embolism (most common cause; atrial fibrillation, atherosclerosis); superior mesenteric artery is the most common occlusion site. Accounts for 60–70% of cases.","level":0},{"text":"Non-occlusive — low flow state from sepsis/shock, MI, CHF, or arterial vasospasm (cocaine).","level":0},{"text":"Venous thrombosis — obstruction of venous outflow, most commonly from hypercoagulable states (Factor V Leiden), malignancy, or prior abdominal surgery.","level":0},{"text":"High mortality rate (~60%).","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"**Severe abdominal pain out of proportion to physical exam findings**, poorly localized.","level":0},{"text":"Nausea/vomiting/diarrhea.","level":0},{"text":"PE: limited early findings; advanced stage shows peritonitis, shock, sepsis.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"**1st line: CT angiography** (without oral contrast) if patient is stable.","level":0},{"text":"Catheter-based arteriography — confirmatory and therapeutic (vasodilators, angioplasty, thrombolytics).","level":0},{"text":"Labs: leukocytosis, elevated lactic acid, elevated LDH.","level":0}]},{"label":"Treatment","bullets":[{"text":"Requires rapid revascularization ± excision of necrotic bowel.","level":0},{"text":"Embolism: early surgical embolectomy and/or thrombolytics.","level":0},{"text":"Arterial thrombosis: surgical revascularization (aortomesenteric bypass) or endovascular angioplasty/stenting.","level":0},{"text":"Venous thrombosis: systemic anticoagulation or thrombolytics.","level":0},{"text":"Perforation/peritonitis: emergent surgical exploration with likely bowel resection and revascularization.","level":0}]}]},{"name":"Chronic Mesenteric Ischemia","sections":[{"label":"Pathophysiology / Risk Factors","bullets":[{"text":"Reduced blood flow to the small bowel from atherosclerotic narrowing of ≥2 of the 3 major splanchnic vessels (celiac axis, superior mesenteric artery, inferior mesenteric artery).","level":0},{"text":"Typically caused by post-prandial hypoperfusion of affected bowel (\"intestinal angina\").","level":0},{"text":"Risk factors: atherosclerosis (history of MI, stroke), DM, HTN, smoking.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Chronic, dull abdominal pain that worsens after meals; anorexia; weight loss (\"food fear\").","level":0},{"text":"PE: mild tenderness to palpation; abdominal bruit in up to 50% of cases.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"1st line: CT angiography. Confirmatory: conventional angiography.","level":0}]},{"label":"Treatment","bullets":[{"text":"Asymptomatic: lifestyle modification (smoking cessation, DM control), antiplatelet therapy.","level":0},{"text":"Symptomatic: revascularization (open or endovascular) with bypass and/or stenting.","level":0}]}]},{"name":"Ischemic Colitis","sections":[{"label":"Epidemiology / Etiology","bullets":[{"text":"Ischemic injury to the colon from reduced blood flow; **90% occur in patients age 60+**.","level":0},{"text":"Occurs in \"watershed areas\" with limited collateral circulation; ischemia is usually mucosal, not transmural.","level":0},{"text":"**Non-occlusive (95%)** — systemic hypotension or atherosclerosis of the superior/inferior mesenteric arteries; embolus/thrombosis is less common.","level":0},{"text":"Risk factors: age, DM, CAD, hyperlipidemia, hypercoagulable states, constipation-inducing medications, dehydration.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Rapid onset of abdominal pain over the affected region (left-sided/LLQ most common).","level":0},{"text":"Bloody diarrhea within 24 hours of pain onset (colonic mucosal sloughing).","level":0},{"text":"PE: abdominal tenderness over the affected (often lateral) area.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"1st line imaging: CT abdomen/pelvis — wall edema, \"thumbprinting\" (segmental bowel wall thickening/edema), double halo/target sign.","level":0},{"text":"Sigmoidoscopy/colonoscopy CONFIRMS diagnosis (contraindicated if high risk for or active perforation).","level":0}]},{"label":"Treatment","bullets":[{"text":"Supportive care first — most patients respond: restore perfusion, bowel rest (NPO), IV fluids, consider antibiotics; close monitoring for perforation/peritonitis.","level":0},{"text":"Surgical resection if colonic infarction/necrosis is present.","level":0}]}]},{"name":"Colonic Polyps","sections":[{"label":"Overview","bullets":[{"text":"A protuberance into the colonic lumen from the surrounding mucosa; typically asymptomatic but can bleed or cause obstruction.","level":0}]},{"label":"Non-neoplastic / Serrated Polyps","bullets":[{"text":"Inflammatory polyps: non-neoplastic mucosal projections with stromal/epithelial/inflammatory components.","level":0},{"text":"Pseudopolyps: irregular islands of residual mucosa from ulceration/regeneration (seen in UC and Crohn disease).","level":0},{"text":"Serrated polyps: heterogeneous group with variable malignant potential. Hyperplastic polyps are the most common non-neoplastic polyp type.","level":0},{"text":"Sessile serrated lesions (SSLs) and traditional serrated adenomas (TSAs) — increased colon cancer risk.","level":0}]},{"label":"Adenomatous Polyps (Most Common Malignant Type — 2/3 of colonic polyps)","bullets":[{"text":"**Tubular adenoma**: most common subtype; least malignant risk of the group; risk correlates with size (>10% risk if >2.5 cm).","level":0},{"text":"**Villous adenoma**: glands extend straight to the polyp center; **highest malignant potential**; more common on the left colon.","level":0},{"text":"**Tubovillous adenoma**: mixture; 5–10% of colonic adenomas; intermediate malignant risk.","level":0}]},{"label":"Management / Surveillance","bullets":[{"text":"Colonoscopy establishes histology, removes the polyp (polypectomy), and screens for other lesions.","level":0},{"text":"All adenomas require resection; ensure margins are free of neoplastic tissue (incomplete resection increases malignancy risk).","level":0},{"text":"Surveillance: follow-up colonoscopy at 3 months post-polypectomy.","level":0},{"text":"Advanced adenoma (tubular >10 mm, villous histology, or high-grade dysplasia): surveillance colonoscopy at 3 years (then 5 years if none found).","level":0},{"text":"3–4 tubular adenomas <10 mm: repeat colonoscopy in 3–5 years.","level":0},{"text":"Advanced adenoma or 5–10 adenomas <10 mm: repeat colonoscopy in 3 years.","level":0},{"text":"No advanced adenomas: first surveillance colonoscopy in 7–10 years.","level":0}]}]},{"name":"Colorectal Malignancies","sections":[{"label":"Epidemiology","bullets":[{"text":"3rd most common cause of cancer-related death in U.S. women (2nd in men).","level":0},{"text":"~147,000 new cases/year; ~53,000 deaths/year.","level":0},{"text":"Overall death rate has declined since the 1990s (treatment/screening advances), but incidence is rising ~2.1%/year in patients under age 50.","level":0},{"text":"Histology: adenocarcinoma (85%), mucinous (12%); sigmoid tumors have the best overall survival.","level":0}]},{"label":"Modifiable / Acquired Risk Factors","bullets":[{"text":"Overweight/obesity, physical inactivity, diet high in processed meats, diabetes, smoking, alcohol use.","level":0},{"text":"Personal history of adenomatous polyps or IBD.","level":0}]},{"label":"Hereditary Syndromes — Lynch Syndrome (HNPCC)","bullets":[{"text":"~20% of CRC diagnoses have a family history; Lynch is autosomal dominant and the **most common** hereditary CRC susceptibility syndrome (~2–3% of all CRC).","level":0},{"text":"Suspect in patients diagnosed with CRC before age 50, or with endometrial, ovarian, stomach, or renal pelvis/ureter malignancies.","level":0},{"text":"Confirmed via genetic testing; screening starts at age 20–25, every 1–2 years.","level":0}]},{"label":"Hereditary Syndromes — Familial Adenomatous Polyposis (FAP)","bullets":[{"text":"APC gene mutation causing hundreds to thousands of colon polyps starting age 10–12; cancer usually develops by age 20; **all patients eventually develop cancer**.","level":0},{"text":"Subtypes: attenuated FAP (<100 polyps), Gardner syndrome (+ non-cancer tumors of skin/soft tissue/bone), Turcot syndrome (rare, highest risk, high polyp burden).","level":0},{"text":"Screening (flexible sigmoidoscopy) starts at age 10–12.","level":0}]},{"label":"Hereditary Syndromes — Peutz-Jeghers Syndrome (PJS)","bullets":[{"text":"Rare syndrome from a mutation in STK11 (LKB1) gene; patients develop hamartomatous polyps.","level":0},{"text":"High risk for CRC as well as breast, ovarian, and pancreatic cancer; usually diagnosed at a young age.","level":0},{"text":"Characteristic exam finding: mucocutaneous freckling around the mouth (also hands/feet).","level":0}]},{"label":"Screening","bullets":[{"text":"Two main tools: FIT (fecal immunochemical test — annual) and colonoscopy.","level":0},{"text":"Average risk: begin screening at age 45 through age 75; colonoscopy every 10 years (or sigmoidoscopy alone); annual FIT.","level":0},{"text":"High risk (Lynch, FAP with first-degree relative): begin at age 40, or 10 years before the relative's age at diagnosis (whichever is earliest); colonoscopy every 5 years; annual FIT especially if colonoscopy declined.","level":0},{"text":"History of IBD: begin screening 8–10 years from diagnosis.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"1 in 5 patients present with metastatic disease (liver most common, also lung and peritoneum).","level":0},{"text":"Hematochezia/melena, abdominal pain, unexplained iron deficiency anemia, ascites/hepatomegaly if liver involvement.","level":0},{"text":"**Change in bowel habits is the most common symptom overall (74%)** and is more associated with left-sided tumors (also causes obstruction).","level":0},{"text":"Hematochezia more associated with rectosigmoid tumors; iron deficiency anemia more associated with right-sided tumors.","level":0},{"text":"Abdominal pain occurs with all tumor locations; rectal cancer causes tenesmus and rectal pain.","level":0},{"text":"Symptomatic presentation usually indicates more progressive disease (worse prognosis).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"**Colonoscopy with biopsy — diagnostic gold standard.**","level":0},{"text":"CT scan for generalized abdominal symptoms; flexible sigmoidoscopy (limited, best for palpable rectal masses); CT colonography (used for incomplete colonoscopy).","level":0},{"text":"Tumor markers CEA and CA 19-9 — poor specificity, should NOT be used for screening; CEA useful for post-diagnosis follow-up (>5 ng/mL preop = worse prognosis; rising levels post-op suggest aggressive/recurrent disease).","level":0}]},{"label":"Staging Workup","bullets":[{"text":"CT thorax/abdomen/pelvis (TAP) to evaluate for metastasis; PET scan usually not needed (adds little beyond CT).","level":0},{"text":"CEA obtained pre- and post-operatively for treatment planning/prognosis.","level":0},{"text":"Additional: MRI liver, DRE, transrectal ultrasound (especially for radiotherapy/chemoradiotherapy candidates).","level":0}]},{"label":"Treatment by Stage","bullets":[{"text":"Stage 0–1: surgery alone.","level":0},{"text":"Stage 2: surgery + chemotherapy for rectal and high-risk colon cancers (FOLFOX or CapeOx) + radiation for rectal cancer (with 5-FU or Xeloda).","level":0},{"text":"Stage 3: surgery + FOLFOX/CapeOx + radiation for rectal cancer.","level":0},{"text":"Stage 4: surgery if tumor is obstructive; chemotherapy (FOLFOX, FOLFIRI, FOLFIRINOX, irinotecan, bevacizumab, cetuximab, panitumumab, ziv-aflibercept, regorafenib, trifluridine-tipiracil, ramucirumab) ± radiation ± interventional radiology (RFA, SBRT, chemoembolization).","level":0}]},{"label":"Treatment Details","bullets":[{"text":"Surgical resection is potentially curative in ~80% of localized cancers; colostomy/ileostomy may be needed if perforation present.","level":0},{"text":"Chemotherapy: adjuvant (after surgery) vs. neoadjuvant (before surgery, with radiation).","level":0},{"text":"Common agents: 5-FU, capecitabine (Xeloda), irinotecan (Camptosar), oxaliplatin (Eloxatin).","level":0},{"text":"Side effects: hair loss, mucositis, nausea/vomiting/diarrhea, appetite/weight loss, neuropathy; hand-foot syndrome seen with 5-FU and capecitabine.","level":0}]},{"label":"Follow-up / Prognosis","bullets":[{"text":"Staging is the most important prognostic factor.","level":0},{"text":"Surveillance: history & physical every 3–6 months for 5 years; serum CEA every 3–6 months for 5 years; CT TAP annually for 3–5 years; colonoscopy at 1 year, then every 5 years.","level":0}]}]},{"name":"Anal Malignancies","sections":[{"label":"Epidemiology / Risk Factors","bullets":[{"text":"~2.5% of all digestive cancers (~8,590 new U.S. cases/year); incidence has been increasing over the last 30 years.","level":0},{"text":"Usually refers to squamous cell carcinoma (SCC).","level":0},{"text":"Risk factors: female gender, HPV history, higher lifetime number of sexual partners, genital warts, smoking, anal intercourse, HIV.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"**Rectal bleeding — most common initial symptom (~45% of patients).**","level":0},{"text":"Anorectal pain/sensation of a mass (~30%); constipation, diarrhea, discharge, pruritus, tenesmus.","level":0}]},{"label":"Diagnostics / Staging","bullets":[{"text":"Biopsy of tumor; CT thorax/abdomen/pelvis; PET/CT scan.","level":0},{"text":"CEA tumor marker NOT routinely tested in these patients.","level":0}]},{"label":"Treatment","bullets":[{"text":"**Chemoradiotherapy is preferred — preserves the anal sphincter in 70–85% of cases.**","level":0},{"text":"Standard combination regimen: fluorouracil (5-FU) + mitomycin + radiation.","level":0},{"text":"Local excision is an option for selected patients with lesions <1 cm; requires vigilant follow-up.","level":0},{"text":"Reassess treatment response every 8–12 weeks after chemoradiation completion.","level":0},{"text":"Follow-up: DRE every 3–6 months for 5 years; CT or PET scan annually for 3 years.","level":0}]},{"label":"Prognosis","bullets":[{"text":"Poor prognostic factors: palpable/clinically positive lymph node, male sex.","level":0},{"text":"Anal margin tumors generally more favorable than anal canal tumors (less involvement).","level":0},{"text":"Overall survival: 60% in men, 71% in women; 82% at earliest stage; ~60% with lymph node involvement.","level":0}]}]}],"questions":[{"q":"By definition, constipation refers to passing fewer than how many stools per week?","a":"Fewer than 3 stools per week."},{"q":"Name three classes of medications commonly implicated in causing constipation.","a":"Opioids, antiemetics (e.g., ondansetron/Zofran), and calcium channel blockers (e.g., verapamil)."},{"q":"What is the first-line treatment for uncomplicated constipation?","a":"A high-fiber diet."},{"q":"What is fecal impaction?","a":"A solid, immobile bulk of stool in the rectum, typically from decreased fecal mobility."},{"q":"What is the first-line treatment for fecal impaction?","a":"Manual disimpaction followed by colon evacuation with a PEG-electrolyte enema."},{"q":"List the major risk factors associated with fecal incontinence.","a":"Age, diarrhea, fecal urgency, urinary incontinence, diabetes mellitus, and central adiposity."},{"q":"What physical exam maneuver assesses for a neurologic cause of fecal incontinence?","a":"The anal wink reflex (stroking perianal skin and observing sphincter contraction; absence suggests a neurologic process)."},{"q":"What is the most common cause of paralytic (adynamic) ileus?","a":"The postoperative state."},{"q":"On abdominal x-ray, how does paralytic ileus classically differ from a mechanical small bowel obstruction?","a":"Ileus shows diffuse dilated bowel loops WITHOUT a transition zone (vs. a transition point in mechanical obstruction)."},{"q":"What is the most common etiology of anal fissures?","a":"Local trauma from constipation/hard stools."},{"q":"Where are approximately 90% of anal fissures located?","a":"The posterior midline of the anal canal."},{"q":"What class of topical medication is used to relax the internal anal sphincter in fissure treatment?","a":"Vasodilators (e.g., topical nifedipine or nitroglycerin)."},{"q":"What surgical procedure is reserved for chronic anal fissures refractory to medical therapy?","a":"Lateral internal sphincterotomy (LIS)."},{"q":"Anatomically, how are internal hemorrhoids distinguished from external hemorrhoids?","a":"Internal hemorrhoids are proximal to the dentate line; external hemorrhoids are distal to the dentate line."},{"q":"Which grade of internal hemorrhoid is irreducible and may strangulate?","a":"Grade IV."},{"q":"What is the most common procedure for Grade II–III internal hemorrhoids refractory to conservative treatment?","a":"Rubber band ligation."},{"q":"What conditions contraindicate rubber band ligation of hemorrhoids?","a":"Coagulopathy, anticoagulation therapy, or a history of portal hypertension."},{"q":"What is the most common causative organism of an anorectal abscess?","a":"Staphylococcus aureus."},{"q":"What is the first-line treatment for an anorectal abscess?","a":"Surgical drainage."},{"q":"What does the \"WASH\" regimen (post-op anorectal abscess care) stand for?","a":"Warm water cleansing, Analgesics, Sitz baths, High fiber diet."},{"q":"Differentiate complete from partial rectal prolapse.","a":"Complete prolapse involves all layers of the rectum protruding through the anus; partial prolapse involves the mucosa only."},{"q":"What surgical procedure is used to definitively treat rectal prolapse?","a":"Rectopexy."},{"q":"What diagnostic criteria are used to define irritable bowel syndrome (IBS)?","a":"The Rome criteria — recurrent abdominal pain associated with defecation, a change in stool frequency, and/or a change in stool form over the preceding 3 months."},{"q":"Name the four subtypes of IBS.","a":"IBS-C (constipation-predominant), IBS-D (diarrhea-predominant), IBS-M (mixed), and IBS-U (unclassified)."},{"q":"Where in the colon are diverticula most commonly located?","a":"The left colon (sigmoid colon)."},{"q":"Which side of the colon is the most common source of diverticular bleeding, and why?","a":"The right colon, because it has thinner walls."},{"q":"What is the most common cause of acute lower GI bleeding?","a":"Diverticulosis."},{"q":"Why is colonoscopy contraindicated during an episode of acute diverticulitis?","a":"Due to the increased risk of perforation."},{"q":"What is the first-line imaging study for diagnosing diverticulitis?","a":"CT scan of the abdomen/pelvis with contrast."},{"q":"What colonic diameter threshold, seen on imaging, is part of the diagnostic criteria for toxic megacolon?","a":"Colonic dilation greater than 6 cm."},{"q":"What is the treatment for toxic megacolon caused by an ulcerative colitis flare?","a":"IV steroids (in addition to supportive care)."},{"q":"What is the most commonly affected bowel segment in Crohn disease?","a":"The terminal ileum (the rectum is usually spared)."},{"q":"Contrast the pattern/depth of inflammation in Crohn disease versus ulcerative colitis.","a":"Crohn disease: transmural inflammation with skip lesions that can affect any part of the GI tract. Ulcerative colitis: mucosal/submucosal inflammation only, continuous and starting in the rectum."},{"q":"Which antibody is associated with Crohn disease, and which is associated with ulcerative colitis?","a":"Anti-Saccharomyces cerevisiae antibody (ASCA) with Crohn disease; p-ANCA with ulcerative colitis."},{"q":"What classic finding on double-contrast barium enema is associated with ulcerative colitis?","a":"The \"lead pipe\" (stovepipe) sign — a cylindrical bowel with loss of haustral markings."},{"q":"What is the most common cause of acute mesenteric ischemia?","a":"Arterial embolism, most often due to atrial fibrillation."},{"q":"Which artery is most commonly occluded in acute mesenteric ischemia?","a":"The superior mesenteric artery (SMA)."},{"q":"What is the classic description of abdominal pain in acute mesenteric ischemia?","a":"Severe abdominal pain that is out of proportion to physical exam findings."},{"q":"What is the first-line imaging study for both acute and chronic mesenteric ischemia?","a":"CT angiography (CTA)."},{"q":"What laboratory findings support a diagnosis of acute mesenteric ischemia?","a":"Leukocytosis, elevated lactic acid, and elevated LDH."},{"q":"Chronic mesenteric ischemia results from atherosclerotic narrowing of how many of the three major splanchnic vessels?","a":"At least 2 of the 3 (celiac axis, superior mesenteric artery, inferior mesenteric artery)."},{"q":"What is the classic symptom pattern of chronic mesenteric ischemia?","a":"Chronic, dull, postprandial abdominal pain (\"food fear\"), anorexia, and weight loss."},{"q":"What CT finding is characteristic of ischemic colitis?","a":"\"Thumbprinting\" (segmental bowel wall thickening/edema) and the double halo/target sign."},{"q":"What percentage of ischemic colitis cases occur in patients age 60 or older?","a":"Approximately 90%."},{"q":"Which type of colonic adenoma carries the highest risk of malignant transformation?","a":"Villous adenoma."},{"q":"What follow-up interval is recommended after a polypectomy?","a":"A repeat colonoscopy at 3 months."},{"q":"What is the most common histologic type of colorectal cancer?","a":"Adenocarcinoma (approximately 85% of cases)."},{"q":"At what age should average-risk patients begin colorectal cancer screening?","a":"Age 45."},{"q":"What gene mutation causes familial adenomatous polyposis (FAP)?","a":"The APC gene."},{"q":"What gene mutation causes Peutz-Jeghers syndrome, and what characteristic exam finding is associated with it?","a":"A mutation in STK11 (LKB1); characteristic mucocutaneous freckling around the mouth (also hands/feet)."}],"examQuestions":[{"stem":"A patient with chronic constipation is started on treatment. According to the step-wise approach discussed in lecture, which intervention should be tried first, before adding pharmacologic agents?","options":["Enemas","Surgical evaluation","Stimulant laxatives","Osmotic laxatives","High-fiber diet"],"correctIndex":4,"explanations":["Enemas are reserved for severe symptoms or recent impaction, not first-line therapy.","Surgical evaluation is not part of the initial constipation treatment approach.","Stimulant laxatives are not the first step in the described treatment approach.","Osmotic laxatives are not the first step in the described treatment approach.","Correct — a high-fiber diet is the first-line intervention, retaining water and forming bulkier stool."],"topic":"Constipation"},{"stem":"An elderly nursing home resident is found to have a large, immobile mass of stool in the rectum on exam, with severe abdominal pain and a heavy stool burden on x-ray. First-line manual disimpaction is unsuccessful. What is the next appropriate step according to lecture?","options":["Discharge home with reassurance","Immediate surgical colectomy","IV vancomycin","Water contrast enema (Gastrografin or Hypaque) under fluoroscopy","High-dose oral opioids for pain control"],"correctIndex":3,"explanations":["This presentation requires further intervention, not discharge without treatment.","Surgery is not the described next step after failed manual disimpaction.","Antibiotics are not indicated for fecal impaction.","Correct — if manual disimpaction is unsuccessful, a water contrast enema under fluoroscopy is the next step described in lecture.","Opioids would worsen constipation and are not an appropriate treatment here."],"topic":"Constipation"},{"stem":"A 45-year-old woman describes involuntary leakage of stool preceded by a strong urge to defecate that she cannot control in time to reach the bathroom. Which type of fecal incontinence does this describe, and what is the most common overall cause of acute fecal incontinence according to lecture?","options":["Passive incontinence; anorectal surgery is the most common cause","Urge incontinence; IBS is the most common cause","Urge incontinence; spinal cord injury is the most common cause","Passive incontinence; chronic constipation is the most common cause","Urge incontinence; acute diarrhea from infection or new medication is the most common cause"],"correctIndex":4,"explanations":["This describes urge, not passive, incontinence.","IBS is a contributing etiology but not identified as the most common overall cause.","Spinal cord injury is a neurologic cause but not the most common overall cause described.","This describes urge, not passive, incontinence, and chronic constipation is not identified as the most common cause.","Correct — this describes urge incontinence (desire to defecate but unable to retain stool), and acute diarrhea from infection or new medication is the most common overall cause described in lecture."],"topic":"Fecal Incontinence"},{"stem":"A patient presents with sudden-onset fecal incontinence without any change in bowel habits, accompanied by new lower back pain and bilateral lower extremity weakness. Which red flag finding should prompt evaluation for a neurologic cause according to lecture?","options":["Mild perianal pruritus","History of recent childbirth","History of hemorrhoids","Nocturnal incontinence only","Sudden onset without change in bowel habits plus low back/perineal pain and lower extremity symptoms"],"correctIndex":4,"explanations":["Mild pruritus alone is not a described neurologic red flag.","Recent childbirth suggests anorectal trauma, not a neurologic cause.","Hemorrhoids are a separate anorectal condition, not a neurologic red flag.","Nocturnal incontinence alone suggests an underlying bowel disorder such as diabetes, not specifically a neurologic red flag in this combination.","Correct — sudden onset without a change in bowel habits, combined with low back/perineal pain and lower extremity motor/sensory symptoms, is a described red flag for a neurologic cause."],"topic":"Fecal Incontinence"},{"stem":"A patient develops abdominal distention, decreased bowel sounds, and obstipation 2 days after undergoing abdominal surgery. Abdominal x-ray shows diffuse dilated bowel loops without a discrete transition zone. Which diagnosis is most consistent with this presentation?","options":["Acute mesenteric ischemia","Paralytic (adynamic) ileus","Toxic megacolon","Sigmoid volvulus","Mechanical small bowel obstruction"],"correctIndex":1,"explanations":["Acute mesenteric ischemia presents with pain out of proportion to exam, not this radiographic pattern.","Correct — diffuse dilated bowel loops without a transition zone, in the postoperative setting, is consistent with paralytic ileus, the most common cause of which is the postoperative state.","Toxic megacolon involves colonic dilation with systemic toxicity criteria, not this postoperative presentation.","Volvulus typically shows a distinct radiographic pattern, not diffuse dilation without a transition zone.","Mechanical obstruction classically shows a transition zone, which is absent here."],"topic":"Paralytic Ileus"},{"stem":"A hospitalized patient develops findings consistent with paralytic ileus. Which imaging study is used to confirm the diagnosis and differentiate ileus from mechanical obstruction?","options":["Barium swallow","Endoscopic ultrasound","CT abdomen/pelvis","MRCP","Abdominal x-ray alone"],"correctIndex":2,"explanations":["Barium swallow evaluates the esophagus, not ileus.","Endoscopic ultrasound is not the described diagnostic tool for ileus.","Correct — CT abdomen/pelvis confirms the diagnosis and differentiates ileus from mechanical obstruction.","MRCP evaluates the biliary tree, not ileus.","Plain x-ray can suggest ileus but does not confirm the diagnosis or reliably differentiate it from mechanical obstruction."],"topic":"Paralytic Ileus"},{"stem":"A 34-year-old man reports anal pain with defecation and bright red blood on the toilet paper. Exam reveals a longitudinal tear in the posterior midline of the anal canal that does not extend proximal to the dentate line. What is the most likely underlying etiology of this condition?","options":["Portal hypertension","Autoimmune destruction of the anal mucosa","Bacterial superinfection with Staphylococcus aureus","Viral infection with HPV","Local trauma from constipation/hard stools"],"correctIndex":4,"explanations":["Portal hypertension is associated with hemorrhoids, not the mechanism of anal fissure formation.","Anal fissures are not described as an autoimmune process.","Staphylococcus aureus is the most common organism in anorectal abscess, not anal fissure.","HPV infection is associated with anal malignancy risk, not typical anal fissures.","Correct — local trauma from constipation/hard stools is the most common cause of anal fissures, which produce this longitudinal tear pattern."],"topic":"Anal Fissures"},{"stem":"A patient with a chronic anal fissure has failed first-line conservative therapy for over 2 months and now has a fissure with raised edges, fibrosis, and a sentinel pile. What is the most appropriate next step in management?","options":["Oral broad-spectrum antibiotics","Rubber band ligation","Lateral internal sphincterotomy","Continue sitz baths alone indefinitely","Topical vasodilator therapy such as nifedipine or nitroglycerin as a first attempt only"],"correctIndex":2,"explanations":["Antibiotics are not indicated for an anal fissure, which is not an infectious process.","Rubber band ligation is a treatment for internal hemorrhoids, not anal fissures.","Correct — lateral internal sphincterotomy is reserved for failure of treatment beyond 2 months or chronic fissure changes such as fibrosis, sentinel pile, and rolled edges.","Continuing conservative therapy alone is not appropriate given failure of treatment beyond 2 months with chronic changes.","Topical vasodilators are used earlier in treatment; this patient has already failed conservative management and has chronic fissure changes warranting a different approach."],"topic":"Anal Fissures"},{"stem":"A 50-year-old woman reports painless bright red blood per rectum and a sensation of prolapse with defecation that reduces on its own without her needing to push it back manually. According to the internal hemorrhoid grading system discussed in lecture, which grade best fits this presentation?","options":["Grade III","Grade I","This does not fit any internal hemorrhoid grade","Grade IV","Grade II"],"correctIndex":4,"explanations":["Grade III hemorrhoids require manual reduction, which this patient does not need.","Grade I hemorrhoids may bulge but do not prolapse below the dentate line; this patient has prolapse.","This presentation clearly fits the Grade II description.","Grade IV hemorrhoids are irreducible, which does not match this presentation.","Correct — Grade II hemorrhoids prolapse with defecation/straining and reduce spontaneously, matching this presentation."],"topic":"Hemorrhoids"},{"stem":"A patient presents with acute, severe perianal pain and a palpable tender lump. Exam reveals a thrombosed hemorrhoid. Based on lecture, which anatomic feature explains why this type of hemorrhoid tends to be more painful than internal hemorrhoids?","options":["Pain results from associated colonic inflammation","It is located proximal to the dentate line where there is no somatic innervation","It is distal to the dentate line, close to somatically innervated tissue","It results from direct extension of an anal fissure","It is supplied only by autonomic nerve fibers"],"correctIndex":2,"explanations":["This presentation is not described as resulting from colonic inflammation.","Proximal to the dentate line describes internal hemorrhoids, which are typically less painful due to visceral innervation.","Correct — external hemorrhoids are distal to the dentate line, close to somatically innervated tissue, making them more painful, especially when thrombosed.","Thrombosed hemorrhoids are not described as arising from fissure extension.","This does not accurately describe the innervation difference driving increased pain in external hemorrhoids."],"topic":"Hemorrhoids"},{"stem":"A patient with Grade II internal hemorrhoids has failed conservative therapy with fiber and topical treatments. She has a history of chronic anticoagulation for atrial fibrillation. Which treatment option should be avoided in this patient according to lecture?","options":["Sclerotherapy","High-fiber diet","Rubber band ligation","Infrared coagulation","Sitz baths"],"correctIndex":2,"explanations":["Sclerotherapy is not specifically contraindicated with anticoagulation in this lecture, though it has a higher recurrence rate.","A high-fiber diet is a safe conservative measure regardless of anticoagulation status.","Correct — rubber band ligation is contraindicated in patients with coagulopathy, anticoagulation use, or portal hypertension.","Infrared coagulation is not specifically contraindicated with anticoagulation in this lecture.","Sitz baths are a safe conservative measure regardless of anticoagulation status."],"topic":"Hemorrhoids"},{"stem":"A patient presents within 24 hours of developing an acutely painful, thrombosed external hemorrhoid. According to lecture, what is the most appropriate management given this timing?","options":["Rubber band ligation only","Oral antibiotics for 10 days","Immediate hemorrhoidectomy under general anesthesia regardless of severity","Office-based excision, since she presents within the first 3 days of symptoms","Watchful waiting with no intervention for 6 weeks"],"correctIndex":3,"explanations":["Rubber band ligation is used for internal hemorrhoids, not thrombosed external hemorrhoids.","Antibiotics are not indicated for a thrombosed hemorrhoid, which is not primarily an infectious process.","Formal surgical hemorrhoidectomy is generally reserved for Grade IV or specific severe cases, not the routine first step here.","Correct — office-based excision is appropriate for acute thrombosed external hemorrhoids presenting within the first 3 days of symptoms.","This condition is painful and time-sensitive; extended watchful waiting is not the described first-line approach in this early window."],"topic":"Hemorrhoids"},{"stem":"A 40-year-old man presents with severe, constant anal pain that worsens with sitting and defecation. He has fever and malaise. Exam reveals fluctuance and erythema of the perianal skin. Which organism is most commonly responsible for this presentation?","options":["E
