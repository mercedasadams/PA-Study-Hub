eatorrhea, and diabetes mellitus.","Fever, hypotension, and altered mental status."],"correctIndex":2},{"stem":"What does Reynolds' pentad add to Charcot's triad?","options":["Ascites and splenomegaly.","Fever and chills.","Hypotension (shock) and altered mental status.","Jaundice and RUQ pain.","Weight loss and anorexia."],"correctIndex":2},{"stem":"What is the gold standard diagnostic test for ascending cholangitis?","options":["Cholangiography via ERCP.","HIDA scan.","CT abdomen/pelvis alone.","Abdominal ultrasound alone.","MRCP alone."],"correctIndex":0},{"stem":"What are the two most common causes of acute pancreatitis?","options":["Gallstones and alcohol abuse.","NSAIDs and smoking.","Trauma and malignancy.","Autoimmune disease and infection.","Hyperlipidemia and hypercalcemia only."],"correctIndex":0},{"stem":"What lipase/amylase lab finding supports a diagnosis of acute pancreatitis?","options":["Lipase and/or amylase decreased below normal limits.","Lipase and/or amylase within normal limits.","Lipase and/or amylase elevated 3x the upper limit of normal or greater.","Lipase and/or amylase elevated 1.5x the upper limit of normal or greater.","Lipase and/or amylase elevated 10x the upper limit of normal only."],"correctIndex":2},{"stem":"What physical exam findings are associated with necrotizing (hemorrhagic) pancreatitis?","options":["Murphy sign and Rovsing sign.","Courvoisier's sign and Boas sign.","Asterixis and fetor hepaticus.","Charcot's triad and Reynolds' pentad.","Cullen's sign (periumbilical ecchymosis) and Grey Turner's sign (flank ecchymosis)."],"correctIndex":4},{"stem":"What is the classic triad of chronic pancreatitis?","options":["Ascites, bleeding, and splenomegaly.","Pancreatic calcifications, steatorrhea, and diabetes mellitus.","Abdominal pain, hematemesis, and melena.","Jaundice, weight loss, and a palpable gallbladder.","Fever, RUQ pain, and jaundice."],"correctIndex":1},{"stem":"What is the most common histologic type of pancreatic cancer, and what surgical procedure is used for tumors confined to the head of the pancreas?","options":["Neuroendocrine tumor; distal pancreatectomy.","Squamous cell carcinoma; the Whipple procedure.","Lymphoma; systemic chemotherapy alone.","Adenocarcinoma; the Whipple procedure (pancreaticoduodenectomy).","Cystadenocarcinoma; total pancreatectomy."],"correctIndex":3}]},{"id":"final","number":"F","title":"Cumulative Final Exam","week":"All Lectures 1–5","filename":"Cumulative Final Exam — GI Block","topics":[],"questions":[],"examQuestions":[{"stem":"A trauma surgeon reviewing a CT scan notes an organ that lies posterior to the peritoneal cavity and does not have a mesentery. Which of the following structures shares this same retroperitoneal classification?","options":["Transverse colon","Spleen","Jejunum","Duodenum","Sigmoid colon"],"correctIndex":3,"explanations":["The transverse colon is intraperitoneal, suspended by the transverse mesocolon.","The spleen is intraperitoneal.","The jejunum is intraperitoneal, suspended by mesentery.","Correct — the duodenum is retroperitoneal, along with the ascending/descending colon, pancreas, and kidneys (\\\"SAD PUCKER\\\").","The sigmoid colon is intraperitoneal, suspended by its own mesentery."],"topic":"Anatomy/Physiology"},{"stem":"A gastroenterologist explains to a patient that the lower esophageal sphincter is unique compared to the upper esophageal sphincter. Which statement accurately reflects this anatomic distinction?","options":["The LES contains skeletal muscle exclusively","The LES is a physiologic, not anatomic, sphincter, with tone from the crural diaphragm and angle of His","The LES prevents air entry into the esophagus","The LES is a true anatomic muscular ring, just like the UES","The LES is located in the cervical esophagus"],"correctIndex":1,"explanations":["The LES is functionally maintained by smooth muscle and surrounding structures, not skeletal muscle.","Correct — the LES is a physiologic sphincter without a discrete anatomic ring; its tone derives from the crural diaphragm and the angle of His.","This describes the function of the UES, not the LES.","This is incorrect; unlike the UES (cricopharyngeus), the LES has no true muscular ring.","The LES is located at the gastroesophageal junction, not the cervical esophagus."],"topic":"Anatomy/Physiology"},{"stem":"A patient with pernicious anemia is found to have impaired vitamin B12 absorption. According to the anatomy and physiology of small intestine absorption, which segment is responsible for B12 uptake, and what cofactor is required?","options":["Ileum; requires intrinsic factor","Ascending colon; requires no cofactor","Jejunum; requires pepsin","Duodenum; requires bile salts","Cecum; requires gastrin"],"correctIndex":0,"explanations":["Correct — the ileum absorbs bile salts and vitamin B12, with B12 absorption specifically requiring intrinsic factor.","The colon does not absorb B12; this occurs in the small intestine.","B12 absorption occurs in the ileum, not the jejunum, and requires intrinsic factor, not pepsin.","Bile salt and B12 absorption occur in the ileum, not the duodenum.","B12 absorption occurs in the ileum and requires intrinsic factor, not gastrin."],"topic":"Anatomy/Physiology"},{"stem":"A medical student is asked to trace the path of nutrient-rich blood after a meal is absorbed in the small intestine. Which structure delivers this blood to the liver before it enters systemic circulation, and what percentage of hepatic blood flow does it supply?","options":["Portal vein; ~75%","Superior mesenteric artery directly; ~100%","Splenic artery; ~90%","Hepatic artery; ~25%","Inferior vena cava; ~50%"],"correctIndex":0,"explanations":["Correct — the portal vein (formed by the superior mesenteric and splenic veins) supplies approximately 75% of the liver's blood flow, carrying nutrient-rich blood from the gut.","The SMA drains into the portal vein rather than supplying the liver directly.","The splenic artery is not the primary vessel described for this pathway.","The hepatic artery supplies about 25% of hepatic blood flow, the remainder from the portal vein.","The IVC does not directly supply nutrient-rich portal blood to the liver."],"topic":"Anatomy/Physiology"},{"stem":"A physiology lecture describes three hormones central to digestion. Which hormone is released by I cells in the duodenum and increases both pancreatic enzyme release and gallbladder contraction?","options":["Motilin","GLP-1","Secretin","Cholecystokinin (CCK)","Gastrin"],"correctIndex":3,"explanations":["Motilin is released by M cells and triggers the migrating motor complex.","GLP-1 is released by L cells and increases insulin release while decreasing gastric emptying/appetite.","Secretin is released by S cells and increases bicarbonate secretion while decreasing gastric acid.","Correct — CCK, released by I cells in the duodenum, increases pancreatic enzyme release and stimulates gallbladder contraction.","Gastrin is released by G cells and increases gastric acid secretion, not enzyme release/gallbladder contraction."],"topic":"Anatomy/Physiology"},{"stem":"A radiology resident is reviewing the arterial supply of the GI tract by embryologic division. Which artery supplies the midgut, extending to the transverse colon?","options":["Inferior mesenteric artery (IMA)","Splenic artery","Celiac trunk","Renal artery","Superior mesenteric artery (SMA)"],"correctIndex":4,"explanations":["The IMA supplies the hindgut, from the transverse colon to the rectum, not the midgut.","The splenic artery is a branch of the celiac trunk supplying the foregut-related spleen, not the midgut directly.","The celiac trunk supplies the foregut, to the major duodenal papilla, not the midgut.","The renal artery supplies the kidneys, not the GI tract.","Correct — the SMA supplies the midgut, extending to the transverse colon."],"topic":"Anatomy/Physiology"},{"stem":"A patient presents with abnormal liver function tests. According to the diagnostics lecture, which imaging modality is first-line for initial evaluation of the liver, offering no radiation exposure?","options":["Abdominal ultrasound","Elastography alone as the first test","PET/CT","CT abdomen with contrast","MRI with contrast"],"correctIndex":0,"explanations":["Correct — ultrasound is the most widely used, first-line liver imaging modality, using sound waves with no radiation.","Elastography measures fibrosis/fat content but is not the described first-line initial imaging study.","PET/CT is not first-line for initial liver evaluation.","CT is not first-line; it is used for more detailed characterization or cancer staging.","MRI is superior for characterizing lesions but is not the first-line initial study."],"topic":"Anatomy/Physiology"},{"stem":"A patient with suspected acute pancreatitis is being worked up. According to the diagnostics lecture, which laboratory value is more specific to the pancreas than the other commonly ordered enzyme?","options":["AST","Alkaline phosphatase","ALT","Amylase","Lipase"],"correctIndex":4,"explanations":["AST reflects hepatocyte injury, not pancreatic specificity.","Alkaline phosphatase reflects cholestasis, not pancreatic specificity.","ALT reflects hepatocyte injury, not pancreatic specificity.","Amylase is less specific to the pancreas than lipase.","Correct — lipase is more pancreas-specific than amylase, as noted in the diagnostics lecture."],"topic":"Anatomy/Physiology"},{"stem":"A researcher studying the gut-brain axis notes that the majority of the body's serotonin is produced outside the central nervous system. According to lecture, where is most serotonin produced, and does it cross the blood-brain barrier?","options":["In the gut by enterochromaffin cells; it does not cross the blood-brain barrier","In the kidneys; it does not cross the blood-brain barrier","In the brain; it does cross the blood-brain barrier","In the pancreas; crossing status is unknown","In the liver; it freely crosses the blood-brain barrier"],"correctIndex":0,"explanations":["Correct — approximately 90–95% of the body's serotonin is produced in the gut by enterochromaffin cells and does not cross the blood-brain barrier.","The kidneys are not identified as the primary serotonin production site.","Only a minority of serotonin is produced in the brain; the majority is produced in the gut.","The pancreas is not identified as the primary serotonin production site.","The liver is not the primary site of serotonin production described in lecture."],"topic":"Anatomy/Physiology"},{"stem":"A patient presents with suspected appendicitis. She is 6 months pregnant. According to the \"choosing the right study\" guidance discussed in lecture, what is the recommended initial imaging approach in this specific population?","options":["CT abdomen/pelvis with contrast as the first study","Barium enema as the first study","No imaging is recommended during pregnancy","Ultrasound as the first study, given her pregnancy","MRCP as the first and only study"],"correctIndex":3,"explanations":["CT is avoided as the first study in pregnancy due to radiation exposure.","Barium enema is not the described study for suspected appendicitis.","Imaging remains important during pregnancy when appendicitis is suspected.","Correct — ultrasound is recommended as the first study for suspected appendicitis in pregnant patients, avoiding CT when possible.","MRCP evaluates the biliary tree, not appendicitis."],"topic":"Anatomy/Physiology"},{"stem":"A 55-year-old man with long-standing heartburn is undergoing evaluation. He denies dysphagia, weight loss, or GI bleeding. According to the GERD management algorithm discussed in lecture, what is the most appropriate initial approach?","options":["Immediate EGD before any treatment","Esophageal manometry as the first test","No treatment needed since he denies alarm symptoms","Nissen fundoplication as first-line therapy","Empiric once-daily PPI therapy for 8 weeks"],"correctIndex":4,"explanations":["EGD is reserved for patients with alarm symptoms or severe/refractory disease, not as the automatic first step.","Manometry is not the first step in this algorithm.","Treatment is still appropriate for symptomatic GERD even without alarm symptoms.","Surgery is not first-line treatment for uncomplicated GERD.","Correct — in patients with classic GERD symptoms and no alarm features, empiric once-daily PPI therapy for 8 weeks is the appropriate initial approach."],"topic":"Upper GI Disorders"},{"stem":"A 60-year-old man with a 15-year history of GERD undergoes surveillance EGD, which reveals columnar epithelium replacing the normal squamous lining of the distal esophagus, confirmed as intestinal metaplasia on biopsy. What is the most concerning long-term progression pathway for this condition?","options":["Progression to achalasia","Progression to eosinophilic esophagitis","Intestinal metaplasia → low-grade dysplasia → high-grade dysplasia → adenocarcinoma","Immediate resolution without further risk","Metaplasia directly to squamous cell carcinoma"],"correctIndex":2,"explanations":["Barrett's esophagus is not a precursor to achalasia.","Barrett's esophagus is not a precursor to eosinophilic esophagitis; these are distinct processes.","Correct — Barrett's esophagus follows a stepwise progression from intestinal metaplasia through low- and high-grade dysplasia to adenocarcinoma.","Barrett's esophagus, once established, requires ongoing surveillance rather than spontaneous resolution.","Barrett's esophagus is associated with adenocarcinoma, not squamous cell carcinoma, and does not progress directly without intermediate steps."],"topic":"Upper GI Disorders"},{"stem":"A patient presents with dysphagia to both solids and liquids from the onset, along with regurgitation and weight loss. Barium swallow shows a dilated esophagus with distal \"bird beak\" narrowing. Which diagnostic test is considered the gold standard to confirm this diagnosis?","options":["Colonoscopy","Barium swallow alone is sufficient; no further testing needed","High-resolution esophageal manometry","Abdominal ultrasound","Urea breath test"],"correctIndex":2,"explanations":["Colonoscopy evaluates the colon, not esophageal motility.","While barium swallow is suggestive, manometry is described as the gold standard for confirmation.","Correct — high-resolution manometry is the gold standard for diagnosing achalasia, showing impaired LES relaxation.","Ultrasound is not used to diagnose esophageal motility disorders.","Urea breath test evaluates for H. pylori, unrelated to achalasia diagnosis."],"topic":"Upper GI Disorders"},{"stem":"An elderly patient reports oropharyngeal dysphagia, regurgitation of undigested food hours after eating, and halitosis. Which diagnostic study should be obtained, and what treatment is definitive for the underlying diagnosis?","options":["CT chest; chemotherapy","Esophageal manometry; PPI therapy","EGD alone; observation only","Barium swallow; cricopharyngeal myotomy","Colonoscopy; antibiotics"],"correctIndex":3,"explanations":["This is not a malignant process requiring chemotherapy based on this presentation.","Manometry is not the initial diagnostic test of choice for this presentation, which suggests Zenker diverticulum.","EGD carries perforation risk in suspected Zenker diverticulum and observation alone would not address a structural diverticulum causing symptoms.","Correct — barium swallow diagnoses Zenker diverticulum, and cricopharyngeal myotomy is the definitive treatment.","This presentation does not suggest a colonic or infectious process."],"topic":"Upper GI Disorders"},{"stem":"A patient with a history of chronic alcohol use presents with severe chest pain and mediastinal free air after an episode of forceful vomiting. Full-thickness esophageal rupture is confirmed. How does this diagnosis differ from a Mallory-Weiss tear, and what is the clinical urgency?","options":["It is caused by H. pylori infection","It only affects the stomach, not the esophagus","It is a full-thickness transmural perforation (unlike the mucosal-only Mallory-Weiss tear) and constitutes a GI emergency","It is a mucosal-only tear like Mallory-Weiss and can be managed conservatively","It requires no different management than Mallory-Weiss tear"],"correctIndex":2,"explanations":["H. pylori is not the described cause of Boerhaave syndrome.","This is an esophageal, not gastric, process.","Correct — Boerhaave syndrome is a full-thickness esophageal perforation, in contrast to the mucosal-only laceration of Mallory-Weiss tear, and is a GI emergency.","This describes Boerhaave syndrome, which is full-thickness, not mucosal-only like Mallory-Weiss, and requires urgent management.","Boerhaave syndrome requires more urgent and different management than a typically self-limited Mallory-Weiss tear."],"topic":"Upper GI Disorders"},{"stem":"A patient with known cirrhosis presents with acute hematemesis. Endoscopy confirms bleeding esophageal varices. In addition to resuscitation and antibiotics, which medication class should be started to reduce splanchnic blood flow and portal pressure?","options":["Beta blockers only, started emergently for the first time","Octreotide","High-dose vitamin K alone","Loperamide","Oral iron supplementation"],"correctIndex":1,"explanations":["While beta blockers are used for primary/secondary prophylaxis, octreotide is the acute vasoactive agent started immediately during active bleeding.","Correct — octreotide reduces portal hypertension by inhibiting splanchnic vasodilation and is started emergently in acute variceal hemorrhage.","Vitamin K alone would not adequately address the acute bleeding source or portal pressure.","Loperamide is an antidiarrheal, unrelated to variceal bleeding management.","Iron supplementation does not address active bleeding."],"topic":"Upper GI Disorders"},{"stem":"A patient with peptic ulcer disease is confirmed to have H. pylori infection on biopsy. According to the treatment guidance discussed in lecture, which regimen is effective even in areas of clarithromycin resistance?","options":["Triple therapy with clarithromycin, amoxicillin, and PPI","H2 blocker monotherapy for 8 weeks","A single dose of amoxicillin","PPI monotherapy alone, indefinitely","Bismuth quadruple therapy (PPI + bismuth + tetracycline + metronidazole)"],"correctIndex":4,"explanations":["Triple therapy with clarithromycin has declining efficacy, particularly with resistance, and is not the preferred regimen in that setting.","H2 blocker monotherapy does not eradicate H. pylori.","A single antibiotic dose is inadequate for eradication therapy.","PPI monotherapy does not eradicate H. pylori; combination antibiotic therapy is required.","Correct — bismuth quadruple therapy is effective regardless of clarithromycin resistance and is a preferred first-line option."],"topic":"Upper GI Disorders"},{"stem":"A 30-year-old man with a history of asthma and seasonal allergies presents with recurrent food impaction. EGD shows esophageal rings, linear furrows, and white exudates. Biopsy is likely to reveal which finding, and what is a first-line treatment?","options":["Viral inclusion bodies; antivirals","Neutrophilic infiltration; antibiotics","Eosinophilic infiltration; swallowed topical steroids (e.g., budesonide)","Normal histology; no treatment required","Granulomatous inflammation; immunosuppressants"],"correctIndex":2,"explanations":["Viral inclusion bodies would suggest infectious esophagitis, not this atopic presentation.","This presentation (atopy, rings, furrows, food impaction) is classic for eosinophilic, not neutrophilic, infiltration, and antibiotics would not address this.","Correct — eosinophilic esophagitis shows eosinophilic infiltration on biopsy, and swallowed topical steroids such as budesonide or fluticasone are first-line treatment.","This presentation and biopsy findings would not be normal, given the clinical scenario.","Granulomatous inflammation is not the described histology for this presentation."],"topic":"Upper GI Disorders"},{"stem":"A patient undergoes EGD for chronic reflux symptoms, and the endoscopist grades the mucosal injury using the Los Angeles classification system. Which grade range indicates severe mucosal injury requiring long-term maintenance PPI therapy?","options":["Grades A–B","Grades C–D","Grading does not affect treatment duration","Grade A only","There is no grading system for reflux esophagitis"],"correctIndex":1,"explanations":["Grades A–B represent milder injury, not the severe category requiring long-term maintenance therapy.","Correct — Los Angeles Grades C–D indicate severe mucosal injury and require long-term maintenance PPI therapy.","Grading directly informs whether long-term maintenance therapy is needed.","Grade A alone represents the mildest injury category, not the severe one.","The Los Angeles classification (Grades A–D) is the described grading system for reflux esophagitis."],"topic":"Upper GI Disorders"},{"stem":"A 55-year-old woman presents with intermittent solid food dysphagia, sometimes called \\\"steakhouse syndrome,\\\" found to be from a thin circumferential mucosal ring at the squamocolumnar junction. A separate patient has a thin cervical esophageal web associated with iron deficiency anemia. Which statement correctly distinguishes these two entities?","options":["Both are called Schatzki rings and are treated identically with no attention to iron status","Schatzki rings occur in the cervical esophagus, while webs occur at the GE junction","Neither is associated with dysphagia","The first describes a Schatzki ring; the second describes an esophageal web associated with Plummer-Vinson syndrome, requiring treatment of the underlying iron deficiency","Both require esophagectomy as definitive treatment"],"correctIndex":3,"explanations":["These are distinct entities with different associations and are not treated identically without addressing iron deficiency in the second case.","This reverses the correct anatomic locations of these two entities.","Both entities are classically associated with dysphagia.","Correct — a Schatzki ring is a distal mucosal ring causing intermittent solid dysphagia, while a cervical esophageal web associated with iron deficiency anemia suggests Plummer-Vinson syndrome, requiring treatment of the underlying iron deficiency in addition to dilation.","Esophagectomy is not the described treatment for either entity; dilation is used."],"topic":"Upper GI Disorders"},{"stem":"A 45-year-old woman presents with dyspepsia. Biopsy from endoscopy shows corpus-predominant atrophic gastritis with antral sparing, and labs reveal iron deficiency and low B12. Which underlying process best explains these findings?","options":["NSAID-induced gastropathy","Eosinophilic gastritis","H. pylori pangastritis","Crohn disease-related gastritis","Autoimmune gastritis with antibodies against parietal cells and intrinsic factor"],"correctIndex":4,"explanations":["NSAID gastropathy does not classically cause this corpus-predominant autoimmune pattern.","Eosinophilic gastritis is not the described mechanism for this presentation.","H. pylori pangastritis does not classically produce this antral-sparing, corpus-predominant pattern with these serologic markers.","Crohn disease-related gastritis (focally enhanced gastritis) does not match this specific autoimmune serologic and histologic pattern.","Correct — autoimmune gastritis involves autoantibodies against parietal cells and intrinsic factor, producing corpus-predominant atrophy with antral sparing and malabsorptive B12/iron deficiency."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"A patient with peptic ulcer disease develops sudden severe abdominal pain and free air is seen under the diaphragm on x-ray. Which specific ulcer location is most associated with this complication?","options":["Posterior gastric ulcer eroding into the splenic artery","Posterior duodenal ulcer","Ulcers of the jejunum only","Ulcers cannot cause this complication","Anterior duodenal ulcer"],"correctIndex":4,"explanations":["This describes a bleeding, not perforation, complication.","Posterior duodenal ulcers are more associated with penetration into the pancreas or erosion into the gastroduodenal artery, not free perforation.","Jejunal ulcer location should prompt evaluation for Zollinger-Ellison syndrome, not specifically this perforation pattern.","Perforation is a well-described complication of peptic ulcer disease.","Correct — anterior duodenal ulcers are more likely to freely perforate into the peritoneum, producing free air under the diaphragm."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"A 3-week-old infant has nonbilious, forceful vomiting after every feed but remains eager to feed again. A palpable olive-shaped mass is noted in the epigastrium. Labs reveal a hypochloremic, hypokalemic metabolic alkalosis. What is the diagnostic study of choice, and what is the definitive treatment?","options":["Upper GI barium series; medical management only","MRI abdomen; observation","Abdominal ultrasound; Ramstedt pyloromyotomy","CT abdomen with contrast; chemotherapy","Colonoscopy; colectomy"],"correctIndex":2,"explanations":["While barium studies can show findings, ultrasound is the gold standard, and medical management alone is not definitive for this surgical condition.","MRI is not the standard diagnostic approach, and observation alone is inappropriate for this condition requiring surgical correction.","Correct — abdominal ultrasound is the gold standard diagnostic study for pyloric stenosis, and Ramstedt pyloromyotomy is the definitive treatment.","CT and chemotherapy are not appropriate for this benign pediatric surgical condition.","This is not a colonic disease process."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"A 22-year-old woman presents with vague periumbilical pain that has migrated to the right lower quadrant over the past 18 hours, along with anorexia and low-grade fever. According to lecture, which sequence of pain evolution explains this classic presentation?","options":["Pain begins in the RLQ and migrates to the periumbilical region","Visceral T8–T10 afferent stimulation causing periumbilical pain, followed by somatic stimulation once inflammation reaches the parietal peritoneum","Somatic pain first, followed by visceral pain","There is no physiologic basis for this pain pattern","Pain is due to direct cardiac referral"],"correctIndex":1,"explanations":["This reverses the correct order of pain migration described in lecture.","Correct — early visceral T8–T10 afferent stimulation from appendiceal distension causes vague periumbilical pain, with later somatic nerve stimulation from parietal peritoneal involvement causing migration to the RLQ.","This reverses the correct sequence described in lecture; visceral pain precedes somatic pain.","This pain pattern has a clear, well-described physiologic explanation.","Cardiac referral is not the mechanism for this well-described GI pain pattern."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"A 30-year-old woman with chronic diarrhea and iron deficiency anemia refractory to supplementation undergoes serologic testing while eating a normal diet. Which first-line test should be ordered, and what additional value must be checked to avoid a false negative?","options":["CEA; total serum bilirubin","tTG-IgA; total serum IgA level","EMA-IgG; total serum IgG level","CA 19-9; total serum calcium","AFP; total serum albumin"],"correctIndex":1,"explanations":["CEA is a colorectal cancer marker, unrelated to celiac disease testing.","Correct — tTG-IgA is the first-line test for celiac disease, and total serum IgA must be checked simultaneously since selective IgA deficiency causes false-negative results.","EMA-IgG and total IgG are not the described first-line testing approach for celiac disease.","CA 19-9 is a pancreatic tumor marker, unrelated to celiac disease testing.","AFP is a hepatocellular carcinoma marker, unrelated to celiac disease testing."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"An 8-month-old infant presents with intermittent colicky abdominal pain, vomiting, and stool mixed with blood and mucus. Ultrasound shows a target sign in the right upper quadrant. What is the diagnosis, and what is the first-line treatment in a hemodynamically stable patient without perforation?","options":["Malrotation with volvulus; emergent laparotomy","Intussusception; non-operative air/pneumatic enema reduction","Pyloric stenosis; pyloromyotomy","Appendicitis; appendectomy","Hirschsprung disease; rectal biopsy"],"correctIndex":1,"explanations":["Malrotation with volvulus presents with bilious vomiting and would show different imaging findings.","Correct — this presentation and ultrasound finding are classic for intussusception, and non-operative air/pneumatic enema reduction is first-line in a stable patient without perforation.","Pyloric stenosis presents with nonbilious projectile vomiting and an olive-shaped mass, not a target sign or bloody mucoid stool.","Appendicitis is uncommon in this age group and does not present with a target sign in this manner.","Hirschsprung disease presents with delayed meconium passage and chronic constipation, not this acute intermittent presentation."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"A patient presents with colicky abdominal pain, distension, and obstipation. CT abdomen shows dilated proximal small bowel with a discrete transition point and decompressed distal bowel. What is the most common overall cause of this presentation, and what percentage of cases resolve with nonoperative management?","options":["Crohn disease; nonoperative management is never attempted","Adhesions from prior abdominal surgery; nonoperative management successful in ~65–80% of cases","Hernias; 10%","Neoplasm; 100% require surgery","Volvulus; nonoperative management successful in 95% of cases"],"correctIndex":1,"explanations":["Crohn disease accounts for about 5% of cases, and nonoperative management can still be attempted.","Correct — adhesions, most commonly from prior abdominal surgery, are the leading cause of SBO, and nonoperative management succeeds in approximately 65–80% of cases, especially partial SBO.","Hernias account for about 10% of SBO cases, not the most common cause; adhesions are most common.","Neoplasm accounts for only about 5% of cases and does not always require surgery.","Volvulus is a less common cause, and this success rate does not match the described figures for typical SBO."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"A 16-year-old girl with characteristic dark pigmented macules on her lips and buccal mucosa presents with acute abdominal pain from small bowel intussusception found to be caused by a hamartomatous polyp. Which gene mutation and associated cancer risk profile are most consistent with this syndrome?","options":["SMAD4 gene; primarily associated with hereditary hemorrhagic telangiectasia only","No gene mutation is associated with this presentation","PTEN gene; primarily associated with macrocephaly and no cancer risk","APC gene; near 100% risk of colorectal cancer if untreated","STK11 gene; ~93% lifetime risk of any cancer, including small bowel, breast, and pancreatic cancer"],"correctIndex":4,"explanations":["SMAD4 mutations cause juvenile polyposis, which can overlap with HHT but does not classically present with this pigmentation pattern.","This presentation has a well-described genetic basis (STK11).","PTEN mutations cause Cowden syndrome, which does carry increased cancer risk, and does not match this presentation.","APC mutations cause FAP, which does not present with mucocutaneous pigmentation.","Correct — Peutz-Jeghers syndrome results from an STK11 mutation and carries an extraordinarily high lifetime cancer risk (~93%), including small bowel, breast, and pancreatic cancers."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"A 30-year-old woman with chronic diarrhea, cramping abdominal pain that improves with defecation, and no alarm features undergoes workup that rules out infection and celiac disease. Which diagnostic framework, based on symptom pattern rather than a specific biomarker, establishes this diagnosis?","options":["OLGA staging system","Child-Pugh classification","Rome diagnostic criteria","Truelove and Witts severity criteria","TNM staging system"],"correctIndex":2,"explanations":["OLGA staging assesses gastritis-related neoplasia risk, not IBS.","Child-Pugh classification assesses cirrhosis severity, not IBS diagnosis.","Correct — the Rome diagnostic criteria, based on recurrent abdominal pain associated with defecation and changes in stool frequency/form, establish the diagnosis of IBS.","Truelove and Witts criteria assess ulcerative colitis severity, not IBS diagnosis.","TNM staging is used for cancer staging, not IBS diagnosis."],"topic":"Colon & Rectal"},{"stem":"A 30-year-old woman with chronic diarrhea without gross blood, RLQ pain, and weight loss undergoes colonoscopy showing segmental disease with skip lesions, cobblestoning, and rectal sparing. Which diagnosis is most consistent, and which layer(s) of bowel wall are involved?","options":["Crohn disease; transmural (full-thickness) involvement","Ischemic colitis; serosa only","Diverticulitis; mucosa only","Toxic megacolon; muscularis propria only","Ulcerative colitis; mucosa/submucosa only"],"correctIndex":0,"explanations":["Correct — Crohn disease presents with segmental skip lesions, cobblestoning, and typically spares the rectum, with transmural inflammation extending through the full thickness of the bowel wall.","This presentation and pathology pattern do not match ischemic colitis.","This chronic segmental pattern does not match diverticulitis.","This chronic segmental pattern does not match toxic megacolon, an acute complication.","This presentation (skip lesions, cobblestoning, rectal sparing) is classic for Crohn disease, not UC, which involves only the mucosa/submucosa in a continuous pattern."],"topic":"Colon & Rectal"},{"stem":"A 55-year-old man with LLQ pain, low-grade fever, and a change in bowel habits undergoes CT abdomen/pelvis showing bowel wall thickening and pericolonic fat stranding in the sigmoid colon. Why is colonoscopy avoided at this time?","options":["Colonoscopy is contraindicated acutely due to perforation risk in diverticulitis","Colonoscopy cannot visualize the sigmoid colon","Colonoscopy is never useful in colonic disease","Colonoscopy requires no bowel preparation and is therefore unsafe","There is no reason to avoid colonoscopy in this scenario"],"correctIndex":0,"explanations":["Correct — colonoscopy is avoided acutely in diverticulitis due to the risk of perforation; CT is the first-line imaging modality instead.","The sigmoid colon is well visualized by colonoscopy; this is not the reason for avoidance.","Colonoscopy is useful in many other contexts, such as elective colorectal cancer screening; it is specifically avoided acutely here due to perforation risk.","Bowel preparation requirements are not the reason colonoscopy is avoided in this scenario.","Colonoscopy should specifically be avoided during the acute phase due to perforation risk."],"topic":"Colon & Rectal"},{"stem":"A 45-year-old man is diagnosed with colorectal cancer at age 45. His mother had endometrial cancer at age 48. Genetic testing confirms a hereditary syndrome. Which syndrome is most likely, and what is unique about its inheritance and associated cancers compared to FAP?","options":["Juvenile polyposis syndrome; caused by SMAD4 mutation","Cowden syndrome; caused by PTEN mutation","Lynch syndrome (HNPCC); autosomal dominant, associated with endometrial, ovarian, stomach, and renal pelvis/ureter cancers, without a high polyp burden","FAP; causes hundreds to thousands of colonic polyps","Peutz-Jeghers syndrome; caused by STK11 mutation with hamartomatous polyps"],"correctIndex":2,"explanations":["Juvenile polyposis is not the best fit for this specific family cancer pattern.","Cowden syndrome is not the best fit for this specific family cancer pattern.","Correct — Lynch syndrome (HNPCC) is autosomal dominant, the most common hereditary CRC syndrome, and is specifically associated with early-onset CRC plus endometrial, ovarian, stomach, and renal pelvis/ureter cancers, without a high polyp burden.","FAP causes a high polyp burden, which is not the defining feature of this family history pattern, and FAP is not primarily associated with endometrial cancer.","Peutz-Jeghers syndrome presents with mucocutaneous pigmentation and hamartomatous polyps, not this specific cancer association pattern."],"topic":"Colon & Rectal"},{"stem":"A patient with a history of ulcerative colitis presents with severe bloody diarrhea, fever of 39°C, heart rate 130 bpm, and altered mental status. Abdominal x-ray shows colonic dilation of 7 cm. What diagnosis do these findings meet criteria for, and what class of medication must be avoided?","options":["Simple UC flare; no medications need to be avoided","Diverticulitis; antibiotics should be avoided","Toxic megacolon; antimotility agents (opioids, anticholinergics) should be avoided","Ischemic colitis; IV fluids should be avoided","IBS; NSAIDs should be avoided"],"correctIndex":2,"explanations":["This presentation, with dilation and systemic toxicity, exceeds a simple flare and meets toxic megacolon criteria.","This presentation is not primarily diverticulitis, and antibiotics are part of appropriate management, not something to avoid.","Correct — colonic dilation >6 cm with systemic toxicity criteria meets toxic megacolon diagnostic criteria, and antimotility agents should be avoided as they can worsen the condition.","IV fluids are part of appropriate supportive management, not something to avoid.","This presentation exceeds a simple IBS picture and meets specific toxic megacolon criteria."],"topic":"Colon & Rectal"},{"stem":"A 68-year-old man with atrial fibrillation not on anticoagulation presents with sudden, severe abdominal pain markedly out of proportion to his benign-appearing exam. Which diagnosis should be suspected, and what is the most common underlying cause?","options":["Diverticulitis; diverticular perforation","Ischemic colitis; non-occlusive low-flow state","Chronic mesenteric ischemia; atherosclerotic narrowing over years","Acute mesenteric ischemia; arterial embolism, often from atrial fibrillation","Toxic megacolon; ulcerative colitis"],"correctIndex":3,"explanations":["Diverticulitis presents with localized pain, not this diffuse severe pain out of proportion to exam.","Ischemic colitis is typically non-occlusive but presents differently and less acutely severe than this classic AMI presentation tied to embolism.","Chronic mesenteric ischemia presents with gradual postprandial pain over time, not this sudden severe presentation.","Correct — acute mesenteric ischemia should be suspected given pain out of proportion to exam, and arterial embolism, frequently arising from atrial fibrillation, is the most common cause.","Toxic megacolon requires specific dilation/toxicity criteria not described here."],"topic":"Colon & Rectal"},{"stem":"A patient presents with painless bright red blood per rectum found to be from Grade II internal hemorrhoids that prolapse with straining but reduce spontaneously. Which of the following treatments is specifically contraindicated given a history of chronic anticoagulation?","options":["High-fiber diet","Rubber band ligation","Preparation H","Sitz baths","Topical lidocaine-hydrocortisone"],"correctIndex":1,"explanations":["A high-fiber diet is a safe conservative measure regardless of anticoagulation status.","Correct — rubber band ligation is contraindicated in patients with coagulopathy, anticoagulation use, or portal hypertension.","Preparation H is a safe conservative measure regardless of anticoagulation status.","Sitz baths are a safe conservative measure regardless of anticoagulation status.","Topical treatments are safe regardless of anticoagulation status."],"topic":"Colon & Rectal"},{"stem":"A patient with a chronic anal fissure has failed conservative therapy and topical vasodilator therapy for over 2 months, with exam showing fibrosis, a sentinel pile, and rolled edges. What is the most appropriate next step in management?","options":["Oral broad-spectrum antibiotics","Continue topical nitroglycerin indefinitely","Immediate colectomy","Lateral internal sphincterotomy","Rubber band ligation"],"correctIndex":3,"explanations":["Antibiotics are not indicated for an anal fissure, which is not primarily an infectious process.","Continued topical therapy alone is not appropriate after this duration of failure with chronic fissure changes present.","Colectomy is a vastly disproportionate intervention for an anal fissure.","Correct — lateral internal sphincterotomy is reserved for failure of treatment beyond 2 months or chronic fissure changes such as fibrosis, sentinel pile, and rolled edges.","Rubber band ligation treats internal hemorrhoids, not anal fissures."],"topic":"Colon & Rectal"},{"stem":"A 74-year-old woman presents with sudden left-sided abdominal pain followed by bloody diarrhea within 24 hours. CT shows segmental bowel wall thickening in a watershed area of the colon with a \\\"thumbprinting\\\" pattern. Which condition does this describe, and what proportion of cases are due to non-occlusive causes such as systemic hypotension?","options":["Ischemic colitis; approximately 95%","Diverticulitis; 30%","Toxic megacolon; 50%","Acute mesenteric ischemia; 60–70%","Chronic mesenteric ischemia; 10%"],"correctIndex":0,"explanations":["Correct — this presentation describes ischemic colitis, in which non-occlusive disease from systemic hypotension or atherosclerosis accounts for approximately 95% of cases.","Diverticulitis presents with localized LLQ pain, not this watershed ischemic pattern with thumbprinting.","Toxic megacolon requires specific dilation and systemic toxicity criteria, not this presentation.","This presentation and imaging describe ischemic colitis, not acute mesenteric ischemia, and the percentage given corresponds to embolic AMI, not this condition.","Chronic mesenteric ischemia presents with postprandial pain over time, not this acute presentation."],"topic":"Colon & Rectal"},{"stem":"A 66-year-old man with obesity and cirrhosis undergoes routine screening ultrasound, revealing a 2.5 cm liver lesion. Follow-up CT shows arterial enhancement with venous washout. Which diagnosis is most consistent, and what tumor marker, while nonspecific, aids in diagnosis and surveillance?","options":["Hepatocellular carcinoma; alpha-fetoprotein (AFP)","Gastric adenocarcinoma; CA 72-4","Cholangiocarcinoma; CA 19-9","Colorectal metastasis; CEA","Pancreatic adenocarcinoma; CA 19-9"],"correctIndex":0,"explanations":["Correct — arterial enhancement with venous washout in a cirrhotic patient is characteristic of hepatocellular carcinoma, and AFP, while nonspecific, aids diagnosis and surveillance.","This is not a gastric malignancy based on the described findings.","This vascular pattern and clinical scenario (cirrhosis, hepatic lesion) fits hepatocellular carcinoma, not cholangiocarcinoma, and AFP, not CA 19-9, is the associated marker.","This vascular imaging pattern and cirrhosis history point to a primary liver tumor, not colorectal metastasis.","This is a primary hepatic lesion, not a pancreatic one."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A patient with decompensated cirrhosis is assessed using the Child-Pugh classification system. According to lecture, which class is associated with the lowest 1-year survival, and approximately what percentage does that represent?","options":["Class A; ~100%","Class A; ~45%","Class C; ~45%","Class B; ~100%","Class B; ~81%"],"correctIndex":2,"explanations":["Class A carries the best prognosis (~100% 1-year survival), not the lowest.","This mismatches Class A with an incorrect survival percentage.","Correct — Child-Pugh Class C carries the lowest 1-year survival, at approximately 45%.","This mismatches Class B with an incorrect survival percentage.","Class B has an intermediate prognosis (~81% 1-year survival), not the lowest."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A patient with cirrhosis develops confusion, asterixis, and fetor hepaticus. Labs show elevated ammonia. Which first-line treatment lowers ammonia by acidifying the colon and converting ammonia to ammonium for excretion?","options":["Ceftriaxone","Lactulose","Rifaximin","Spironolactone","Octreotide"],"correctIndex":1,"explanations":["Ceftriaxone is an antibiotic, not the described ammonia-lowering treatment.","Correct — lactulose is first-line therapy for hepatic encephalopathy, acidifying the colon to convert ammonia to ammonium for excretion.","Rifaximin is an alternative for patients who cannot tolerate the first-line agent, not the first-line therapy itself.","Spironolactone is used for ascites management, not specifically for lowering ammonia.","Octreotide is used for variceal bleeding and portal hypertension, not hepatic encephalopathy."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A 50-year-old woman presents with fever, chills, RUQ pain, and jaundice. She subsequently develops hypotension and altered mental status. Which progression of eponymous findings does this represent, and what is the diagnostic gold standard?","options":["Cullen's sign progressing to Grey Turner's sign; CT is the gold standard","Virchow's node; PET/CT is the gold standard","Courvoisier's sign; abdominal ultrasound is the gold standard","Boas sign; HIDA scan is the gold standard","Charcot's triad progressing to Reynolds' pentad; cholangiography via ERCP is the gold standard"],"correctIndex":4,"explanations":["Cullen's and Grey Turner's signs relate to hemorrhagic pancreatitis, not this presentation.","Virchow's node relates to metastatic malignancy, not this acute infectious presentation.","Courvoisier's sign refers to a palpable gallbladder in pancreatic malignancy, not this triad/pentad progression.","Boas sign relates to cholecystitis, not this specific triad/pentad progression.","Correct — Charcot's triad (fever/chills, RUQ pain, jaundice) progressing to Reynolds' pentad (plus hypotension and altered mental status) describes ascending cholangitis, with ERCP cholangiography as the gold standard diagnostic test."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A patient presents with episodic RUQ pain radiating to the right shoulder blade after a fatty meal, lasting about an hour, without fever. Ultrasound shows echogenic gallstones without wall thickening. What is the most likely diagnosis, and what distinguishes it from acute cholecystitis?","options":["Ascending cholangitis; requires IV antibiotics immediately","Acute pancreatitis; requires NPO status","Choledocholithiasis; requires ERCP","Chronic pancreatitis; requires enzyme replacement","Biliary colic from cholelithiasis; no inflammation/infection present, unlike cholecystitis"],"correctIndex":4,"explanations":["This presentation lacks the fever, jaundice, and systemic toxicity of ascending cholangitis.","This is a biliary, not primarily pancreatic, presentation.","This presentation lacks the prolonged pain (>6 hours) and cholestatic labs typical of choledocholithiasis.","This is a biliary, not primarily pancreatic, presentation.","Correct — this describes biliary colic from cholelithiasis, distinguished from cholecystitis by the absence of fever, leukocytosis, and gallbladder wall inflammation/thickening."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A 55-year-old man with alcohol use disorder presents with epigastric pain radiating to the back, relieved by leaning forward. Lipase is elevated 4 times the upper limit of normal. According to the diagnostic criteria discussed in lecture, how many criteria are needed for diagnosis, and are all three always required?","options":["All 3 criteria are always mandatory, including imaging","No formal criteria exist for this diagnosis","5 criteria must all be present simultaneously","Only imaging findings are needed, regardless of pain or labs","Only 2 of the 3 criteria (pain plus elevated lipase/amylase, or imaging) are needed, and imaging may not be required if the other two are met"],"correctIndex":4,"explanations":["Imaging is not always mandatory if the other two criteria (pain and elevated enzymes) are already met.","Formal, well-described diagnostic criteria do exist for acute pancreatitis.","This is not the correct number or structure of the diagnostic criteria.","Pain and lab findings alone can establish the diagnosis without imaging.","Correct — diagnosis requires 2 of 3 criteria (characteristic pain, lipase/amylase ≥3× ULN, or characteristic imaging), and imaging may not be required if the first two are already met."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A patient with long-standing alcohol use presents with chronic epigastric pain, steatorrhea, and new-onset diabetes. Imaging reveals pancreatic calcifications. Which classic triad does this patient demonstrate, and what medication class addresses the malabsorptive component?","options":["Pancreatic calcifications, steatorrhea, and diabetes mellitus; pancreatic enzyme supplementation (e.g., Creon)","Charcot's triad; antibiotics","Cullen's sign, Grey Turner's sign, jaundice; corticosteroids","ABCDE mnemonic for portal hypertension; beta blockers","Virchow's node, Sister Mary Joseph's node, Trousseau syndrome; chemotherapy"],"correctIndex":0,"explanations":["Correct — the classic triad of chronic pancreatitis is pancreatic calcifications, steatorrhea, and diabetes mellitus, and pancreatic enzyme supplementation addresses the malabsorptive/steatorrhea component.","Charcot's triad relates to cholangitis, not chronic pancreatitis.","These are hemorrhagic pancreatitis findings, not the chronic pancreatitis triad.","This is the portal hypertension mnemonic, unrelated to chronic pancreatitis.","These are metastatic signs of pancreatic malignancy, not the chronic pancreatitis triad."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A 68-year-old man presents with painless jaundice, weight loss, and a nontender, palpable, distended gallbladder on exam. According to lecture, what is this exam finding called, and what is the best initial diagnostic imaging study?","options":["Murphy sign; abdominal ultrasound","Cullen's sign; EUS-FNA","Boas sign; MRCP","Courvoisier's sign; CT scan with contrast (best initial diagnostic study)","Charcot's triad; ERCP"],"correctIndex":3,"explanations":["Murphy sign involves pain with palpation, not this painless, distended, palpable gallbladder finding.","Cullen's sign relates to hemorrhagic pancreatitis, not this presentation; EUS-FNA is used for tissue diagnosis, not as the best initial imaging study.","Boas sign relates to cholecystitis, not this presentation, and MRCP is an alternative, not the best initial study.","Correct — Courvoisier's sign describes a nontender, palpable, distended gallbladder classically associated with pancreatic malignancy, and CT scan with contrast is the best initial diagnostic study.","Charcot's triad relates to cholangitis, not this painless presentation."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A 60-year-old man with cirrhosis is being started on treatment for hepatocellular carcinoma with atezolizumab plus bevacizumab. What must be screened for before initiating this regimen, and why?","options":["Renal function only, with no other screening needed","Osteoporosis, due to risk of fracture","Hearing loss, due to ototoxicity","Esophageal varices, due to increased bleeding risk","Peptic ulcer disease, due to risk of perforation"],"correctIndex":3,"explanations":["Variceal screening, not solely renal function, is the specific concern highlighted for this regimen.","Osteoporosis is not the specific screening concern for this regimen.","Ototoxicity is not a described concern for this regimen.","Correct — esophageal variceal screening is recommended before starting atezolizumab plus bevacizumab due to increased bleeding risk.","Peptic ulcer disease is not the specific screening concern highlighted for this regimen."],"topic":"Liver/Gallbladder/Pancreas"},{"stem":"A patient recovering from an episode of acute diverticulitis asks why colonoscopy was avoided during her acute presentation but is now recommended a few weeks later. What is the best explanation, drawing on principles from across the GI block?","options":["Acute inflammation increases perforation risk during active diverticulitis, so colonoscopy is deferred until inflammation resolves, then used to rule out malignancy/other pathology","Colonoscopy was avoided due to cost concerns only","Colonoscopy is only used for upper GI complaints","Colonoscopy has no role in diverticular disease at any point","CT imaging permanently replaces the need for colonoscopy in this condition"],"correctIndex":0,"explanations":["Correct — colonoscopy is deferred during acute diverticulitis due to perforation risk, then performed after resolution to evaluate for other pathology, including malignancy.","Cost is not the described rationale for timing colonoscopy in this condition.","Colonoscopy evaluates the colon, a lower GI structure, and is appropriately used in this lower GI condition.","Colonoscopy does have an important role in diverticular disease, particularly after the acute phase resolves.","CT is used for acute diagnosis, but colonoscopy still plays a distinct follow-up role and is not replaced by CT."],"topic":"Colon & Rectal"},{"stem":"A patient with iron deficiency anemia and dyspepsia undergoes evaluation. Considering the interplay between gastric and small intestinal pathology covered across the block, which of the following conditions could explain both findings through a shared mechanism of impaired absorption?","options":["Irritable bowel syndrome alone","Uncomplicated GERD without erosive changes","Zenker diverticulum alone","Autoimmune gastritis, through achlorhydria-related impaired iron absorption","Simple biliary colic, unrelated to anemia"],"correctIndex":3,"explanations":["IBS is a functional disorder without a malabsorptive mechanism causing iron deficiency.","Uncomplicated GERD without erosive disease is not a described cause of iron deficiency anemia through malabsorption.","Zenker diverticulum causes dysphagia/regurgitation, not iron malabsorption.","Correct — autoimmune gastritis causes achlorhydria, impairing iron absorption and contributing to iron deficiency anemia, in addition to its classic B12/pernicious anemia association.","Biliary colic is not associated with impaired iron absorption or anemia through this mechanism."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"Across the GI block, several conditions are diagnosed or confirmed using endoscopic evaluation with biopsy. Which of the following pairs a condition with its correct gold-standard or first-line diagnostic confirmation?","options":["Achalasia — confirmed by abdominal ultrasound","Diverticulitis — confirmed by acute colonoscopy","Celiac disease — confirmed by duodenal biopsy showing villous atrophy after positive serology","Hepatocellular carcinoma — confirmed by barium swallow","Pyloric stenosis — confirmed by colonoscopy"],"correctIndex":2,"explanations":["Achalasia is confirmed by high-resolution manometry, not abdominal ultrasound.","Diverticulitis is diagnosed by CT imaging; colonoscopy is specifically avoided acutely due to perforation risk.","Correct — celiac disease is confirmed by duodenal biopsy (villous atrophy, crypt hyperplasia) following positive serologic testing.","Hepatocellular carcinoma is diagnosed by characteristic CT/MRI findings (or biopsy if inconclusive), not barium swallow.","Pyloric stenosis is confirmed by abdominal ultrasound, not colonoscopy."],"topic":"Gastric/Duodenal/Small Intestine"},{"stem":"A patient presents with jaundice. The clinical team must localize whether the cause is hepatocellular, cholestatic/obstructive, or hemolytic. Which combination of findings would most suggest an obstructive biliary process rather than primary hepatocellular injury?","options":["Isolated indirect hyperbilirubinemia with normal liver enzymes","Elevated ALP and GGT with a dilated common bile duct on ultrasound","Elevated ammonia with normal bilirubin and normal ALP","Normal bilirubin with elevated reticulocyte count","Markedly elevated AST/ALT with normal ALP/GGT"],"correctIndex":1,"explanations":["Isolated indirect hyperbilirubinemia with normal enzymes is more suggestive of a hemolytic process.","Correct — elevated ALP and GGT (a cholestatic pattern) together with a dilated common bile duct on imaging suggest an obstructive biliary process, as seen in choledocholithiasis.","Elevated ammonia with normal bilirubin/ALP is more suggestive of a synthetic/detoxification issue (such as hepatic encephalopathy) rather than obstruction.","Normal bilirubin with elevated reticulocyte count suggests a compensated hemolytic process, not obstruction.","This pattern (elevated AST/ALT, normal ALP/GGT) suggests hepatocellular injury, not obstruction."],"topic":"Liver/Gallbladder/Pancreas"}],"mcQuestions":[],"examOnly":true}];
