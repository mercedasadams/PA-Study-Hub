ntamoeba histolytica","Staphylococcus aureus","Helicobacter pylori","Candida albicans","Clostridioides difficile"],"correctIndex":1,"explanations":["Entamoeba histolytica is not identified as a common cause of anorectal abscess in this lecture.","Correct — Staphylococcus aureus is the most common causative organism of anorectal abscess.","H. pylori is associated with gastric disease, not anorectal abscess.","Candida is not identified as a common cause of anorectal abscess in this lecture.","C. difficile is associated with colitis, not anorectal abscess formation."],"topic":"Anorectal Abscess/Fistula"},{"stem":"A patient with a drained anorectal abscess several weeks ago now presents with persistent perianal discharge and intermittent pain. Based on the pathophysiology discussed in lecture, what has most likely developed?","options":["A chronic anal fistula, which occurs in approximately half of anorectal abscess cases","A colonic polyp","An unrelated case of diverticulitis","A new, unrelated hemorrhoid","Rectal prolapse"],"correctIndex":0,"explanations":["Correct — approximately 50% of anorectal abscesses result in a chronic fistula, representing the second phase of the same disease process.","This presentation is not consistent with a colonic polyp.","This presentation is directly linked to the prior abscess, not incidental diverticulitis.","This presentation is a known complication of the prior abscess, not an unrelated new process.","Rectal prolapse presents with a protruding mass, not discharge from a prior abscess site."],"topic":"Anorectal Abscess/Fistula"},{"stem":"A 62-year-old woman presents with a sensation of a mass protruding from her anus with straining, along with incomplete bowel evacuation. Exam reveals full-thickness protrusion of all layers of the rectum through the anus. Which condition does this describe?","options":["Partial (mucosal) rectal prolapse","Occult rectal intussusception","Anal fissure","Complete rectal prolapse","Grade IV internal hemorrhoids"],"correctIndex":3,"explanations":["Partial prolapse involves only the mucosa, not all layers, as described here.","Occult intussusception involves telescoping without protrusion through the anal verge, unlike this presentation.","An anal fissure presents as a tear, not a protruding mass.","Correct — complete rectal prolapse (procidentia) involves protrusion of all layers of the rectum through the anus.","Hemorrhoids do not present as full-thickness protrusion of all rectal wall layers."],"topic":"Rectal Prolapse"},{"stem":"A patient with rectal prolapse is being evaluated. According to lecture, what is the definitive treatment for this condition?","options":["Rubber band ligation","Pelvic floor exercises alone","Topical nitroglycerin","Surgical repair (rectopexy)","High-fiber diet alone"],"correctIndex":3,"explanations":["Rubber band ligation is a hemorrhoid treatment, not a treatment for rectal prolapse.","Pelvic floor exercises are described as an adjunct, not the definitive treatment.","Topical nitroglycerin is used for anal fissures, not rectal prolapse.","Correct — surgical repair (rectopexy) is the definitive treatment for rectal prolapse; recurrence and enlargement are common without it.","A high-fiber diet is not described as definitive treatment for structural prolapse."],"topic":"Rectal Prolapse"},{"stem":"A 24-year-old woman reports recurrent crampy abdominal pain that improves after defecation, along with alternating episodes of diarrhea and constipation over the past 4 months. Workup for infection and celiac disease is negative. Which diagnostic framework is used to establish this diagnosis according to lecture?","options":["Rome diagnostic criteria","Alvarado score","CT enterography findings alone","OLGA staging system","Truelove and Witts criteria"],"correctIndex":0,"explanations":["Correct — the Rome diagnostic criteria (recurrent abdominal pain associated with defecation and/or changes in stool frequency or form) are used to establish this diagnosis.","The Alvarado score evaluates appendicitis likelihood, not IBS.","CT enterography is not the diagnostic framework described for this condition; IBS is a clinical diagnosis of exclusion.","The OLGA system stages gastritis, not IBS.","Truelove and Witts criteria are used for ulcerative colitis severity, not IBS diagnosis."],"topic":"IBS"},{"stem":"A patient with IBS with predominant constipation (IBS-C) has not improved with PEG and fiber. Which class of medication, which increases intestinal chloride and fluid secretion, is described as the next step for refractory cases?","options":["Linaclotide or lubiprostone","Dicyclomine","Cholestyramine","Vancomycin","Loperamide"],"correctIndex":0,"explanations":["Correct — linaclotide or lubiprostone, which increase intestinal chloride/fluid secretion, are used for IBS-C refractory to PEG and fiber.","Dicyclomine is an anticholinergic used later in IBS-D management, not IBS-C.","Cholestyramine is used for IBS-D, not IBS-C.","Vancomycin is not part of the IBS treatment algorithm.","Loperamide is used for IBS-D, not refractory IBS-C."],"topic":"IBS"},{"stem":"A 58-year-old man with chronic constipation and a low-fiber diet undergoes colonoscopy, which reveals multiple sac-like outpouchings of the colonic wall, most prominent in the sigmoid colon. He is asymptomatic. Which statement about this finding is most accurate according to lecture?","options":["This is diverticulosis; the right colon, despite lower diverticula prevalence, is the most common source of bleeding due to thinner walls","This finding always requires surgical resection","This is diverticulitis and requires antibiotics immediately","This finding is a normal variant with no clinical significance","This finding is diagnostic of colorectal cancer"],"correctIndex":0,"explanations":["Correct — this describes diverticulosis; despite being more common on the left, the right colon is the most common source of bleeding due to its thinner walls.","Diverticulosis does not require surgical resection in an asymptomatic patient.","This describes asymptomatic diverticula, which is diverticulosis, not the inflammatory process of diverticulitis.","While often asymptomatic, diverticulosis carries clinical significance, including bleeding risk.","This is not a diagnostic feature of colorectal cancer."],"topic":"Diverticular Disease"},{"stem":"A patient with known diverticulosis presents with painless hematochezia. According to lecture, what is the most common cause of acute lower GI bleeding, and what is the first-line diagnostic test?","options":["Hemorrhoids; anoscopy","IBD; flexible sigmoidoscopy","Ischemic colitis; CT angiography","Diverticulosis; colonoscopy after an upper GI bleed has been ruled out","Colorectal cancer; CEA level"],"correctIndex":3,"explanations":["Hemorrhoids are not identified as the most common cause of significant acute lower GI bleeding in this lecture.","IBD is not identified as the most common cause of acute LGIB in this lecture.","Ischemic colitis is not identified as the most common cause of acute LGIB in this lecture.","Correct — diverticulosis is the most common cause of acute lower GI bleeding, and colonoscopy is first-line after an upper GI source has been ruled out.","CRC is not the most common cause of acute LGIB, and CEA is not a diagnostic test for acute bleeding."],"topic":"Diverticular Disease"},{"stem":"A 55-year-old man presents with acute left lower quadrant pain, low-grade fever, and a change in bowel habits. Exam reveals LLQ tenderness with guarding. What is the first-line imaging study to evaluate for suspected diverticulitis, and why is colonoscopy avoided at this time?","options":["No imaging needed; colonoscopy should be done immediately instead","CT abdomen/pelvis with contrast; colonoscopy is contraindicated acutely due to perforation risk","MRI abdomen; colonoscopy is too expensive","Plain abdominal x-ray; colonoscopy requires general anesthesia","Ultrasound; colonoscopy is not covered by insurance"],"correctIndex":1,"explanations":["Imaging is specifically indicated, and colonoscopy is avoided acutely, not preferred, due to perforation risk.","Correct — CT abdomen/pelvis with contrast is first-line, and colonoscopy is avoided acutely due to the risk of perforation."," MRI is not the described first-line imaging modality for suspected acute diverticulitis.","Plain x-ray is not the first-line imaging study, and anesthesia requirements are not the reason colonoscopy is avoided.","Cost and insurance coverage are not the described reasons for avoiding colonoscopy in this lecture."],"topic":"Diverticular Disease"},{"stem":"A patient with uncomplicated diverticulitis is being considered for outpatient management. Which factor would make her an inappropriate candidate for outpatient treatment according to lecture?","options":["Ability to tolerate oral intake","Age 45 with no comorbidities","Reliable follow-up and no signs of sepsis","Mild, well-controlled pain","Age >70 with poorly controlled diabetes mellitus"],"correctIndex":4,"explanations":["This is consistent with appropriate outpatient candidacy.","This profile is consistent with appropriate outpatient management.","Reliable follow-up without sepsis supports outpatient management.","Mild, controlled pain supports outpatient management.","Correct — age >70 with significant comorbidities such as poorly controlled diabetes is a described indication for inpatient management."],"topic":"Diverticular Disease"},{"stem":"A patient with a history of ulcerative colitis presents with severe bloody diarrhea, fever of 39°C, heart rate of 128 bpm, and altered mental status. Abdominal x-ray shows colonic dilation of 7 cm. Based on the diagnostic criteria discussed in lecture, which diagnosis is most likely?","options":["Toxic megacolon","Simple UC flare without complication","Diverticulitis","Chronic mesenteric ischemia","IBS-D exacerbation"],"correctIndex":0,"explanations":["Correct — colonic dilation >6 cm plus ≥3 systemic toxicity criteria (fever >38°C, HR >120, leukocytosis, anemia) plus ≥1 additional criterion (altered mental status) meets criteria for toxic megacolon.","This presentation exceeds a simple flare, meeting specific criteria for a more severe complication.","Diverticulitis does not present with this pattern of colonic dilation and systemic toxicity criteria.","Chronic mesenteric ischemia presents with postprandial pain, not this acute toxic presentation.","IBS-D does not cause colonic dilation or systemic toxicity."],"topic":"Toxic Megacolon"},{"stem":"A patient with toxic megacolon secondary to C. difficile colitis is being managed. Which of the following should specifically be AVOIDED in this patient, according to lecture?","options":["IV fluids","Antimotility agents such as opioids and anticholinergics","Broad-spectrum IV antibiotics","Bowel rest (NPO)","NGT decompression"],"correctIndex":1,"explanations":["IV fluids are part of appropriate supportive management, not something to avoid.","Correct — antimotility agents such as opioids and anticholinergics should be avoided in toxic megacolon.","Broad-spectrum antibiotics are part of appropriate supportive management.","Bowel rest is part of appropriate supportive management.","NGT decompression is part of appropriate supportive management."],"topic":"Toxic Megacolon"},{"stem":"A patient with toxic megacolon develops worsening abdominal rigidity, guarding, and rebound tenderness concerning for perforation. What is the most appropriate next step in management?","options":["Emergent surgery (partial or total colectomy)","Add an antimotility agent to reduce bowel frequency","Start oral vancomycin only, with no other intervention","Continue supportive care alone and reassess in 48 hours","Discharge with close outpatient follow-up"],"correctIndex":0,"explanations":["Correct — colonic perforation with peritonitis/sepsis requires emergent surgery (partial or total colectomy).","Antimotility agents are contraindicated in toxic megacolon and would not address perforation.","Oral vancomycin addresses the underlying C. diff infection but does not address an acute surgical emergency like perforation.","Continuing supportive care alone is inappropriate once signs of perforation/peritonitis develop.","Discharge would be dangerous and inappropriate given signs of perforation."],"topic":"Toxic Megacolon"},{"stem":"A 26-year-old woman presents with RLQ abdominal pain, chronic non-bloody diarrhea, fatigue, and unintentional weight loss. Colonoscopy shows segmental disease with cobblestoning and aphthous ulcerations, with rectal sparing. Which diagnosis is most consistent with these findings?","options":["Toxic megacolon","Diverticulitis","Ischemic colitis","Crohn disease","Ulcerative colitis"],"correctIndex":3,"explanations":["Toxic megacolon is an acute complication, not this presentation.","Diverticulitis presents with focal LLQ pain, not this segmental colonoscopic pattern.","Ischemic colitis presents acutely, often in older patients, not with this chronic segmental pattern.","Correct — Crohn disease presents with segmental (skip) lesions, cobblestoning, aphthous ulcerations, and typically spares the rectum, matching this presentation.","UC classically involves the rectum in a continuous pattern and causes bloody diarrhea, unlike this presentation."],"topic":"IBD"},{"stem":"A biopsy from a patient with suspected Crohn disease shows inflammation extending through the full thickness of the bowel wall with noncaseating granulomas. Which layer(s) of the bowel wall does Crohn disease characteristically involve, in contrast to ulcerative colitis?","options":["Muscularis propria only, sparing mucosa","Transmural (full-thickness) involvement","Mucosa and submucosa only","Mucosa only","Serosa only"],"correctIndex":1,"explanations":["Crohn disease is not described as sparing the mucosa while only affecting the muscularis.","Correct — Crohn disease is characterized by transmural inflammation, in contrast to the mucosal/submucosal-limited inflammation of ulcerative colitis.","Mucosal/submucosal-only involvement is the pattern described for ulcerative colitis, not Crohn disease.","Mucosa-only involvement is more characteristic of ulcerative colitis, not Crohn disease.","Crohn disease is not limited to the serosa alone."],"topic":"IBD"},{"stem":"A patient with Crohn disease is found to have disease most heavily concentrated in one particular segment of bowel. According to lecture, which segment is most commonly involved in Crohn disease?","options":["Sigmoid colon exclusively","Esophagus","Duodenum","Terminal ileum","Rectum"],"correctIndex":3,"explanations":["Crohn disease is not described as exclusively involving the sigmoid colon.","The esophagus is not identified as the most commonly involved segment in Crohn disease.","The duodenum is not identified as the most commonly involved segment.","Correct — the terminal ileum is the most commonly involved segment in Crohn disease.","The rectum is usually spared in Crohn disease, in contrast to ulcerative colitis."],"topic":"IBD"},{"stem":"A patient with a new diagnosis of colitis undergoes serologic testing. Positive p-ANCA and negative ASCA are most suggestive of which diagnosis, based on the antibody patterns discussed in lecture?","options":["IBS","Ulcerative colitis","Diverticulitis","Ischemic colitis","Crohn disease"],"correctIndex":1,"explanations":["IBS is not associated with these serologic antibody patterns; it is a diagnosis of exclusion.","Correct — ulcerative colitis is associated with positive p-ANCA, while Crohn disease is associated with positive ASCA.","Diverticulitis is not associated with these serologic antibody patterns.","Ischemic colitis is not associated with these serologic antibody patterns.","Crohn disease is more associated with positive ASCA, not p-ANCA, in the pattern described in lecture."],"topic":"IBD"},{"stem":"A patient with ulcerative colitis undergoes double-contrast barium enema, which shows loss of normal haustral markings, described using a classic descriptive term. Which term does this refer to?","options":["Corkscrew sign","Bird beak sign","String sign","Apple core sign","Lead pipe/stovepipe sign"],"correctIndex":4,"explanations":["Corkscrew sign is associated with diffuse esophageal spasm, not UC barium findings.","Bird beak sign is associated with achalasia, not UC.","String sign is associated with pyloric narrowing, not UC barium findings.","Apple core sign is classically associated with colorectal cancer, not UC.","Correct — the \\\"lead pipe/stovepipe\\\" sign describes the loss of haustral markings seen on barium enema in ulcerative colitis."],"topic":"IBD"},{"stem":"A patient with mild-to-moderate left-sided ulcerative colitis is being started on treatment. According to the described treatment approach, what is the recommended first-line therapy?","options":["Anti-TNF biologic therapy immediately","IV steroids immediately","Total colectomy","Oral vancomycin","Combination oral plus topical 5-ASA"],"correctIndex":4,"explanations":["Anti-TNF therapy is reserved for disease refractory to steroids, not first-line treatment.","IV steroids are reserved for severe colitis requiring hospitalization, not first-line mild-moderate disease.","Colectomy is not the first-line approach for mild-to-moderate disease.","Oral vancomycin is not part of the UC treatment algorithm described in lecture.","Correct — for mild-to-moderate left-sided/extensive colitis, combination oral plus topical 5-ASA is the described first-line approach, with escalation to topical steroids and beyond if needed."],"topic":"IBD"},{"stem":"A patient with severe ulcerative colitis and significant rectal bleeding requires hospitalization. According to lecture, what is the appropriate treatment in this setting?","options":["Watchful waiting without treatment","Oral 5-ASA alone","IV steroids","Topical lidocaine","Bulk-forming laxatives"],"correctIndex":2,"explanations":["Watchful waiting is inappropriate for severe, hospitalization-requiring colitis.","Oral 5-ASA is used for milder disease, not severe colitis requiring hospitalization.","Correct — severe colitis with significant bleeding requiring hospitalization is treated with IV steroids.","Topical lidocaine is used for anal fissures, not severe UC.","Bulk-forming laxatives are not a treatment for active severe colitis."],"topic":"IBD"},{"stem":"A 72-year-old woman with atrial fibrillation not on anticoagulation presents with sudden, severe abdominal pain that is markedly out of proportion to a benign-appearing abdominal exam. Which diagnosis should be strongly suspected, and what is the most common underlying mechanism?","options":["Toxic megacolon; ulcerative colitis","Acute mesenteric ischemia; arterial embolism, most commonly from atrial fibrillation","Chronic mesenteric ischemia; atherosclerotic narrowing","Ischemic colitis; non-occlusive low flow state","Diverticulitis; diverticular perforation"],"correctIndex":1,"explanations":["Toxic megacolon requires specific dilation and toxicity criteria, not this presentation.","Correct — acute mesenteric ischemia should be suspected given pain out of proportion to exam, and arterial embolism (often from atrial fibrillation) is the most common cause, accounting for 60–70% of cases.","Chronic mesenteric ischemia presents with postprandial pain over time, not this sudden severe presentation.","Ischemic colitis is usually non-occlusive but presents differently, often with bloody diarrhea in an older patient without this classic pain-out-of-proportion description tied specifically to embolism from AFib.","Diverticulitis presents with localized LLQ pain, not this diffuse pain-out-of-proportion presentation."],"topic":"Acute Mesenteric Ischemia"},{"stem":"A patient with suspected acute mesenteric ischemia is hemodynamically stable. Which imaging study is first-line for diagnosis according to lecture?","options":["CT angiography without oral contrast","Plain abdominal x-ray alone","Barium enema","MR enterography","Endoscopic ultrasound"],"correctIndex":0,"explanations":["Correct — CT angiography without oral contrast is first-line for a stable patient with suspected acute mesenteric ischemia.","Plain x-ray alone is not sufficient to diagnose this condition.","Barium enema is not the described first-line study for this diagnosis.","MR enterography is used for Crohn disease evaluation, not acute mesenteric ischemia.","Endoscopic ultrasound is not the described diagnostic tool for this condition."],"topic":"Acute Mesenteric Ischemia"},{"stem":"A patient is diagnosed with acute mesenteric ischemia due to arterial embolism. What is the most appropriate initial management approach according to lecture?","options":["Oral antibiotics alone","Systemic anticoagulation alone, without further intervention","Early surgical embolectomy and/or thrombolytics","Watchful waiting with serial exams only","High-fiber diet and outpatient follow-up"],"correctIndex":2,"explanations":["Antibiotics alone do not address the underlying arterial occlusion.","Anticoagulation alone is the described approach for venous thrombosis, not arterial embolism.","Correct — embolism-related acute mesenteric ischemia requires early surgical embolectomy and/or thrombolytics.","This condition carries a high mortality rate (~60%) and requires urgent intervention, not watchful waiting.","This is an emergent condition, not appropriate for outpatient management."],"topic":"Acute Mesenteric Ischemia"},{"stem":"A 70-year-old man with a history of coronary artery disease and hypertension describes dull abdominal pain that consistently occurs 30 minutes after eating, leading him to avoid food and lose 15 pounds. Exam reveals a faint abdominal bruit. Which diagnosis is most consistent with this presentation?","options":["Toxic megacolon","Ischemic colitis","Anal fissure","Chronic mesenteric ischemia","Acute mesenteric ischemia"],"correctIndex":3,"explanations":["Toxic megacolon presents acutely with systemic toxicity, not this chronic pattern.","Ischemic colitis presents acutely with bloody diarrhea, not this chronic postprandial pattern.","An anal fissure would not explain this systemic postprandial pain pattern.","Correct — chronic mesenteric ischemia presents with postprandial abdominal pain (\\\"intestinal angina\\\"), food fear, weight loss, and possible abdominal bruit, due to atherosclerotic narrowing of ≥2 major splanchnic vessels.","Acute mesenteric ischemia presents with sudden severe pain, not this chronic postprandial pattern with weight loss."],"topic":"Chronic Mesenteric Ischemia"},{"stem":"A patient with chronic mesenteric ischemia is found to have significant symptoms affecting quality of life. What is the recommended treatment approach for symptomatic disease according to lecture?","options":["Immediate total colectomy","Lifestyle modification alone with no procedural intervention","Revascularization (open or endovascular) with bypass and/or stenting","Watchful waiting only","Long-term opioid therapy for pain control"],"correctIndex":2,"explanations":["Colectomy is not the described treatment for this vascular condition.","Lifestyle modification and antiplatelet therapy are described for asymptomatic disease, not symptomatic disease requiring more definitive treatment.","Correct — symptomatic chronic mesenteric ischemia is treated with revascularization, either open or endovascular, with bypass and/or stenting.","Watchful waiting alone is not appropriate for symptomatic disease impacting nutrition and weight.","Opioids do not address the underlying vascular narrowing and are not the described treatment."],"topic":"Chronic Mesenteric Ischemia"},{"stem":"A 74-year-old woman presents with sudden left-sided abdominal pain followed by bloody diarrhea within 24 hours. CT abdomen shows segmental bowel wall thickening with a \"thumbprinting\" pattern in a watershed area of the colon. Which diagnosis is most consistent with these findings?","options":["Ischemic colitis","Chronic mesenteric ischemia","Anal fissure","Diverticulosis","Crohn disease"],"correctIndex":0,"explanations":["Correct — ischemic colitis presents with rapid-onset abdominal pain followed by bloody diarrhea within 24 hours, with \\\"thumbprinting\\\" on CT in watershed areas with limited collateral circulation.","Chronic mesenteric ischemia presents with postprandial pain over time, not this acute presentation.","An anal fissure does not explain this systemic bowel wall thickening pattern.","Diverticulosis is typically asymptomatic or causes painless bleeding, not this acute ischemic presentation.","Crohn disease typically has a more chronic course with segmental skip lesions, not this acute watershed ischemic pattern."],"topic":"Ischemic Colitis"},{"stem":"A patient with suspected ischemic colitis is being evaluated. Which diagnostic study confirms the diagnosis, and under what circumstance is it contraindicated?","options":["Sigmoidoscopy/colonoscopy; contraindicated if high risk for or active perforation","Capsule endoscopy; contraindicated if under age 18","Upper endoscopy; contraindicated if the patient is anticoagulated","Barium enema; contraindicated in all cases","CT angiography; contraindicated if renal failure is present"],"correctIndex":0,"explanations":["Correct — sigmoidoscopy/colonoscopy confirms the diagnosis of ischemic colitis but is contraindicated if there is high risk for or active perforation.","Capsule endoscopy is not the described confirmatory test for ischemic colitis.","Upper endoscopy would not evaluate the colon and is not the described confirmatory test.","Barium enema is not the described confirmatory test, nor is it universally contraindicated in this context.","CT angiography is used for acute mesenteric ischemia; sigmoidoscopy/colonoscopy is what confirms ischemic colitis specifically."],"topic":"Ischemic Colitis"},{"stem":"On screening colonoscopy, a 62-year-old man is found to have a 1.5 cm polyp in which glands extend straight down to the center of the polyp on histology. Based on the classification discussed in lecture, which type of polyp carries the highest malignant potential?","options":["Hyperplastic polyp","Inflammatory pseudopolyp","Villous adenoma","Sessile serrated lesion with no dysplasia","Tubular adenoma"],"correctIndex":2,"explanations":["Hyperplastic polyps are the most common non-neoplastic polyp type with lower malignant risk.","Pseudopolyps are non-neoplastic and seen in the setting of UC/Crohn disease, not primarily malignant.","Correct — villous adenomas have the highest malignant potential among adenomatous polyps and are more common in the left colon.","A sessile serrated lesion without dysplasia carries lower risk than a villous adenoma.","Tubular adenomas are the most common adenomatous subtype but carry the least malignant risk among adenomas."],"topic":"Colonic Polyps"},{"stem":"A patient undergoes polypectomy for a single tubular adenoma measuring 12 mm, without high-grade dysplasia. According to the surveillance guidance discussed in lecture, when should the next surveillance colonoscopy be performed?","options":["In 20 years","In 3 months","In 3 years","In 7–10 years","Never; no further surveillance needed"],"correctIndex":2,"explanations":["This interval is far too long given the advanced adenoma finding.","The 3-month interval is used specifically after removal to confirm complete resection in select scenarios, not the standard surveillance interval described for this finding.","Correct — an advanced adenoma, such as a tubular adenoma >10 mm, warrants surveillance colonoscopy at 3 years.","The 7–10 year interval applies to patients with no advanced adenomas found.","Continued surveillance is required given the advanced adenoma finding."],"topic":"Colonic Polyps"},{"stem":"A patient has 3 tubular adenomas removed on colonoscopy, each measuring less than 10 mm, with no advanced features. According to the surveillance intervals discussed in lecture, when should the follow-up colonoscopy occur?","options":["Never","1 year, then annually thereafter","10–15 years","3 months","3–5 years"],"correctIndex":4,"explanations":["Continued surveillance is required given the adenoma findings.","This is not the surveillance interval described for this specific finding.","This interval is longer than what is recommended for this finding.","This interval is too short for this specific finding, which is used after polypectomy margin concerns rather than routine small-adenoma surveillance.","Correct — 3–4 tubular adenomas <10 mm warrant repeat colonoscopy in 3–5 years."],"topic":"Colonic Polyps"},{"stem":"A 45-year-old woman is found to have a change in bowel habits and iron deficiency anemia. Colonoscopy reveals a mass in the ascending colon, and biopsy confirms adenocarcinoma. According to lecture, which symptom is most associated with right-sided colon tumors specifically?","options":["Tenesmus","Rectal pain","Hematochezia","Obstruction as the presenting symptom","Iron deficiency anemia"],"correctIndex":4,"explanations":["Tenesmus is associated with rectal cancer, not right-sided colon tumors.","Rectal pain is associated with rectal cancer specifically, not right-sided colon tumors.","Hematochezia is more associated with rectosigmoid tumors, not right-sided tumors.","Obstruction is more associated with left-sided tumors due to a narrower lumen and more solid stool.","Correct — iron deficiency anemia is more associated with right-sided tumors, in contrast to hematochezia, which is more linked to rectosigmoid tumors."],"topic":"Colorectal Malignancies"},{"stem":"A 30-year-old woman is diagnosed with colorectal cancer. Her family history reveals her mother was diagnosed with endometrial cancer at age 45. Genetic testing confirms a hereditary CRC syndrome. Which syndrome is most likely, and what is the recommended screening start age for at-risk relatives?","options":["Gardner syndrome; age 30","Lynch syndrome (HNPCC); age 20–25","Peutz-Jeghers syndrome; age 8","Turcot syndrome; age 50","Familial adenomatous polyposis; age 10–12"],"correctIndex":1,"explanations":["Gardner syndrome is a subtype of FAP with additional soft tissue/bone tumors, not this pattern.","Correct — Lynch syndrome (HNPCC) should be suspected in patients diagnosed with CRC before age 50, especially with associated endometrial, ovarian, stomach, or renal pelvis/ureter malignancies in the family, and screening starts at age 20–25.","Peutz-Jeghers is associated with hamartomatous polyps and mucocutaneous freckling, not this family history pattern, and this screening age is incorrect.","Turcot syndrome is a rare, high-risk FAP variant, not the best fit for this presentation, and this age is incorrect.","FAP screening begins at age 10–12, but FAP is not associated with young-onset CRC plus endometrial cancer in this pattern; Lynch syndrome fits better."],"topic":"Colorectal Malignancies"},{"stem":"A patient with familial adenomatous polyposis (FAP) is being counseled about her diagnosis. Which statement accurately reflects the natural history of this condition according to lecture?","options":["Most patients never develop cancer if polyps are left untreated","All patients eventually develop cancer, often by age 20, due to the underlying APC gene mutation","FAP is characterized by fewer than 10 polyps typically","FAP screening begins at age 40","FAP is caused by a mutation in the STK11 gene"],"correctIndex":1,"explanations":["This is inaccurate; all FAP patients eventually develop cancer without treatment.","Correct — FAP results from an APC gene mutation causing hundreds to thousands of polyps, with cancer usually developing by age 20 and essentially all patients eventually affected.","FAP is characterized by hundreds to thousands of polyps, not fewer than 10.","FAP screening begins much earlier, at age 10–12, not age 40.","STK11 mutations cause Peutz-Jeghers syndrome, not FAP."],"topic":"Colorectal Malignancies"},{"stem":"A 55-year-old man at average risk for colorectal cancer asks about screening options. According to the screening guidance discussed in lecture, at what age should average-risk screening begin, and what is a recommended screening interval for colonoscopy?","options":["Age 45; every 10 years","Age 60; every 3 years","Age 40; every 2 years","Age 30; every 15 years","Age 50; every 20 years"],"correctIndex":0,"explanations":["Correct — average-risk screening begins at age 45 through age 75, with colonoscopy every 10 years (or annual FIT).","This age is later than the recommended starting age, and this interval is too short.","This starting age and interval do not match the guidance in lecture.","This age is younger than the described average-risk starting age.","This starting age and interval do not match the guidance in lecture."],"topic":"Colorectal Malignancies"},{"stem":"A patient recently diagnosed with colorectal cancer has a preoperative CEA level obtained. According to lecture, what is the primary clinical utility of this tumor marker in this setting?","options":["It definitively diagnoses colorectal cancer on its own","A preoperative CEA >5 ng/mL suggests a worse prognosis, and it is used for post-diagnosis monitoring/prognosis rather than screening","It is used for population-wide colorectal cancer screening","It replaces the need for colonoscopy in diagnosis","It has 100% specificity for colorectal cancer"],"correctIndex":1,"explanations":["CEA alone does not establish a definitive diagnosis; colonoscopy with biopsy is the diagnostic gold standard.","Correct — CEA is not used for screening due to poor specificity, but a preoperative level >5 ng/mL suggests worse prognosis, and it is useful for post-diagnosis follow-up, with rising levels suggesting recurrence.","CEA and CA 19-9 have poor specificity and should NOT be used for screening.","Colonoscopy with biopsy remains the diagnostic gold standard, not CEA.","CEA has poor specificity, not high specificity, per lecture."],"topic":"Colorectal Malignancies"},{"stem":"A patient with stage 2 rectal cancer is being planned for treatment. According to the treatment-by-stage information discussed in lecture, which combination of therapies is appropriate?","options":["Chemotherapy alone with no surgery","Observation only, since stage 2 requires no treatment","Surgery alone","Surgery + chemotherapy + radiation","Radiation alone with no chemotherapy or surgery"],"correctIndex":3,"explanations":["Surgery remains part of the treatment approach for resectable stage 2 disease.","Stage 2 disease requires active treatment, not observation alone.","Surgery alone is appropriate for stage 0–1 disease, not stage 2 rectal cancer.","Correct — stage 2 rectal cancer (and high-risk colon cancer) is treated with surgery plus chemotherapy (FOLFOX or CapeOx) plus radiation for rectal cancer.","Radiation alone omits necessary surgical and chemotherapy components described for this stage."],"topic":"Colorectal Malignancies"},{"stem":"A 45-year-old woman presents with rectal bleeding, which she reports has been her main symptom for the past 2 months. Biopsy of an anal mass confirms squamous cell carcinoma. According to lecture, which statement about anal malignancy is most accurate?","options":["This cancer type is most commonly adenocarcinoma","Anal malignancies are more common in men than women","Risk factors do not include HPV infection","Rectal bleeding is the most common initial symptom, occurring in about 45% of patients","CEA is routinely used to screen for and monitor this cancer"],"correctIndex":3,"explanations":["Anal malignancy usually refers to squamous cell carcinoma, not adenocarcinoma.","Anal malignancy risk factors include female gender per lecture, not predominance in men.","HPV history is a specifically listed risk factor for anal malignancy.","Correct — rectal bleeding is the most common initial symptom of anal malignancy, occurring in approximately 45% of patients.","CEA is NOT routinely tested in these patients according to lecture."],"topic":"Anal Malignancies"},{"stem":"A patient with anal squamous cell carcinoma is being treated with combination chemoradiotherapy. According to lecture, what is the key advantage of this treatment approach over surgery alone?","options":["It has no role in anal cancer treatment","It requires no reassessment after completion","It preserves the anal sphincter in 70–85% of cases","It is used only for metastatic disease","It eliminates the need for any follow-up monitoring"],"correctIndex":2,"explanations":["Chemoradiotherapy is the preferred standard treatment approach, not an unused option.","Reassessment of treatment response every 8–12 weeks after chemoradiation completion is part of standard management.","Correct — chemoradiotherapy, typically with 5-FU, mitomycin, and radiation, is preferred because it preserves the anal sphincter in 70–85% of cases.","Chemoradiotherapy is the standard approach across appropriate stages, not reserved only for metastatic disease.","Follow-up monitoring (DRE, CT/PET) remains necessary after treatment."],"topic":"Anal Malignancies"}],"mcQuestions":[{"stem":"By definition, constipation refers to passing fewer than how many stools per week?","options":["Fewer than 2 stools per week.","Fewer than 1 stool per week.","Fewer than 7 stools per week.","Fewer than 5 stools per week.","Fewer than 3 stools per week."],"correctIndex":4},{"stem":"Name three classes of medications commonly implicated in causing constipation.","options":["Antibiotics, NSAIDs, and diuretics.","SSRIs, proton pump inhibitors, and insulin.","Beta blockers, ACE inhibitors, and statins.","Opioids, antiemetics (e.g., ondansetron/Zofran), and calcium channel blockers (e.g., verapamil).","Laxatives, antacids, and anticoagulants."],"correctIndex":3},{"stem":"What is the first-line treatment for uncomplicated constipation?","options":["Enemas or suppositories.","A high-fiber diet.","Stool softeners.","Osmotic laxatives.","Stimulant laxatives."],"correctIndex":1},{"stem":"What is fecal impaction?","options":["A tear in the anoderm of the distal anal canal.","A solid, immobile bulk of stool in the rectum, typically from decreased fecal mobility.","An abnormal engorgement of the anal vascular cushions.","A functional bowel obstruction due to neurogenic failure of peristalsis.","A telescoping of one segment of bowel into an adjacent segment."],"correctIndex":1},{"stem":"What is the first-line treatment for fecal impaction?","options":["Water contrast enema alone, without manual disimpaction.","Manual disimpaction followed by colon evacuation with a PEG-electrolyte enema.","High-dose opioid analgesics.","Immediate surgical colectomy.","A course of oral antibiotics."],"correctIndex":1},{"stem":"List the major risk factors associated with fecal incontinence.","options":["Diarrhea, celiac disease, IBD, and recent GI infection only.","Age, diarrhea, fecal urgency, urinary incontinence, diabetes mellitus, and central adiposity.","Pregnancy, anorectal surgery, and neurologic disease only.","Male sex, alcohol use, low-fiber diet, and obesity.","Age, constipation, hypertension, hyperlipidemia, and smoking."],"correctIndex":1},{"stem":"What physical exam maneuver assesses for a neurologic cause of fecal incontinence?","options":["Rovsing sign (pain in one quadrant with palpation of the opposite side).","Murphy sign (pain with palpation during inspiration).","The obturator sign (pain with hip flexion and internal rotation).","The psoas sign (pain with passive hip extension).","The anal wink reflex (stroking perianal skin and observing sphincter contraction; absence suggests a neurologic process)."],"correctIndex":4},{"stem":"What is the most common cause of paralytic (adynamic) ileus?","options":["Arterial embolism.","Severe hyperthyroidism.","The postoperative state.","Chronic opioid use alone.","Diverticular perforation."],"correctIndex":2},{"stem":"On abdominal x-ray, how does paralytic ileus classically differ from a mechanical small bowel obstruction?","options":["Ileus shows diffuse dilated bowel loops WITHOUT a transition zone (vs. a transition point in mechanical obstruction).","Ileus shows pneumatosis intestinalis, while SBO shows a normal gas pattern.","Ileus shows colonic dilation greater than 6 cm with systemic toxicity.","Ileus shows free air under the diaphragm, while SBO does not.","Ileus shows a discrete transition point with proximal dilation and distal decompression."],"correctIndex":0},{"stem":"What is the most common etiology of anal fissures?","options":["Portal hypertension.","Bacterial infection with Staphylococcus aureus.","Chronic straining from diarrhea alone.","Local trauma from constipation/hard stools.","HPV infection."],"correctIndex":3},{"stem":"Where are approximately 90% of anal fissures located?","options":["The anterior midline of the anal canal.","The posterior midline of the anal canal.","Circumferentially around the entire anal canal.","Proximal to the dentate line.","The lateral walls of the anal canal."],"correctIndex":1},{"stem":"What class of topical medication is used to relax the internal anal sphincter in fissure treatment?","options":["Antibiotics (e.g., topical mupirocin).","Vasodilators (e.g., topical nifedipine or nitroglycerin).","Corticosteroids (e.g., topical hydrocortisone).","Anticholinergics (e.g., topical dicyclomine).","Beta blockers (e.g., topical propranolol)."],"correctIndex":1},{"stem":"What surgical procedure is reserved for chronic anal fissures refractory to medical therapy?","options":["Rectopexy.","Lateral internal sphincterotomy (LIS).","Hemorrhoidectomy.","Cricopharyngeal myotomy.","Rubber band ligation."],"correctIndex":1},{"stem":"Anatomically, how are internal hemorrhoids distinguished from external hemorrhoids?","options":["Internal hemorrhoids are distal to the dentate line; external hemorrhoids are proximal to the dentate line.","Internal hemorrhoids are always painful; external hemorrhoids are always painless.","Internal hemorrhoids arise from arterial vessels; external hemorrhoids arise from venous vessels only.","Internal hemorrhoids occur only in the sigmoid colon; external hemorrhoids occur only in the rectum.","Internal hemorrhoids are proximal to the dentate line; external hemorrhoids are distal to the dentate line."],"correctIndex":4},{"stem":"Which grade of internal hemorrhoid is irreducible and may strangulate?","options":["Grade II.","Grade I.","Grade IV.","There is no grade associated with strangulation.","Grade III."],"correctIndex":2},{"stem":"What is the most common procedure for Grade II–III internal hemorrhoids refractory to conservative treatment?","options":["Surgical hemorrhoidectomy.","Infrared coagulation.","Rubber band ligation.","Sclerotherapy.","Office-based excision."],"correctIndex":2},{"stem":"What conditions contraindicate rubber band ligation of hemorrhoids?","options":["Diabetes mellitus, hypertension, or a history of smoking.","Celiac disease, IBD, or a history of GI infection.","Coagulopathy, anticoagulation therapy, or a history of portal hypertension.","Pregnancy, obesity, or a history of chronic constipation.","Age over 65, prior appendectomy, or NSAID use."],"correctIndex":2},{"stem":"What is the most common causative organism of an anorectal abscess?","options":["Clostridioides difficile.","Candida albicans.","Staphylococcus aureus.","Escherichia coli.","Helicobacter pylori."],"correctIndex":2},{"stem":"What is the first-line treatment for an anorectal abscess?","options":["Topical vasodilator therapy.","Observation without intervention.","Oral antibiotics alone.","Surgical drainage.","Sitz baths alone."],"correctIndex":3},{"stem":"What does the \"WASH\" regimen (post-op anorectal abscess care) stand for?","options":["Warfarin, Aspirin, Statins, Hemorrhoidectomy.","Wound care, Antibiotics, Steroids, Hydration.","Warm water cleansing, Analgesics, Sitz baths, High fiber diet.","Watchful waiting, Antiemetics, Suture removal, Hospitalization.","Weight loss, Ambulation, Sclerotherapy, Hemorrhoidectomy."],"correctIndex":2},{"stem":"Differentiate complete from partial rectal prolapse.","options":["Complete prolapse is a telescoping of bowel without protrusion; partial prolapse protrudes through the anus.","Complete prolapse involves all layers of the rectum protruding through the anus; partial prolapse involves the mucosa only.","Complete prolapse occurs only in men; partial prolapse occurs only in women.","Complete prolapse involves the mucosa only; partial prolapse involves all layers of the rectum.","Complete prolapse resolves spontaneously; partial prolapse always requires surgery."],"correctIndex":1},{"stem":"What surgical procedure is used to definitively treat rectal prolapse?","options":["Rectopexy.","Pyloromyotomy.","Rubber band ligation.","Lateral internal sphincterotomy.","Cricopharyngeal myotomy."],"correctIndex":0},{"stem":"What diagnostic criteria are used to define irritable bowel syndrome (IBS)?","options":["The Alvarado score — clinical and laboratory findings suggestive of appendicitis.","The OLGA staging system — histologic atrophy and metaplasia patterns.","The Rome criteria — recurrent abdominal pain associated with defecation, a change in stool frequency, and/or a change in stool form over the preceding 3 months.","The Rome criteria — recurrent abdominal pain with fever and leukocytosis over the preceding 3 months.","The Truelove and Witts criteria — stool frequency and systemic toxicity markers."],"correctIndex":2},{"stem":"Name the four subtypes of IBS.","options":["IBS-A (acute), IBS-B (bloating), IBS-P (pain), and IBS-N (nocturnal).","Mild, moderate, severe, and refractory IBS, based on pain intensity.","Acute, subacute, chronic, and recurrent IBS, based on duration.","IBS-C (constipation-predominant), IBS-D (diarrhea-predominant), IBS-M (mixed), and IBS-U (unclassified).","IBS-1, IBS-2, IBS-3, and IBS-4, based on symptom severity."],"correctIndex":3},{"stem":"Where in the colon are diverticula most commonly located?","options":["The rectum.","The right colon (ascending colon).","The left colon (sigmoid colon).","The cecum.","The transverse colon."],"correctIndex":2},{"stem":"Which side of the colon is the most common source of diverticular bleeding, and why?","options":["The right colon, because it has the highest density of diverticula.","The transverse colon, because of its central location.","The left colon, because it has thinner walls.","The right colon, because it has thinner walls.","The sigmoid colon, because of high intraluminal pressure."],"correctIndex":3},{"stem":"What is the most common cause of acute lower GI bleeding?","options":["Diverticulosis.","Inflammatory bowel disease.","Hemorrhoids.","Ischemic colitis.","Colorectal cancer."],"correctIndex":0},{"stem":"Why is colonoscopy contraindicated during an episode of acute diverticulitis?","options":["Due to poor visualization from active bleeding.","Due to the increased risk of perforation.","Due to the increased risk of aspiration.","Due to the need for general anesthesia in this setting.","Due to interference with antibiotic absorption."],"correctIndex":1},{"stem":"What is the first-line imaging study for diagnosing diverticulitis?","options":["Plain abdominal x-ray.","CT scan of the abdomen/pelvis with contrast.","Colonoscopy.","Abdominal ultrasound.","MRI of the abdomen/pelvis."],"correctIndex":1},{"stem":"What colonic diameter threshold, seen on imaging, is part of the diagnostic criteria for toxic megacolon?","options":["Colonic dilation greater than 3 cm.","Colonic dilation greater than 4 cm.","Colonic dilation greater than 8 cm.","Colonic dilation greater than 10 cm.","Colonic dilation greater than 6 cm."],"correctIndex":4},{"stem":"What is the treatment for toxic megacolon caused by an ulcerative colitis flare?","options":["Oral vancomycin alone.","Immediate outpatient management with oral 5-ASA.","IV ganciclovir alone.","Antimotility agents to reduce bowel frequency.","IV steroids (in addition to supportive care)."],"correctIndex":4},{"stem":"What is the most commonly affected bowel segment in Crohn disease?","options":["The transverse colon.","The rectum (the terminal ileum is usually spared).","The duodenum.","The terminal ileum (the rectum is usually spared).","The cecum."],"correctIndex":3},{"stem":"Contrast the pattern/depth of inflammation in Crohn disease versus ulcerative colitis.","options":["Crohn disease: mucosal/submucosal inflammation only, continuous from the rectum. Ulcerative colitis: transmural inflammation with skip lesions.","Crohn disease: continuous rectal inflammation. Ulcerative colitis: skip lesions throughout the GI tract.","Crohn disease: serosal inflammation only. Ulcerative colitis: transmural inflammation with granulomas.","Crohn disease: transmural inflammation with skip lesions that can affect any part of the GI tract. Ulcerative colitis: mucosal/submucosal inflammation only, continuous and starting in the rectum.","Crohn disease and ulcerative colitis both cause transmural inflammation limited to the sigmoid colon."],"correctIndex":3},{"stem":"Which antibody is associated with Crohn disease, and which is associated with ulcerative colitis?","options":["Anti-HBs with Crohn disease; anti-HCV with ulcerative colitis.","p-ANCA with Crohn disease; ASCA with ulcerative colitis.","c-ANCA with Crohn disease; anti-mitochondrial antibody with ulcerative colitis.","Anti-tTG antibody with Crohn disease; anti-parietal cell antibody with ulcerative colitis.","Anti-Saccharomyces cerevisiae antibody (ASCA) with Crohn disease; p-ANCA with ulcerative colitis."],"correctIndex":4},{"stem":"What classic finding on double-contrast barium enema is associated with ulcerative colitis?","options":["The \"lead pipe\" (stovepipe) sign — a cylindrical bowel with loss of haustral markings.","The \"bird beak\" sign — a dilated proximal esophagus with distal narrowing.","The \"apple core\" sign — an abrupt, irregular narrowing of the lumen.","The \"target/doughnut\" sign — concentric rings seen on transverse imaging.","The \"string sign\" — a narrow, thread-like lumen from severe stricturing."],"correctIndex":0},{"stem":"What is the most common cause of acute mesenteric ischemia?","options":["Arterial vasospasm from cocaine use.","Non-occlusive low-flow state from sepsis.","Atherosclerotic narrowing over many years.","Venous thrombosis from a hypercoagulable state.","Arterial embolism, most often due to atrial fibrillation."],"correctIndex":4},{"stem":"Which artery is most commonly occluded in acute mesenteric ischemia?","options":["The inferior mesenteric artery (IMA).","The splenic artery.","The superior mesenteric artery (SMA).","The celiac trunk.","The renal artery."],"correctIndex":2},{"stem":"What is the classic description of abdominal pain in acute mesenteric ischemia?","options":["Vague periumbilical pain that migrates to the right lower quadrant.","Localized left lower quadrant pain with rebound tenderness.","Dull, postprandial abdominal pain that worsens after meals.","Severe abdominal pain that is out of proportion to physical exam findings.","Colicky abdominal pain that improves with defecation."],"correctIndex":3},{"stem":"What is the first-line imaging study for both acute and chronic mesenteric ischemia?","options":["MRI without contrast.","Abdominal ultrasound.","Barium enema.","Plain abdominal x-ray.","CT angiography (CTA)."],"correctIndex":4},{"stem":"What laboratory findings support a diagnosis of acute mesenteric ischemia?","options":["Leukocytosis, elevated lactic acid, and elevated LDH.","Anemia, elevated CEA, and elevated CA 19-9.","Leukopenia, decreased lactic acid, and decreased LDH.","Hyperbilirubinemia, elevated ALP, and elevated GGT.","Hypercalcemia, elevated amylase, and elevated lipase."],"correctIndex":0},{"stem":"Chronic mesenteric ischemia results from atherosclerotic narrowing of how many of the three major splanchnic vessels?","options":["At least 2 of the 3 (celiac axis, superior mesenteric artery, inferior mesenteric artery).","None of the splanchnic vessels — venous occlusion only.","At least 2 of 4 major splanchnic vessels.","Only 1 of the 3 major splanchnic vessels.","All 3 of the 3 major splanchnic vessels."],"correctIndex":0},{"stem":"What is the classic symptom pattern of chronic mesenteric ischemia?","options":["Chronic, dull, postprandial abdominal pain (\"food fear\"), anorexia, and weight loss.","Sudden, severe abdominal pain out of proportion to exam findings.","Colicky abdominal pain with currant jelly stools.","RUQ pain radiating to the right shoulder after fatty meals.","Painless bright red blood per rectum."],"correctIndex":0},{"stem":"What CT finding is characteristic of ischemic colitis?","options":["\"Thumbprinting\" (segmental bowel wall thickening/edema) and the double halo/target sign.","Pancreatic calcifications with dilated pancreatic ducts.","Free air under the diaphragm with pneumoperitoneum.","A \"bird beak\" narrowing at the gastroesophageal junction.","A dilated common bile duct with pyogenic material."],"correctIndex":0},{"stem":"What percentage of ischemic colitis cases occur in patients age 60 or older?","options":["Approximately 90%.","Approximately 50%.","Approximately 99%.","Approximately 25%.","Approximately 10%."],"correctIndex":0},{"stem":"Which type of colonic adenoma carries the highest risk of malignant transformation?","options":["Inflammatory pseudopolyp.","Tubovillous adenoma.","Hyperplastic polyp.","Villous adenoma.","Tubular adenoma."],"correctIndex":3},{"stem":"What follow-up interval is recommended after a polypectomy?","options":["A repeat colonoscopy at 10 years.","A repeat colonoscopy at 3 years.","No follow-up colonoscopy is needed.","A repeat colonoscopy at 3 months.","A repeat colonoscopy at 6 months."],"correctIndex":3},{"stem":"What is the most common histologic type of colorectal cancer?","options":["Adenocarcinoma (approximately 85% of cases).","Mucinous carcinoma (approximately 85% of cases).","Neuroendocrine tumor (approximately 85% of cases).","Squamous cell carcinoma (approximately 85% of cases).","Lymphoma (approximately 85% of cases)."],"correctIndex":0},{"stem":"At what age should average-risk patients begin colorectal cancer screening?","options":["Age 50.","Age 55.","Age 60.","Age 40.","Age 45."],"correctIndex":4},{"stem":"What gene mutation causes familial adenomatous polyposis (FAP)?","options":["The PTEN gene.","The STK11 gene.","The APC gene.","The SMAD4 gene.","The BMPR1A gene."],"correctIndex":2},{"stem":"What gene mutation causes Peutz-Jeghers syndrome, and what characteristic exam finding is associated with it?","options":["A mutation in APC; characteristic hundreds of colonic polyps.","A mutation in PTEN; characteristic macrocephaly and trichilemmomas.","A mutation in MLH1; characteristic early-onset endometrial cancer.","A mutation in SMAD4; characteristic epistaxis and telangiectasias.","A mutation in STK11 (LKB1); characteristic mucocutaneous freckling around the mouth (also hands/feet)."],"correctIndex":4}]},{"id":"l5","number":5,"title":"Liver, Gallbladder & Pancreas","week":"Week 13","filename":"Lecture 5 - Week 13 Liver, Gallbladder, Pancreas","topics":[{"name":"Hepatitis — Overview","sections":[{"label":"Definition / Etiology","bullets":[{"text":"Hepatitis = inflammation of the liver.","level":0},{"text":"Multiple etiologies: viral infection (Hep A, B, C, D, E), alcohol toxification, drug-induced (e.g., Tylenol/acetaminophen), autoimmune process.","level":0},{"text":"All causes can produce similar signs/symptoms — the diagnostic challenge is identifying the specific cause.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Early stage: fever/malaise (fever often associated with Hep A), fatigue, anorexia, nausea/vomiting/diarrhea, abdominal pain, loss of appetite.","level":0},{"text":"Later/fulminant stage: jaundice, encephalopathy, coagulopathy, hepatomegaly, ascites, asterixis (flapping hand tremor with wrist extension).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Transaminitis: elevated AST/ALT — usually >500 if acute, <500 if more chronic.","level":0},{"text":"Coagulopathy: elevated PT/INR, PTT.","level":0},{"text":"Hyperbilirubinemia.","level":0},{"text":"Hypoglycemia (from decreased hepatic gluconeogenesis).","level":0},{"text":"Elevated ammonia (can lead to encephalopathy).","level":0}]}]},{"name":"Hepatitis A","sections":[{"label":"Etiology / Epidemiology","bullets":[{"text":"RNA virus transmitted primarily via the fecal-oral route (person-to-person or cross-contamination).","level":0},{"text":"Highest incidence in developing countries.","level":0},{"text":"Risk factors: IV drug users, endemic workers, sexual relations (men who have sex with men).","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Most patients have mild, self-limited symptoms. Incubation period: ~28 days on average.","level":0},{"text":"Early: N/V/D, anorexia, fever, malaise, RUQ pain.","level":0},{"text":"Later (a few weeks after): dark urine (bilirubinuria), pale stools, jaundice, pruritus.","level":0},{"text":"Pregnant women have a high risk of pre-term/gestational complications.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Elevated AST/ALT (ALT usually higher, often 1000s+); hyperbilirubinemia.","level":0},{"text":"Serologic testing: positive IgM and anti-HAV antibodies.","level":0}]},{"label":"Treatment","bullets":[{"text":"Supportive care — usually resolves within a few months.","level":0},{"text":"Hepatitis A vaccine available: 2 doses given 6–12 months apart.","level":0}]}]},{"name":"Hepatitis E","sections":[{"label":"Etiology / Epidemiology","bullets":[{"text":"RNA virus transmitted primarily through contaminated food and water.","level":0},{"text":"Most common cause of acute viral hepatitis globally.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Most cases are self-limiting. Incubation period: 15–60 days.","level":0},{"text":"Jaundice (~5–10 days post-exposure), malaise, anorexia, nausea/vomiting, abdominal pain, fever, hepatomegaly.","level":0},{"text":"Fulminant hepatitis is rare (~1–2% of cases).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Elevated AST/ALT (ALT usually higher, often 1000+); hyperbilirubinemia.","level":0},{"text":"Serologic testing: positive IgM and anti-HEV antibodies.","level":0}]},{"label":"Treatment","bullets":[{"text":"Supportive care.","level":0},{"text":"Chronic hepatitis can develop in immunocompromised patients.","level":0}]}]},{"name":"Hepatitis D","sections":[{"label":"Etiology / Pathophysiology","bullets":[{"text":"RNA virus that requires Hepatitis B surface antigen (HBsAg) to become infectious (uses HBsAg to assemble/reproduce).","level":0},{"text":"Infectious Hep D is ALWAYS associated with Hep B infection; dual Hep B/D infection can lead to acute liver failure/chronic hepatitis.","level":0},{"text":"Usually transmitted via the parenteral route: IV drug use or blood products.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Co-infection: simultaneous Hep B (no prior exposure) + Hep D — presents as acute hepatitis, clinically indistinguishable from acute Hep B alone; typically self-limiting.","level":0},{"text":"Superinfection: Hep D infecting a patient who is an unknown chronic Hep B carrier — causes severe hepatitis or exacerbation of chronic Hep B.","level":0},{"text":"Higher incidence of liver failure/cirrhosis and higher risk of hepatocellular carcinoma.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Positive hepatitis D antigen (anti-HDV), positive serum HDV RNA, Hep B serologies.","level":0},{"text":"Positive IgM Hep B core antibody — co-infection only. HBsAg present in both co-infection and superinfection.","level":0}]},{"label":"Treatment","bullets":[{"text":"Pegylated interferon alpha-2b: can eliminate Hep D RNA in ~20–50% of patients (significant side effect profile).","level":0},{"text":"Liver transplant required for liver failure/cirrhosis.","level":0}]}]},{"name":"Hepatitis B","sections":[{"label":"Etiology","bullets":[{"text":"DNA virus transmitted via percutaneous, sexual, parenteral, or perinatal (childbirth) routes.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Malaise, fatigue, arthralgia, N/V/D, abdominal pain, jaundice (only in ~1/3 of patients), dark urine, pale stools.","level":0},{"text":"Can present in both acute and chronic phases; can progress to fulminant liver failure.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Elevated AST/ALT (1000s if acute, 100s if chronic); hyperbilirubinemia; positive HBV DNA.","level":0},{"text":"Serologies: HBsAg, anti-HBs, anti-HBc, HBeAg, anti-HBe (HBcAg itself is not detectable).","level":0},{"text":"Window period: HBsAg (–), anti-HBs (–), anti-HBc IgM (+), HBeAg (–), anti-HBe (–).","level":0},{"text":"Acute hepatitis: HBsAg (+), anti-HBs (–), anti-HBc IgM (+), HBeAg (+/–), anti-HBe (+/–).","level":0},{"text":"Resolved infection: HBsAg (–), anti-HBs (+), anti-HBc IgG (+), HBeAg (–), anti-HBe (–).","level":0},{"text":"Immunization: HBsAg (–), anti-HBs (+), anti-HBc (–), HBeAg (–), anti-HBe (–).","level":0},{"text":"Chronic hepatitis (replicative): HBsAg (+), anti-HBs (–), anti-HBc IgG (+), HBeAg (+), anti-HBe (–).","level":0},{"text":"Chronic hepatitis (non-replicative): HBsAg (+), anti-HBs (–), anti-HBc IgG (+), HBeAg (–), anti-HBe (+).","level":0}]},{"label":"Treatment","bullets":[{"text":"Most patients receive supportive care and do not progress to chronic hepatitis.","level":0},{"text":"Antiviral therapy indicated for persistent/severe symptoms, severe hyperbilirubinemia (bilirubin >10), severe transaminitis, or HBeAg persistence.","level":0},{"text":"1st line: entecavir and tenofovir. Alternatives: adefovir, telbivudine, lamivudine.","level":0},{"text":"Treatment continues until clearance of HBsAg.","level":0},{"text":"Hepatitis B vaccine available, usually given with childhood vaccinations.","level":0}]}]},{"name":"Hepatitis C","sections":[{"label":"Overview / Epidemiology","bullets":[{"text":"Single-stranded RNA virus; the most common cause of chronic liver disease and cirrhosis (leading indication for liver transplant).","level":0},{"text":"Most common transmission route: IV drug use (also sexual transmission and mother-to-neonate transmission).","level":0},{"text":"Chronic hepatitis develops in up to 85% of patients with acute Hep C, eventually leading to cirrhosis and increased hepatocellular carcinoma risk.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Incubation period: 6–7 weeks.","level":0},{"text":"Most patients remain asymptomatic until signs of cirrhosis develop (ascites, esophageal varices, portal hypertension).","level":0},{"text":"Acute hepatitis symptoms: fatigue, malaise, RUQ pain, jaundice, clay-colored stools.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"CMP: LFTs elevated (waxing and waning pattern).","level":0},{"text":"CBC with differential; PT/PTT/INR/fibrinogen.","level":0},{"text":"HCV antibodies: positive within 6 weeks, indicates acute vs. chronic infection.","level":0},{"text":"Anti-HCV without HCV RNA = past, resolved infection. Anti-HCV with HCV RNA = likely chronic hepatitis.","level":0}]},{"label":"Treatment","bullets":[{"text":"1st line: oral direct-acting antiviral regimens — high cure rate. Glecaprevir-pibrentasvir for 8 weeks, or sofosbuvir-velpatasvir for 12 weeks.","level":0},{"text":"Treatment can reactivate Hepatitis B — always screen for HBV first.","level":0},{"text":"Recheck HCV viral levels ~3 months after completing oral regimen.","level":0},{"text":"Patients with signs/symptoms of cirrhosis require close monitoring for complications, including future malignancy.","level":0}]}]},{"name":"Cirrhosis","sections":[{"label":"Definition / Etiology","bullets":[{"text":"A late stage of progressive hepatic fibrosis characterized by distortion of hepatic architecture and formation of regenerative nodules.","level":0},{"text":"Can lead to portal hypertension due to hepatic cell dysfunction and portosystemic shunting.","level":0},{"text":"Most common causes: chronic Hepatitis C, alcohol use, chronic HBV/HDV.","level":0},{"text":"Other causes: fatty liver disease, medication-induced, autoimmune hepatitis, biliary cirrhosis.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"General: fatigue, weakness, weight loss, abdominal pain.","level":0},{"text":"GI bleed from portal HTN/esophageal varices or peptic ulcers.","level":0},{"text":"PE: ascites, skin changes (spider angioma, telangiectasia), hepatosplenomegaly, gynecomastia (impaired hepatic estrogen clearance), muscle wasting, jaundice, symptoms of hepatic encephalopathy.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"US of RUQ/abdomen: nodularity with increased echogenicity, atrophy or hypertrophy of the liver.","level":0},{"text":"Elastography: measures liver stiffness — increased stiffness in cirrhosis.","level":0},{"text":"Liver biopsy: definitive diagnosis.","level":0},{"text":"CMP: elevated LFTs, hyperbilirubinemia; coagulation studies.","level":0}]},{"label":"Treatment / Prognosis","bullets":[{"text":"Survival correlates with Child-Pugh class: Class A ~100% 1-yr/85% 2-yr; Class B ~81% 1-yr/57% 2-yr; Class C ~45% 1-yr/35% 2-yr.","level":0},{"text":"Restrict alcohol, hepatotoxic medications, and sodium.","level":0},{"text":"Ascites/edema: sodium restriction, diuretics (spironolactone/furosemide), intermittent paracentesis as needed.","level":0},{"text":"Pruritus: cholestyramine (bile acid sequestrant).","level":0},{"text":"Monitor closely for GI bleeding.","level":0},{"text":"Liver transplant is the ultimate cure.","level":0}]}]},{"name":"Hepatic Encephalopathy","sections":[{"label":"Definition","bullets":[{"text":"Neuropsychiatric abnormalities resulting from the liver's failure to detoxify gut-derived agents (ammonia), due to hepatocellular dysfunction and/or portosystemic shunting.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"CNS symptoms: confusion, drowsiness, stupor, coma.","level":0},{"text":"PE: asterixis (flapping tremor with wrist extension) and fetor hepaticus (foul breath odor).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"CBC with differential; CMP (elevated LFTs, hyperbilirubinemia, low albumin); ammonia levels.","level":0},{"text":"Assess kidney function; urine drug screen; coagulation studies.","level":0},{"text":"Lactic acid/procalcitonin/blood cultures; consider CT head to rule out other causes of altered mental status; abdominal ultrasound.","level":0}]},{"label":"Treatment","bullets":[{"text":"1st line: lactulose or lactitol — lowers ammonia by acidifying the colon, converting ammonia (NH3) to ammonium (NH4+) that is then excreted.","level":0},{"text":"Rifaximin: alternative for patients who cannot tolerate lactulose.","level":0},{"text":"Nutritional/electrolyte supplementation and hydration.","level":0},{"text":"Monitor closely for recurrence; must rule out underlying infection.","level":0}]}]},{"name":"Non-Alcoholic Fatty Liver Disease (NAFLD/NASH/MASH)","sections":[{"label":"Overview / Etiology","bullets":[{"text":"A common cause of abnormal liver function tests.","level":0},{"text":"Etiologies: obesity (most common), diabetes mellitus, hyperlipidemia (high triglycerides), steroid use.","level":0},{"text":"Most patients are asymptomatic, but ~75% have hepatomegaly.","level":0}]},{"label":"Types","bullets":[{"text":"Nonalcoholic fatty liver: accumulation of triglycerides within hepatocytes, inhibiting normal liver function.","level":0},{"text":"Nonalcoholic steatohepatitis (NASH): liver cell injury and death with inflammation — can progress to fibrosis and cirrhosis. Also referred to as MASH (metabolic-associated steatohepatitis).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"CMP/coagulation studies/ammonia.","level":0},{"text":"Liver biopsy: definitive diagnosis — shows micro-vesicular fatty deposits.","level":0}]},{"label":"Treatment","bullets":[{"text":"Lifestyle modification: weight loss, fat restriction, diet/exercise.","level":0},{"text":"May require liver transplant if cirrhosis develops.","level":0},{"text":"Medical management reserved for patients with stage 2 or greater fibrosis.","level":0},{"text":"GLP-1 based therapies: semaglutide, tirzepatide, liraglutide.","level":0},{"text":"Resmetirom: alternative for stage 2–3 fibrosis when GLP-1 not tolerated — a thyroid receptor beta agonist that reduces liver fat/inflammation.","level":0},{"text":"ION224: investigational monthly injection blocking the DGAT2 liver enzyme (currently under study).","level":0}]}]},{"name":"Portal Hypertension","sections":[{"label":"Definition / Etiology","bullets":[{"text":"Increased blood pressure within the portal vein system, developing from resistance to portal blood flow and aggravated by increased collateral blood flow.","level":0},{"text":"Most common cause: cirrhosis of the liver; also portal vein thrombosis.","level":0},{"text":"In other countries: schistosomiasis (parasitic infection).","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Most patients asymptomatic until complications occur.","level":0},{"text":"Signs/symptoms: hepatosplenomegaly, ascites, jaundice, abdominal distention.","level":0},{"text":"Complications: variceal hemorrhage, portal hypertensive gastropathy, hepatic encephalopathy, spontaneous bacterial peritonitis, hepatorenal syndrome, hepatopulmonary syndrome, portal cholangiopathy.","level":0},{"text":"\"ABCDE\" mnemonic: Ascites, Bleeding (hematemesis/piles), Caput medusae, Diminished liver (atrophy), Enlarged spleen (splenomegaly).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Often diagnosed clinically.","level":0},{"text":"Hepatic venous pressure gradient (HVPG): measures pressure between the portal vein and IVC (normal 1–5 mmHg); typically clinically significant if HVPG >10 mmHg.","level":0},{"text":"US with elastography: measures liver stiffness and evaluates for other acute liver/biliary issues.","level":0}]},{"label":"Treatment","bullets":[{"text":"Management centers on treating complications (varices, encephalopathy, etc.).","level":0},{"text":"Sodium/salt restriction; diuretics (spironolactone, furosemide); intermittent paracentesis as needed.","level":0},{"text":"Beta blockers: carvedilol, propranolol, nadolol.","level":0},{"text":"TIPS (transjugular intrahepatic portosystemic shunt) — shunt placement between veins to relieve portal pressure.","level":0}]}]},{"name":"Hepatocellular Carcinoma (HCC)","sections":[{"label":"Overview / Risk Factors","bullets":[{"text":"Primary neoplasm of the liver — the most common primary liver cancer.","level":0},{"text":"Risk factors: cirrhosis (most common, especially macronodular) and associated chronic liver disease (HBV, HCV, HDV), alcoholic liver disease; men at slightly higher risk.","level":0},{"text":"Chronic hepatic inflammation → fibrosis → cirrhosis → chronic cellular damage → dysplasia → possible malignancy.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Most patients asymptomatic until disease is progressive and/or metastasis occurs.","level":0},{"text":"Malaise/weight loss, jaundice, abdominal pain, hepatosplenomegaly, ascites.","level":0}]},{"label":"Diagnostics / Screening","bullets":[{"text":"High-risk patients (cirrhosis, HBV history) undergo screening: abdominal US every 6 months.","level":0},{"text":"Lesions <1 cm on US: ongoing surveillance every 3–6 months.","level":0},{"text":"Lesions >1 cm on US: CT abdomen/pelvis with contrast or MRI with/without contrast — shows arterial enhancement with venous washout.","level":0},{"text":"Biopsy typically not required in high-risk patients meeting imaging criteria.","level":0},{"text":"Alpha-fetoprotein (AFP): elevated levels aid diagnosis and surveillance during treatment, but is non-specific (like most tumor markers).","level":0},{"text":"Liver biopsy: definitive diagnosis, reserved for cases where diagnosis is inconclusive.","level":0}]},{"label":"Treatment","bullets":[{"text":"Surgical resection: reserved for patients without cirrhosis whose tumor is confined to one lobe.","level":0},{"text":"Liver transplant: potentially curative but requires meeting strict criteria and a donor; disease cannot progress while awaiting transplant.","level":0},{"text":"Early stage/limited disease: radiofrequency ablation or microwave ablation.","level":0},{"text":"Intermediate disease: transarterial chemoembolization (TACE) — delivers chemotherapy directly to the tumor and cuts off its blood supply.","level":0},{"text":"Progressive/distant metastatic disease: systemic chemotherapy/immunotherapy ± radiation; PET/CT required to monitor for metastasis.","level":0},{"text":"1st line regimens: atezolizumab + bevacizumab, durvalumab + tremelimumab, or ipilimumab + nivolumab. Alternatives (if immunotherapy not tolerated): lenvatinib or sorafenib.","level":0},{"text":"Caution: screen for esophageal varices before starting atezolizumab + bevacizumab due to increased bleeding risk.","level":0}]}]},{"name":"Cholelithiasis","sections":[{"label":"Definition / Types","bullets":[{"text":"Presence of gallstones in the biliary tract without signs/symptoms of inflammation.","level":0},{"text":"Cholesterol stones: most common type (~90%).","level":0},{"text":"Black stones: from hemolysis or alcohol-driven liver disease.","level":0},{"text":"Brown stones: parasitic or bacterial infection, more common in Asian populations.","level":0}]},{"label":"Risk / Protective Factors","bullets":[{"text":"Risk factors: female sex, pregnancy, age, hyperlipidemia, oral contraceptives, Native American descent, DM, HRT.","level":0},{"text":"Protective factors: poly/monounsaturated fats and nuts, coffee, vegetable protein, increased physical activity, statin use.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Majority of patients with gallstones are asymptomatic.","level":0},{"text":"Biliary colic: episodes of RUQ or epigastric pain (radiating to right shoulder blade) lasting ~30 minutes to a few hours ± nausea/diaphoresis; often triggered by a large/fatty meal.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"CBC with differential and CMP, amylase/lipase.","level":0},{"text":"**1st line: abdominal/RUQ ultrasound** — gallstones appear as echogenic foci.","level":0}]},{"label":"Treatment","bullets":[{"text":"Asymptomatic gallstones (often found incidentally): monitor.","level":0},{"text":"Typical biliary colic symptoms: cholecystectomy usually recommended.","level":0},{"text":"If surgery declined, patient must be thoroughly educated on potential complications.","level":0}]}]},{"name":"Cholecystitis","sections":[{"label":"Definition / Etiology","bullets":[{"text":"Inflammation of the gallbladder, often caused by gallstones ± infectious process.","level":0},{"text":"Gallstones block bile outflow; infection can then propagate within the stagnant bile.","level":0},{"text":"Gram-negative enteric organisms most common: E. coli (MC), Klebsiella, Enterobacter.","level":0},{"text":"Develops in ~6–11% of patients with a history of gallstones.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Acute cholecystitis: syndrome of RUQ pain, fever, leukocytosis.","level":0},{"text":"Chronic cholecystitis: chronic gallbladder inflammation on histopathology from mechanical irritation by gallstones, leading to fibrosis/thickening.","level":0},{"text":"Symptoms: abdominal pain (RUQ or epigastric), fever, nausea/vomiting, anorexia.","level":0},{"text":"PE: fever, tachycardia, positive Murphy sign, palpable gallbladder, positive Boas sign (referred pain to right shoulder/subscapular area).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"CBC with differential, CMP (LFTs), amylase/lipase, lactic acid, pregnancy test, blood cultures ×2.","level":0},{"text":"**1st line: abdominal US** — gallbladder wall thickening/edema, distention, stones, positive sonographic Murphy sign.","level":0},{"text":"Radionuclide cholescintigraphy (HIDA scan): used when diagnosis unclear — shows nonvisualization of the gallbladder if the cystic duct is obstructed by a stone.","level":0}]},{"label":"Treatment","bullets":[{"text":"IV fluids, electrolyte correction, pain control (NSAIDs), antiemetics; keep patient NPO.","level":0},{"text":"Antibiotics (assume infectious etiology): metronidazole + cephalosporin (ceftriaxone, cefazolin); high-risk patients — piperacillin-tazobactam (Zosyn) or meropenem.","level":0},{"text":"Cholecystectomy preferred within 72 hours (ideally laparoscopic).","level":0},{"text":"Emergent surgery if concern for perforation or gangrene — watch for hemodynamic instability.","level":0},{"text":"High surgical risk patients: gallbladder drainage via percutaneous cholecystostomy.","level":0}]}]},{"name":"Choledocholithiasis","sections":[{"label":"Definition / Risk Factors","bullets":[{"text":"Presence of gallstones in the common bile duct with potential to cause blockage — can lead to pancreatitis or cholangitis.","level":0},{"text":"Risk factors: history of gallstones, female sex, pregnancy, age, hyperlipidemia.","level":0},{"text":"Should always be considered in symptomatic patients with a history of gallstones.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Prolonged biliary colic: RUQ/epigastric pain sustained over 6 hours, ± nausea/vomiting, anorexia.","level":0},{"text":"PE: RUQ/epigastric tenderness; jaundice (may occur if duct is obstructed).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"CBC with differential.","level":0},{"text":"CMP: elevated AST/ALT with a cholestatic pattern (elevated ALP + GGT).","level":0},{"text":"Amylase/lipase.","level":0},{"text":"Abdominal US: dilated common bile duct.","level":0},{"text":"**ERCP — diagnostic of choice** (endoscopic retrograde cholangiopancreatography).","level":0},{"text":"MRCP: less invasive alternative to visualize the biliary tract.","level":0}]},{"label":"Treatment","bullets":[{"text":"ERCP is the preferred treatment — both diagnostic and therapeutic (stone extraction).","level":0},{"text":"Cholecystectomy can also be considered.","level":0},{"text":"Additional treatment required if complications (cholangitis/pancreatitis) develop.","level":0}]}]},{"name":"Ascending Cholangitis","sections":[{"label":"Definition / Etiology","bullets":[{"text":"Biliary tract inflammation and infection due to obstruction of the common bile duct.","level":0},{"text":"Most commonly an infectious process from gram-negative organisms: E. coli (MC), Klebsiella.","level":0},{"text":"Other causes: malignancy (tumor), parasites (tapeworms).","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Symptoms: fever, chills, fatigue/malaise, rigors, abdominal pain, jaundice, pale stools (lack of bile).","level":0},{"text":"**Charcot's triad: fever with chills, RUQ pain, and jaundice.**","level":0},{"text":"**Reynolds' pentad: Charcot's triad + hypotension (shock) + altered mental status.**","level":0},{"text":"PE: fever, hypotension, RUQ pain, abdominal distention, altered mental status.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"CBC with differential: leukocytosis with left shift.","level":0},{"text":"CMP: elevated LFTs (cholestasis — elevated ALP/GGT), hyperbilirubinemia (conjugated), elevated ammonia.","level":0},{"text":"Coagulation studies (prolonged PT/PTT/INR); lactic acid, procalcitonin; blood cultures ×2.","level":0},{"text":"Abdominal/RUQ US: initial test of choice — common bile duct dilation or stones, bile duct wall thickening, pyogenic material.","level":0},{"text":"CT scan if US non-conclusive.","level":0},{"text":"**Cholangiography (ERCP) — gold standard**; perc
