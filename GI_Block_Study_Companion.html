ectIndex":2,"explanations":["Esophagectomy is not the described management for an EoE-related stricture.","Balloon tamponade is used for variceal bleeding, not esophageal stricture management.","Correct — endoscopic dilation is indicated when strictures or narrowing complicate eosinophilic esophagitis.","Ganciclovir treats CMV infection, unrelated to EoE.","Cricopharyngeal myotomy treats Zenker diverticulum, not an EoE stricture."],"topic":"Esophagitis Subtypes"},{"stem":"A patient with chronic, persistent epithelial injury from long-standing acid reflux develops progressive solid-food dysphagia. Endoscopy reveals a smooth, circumferential narrowing of the distal esophagus. Which sequence of events best explains this finding?","options":["Direct bacterial invasion of the muscularis propria","Autoantibody-mediated destruction of the myenteric plexus","Persistent injury leading to inflammation, fibroblast activation, and collagen remodeling that narrows the lumen","Acute allergic reaction causing mucosal edema alone","Sudden vascular occlusion of the esophageal wall"],"correctIndex":2,"explanations":["Bacterial invasion is not the described mechanism of stricture formation.","This describes a neurodegenerative process (relevant to achalasia), not the fibrotic stricture mechanism described here.","Correct — persistent epithelial injury leads to inflammation, fibroblast activation, and collagen remodeling, progressively narrowing the lumen.","This does not reflect the chronic, progressive pathophysiology described for stricture formation.","Vascular occlusion is not the mechanism described for chronic peptic stricture formation."],"topic":"Strictures/Rings&Webs"},{"stem":"A patient with dysphagia is found to have a thin, circumferential mucosal ring at the gastroesophageal junction, associated with episodic solid food dysphagia that patients often describe occurring while eating steak at a restaurant. What is the most appropriate treatment?","options":["Dilation","Long-term antiviral therapy","Cricopharyngeal myotomy","Emergent esophagectomy","Octreotide infusion"],"correctIndex":0,"explanations":["Correct — a Schatzki ring causing intermittent solid dysphagia (\\\"steakhouse syndrome\\\") is treated with dilation.","Antiviral therapy is not indicated for this structural finding.","Cricopharyngeal myotomy is the treatment for Zenker diverticulum, not this ring.","Esophagectomy is not indicated for a benign mucosal ring.","Octreotide is used for variceal bleeding, unrelated to this presentation."],"topic":"Strictures/Rings&Webs"},{"stem":"A young woman with iron deficiency anemia reports intermittent solid food dysphagia. Evaluation reveals a thin, cervical esophageal mucosal membrane. Which underlying syndrome should be considered, and what is the appropriate management?","options":["Mallory-Weiss syndrome; supportive care","Zollinger-Ellison syndrome; high-dose PPI therapy","Plummer-Vinson syndrome; dilation plus treatment of the iron deficiency","Boerhaave syndrome; emergent surgery","Zenker syndrome; cricopharyngeal myotomy"],"correctIndex":2,"explanations":["Mallory-Weiss syndrome involves a mucosal tear from retching, unrelated to webs.","Zollinger-Ellison syndrome relates to gastrin-secreting tumors and ulcers, not webs and anemia.","Correct — esophageal webs associated with iron deficiency anemia suggest Plummer-Vinson syndrome, managed with dilation plus correction of the iron deficiency.","Boerhaave syndrome is a full-thickness esophageal perforation, unrelated to this presentation.","Zenker syndrome/diverticulum presents with oropharyngeal dysphagia and regurgitation of undigested food, not this pattern."],"topic":"Strictures/Rings&Webs"},{"stem":"A 45-year-old woman presents with several months of progressive dysphagia to both solids and liquids, regurgitation of undigested food, and nocturnal cough. Barium swallow reveals a dilated proximal esophagus that tapers to a narrow point at the gastroesophageal junction. Which pathophysiologic process best explains this presentation?","options":["Acute mucosal laceration from repeated vomiting","Infection of the esophageal mucosa by a fungal organism","Degeneration of inhibitory myenteric neurons leading to loss of nitric oxide and unopposed cholinergic tone at the LES","Extrinsic compression from a mediastinal mass","Chronic acid-mediated fibrosis of the distal esophagus"],"correctIndex":2,"explanations":["This describes a Mallory-Weiss tear, an acute event, not a chronic progressive process.","This describes infectious (Candida) esophagitis, not a motility disorder.","Correct — this describes achalasia, caused by degeneration of inhibitory neurons, loss of NO, and unopposed cholinergic activity causing incomplete LES relaxation.","This describes pseudoachalasia from secondary obstruction, which is a distinct and less common cause with a different demographic profile than this chronic, gradual presentation.","This describes peptic stricture, which classically causes progressive dysphagia to solids only, not solids and liquids together with this radiographic pattern."],"topic":"Motility Disorders"},{"stem":"A patient with suspected achalasia undergoes barium swallow showing a dilated esophagus with distal tapering. Which test is considered the gold standard to confirm the diagnosis?","options":["High-resolution manometry","Ambulatory pH monitoring","Abdominal ultrasound","CT chest without contrast","EGD alone"],"correctIndex":0,"explanations":["Correct — high-resolution manometry is the gold standard for diagnosing achalasia.","pH monitoring quantifies reflux, not motility abnormalities like achalasia.","Abdominal ultrasound is not used to diagnose esophageal motility disorders.","CT chest is not the gold standard diagnostic test for achalasia.","EGD is used to exclude an obstructing tumor but is not the gold standard for diagnosing achalasia itself."],"topic":"Motility Disorders"},{"stem":"A patient with confirmed achalasia is not considered a good surgical candidate due to multiple comorbidities. Which treatment option is most appropriate for this patient?","options":["Antiviral therapy","Heller myotomy","Immediate esophagectomy","Long-term proton pump inhibitor therapy alone","Peroral endoscopic myotomy (POEM)"],"correctIndex":4,"explanations":["Antiviral therapy has no role in achalasia management.","Heller myotomy is a surgical procedure, less appropriate for a poor surgical candidate.","Esophagectomy is described as a last resort, not the appropriate initial option here.","PPI therapy alone does not address the underlying motor disorder in achalasia.","Correct — POEM is an option for achalasia patients who are not good surgical candidates."],"topic":"Motility Disorders"},{"stem":"A patient reports episodic chest pain and dysphagia to both solids and liquids, often triggered by very hot or cold liquids. Manometry shows normal esophagogastric junction relaxation but premature contractions in at least 20% of swallows. Which condition is most consistent with these findings?","options":["Zenker diverticulum","Diffuse esophageal spasm","Boerhaave syndrome","Achalasia","Eosinophilic esophagitis"],"correctIndex":1,"explanations":["Zenker diverticulum presents with oropharyngeal symptoms, not this pattern of chest pain and manometric findings.","Correct — diffuse esophageal spasm shows preserved EGJ relaxation with premature contractions on manometry, along with the described symptom triggers.","Boerhaave syndrome is an acute perforation, not a chronic motility disorder.","Achalasia is characterized by impaired, not normal, LES/EGJ relaxation.","EoE is diagnosed by endoscopic/histologic findings, not this manometric pattern."],"topic":"Motility Disorders"},{"stem":"A patient with diffuse esophageal spasm is being started on medical therapy. Before initiating smooth muscle relaxants such as calcium channel blockers or nitrates, which condition should first be excluded given the overlapping symptom of episodic chest pain?","options":["Cardiac disease","Pill-induced esophagitis","Barrett esophagus","Eosinophilic esophagitis","Esophageal web"],"correctIndex":0,"explanations":["Correct — cardiac disease should be excluded first given the overlapping presentation of episodic chest pain.","Pill-induced esophagitis is not the described condition requiring exclusion before treating DES.","Barrett esophagus is not a diagnosis requiring exclusion prior to DES treatment.","EoE does not need to be excluded before starting smooth muscle relaxants for DES.","An esophageal web is not the condition that must be excluded before treating DES."],"topic":"Motility Disorders"},{"stem":"A barium swallow performed for suspected diffuse esophageal spasm shows a characteristic radiographic appearance. Which description matches this finding?","options":["Bird beak narrowing at the gastroesophageal junction","String sign of the pyloric channel","Corkscrew appearance of the esophagus","Target sign in the right lower quadrant","Stovepipe appearance of the colon"],"correctIndex":2,"explanations":["Bird beak narrowing is the classic finding in achalasia, not DES.","A string sign refers to a different structure entirely and is not an esophageal motility finding discussed in this lecture.","Correct — a corkscrew appearance on barium swallow is characteristic of diffuse esophageal spasm.","A target sign is an ultrasound finding for intussusception, unrelated to esophageal motility.","A stovepipe appearance is unrelated to esophageal motility disorders discussed in this lecture."],"topic":"Motility Disorders"},{"stem":"A patient has manometric findings showing excessive, vigorous esophageal contractions without evidence of impaired LES relaxation or premature contractions meeting criteria for spasm. According to the lecture, how should this condition primarily be managed?","options":["With emergent surgical myotomy in all cases","With balloon tamponade","Based on manometry numbers alone, regardless of symptoms","With IV antibiotics","Based on the patient's symptoms rather than manometry numbers alone"],"correctIndex":4,"explanations":["Emergent surgery is not the described first-line approach for this condition.","Balloon tamponade is used for variceal bleeding, unrelated to this condition.","The lecture specifically states to treat based on symptoms rather than manometry numbers.","Antibiotics have no role in this motility disorder.","Correct — hypercontractile esophagus should be treated based on symptoms rather than manometry values alone."],"topic":"Motility Disorders"},{"stem":"A 70-year-old man presents with rapidly progressive dysphagia, marked weight loss over just a few weeks, and regurgitation. Barium swallow shows findings resembling achalasia, but his age and rate of symptom progression raise concern for a different underlying process. What is the most likely explanation?","options":["Diffuse esophageal spasm","Idiopathic achalasia from primary neuronal degeneration","Pseudoachalasia from a secondary obstruction such as malignancy","Eosinophilic esophagitis","Mallory-Weiss tear"],"correctIndex":2,"explanations":["DES preserves LES relaxation and does not classically produce this rapidly progressive, achalasia-mimicking picture.","Idiopathic achalasia typically has a more gradual course rather than rapid progression with marked weight loss and older age at onset.","Correct — rapid symptom progression, marked weight loss, and older age suggest pseudoachalasia from a secondary obstruction such as malignancy or extrinsic compression.","EoE typically presents in a younger, atopic population with food impaction rather than this rapidly progressive pattern.","A Mallory-Weiss tear is an acute mucosal laceration, not a chronic progressive dysphagia syndrome."],"topic":"Motility Disorders"},{"stem":"A 78-year-old woman presents with regurgitation of undigested food hours after eating, halitosis, and coughing after meals. She also reports difficulty initiating swallows. Which anatomic structure is the diverticulum most likely forming through?","options":["Ligament of Treitz","Killian's triangle","Ampulla of Vater","Angle of His","Meissner plexus"],"correctIndex":1,"explanations":["The ligament of Treitz is unrelated to this presentation.","Correct — Zenker diverticulum forms through Killian's triangle due to cricopharyngeal dysfunction.","The ampulla of Vater is unrelated to esophageal diverticulum formation.","The angle of His contributes to LES competency, not diverticulum formation.","Meissner plexus is a nerve plexus, not an anatomic space where diverticula form."],"topic":"Zenker Diverticulum"},{"stem":"A patient with suspected Zenker diverticulum is being evaluated. Which diagnostic study is most appropriate, and which intervention is contraindicated until the diagnosis is confirmed or excluded?","options":["Colonoscopy; bowel prep should be avoided","Barium swallow; blind nasogastric tube or endoscope passage should be performed with caution","CT angiography; no precautions needed","HIDA scan; no precautions needed","Esophageal manometry; PPI should be avoided"],"correctIndex":1,"explanations":["Colonoscopy is unrelated to this pharyngoesophageal condition.","Correct — barium swallow is the diagnostic study of choice, and instrumentation should be performed cautiously given perforation risk with an unrecognized diverticulum.","CT angiography is not the described diagnostic study for Zenker diverticulum.","A HIDA scan evaluates gallbladder function, unrelated to Zenker diverticulum.","Manometry is not the primary diagnostic test for Zenker diverticulum."],"topic":"Zenker Diverticulum"},{"stem":"A patient diagnosed with symptomatic Zenker diverticulum is being counseled on treatment options. What is the definitive treatment?","options":["Broad-spectrum IV antibiotics alone","Cricopharyngeal myotomy","Balloon tamponade","Octreotide infusion","Lifelong PPI therapy"],"correctIndex":1,"explanations":["Antibiotics alone do not treat the underlying anatomic/motility defect.","Correct — cricopharyngeal myotomy is the treatment for Zenker diverticulum.","Balloon tamponade is used for variceal bleeding, unrelated to this condition.","Octreotide is used for variceal bleeding, unrelated to Zenker diverticulum.","PPI therapy does not address the underlying cricopharyngeal dysfunction causing Zenker diverticulum."],"topic":"Zenker Diverticulum"},{"stem":"A patient presents with coffee-ground emesis and melena. Laboratory studies reveal a disproportionately elevated BUN relative to creatinine. Which mechanism best explains this laboratory pattern in the setting of GI bleeding?","options":["Direct renal tubular injury from blood loss","Decreased hepatic urea synthesis","Increased urea production from digested blood protein combined with relative hypovolemia","Excess dietary protein intake unrelated to bleeding","Acute pancreatitis affecting renal clearance"],"correctIndex":2,"explanations":["Direct renal tubular injury is not the mechanism described for this classic laboratory finding.","Decreased urea synthesis would lower, not raise, BUN.","Correct — digestion and absorption of blood protein along with relative hypovolemia contribute to an elevated BUN-to-creatinine ratio in upper GI bleeding.","This laboratory pattern is specifically linked to GI bleeding, not incidental dietary intake.","Pancreatitis is not the mechanism described for this finding in the context of GI bleeding."],"topic":"UGIB/Mallory-Weiss/Boerhaave"},{"stem":"A patient presenting with an upper GI bleed is being risk-stratified for potential outpatient management. Which describes the appropriate initial transfusion approach according to lecture?","options":["Use a hemoglobin threshold of 7 g/dL for most patients, transfusing earlier if actively bleeding","Transfuse all patients regardless of hemoglobin level","Avoid transfusion entirely in upper GI bleeding","Never transfuse until hemoglobin falls below 5 g/dL","Transfuse only after endoscopy is completed"],"correctIndex":0,"explanations":["Correct — a hemoglobin threshold of 7 g/dL is used for most patients, with earlier transfusion if actively bleeding.","Universal transfusion regardless of hemoglobin is not the described approach.","Transfusion has a clear role in appropriately selected patients with GI bleeding.","Waiting until hemoglobin falls below 5 g/dL is lower than the described threshold.","Transfusion should be based on hemodynamic status and hemoglobin level, not strictly timed after endoscopy."],"topic":"UGIB/Mallory-Weiss/Boerhaave"},{"stem":"A patient with an upper GI bleed undergoes endoscopy, and the endoscopist identifies a bleeding vessel. According to lecture, which approach to endoscopic hemostasis is most appropriate?","options":["Epinephrine injection alone is sufficient in all cases","No endoscopic therapy is needed if PPI has been started","Clips alone are contraindicated","Thermal therapy should never be combined with injection","Epinephrine injection combined with a second modality such as thermal therapy or clips"],"correctIndex":4,"explanations":["Epinephrine alone should never be used without a second modality.","Endoscopic therapy remains important even with PPI started, particularly for high-risk lesions.","Clips are an appropriate second modality, not contraindicated.","Combining thermal therapy with injection is an appropriate and described approach.","Correct — epinephrine injection should always be combined with a second modality, such as thermal therapy or clips."],"topic":"UGIB/Mallory-Weiss/Boerhaave"},{"stem":"A 26-year-old man presents with hematemesis after several episodes of forceful retching following a night of heavy alcohol use. Endoscopy reveals a longitudinal mucosal laceration near the gastroesophageal junction without evidence of full-thickness perforation. What is the most appropriate initial management?","options":["Octreotide plus antibiotics as first-line therapy","Balloon tamponade as first-line therapy","Emergent surgical repair","Supportive care and PPI, with endoscopic clipping or thermal therapy if actively bleeding","Observation only, with no medical or endoscopic therapy"],"correctIndex":3,"explanations":["Octreotide plus antibiotics is the described approach for variceal bleeding, not Mallory-Weiss tears.","Balloon tamponade is used for variceal bleeding, not first-line for Mallory-Weiss tears.","Emergent surgery is not the described initial management for this mucosal-only injury.","Correct — Mallory-Weiss tears are managed with supportive care and PPI, with endoscopic clipping or thermal therapy if actively bleeding.","Some intervention (supportive care/PPI, possible endoscopic therapy) is indicated rather than pure observation."],"topic":"UGIB/Mallory-Weiss/Boerhaave"},{"stem":"A patient with a history of repeated forceful vomiting develops sudden severe chest pain, and imaging reveals mediastinal air with signs of mediastinitis. How does this presentation differ from a Mallory-Weiss tear in terms of underlying pathology?","options":["It represents a full-thickness esophageal perforation, unlike the mucosal-only Mallory-Weiss tear","It is a chronic process rather than an acute event","It is caused by a viral infection rather than a mechanical injury","It occurs only in the stomach, not the esophagus","It represents a mucosal-only laceration, same as Mallory-Weiss tear"],"correctIndex":0,"explanations":["Correct — Boerhaave syndrome is a full-thickness esophageal tear/perforation, in contrast to the mucosal-only laceration of a Mallory-Weiss tear.","This is an acute GI emergency, not a chronic process.","This is a mechanical injury from a pressure event, not an infection.","This occurs in the esophagus, not isolated to the stomach.","This describes Boerhaave syndrome, which is a full-thickness injury, distinct from the mucosal-only Mallory-Weiss tear."],"topic":"UGIB/Mallory-Weiss/Boerhaave"},{"stem":"A patient with newly diagnosed cirrhosis is being evaluated for potential complications. According to the lecture, what screening test should be performed, and why?","options":["Colonoscopy, to screen for colorectal cancer","DEXA scan, to screen for osteoporosis","Capsule endoscopy, to screen for small bowel bleeding","EGD, to screen for esophageal varices","MRCP, to screen for biliary strictures"],"correctIndex":3,"explanations":["Colonoscopy is not the described screening test for newly diagnosed cirrhosis in this lecture.","DEXA scan is not the described screening recommendation in this lecture.","Capsule endoscopy is not the described screening recommendation for cirrhosis in this lecture.","Correct — EGD is recommended in newly diagnosed cirrhotic patients to screen for esophageal varices given rupture risk.","MRCP is not the described screening recommendation for cirrhosis in this lecture."],"topic":"Esophageal Varices"},{"stem":"A patient with cirrhosis and known esophageal varices is being started on medication for primary prophylaxis against variceal hemorrhage. Which class of medication is most appropriate?","options":["Calcium channel blockers","ACE inhibitors","Proton pump inhibitors alone","Nonselective beta blockers","Loop diuretics alone"],"correctIndex":3,"explanations":["Calcium channel blockers are not the described prophylactic class for variceal bleeding in this lecture.","ACE inhibitors are not the described prophylactic class for variceal bleeding.","PPIs alone do not address portal hypertension for primary prophylaxis.","Correct — nonselective beta blockers (propranolol, nadolol, carvedilol) are used for primary prophylaxis against variceal bleeding.","Loop diuretics alone do not provide primary prophylaxis against variceal hemorrhage."],"topic":"Esophageal Varices"},{"stem":"A patient with known cirrhosis presents with active hematemesis concerning for variceal hemorrhage. In addition to resuscitation with IV fluids and possible transfusion, which two categories of medical therapy should be started at presentation?","options":["An antifungal and an antiemetic","A vasoactive agent such as octreotide and prophylactic antibiotics such as ceftriaxone","A statin and an ACE inhibitor","An anticoagulant and a diuretic","A beta blocker and an antiplatelet agent"],"correctIndex":1,"explanations":["Antifungals and antiemetics are not the primary therapies described for acute variceal hemorrhage.","Correct — octreotide (a vasoactive agent) and prophylactic antibiotics such as ceftriaxone should be started at presentation for suspected variceal hemorrhage.","Statins and ACE inhibitors are not the described therapies for acute variceal hemorrhage.","Anticoagulation and diuretics are not the described acute therapies for active variceal hemorrhage.","Beta blockers are used for primary prophylaxis, not typically the acute agent started for active hemorrhage in this framework, and antiplatelet agents are not indicated."],"topic":"Esophageal Varices"},{"stem":"A patient with active variceal hemorrhage is hemodynamically unstable despite resuscitation, and endoscopy cannot be performed immediately. Which intervention can be used to temporize the bleeding while preparing for definitive therapy?","options":["Balloon tamponade (Blakemore-Sengstaken tube)","Colonoscopy","Oral fluconazole","Cricopharyngeal myotomy","Long-term beta blocker initiation"],"correctIndex":0,"explanations":["Correct — balloon tamponade can temporize active variceal hemorrhage while preparing for emergent EGD.","Colonoscopy evaluates the lower GI tract, not the source of esophageal variceal bleeding.","Fluconazole treats Candida esophagitis, unrelated to variceal hemorrhage.","Cricopharyngeal myotomy treats Zenker diverticulum, unrelated to variceal bleeding.","Beta blockers are for prophylaxis, not for temporizing active hemorrhage in an unstable patient."],"topic":"Esophageal Varices"},{"stem":"A 50-year-old man presents with epigastric burning pain that improves with eating but recurs 2 to 3 hours later, along with pain that sometimes wakes him at night. Which condition and mechanism best explain this pattern?","options":["Boerhaave syndrome, due to esophageal perforation","Gastric ulcer, due to postprandial pain from delayed gastric emptying","Eosinophilic esophagitis, due to eosinophilic infiltration","Achalasia, due to impaired LES relaxation","Duodenal ulcer, due to circadian acid secretion causing pain as the stomach empties"],"correctIndex":4,"explanations":["Boerhaave syndrome is an acute perforation event, not a chronic recurring pain pattern.","A gastric ulcer classically causes postprandial pain, nausea, vomiting, and weight loss, not the pattern of improvement with eating described here.","EoE causes dysphagia and food impaction, not this pain pattern.","Achalasia causes dysphagia and regurgitation, not this classic ulcer pain pattern.","Correct — duodenal ulcer pain classically improves with eating and recurs 2–3 hours later, with nocturnal pain related to circadian acid secretion."],"topic":"Peptic Ulcer Disease"},{"stem":"Which combination of causes accounts for the great majority of peptic ulcer disease cases according to the lecture?","options":["Viral infection and radiation injury","Excess bicarbonate secretion and low pepsin activity","Eosinophilic infiltration and food allergy","H. pylori infection and NSAID/aspirin use","Autoimmune destruction and congenital webs"],"correctIndex":3,"explanations":["Viral infection and radiation injury are not identified as the major causes of PUD in this lecture.","Excess bicarbonate and low pepsin activity would be protective, not causative.","Eosinophilic infiltration and food allergy describe EoE, not PUD.","Correct — H. pylori and NSAIDs/aspirin are identified as the leading causes of peptic ulcer disease.","Autoimmune destruction and congenital webs are not described as PUD causes in this lecture."],"topic":"Peptic Ulcer Disease"},{"stem":"A patient with a duodenal ulcer confirmed on biopsy is being tested for H. pylori using a urea breath test. Which pretest consideration is essential to avoid a false-negative result?","options":["No medication adjustment is needed prior to this test","The test should be performed while the patient is fasting for 24 hours only, with no medication restrictions","The patient should be on a PPI for at least 4 weeks prior to testing","The patient should discontinue PPI therapy for at least 4 weeks prior to testing","The patient must be off all food for one week prior to testing"],"correctIndex":3,"explanations":["Medication timing is an essential pretest consideration for accurate results.","Medication restriction, not just fasting, is the key consideration described in lecture.","Being on a PPI at the time of testing increases the risk of a false-negative result.","Correct — PPIs should be discontinued for at least 4 weeks prior to noninvasive H. pylori testing to avoid a false-negative result.","A full week without food is not the described requirement; PPI discontinuation for 4 weeks is the key point."],"topic":"Peptic Ulcer Disease"},{"stem":"A patient is diagnosed with H. pylori-associated duodenal ulcer disease and started on quadruple therapy. Which regimen matches what is described in lecture?","options":["A single dose of azithromycin plus antacids","A PPI twice daily plus bismuth, tetracycline, and metronidazole, each dosed four times daily, for 14 days","A PPI once daily plus a single antibiotic for 5 days","A PPI plus amoxicillin only, for 3 days","H2 blocker alone for 6 weeks"],"correctIndex":1,"explanations":["This does not match the described regimen for H. pylori eradication.","Correct — quadruple therapy in this lecture consists of PPI BID, bismuth, tetracycline 500 mg, and metronidazole 500 mg, each four times daily, for 14 days.","This regimen does not match the described quadruple therapy in dosing or duration.","This regimen does not match the described combination or duration for eradication therapy.","H2 blocker monotherapy does not eradicate H. pylori."],"topic":"Peptic Ulcer Disease"},{"stem":"After completing a 14-day course of quadruple therapy for H. pylori, a patient asks when eradication should be confirmed and with what test. Based on the lecture, which answer is correct?","options":["During therapy, using EGD with biopsy only","There is no need to confirm eradication after treatment","Immediately after completing therapy, using a serum antibody test","One week after starting therapy, using stool culture","At least 4 weeks after completing PPI and antibiotics, using a repeat urea breath test"],"correctIndex":4,"explanations":["EGD with biopsy during therapy is not the described confirmatory approach in this lecture.","Confirmation of eradication is explicitly recommended in this lecture.","Serum antibody testing is not the described confirmatory test, and immediate post-treatment testing risks false results.","One week after starting therapy is too early and does not match the described timing.","Correct — eradication should be confirmed with a repeat urea breath test at least 4 weeks after completing PPI and antibiotics."],"topic":"Peptic Ulcer Disease"},{"stem":"A patient with a posterior duodenal ulcer develops sudden hematemesis and hypotension. Based on the anatomic relationships discussed in lecture, which structure has most likely been eroded into?","options":["Portal vein","Splenic artery","Inferior mesenteric artery","Common bile duct","Gastroduodenal artery"],"correctIndex":4,"explanations":["The portal vein is not the classically described structure eroded by a posterior duodenal ulcer in this lecture.","The splenic artery is more classically associated with erosion from a posterior gastric ulcer, not a posterior duodenal ulcer.","The IMA is not anatomically related to posterior duodenal ulcer erosion.","The common bile duct is not the vessel described as being eroded by a posterior duodenal ulcer.","Correct — posterior duodenal ulcers can erode into the gastroduodenal artery, causing massive hemorrhage."],"topic":"Peptic Ulcer Disease"},{"stem":"A patient with a peptic ulcer develops sudden, severe abdominal pain with a rigid abdomen, and imaging reveals free air under the diaphragm. Which complication has occurred?","options":["Perforation","Penetration into the pancreas","Bleeding without perforation","Malignant transformation","Gastric outlet obstruction"],"correctIndex":0,"explanations":["Correct — sudden severe pain with free air under the diaphragm indicates perforation.","Penetration into the pancreas would not classically cause free air under the diaphragm.","Bleeding alone would not classically produce free intraperitoneal air.","Malignant transformation is not an acute complication presenting this way.","Gastric outlet obstruction presents with nausea, vomiting, and early satiety, not free air and a rigid abdomen."],"topic":"Peptic Ulcer Disease"},{"stem":"Which patient characteristic increases the risk of NSAID-induced peptic ulcer complications, warranting consideration of a COX-2 selective agent plus PPI co-therapy if NSAIDs cannot be discontinued?","options":["A single prior episode of heartburn with no ulcer history","Concomitant corticosteroid or anticoagulant use","Isolated seasonal allergies","Age under 40 with no other risk factors","Regular moderate exercise"],"correctIndex":1,"explanations":["A single episode of heartburn without ulcer history is not the described high-risk profile.","Correct — concomitant use of corticosteroids, anticoagulants, antiplatelets, or SSRIs increases NSAID-related ulcer risk, warranting a COX-2 agent plus PPI if NSAIDs must continue.","Seasonal allergies are not a described risk factor for NSAID-induced ulcers.","Younger age without other risk factors is not the described high-risk profile.","Exercise is not a described risk factor for NSAID-induced ulcer complications."],"topic":"Peptic Ulcer Disease"},{"stem":"A 55-year-old woman presents with epigastric pain, nausea, and early satiety. Endoscopy identifies a gastric ulcer. Compared to duodenal ulcers, what is a key management distinction for this gastric ulcer, based on lecture?","options":["The ulcer should be biopsied at its edge to rule out malignancy, unlike most duodenal ulcers","It cannot be treated with PPI therapy","No biopsy is needed since gastric ulcers are always benign","It requires immediate surgery regardless of severity","It requires no acid suppression therapy"],"correctIndex":0,"explanations":["Correct — gastric ulcers should be biopsied at the ulcer edge to rule out malignancy, a distinction from most duodenal ulcers, which rarely require biopsy.","PPI therapy is a mainstay of treatment for gastric ulcers.","Gastric ulcers are not assumed to be benign and require biopsy to exclude malignancy.","Immediate surgery is not the default approach for an uncomplicated gastric ulcer.","Acid suppression with PPI remains a mainstay of therapy regardless of ulcer location."],"topic":"Peptic Ulcer Disease"},{"stem":"A 50-year-old woman presents with chronic cough, hoarseness, and recurrent throat clearing but denies typical heartburn or regurgitation. Her clinician is considering GERD as a possible cause. What is the most appropriate next step according to the lecture's guidance on extra-esophageal symptoms?","options":["Rule out pulmonary, ENT, and allergy causes before attributing symptoms to GERD","Diagnose Zenker diverticulum based on these symptoms alone","Order esophageal manometry as the first test","Proceed directly to Nissen fundoplication","Immediately start high-dose PPI without further evaluation"],"correctIndex":0,"explanations":["Correct — the lecture explicitly advises ruling out pulmonary, ENT, and allergy causes before attributing extra-esophageal symptoms to GERD.","These symptoms alone do not indicate Zenker diverticulum, which classically presents with oropharyngeal dysphagia, regurgitation of undigested food, and halitosis.","Manometry is not described as the first step for evaluating these atypical extra-esophageal symptoms.","Surgery would not be considered before a diagnosis is confirmed.","The lecture cautions against assuming GERD explains atypical symptoms without first excluding other causes."],"topic":"GERD"},{"stem":"A clinician is comparing the underlying mechanism of GERD-related symptoms with those of eosinophilic esophagitis in a patient with intermittent solid food dysphagia. Which distinction most accurately differentiates the two conditions, according to this lecture's high-yield comparisons?","options":["GERD only affects children, while EoE only affects adults","There is no meaningful clinical distinction between the two conditions","GERD causes eosinophilic infiltration, while EoE causes acid reflux","GERD typically presents with heartburn/regurgitation, while EoE typically presents with food impaction/intermittent solid dysphagia","GERD is diagnosed by manometry, while EoE is diagnosed by pH monitoring"],"correctIndex":3,"explanations":["Both conditions can occur across age groups; this is not the distinguishing feature described.","The lecture explicitly draws this clinical distinction between the two conditions.","This reverses the correct pathophysiology of each condition.","Correct — GERD classically presents with heartburn/regurgitation, while EoE classically presents with food impaction and intermittent solid food dysphagia.","Neither condition is diagnosed primarily by these methods in this comparison."],"topic":"Esophagitis Subtypes"}],"mcQuestions":[{"stem":"What does progressive dysphagia to solids only (initially), later progressing to liquids, suggest?","options":["A normal variant requiring no evaluation.","A purely psychiatric cause requiring no further workup.","An oropharyngeal cause — e.g., stroke or myasthenia gravis.","A motility disorder — e.g., achalasia or diffuse esophageal spasm.","A mechanical/structural cause — e.g., peptic stricture, Schatzki ring, eosinophilic esophagitis, or malignancy."],"correctIndex":4},{"stem":"What does dysphagia to both solids and liquids from the onset suggest?","options":["An infectious cause — e.g., Candida esophagitis alone.","A mechanical/structural cause — e.g., peptic stricture or malignancy.","A motility disorder — e.g., achalasia or diffuse esophageal spasm.","A vascular cause — e.g., aortic aneurysm compression.","A normal variant requiring no evaluation."],"correctIndex":2},{"stem":"Per ASGE guidance, what combination of symptoms in a GERD patient warrants an EGD?","options":["GERD plus a normal physical exam and no additional symptoms.","GERD plus a family history of hypertension.","GERD plus mild, intermittent heartburn only.","GERD plus dysphagia, odynophagia, weight loss, bleeding, vomiting, or unexplained iron-deficiency anemia.","GERD plus occasional postprandial bloating."],"correctIndex":3},{"stem":"What are the three components of the anti-reflux barrier?","options":["The angle of His, gastric emptying rate, and mucus production.","LES pressure, the UES, and gastric acid secretion.","Pyloric sphincter tone, bile flow, and intragastric pressure.","Peristalsis, saliva production, and gravity alone.","LES pressure, the crural diaphragm, and the intra-abdominal esophageal segment."],"correctIndex":4},{"stem":"What is the gold standard test for esophageal motility disorders?","options":["Barium esophagram.","High-resolution manometry.","CT chest with contrast.","Ambulatory pH monitoring.","EGD alone."],"correctIndex":1},{"stem":"What are the three common phenotypes of GERD?","options":["Acute, subacute, and chronic reflux, based on duration.","Functional, structural, and infectious reflux.","Mild, moderate, and severe reflux, based on symptom frequency.","Type 1, Type 2, and Type 3 reflux, based on hiatal hernia size.","Non-erosive reflux, erosive esophagitis, and Barrett's esophagus."],"correctIndex":4},{"stem":"What lifestyle modifications are recommended as initial GERD management?","options":["Increasing meal frequency, lying flat after eating, and increasing caffeine intake.","Increasing alcohol intake and eating larger meals before bedtime.","Weight gain, elevating the foot of the bed, and increasing spicy food intake.","Fasting for 12 hours daily and avoiding all fiber intake.","Weight reduction if obese, elevating the head of bed, avoiding meals 2–3 hours before bedtime, avoiding acidic/spicy foods, and tobacco cessation."],"correctIndex":4},{"stem":"What are three long-term risks of PPI therapy?","options":["Hyperkalemia, decreased iron absorption, and hepatotoxicity.","Hypermagnesemia, increased B12 absorption, and increased bone density.","Hypernatremia, increased folate absorption, and ototoxicity.","Hypomagnesemia, decreased B12 absorption, and decreased bone density.","Hypoglycemia, decreased calcium absorption, and nephrotoxicity."],"correctIndex":3},{"stem":"What is the progression sequence of Barrett's esophagus to cancer?","options":["Intestinal metaplasia → low-grade dysplasia → high-grade dysplasia → intramucosal adenocarcinoma → invasive adenocarcinoma.","Squamous hyperplasia → dysplasia → squamous cell carcinoma.","High-grade dysplasia → low-grade dysplasia → intestinal metaplasia → invasive adenocarcinoma.","Intestinal metaplasia → invasive adenocarcinoma directly, with no intermediate dysplasia.","Chronic gastritis → atrophic gastritis → intestinal metaplasia → gastric adenocarcinoma."],"correctIndex":0},{"stem":"What are the high-risk demographic factors for Barrett's esophagus screening?","options":["Male sex, age >50, White race, tobacco use, obesity, and a first-degree relative with Barrett's or esophageal malignancy.","Female sex, age <30, Asian race, and a history of celiac disease.","Male sex, age <40, and a history of H. pylori infection only.","Male sex, age >50, and a history of appendectomy only.","Female sex, tobacco use, and a family history of colorectal cancer."],"correctIndex":0},{"stem":"What is the surveillance interval for nondysplastic Barrett's esophagus based on segment length?","options":["Every 1 year if <3 cm, every 6 months if >3 cm.","Every year regardless of segment length.","Every 3 years if the segment is <3 cm, every 5 years if >3 cm.","Every 10 years regardless of segment length.","Every 5 years if the segment is <3 cm, every 3 years if >3 cm."],"correctIndex":4},{"stem":"What endoscopic grading system is used to classify the severity of reflux esophagitis?","options":["The TNM staging system.","The Child-Pugh classification.","The Los Angeles Grading system (Grades A–D).","The Rome criteria.","The OLGA staging system."],"correctIndex":2},{"stem":"Name three medications commonly implicated in pill-induced esophagitis.","options":["Any three of: omeprazole, famotidine, and sucralfate.","Any three of: tetracyclines, bisphosphonates, potassium chloride tablets, iron supplements, NSAIDs, clindamycin.","Any three of: entecavir, tenofovir, and sofosbuvir.","Any three of: lactulose, rifaximin, and cholestyramine.","Any three of: metoclopramide, ondansetron, and loperamide."],"correctIndex":1},{"stem":"What patient counseling point helps prevent pill-induced esophagitis?","options":["Take pills on an empty stomach without water.","Take pills upright with water.","Take pills lying flat with minimal water.","Take pills immediately before bedtime.","Take pills crushed and mixed with food."],"correctIndex":1},{"stem":"What endoscopic finding is characteristic of Candida esophagitis, and what is the treatment?","options":["Large, linear longitudinal ulcers; treated with ganciclovir.","White adherent plaques; treated with oral fluconazole.","A single deep ulcer; treated with metronidazole.","Multiple small \"volcano-like\" ulcers; treated with acyclovir.","Rings and linear furrows; treated with topical budesonide."],"correctIndex":1},{"stem":"How do HSV and CMV esophagitis ulcers differ endoscopically?","options":["HSV causes multiple small \"volcano-like\" ulcers; CMV causes large, linear longitudinal ulcers.","HSV causes rings and furrows; CMV causes a single deep ulcer.","HSV and CMV both cause white adherent plaques indistinguishable from Candida.","HSV causes large, linear longitudinal ulcers; CMV causes multiple small \"volcano-like\" ulcers.","HSV causes a \"bird beak\" narrowing; CMV causes a \"corkscrew\" pattern."],"correctIndex":0},{"stem":"What cytokines drive the pathophysiology of eosinophilic esophagitis?","options":["IL-8 and IL-12, via neutrophil activation.","IL-17 and IL-23, via Th17 activation.","IL-4, IL-5, and IL-13, via Th2 lymphocyte activation.","IL-1, IL-6, and TNF-alpha, via Th1 lymphocyte activation.","IL-2, IL-10, and IFN-gamma, via Treg activation."],"correctIndex":2},{"stem":"What are the classic endoscopic findings in eosinophilic esophagitis?","options":["A single deep, linear ulcer with a clean base.","Cylindrical bowel with loss of haustral markings.","A dilated proximal esophagus with distal \"bird beak\" narrowing.","Rings, linear furrows, white exudates, and edema with loss of vascularity.","White adherent plaques with oral thrush."],"correctIndex":3},{"stem":"What are the treatment options for eosinophilic esophagitis?","options":["Oral fluconazole, acyclovir, and ganciclovir.","Lactulose, rifaximin, and pancreatic enzyme supplementation.","Octreotide, ceftriaxone, and balloon tamponade.","Bismuth quadruple therapy and H. pylori eradication.","PPI therapy, swallowed topical steroids (budesonide, fluticasone), a food-elimination diet, dupilumab for resistant disease, and endoscopic dilation if strictures are present."],"correctIndex":4},{"stem":"What is the classic presentation of a Schatzki ring?","options":["Painless dysphagia only for liquids.","Intermittent solid food dysphagia — the classic \"steakhouse syndrome.\"","Odynophagia with retrosternal burning after taking pills.","Progressive dysphagia to solids and liquids with weight loss.","Oropharyngeal dysphagia with regurgitation and halitosis."],"correctIndex":1},{"stem":"What syndrome should be considered when esophageal webs are associated with iron deficiency anemia?","options":["Zenker diverticulum.","Plummer-Vinson syndrome.","Zollinger-Ellison syndrome.","Mallory-Weiss syndrome.","Boerhaave syndrome."],"correctIndex":1},{"stem":"What is the underlying pathophysiology of achalasia?","options":["Eosinophilic infiltration of the esophageal wall causing rings and strictures.","Autoimmune destruction of the LES itself, leading to complete absence of sphincter tissue.","Degeneration of inhibitory neurons in the myenteric plexus causes loss of nitric oxide and unopposed cholinergic activity, leading to incomplete LES relaxation.","Hypertrophy of the myenteric plexus causing excessive LES relaxation.","Chronic acid reflux causing fibrotic narrowing of the distal esophagus."],"correctIndex":2},{"stem":"What classic finding is seen on barium swallow in achalasia?","options":["A \"string sign\" with a narrow pyloric channel.","A \"lead pipe\" appearance with loss of haustral markings.","A \"corkscrew\" appearance.","\"Thumbprinting\" with segmental wall thickening.","A \"bird beak\" narrowing with a dilated proximal esophagus."],"correctIndex":4},{"stem":"What are the treatment options for achalasia?","options":["Nissen fundoplication as the only treatment option.","Lateral internal sphincterotomy and topical nitroglycerin.","Cricopharyngeal myotomy and rubber band ligation.","Pneumatic dilation, Heller myotomy, botulinum toxin injection, and POEM for patients who are not good surgical candidates.","Systemic corticosteroids and swallowed budesonide."],"correctIndex":3},{"stem":"How does diffuse esophageal spasm differ from achalasia in terms of LES relaxation?","options":["LES relaxation is unrelated to either diffuse esophageal spasm or achalasia.","LES relaxation is enhanced in diffuse esophageal spasm and normal in achalasia.","LES relaxation is preserved in diffuse esophageal spasm, whereas it is impaired in achalasia.","LES relaxation is impaired in diffuse esophageal spasm, whereas it is preserved in achalasia.","LES relaxation is absent in both diffuse esophageal spasm and achalasia."],"correctIndex":2},{"stem":"What classic finding is seen on barium swallow in diffuse esophageal spasm?","options":["A \"corkscrew\" appearance.","A \"lead pipe\" appearance.","A \"bird beak\" narrowing.","A \"string sign.\"","A \"target/doughnut sign.\""],"correctIndex":0},{"stem":"What condition should be suspected when a patient has rapid symptom progression, marked weight loss, and older age, mimicking achalasia?","options":["Zenker diverticulum, from cricopharyngeal dysfunction.","Eosinophilic esophagitis, from a Th2-mediated immune response.","Diffuse esophageal spasm, from impaired inhibitory neural signaling.","Plummer-Vinson syndrome, from chronic iron deficiency.","Pseudoachalasia, from a secondary obstruction such as malignancy."],"correctIndex":4},{"stem":"What anatomic structure does a Zenker diverticulum form through?","options":["The esophageal hiatus.","The ampulla of Vater.","Killian's triangle.","The angle of His.","Calot's triangle."],"correctIndex":2},{"stem":"What is the classic clinical presentation of Zenker diverticulum?","options":["Progressive dysphagia to solids and liquids with chest pain.","Painless bright red blood per rectum.","Epigastric pain radiating to the back, relieved by leaning forward.","Oropharyngeal dysphagia, regurgitation of undigested food, halitosis, and coughing after meals.","Intermittent solid food dysphagia — the classic \"steakhouse syndrome.\""],"correctIndex":3},{"stem":"What is the definitive treatment for Zenker diverticulum?","options":["Cricopharyngeal myotomy.","Lateral internal sphincterotomy.","Rectopexy.","Pyloromyotomy.","Heller myotomy."],"correctIndex":0},{"stem":"What defines upper GI bleeding anatomically?","options":["Bleeding that originates distal to the splenic flexure.","Bleeding that originates proximal to the pylorus only.","Bleeding that originates proximal to the ileocecal valve.","Bleeding that originates distal to the ligament of Treitz.","Bleeding that originates proximal to the ligament of Treitz."],"correctIndex":4},{"stem":"What lab finding is classically elevated in upper GI bleeding?","options":["The BUN-to-creatinine ratio.","The direct-to-indirect bilirubin ratio.","The AST-to-ALT ratio.","The albumin-to-globulin ratio.","The amylase-to-lipase ratio."],"correctIndex":0},{"stem":"What is the hemoglobin transfusion threshold for most patients with GI bleeding, and what threshold applies if actively bleeding?","options":["5 g/dL for most patients; 6 g/dL if actively bleeding.","9 g/dL for most patients; 10 g/dL if actively bleeding.","7 g/dL for most patients; 8 g/dL if actively bleeding.","7 g/dL for all patients regardless of bleeding status.","10 g/dL for most patients; 7 g/dL if actively bleeding."],"correctIndex":2},{"stem":"What is the pathophysiology of a Mallory-Weiss tear?","options":["A full-thickness esophageal wall rupture from forceful vomiting.","A sudden rise in intragastric pressure during retching/vomiting causes a longitudinal mucosal laceration near the gastroesophageal junction.","H. pylori infection causing mucosal erosion at the GE junction.","Chronic acid reflux causing progressive fibrotic scarring of the GE junction.","Portal hypertension causing enlargement and rupture of submucosal veins."],"correctIndex":1},{"stem":"What patient history is classically associated with Mallory-Weiss tears?","options":["Recent abdominal surgery, prolonged immobility, and hypercoagulability.","Chronic constipation, low-fiber diet, and advanced age.","Chronic NSAID use, smoking, and a family history of PUD.","Repetitive vomiting, heavy alcohol use, pregnancy-associated hyperemesis, and eating disorders.","Recent travel, contaminated water exposure, and immunosuppression."],"correctIndex":3},{"stem":"How does Boerhaave syndrome differ from a Mallory-Weiss tear?","options":["Boerhaave syndrome is a mucosal-only laceration, while a Mallory-Weiss tear is a full-thickness perforation.","Boerhaave syndrome occurs in the stomach, while Mallory-Weiss tear occurs in the duodenum.","Boerhaave syndrome is a full-thickness esophageal tear/perforation, while a Mallory-Weiss tear is a mucosal-only laceration.","Boerhaave syndrome and Mallory-Weiss tear both involve full-thickness perforation.","Boerhaave syndrome is caused by H. pylori, while Mallory-Weiss tear is caused by NSAIDs."],"correctIndex":2},{"stem":"What is the pathophysiology of esophageal varices?","options":["Autoimmune destruction of the esophageal wall leads to venous enlargement.","Cirrhosis causes resistance to portal flow and portal hypertension, leading to enlargement of the distal esophageal veins with risk of rupture.","Eosinophilic infiltration weakens the esophageal wall, leading to venous dilation.","H. pylori infection causes direct erosion of the esophageal venous plexus.","Chronic acid reflux causes progressive dilation of the distal esophageal veins."],"correctIndex":1},{"stem":"What medication class is used for primary prophylaxis against variceal bleeding?","options":["Proton pump inhibitors.","Bile acid sequestrants.","ACE inhibitors.","Nonselective beta blockers (propranolol, nadolol, carvedilol).","Calcium channel blockers."],"correctIndex":3},{"stem":"What medication reduces portal hypertension by inhibiting splanchnic vasodilation during acute variceal hemorrhage?","options":["Ceftriaxone.","Lactulose.","Terlipressin used only for hepatorenal syndrome, not variceal bleeding.","Octreotide.","Metoclopramide."],"correctIndex":3},{"stem":"Why are antibiotics (e.g., ceftriaxone) given during acute variceal hemorrhage?","options":["Due to the need to prevent Clostridioides difficile colitis.","Due to the risk of aspiration pneumonia from hematemesis alone.","Due to the need to treat an underlying skin infection at the IV site.","Due to the risk of H. pylori reactivation during active bleeding.","Due to the risk of bacterial translocation across the gut wall in cirrhotic patients."],"correctIndex":4},{"stem":"What device can be used to temporize an acute variceal hemorrhage?","options":["Percutaneous cholecystostomy tube.","Chest tube thoracostomy.","Nasogastric decompression tube alone.","Balloon tamponade (Blakemore-Sengstaken tube).","Jejunostomy feeding tube."],"correctIndex":3},{"stem":"What are the main causes of peptic ulcer disease discussed in this lecture?","options":["H. pylori, NSAIDs/aspirin, critical illness, and smoking (less commonly Zollinger-Ellison syndrome, viral ulcers, Crohn disease).","NSAIDs/aspirin, autoimmune gastritis, and gastroparesis only.","Smoking, alcohol use, and dietary fiber deficiency only.","Zollinger-Ellison syndrome as the primary cause in nearly all cases.","H. pylori, celiac disease, and IBD only."],"correctIndex":0},{"stem":"How does H. pylori survive in the acidic gastric environment?","options":["It produces catalase, which breaks down gastric acid directly.","It produces urease, which converts urea into ammonia to create a less acidic microenvironment.","It produces a thick capsule that physically blocks acid contact.","It secretes bicarbonate directly to neutralize surrounding acid.","It invades deep into the muscularis propria, away from acid exposure."],"correctIndex":1},{"stem":"What must be discontinued for at least 4 weeks before noninvasive H. pylori testing?","options":["Beta blockers.","Oral contraceptives.","Antibiotics only, with no PPI restriction.","Proton pump inhibitors.","NSAIDs."],"correctIndex":3},{"stem":"What is the quadruple therapy regimen for H. pylori eradication, and for how long is it given?","options":["PPI once daily + bismuth + tetracycline, for 28 days.","PPI BID + amoxicillin + rifabutin, for 14 days.","PPI BID + bismuth 4x daily + tetracycline 500 mg 4x daily + metronidazole 500 mg 4x daily, for 14 days.","PPI BID + bismuth + metronidazole only, for 10 days.","PPI BID + clarithromycin + amoxicillin, for 7 days."],"correctIndex":2},{"stem":"How and when should H. pylori eradication be confirmed?","options":["Repeat urea breath test immediately after completing antibiotics, while still on the PPI.","Repeat serum IgG antibody testing 1 week after completing therapy.","Repeat urea breath test at least 4 weeks after completing the PPI and antibiotics.","Repeat endoscopic biopsy only, at 6 months post-treatment.","No confirmatory testing is needed after completing therapy."],"correctIndex":2},{"stem":"Into which adjacent organ do posterior duodenal ulcers characteristically penetrate?","options":["The pancreas.","The spleen.","The gallbladder.","The transverse colon.","The liver."],"correctIndex":0},{"stem":"What is the most common complication of peptic ulcer disease?","options":["Bleeding.","Fistula formation.","Gastric outlet obstruction.","Perforation.","Malignant transformation."],"correctIndex":0},{"stem":"What finding on imaging suggests peptic ulcer perforation?","options":["\"Thumbprinting\" of the bowel wall.","Free air under the diaphragm.","A target/doughnut sign.","A dilated common bile duct.","Pancreatic calcifications."],"correctIndex":1},{"stem":"How can a peptic stricture be distinguished from esophageal cancer based on history and endoscopic appearance?","options":["Peptic stricture shows smooth, distal narrowing with a long GERD history; cancer shows irregular narrowing with rapid progression and weight loss.","Peptic stricture shows irregular narrowing with rapid progression; cancer shows smooth, distal narrowing with a long GERD history.","Peptic stricture occurs only in the proximal esophagus; cancer occurs only in the distal esophagus.","Peptic stricture presents with odynophagia only; cancer presents with dysphagia only.","Peptic stricture and esophageal cancer are radiographically indistinguishable."],"correctIndex":0}]},{"id":"l3","number":3,"title":"Gastric, Duodenal & Small Intestinal Disorders","week":"Week 12","filename":"Lecture 3 - Week 12 Updated Gastric Duodenal Small Intestine","topics":[{"name":"Gastritis","sections":[{"label":"Definition","bullets":[{"text":"Inflammation of the gastric mucosa confirmed histologically — not simply endoscopic redness.","level":0},{"text":"True gastritis: inflammatory cell infiltrate. Reactive gastritis/gastropathy (NSAIDs, bile reflux, alcohol): mucosal injury/overgrowth with very little true inflammation.","level":0}]},{"label":"Epidemiology","bullets":[{"text":"Affects approximately 27.2 million individuals globally.","level":0},{"text":"Prevalence higher in females; increases with age, peaking in the fifth decade of life.","level":0},{"text":"Highest prevalence in Sub-Saharan Africa and parts of Asia.","level":0}]},{"label":"Etiology","bullets":[{"text":"**H. pylori (most common cause of chronic gastritis worldwide)** — two patterns: antral-predominant (acid hypersecretion → duodenal ulcers) or pangastritis (gastric atrophy → reduced acid → gastric cancer risk).","level":0},{"text":"Autoimmune gastritis (AIG): autoantibodies against parietal cells and intrinsic factor → corpus-predominant atrophy with antral sparing → B12/iron malabsorption, pernicious anemia; associated with Type 1 diabetes and thyroid disease.","level":0},{"text":"NSAID/chemical gastropathy: COX-1 inhibition reduces prostaglandins → impaired mucosal blood flow, mucin production, and epithelial repair.","level":0},{"text":"Other: Crohn disease (focally enhanced gastritis), lymphocytic gastritis, eosinophilic gastritis, bile reflux.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"Gastric mucosal barrier relies on: (1) tight junctions between epithelial cells, (2) a thick mucus-bicarbonate layer, (3) prostaglandin-mediated mucosal blood flow/repair.","level":0},{"text":"H. pylori breaks down cell seals and causes long-term inflammation; NSAIDs block protective prostaglandins via COX-1 inhibition, impairing mucosal repair.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Symptoms are nonspecific: dyspepsia, epigastric pain, abdominal distension, postprandial fullness. Many patients are asymptomatic.","level":0},{"text":"Autoimmune gastritis may present with macrocytic anemia, neurologic symptoms (B12 deficiency), or iron deficiency anemia from achlorhydria (impaired iron absorption).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"**Histology is the gold standard.** Endoscopy with biopsies from 5 sites (Sydney protocol: 2 antrum, 2 corpus, 1 incisura).","level":0},{"text":"H. pylori testing — noninvasive (preferred initial): urea breath test or stool antigen (hold PPIs ≥2 weeks, antibiotics ≥4 weeks before testing). Invasive (at endoscopy): rapid urease test, histology, culture.","level":0},{"text":"Autoimmune gastritis: anti-parietal cell antibodies, anti-intrinsic factor antibodies, elevated gastrin, low pepsinogen I, low B12.","level":0}]},{"label":"Correa Cascade / Complications","bullets":[{"text":"Progression: normal tissue → chronic gastritis → atrophic gastritis → intestinal metaplasia → dysplasia → gastric adenocarcinoma.","level":0},{"text":"OLGA staging stratifies risk: stages III–IV carry significantly elevated neoplasia risk; stages 0–II have near-zero risk.","level":0},{"text":"Complications: peptic ulcer disease, gastric adenocarcinoma (H. pylori responsible for the majority of noncardia gastric cancers), Type 1 gastric neuroendocrine tumors (from autoimmune gastritis), pernicious anemia/B12 deficiency.","level":0}]},{"label":"Treatment","bullets":[{"text":"**1st line H. pylori eradication: bismuth quadruple therapy (BQT) × 14 days** — PPI + bismuth + tetracycline + metronidazole.","level":0},{"text":"Alternatives: rifabutin triple therapy (omeprazole + amoxicillin + rifabutin) × 14 days, or PCAB dual therapy (vonoprazan + amoxicillin) × 14 days.","level":0},{"text":"Confirm eradication ≥4 weeks after completing therapy with urea breath test or stool antigen.","level":0},{"text":"Acid suppression with PPIs is the mainstay for symptom relief and mucosal healing. NSAID gastropathy: discontinue the offending agent.","level":0}]},{"label":"Dyspepsia Workup — When to Scope","bullets":[{"text":"EGD recommended for patients ≥60 years with new-onset dyspepsia.","level":0},{"text":"Patients <60: test-and-treat strategy for H. pylori preferred over endoscopy, even with alarm features, given very low malignancy risk in this age group.","level":0},{"text":"Alarm features: weight loss, GI bleeding/anemia, dysphagia, persistent vomiting.","level":0}]}]},{"name":"Gastroparesis","sections":[{"label":"Definition / Epidemiology","bullets":[{"text":"Delayed gastric emptying in the absence of mechanical obstruction — nausea, vomiting, early satiety, postprandial fullness, bloating, abdominal pain.","level":0},{"text":"Strong female predominance (2–4× more common in females).","level":0}]},{"label":"Etiology — The \"Big Three P's\"","bullets":[{"text":"**Idiopathic** — the largest etiologic group, no clear cause identified.","level":0},{"text":"**Diabetic** — accounts for ~25% of cases; nerve damage and hyperglycemia harm the stomach's pacemaker cells (interstitial cells of Cajal).","level":0},{"text":"**Postsurgical** — vagal nerve injury (e.g., after fundoplication, bariatric surgery).","level":0},{"text":"Other causes: postinfectious (viral), medications (opioids, GLP-1 receptor agonists, anticholinergics), connective tissue disorders (scleroderma), Parkinson disease, amyloidosis.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"Loss of interstitial cells of Cajal (the stomach's pacemaker cells), immune over-activation, cell stress, and nerve damage.","level":0},{"text":"Result: the lower stomach stops moving properly, pyloric dysfunction develops, the stomach cannot stretch to hold food, and electrical dysrhythmias occur.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Nausea and vomiting (often postprandial), early satiety, postprandial fullness/bloating, epigastric abdominal pain, weight loss.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"**Gold standard: 4-hour gastric emptying scintigraphy** using a standardized low-fat egg-white meal labeled with Tc-99m.","level":0},{"text":"Delayed emptying: >10% retention at 4 hours. Severe retention: >60% retention at 2 hours.","level":0},{"text":"Must exclude mechanical obstruction first (EGD or upper GI series); stop interfering medications 48–72 hours before testing (opioids, anticholinergics, prokinetics, antiemetics, cannabinoids).","level":0},{"text":"In diabetics, blood glucose should be <180–250 mg/dL on day of testing (hyperglycemia itself delays emptying).","level":0},{"text":"Alternatives: 13C breath testing (no radiation) and the wireless motility capsule (SmartPill).","level":0}]},{"label":"Treatment — Step 1: General Measures","bullets":[{"text":"Discontinue medications that delay gastric emptying (opioids, GLP-1 agonists, anticholinergics); optimize glycemic control in diabetics.","level":0},{"text":"Dietary modification: small-particle, low-fat, low-fiber diet; frequent small meals; increase liquid-calorie intake.","level":0}]},{"label":"Treatment — Step 2: Pharmacotherapy","bullets":[{"text":"**Metoclopramide — the only FDA-approved drug for gastroparesis** (D2 antagonist and 5-HT4 agonist). Carries an FDA Black Box Warning for tardive dyskinesia — avoid use >12 weeks when possible.","level":0},{"text":"Erythromycin — motilin receptor agonist, effective short-term prokinetic (250 mg TID before meals); limited by tachyphylaxis and QT prolongation risk.","level":0},{"text":"Antiemetics (symptom relief only, do not improve emptying): ondansetron, prochlorperazine, promethazine, Emetrol (use caution in diabetics).","level":0}]},{"label":"Treatment — Step 3: Refractory Disease","bullets":[{"text":"Gastric per-oral endoscopic myotomy (G-POEM) — for refractory symptoms, has largely replaced surgical pyloroplasty and botulinum toxin injection.","level":0},{"text":"Nutritional support: jejunostomy tube feeding if unable to maintain adequate oral intake; parenteral nutrition is a last resort.","level":0}]},{"label":"Pearls","bullets":[{"text":"Gastroparesis ≠ mechanical obstruction — always rule out obstruction first with EGD.","level":0},{"text":"Most common etiology is idiopathic, not diabetic.","level":0},{"text":"Metoclopramide is the only FDA-approved drug; know the Black Box Warning and the 12-week limit.","level":0},{"text":"Erythromycin works as a prokinetic (motilin agonist), not as an antibiotic in this context.","level":0},{"text":"GLP-1 receptor agonists (semaglutide, liraglutide) are an increasingly recognized cause of delayed gastric emptying — must be held before testing.","level":0}]}]},{"name":"Peptic Ulcer Disease (PUD)","sections":[{"label":"Definition / Epidemiology","bullets":[{"text":"Ulcerations in the stomach or duodenum extending through the mucosa into the submucosa or deeper.","level":0},{"text":"In the US, affects ~1% of the population, with ~54,000 annual hospitalizations for bleeding ulcers and ~10,000 deaths per year.","level":0}]},{"label":"Etiology — The \"Big Three\"","bullets":[{"text":"H. pylori infection (~42% of PUD cases).","level":0},{"text":"NSAIDs/aspirin (~36%).","level":0},{"text":"Idiopathic (~22%) — no identifiable cause.","level":0},{"text":"Other contributors: smoking, alcohol, steroids, critical illness (stress ulcers), and rarely Zollinger-Ellison syndrome.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"Results from an imbalance between mucosal protective factors (mucus, bicarbonate, prostaglandins, mucosal blood flow, tight junctions) and aggressive factors (acid, pepsin, H. pylori, NSAIDs).","level":0},{"text":"H. pylori disrupts tight junctions, triggers chronic inflammation, and alters acid regulation.","level":0},{"text":"NSAIDs inhibit COX-1, reducing prostaglandin synthesis → decreased mucus/bicarbonate secretion, impaired mucosal blood flow, reduced epithelial regeneration; also suppress pain pathways, making NSAID-induced ulcers more likely to present with complications rather than pain.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Dyspepsia present in ~81% of patients; symptoms are nonspecific.","level":0},{"text":"Duodenal ulcer: burning epigastric pain that improves with eating, then worsens 2–3 hours later; nocturnal pain.","level":0},{"text":"Gastric ulcer: postprandial pain, nausea, vomiting, weight loss.","level":0},{"text":"Elderly patients are frequently asymptomatic; bleeding can occur without warning symptoms in nearly half of patients.","level":0}]},{"label":"Complications","bullets":[{"text":"Bleeding (73% of complications) — hematemesis, melena, or hematochezia if brisk; case fatality 5–10%.","level":0},{"text":"Perforation (9%) — sudden severe abdominal pain, acute abdomen, free air on imaging; mortality up to 20%.","level":0},{"text":"Gastric outlet obstruction (3%) — nausea, vomiting, early satiety, weight loss.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"**EGD is the gold standard — sensitivity 92%**; allows direct visualization, biopsy, and therapeutic intervention for bleeding.","level":0},{"text":"Test-and-treat strategy for patients <60 with dyspepsia and no alarm features: test for H. pylori (noninvasive) → eradicate if positive → if negative, empiric PPI trial 4 weeks → EGD if symptoms persist.","level":0},{"text":"Alarm features requiring EGD: age ≥60 with new-onset dyspepsia, unintended weight loss, GI bleeding, progressive dysphagia/odynophagia, persistent vomiting, palpable mass/lymphadenopathy.","level":0},{"text":"Gastric ulcers should always be biopsied at the edge to rule out malignancy. H. pylori testing: hold PPIs ≥2 weeks and antibiotics/bismuth ≥4 weeks before testing.","level":0}]},{"label":"Treatment","bullets":[{"text":"PPIs are the mainstay — heal 80–100% of ulcers within 4 weeks (gastric ulcers >2 cm may need 8 weeks). Vonoprazan (P-CAB) is a newer alternative with >90% healing rates.","level":0},{"text":"H. pylori eradication reduces ulcer recurrence from 50–60% to 0–2%.","level":0},{"text":"Bismuth quadruple therapy (PPI + bismuth + tetracycline + metronidazole): preferred 1st line in many regions, effective regardless of clarithromycin resistance.","level":0},{"text":"Concomitant quadruple therapy (PPI + clarithromycin + amoxicillin + metronidazole): alternative 1st line; avoid if local clarithromycin resistance >15%.","level":0},{"text":"Triple therapy (PPI + clarithromycin + amoxicillin or metronidazole): declining efficacy (<70% in many areas); use only if local resistance is low.","level":0},{"text":"Vonoprazan-based regimens (vonoprazan + amoxicillin ± clarithromycin): high eradication rates even with clarithromycin-resistant strains.","level":0}]},{"label":"NSAID-Related Ulcers","bullets":[{"text":"Risk factors: age >65, prior PUD, concomitant antiplatelet/anticoagulant/corticosteroid/SSRI use, high-dose NSAIDs.","level":0},{"text":"Treatment: discontinue NSAIDs. If they cannot be stopped: add a PPI, switch to a COX-2 inhibitor, or combine a COX-2 inhibitor (celecoxib) + PPI for highest-risk patients.","level":0}]},{"label":"Management of Upper GI Bleeding from PUD","bullets":[{"text":"Resuscitate first — crystalloids, transfuse if Hgb <7–8 g/dL.","level":0},{"text":"Glasgow-Blatchford Score (GBS) ≤1 → safe for outpatient management.","level":0},{"text":"EGD within 24 hours for all admitted patients.","level":0}]},{"label":"Pearls","bullets":[{"text":"Duodenal ulcers are more common than gastric ulcers and more strongly associated with H. pylori.","level":0},{"text":"Gastric ulcers must be biopsied to rule out malignancy; duodenal ulcers rarely need biopsy.","level":0},{"text":"Posterior duodenal ulcers can erode into the gastroduodenal artery → massive hemorrhage. Posterior gastric ulcers can erode into the splenic artery.","level":0},{"text":"Anterior duodenal ulcers are more likely to perforate (free perforation into peritoneum).","level":0},{"text":"Confirm H. pylori eradication with urea breath test or stool antigen ≥4 weeks after completing therapy.","level":0},{"text":"Suspect Zollinger-Ellison syndrome when ulcers are multiple, distal (jejunal), or refractory to standard PPI therapy — check fasting serum gastrin.","level":0}]}]},{"name":"Pyloric Stenosis (Infantile Hypertrophic Pyloric Stenosis)","sections":[{"label":"Epidemiology / Risk Factors","bullets":[{"text":"Incidence: approximately 1–5 per 1,000 live births. Male-to-female ratio ~4–5:1.","level":0},{"text":"More common in firstborn children, Caucasian infants, and those with a positive family history; caused by combination of genetic and environmental factors.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"The pyloric muscle hypertrophies, gradually narrowing the gastric outlet and blocking passage of food into the intestine.","level":0},{"text":"Develops after birth — typically between 3 to 6 weeks of age — rather than being present at birth.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"**Nonbilious, projectile vomiting — the hallmark symptom** (obstruction is proximal to the ampulla of Vater).","level":0},{"text":"Classic \"hungry vomiter\" — eager to feed immediately after vomiting.","level":0},{"text":"Progressive dehydration, weight loss, and failure to thrive if untreated.","level":0},{"text":"PE: palpable \"olive-shaped\" mass in the RUQ/epigastrium (sensitivity ~74%); visible gastric peristaltic waves may be seen.","level":0}]},{"label":"Metabolic Derangement","bullets":[{"text":"Persistent vomiting of gastric acid (HCl) leads to a characteristic **hypochloremic, hypokalemic metabolic alkalosis**.","level":0},{"text":"Cascade: loss of H⁺/Cl⁻ → metabolic alkalosis and hypochloremia → kidneys conserve Cl⁻ by exchanging K⁺ for H⁺ in the distal tubule → hypokalemia and paradoxical aciduria.","level":0},{"text":"Severe alkalosis can cause compensatory hypoventilation and even central apneas in infants.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"**Abdominal ultrasound is the gold standard — sensitivity/specificity approaching 100%.**","level":0},{"text":"Key measurements: pyloric muscle thickness ≥3 mm (single wall), pyloric canal length ≥14–16 mm.","level":0},{"text":"Classic sonogram findings: \"target sign\" (transverse view), elongated pyloric canal (longitudinal view).","level":0},{"text":"Upper GI barium study (if used): \"string sign\" (narrow pyloric channel), \"shoulder sign\" (mass impression on antrum).","level":0}]},{"label":"Management","bullets":[{"text":"Preoperative stabilization is critical — this is a medical emergency. Correct dehydration and electrolyte abnormalities (chloride and potassium) with IV normal saline + KCl before surgery to reduce anesthetic risk (particularly apnea from alkalosis).","level":0},{"text":"**Definitive treatment: Ramstedt pyloromyotomy** — longitudinal incision through the serosa and hypertrophied muscle down to (but not through) the mucosa.","level":0},{"text":"Open or laparoscopic approach; laparoscopic is increasingly preferred (fewer complications, shorter stay, less postoperative pain).","level":0},{"text":"Prognosis is excellent with near-zero mortality after surgical correction.","level":0}]},{"label":"Pearls","bullets":[{"text":"Nonbilious vomiting → obstruction proximal to the ampulla of Vater (pyloric stenosis).","level":0},{"text":"Bilious vomiting → obstruction distal to the ampulla (think malrotation with midgut volvulus — a surgical emergency).","level":0},{"text":"Pyloric stenosis is not present at birth; symptoms develop at 3–6 weeks.","level":0},{"text":"Know the metabolic picture: hypochloremic, hypokalemic metabolic alkalosis.","level":0}]}]},{"name":"Gastrointestinal Bleeding (GIB)","sections":[{"label":"Classification","bullets":[{"text":"GI bleeding is classified by location relative to the ligament of Treitz: upper GI bleeding (UGIB — esophagus, stomach, duodenum) vs. lower GI bleeding (LGIB — distal to the ligament).","level":0},{"text":"Also categorized as overt (visible hematemesis, melena, hematochezia), occult (guaiac-positive stools or iron deficiency anemia without visible blood), or obscure (unknown source despite complete evaluation).","level":0}]},{"label":"Clinical Presentations","bullets":[{"text":"Hematemesis (bloody or coffee-ground emesis) → strongly suggests UGIB.","level":0},{"text":"Melena (black, tarry stools) → typically UGIB, but can originate from the small bowel or right colon.","level":0},{"text":"Hematochezia (bright red blood per rectum) → usually LGIB, but can occur with brisk UGIB.","level":0}]},{"label":"Common Etiologies — UGIB","bullets":[{"text":"Peptic ulcer disease (most common; H. pylori, NSAIDs), erosive esophagitis/gastritis, esophageal/gastric varices (portal HTN), Mallory-Weiss tear (post-retching), vascular ectasias/Dieulafoy lesion, neoplasms, aortoenteric fistula (rare but lethal).","level":0}]},{"label":"Common Etiologies — LGIB","bullets":[{"text":"Diverticulosis (most common, 30–65%), ischemic colitis (5–20%), hemorrhoids (5–20%), colorectal polyps/neoplasms (2–15%), angioectasias (5–10%), IBD/infectious colitis, post-polypectomy bleeding.","level":0}]},{"label":"Initial Assessment and Resuscitation","bullets":[{"text":"ABCs and hemodynamic status: assess for tachycardia, hypotension, orthostasis, shock; initiate IV crystalloid resuscitation if unstable.","level":0},{"text":"Labs: CBC, BMP (BUN/Cr), coagulation panel, LFTs, type and crossmatch.","level":0},{"text":"Restrictive transfusion strategy (transfuse when Hgb <7 g/dL); hypotensive patients may be transfused before reaching this threshold.","level":0}]},{"label":"Risk Stratification Scores","bullets":[{"text":"**Glasgow-Blatchford Score (GBS, 0–23)**: best validated for predicting need for intervention or death. GBS ≤1 identifies very low-risk patients safe for outpatient management; GBS ≥7 predicts likely need for endoscopic therapy.","level":0},{"text":"Rockall Score: requires endoscopic findings for the full score; predicts rebleeding and mortality in hospitalized patients.","level":0},{"text":"GBS is the most recommended first-line triage tool per current guidelines.","level":0}]},{"label":"Management of UGIB","bullets":[{"text":"PPI therapy initiated on presentation. After endoscopic hemostasis for high-risk ulcers, high-dose PPI (80 mg IV bolus → 8 mg/hr infusion, or intermittent dosing totaling 80–160 mg/day) for 72 hours markedly reduces rebleeding, surgery, and mortality.","level":0},{"text":"Endoscopy within 24 hours for all admitted UGIB patients; resuscitation should precede endoscopy.","level":0},{"text":"Endoscopic hemostasis: epinephrine injection should never be used alone — always combine with a second modality (thermal, clips).","level":0},{"text":"Variceal bleeding: requires antibiotics (e.g., ceftriaxone) + vasoactive drugs (octreotide or terlipressin) started at presentation.","level":0},{"text":"Erythromycin (250 mg IV) given 30–120 minutes pre-endoscopy improves gastric visualization and reduces need for repeat endoscopy.","level":0},{"text":"Failed endoscopic hemostasis: repeat endoscopy → transcatheter arterial embolization (TAE) → surgery as last resort.","level":0}]},{"label":"Management of LGIB","bullets":[{"text":"~75% of LGIB episodes stop spontaneously.","level":0},{"text":"Colonoscopy (after bowel prep) is preferred for hemodynamically stable patients, ideally within 8–24 hours of admission.","level":0},{"text":"For unstable patients or suspected ongoing bleeding: CT angiography is the initial study to localize the source, followed by embolization if positive.","level":0},{"text":"The Oakland Score (≤8 of 35) can help identify LGIB patients at low risk who are safe for outpatient management.","level":0}]},{"label":"Pearls","bullets":[{"text":"Always consider UGIB in patients with hematochezia and hemodynamic instability — brisk upper sources can present with bright red blood per rectum.","level":0},{"text":"NSAIDs and H. pylori are the two most important modifiable risk factors for peptic ulcer bleeding.","level":0},{"text":"A GBS of 0–1 is the threshold for safe outpatient management of UGIB.","level":0},{"text":"Aortoenteric fistula is rare but must be considered in any patient with a history of aortic graft and GI bleeding — it is a surgical emergency.","level":0},{"text":"In cirrhotic patients with GI bleeding, always assume a variceal source until proven otherwise and start antibiotics + vasopressors empirically.","level":0}]}]},{"name":"Appendicitis","sections":[{"label":"Epidemiology","bullets":[{"text":"Most common abdominal surgical emergency worldwide; incidence peaks in the second decade of life with a male-to-female ratio of ~2:1.","level":0},{"text":"Also the most common non-obstetric surgical emergency during pregnancy.","level":0}]},{"label":"Pathophysiology","bullets":[{"text":"Key mechanism: appendiceal luminal obstruction → increased intraluminal pressure → vascular compromise → ischemia → necrosis → perforation.","level":0},{"text":"Causes of obstruction vary by age: young adults — lymphoid follicular hyperplasia (55–65%); older adults — appendicoliths or neoplasm; other causes — fecaliths (~35%), foreign bodies, parasitic infections, tumors.","level":0},{"text":"As the appendix distends, T8–T10 visceral afferents produce vague periumbilical pain; when inflammation reaches the parietal peritoneum, somatic nerve stimulation causes classic migration to the RLQ.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Vague periumbilical pain (visceral), anorexia, nausea/vomiting (pain typically precedes vomiting), migration of pain to the RLQ within ~24 hours, low-grade fever.","level":0},{"text":"Only about 40% of patients
