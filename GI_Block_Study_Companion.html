<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GI Block Study Companion — Lectures 1-5 + Mock Exams</title>
<style>
:root {
  --navy: #1F3B57;
  --blue: #2E5C8A;
  --blue-light: #eaf1f8;
  --accent: #C8622A;
  --accent-light: #fbeee5;
  --bg: #f6f7fa;
  --card: #ffffff;
  --border: #dfe4ea;
  --text: #24303d;
  --text-muted: #5c6b7a;
  --green: #1e7d4b;
  --green-light: #e7f6ee;
  --red: #b3261e;
  --red-light: #fce9e8;
  --gold: #a6790a;
  --gold-light: #fbf1dc;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(16,24,40,0.08), 0 1px 2px rgba(16,24,40,0.06);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

.app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--navy);
  color: #fff;
  padding: 24px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar h1 {
  font-size: 17px;
  line-height: 1.35;
  margin: 0 8px 4px;
  font-weight: 700;
}
.sidebar .tagline {
  font-size: 12px;
  color: #b7c6d9;
  margin: 0 8px 24px;
}
.sidebar .nav-section-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: #7f93aa;
  margin: 18px 10px 8px;
}
.lecture-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
  transition: background 0.15s ease;
}
.lecture-nav-item:hover { background: rgba(255,255,255,0.08); }
.lecture-nav-item.active { background: rgba(255,255,255,0.16); }
.lecture-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(255,255,255,0.14);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0;
}
.lecture-nav-item.active .lecture-num { background: var(--accent); }
.lecture-nav-item.final-item .lecture-num { background: rgba(230,180,50,0.25); color: #ffd97a; }
.lecture-nav-item.final-item.active .lecture-num { background: var(--gold); color: #fff; }
.lecture-nav-text { display: flex; flex-direction: column; min-width: 0; }
.lecture-nav-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
.lecture-nav-week { font-size: 11px; color: #9fb2c8; }

.sidebar-foot {
  margin-top: 24px;
  padding: 12px 10px 4px;
  border-top: 1px solid rgba(255,255,255,0.12);
  font-size: 11px;
  color: #93a6bc;
  line-height: 1.5;
}

/* Main */
.main {
  flex: 1;
  min-width: 0;
  padding: 28px 36px 80px;
  max-width: 980px;
}
.lecture-header {
  margin-bottom: 20px;
}
.lecture-eyebrow {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 6px;
}
.lecture-header h2 {
  font-size: 26px;
  margin: 0 0 4px;
  color: var(--navy);
}
.lecture-filename {
  font-size: 12.5px;
  color: var(--text-muted);
  font-style: italic;
}

/* Mode tabs */
.mode-tabs {
  display: flex;
  gap: 8px;
  margin: 22px 0 22px;
  border-bottom: 2px solid var(--border);
  flex-wrap: wrap;
}
.mode-tab {
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color 0.15s ease;
}
.mode-tab:hover { color: var(--navy); }
.mode-tab.active {
  color: var(--blue);
  border-bottom-color: var(--accent);
}
.mode-tab.exam-tab.active { border-bottom-color: var(--gold); color: var(--gold); }

.panel { display: none; }
.panel.active { display: block; }

/* Study guide accordion */
.topic-toolbar {
  display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px;
}
.btn {
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--blue);
  cursor: pointer;
}
.btn:hover { background: var(--blue-light); }

.topic-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.topic-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
}
.topic-header:hover { background: var(--blue-light); }
.topic-chevron {
  width: 18px; height: 18px;
  flex-shrink: 0;
  transition: transform 0.18s ease;
  color: var(--blue);
}
.topic-card.open .topic-chevron { transform: rotate(90deg); }
.topic-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
}
.topic-body {
  display: none;
  padding: 4px 20px 18px 46px;
}
.topic-card.open .topic-body { display: block; }
.sub-section { margin-top: 12px; }
.sub-label {
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--accent);
  margin-bottom: 6px;
}
.sub-list {
  margin: 0;
  padding-left: 18px;
}
.sub-list li {
  font-size: 14px;
  line-height: 1.55;
  margin-bottom: 5px;
  color: var(--text);
}
.sub-list li.lvl1 { list-style-type: circle; margin-left: 18px; font-size: 13.5px; }
.sub-list strong { color: var(--navy); }

/* Quiz (flashcards) */
.quiz-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.quiz-progress {
  font-size: 13px; color: var(--text-muted); font-weight: 600;
}
.quiz-score {
  font-size: 13px; color: var(--text-muted);
}
.quiz-score .correct { color: var(--green); font-weight: 700; }
.quiz-score .incorrect { color: var(--red); font-weight: 700; }
.quiz-actions { display: flex; gap: 8px; }

.progress-bar-track {
  height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 20px;
}
.progress-bar-fill {
  height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease;
}

.flashcard-wrap {
  perspective: 1400px;
  margin-bottom: 20px;
}
.flashcard {
  position: relative;
  min-height: 220px;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.5s;
  transform-style: preserve-3d;
  box-shadow: var(--shadow);
}
.flashcard.flipped { transform: rotateY(180deg); }
.flash-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: 14px;
  padding: 28px 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.flash-front {
  background: linear-gradient(155deg, #ffffff, var(--blue-light));
  border: 1px solid var(--border);
}
.flash-back {
  background: linear-gradient(155deg, #ffffff, var(--accent-light));
  border: 1px solid var(--border);
  transform: rotateY(180deg);
}
.flash-kicker {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--blue); margin-bottom: 10px;
}
.flash-back .flash-kicker { color: var(--accent); }
.flash-text {
  font-size: 17px; line-height: 1.5; color: var(--navy); font-weight: 600;
}
.flash-back .flash-text { font-weight: 500; color: var(--text); font-size: 16px; }
.flash-hint {
  position: absolute; bottom: 12px; right: 16px;
  font-size: 11px; color: var(--text-muted);
}

.quiz-nav {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 26px;
}
.quiz-nav-left, .quiz-self-score { display: flex; gap: 8px; }
.nav-btn {
  padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; color: var(--navy); font-weight: 600; font-size: 13.5px; cursor: pointer;
}
.nav-btn:hover { background: var(--blue-light); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.nav-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.nav-btn.primary:hover { background: var(--navy); }
.nav-btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.nav-btn.gold:hover { background: #8a6108; }

.self-score-btn {
  padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border);
  font-weight: 700; font-size: 13px; cursor: pointer; background: #fff;
}
.self-score-btn.got-it { color: var(--green); }
.self-score-btn.got-it:hover, .self-score-btn.got-it.selected { background: var(--green-light); border-color: var(--green); }
.self-score-btn.missed { color: var(--red); }
.self-score-btn.missed:hover, .self-score-btn.missed.selected { background: var(--red-light); border-color: var(--red); }

.quiz-list-toggle { text-align: center; margin-top: 4px; }

.qa-list { margin-top: 10px; }
.qa-item {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow);
}
.qa-q { font-size: 14px; font-weight: 700; color: var(--navy); }
.qa-a { font-size: 13.5px; color: var(--text-muted); margin-top: 8px; display: none; line-height: 1.5; padding-top: 8px; border-top: 1px dashed var(--border); }
.qa-item.open .qa-a { display: block; }
.qa-num { color: var(--accent); font-weight: 700; margin-right: 6px; }

.complete-banner {
  text-align: center; padding: 40px 20px; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px;
}
.complete-banner .big-score { font-size: 40px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
.complete-banner .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 18px; }

/* ===================== EXAM ENGINE ===================== */
.exam-intro {
  background: linear-gradient(155deg, var(--card), var(--gold-light));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 40px 36px;
  text-align: center;
}
.exam-intro .exam-icon {
  width: 52px; height: 52px; border-radius: 50%; background: var(--gold);
  color: #fff; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px; font-size: 22px; font-weight: 800;
}
.exam-intro h3 { font-size: 22px; color: var(--navy); margin: 0 0 10px; }
.exam-intro p { color: var(--text-muted); font-size: 14px; line-height: 1.6; max-width: 560px; margin: 0 auto 22px; }
.exam-intro ul { text-align: left; max-width: 480px; margin: 0 auto 26px; padding-left: 20px; color: var(--text); font-size: 13.5px; line-height: 1.8; }
.exam-resume-note { font-size: 12.5px; color: var(--text-muted); margin-top: 14px; }

.exam-topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.exam-topbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.exam-qcount { font-size: 13.5px; font-weight: 700; color: var(--navy); }
.exam-timerlike { font-size: 12.5px; color: var(--text-muted); }
.exam-topbar-actions { display: flex; gap: 8px; }

.exam-navtoggle-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 16px;
}
.exam-navgrid {
  display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px;
}
@media (max-width: 700px) { .exam-navgrid { grid-template-columns: repeat(6, 1fr); } }
.exam-navtile {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  background: #fff;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.exam-navtile:hover { border-color: var(--blue); }
.exam-navtile.answered { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }
.exam-navtile.current { border-color: var(--navy); border-width: 2.5px; color: var(--navy); }
.exam-navtile.flagged::after {
  content: ""; position: absolute; top: -4px; right: -4px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
  border: 1.5px solid #fff;
}
.exam-navtile.correct { background: var(--green-light); border-color: var(--green); color: var(--green); }
.exam-navtile.incorrect { background: var(--red-light); border-color: var(--red); color: var(--red); }
.exam-navlegend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 11.5px; color: var(--text-muted); }
.exam-navlegend span { display: inline-flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 1.5px solid var(--border); }
.legend-dot.answered { background: var(--blue-light); border-color: var(--blue); }
.legend-dot.unanswered { background: #fff; }
.legend-dot.flagged { background: #fff; border-color: var(--accent); }
.legend-dot.correct { background: var(--green-light); border-color: var(--green); }
.legend-dot.incorrect { background: var(--red-light); border-color: var(--red); }

.exam-qcard {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 26px 28px; margin-bottom: 18px;
}
.exam-qcard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.exam-qnum { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); }
.exam-topic-chip {
  display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--blue); background: var(--blue-light); padding: 3px 8px; border-radius: 20px; margin-top: 4px;
}
.flag-btn {
  display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 20px;
  border: 1.5px solid var(--border); background: #fff; color: var(--text-muted); font-size: 12.5px; font-weight: 700; cursor: pointer;
  flex-shrink: 0;
}
.flag-btn:hover { border-color: var(--accent); color: var(--accent); }
.flag-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.exam-stem { font-size: 16px; line-height: 1.6; color: var(--navy); font-weight: 600; margin-bottom: 22px; }

.exam-option {
  display: flex; align-items: flex-start; gap: 12px;
  border: 1.5px solid var(--border); border-radius: 10px;
  padding: 13px 14px; margin-bottom: 10px;
  cursor: pointer; transition: background 0.12s ease, border-color 0.12s ease;
  background: #fff;
}
.exam-option:hover { border-color: var(--blue); background: var(--blue-light); }
.exam-option.selected { border-color: var(--blue); background: var(--blue-light); box-shadow: 0 0 0 1px var(--blue) inset; }
.exam-option.crossed { opacity: 0.5; }
.exam-option.crossed .exam-option-text { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.exam-option-letter {
  width: 26px; height: 26px; border-radius: 50%; background: var(--blue-light); color: var(--blue);
  display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; flex-shrink: 0;
}
.exam-option.selected .exam-option-letter { background: var(--blue); color: #fff; }
.exam-option-text { flex: 1; font-size: 14.5px; line-height: 1.5; color: var(--text); padding-top: 3px; }
.exam-option-strike {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; font-weight: 800;
  cursor: pointer; background: #fff;
}
.exam-option-strike:hover { border-color: var(--red); color: var(--red); }
.exam-option-strike.active { background: var(--red-light); border-color: var(--red); color: var(--red); }

/* review/grading state coloring */
.exam-option.graded { cursor: default; }
.exam-option.graded:hover:not(.reveal-correct):not(.reveal-wrong-picked) { background: #fff; border-color: var(--border); }
.exam-option.reveal-correct { border-color: var(--green); background: var(--green-light); box-shadow: 0 0 0 1px var(--green) inset; }
.exam-option.reveal-correct .exam-option-letter { background: var(--green); color: #fff; }
.exam-option.reveal-wrong-picked { border-color: var(--red); background: var(--red-light); box-shadow: 0 0 0 1px var(--red) inset; }
.exam-option.reveal-wrong-picked .exam-option-letter { background: var(--red); color: #fff; }
.exam-option-rationale { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; padding-top: 3px; }
.exam-option.reveal-correct .exam-option-rationale { color: #1a5c39; }
.exam-option.reveal-wrong-picked .exam-option-rationale { color: #8a1f19; }

.exam-feedback-banner {
  border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
.exam-feedback-banner.correct { background: var(--green-light); color: var(--green); border: 1px solid var(--green); }
.exam-feedback-banner.incorrect { background: var(--red-light); color: var(--red); border: 1px solid var(--red); }

.exam-bottom-nav {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px;
}

/* Review-before-submit screen */
.exam-review-summary {
  display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
}
.exam-stat-pill {
  flex: 1; min-width: 130px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; text-align: center;
}
.exam-stat-pill .num { font-size: 26px; font-weight: 800; color: var(--navy); }
.exam-stat-pill .lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
.exam-stat-pill.unanswered .num { color: var(--accent); }
.exam-stat-pill.flagged .num { color: var(--gold); }

/* Results screen */
.results-hero {
  background: linear-gradient(155deg, var(--navy), var(--blue));
  border-radius: 14px; padding: 36px 32px; color: #fff; text-align: center; margin-bottom: 22px;
  box-shadow: var(--shadow);
}
.results-hero .score-big { font-size: 52px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
.results-hero .score-pct { font-size: 16px; color: #cfe0f2; font-weight: 600; margin-bottom: 4px; }
.results-hero .score-sub { font-size: 12.5px; color: #a9c1d9; }

.results-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px;
}
@media (max-width: 720px) { .results-grid { grid-template-columns: 1fr; } }
.results-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px 22px;
}
.results-card h4 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--navy);
  margin: 0 0 14px; display: flex; align-items: center; gap: 8px;
}
.results-card ul { margin: 0; padding-left: 18px; }
.results-card li { font-size: 13.5px; line-height: 1.6; margin-bottom: 8px; color: var(--text); }
.weak-topic-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.weak-topic-row:last-child { border-bottom: none; }
.weak-topic-row .wt-name { color: var(--text); font-weight: 600; }
.weak-topic-row .wt-frac { color: var(--red); font-weight: 700; font-size: 12.5px; }
.hy-item { font-size: 13.5px; line-height: 1.55; padding: 10px 0; border-bottom: 1px dashed var(--border); }
.hy-item:last-child { border-bottom: none; }
.hy-item .hy-topic { color: var(--accent); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; display: block; margin-bottom: 3px; }

.results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

@media (max-width: 860px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; padding: 16px; }
  .main { padding: 20px 16px 60px; max-width: 100%; }
  .flashcard { min-height: 260px; }
  .exam-qcard { padding: 18px 16px; }
}

</style>
</head>

<script>
const LECTURES = [{"id":"l1","number":1,"title":"GI Anatomy, Physiology & Diagnostics","week":"Week 11","filename":"Lecture 1 - Week 11 GI Anatomy, Physiology, Diagnostics","topics":[{"name":"GI Tract Overview & Peritoneal Anatomy","sections":[{"label":"The GI Tract at a Glance","bullets":[{"text":"One continuous tube: mouth → esophagus → stomach → small intestine → colon → rectum.","level":0},{"text":"Sphincters keep flow moving in one direction; luminal pH shifts by region (gastric acid to intestinal neutral).","level":0},{"text":"Core jobs: ingest, digest, absorb, eliminate.","level":0}]},{"label":"Accessory (Solid) Organs","bullets":[{"text":"Salivary glands — start carbohydrate/fat digestion.","level":0},{"text":"Liver — metabolism, detoxification, bile production.","level":0},{"text":"Gallbladder — stores and concentrates bile.","level":0},{"text":"Pancreas — digestive enzymes plus insulin/glucagon.","level":0}]},{"label":"Peritoneum & Abdominal Cavity","bullets":[{"text":"Parietal peritoneum lines the abdominal wall; visceral peritoneum covers the organs.","level":0},{"text":"Greater sac vs. lesser sac (omental bursa).","level":0},{"text":"Mesentery suspends the small intestine. Omenta drape from the stomach (the greater omentum is the \"abdominal policeman\").","level":0}]},{"label":"Intraperitoneal vs. Retroperitoneal","bullets":[{"text":"Intraperitoneal: stomach, liver, spleen, jejunum/ileum, transverse and sigmoid colon.","level":0},{"text":"**Retroperitoneal (\"SAD PUCKER\"): duodenum, ascending/descending colon, pancreas, kidneys** (plus other structures per the full mnemonic).","level":0},{"text":"This distinction matters for surgical mobility and imaging planes.","level":0}]}]},{"name":"Oral Cavity, Salivary Glands & Swallowing","sections":[{"label":"Oral Cavity & Salivary Glands","bullets":[{"text":"Teeth and tongue perform mastication and bolus formation (innervated by CN V).","level":0},{"text":"3 paired salivary glands: parotid, submandibular, sublingual.","level":0},{"text":"Saliva contains amylase and lipase to begin digestion; mucus and IgA provide protection.","level":0}]},{"label":"Deglutition (Swallowing) — 3 Phases","bullets":[{"text":"Oral phase — voluntary; tongue forms and pushes the bolus.","level":0},{"text":"Pharyngeal phase — involuntary; epiglottis protects the airway.","level":0},{"text":"Esophageal phase — involuntary peristalsis propels the bolus to the stomach.","level":0}]}]},{"name":"Esophagus","sections":[{"label":"Gross Anatomy","bullets":[{"text":"~20–25 cm muscular tube spanning cervical → thoracic → abdominal regions.","level":0},{"text":"Passes through the diaphragm at the esophageal hiatus (T10); joins the stomach at T11.","level":0},{"text":"Function: peristalsis transports the bolus — no digestion or absorption occurs here.","level":0}]},{"label":"Layers and Innervation","bullets":[{"text":"Innervation: vagus nerve → esophageal plexus → Auerbach (myenteric) plexus and Meissner (submucosal) plexus.","level":0},{"text":"Wall layers (outer to inner): adventitia → longitudinal muscle layer → circular muscle layer → submucosa → mucosa.","level":0}]},{"label":"Microanatomy","bullets":[{"text":"Epithelium: nonkeratinized stratified squamous cells, many layers.","level":0},{"text":"Stromal papillae divide the epithelium into regions; submucosal glands secrete mucus into the esophageal lumen.","level":0},{"text":"Fibroblasts and muscle cells lie deeper to the epithelium.","level":0}]},{"label":"Esophageal Sphincters","bullets":[{"text":"UES (cricopharyngeus) — prevents air entry.","level":0},{"text":"**LES — a physiologic, not anatomic, sphincter.** No true muscular ring exists at the GE junction; tone comes from the crural diaphragm and the angle of His.","level":0}]},{"label":"The Z Line","bullets":[{"text":"The squamocolumnar junction — marks the transition from esophageal to gastric mucosa.","level":0},{"text":"Esophagus: nonkeratinized stratified squamous epithelium. Stomach: simple columnar epithelium begins here.","level":0},{"text":"A key endoscopic landmark for Barrett's esophagus surveillance.","level":0}]}]},{"name":"Stomach","sections":[{"label":"Regions & Curvatures","bullets":[{"text":"Cardia → fundus → body → pyloric antrum → pyloric canal.","level":0},{"text":"Lesser curvature (right) and greater curvature (left).","level":0},{"text":"Function: fundus stores swallowed air/food, body mixes and digests, antrum grinds and meters emptying.","level":0}]},{"label":"Internal Surface","bullets":[{"text":"Rugae — mucosal/submucosal folds that flatten as the stomach distends with food.","level":0},{"text":"Gastric pits open along the entire mucosal surface.","level":0}]},{"label":"Gastric Mucosa: Specialized Cells","bullets":[{"text":"Mucous cells — protective mucus and bicarbonate.","level":0},{"text":"Parietal cells — HCl and intrinsic factor.","level":0},{"text":"Chief cells — pepsinogen → pepsin, which begins protein digestion.","level":0},{"text":"G cells (antrum) — gastrin.","level":0}]},{"label":"Gastric Pits in Detail","bullets":[{"text":"Surface epithelium invaginates to form gastric pits/glands.","level":0},{"text":"Each gland empties acid, enzymes, and mucus into the pit; a rich capillary network supports high secretory demand.","level":0}]},{"label":"Gastric Secretion & Motility (Physiology)","bullets":[{"text":"Secretion — 3 phases: cephalic (sight/smell/taste, vagal), gastric (distension, gastrin release), intestinal (feedback inhibition).","level":0},{"text":"Motility: receptive relaxation of the fundus, mixing waves that form chyme, and the migrating motor complex between meals.","level":0}]},{"label":"Blood Supply & Innervation","bullets":[{"text":"Celiac trunk → left and right gastric arteries, gastroepiploic arteries, with rich anastomoses along both curvatures.","level":0},{"text":"Venous drainage parallels the arteries into the portal system.","level":0},{"text":"Autonomic control: parasympathetic via the vagus nerve stimulates digestion; sympathetic via the celiac plexus inhibits it.","level":0}]}]},{"name":"Small Intestine","sections":[{"label":"Three Segments","bullets":[{"text":"Duodenum — ~10–15 in, C-shaped, mostly retroperitoneal.","level":0},{"text":"Jejunum — ~8–9 ft, proximal 2/5 of the post-duodenal small bowel.","level":0},{"text":"Ileum — ~10–11 ft, distal 3/5, ends at the ileocecal valve.","level":0},{"text":"Function: the site of most chemical digestion and nearly all nutrient absorption.","level":0}]},{"label":"Duodenum: Four Parts","bullets":[{"text":"Superior → descending → horizontal → ascending.","level":0},{"text":"The head of the pancreas sits within the duodenal C-loop.","level":0},{"text":"Major papilla — delivers bile and the main pancreatic duct into the duodenum.","level":0},{"text":"Function: neutralizes acidic chyme and mixes it with bile and pancreatic enzymes.","level":0}]},{"label":"Duodenum: Interior Surface","bullets":[{"text":"Duodenal cap (bulb) — smooth proximal segment.","level":0},{"text":"Brunner's glands neutralize acidic chyme.","level":0},{"text":"Circular folds (plicae circulares) begin here.","level":0}]},{"label":"Jejunum vs. Ileum","bullets":[{"text":"Jejunum: thicker wall, taller plicae circulares; site of the bulk of nutrient absorption.","level":0},{"text":"Ileum: thinner wall, contains Peyer's patches for immune surveillance.","level":0},{"text":"Vascular arcades: fewer/longer in the jejunum vs. more/shorter in the ileum.","level":0}]},{"label":"Wall Microanatomy","bullets":[{"text":"Plicae circulares → villi → microvilli progressively amplify surface area.","level":0},{"text":"Enterocytes perform brush-border digestion and absorption.","level":0},{"text":"Goblet cells (mucus) and Paneth cells (defense) are located in the crypts.","level":0}]},{"label":"Absorption by Region","bullets":[{"text":"Duodenum/jejunum — sugars, amino acids, fats, iron, calcium.","level":0},{"text":"**Ileum — bile salts and vitamin B12 (B12 absorption requires intrinsic factor).**","level":0},{"text":"Water and electrolytes are absorbed along the entire length of the small intestine.","level":0}]}]},{"name":"Large Intestine (Colon), Cecum, Appendix & Rectum","sections":[{"label":"Large Intestine: Gross Anatomy","bullets":[{"text":"Cecum → ascending → transverse → descending → sigmoid → rectum.","level":0},{"text":"Teniae coli, haustra, and epiploic appendages are unique to the colon.","level":0},{"text":"Function: reabsorbs water/electrolytes and forms and stores feces along this path.","level":0}]},{"label":"Cecum & Vermiform Appendix","bullets":[{"text":"Cecum receives the terminal ileum at the ileocecal valve.","level":0},{"text":"The appendix base is a fairly constant anatomic landmark — McBurney's point.","level":0},{"text":"The appendix contains abundant lymphoid tissue.","level":0}]},{"label":"Colon: Microanatomy","bullets":[{"text":"No villi — flat mucosa with straight crypts and abundant goblet cells.","level":0},{"text":"Colonocytes absorb water, electrolytes, and short-chain fatty acids (SCFAs).","level":0},{"text":"Microbiota ferment fiber into SCFAs and synthesize vitamin K.","level":0},{"text":"Haustral churning plus mass movements drive the defecation reflex.","level":0}]},{"label":"Rectum: Anatomy","bullets":[{"text":"A 12–15 cm muscular tube connecting the sigmoid colon to the anal canal.","level":0},{"text":"Primary function: temporary storage of feces; when filled, wall stretch triggers nerve signals that create the urge to defecate.","level":0},{"text":"Contains internal and external anal sphincters.","level":0}]},{"label":"Rectum: Innervation","bullets":[{"text":"Autonomic (involuntary): fibers from the sacral spinal cord (S2–S4) via pelvic splanchnic nerves stimulate rectal contraction and relax the internal anal sphincter → defecation.","level":0},{"text":"Somatic (voluntary): fibers from the lumbar spinal cord (L1–L2) via lumbar splanchnic nerves relax the rectal wall and contract the internal sphincter → continence.","level":0}]}]},{"name":"Liver","sections":[{"label":"Diaphragmatic Surface","bullets":[{"text":"The largest solid organ and largest gland in the body.","level":0},{"text":"Right and left lobes are divided by the falciform ligament, which anchors to the anterior abdominal wall.","level":0},{"text":"Function: metabolism, detoxification, bile production.","level":0}]},{"label":"Visceral Surface & Lobes","bullets":[{"text":"4 anatomic lobes: right, left, caudate, quadrate.","level":0},{"text":"Porta hepatis contains the portal vein, hepatic artery, and common hepatic duct.","level":0},{"text":"8 Couinaud segments guide surgical resection planning.","level":0}]},{"label":"Hepatic Portal Circulation","bullets":[{"text":"Portal vein = superior mesenteric vein + splenic vein; carries nutrient-rich, oxygen-poor blood from the gut and spleen to the liver first.","level":0},{"text":"Supplies ~75% of the liver's blood flow (the hepatic artery supplies the rest).","level":0},{"text":"Function: allows the liver to process/detoxify absorbed nutrients before they reach systemic circulation.","level":0}]},{"label":"The Hepatic Lobule (Microanatomy)","bullets":[{"text":"Hepatocyte plates radiate from the central vein.","level":0},{"text":"Portal triad = portal vein branch, hepatic artery branch, bile duct.","level":0},{"text":"Blood flows from the portal triad toward the central vein via sinusoids (fenestrated capillaries patrolled by Kupffer cells).","level":0},{"text":"Bile flows in the opposite direction of blood: from hepatocytes → bile canaliculi → the portal triad's bile ducts.","level":0}]},{"label":"Core Functions (Physiology)","bullets":[{"text":"Detoxification — Kupffer cells, drug/hormone breakdown, ammonia → urea conversion.","level":0},{"text":"Carbohydrate and lipid metabolism — glycogen storage, triglyceride/cholesterol handling.","level":0},{"text":"Protein synthesis — albumin, clotting factors.","level":0},{"text":"Bile secretion — bile salts made from cholesterol, bilirubin excretion.","level":0}]},{"label":"Bile & Bilirubin","bullets":[{"text":"Bile contains bile salts, bilirubin, cholesterol, and electrolytes.","level":0},{"text":"Bile salts emulsify fat; most are recycled via enterohepatic circulation.","level":0},{"text":"Heme → unconjugated bilirubin → the liver conjugates it → excreted in bile.","level":0},{"text":"The direct/indirect bilirubin split helps clinically localize the cause of jaundice.","level":0}]}]},{"name":"Biliary Tree & Gallbladder","sections":[{"label":"Anatomy","bullets":[{"text":"Right and left hepatic ducts join to form the common hepatic duct.","level":0},{"text":"The gallbladder stores/concentrates bile, connected via the cystic duct.","level":0},{"text":"The common bile duct joins the pancreatic duct at the ampulla of Vater.","level":0}]},{"label":"Cystic Triangle (of Calot)","bullets":[{"text":"Bounded by the cystic duct, common hepatic duct, and the liver edge.","level":0},{"text":"Contains the cystic artery.","level":0},{"text":"A key surgical landmark during cholecystectomy.","level":0}]}]},{"name":"Pancreas","sections":[{"label":"Gross Anatomy","bullets":[{"text":"Composed of head, neck, body, and tail; entirely retroperitoneal.","level":0},{"text":"The head sits within the duodenal C-loop; the tail reaches toward the splenic hilum.","level":0},{"text":"Function: exocrine digestive enzymes plus endocrine insulin/glucagon.","level":0}]},{"label":"Duct System","bullets":[{"text":"Main duct (of Wirsung) runs the length of the gland and joins the common bile duct at the ampulla of Vater.","level":0},{"text":"Accessory duct (of Santorini) — drains via the minor papilla in many people.","level":0},{"text":"Function: delivers enzyme- and bicarbonate-rich secretions into the duodenum.","level":0}]},{"label":"Secretory Function (Physiology)","bullets":[{"text":"Exocrine (acinar cells): amylase, lipase, and proteases (secreted as inactive zymogens).","level":0},{"text":"Ductal cells: secrete bicarbonate to neutralize acidic chyme.","level":0},{"text":"Regulated by secretin (stimulates bicarbonate) and CCK (stimulates enzyme release).","level":0},{"text":"Endocrine islets: insulin (β cells) and glucagon (α cells).","level":0}]}]},{"name":"Integrative Physiology: Vasculature & the Gut-Brain Axis","sections":[{"label":"Putting It Together: The Digestive Flow","bullets":[{"text":"Meal → stomach → duodenum → (bile + pancreatic enzymes added) → jejunum/ileum (absorption) → portal vein (nutrients) → liver.","level":0},{"text":"Unabsorbed residue and water continue to the colon (water absorption) → rectum (feces and defecation).","level":0}]},{"label":"Waste Regulation","bullets":[{"text":"Small intestine absorbs usable nutrients; indigestible matter (fiber, dead cells, bacteria) enters the large intestine.","level":0},{"text":"Colon removes water and electrolytes; bacteria ferment remaining carbohydrates; waste solidifies into feces.","level":0},{"text":"Normal feces: formed — either sausage-shaped with cracks, or sausage-shaped with a smooth/soft surface.","level":0}]},{"label":"GI Vasculature (Foregut/Midgut/Hindgut)","bullets":[{"text":"**Celiac trunk — supplies the foregut** (to the major duodenal papilla).","level":0},{"text":"**Superior mesenteric artery (SMA) — supplies the midgut** (to the transverse colon).","level":0},{"text":"**Inferior mesenteric artery (IMA) — supplies the hindgut** (to the rectum).","level":0}]},{"label":"The Gut-Brain Axis & Enteric Nervous System (ENS)","bullets":[{"text":"The ENS is the \"second brain\" — a network of 200–600 million neurons in the gut wall that can function independently from the CNS.","level":0},{"text":"Major ENS plexuses: myenteric (Auerbach's), between muscle layers, controls motility; submucosal (Meissner's), beneath the mucosa, controls secretion and blood flow.","level":0},{"text":"Extrinsic CNS modulation: vagus nerve (parasympathetic) is generally stimulatory (promotes motility/secretion); sympathetic nerves are generally inhibitory (slow motility, reduce secretion).","level":0},{"text":"Communication pathways: the vagus nerve (~80% afferent), immune mediators, enteroendocrine hormones, microbial metabolites.","level":0},{"text":"~90–95% of the body's serotonin is produced in the gut (by enterochromaffin cells) but does not cross the blood-brain barrier — central and peripheral serotonin pools are functionally separate.","level":0},{"text":"Clinical relevance: gut-brain axis dysfunction is implicated in IBS, functional dyspepsia, Parkinson disease (early ENS α-synuclein pathology), and mood disorders.","level":0}]}]},{"name":"Motility & GI Hormonal Regulation","sections":[{"label":"Peristalsis & Segmentation","bullets":[{"text":"Peristalsis — a coordinated wave of contraction behind and relaxation ahead of the bolus; propels contents forward.","level":0},{"text":"Segmentation — localized ring contractions in the small intestine that mix chyme with enzymes/bile rather than propelling it.","level":0},{"text":"Both depend on the enteric nervous system, modulated by the vagus and sympathetic nerves.","level":0}]},{"label":"GI Hormones I — The Core Three","bullets":[{"text":"Gastrin — released by G cells (antrum); increases gastric acid secretion.","level":0},{"text":"Secretin — released by S cells (duodenum); increases bicarbonate secretion, decreases gastric acid.","level":0},{"text":"CCK (cholecystokinin) — released by I cells (duodenum); increases pancreatic enzyme release and bile release/gallbladder contraction.","level":0}]},{"label":"GI Hormones II — Incretins & Motilin","bullets":[{"text":"GIP — released by K cells (duodenum/jejunum); increases insulin release (incretin effect).","level":0},{"text":"GLP-1 — released by L cells (ileum/colon); increases insulin release, decreases gastric emptying and appetite.","level":0},{"text":"Motilin — released by M cells (duodenum); triggers the migrating motor complex.","level":0}]}]},{"name":"GI Diagnostics & Imaging","sections":[{"label":"Esophagus & Stomach","bullets":[{"text":"Barium swallow — fluoroscopy (real-time x-ray) while swallowing contrast; shows contour, motility, strictures.","level":0},{"text":"EGD (esophagogastroduodenoscopy) — flexible scope through the mouth for direct visualization and biopsy.","level":0}]},{"label":"Small Bowel & Colon","bullets":[{"text":"Lower GI series; colonoscopy.","level":0},{"text":"Capsule endoscopy — a swallowed pill camera images the small bowel as it passes through.","level":0},{"text":"Colonoscopy — flexible scope via the anus; direct visualization, biopsy, and CRC screening.","level":0},{"text":"Abdominal x-ray (normal features): small bowel folds (valvulae conniventes) run the full diameter of the lumen and are located centrally with minimal gas; large bowel haustra are thicker but only run partially across the bowel and normally contain gas + fecal material; kidneys appear as smooth bean-shaped shadows; psoas muscle margins should be crisp (loss of margin can indicate retroperitoneal pathology); no pathologic calcifications or free air should be present.","level":0}]},{"label":"Liver Diagnostics","bullets":[{"text":"Labs: AST/ALT (enzymes released with hepatocyte injury; ALT is more liver-specific); bilirubin (direct vs. indirect, helps localize the cause of jaundice); a full liver panel includes ALT, AST, ALP, bilirubin, albumin.","level":0},{"text":"**Ultrasound — most widely used, first-line liver imaging**; sound-wave based, no radiation, quickly detects structure/tumors/gallstones.","level":0},{"text":"CT — detailed cross-sectional x-ray images; detects tumors, abscesses, trauma; used for cancer staging.","level":0},{"text":"MRI — superior to CT for characterizing liver lesions and fatty liver disease.","level":0},{"text":"Elastography (FibroScan or MR elastography) — noninvasive measurement of liver fibrosis and fat content; may reduce the need for liver biopsy.","level":0}]},{"label":"Gallbladder & Biliary Tree Diagnostics","bullets":[{"text":"**Ultrasound is first-line**; HIDA scan (hepatobiliary iminodiacetic acid) is a nuclear tracer test of gallbladder emptying.","level":0},{"text":"Cholecystogram — patient swallows iodine-based contrast, which the liver excretes into bile, then x-rays are taken; used mostly to diagnose gallstones.","level":0},{"text":"MRCP — noninvasive MRI of the bile ducts.","level":0},{"text":"ERCP (endoscopic retrograde cholangiopancreatography) — invasive scope + x-ray; both diagnostic and therapeutic; assesses liver, pancreas, bile ducts; used to remove gallstones/pancreatic stones, place stents, evaluate strictures or leaks, identify tumors, take biopsies.","level":0}]},{"label":"Pancreas Diagnostics","bullets":[{"text":"Labs: lipase — more pancreas-specific than amylase.","level":0},{"text":"**CT abdomen/pelvis — gold standard, first-line for pancreatitis or a mass** (dual-/multiphase CT with IV contrast highlights vessels and pinpoints tumors).","level":0},{"text":"MRCP — used when CT results are unclear or better bile/pancreatic duct visualization is needed.","level":0},{"text":"Endoscopic ultrasound (EUS) — highest resolution for smaller lesions; also allows fine-needle biopsy if a mass is found.","level":0},{"text":"Abdominal ultrasound — often the first noninvasive test for jaundice symptoms to rule out gallstones, but limited by overlying bowel gas.","level":0}]},{"label":"Other Cross-Cutting Diagnostics","bullets":[{"text":"Plain abdominal x-ray (KUB) — quick look for free air, obstruction, bowel gas pattern.","level":0},{"text":"Stool studies — fecal occult blood/FIT (bleeding), fecal calprotectin (inflammation).","level":0},{"text":"H. pylori testing — urea breath test, stool antigen, or biopsy at EGD.","level":0},{"text":"Tumor markers — CEA followed serially after colorectal cancer treatment.","level":0}]},{"label":"Quick Reference: Acronyms","bullets":[{"text":"EGD — esophagogastroduodenoscopy.","level":0},{"text":"ERCP — endoscopic retrograde cholangiopancreatography.","level":0},{"text":"MRCP — magnetic resonance cholangiopancreatography.","level":0},{"text":"HIDA — hepatobiliary iminodiacetic acid (scan).","level":0},{"text":"CT — computed tomography.","level":0},{"text":"KUB — kidneys, ureters, bladder (plain abdominal x-ray).","level":0}]},{"label":"Choosing the Right Study — Clinical Correlation","bullets":[{"text":"Suspected appendicitis: CT (adult) or ultrasound (child/pregnant).","level":0},{"text":"RUQ pain/gallstones: ultrasound ± HIDA scan.","level":0},{"text":"Dysphagia: barium swallow ± manometry.","level":0},{"text":"Colorectal cancer screening: colonoscopy.","level":0},{"text":"Suspected pancreatitis: lipase + CT abdomen/pelvis.","level":0},{"text":"Abnormal LFTs: AST/ALT, bilirubin → ultrasound.","level":0},{"text":"Suspected PUD/gastritis: H. pylori testing ± EGD.","level":0}]}]},{"name":"Key Takeaways (Lecture Summary)","sections":[{"label":"Wrap-Up Points","bullets":[{"text":"Four wall layers, regionally specialized, run the whole GI tract.","level":0},{"text":"Accessory organs share one ductal system at the ampulla of Vater; the portal vein routes absorbed nutrients to the liver first.","level":0},{"text":"Foregut/midgut/hindgut map to celiac trunk/SMA/IMA blood supply, respectively.","level":0},{"text":"Motility (peristalsis/segmentation) and hormones (gastrin, secretin, CCK, GIP, GLP-1, motilin) coordinate the whole digestive process.","level":0},{"text":"Imaging and lab test choice always follows the clinical question — these same tests reappear in each disease-focused lecture.","level":0}]}]}],"questions":[{"q":"What are the four core functions of the GI tract?","a":"Ingest, digest, absorb, and eliminate."},{"q":"According to this lecture, which organs are classically retroperitoneal (\"SAD PUCKER\")?","a":"The duodenum, ascending/descending colon, pancreas, and kidneys."},{"q":"What is the greater omentum sometimes called, due to its protective role in the abdomen?","a":"The \"abdominal policeman.\""},{"q":"Name the three phases of swallowing (deglutition).","a":"Oral, pharyngeal, and esophageal phases."},{"q":"Which phase of swallowing is voluntary, and which are involuntary?","a":"The oral phase is voluntary; the pharyngeal and esophageal phases are involuntary."},{"q":"At what vertebral level does the esophagus pass through the diaphragm?","a":"T10 (the esophageal hiatus)."},{"q":"What type of epithelium lines the esophagus?","a":"Nonkeratinized stratified squamous epithelium."},{"q":"Why is the lower esophageal sphincter (LES) called a \"physiologic\" rather than an anatomic sphincter?","a":"There is no true muscular ring at the GE junction — its tone comes from the crural diaphragm and the angle of His."},{"q":"What is the Z line, and why is it clinically important?","a":"The squamocolumnar junction where esophageal squamous epithelium transitions to gastric columnar epithelium; it is a key endoscopic landmark for Barrett's esophagus surveillance."},{"q":"List the regions of the stomach in order from proximal to distal.","a":"Cardia → fundus → body → pyloric antrum → pyloric canal."},{"q":"What gastric cell type secretes HCl and intrinsic factor?","a":"Parietal cells."},{"q":"What gastric cell type secretes pepsinogen?","a":"Chief cells."},{"q":"What gastric cell type secretes gastrin, and where are they located?","a":"G cells, located in the antrum."},{"q":"Name the three phases of gastric acid secretion.","a":"Cephalic, gastric, and intestinal phases."},{"q":"What part of the stomach stores swallowed air/food before digestion begins?","a":"The fundus (via receptive relaxation)."},{"q":"What are the three segments of the small intestine, in order?","a":"Duodenum, jejunum, and ileum."},{"q":"What structure sits within the C-loop of the duodenum?","a":"The head of the pancreas."},{"q":"What gland in the duodenum neutralizes acidic chyme?","a":"Brunner's glands."},{"q":"What distinguishes the jejunum from the ileum anatomically?","a":"The jejunum has a thicker wall, taller plicae circulares, and fewer/longer vascular arcades; the ileum has a thinner wall, Peyer's patches, and more/shorter vascular arcades."},{"q":"What is absorbed primarily in the ileum, and what cofactor is required for one of these substances?","a":"Bile salts and vitamin B12; B12 absorption requires intrinsic factor."},{"q":"What structures amplify the absorptive surface area of the small intestine, from largest to smallest scale?","a":"Plicae circulares → villi → microvilli."},{"q":"What cell type in the small intestine crypts provides antimicrobial defense?","a":"Paneth cells."},{"q":"What structures are unique to the gross anatomy of the colon (not found in the small intestine)?","a":"Teniae coli, haustra, and epiploic appendages."},{"q":"What anatomic landmark corresponds to the base of the appendix?","a":"McBurney's point."},{"q":"Why does the colon lack villi?","a":"It has flat mucosa with straight crypts instead, since its main job is water/electrolyte absorption rather than nutrient absorption."},{"q":"What do colonic microbiota produce through fermentation of fiber, and what vitamin do they synthesize?","a":"Short-chain fatty acids (SCFAs); they also synthesize vitamin K."},{"q":"What spinal cord levels provide autonomic (involuntary) innervation to the rectum for defecation?","a":"S2–S4, via pelvic splanchnic nerves."},{"q":"What spinal cord levels provide somatic (voluntary) innervation for continence?","a":"L1–L2, via lumbar splanchnic nerves."},{"q":"What ligament divides the right and left lobes of the liver on its diaphragmatic surface?","a":"The falciform ligament."},{"q":"What three structures make up the portal triad?","a":"A branch of the portal vein, a branch of the hepatic artery, and a bile duct."},{"q":"What percentage of the liver's blood flow comes from the portal vein versus the hepatic artery?","a":"The portal vein supplies ~75%; the hepatic artery supplies the rest."},{"q":"In the hepatic lobule, which direction does blood flow, and which direction does bile flow?","a":"Blood flows from the portal triad toward the central vein via sinusoids; bile flows the opposite direction, from hepatocytes to bile canaliculi to the portal triad's bile ducts."},{"q":"What cell type patrols the hepatic sinusoids?","a":"Kupffer cells."},{"q":"What waste product does the liver convert ammonia into for excretion?","a":"Urea."},{"q":"Where do the common bile duct and the main pancreatic duct join?","a":"At the ampulla of Vater."},{"q":"What structures bound the cystic triangle (of Calot), and what important vessel does it contain?","a":"Bounded by the cystic duct, common hepatic duct, and the liver edge; it contains the cystic artery."},{"q":"What are the two pancreatic ducts, and which is the main duct?","a":"The main duct of Wirsung and the accessory duct of Santorini; the duct of Wirsung is the main duct."},{"q":"What hormone stimulates pancreatic bicarbonate secretion, and what hormone stimulates pancreatic enzyme secretion?","a":"Secretin stimulates bicarbonate secretion; CCK stimulates enzyme release."},{"q":"In what form are pancreatic proteases secreted, and why?","a":"As inactive zymogens, to prevent autodigestion of the pancreas."},{"q":"Which artery supplies the foregut, and to what point does it extend?","a":"The celiac trunk; it extends to the major duodenal papilla."},{"q":"Which artery supplies the midgut, and to what point does it extend?","a":"The superior mesenteric artery (SMA); it extends to the transverse colon."},{"q":"Which artery supplies the hindgut, and to what point does it extend?","a":"The inferior mesenteric artery (IMA); it extends to the rectum."},{"q":"What is the enteric nervous system (ENS) sometimes called, and roughly how many neurons does it contain?","a":"The \"second brain\"; it contains roughly 200–600 million neurons."},{"q":"What does the myenteric (Auerbach's) plexus control, and what does the submucosal (Meissner's) plexus control?","a":"The myenteric plexus controls motility; the submucosal plexus controls secretion and blood flow."},{"q":"What percentage of the body's serotonin is produced in the gut, and does it cross the blood-brain barrier?","a":"~90–95%; it does not cross the blood-brain barrier."},{"q":"What is the difference between peristalsis and segmentation?","a":"Peristalsis is a coordinated wave that propels contents forward; segmentation is localized ring contractions that mix chyme without propelling it."},{"q":"Name the \"core three\" classic GI hormones and their cells of origin.","a":"Gastrin (G cells), secretin (S cells), and CCK (I cells)."},{"q":"What hormone triggers the migrating motor complex, and what cells secrete it?","a":"Motilin, secreted by M cells."},{"q":"What is the first-line imaging study for suspected gallstones/RUQ pain, and what nuclear study assesses gallbladder emptying?","a":"Ultrasound is first-line; a HIDA scan assesses gallbladder emptying."},{"q":"What is the gold-standard, first-line imaging study for suspected pancreatitis or a pancreatic mass?","a":"CT abdomen/pelvis."}],"examQuestions":[{"stem":"A 45-year-old woman undergoes CT for suspected appendicitis. The radiologist notes the pancreas lies posterior to the peritoneal cavity and does not move freely during surgical exploration. This same anatomic classification applies to which of the following structures?","options":["Stomach","Spleen","Sigmoid colon","Ascending colon","Jejunum"],"correctIndex":3,"explanations":["Stomach is an intraperitoneal organ.","Spleen is intraperitoneal.","Sigmoid colon is intraperitoneal, suspended by its own mesentery.","Correct — the ascending colon is retroperitoneal, like the pancreas.","Jejunum is intraperitoneal and mobile on its mesentery."],"topic":"Peritoneum"},{"stem":"A patient with a brainstem stroke affecting involuntary swallowing centers has impaired airway protection during meals, with inadequate epiglottic closure over the larynx. Which phase of deglutition is most directly affected?","options":["Pharyngeal phase","Gastric phase","Cephalic phase","Oral phase","Esophageal phase"],"correctIndex":0,"explanations":["Correct — the pharyngeal phase is involuntary and includes epiglottic airway protection.","Gastric phase relates to gastric secretion, not swallowing mechanics.","Cephalic phase relates to gastric secretion, not swallowing mechanics.","The oral phase is voluntary bolus formation, not airway protection.","The esophageal phase is peristaltic transport occurring after airway protection."],"topic":"Oral Cavity/Swallowing"},{"stem":"A surgeon explains that no discrete circular muscle ring exists at the gastroesophageal junction, and that competency of this functional sphincter instead depends on external structures. Which two structures primarily provide this function?","options":["Auerbach and Meissner plexuses","Mucosa and submucosa","Crural diaphragm and the angle of His","Upper esophageal sphincter and cricopharyngeus","Longitudinal muscle layer and adventitia"],"correctIndex":2,"explanations":["These are nerve plexuses controlling motility, not LES support.","These are wall layers, not functional sphincter contributors.","Correct — LES tone comes from the crural diaphragm and the angle of His since there is no true anatomic sphincter.","The UES/cricopharyngeus is a separate, more proximal sphincter.","These are esophageal wall layers, not sphincter-supporting structures."],"topic":"Esophagus"},{"stem":"During upper endoscopy, a gastroenterologist identifies the precise point where nonkeratinized stratified squamous epithelium transitions to simple columnar epithelium. Surveillance biopsies at this landmark are most important for early detection of which condition?","options":["Barrett esophagus","Zenker diverticulum","Eosinophilic esophagitis","Achalasia","Esophageal varices"],"correctIndex":0,"explanations":["Correct — the Z line/squamocolumnar junction is the key landmark for Barrett's surveillance.","Zenker forms in the pharyngoesophageal region via Killian's triangle, unrelated to the Z line.","EoE is diagnosed with biopsies throughout the esophagus, not specifically the Z line.","Achalasia is diagnosed by manometry, not Z-line biopsy.","Varices are diagnosed by direct visualization of dilated veins, not epithelial biopsy."],"topic":"Esophagus"},{"stem":"A researcher studying gastric emptying notes that one region of the stomach is primarily responsible for grinding solid food particles and regulating the rate at which chyme passes into the duodenum. Which region is being described?","options":["Lesser curvature","Cardia","Antrum","Body","Fundus"],"correctIndex":2,"explanations":["Lesser curvature is a curvature landmark, not a functional grinding region.","Cardia is the entry zone near the LES.","Correct — the antrum grinds food and meters gastric emptying.","Body mixes and digests.","Fundus stores swallowed air/food via receptive relaxation."],"topic":"Stomach"},{"stem":"A patient develops chronic atrophic gastritis with loss of a specific gastric gland cell type, resulting in both impaired acid production and impaired absorption of a specific vitamin. Destruction of which cell type explains both findings?","options":["Chief cells","Parietal cells","Goblet cells","Mucous neck cells","G cells"],"correctIndex":1,"explanations":["Chief cells secrete pepsinogen, unrelated to vitamin absorption.","Correct — parietal cells secrete both HCl and intrinsic factor, the latter required for B12 absorption.","Goblet cells are found in the intestine/colon, not the stomach.","Mucous cells secrete protective mucus/bicarbonate.","G cells secrete gastrin, a hormone, not acid or intrinsic factor."],"topic":"Stomach"},{"stem":"A gastric biopsy shows a cell type predominantly located in the fundus that is stimulated by vagal input and gastrin. This cell secretes an inactive proenzyme that requires an acidic environment for activation. Which cell type and product is being described?","options":["Chief cells secreting pepsinogen","Foveolar cells secreting mucus","G cells secreting gastrin","Mucous cells secreting bicarbonate","Parietal cells secreting HCl"],"correctIndex":0,"explanations":["Correct — chief cells secrete pepsinogen, a proenzyme converted to pepsin by HCl.","Foveolar cells secrete surface mucus, not a proenzyme.","G cells secrete a hormone, not a digestive proenzyme.","Mucous cells provide protection, not digestion.","Parietal cells secrete HCl directly, not a proenzyme."],"topic":"Stomach"},{"stem":"A patient begins salivating and secreting gastric acid at the mere sight and smell of a favorite meal, before any food has been swallowed. Which phase of gastric secretion is responsible?","options":["Migrating motor complex","Cephalic phase","Intestinal phase","Gastric phase","Esophageal phase"],"correctIndex":1,"explanations":["The MMC is an interdigestive motility pattern, not a secretory phase.","Correct — the cephalic phase is triggered by sight/smell/taste and mediated by vagal input.","Intestinal phase provides feedback inhibition once chyme reaches the intestine.","Gastric phase is triggered by distension once food reaches the stomach.","There is no distinct \\\"esophageal phase\\\" of gastric secretion."],"topic":"Stomach"},{"stem":"A patient undergoes gastrectomy, and the surgeon ligates the primary arterial trunk that gives rise to the left and right gastric arteries as well as the gastroepiploic vessels. Which artery has been ligated?","options":["Inferior mesenteric artery","Superior mesenteric artery","Splenic artery alone","Celiac trunk","Common hepatic artery alone"],"correctIndex":3,"explanations":["The IMA supplies the hindgut.","The SMA supplies the midgut, not the stomach's primary supply.","The splenic artery is only one branch off the celiac trunk, not the full supply.","Correct — the celiac trunk gives rise to the gastric and gastroepiploic arteries.","The common hepatic artery is also just one celiac branch."],"topic":"Stomach"},{"stem":"A trauma patient sustains a posterior abdominal injury, and imaging reveals a laceration to a segment of bowel that is fixed in place and does not move freely with the mesentery. Endoscopy later shows this segment contains glands that neutralize acidic chyme. Which structure is most likely injured?","options":["Ileum","Jejunum","Transverse colon","Sigmoid colon","Duodenum"],"correctIndex":4,"explanations":["Ileum is also intraperitoneal and mobile.","Jejunum is intraperitoneal and mobile.","Transverse colon is intraperitoneal.","Sigmoid colon is intraperitoneal.","Correct — the duodenum is retroperitoneal/fixed and contains Brunner's glands that neutralize chyme."],"topic":"Small Intestine"},{"stem":"A patient with pancreatitis is found on ERCP to have obstruction at the site where the common bile duct and main pancreatic duct jointly empty into the duodenum. What is this structure called?","options":["Ligament of Treitz","Major papilla (ampulla of Vater)","Ileocecal valve","Duodenal bulb","Pylorus"],"correctIndex":1,"explanations":["The ligament of Treitz marks the duodenojejunal flexure, not a drainage site.","Correct — the major papilla/ampulla of Vater is where bile and pancreatic secretions enter the duodenum.","The ileocecal valve is at the terminal ileum/cecum junction.","The duodenal bulb is the proximal smooth segment, unrelated to duct drainage.","The pylorus is the gastric outlet, proximal to the duodenum."],"topic":"Small Intestine"},{"stem":"A segment of resected small bowel shows a thick wall with tall, densely packed circular folds and few but long vascular arcades. Which segment was most likely resected?","options":["Jejunum","Sigmoid colon","Cecum","Duodenum","Ileum"],"correctIndex":0,"explanations":["Correct — the jejunum has a thicker wall, taller plicae circulares, and fewer/longer vascular arcades.","The sigmoid colon has haustra, not plicae circulares.","The cecum is proximal colon and lacks plicae circulares.","The duodenum has circular folds beginning but is defined by Brunner's glands/C-shape, not this arcade pattern.","The ileum has a thinner wall, more/shorter arcades, and Peyer's patches."],"topic":"Small Intestine"},{"stem":"A patient who underwent surgical resection of the terminal ileum several years ago now presents with fatigue, glossitis, and a macrocytic anemia. Which mechanism best explains this presentation?","options":["Loss of parietal cells needed for iron absorption","Loss of Brunner's glands needed for chyme neutralization","Loss of the ileal site required for absorption of the vitamin B12–intrinsic factor complex","Loss of gastric chief cells needed for protein digestion","Loss of colonic bacteria needed for vitamin K synthesis"],"correctIndex":2,"explanations":["Iron is absorbed in the duodenum/jejunum, and parietal cells make intrinsic factor rather than directly absorbing iron.","Brunner's glands are duodenal and unrelated to B12 absorption.","Correct — B12 absorption specifically requires intrinsic factor and occurs in the terminal ileum.","Chief cells relate to protein digestion, not B12 absorption.","Vitamin K synthesis relates to colonic bacteria, not macrocytic anemia from ileal loss."],"topic":"Small Intestine"},{"stem":"A pathologist examines a colonic biopsy and notes flat mucosa with straight crypts and abundant goblet cells, but no finger-like projections extending into the lumen. This is an expected normal finding because:","options":["The colon lacks villi since its main role is water/electrolyte absorption rather than nutrient absorption","Straight crypts indicate malignant transformation","This pattern is unique to the duodenum","The colon relies on villi for water absorption","Goblet cells are only found in diseased colonic tissue"],"correctIndex":0,"explanations":["Correct — the colon has flat mucosa with straight crypts since it specializes in water/electrolyte absorption rather than nutrient absorption requiring villi.","Straight crypts are the normal colonic architecture.","This description is specific to the colon, not the duodenum, which does have villi.","The colon does not have villi at all.","Goblet cells are a normal, abundant colonic feature."],"topic":"Colon/Rectum"},{"stem":"A surgical resident is taught that a fairly constant anatomic landmark, located one-third of the distance from the anterior superior iliac spine to the umbilicus, corresponds to the base of a structure containing abundant lymphoid tissue. Which structure is being described?","options":["Ileocecal valve","Meckel diverticulum","Cecum","Vermiform appendix","Sigmoid colon"],"correctIndex":3,"explanations":["The ileocecal valve is a separate structure at the terminal ileum.","Meckel diverticulum has variable location along the ileum.","The cecum is the proximal colonic pouch, not this specific landmark.","Correct — this describes McBurney's point, corresponding to the appendix base.","The sigmoid colon is not associated with this landmark."],"topic":"Colon/Rectum"},{"stem":"A patient with an intact sacral spinal cord but a lumbar spinal cord injury retains the reflexive urge and ability to relax the internal anal sphincter for defecation but loses voluntary control over holding stool until an appropriate time. Which innervation pathway has been disrupted?","options":["Vagus nerve","Pelvic splanchnic nerves (S2–S4)","Lumbar splanchnic nerves (L1–L2), the somatic pathway for continence","Celiac plexus","Myenteric plexus"],"correctIndex":2,"explanations":["The vagus nerve is not the continence pathway described here.","Pelvic splanchnic nerves (S2-S4) mediate the involuntary defecation reflex, which remains intact per the vignette.","Correct — lumbar splanchnic somatic fibers (L1-L2) maintain continence by contracting the internal sphincter and relaxing the rectal wall; injury here impairs voluntary control.","The celiac plexus is sympathetic innervation for foregut/midgut structures, unrelated to rectal continence.","The myenteric plexus controls motility broadly, not specifically continence."],"topic":"Colon/Rectum"},{"stem":"A hepatobiliary surgeon identifies the structure separating the right and left hepatic lobes on the diaphragmatic surface and anchoring the liver to the anterior abdominal wall. Which structure is this?","options":["Falciform ligament","Ligamentum teres alone","Porta hepatis","Cystic triangle","Couinaud segment boundary"],"correctIndex":0,"explanations":["Correct — the falciform ligament divides the right/left lobes on the diaphragmatic surface and anchors the liver to the abdominal wall.","The ligamentum teres is a remnant within the falciform ligament, not the full described structure.","The porta hepatis is on the visceral surface, containing the portal vein, hepatic artery, and bile duct.","The cystic triangle relates to the gallbladder region, not lobar division.","Couinaud segments are functional divisions for surgical planning, not this diaphragmatic landmark."],"topic":"Liver"},{"stem":"A hepatologist explains that approximately three-quarters of the liver's blood supply arrives already depleted of oxygen but rich in absorbed nutrients, reaching the liver before the rest of the body. Which vessel is being described?","options":["Portal vein","Inferior vena cava","Hepatic vein","Splenic artery","Hepatic artery"],"correctIndex":0,"explanations":["Correct — the portal vein (SMV + splenic vein) supplies ~75% of hepatic blood flow, nutrient-rich and oxygen-poor.","The IVC returns systemic blood to the heart, unrelated to first-pass delivery.","The hepatic vein carries blood away from the liver, not into it.","The splenic artery supplies the spleen and feeds into the splenic vein but is not itself the portal vein.","The hepatic artery supplies the remaining ~25% and is oxygen-rich, not nutrient-laden."],"topic":"Liver"},{"stem":"A histology student examines a liver lobule and notes a structure at the corners of the lobule composed of three distinct vessel/duct types. Which structure and components are being described?","options":["Couinaud segment — surgical planning unit","Central vein — hepatic venule only","Sinusoid — capillaries only","Portal triad — portal vein branch, hepatic artery branch, bile duct","Kupffer cell cluster — immune cells only"],"correctIndex":3,"explanations":["Couinaud segments are surgical anatomy divisions, unrelated to lobule microanatomy.","The central vein is a single vessel at the lobule's center, not the corners, and is not composed of three parts.","Sinusoids are the capillary channels within the lobule, not a triad structure.","Correct — the portal triad sits at the lobule corners and includes a portal vein branch, hepatic artery branch, and bile duct.","Kupffer cells are immune cells lining sinusoids, not a triad."],"topic":"Liver"},{"stem":"In the hepatic lobule, a physiology student notes that one substance flows from the hepatocytes outward toward the portal triad, opposite to the direction of blood flow. What is this substance?","options":["Oxygenated blood","Lymph","Portal venous blood","Glycogen","Bile"],"correctIndex":4,"explanations":["Oxygenated blood flows toward the central vein, not away from it.","Lymph is not the substance described in this bidirectional lobular flow pattern.","Portal venous blood flows toward the central vein, the same direction as arterial blood.","Glycogen is stored within hepatocytes, not transported in this directional pattern.","Correct — bile flows from hepatocytes through canaliculi toward the portal triad's bile ducts, opposite to blood flow."],"topic":"Liver"},{"stem":"A patient with fulminant liver failure develops confusion and asterixis. Laboratory studies reveal a markedly elevated nitrogenous compound that the liver normally converts into a less toxic, water-soluble waste product for renal excretion. Which conversion process is impaired?","options":["Glycogen to glucose conversion","Bilirubin conjugation","Cholesterol to bile salt conversion","Ammonia to urea conversion","Albumin synthesis"],"correctIndex":3,"explanations":["Glycogen-to-glucose conversion relates to glucose homeostasis, not ammonia handling.","Bilirubin conjugation relates to jaundice, not the confusion/asterixis described.","Bile salt synthesis relates to digestion, not this neurologic presentation.","Correct — impaired ammonia-to-urea conversion causes hyperammonemia, contributing to hepatic encephalopathy (confusion, asterixis).","Albumin synthesis failure would cause edema/coagulopathy, not directly this neurologic picture."],"topic":"Liver"},{"stem":"A newborn develops jaundice, and the pediatrician orders labs to determine whether the bilirubin is primarily unconjugated (indirect) or conjugated (direct) in order to localize the underlying process. This distinction is clinically useful because:","options":["This distinction has no diagnostic value","Indirect and direct bilirubin have identical clinical implications","Only direct bilirubin is produced from heme breakdown","Indirect bilirubin is excreted directly into bile without liver involvement","The direct/indirect split helps localize whether the defect is pre-hepatic, hepatic, or post-hepatic"],"correctIndex":4,"explanations":["This distinction is explicitly useful for localizing pathology, so this is incorrect.","They have different implications depending on the ratio, so this is incorrect.","Indirect (unconjugated) bilirubin, not direct, is the initial product of heme breakdown.","Indirect bilirubin must be conjugated by the liver before biliary excretion.","Correct — the direct/indirect split helps clinically localize the cause of jaundice."],"topic":"Liver"},{"stem":"A general surgery resident is taught to identify a triangular region bounded by the cystic duct, common hepatic duct, and liver edge before ligating a specific artery during a laparoscopic procedure. Which artery lies within this triangle?","options":["Left gastric artery","Splenic artery","Cystic artery","Gastroduodenal artery","Hepatic artery proper"],"correctIndex":2,"explanations":["The left gastric artery supplies the stomach, unrelated to this landmark.","The splenic artery supplies the spleen/pancreas, not within this triangle.","Correct — the cystic triangle (of Calot) contains the cystic artery, a key landmark during cholecystectomy.","The gastroduodenal artery runs posterior to the duodenum, unrelated to this triangle.","The hepatic artery proper travels within the porta hepatis but is not the vessel specifically contained in this triangle."],"topic":"Biliary"},{"stem":"A patient with a tumor at the site where the common bile duct and main pancreatic duct converge before entering the duodenum develops both jaundice and pancreatic enzyme deficiency simultaneously. Where is this tumor located?","options":["Pylorus","Duodenal bulb","Ampulla of Vater","Cystic triangle","Ileocecal valve"],"correctIndex":2,"explanations":["The pylorus is the gastric outlet, unrelated to ductal drainage.","The duodenal bulb is proximal duodenum, not the ductal convergence point.","Correct — the ampulla of Vater is where both ducts converge, explaining combined biliary and pancreatic obstruction.","The cystic triangle contains the cystic artery, not the ductal convergence.","The ileocecal valve is unrelated to biliary/pancreatic anatomy."],"topic":"Biliary"},{"stem":"A patient with pancreas divisum is found to have persistent drainage primarily through a minor papilla rather than the main channel. Which duct is being used for drainage in this anatomic variant?","options":["Common hepatic duct","Duct of Wirsung","Cystic duct","Duct of Santorini","Common bile duct"],"correctIndex":3,"explanations":["The common hepatic duct is a proximal biliary structure.","The duct of Wirsung is the main pancreatic duct draining via the major papilla, not the minor papilla.","The cystic duct connects the gallbladder to the biliary tree.","Correct — the accessory duct of Santorini drains via the minor papilla.","The common bile duct is a biliary structure, not pancreatic."],"topic":"Pancreas"},{"stem":"A researcher administers a hormone to isolated pancreatic ductal cells and observes a marked increase in bicarbonate-rich fluid secretion, while a separate hormone given to acinar cells increases enzyme output. Which hormones are being described, respectively?","options":["Motilin then gastrin","GIP then GLP-1","CCK then secretin","Secretin then CCK","Gastrin then CCK"],"correctIndex":3,"explanations":["Motilin triggers the migrating motor complex, unrelated to these two effects.","GIP/GLP-1 are incretins affecting insulin release, not pancreatic exocrine secretion in this way.","This reverses the correct hormone-target pairing.","Correct — secretin stimulates ductal bicarbonate secretion, while CCK stimulates acinar enzyme secretion.","Gastrin primarily affects gastric acid, not pancreatic bicarbonate."],"topic":"Pancreas"},{"stem":"A researcher notes that pancreatic acinar cells release certain digestive enzymes in an inactive form that must be activated within the intestinal lumen rather than within the gland itself. What is the physiologic purpose of this mechanism?","options":["To activate insulin release","To prevent autodigestion of the pancreas","To increase enzyme concentration","To allow enzymes to function only in an alkaline environment","To enable enzyme storage in the liver"],"correctIndex":1,"explanations":["This is unrelated to insulin, which is an endocrine, not exocrine, function.","Correct — secreting proteases as inactive zymogens prevents the pancreas from digesting itself.","Concentration is not the purpose of zymogen secretion.","Zymogen activation is about location/timing, not solely alkalinity.","Zymogens are not stored in the liver."],"topic":"Pancreas"},{"stem":"A patient develops acute ischemia isolated to a region extending only as far distally as the major duodenal papilla, sparing the rest of the small bowel. Which artery is most likely occluded?","options":["Celiac trunk","Portal vein","Inferior mesenteric artery","Superior mesenteric artery","Splenic vein"],"correctIndex":0,"explanations":["Correct — the celiac trunk supplies the foregut, extending to the major duodenal papilla.","The portal vein carries venous blood to the liver, not arterial supply to the foregut.","The IMA supplies the hindgut (to the rectum), unrelated to this proximal region.","The SMA supplies the midgut, extending to the transverse colon, not limited to the duodenal papilla.","The splenic vein is a venous structure, not arterial supply."],"topic":"Vasculature"},{"stem":"A vascular surgeon explains that ischemic injury extending from the duodenum through the transverse colon corresponds to occlusion of a single named artery. Which artery is this?","options":["Celiac trunk","Splenic artery","Superior mesenteric artery","Inferior mesenteric artery","Common hepatic artery"],"correctIndex":2,"explanations":["The celiac trunk supplies only to the major duodenal papilla (foregut).","The splenic artery is a celiac branch supplying the spleen.","Correct — the SMA supplies the midgut, extending to the transverse colon.","The IMA supplies the hindgut (rectum), more distal than described.","The common hepatic artery is also a celiac branch, supplying the liver."],"topic":"Vasculature"},{"stem":"A gastroenterology fellow explains to a patient that the gut contains an extensive independent neuronal network capable of coordinating digestion even without direct input from the brain or spinal cord. Roughly how many neurons compose this network, and what is it commonly called?","options":["5–10 billion neurons; the \\\"gut cortex\\\"","1–2 million neurons; the \\\"vagal complex\\\"","200–600 million neurons; the \\\"second brain\\\"","10,000–50,000 neurons; the \\\"local ganglion\\\"","50,000–100,000 neurons; the \\\"myenteric cortex\\\""],"correctIndex":2,"explanations":["This substantially overestimates the neuron count.","This underestimates the neuron count and mislabels the network.","Correct — the ENS contains 200-600 million neurons and is termed the \\\"second brain.\\\"","This underestimates the actual neuron count described.","This underestimates the neuron count and uses an incorrect name."],"topic":"ENS/Motility/Hormones"},{"stem":"A pharmacologic agent selectively damages the neural plexus located between the muscle layers of the bowel wall, resulting in impaired coordinated contraction and relaxation needed for forward movement of contents. Which plexus has been affected, and what function is lost?","options":["Meissner plexus — blood flow only","Meissner plexus — secretion","Auerbach plexus — mucus secretion","Celiac plexus — sympathetic inhibition","Auerbach plexus — motility"],"correctIndex":4,"explanations":["This misattributes blood flow regulation while ignoring the muscle-layer injury and correct submucosal location of Meissner's plexus.","The Meissner (submucosal) plexus controls secretion/blood flow, not motility.","The Auerbach plexus does not control mucus secretion.","The celiac plexus is extrinsic sympathetic innervation, not an intrinsic ENS plexus.","Correct — the myenteric (Auerbach) plexus, located between muscle layers, controls motility."],"topic":"ENS/Motility/Hormones"},{"stem":"A patient undergoes truncal vagotomy for refractory peptic ulcer disease. Which physiologic change would be expected postoperatively?","options":["Increased gastric acid secretion and accelerated gastric emptying","No change in gastric physiology, since the vagus does not affect the stomach","Increased bile salt synthesis only","Decreased gastric acid secretion and potentially delayed gastric emptying","Selective loss of sympathetic inhibition only"],"correctIndex":3,"explanations":["Vagotomy reduces, not increases, acid secretion, and can impair rather than accelerate emptying.","The vagus is a major driver of gastric physiology, making this incorrect.","Bile salt synth
