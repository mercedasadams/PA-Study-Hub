utaneous transhepatic cholangiography (PTC) is an alternative.","level":0}]},{"label":"Treatment","bullets":[{"text":"Start IV antibiotics; IV fluids, antiemetics.","level":0},{"text":"ERCP: endoscopic sphincterotomy with stone extraction and/or stent insertion for biliary drainage.","level":0},{"text":"Percutaneous cholecystostomy tube: considered for unstable patients or if ERCP is not tolerated/unsuccessful.","level":0},{"text":"Open surgical decompression with drain-tube insertion if other methods fail.","level":0}]}]},{"name":"Acute Pancreatitis","sections":[{"label":"Definition / Etiology","bullets":[{"text":"Inflammation of the pancreas caused by acinar cell injury leading to intracellular activation of pancreatic enzymes and autodigestion of the pancreas.","level":0},{"text":"Etiologies: gallstones (most common), alcohol abuse.","level":0},{"text":"Medications: thiazides, protease inhibitors, estrogens, exenatide, valproic acid.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Epigastric pain radiating to the back (or other quadrant) — worsened when supine or with eating, relieved by leaning forward/sitting/fetal position.","level":0},{"text":"Fever, nausea/vomiting, abdominal distention; shock symptoms if severe.","level":0},{"text":"PE: epigastric tenderness, tachycardia, abdominal distention, fever, dehydration, anorexia.","level":0},{"text":"Necrotizing (hemorrhagic) pancreatitis: Cullen's sign (periumbilical ecchymosis) and Grey Turner's sign (flank ecchymosis).","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Lipase/amylase elevated ≥3× ULN (lipase more specific).","level":0},{"text":"CBC with differential (leukocytosis).","level":0},{"text":"CMP: renal function, liver function (ALT ≥3× ULN suggests gallstone pancreatitis).","level":0},{"text":"Hypocalcemia (necrotic fat binds calcium); hyperglycemia.","level":0},{"text":"Lactic acid/procalcitonin.","level":0},{"text":"**CT abdomen/pelvis with contrast — diagnostic of choice**: enlarged pancreas, indistinct margins.","level":0},{"text":"Abdominal US: to assess for gallstones and bile duct dilation.","level":0}]},{"label":"Diagnostic Criteria (need 2 of 3)","bullets":[{"text":"Acute onset of severe epigastric pain radiating to the back.","level":0},{"text":"Serum lipase/amylase elevated ≥3× ULN.","level":0},{"text":"Characteristic findings of pancreatitis on imaging.","level":0},{"text":"Imaging may not be required if the first two criteria are already met.","level":0}]},{"label":"Treatment","bullets":[{"text":"\"Rest the pancreas\": NPO.","level":0},{"text":"Aggressive IV fluid hydration (~10 mL/kg bolus) and electrolyte repletion.","level":0},{"text":"Pain control (opioids); insulin as indicated; antiemetics (ondansetron).","level":0},{"text":"Consider TPN (total parenteral nutrition) if prolonged NPO status.","level":0},{"text":"Antibiotics typically not needed unless infection is suspected.","level":0},{"text":"Advance diet as tolerated over the next 2–3 days.","level":0},{"text":"ERCP if indicated (e.g., gallstone pancreatitis with obstruction).","level":0}]}]},{"name":"Chronic Pancreatitis","sections":[{"label":"Definition / Etiology","bullets":[{"text":"Progressive inflammatory changes to the pancreas leading to loss of endocrine and exocrine function.","level":0},{"text":"Most common cause: alcohol abuse (adults); cystic fibrosis is the most common cause in children.","level":0},{"text":"Other causes: familial, gallstones, tumors, idiopathic.","level":0},{"text":"Signs/symptoms can take time to become apparent.","level":0}]},{"label":"Clinical Presentation","bullets":[{"text":"Abdominal pain (epigastric/back pain), nausea/vomiting, anorexia, steatorrhea (excess fat in stool causing floating stools).","level":0},{"text":"**Classic triad: pancreatic calcifications + steatorrhea + diabetes mellitus.**","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Amylase/lipase may be normal or even low.","level":0},{"text":"CBC with differential; CMP (hyperglycemia).","level":0},{"text":"**CT abdomen/pelvis with contrast — modality of choice**: calcifications of the pancreas with dilated pancreatic/biliary ducts.","level":0},{"text":"Abdominal x-ray: calcified pancreas.","level":0},{"text":"Consider cardiac workup, especially in populations at risk (e.g., alcohol use disorder).","level":0}]},{"label":"Treatment","bullets":[{"text":"Pain control: NSAIDs, acetaminophen.","level":0},{"text":"Lifestyle modification: alcohol cessation, low-fat diet, vitamin supplementation.","level":0},{"text":"Pancreatic enzyme supplementation (e.g., Creon).","level":0},{"text":"Treat resultant diabetes (metformin, insulin, etc.).","level":0},{"text":"Complications: diabetes, osteoporosis/osteopenia, increased risk of pancreatic adenocarcinoma.","level":0},{"text":"Patients remain at risk for acute flares with acute-pancreatitis-like symptoms.","level":0}]}]},{"name":"Pancreatic Malignancies","sections":[{"label":"Epidemiology","bullets":[{"text":"Highly lethal malignancy — 3rd leading cause of cancer-related death in the U.S.","level":0},{"text":"5-year survival: 30% for node-negative disease, 10% for node-positive disease.","level":0},{"text":"60–70% of pancreatic neoplasms occur in the head of the pancreas; typically progresses from pancreatic intraepithelial neoplasia (PanIN).","level":0}]},{"label":"Histologic Types","bullets":[{"text":"Exocrine neoplasms: adenocarcinoma (most common, 85%, arising from ductal epithelium, average survival ~6 months); ampullary/duodenal carcinoma; cystadenoma/cystadenocarcinoma (generally better prognosis).","level":0},{"text":"Endocrine neoplasms (pancreatic neuroendocrine tumors/NETs): account for only ~5% of pancreatic neoplasms.","level":0}]},{"label":"Risk Factors","bullets":[{"text":"Smoking history (2× risk); obesity (BMI >30, increases risk ~20%); diabetes (mechanism not fully understood).","level":0},{"text":"History of chronic pancreatitis; family history of pancreatic cancer; men slightly more at risk than women.","level":0}]},{"label":"Clinical Presentation — Symptoms","bullets":[{"text":"Asthenia (abnormal weakness), weight loss, anorexia, abdominal/epigastric pain.","level":0},{"text":"Dark urine (can be first sign of jaundice), nausea, back pain, diarrhea, vomiting, steatorrhea.","level":0}]},{"label":"Clinical Presentation — Signs","bullets":[{"text":"**Jaundice (55%) — classically \"painless jaundice.\"**","level":0},{"text":"Hepatomegaly (39%), RUQ mass, cachexia, epigastric mass, ascites.","level":0},{"text":"**Courvoisier's sign**: nontender but palpable, distended gallbladder at the right costal margin.","level":0}]},{"label":"Signs of Metastatic Disease","bullets":[{"text":"Abdominal mass (late finding), abdominal ascites.","level":0},{"text":"**Virchow's node**: left supraclavicular lymphadenopathy.","level":0},{"text":"**Sister Mary Joseph's node**: palpable periumbilical mass.","level":0},{"text":"**Trousseau syndrome**: migratory thrombophlebitis.","level":0},{"text":"Most common metastatic sites: liver, peritoneum, lungs, and (less frequently) bone.","level":0}]},{"label":"Diagnostics","bullets":[{"text":"Patients with jaundice, epigastric pain, and weight loss initially get an abdominal US — evaluates for masses, bile duct obstruction, liver abnormalities.","level":0},{"text":"**CT scan with contrast — best initial diagnostic study** (also rules out pancreatitis).","level":0},{"text":"ERCP: usually both diagnostic and therapeutic.","level":0},{"text":"MRCP: alternative to ERCP, does not require ductal contrast injection (less morbidity).","level":0},{"text":"Tumor marker CA 19-9: imperfect sensitivity/specificity (can be elevated in other benign hepatobiliary disorders); used mainly for staging and postoperative evaluation.","level":0},{"text":"**Biopsy required to confirm diagnosis**: percutaneous US/CT-guided FNA (small risk of tumor seeding, can compromise future surgery) vs. endoscopic US-guided FNA (EUS-FNA) — the best modality for obtaining tissue.","level":0}]},{"label":"Staging","bullets":[{"text":"Uses the TNM staging system.","level":0},{"text":"CT/PET scan typically used to determine metastasis.","level":0},{"text":"Most symptomatic patients already have advanced disease, often with metastasis.","level":0},{"text":"Staging determines whether the tumor is resectable.","level":0}]},{"label":"Treatment","bullets":[{"text":"Treatment is determined by tumor stage and presence of metastasis.","level":0},{"text":"Tumor confined to the head/duodenal region: **Whipple procedure (pancreaticoduodenectomy)** is the usual first treatment; average 5-year survival post-Whipple is ~20–25%.","level":0},{"text":"Tail-end tumors: distal pancreatectomy.","level":0},{"text":"Total pancreatectomy: requires lifelong insulin and enzyme replacement.","level":0},{"text":"Blood vessel resection if active tumor involvement.","level":0},{"text":"If surgery is not applicable: systemic chemotherapy ± radiation.","level":0},{"text":"~40% of patients present with unresectable tumors; systemic chemotherapy indicated if distant metastasis present.","level":0},{"text":"Some initially borderline-resectable patients become surgical candidates after chemotherapy reduces tumor size; many patients also pursue clinical trials given limited long-term success of standard therapies.","level":0}]}]}],"questions":[{"q":"What is the definition of hepatitis?","a":"Inflammation of the liver."},{"q":"Name four etiologies of hepatitis discussed in lecture.","a":"Viral infection (Hep A–E), alcohol toxification, drug-induced (e.g., acetaminophen/Tylenol), and autoimmune process."},{"q":"What physical exam finding describes a flapping hand tremor with wrist extension seen in fulminant hepatitis and hepatic encephalopathy?","a":"Asterixis."},{"q":"What is the primary route of transmission for Hepatitis A?","a":"The fecal-oral route."},{"q":"Is a vaccine available for Hepatitis A, and what is the dosing schedule?","a":"Yes — 2 doses given 6–12 months apart."},{"q":"What is the most common cause of acute viral hepatitis globally?","a":"Hepatitis E."},{"q":"What unique co-factor does Hepatitis D require in order to become infectious?","a":"Hepatitis B surface antigen (HBsAg)."},{"q":"Differentiate Hepatitis D co-infection from superinfection.","a":"Co-infection is simultaneous acute Hep B and Hep D infection (no prior Hep B exposure); superinfection is Hep D infecting a patient who is already a chronic Hep B carrier."},{"q":"What are the routes of transmission for Hepatitis B?","a":"Percutaneous, sexual, parenteral, and perinatal (childbirth)."},{"q":"On Hepatitis B serologies, what pattern of HBsAg, anti-HBs, and anti-HBc indicates a resolved infection?","a":"HBsAg negative, anti-HBs positive, anti-HBc IgG positive (HBeAg and anti-HBe both negative)."},{"q":"What are the first-line antiviral medications for chronic Hepatitis B?","a":"Entecavir and tenofovir."},{"q":"What is the most common route of transmission for Hepatitis C?","a":"IV drug use."},{"q":"What percentage of acute Hepatitis C infections can progress to chronic hepatitis?","a":"Up to 85%."},{"q":"What are the two first-line oral regimens for Hepatitis C treatment?","a":"Glecaprevir-pibrentasvir for 8 weeks, or sofosbuvir-velpatasvir for 12 weeks."},{"q":"Before starting antiviral treatment for Hepatitis C, which other viral hepatitis must be screened for, and why?","a":"Hepatitis B — treatment can reactivate Hepatitis B."},{"q":"What is the definition of cirrhosis?","a":"A late stage of progressive hepatic fibrosis characterized by distortion of the hepatic architecture and formation of regenerative nodules."},{"q":"What is the most common cause of cirrhosis discussed in lecture?","a":"Chronic Hepatitis C."},{"q":"Name three physical exam findings associated with cirrhosis.","a":"Any three of: ascites, spider angioma/telangiectasia, hepatosplenomegaly, gynecomastia, muscle wasting, jaundice."},{"q":"What is the ultimate curative treatment for cirrhosis?","a":"Liver transplant."},{"q":"What medication class is first-line for treating pruritus in cirrhosis?","a":"Bile acid sequestrant (cholestyramine)."},{"q":"What is hepatic encephalopathy?","a":"Neuropsychiatric abnormalities resulting from the liver's failure to detoxify gut-derived agents (ammonia) due to hepatocellular dysfunction and/or portosystemic shunting."},{"q":"What physical exam finding describes foul breath odor associated with hepatic encephalopathy?","a":"Fetor hepaticus."},{"q":"What is the first-line treatment for lowering ammonia levels in hepatic encephalopathy?","a":"Lactulose or lactitol."},{"q":"What is the most common cause of non-alcoholic fatty liver disease (NAFLD)?","a":"Obesity."},{"q":"What is the more severe form of NAFLD, characterized by liver cell injury/death and inflammation, called?","a":"Nonalcoholic steatohepatitis (NASH), also referred to as MASH."},{"q":"What class of medications is used to treat NAFLD/NASH in patients with stage 2 or greater fibrosis?","a":"GLP-1 based therapies (e.g., semaglutide, tirzepatide, liraglutide)."},{"q":"What is the most common cause of portal hypertension?","a":"Cirrhosis of the liver."},{"q":"What does the \"ABCDE\" mnemonic represent in classic portal hypertension?","a":"Ascites, Bleeding, Caput medusae, Diminished liver (atrophy), Enlarged spleen."},{"q":"What hepatic venous pressure gradient (HVPG) value is typically considered clinically significant for portal hypertension?","a":"Greater than 10 mmHg."},{"q":"What procedure involves placing a shunt between veins to relieve pressure on the portal vein?","a":"TIPS (transjugular intrahepatic portosystemic shunt)."},{"q":"What is the most common risk factor for hepatocellular carcinoma (HCC)?","a":"Cirrhosis."},{"q":"What is the recommended screening interval and imaging modality for high-risk HCC patients?","a":"Abdominal ultrasound every 6 months."},{"q":"What tumor marker aids in the diagnosis and treatment surveillance of HCC?","a":"Alpha-fetoprotein (AFP)."},{"q":"Before starting atezolizumab + bevacizumab for HCC, what must be screened for?","a":"Esophageal varices, due to increased bleeding risk."},{"q":"What is the most common type of gallstone?","a":"Cholesterol stones (~90%)."},{"q":"What is the classic presentation of biliary colic?","a":"RUQ or epigastric pain radiating to the right shoulder blade, lasting about 30 minutes to a few hours, often after a large/fatty meal."},{"q":"What is the first-line imaging study for cholelithiasis?","a":"Abdominal/RUQ ultrasound."},{"q":"What physical exam finding is classic for acute cholecystitis?","a":"A positive Murphy sign."},{"q":"What is the most common organism causing cholecystitis?","a":"E. coli."},{"q":"Within what timeframe is cholecystectomy preferred for acute cholecystitis?","a":"Within 72 hours."},{"q":"What is choledocholithiasis, and what two complications can it cause?","a":"Gallstones present in the common bile duct; can cause pancreatitis or cholangitis."},{"q":"What is the diagnostic and therapeutic procedure of choice for choledocholithiasis?","a":"ERCP (endoscopic retrograde cholangiopancreatography)."},{"q":"What does Charcot's triad consist of?","a":"Fever with chills, RUQ pain, and jaundice."},{"q":"What does Reynolds' pentad add to Charcot's triad?","a":"Hypotension (shock) and altered mental status."},{"q":"What is the gold standard diagnostic test for ascending cholangitis?","a":"Cholangiography via ERCP."},{"q":"What are the two most common causes of acute pancreatitis?","a":"Gallstones and alcohol abuse."},{"q":"What lipase/amylase lab finding supports a diagnosis of acute pancreatitis?","a":"Lipase and/or amylase elevated 3x the upper limit of normal or greater."},{"q":"What physical exam findings are associated with necrotizing (hemorrhagic) pancreatitis?","a":"Cullen's sign (periumbilical ecchymosis) and Grey Turner's sign (flank ecchymosis)."},{"q":"What is the classic triad of chronic pancreatitis?","a":"Pancreatic calcifications, steatorrhea, and diabetes mellitus."},{"q":"What is the most common histologic type of pancreatic cancer, and what surgical procedure is used for tumors confined to the head of the pancreas?","a":"Adenocarcinoma; the Whipple procedure (pancreaticoduodenectomy)."}],"examQuestions":[{"stem":"A 40-year-old man presents with fatigue, anorexia, and nausea. Labs show AST and ALT both elevated above 500. According to lecture, this transaminitis pattern is more consistent with which type of process?","options":["Acute hepatic injury","Pancreatic injury only","Isolated biliary obstruction without hepatocyte injury","Chronic hepatic injury","Normal liver function"],"correctIndex":0,"explanations":["Correct — transaminases elevated above 500 are more typical of an acute hepatic process, whereas chronic hepatitis usually shows levels below 500.","This pattern reflects hepatocellular injury, not primarily pancreatic injury.","Isolated biliary obstruction would more classically show a cholestatic pattern (ALP/GGT elevation) rather than this degree of transaminitis.","Chronic hepatitis is more associated with transaminase elevations below 500, not this pattern.","This degree of transaminitis is clearly abnormal, not normal liver function."],"topic":"Hepatitis Overview"},{"stem":"A patient with fulminant hepatitis develops asterixis, jaundice, and coagulopathy. Which additional laboratory finding would be expected given the liver's loss of synthetic and metabolic function, according to lecture?","options":["Hyperglycemia from increased gluconeogenesis","Elevated serum albumin","Shortened PT/INR","Decreased serum ammonia","Hypoglycemia from decreased hepatic gluconeogenesis"],"correctIndex":4,"explanations":["The liver's synthetic dysfunction leads to decreased, not increased, gluconeogenesis.","Albumin, a hepatic synthetic product, would be expected to decrease, not increase.","PT/INR would be prolonged (elevated), not shortened, reflecting impaired synthesis of clotting factors.","Ammonia would be elevated, not decreased, contributing to encephalopathy risk.","Correct — decreased hepatic gluconeogenesis in fulminant hepatitis leads to hypoglycemia."],"topic":"Hepatitis Overview"},{"stem":"A 25-year-old man who works at a daycare center presents with a 3-week history of nausea, RUQ pain, and now dark urine and pale stools. Serology shows positive IgM anti-HAV. Which statement about this diagnosis is most accurate according to lecture?","options":["No vaccine is available for prevention","Transmission is primarily fecal-oral, and most cases are mild and self-limited","This virus commonly leads to chronic hepatitis","This infection is most common in developed countries","Transmission is primarily via the parenteral route"],"correctIndex":1,"explanations":["A Hepatitis A vaccine is available, given as 2 doses 6–12 months apart.","Correct — Hepatitis A is transmitted primarily via the fecal-oral route, and most patients have mild, self-limited disease.","Hepatitis A does not commonly progress to chronic hepatitis; it is typically self-limited.","Hepatitis A has the highest incidence in developing countries, not developed countries.","Hepatitis A is transmitted primarily via the fecal-oral route, not parenterally."],"topic":"Hepatitis A"},{"stem":"A pregnant woman develops acute Hepatitis A infection during her third trimester. According to lecture, which statement about her risk during pregnancy is most accurate?","options":["Hepatitis A always requires termination of pregnancy","Pregnancy has no effect on Hepatitis A outcomes","Pregnant women have a high risk of pre-term or gestational complications","Hepatitis A during pregnancy always causes fulminant hepatic failure","Hepatitis A cannot be diagnosed during pregnancy"],"correctIndex":2,"explanations":["Termination is not a described requirement for Hepatitis A infection.","Pregnancy is specifically noted to carry higher complication risk with this infection.","Correct — pregnant women with Hepatitis A have a high risk of pre-term or gestational complications.","Fulminant hepatic failure is not described as an inevitable outcome in pregnancy.","Standard serologic diagnostic testing remains applicable during pregnancy."],"topic":"Hepatitis A"},{"stem":"A 33-year-old man returns from travel abroad with jaundice, malaise, and elevated transaminases after consuming contaminated water. Serology confirms IgM anti-HEV. According to lecture, this virus is notable for being which of the following?","options":["Associated with a 50% rate of fulminant hepatitis","Curable only with antiviral therapy","The rarest cause of acute viral hepatitis worldwide","The most common cause of acute viral hepatitis globally","Exclusively transmitted parenterally"],"correctIndex":3,"explanations":["Fulminant hepatitis is rare in Hepatitis E, occurring in only about 1–2% of cases.","Most cases of Hepatitis E are self-limiting and managed with supportive care, not antivirals.","Hepatitis E is described as the most common, not rarest, cause of acute viral hepatitis globally.","Correct — Hepatitis E is the most common cause of acute viral hepatitis globally, typically transmitted through contaminated food and water.","Hepatitis E is transmitted primarily through contaminated food and water, not parenterally."],"topic":"Hepatitis E"},{"stem":"An immunocompromised transplant patient develops persistent Hepatitis E infection despite an initial mild presentation. According to lecture, which population is specifically noted to be at risk for chronic Hepatitis E?","options":["Healthy young adults","Immunocompromised patients","Pregnant women in the first trimester only","Patients with a prior Hepatitis A vaccine","Elderly patients with no comorbidities"],"correctIndex":1,"explanations":["Healthy patients are not specifically identified as at risk for chronic Hepatitis E in lecture.","Correct — chronic hepatitis can develop in immunocompromised patients with Hepatitis E infection.","Pregnancy trimester was not identified as the relevant risk factor for chronic HEV in this lecture.","Hepatitis A vaccination status is unrelated to Hepatitis E chronicity risk.","Elderly patients without comorbidities are not the population specifically identified for chronic HEV risk."],"topic":"Hepatitis E"},{"stem":"A patient with known chronic Hepatitis B is found to have new positive Hepatitis D antigen and HDV RNA. Which term describes this specific scenario, and what does lecture indicate about its clinical severity compared to simultaneous acquisition of both viruses?","options":["Co-infection; typically self-limiting","Superinfection; causes severe hepatitis or exacerbation of chronic Hepatitis B","Superinfection; always asymptomatic","Co-infection; requires no additional monitoring","Superinfection; unrelated to Hepatitis B status"],"correctIndex":1,"explanations":["This describes superinfection, not co-infection, since the patient already had chronic Hepatitis B.","Correct — superinfection (Hepatitis D infecting a known or unknown chronic Hepatitis B carrier) causes severe hepatitis or exacerbation of chronic Hepatitis B, per lecture.","Superinfection is described as causing severe disease, not being asymptomatic.","This scenario, involving pre-existing chronic HBV, is superinfection, not co-infection, and does warrant close monitoring.","Hepatitis D infectivity is fundamentally dependent on Hepatitis B surface antigen, making the two directly related."],"topic":"Hepatitis D"},{"stem":"A patient newly diagnosed with Hepatitis B is also found to have Hepatitis D co-infection acquired at the same time, with no prior HBV exposure. According to lecture, how does this co-infection typically present clinically?","options":["With no detectable liver enzyme abnormalities","As a distinct, more severe illness clearly different from Hepatitis B alone","As chronic hepatitis in nearly all cases","Clinically indistinguishable from acute Hepatitis B alone, and typically self-limiting","Exclusively with neurologic symptoms"],"correctIndex":3,"explanations":["Hepatitis D/B infection produces the expected hepatitis-related liver enzyme abnormalities.","Co-infection is described as clinically indistinguishable from Hepatitis B alone, not obviously more severe at presentation.","Co-infection is typically self-limiting, not typically chronic.","Correct — co-infection (simultaneous Hepatitis B and D with no prior exposure) presents as acute hepatitis clinically indistinguishable from acute Hepatitis B alone, and is typically self-limiting.","This is a hepatic, not primarily neurologic, disease process."],"topic":"Hepatitis D"},{"stem":"A patient with Hepatitis D infection requiring treatment is started on pegylated interferon alpha-2b. According to lecture, what is the expected viral clearance rate with this therapy, and what is a notable drawback?","options":["Clearance requires no monitoring for adverse effects","Clearance in nearly 100% of patients, with minimal side effects","No clearance is ever achieved with this therapy","This medication is curative in a single dose with no side effects","Clearance in 20–50% of patients, with a significant side effect profile"],"correctIndex":4,"explanations":["Given the significant side effect profile, monitoring would be appropriate, contrary to this statement.","This overstates the efficacy and understates the side effect burden described in lecture.","Some patients do achieve clearance with this therapy, though not universally.","This is not a single-dose cure, and it carries a significant side effect profile.","Correct — pegylated interferon alpha-2b can eliminate Hepatitis D RNA in approximately 20–50% of patients but carries a significant side effect profile."],"topic":"Hepatitis D"},{"stem":"A 35-year-old woman has serology showing HBsAg negative, anti-HBs positive, anti-HBc negative, HBeAg negative, and anti-HBe negative. Which interpretation best fits this serologic pattern according to lecture?","options":["Resolved infection","Immunization","Acute infection","Window period","Chronic replicative hepatitis"],"correctIndex":1,"explanations":["Resolved infection shows anti-HBc IgG positive, which is absent here.","Correct — immunization is characterized by HBsAg negative, anti-HBs positive, and anti-HBc negative, matching this pattern exactly.","Acute infection shows HBsAg positive with anti-HBc IgM positive, not this pattern.","The window period shows anti-HBc IgM positive with both HBsAg and anti-HBs negative, not this pattern.","Chronic replicative hepatitis shows HBsAg positive and HBeAg positive, neither of which is present here."],"topic":"Hepatitis B"},{"stem":"A patient with newly diagnosed acute Hepatitis B has persistent severe symptoms and a bilirubin level of 12. According to lecture, what is the most appropriate next step regarding antiviral therapy?","options":["Only supportive care is ever appropriate regardless of bilirubin level","No antiviral therapy is ever indicated for Hepatitis B","Antiviral therapy is contraindicated in this scenario","Antiviral therapy should be delayed until cirrhosis develops","Antiviral therapy is indicated given severe hyperbilirubinemia (bilirubin >10)"],"correctIndex":4,"explanations":["Most patients receive supportive care, but specific indications like this one warrant antiviral therapy.","Antiviral therapy is indicated in specific scenarios, including severe hyperbilirubinemia.","There is no described contraindication to antiviral therapy in this scenario; it is actually indicated.","Waiting until cirrhosis develops would represent a significant, inappropriate treatment delay.","Correct — antiviral therapy is indicated for persistent/severe symptoms or severe hyperbilirubinemia, defined as bilirubin greater than 10, among other criteria."],"topic":"Hepatitis B"},{"stem":"A patient with chronic Hepatitis B is started on antiviral therapy. Which two agents are listed as first-line treatment according to lecture?","options":["Glecaprevir and pibrentasvir","Adefovir and telbivudine only","Entecavir and tenofovir","Sofosbuvir and velpatasvir","Lamivudine and ribavirin"],"correctIndex":2,"explanations":["Glecaprevir-pibrentasvir is a Hepatitis C regimen, not a Hepatitis B treatment.","Adefovir and telbivudine are listed as alternative, not first-line, agents.","Correct — entecavir and tenofovir are listed as first-line treatment for Hepatitis B, with adefovir, telbivudine, and lamivudine as alternatives.","Sofosbuvir-velpatasvir is a Hepatitis C regimen, not a Hepatitis B treatment.","Lamivudine is an alternative agent, and ribavirin is not listed as part of Hepatitis B treatment in this lecture."],"topic":"Hepatitis B"},{"stem":"A newborn is at risk of perinatal Hepatitis B transmission from an infected mother. According to lecture, which route of transmission does this represent, among those listed for Hepatitis B?","options":["Airborne route","Perinatal (childbirth) route","Vector-borne route","Percutaneous route only","Fecal-oral route"],"correctIndex":1,"explanations":["Hepatitis B is not an airborne pathogen.","Correct — perinatal (childbirth) transmission is one of the described routes of Hepatitis B transmission, relevant to this newborn scenario.","Hepatitis B is not vector-borne.","Percutaneous transmission is a separate described route, not the mechanism in this newborn scenario.","Hepatitis B is not transmitted via the fecal-oral route; that is characteristic of Hepatitis A and E."],"topic":"Hepatitis B"},{"stem":"A 45-year-old man with a history of IV drug use is found to have chronic Hepatitis C. According to lecture, what proportion of patients with acute Hepatitis C go on to develop chronic hepatitis?","options":["Up to 85%","Exactly 50%","Up to 15%","Less than 5%","0%, since Hepatitis C always resolves"],"correctIndex":0,"explanations":["Correct — chronic hepatitis develops in up to 85% of patients with acute Hepatitis C, per lecture.","This does not match the specific figure given in lecture.","This significantly underestimates the described chronicity rate; the reported rate is much higher.","This significantly underestimates the described chronicity rate.","Hepatitis C frequently progresses to chronic infection; it does not always resolve."],"topic":"Hepatitis C"},{"stem":"A patient with chronic Hepatitis C has anti-HCV antibodies positive and HCV RNA positive. What does this combination of findings indicate according to lecture?","options":["Immunity from prior vaccination","Past, resolved infection with no current disease","No infection has ever occurred","Acute infection that will definitely resolve within days","Likely chronic hepatitis"],"correctIndex":4,"explanations":["No Hepatitis C vaccine exists, so this cannot represent vaccine-induced immunity.","Past resolved infection is indicated by anti-HCV positive WITHOUT HCV RNA, not with a positive RNA.","Positive antibody and RNA testing indicate active infection, not absence of infection.","This combination does not indicate imminent resolution; it suggests ongoing chronic infection.","Correct — anti-HCV positive with HCV RNA positive indicates likely chronic hepatitis."],"topic":"Hepatitis C"},{"stem":"A patient is being started on direct-acting antiviral therapy for chronic Hepatitis C. Before initiating treatment, which additional screening step is critical according to lecture, and why?","options":["Screen for Hepatitis B, because treatment can reactivate it","Screen for HIV only, with no other screening needed","Screen for Hepatitis A, because treatment can reactivate it","Screen for Hepatitis E, because it shares the same treatment regimen","No additional screening is required before starting therapy"],"correctIndex":0,"explanations":["Correct — Hepatitis C treatment can reactivate Hepatitis B, so screening for HBV is essential before starting therapy.","While broader screening may be reasonable clinically, the specific reactivation risk described in lecture pertains to Hepatitis B.","Hepatitis A reactivation is not the concern described in lecture regarding Hepatitis C treatment.","Hepatitis E does not share this treatment regimen or reactivation concern described in lecture.","Screening for HBV before treatment is explicitly emphasized in lecture."],"topic":"Hepatitis C"},{"stem":"A patient with cirrhosis is found to have distorted hepatic architecture with regenerative nodules on biopsy. According to lecture, what is the single most common cause of cirrhosis discussed?","options":["Autoimmune hepatitis","Wilson disease","Chronic Hepatitis C","Non-alcoholic fatty liver disease alone","Biliary cirrhosis"],"correctIndex":2,"explanations":["Autoimmune hepatitis is listed as a less common cause of cirrhosis in lecture.","Wilson disease was not specifically discussed as a cause of cirrhosis in this lecture.","Correct — chronic Hepatitis C, along with alcohol use and chronic HBV/HDV, are listed as the most common causes of cirrhosis.","NAFLD is a described cause but is not identified as the single most common cause.","Biliary cirrhosis is listed as a less common cause in lecture."],"topic":"Cirrhosis"},{"stem":"A patient with decompensated cirrhosis is noted to have breast enlargement on exam. According to lecture, what is the underlying mechanism for this finding?","options":["Increased hepatic albumin synthesis","Decreased peripheral estrogen production","Increased hepatic estrogen clearance","Excess androgen production by the liver","Impaired hepatic estrogen clearance"],"correctIndex":4,"explanations":["Albumin synthesis actually decreases in cirrhosis and is unrelated to this finding.","Peripheral estrogen production is not decreased; hepatic clearance of estrogen is impaired.","This is the opposite of the mechanism described; clearance is impaired, not increased.","The liver does not produce excess androgens in this condition; the issue is impaired estrogen clearance.","Correct — gynecomastia in cirrhosis results from impaired hepatic clearance of estrogen."],"topic":"Cirrhosis"},{"stem":"A patient with Child-Pugh Class C cirrhosis is discussing prognosis with her provider. Based on the survival data discussed in lecture, which statement most accurately reflects her expected 1-year survival?","options":["Cannot be estimated by Child-Pugh class","Approximately 45%","Approximately 10%","Approximately 100%","Approximately 81%"],"correctIndex":1,"explanations":["Child-Pugh class is specifically used in lecture to correlate with survival prognosis.","Correct — Child-Pugh Class C is associated with approximately 45% 1-year survival.","This underestimates the described 1-year survival for Class C.","This figure corresponds to Child-Pugh Class A, not Class C.","This figure corresponds to Child-Pugh Class B, not Class C."],"topic":"Cirrhosis"},{"stem":"A patient with cirrhosis develops confusion, drowsiness, and a flapping tremor when asked to extend the wrists. Which additional physical exam finding, related to breath odor, is classically associated with this condition according to lecture?","options":["Murphy sign","Boas sign","Courvoisier's sign","Cullen's sign","Fetor hepaticus"],"correctIndex":4,"explanations":["Murphy sign is associated with cholecystitis, not hepatic encephalopathy.","Boas sign is associated with cholecystitis (referred right shoulder/subscapular pain), not hepatic encephalopathy.","Courvoisier's sign is associated with pancreatic malignancy, not hepatic encephalopathy.","Cullen's sign is associated with hemorrhagic pancreatitis, not hepatic encephalopathy.","Correct — fetor hepaticus (a foul breath odor) is a classic physical exam finding in hepatic encephalopathy, along with asterixis."],"topic":"Hepatic Encephalopathy"},{"stem":"A patient with hepatic encephalopathy is started on first-line therapy. According to lecture, what is the mechanism by which this treatment lowers ammonia levels?","options":["It increases hepatic protein synthesis","It acidifies the colon, converting ammonia to ammonium, which is then excreted","It directly binds ammonia in the bloodstream","It blocks intestinal bacterial overgrowth exclusively","It increases renal reabsorption of ammonia"],"correctIndex":1,"explanations":["This is not the described mechanism of lactulose therapy.","Correct — lactulose (or lactitol) acidifies the colon, converting ammonia (NH3) to ammonium (NH4+), which is then excreted.","Lactulose does not act by directly binding ammonia in the bloodstream.","While gut flora may be affected, this is not the primary described mechanism for ammonia reduction.","Lactulose promotes ammonia excretion, not renal reabsorption."],"topic":"Hepatic Encephalopathy"},{"stem":"A 50-year-old woman with obesity and type 2 diabetes is found to have elevated liver enzymes on routine labs. She denies alcohol use. Ultrasound shows a fatty liver. According to lecture, which of the following is the most common underlying etiology for this presentation?","options":["Alpha-1 antitrypsin deficiency","Autoimmune hepatitis","Obesity","Wilson disease","Chronic Hepatitis B"],"correctIndex":2,"explanations":["Alpha-1 antitrypsin deficiency was not discussed as a NAFLD etiology in this lecture.","Autoimmune hepatitis is not identified as the most common cause of this presentation.","Correct — obesity is listed as the most common etiology of NAFLD in lecture.","Wilson disease was not discussed as a NAFLD etiology in this lecture.","Chronic Hepatitis B is not the described etiology of NAFLD."],"topic":"NAFLD/NASH"},{"stem":"A patient with NAFLD progresses to liver cell injury, inflammation, and early fibrosis on biopsy. According to lecture, which term describes this more advanced stage, and what class of medication is used for stage 2 or greater fibrosis?","options":["Chronic Hepatitis C; direct-acting antivirals","Simple steatosis; no treatment is available","Cirrhosis; liver transplant is the only option at this stage","NASH (or MASH); GLP-1 based therapies such as semaglutide","Hepatitis D superinfection; pegylated interferon"],"correctIndex":3,"explanations":["This is unrelated to Hepatitis C; the scenario describes NAFLD/NASH progression.","This describes NASH/MASH, not simple steatosis, and treatment options do exist for this stage.","This stage is NASH, not cirrhosis, though it can progress there; transplant is not the only option at this stage.","Correct — NASH (also called MASH) involves liver cell injury/inflammation with progression toward fibrosis, and GLP-1 based therapies such as semaglutide are used for stage 2 or greater fibrosis.","This is unrelated to Hepatitis D; the scenario describes NAFLD/NASH."],"topic":"NAFLD/NASH"},{"stem":"A patient with cirrhosis and portal hypertension is found to have hepatosplenomegaly, ascites, and dilated abdominal wall veins. Using the mnemonic discussed in lecture for portal hypertension findings, which additional finding would complete the classic pattern?","options":["Bradycardia","Hyperthyroidism","Hypertension (systemic)","Bleeding (e.g., hematemesis)","Weight gain"],"correctIndex":3,"explanations":["Bradycardia is not part of the described mnemonic.","Thyroid findings are not part of the described mnemonic.","Systemic hypertension is not part of the described mnemonic; portal (not systemic) pressure is elevated.","Correct — the \\\"ABCDE\\\" mnemonic includes Ascites, Bleeding, Caput medusae, Diminished liver, and Enlarged spleen; bleeding completes this pattern.","Weight gain is not part of the described portal hypertension mnemonic."],"topic":"Portal Hypertension"},{"stem":"A patient with suspected portal hypertension undergoes hepatic venous pressure gradient (HVPG) measurement. According to lecture, above what value is portal hypertension typically considered clinically significant?","options":["HVPG >10 mmHg","HVPG >1 mmHg","HVPG cannot be measured clinically","HVPG <1 mmHg","HVPG >50 mmHg"],"correctIndex":0,"explanations":["Correct — an HVPG greater than 10 mmHg is typically considered clinically significant, with a normal range of 1–5 mmHg.","This falls within the normal range (1–5 mmHg), not the threshold for clinical significance.","HVPG is a described, measurable diagnostic tool in this lecture.","A value below 1 would be below even the normal range, not a described threshold.","This value is far higher than the described clinically significant threshold."],"topic":"Portal Hypertension"},{"stem":"A patient with cirrhosis and portal hypertension is started on medication to reduce portal pressure and prevent variceal bleeding. Which class of medication, listed in lecture, is used for this purpose?","options":["SSRIs","Loop diuretics alone","Beta blockers (carvedilol, propranolol, nadolol)","Calcium channel blockers","ACE inhibitors"],"correctIndex":2,"explanations":["SSRIs are not part of the portal hypertension treatment approach.","Diuretics are used for ascites/edema management, not specifically for reducing portal pressure in this context.","Correct — beta blockers such as carvedilol, propranolol, and nadolol are used to manage portal hypertension.","Calcium channel blockers are not the described therapy for portal hypertension in this lecture.","ACE inhibitors are not the class described for portal hypertension management in lecture."],"topic":"Portal Hypertension"},{"stem":"A patient with cirrhosis and known HBV infection undergoes screening abdominal ultrasound, which reveals a 2.3 cm liver lesion showing arterial enhancement with venous washout on follow-up CT. Which diagnosis is most consistent with these findings?","options":["Hepatocellular carcinoma","Simple hepatic cyst","Acute cholecystitis","Cholangitis","Chronic pancreatitis"],"correctIndex":0,"explanations":["Correct — arterial enhancement with venous washout on CT/MRI in a high-risk patient (cirrhosis, HBV) is characteristic of hepatocellular carcinoma.","A simple cyst would not show arterial enhancement with venous washout, a specific vascular pattern.","Cholecystitis involves the gallbladder, not a hepatic parenchymal lesion.","Cholangitis involves biliary tract inflammation, not this specific hepatic lesion vascular pattern.","Chronic pancreatitis does not present as a hepatic lesion with this vascular enhancement pattern."],"topic":"Hepatocellular Carcinoma"},{"stem":"A high-risk patient with cirrhosis undergoes routine screening ultrasound and is found to have a liver lesion measuring 0.8 cm. According to lecture, what is the appropriate next step?","options":["Emergent surgical resection","Immediate biopsy of the lesion","No further monitoring needed","Ongoing surveillance every 3–6 months","Immediate liver transplant evaluation"],"correctIndex":3,"explanations":["Surgery is not indicated for a small, indeterminate subcentimeter lesion without further characterization.","Biopsy is typically reserved for cases with inconclusive imaging, not immediately for a small subcentimeter lesion.","Continued monitoring, not cessation of surveillance, is appropriate for this finding.","Correct — lesions less than 1 cm on ultrasound in high-risk patients undergo ongoing surveillance every 3–6 months.","Immediate transplant evaluation is not indicated for a small indeterminate lesion at this stage."],"topic":"Hepatocellular Carcinoma"},{"stem":"A patient with hepatocellular carcinoma is being considered for immunotherapy with atezolizumab plus bevacizumab. According to lecture, what should be screened for before initiating this specific regimen, and why?","options":["Renal function only, with no other screening needed","Diabetes, due to risk of hyperglycemia","Peptic ulcer disease, due to risk of gastric perforation","Esophageal varices, due to increased bleeding risk","Hearing loss, due to ototoxicity"],"correctIndex":3,"explanations":["Esophageal variceal screening, not solely renal function, is the specific concern highlighted in lecture for this regimen.","Hyperglycemia is not the specific screening concern described for this regimen in lecture.","Peptic ulcer disease is not the specific screening concern described for this regimen in lecture.","Correct — screening for esophageal varices is recommended before starting atezolizumab plus bevacizumab due to increased bleeding risk.","Ototoxicity is not a described concern for this regimen."],"topic":"Hepatocellular Carcinoma"},{"stem":"A 45-year-old woman with a history of oral contraceptive use and obesity presents with episodic RUQ pain radiating to her right shoulder blade, lasting about an hour after a fatty meal, without fever. What is the most likely diagnosis, and what type of gallstone is most common in this scenario?","options":["Ascending cholangitis; brown stones","Acute cholecystitis; black stones","Biliary colic from cholelithiasis; cholesterol stones (most common type)","Choledocholithiasis; black stones","Chronic pancreatitis; no stones involved"],"correctIndex":2,"explanations":["This presentation lacks fever/jaundice/altered mental status, making cholangitis less likely, and brown stones are less common overall.","This presentation lacks fever and other systemic findings expected with acute cholecystitis, and black stones are not the most common type overall.","Correct — this presentation describes biliary colic from cholelithiasis, and cholesterol stones are the most common type, accounting for approximately 90% of gallstones.","This presentation, without fever/jaundice/prolonged duration, is more consistent with uncomplicated biliary colic than choledocholithiasis, and black stones are less common overall than cholesterol stones.","This presentation is gallbladder/biliary in nature, not primarily pancreatic."],"topic":"Cholelithiasis"},{"stem":"A patient with asymptomatic gallstones found incidentally on imaging asks about treatment. According to lecture, what is the recommended approach?","options":["Immediate cholecystectomy regardless of symptoms","Immediate liver transplant evaluation","Monitoring, since most patients with gallstones are asymptomatic","Long-term antibiotics","Urgent ERCP"],"correctIndex":2,"explanations":["Immediate surgery is not indicated for incidentally found asymptomatic gallstones.","Transplant evaluation is not relevant to simple asymptomatic gallstones.","Correct — asymptomatic gallstones found incidentally are typically monitored rather than treated surgically.","Antibiotics are not indicated for asymptomatic gallstones, which are not an infectious process.","ERCP is not indicated for asymptomatic gallstones without evidence of ductal involvement."],"topic":"Cholelithiasis"},{"stem":"A 52-year-old woman presents with RUQ pain, fever, and a positive Murphy sign on exam. Labs show leukocytosis. Which imaging finding on abdominal ultrasound would support the leading diagnosis?","options":["Pancreatic calcifications","Gallbladder wall thickening, distention, and stones with a positive sonographic Murphy sign","Dilated common bile duct with pyogenic material only","A normal-appearing gallbladder with no wall changes","Diffuse hepatic nodularity with increased echogenicity"],"correctIndex":1,"explanations":["Pancreatic calcifications are associated with chronic pancreatitis, not cholecystitis.","Correct — gallbladder wall thickening/edema, distention, stones, and a positive sonographic Murphy sign support the diagnosis of acute cholecystitis.","This finding pattern is more consistent with ascending cholangitis, not primary cholecystitis.","A normal gallbladder would not support this diagnosis given her clinical presentation.","Hepatic nodularity with increased echogenicity is a finding of cirrhosis, not cholecystitis."],"topic":"Cholecystitis"},{"stem":"A patient with acute cholecystitis has an inconclusive ultrasound. According to lecture, which additional study can be used to clarify the diagnosis, and what finding would support it?","options":["MRCP showing gallstones only","Upper endoscopy showing gastritis","Barium swallow showing esophageal narrowing","CT chest showing pulmonary nodules","HIDA scan (radionuclide cholescintigraphy), showing nonvisualization of the gallbladder if the cystic duct is obstructed"],"correctIndex":4,"explanations":["MRCP is not the specific test described in lecture for this diagnostic uncertainty; HIDA scan is highlighted instead.","Upper endoscopy findings are unrelated to cholecystitis diagnosis.","This is unrelated to the biliary/gallbladder evaluation described in lecture.","This is unrelated to gallbladder evaluation.","Correct — a HIDA scan is used when the diagnosis is unclear, showing nonvisualization of the gallbladder when the cystic duct is obstructed by a stone."],"topic":"Cholecystitis"},{"stem":"A patient with acute cholecystitis is being treated empirically with antibiotics before surgery. According to lecture, what is the most common causative organism class, and which empiric regimen is appropriate for a standard-risk patient?","options":["Anaerobic bacteria exclusively; clindamycin monotherapy","Gram-positive cocci; vancomycin monotherapy","Gram-negative enteric organisms (E. coli most common); metronidazole plus a cephalosporin","Fungal organisms; fluconazole","Viral pathogens; no antibiotics needed"],"correctIndex":2,"explanations":["Anaerobic organisms alone are not described as the primary cause, and clindamycin monotherapy is not the described regimen.","Gram-negative organisms, not gram-positive cocci, are the most common cause, and this is not the described regimen.","Correct — gram-negative enteric organisms, most commonly E. coli, are the typical cause, and metronidazole plus a cephalosporin (ceftriaxone or cefazolin) is appropriate empiric therapy for standard-risk patients.","Fungal causes are not described as typical for cholecystitis.","Cholecystitis in this context is treated as a bacterial infectious process requiring antibiotics."],"topic":"Cholecystitis"},{"stem":"A patient with choledocholithiasis is being worked up. According to lecture, which study is considered the diagnostic procedure of choice, offering both diagnostic and therapeutic capability?","options":["CT abdomen without contrast","Abdominal ultrasound alone","HIDA scan","ERCP","Plain abdominal x-ray"],"correctIndex":3,"explanations":["CT without contrast is not the described diagnostic procedure of choice for this condition.","Ultrasound may show a dilated common bile duct but is not the diagnostic procedure of choice with therapeutic capability described in lecture.","A HIDA scan is used for cholecystitis evaluation, not as the primary diagnostic tool for choledocholithiasis.","Correct — ERCP is the diagnostic procedure of choice for choledocholithiasis and is also therapeutic, allowing stone extraction.","Plain x-ray has limited utility in diagnosing choledocholithiasis."],"topic":"Choledocholithiasis"},{"stem":"A patient with choledocholithiasis has labs showing elevated ALT/AST along with elevated ALP and GGT. According to lecture, what does this pattern of liver enzyme elevation represent?","options":["Isolated pancreatic injury","Normal liver enzyme findings","A purely hepatocellular pattern","A cholestatic pattern superimposed on some hepatocellular involvement","A pattern unrelated to biliary obstruction"],"correctIndex":3,"explanations":["This is a hepatobiliary, not primarily pancreatic, laboratory pattern in this context.","This described combination of findings is abnormal, not normal.","A purely hepatocellular pattern would not include the ALP/GGT elevation described here, which reflects cholestasis.","Correct — choledocholithiasis produces elevated AST/ALT with a cholestatic pattern of elevated ALP and GGT, reflecting bile duct obstruction.","This pattern is directly related to biliary duct obstruction from choledocholithiasis."],"topic":"Choledocholithiasis"},{"stem":"A 60-year-old woman presents with fever and chills, RUQ pain, and jaundice. According to lecture, this specific combination of findings is known by which eponym?","options":["Reynolds' pentad","Boas sign","Courvoisier's sign","Cullen's sign","Charcot's triad"],"correctIndex":4,"explanations":["Reynolds' pentad requires two additional findings (hypotension and altered mental status) beyond this triad.","Boas sign refers to referred right shoulder/subscapular pain in cholecystitis, not this triad.","Courvoisier's sign refers to a palpable, nontender gallbladder, associated with pancreatic malignancy, not this triad.","Cullen's sign refers to periumbilical ecchymosis in hemorrhagic pancreatitis, not this triad.","Correct — Charcot's triad consists of fever with chills, RUQ pain, and jaundice, classically associated with ascending cholangitis."],"topic":"Ascending Cholangitis"},{"stem":"A patient with ascending cholangitis progresses to develop hypotension and altered mental status in addition to fever, RUQ pain, and jaundice. According to lecture, what is this more severe combination of findings called, and what does it indicate?","options":["Virchow's node; indicates metastatic disease","Charcot's triad; indicates mild, uncomplicated disease","Trousseau syndrome; indicates a hypercoagulable state","Courvoisier's sign; indicates malignancy","Reynolds' pentad; indicates more severe, potentially life-threatening disease"],"correctIndex":4,"explanations":["Virchow's node relates to metastatic gastric/abdominal malignancy, not cholangitis severity.","Charcot's triad describes the initial three findings; the addition of hypotension and altered mental status defines a more severe entity.","Trousseau syndrome relates to migratory thrombophlebitis in malignancy, not cholangitis severity.","Courvoisier's sign relates to a distended gallbladder in pancreatic malignancy, not this presentation.","Correct — Reynolds' pentad (Charcot's triad plus hypotension/shock and altered mental status) indicates more severe, potentially life-threatening ascending cholangitis."],"topic":"Ascending Cholangitis"},{"stem":"A patient with suspected ascending cholangitis undergoes cholangiography via ERCP. According to lecture, how is this study classified in the diagnostic workup of this condition?","options":["It is used only for pancreatic disease","It has no therapeutic capability","It is the gold standard diagnostic test","It is inferior to plain abdominal x-ray for this diagnosis","It is contraindicated in ascending cholangitis"],"correctIndex":2,"explanations":["ERCP is used here specifically for the biliary tract, not exclusively for pancreatic disease.","ERCP is both diagnostic and therapeutic (sphincterotomy, stone extraction, stent placement) in this condition.","Correct — cholangiography via ERCP is the gold standard for diagnosing ascending cholangitis.","ERCP/cholangiography, not plain x-ray, is the gold standard for this diagnosis.","ERCP/cholangiography is not contraindicated; it is central to diagnosis and treatment of ascending cholangitis."],"topic":"Ascending Cholangitis"},{"stem":"A 55-year-old man with a history of alcohol use disorder presents with sudden epigastric pain radiating to the back, worse when supine and improved when leaning forward. Labs show lipase elevated 4 times the upper limit of normal. According to the diagnostic criteria discussed in lecture, how many of the three criteria are met, and is imaging required?","options":["2 of 3 criteria met (pain plus elevated lipase); imaging may not be required","Imaging alone establishes the diagnosis regardless of clinical findings","0 of 3 criteria met; this is not pancreatitis","3 of 3 criteria met without any lab or exam findings","Only 1 of 3 criteria met; imaging is mandatory"],"correctIndex":0,"explanations":["Correct — this patient meets 2 of the 3 diagnostic criteria (characteristic pain and lipase/amylase ≥3× ULN), and imaging may not be required if these two criteria are already met.","Imaging is only one of three possible criteria; diagnosis can be made without it if the other two criteria are met.","This scenario clearly meets diagnostic criteria for acute pancreatitis based on pain and lab findings.","This scenario has both a described clinical pain pattern and objective lab findings, not zero findings.","This scenario actually meets 2 of the 3 required criteria, not just 1."],"topic":"Acute Pancreatitis"},{"stem":"A patient with severe acute pancreatitis develops periumbilical ecchymosis. According to lecture, which sign does this finding represent, and what does it suggest about disease severity?","options":["Grey Turner's sign; suggests mild, uncomplicated disease","Cullen's sign; suggests necrotizing (hemorrhagic) pancreatitis","Courvoisier's sign; suggests pancreatic malignancy","Boas sign; suggests cholecystitis","Charcot's triad; suggests cholangitis"],"correctIndex":1,"explanations":["Grey Turner's sign refers to flank, not periumbilical, ecchymosis, and this finding suggests more severe, not mild, disease.","Correct — Cullen's sign (periumbilical ecchymosis) is associated with necrotizing (hemorrhagic) pancreatitis, indicating more severe disease.","Courvoisier's sign relates to a palpable gallbladder in pancreatic malignancy, not this finding.","Boas sign is associated with cholecystitis, not pancreatitis-related ecchymosis.","Charcot's triad relates to cholangitis, not this specific ecchymosis finding."],"topic":"Acute Pancreatitis"},{"stem":"A patient with acute pancreatitis is found to have low serum calcium. According to lecture, what is the underlying mechanism for this finding?","options":["Increased parathyroid hormone secretion","Decreased vitamin D absorption exclusively","Increased renal calcium excretion only","Necrotic fat binding calcium (fat saponification)","Hypercalcemia is expected instead, not hypocalcemia"],"correctIndex":3,"explanations":["This is not the described mechanism for this specific finding.","Vitamin D absorption is not the described mechanism for this acute finding.","This is not the described mechanism for hypocalcemia in acute pancreatitis.","Correct — necrotic fat within the pancreas binds calcium (saponification), leading to hypocalcemia in acute pancreatitis.","Hypocalcemia, not hypercalcemia, is the expected finding in acute pancreatitis, related to fat necrosis."],"topic":"Acute Pancreatitis"},{"stem":"A patient with acute pancreatitis is being managed. According to lecture, which of the following is part of standard initial management?","options":["Encourage a regular diet immediately","Withhold IV fluids to avoid worsening pancreatic edema","Start antibiotics for all patients regardless of infection status","Immediate surgical pancreatectomy in all cases","NPO (\"rest the pancreas\") with aggressive IV fluid hydration"],"correctIndex":4,"explanations":["Patients should be kept NPO initially to rest the pancreas, not started on a regular diet immediately.","IV fluids are a cornerstone of management, not something to withhold.","Antibiotics are typically not needed unless infection is specifically suspected.","Surgery is not the standard initial approach for uncomplicated acute pancreatitis.","Correct — standard management includes NPO status (\\\"rest the pancreas\\\") along with aggressive IV fluid hydration (~10 mL/kg bolus) and electrolyte repletion."],"topic":"Acute Pancreatitis"},{"stem":"A 58-year-old man with a long history of alcohol use presents with chronic epigastric pain, steatorrhea, and new-onset diabetes. According to lecture, which classic triad of findings does this patient demonstrate?","options":["Ascites, bleeding, and caput medusae","Virchow's node, Sister Mary Joseph's node, and Trousseau syndrome","Charcot's triad","Pancreatic calcifications, steatorrhea, and diabetes mellitus","Cullen's sign, Grey Turner's sign, and jaundice"],"correctIndex":3,"explanations":["This is the ABCDE mnemonic for portal hypertension, not the chronic pancreatitis triad.","These are metastatic signs of pancreatic malignancy, not the chronic pancreatitis triad.","Charcot's triad relates to cholangitis, not this presentation.","Correct — the classic triad of chronic pancreatitis is pancreatic calcifications, steatorrhea, and diabetes mellitus.","These are hemorrhagic pancreatitis and hepatic findings, not the chronic pancreatitis triad."],"topic":"Chronic Pancreatitis"},{"stem":"A patient with chronic pancreatitis undergoes CT abdomen with contrast. According to lecture, which finding is most characteristic of this diagnosis?","options":["Arterial enhancement with venous washout","Calcifications of the pancreas with dilated pancreatic/biliary ducts","Gallbladder wall thickening with pericholecystic fluid","A solitary hypoechoic renal mass","Periumbilical ecchymosis"],"correctIndex":1,"explanations":["Arterial enhancement with venous washout is characteristic of hepatocellular carcinoma, not chronic pancreatitis.","Correct — CT abdomen with contrast in chronic pancreatitis characteristically shows calcifications of the pancreas with dilated pancreatic/biliary ducts.","Gallbladder wall thickening is a cholecystitis finding, not a CT finding of chronic pancreatitis.","A renal mass is unrelated to chronic pancreatitis.","Periumbilical ecchymosis is a physical exam finding of hemorrhagic acute pancreatitis, not a CT finding of chronic pancreatitis."],"topic":"Chronic Pancreatitis"},{"stem":"A patient with chronic pancreatitis is being managed for exocrine insufficiency causing malabsorption and floating stools. According to lecture, which treatment addresses this specific complication?","options":["Pancreatic enzyme supplementation (e.g., Creon)","Rubber band ligation","TIPS placement","Beta blockers","Lactulose"],"correctIndex":0,"explanations":["Correct — pancreatic enzyme supplementation, such as Creon, addresses exocrine insufficiency and malabsorption/steatorrhea in chronic pancreatitis.","Rubber band ligation is a hemorrhoid treatment, unrelated to pancreatic insufficiency.","TIPS is used for portal hypertension complications, not pancreatic exocrine insufficiency.","Beta blockers are used for portal hypertension, not exocrine pancreatic insufficiency.","Lactulose is used for hepatic encephalopathy, not pancreatic exocrine insufficiency."],"topic":"Chronic Pancreatitis"},{"stem":"A 68-year-old man presents with painless jaundice, unintentional weight loss, and dark urine. Exam reveals a nontender, palpable, distended gallbladder. According to lecture, what is this specific physical exam finding called, and what diagnosis does it suggest?","options":["Courvoisier's sign; suggests pancreatic malignancy","Charcot's triad; suggests ascending cholangitis","Murphy sign; suggests acute cholecystitis","Boas sign; suggests choledocholithiasis","Cullen's sign; suggests hemorrhagic pancreatitis"],"correctIndex":0,"explanations":["Correct — Courvoisier's sign refers to a nontender, palpable, distended gallbladder at the right costal margin, classically associated with pancreatic malignancy causing painless jaundice.","Charcot's triad involves fever, RUQ pain, and jaundice together, not this isolated painless finding.","Murphy sign involves pain with palpation during inspiration, not a painless, distended, palpable gallbladder.","Boas sign refers to referred shoulder pain in cholecystitis, not this finding.","Cullen's sign refers to periumbilical ecchymosis, not a palpable gallbladder."],"topic":"Pancreatic Malignancies"},{"stem":"A patient with pancreatic adenocarcinoma is found to have left supraclavicular lymphadenopathy on exam. According to lecture, what is this finding called, and what does it indicate?","options":["Virchow's node; indicates metastatic disease","Courvoisier's sign; indicates biliary obstruction only","Trousseau syndrome; indicates a clotting disorder unrelated to metastasis","Sister Mary Joseph's node; indicates local disease only","Boas sign; indicates cholecystitis"],"correctIndex":0,"explanations":["Correct — Virchow's node refers to left supraclavicular lymphadenopathy and is a sign of metastatic disease.","Courvoisier's sign refers to a palpable gallbladder, not lymphadenopathy.","Trousseau syndrome refers to migratory thrombophlebitis, which is associated with malignancy, but this question specifically describes supraclavicular adenopathy, which is Virchow's node.","Sister Mary Joseph's node refers to a periumbilical mass, not supraclavicular lymphadenopathy.","Boas sign is unrelated to pancreatic malignancy lymphadenopathy findings."],"topic":"Pancreatic Malignancies"},{"stem":"A patient with pancreatic adenocarcinoma develops recurrent episodes of migratory venous thrombosis in different limbs over several weeks. According to lecture, what is this paraneoplastic phenomenon called?","options":["Virchow's node","Charcot's triad","Trousseau syndrome","Sister Mary Joseph's node","Courvoisier's sign"],"correctIndex":2,"explanations":["Virchow's node refers to supraclavicular lymphadenopathy, not a thrombotic phenomenon.","Charcot's triad relates to cholangitis, not this paraneoplastic thrombotic phenomenon.","Correct — Trousseau syndrome refers to migratory thrombophlebitis, a described paraneoplastic finding in pancreatic malignancy.","Sister Mary Joseph's node refers to a periumbilical mass, not a thrombotic phenomenon.","Courvoisier's sign refers to a palpable gallbladder, not a thrombotic phenomenon."],"topic":"Pancreatic Malignancies"},{"stem":"A patient with suspected pancreatic malignancy requires tissue diagnosis. According to lecture, which biopsy technique is considered the best modality for obtaining tissue, given a lower risk of tumor seeding compared to the alternative?","options":["Endoscopic US-guided FNA (EUS-FNA)","Random colonoscopic biopsy","Percutaneous US/CT-guided FNA","Blind percutaneous liver biopsy","Open surgical biopsy in all cases"],"correctIndex":0,"explanations":["Correct — EUS-FNA is described as the best modality for obtaining tissue in suspected pancreatic malignancy.","Colonoscopy would not reach the pancreas for biopsy.","Percutaneous US/CT-guided FNA carries a small risk of tumor seeding and can compromise future surgery, making it less preferred than EUS-FNA.","A blind liver biopsy would not appropriately sample a pancreatic mass.","Open surgical biopsy is not the described first-line/best modality for tissue diagnosis in this lecture."],"topic":"Pancreatic Malignancies"}],"mcQuestions":[{"stem":"What is the definition of hepatitis?","options":["Inflammation of the gallbladder.","Inflammation of the peritoneum.","Inflammation of the biliary tree.","Inflammation of the pancreas.","Inflammation of the liver."],"correctIndex":4},{"stem":"Name four etiologies of hepatitis discussed in lecture.","options":["Viral infection (Hep A–E), alcohol toxification, drug-induced (e.g., acetaminophen/Tylenol), and autoimmune process.","Fungal infection, parasitic infection, trauma, and malignancy.","Viral infection only, with no other recognized causes.","Gallstones, chronic pancreatitis, portal hypertension, and cirrhosis.","Bacterial infection, radiation exposure, congenital malformation, and vascular occlusion."],"correctIndex":0},{"stem":"What physical exam finding describes a flapping hand tremor with wrist extension seen in fulminant hepatitis and hepatic encephalopathy?","options":["Murphy sign.","Charcot's triad.","Fetor hepaticus.","Asterixis.","Courvoisier's sign."],"correctIndex":3},{"stem":"What is the primary route of transmission for Hepatitis A?","options":["The airborne route.","The fecal-oral route.","The sexual route.","The parenteral route.","The perinatal route."],"correctIndex":1},{"stem":"Is a vaccine available for Hepatitis A, and what is the dosing schedule?","options":["Yes — an annual booster is required.","Yes — 3 doses given 1 month apart.","Yes — 2 doses given 6–12 months apart.","Yes — a single lifelong dose.","No — no vaccine is available."],"correctIndex":2},{"stem":"What is the most common cause of acute viral hepatitis globally?","options":["Hepatitis B.","Hepatitis A.","Hepatitis C.","Hepatitis E.","Hepatitis D."],"correctIndex":3},{"stem":"What unique co-factor does Hepatitis D require in order to become infectious?","options":["Hepatitis A IgM antibody.","Hepatitis B surface antigen (HBsAg).","Hepatitis C RNA.","Intrinsic factor.","Bile acids."],"correctIndex":1},{"stem":"Differentiate Hepatitis D co-infection from superinfection.","options":["Co-infection is Hep D infecting a chronic Hep B carrier; superinfection is simultaneous acute Hep B and Hep D infection.","Co-infection and superinfection are two names for the same clinical scenario.","Co-infection occurs only in children; superinfection occurs only in adults.","Co-infection is simultaneous acute Hep B and Hep D infection (no prior Hep B exposure); superinfection is Hep D infecting a patient who is already a chronic Hep B carrier.","Co-infection requires no prior liver disease; superinfection always follows Hepatitis C."],"correctIndex":3},{"stem":"What are the routes of transmission for Hepatitis B?","options":["Airborne, vector-borne, and fecal-oral only.","Percutaneous, sexual, parenteral, and perinatal (childbirth).","Sexual and perinatal only, with no percutaneous transmission.","Percutaneous and fecal-oral only, with no sexual transmission.","Fecal-oral, airborne, and contaminated water only."],"correctIndex":1},{"stem":"On Hepatitis B serologies, what pattern of HBsAg, anti-HBs, and anti-HBc indicates a resolved infection?","options":["HBsAg negative, anti-HBs positive, anti-HBc IgG positive (HBeAg and anti-HBe both negative).","HBsAg negative, anti-HBs positive, anti-HBc negative (immunization pattern).","HBsAg negative, anti-HBs negative, anti-HBc IgM positive (window period).","HBsAg positive, anti-HBs negative, anti-HBc IgG positive, HBeAg positive (chronic replicative).","HBsAg positive, anti-HBs negative, anti-HBc IgM positive, HBeAg positive."],"correctIndex":0},{"stem":"What are the first-line antiviral medications for chronic Hepatitis B?","options":["Acyclovir and valganciclovir.","Sofosbuvir and velpatasvir.","Entecavir and tenofovir.","Rifaximin and lactulose.","Glecaprevir and pibrentasvir."],"correctIndex":2},{"stem":"What is the most common route of transmission for Hepatitis C?","options":["Airborne transmission.","IV drug use.","Fecal-oral transmission.","Perinatal transmission.","Contaminated food and water."],"correctIndex":1},{"stem":"What percentage of acute Hepatitis C infections can progress to chronic hepatitis?","options":["Up to 15%.","Up to 5%.","Up to 99%.","Up to 85%.","Up to 50%."],"correctIndex":3},{"stem":"What are the two first-line oral regimens for Hepatitis C treatment?","options":["Metronidazole for 8 weeks, or tetracycline for 12 weeks.","Glecaprevir-pibrentasvir for 8 weeks, or sofosbuvir-velpatasvir for 12 weeks.","Pegylated interferon for 24 weeks, or ribavirin for 48 weeks.","Bismuth quadruple therapy for 14 days, or triple therapy for 10 days.","Entecavir for 8 weeks, or tenofovir for 12 weeks."],"correctIndex":1},{"stem":"Before starting antiviral treatment for Hepatitis C, which other viral hepatitis must be screened for, and why?","options":["Hepatitis E — treatment can reactivate Hepatitis E.","Hepatitis D — treatment can worsen Hepatitis D.","Hepatitis B — treatment can reactivate Hepatitis B.","Hepatitis A — treatment can reactivate Hepatitis A.","HIV — treatment can reactivate HIV."],"correctIndex":2},{"stem":"What is the definition of cirrhosis?","options":["An early, reversible stage of hepatic inflammation without architectural distortion.","A congenital malformation of the hepatic vasculature.","Acute hepatocellular necrosis without fibrosis or nodule formation.","A functional obstruction of bile flow without structural liver changes.","A late stage of progressive hepatic fibrosis characterized by distortion of the hepatic architecture and formation of regenerative nodules."],"correctIndex":4},{"stem":"What is the most common cause of cirrhosis discussed in lecture?","options":["Autoimmune hepatitis alone.","Chronic Hepatitis A.","NAFLD alone.","Biliary cirrhosis alone.","Chronic Hepatitis C."],"correctIndex":4},{"stem":"Name three physical exam findings associated with cirrhosis.","options":["Any three of: Cullen's sign, Grey Turner's sign, Courvoisier's sign.","Any three of: ascites, spider angioma/telangiectasia, hepatosplenomegaly, gynecomastia, muscle wasting, jaundice.","Any three of: Rovsing sign, psoas sign, obturator sign.","Any three of: Murphy sign, Boas sign, McBurney point tenderness.","Any three of: asterixis, fetor hepaticus, and Charcot's triad only."],"correctIndex":1},{"stem":"What is the ultimate curative treatment for cirrhosis?","options":["Sodium restriction alone.","Beta blocker therapy.","Liver transplant.","Long-term diuretic therapy.","Serial paracentesis."],"correctIndex":2},{"stem":"What medication class is first-line for treating pruritus in cirrhosis?","options":["H2 receptor antagonist.","Nonselective beta blocker.","Osmotic laxative.","Proton pump inhibitor.","Bile acid sequestrant (cholestyramine)."],"correctIndex":4},{"stem":"What is hepatic encephalopathy?","options":["An autoimmune process targeting hepatocytes and biliary epithelium.","A bacterial infection of the peritoneal fluid in cirrhotic patients.","Neuropsychiatric abnormalities resulting from excess bilirubin deposition in the brain.","A structural malformation of the portal venous system present at birth.","Neuropsychiatric abnormalities resulting from the liver's failure to detoxify gut-derived agents (ammonia) due to hepatocellular dysfunction and/or portosystemic shunting."],"correctIndex":4},{"stem":"What physical exam finding describes foul breath odor associated with hepatic encephalopathy?","options":["Asterixis.","Fetor hepaticus.","Trousseau syndrome.","Boas sign.","Courvoisier's sign."],"correctIndex":1},{"stem":"What is the first-line treatment for lowering ammonia levels in hepatic encephalopathy?","options":["Cholestyramine.","Octreotide.","Spironolactone.","Lactulose or lactitol.","Rifaximin as first-line monotherapy."],"correctIndex":3},{"stem":"What is the most common cause of non-alcoholic fatty liver disease (NAFLD)?","options":["Obesity.","Wilson disease.","Chronic Hepatitis B infection.","Alpha-1 antitrypsin deficiency.","Autoimmune hepatitis."],"correctIndex":0},{"stem":"What is the more severe form of NAFLD, characterized by liver cell injury/death and inflammation, called?","options":["Nonalcoholic fatty liver alone, with no inflammation.","Nonalcoholic steatohepatitis (NASH), also referred to as MASH.","Autoimmune hepatitis.","Cholestatic liver disease.","Cirrhosis, with no intermediate steatohepatitis stage."],"correctIndex":1},{"stem":"What class of medications is used to treat NAFLD/NASH in patients with stage 2 or greater fibrosis?","options":["Nonselective beta blockers (e.g., propranolol).","Bile acid sequestrants (e.g., cholestyramine).","Proton pump inhibitors.","GLP-1 based therapies (e.g., semaglutide, tirzepatide, liraglutide).","Antiviral agents (e.g., entecavir)."],"correctIndex":3},{"stem":"What is the most common cause of portal hypertension?","options":["Chronic pancreatitis.","Portal vein thrombosis.","Schistosomiasis.","Cirrhosis of the liver.","Hepatocellular carcinoma."],"correctIndex":3},{"stem":"What does the \"ABCDE\" mnemonic represent in classic portal hypertension?","options":["Ascites, Bruising, Clubbing, Distention, Edema.","Ascites, Bleeding, Caput medusae, Diminished liver (atrophy), Enlarged spleen.","Abscess, Bacteremia, Cholangitis, Dehydration, Endocarditis.","Asterixis, Bilirubinemia, Coagulopathy, Dysphagia, Encephalopathy.","Anorexia, Bloating, Constipation, Diarrhea, Emesis."],"correctIndex":1},{"stem":"What hepatic venous pressure gradient (HVPG) value is typically considered clinically significant for portal hypertension?","options":["Greater than 50 mmHg.","Greater than 1 mmHg.","Greater than 10 mmHg.","Greater than 20 mmHg.","Greater than 5 mmHg."],"correctIndex":2},{"stem":"What procedure involves placing a shunt between veins to relieve pressure on the portal vein?","options":["Rectopexy.","ERCP (endoscopic retrograde cholangiopancreatography).","TACE (transarterial chemoembolization).","Cricopharyngeal myotomy.","TIPS (transjugular intrahepatic portosystemic shunt)."],"correctIndex":4},{"stem":"What is the most common risk factor for hepatocellular carcinoma (HCC)?","options":["Celiac disease.","NSAID use.","Cholelithiasis.","Peptic ulcer disease.","Cirrhosis."],"correctIndex":4},{"stem":"What is the recommended screening interval and imaging modality for high-risk HCC patients?","options":["MRI with contrast annually.","Abdominal ultrasound every 3 months.","Abdominal ultrasound every 12 months.","CT abdomen/pelvis every 6 months.","Abdominal ultrasound every 6 months."],"correctIndex":4},{"stem":"What tumor marker aids in the diagnosis and treatment surveillance of HCC?","options":["PSA.","CA 72-4.","CEA.","Alpha-fetoprotein (AFP).","CA 19-9."],"correctIndex":3},{"stem":"Before starting atezolizumab + bevacizumab for HCC, what must be screened for?","options":["Esophageal varices, due to increased bleeding risk.","Osteoporosis, due to risk of fracture.","Peptic ulcer disease, due to risk of perforation.","Diabetes, due to risk of hyperglycemia.","Hearing loss, due to ototoxicity."],"correctIndex":0},{"stem":"What is the most common type of gallstone?","options":["Calcium bilirubinate stones (~90%).","Brown pigment stones (~90%).","Black pigment stones (~90%).","Mixed stones (~90%).","Cholesterol stones (~90%)."],"correctIndex":4},{"stem":"What is the classic presentation of biliary colic?","options":["RUQ or epigastric pain radiating to the right shoulder blade, lasting about 30 minutes to a few hours, often after a large/fatty meal.","Diffuse periumbilical pain that migrates to the RLQ over 24 hours.","Epigastric pain radiating straight to the back, worse when supine.","Sudden, severe abdominal pain out of proportion to exam findings.","LLQ pain with fever and a change in bowel habits."],"correctIndex":0},{"stem":"What is the first-line imaging study for cholelithiasis?","options":["MRCP.","HIDA scan.","Abdominal/RUQ ultrasound.","ERCP.","CT abdomen/pelvis with contrast."],"correctIndex":2},{"stem":"What physical exam finding is classic for acute cholecystitis?","options":["A positive psoas sign.","A positive Courvoisier's sign.","A positive Murphy sign.","A positive Rovsing sign.","A positive obturator sign."],"correctIndex":2},{"stem":"What is the most common organism causing cholecystitis?","options":["Helicobacter pylori.","Clostridioides difficile.","Staphylococcus aureus.","E. coli.","Candida albicans."],"correctIndex":3},{"stem":"Within what timeframe is cholecystectomy preferred for acute cholecystitis?","options":["Within 72 hours.","Within 24 hours.","Within 7 days.","Within 2 weeks.","Within 6 weeks."],"correctIndex":0},{"stem":"What is choledocholithiasis, and what two complications can it cause?","options":["Gallstones present in the common bile duct; can cause pancreatitis or cholangitis.","Sludge accumulation in the gallbladder; can cause acalculous cholecystitis.","Gallstones present in the pancreatic duct; can cause chronic pancreatitis only.","Gallstones present in the gallbladder only; can cause biliary colic or cholecystitis.","Gallstones present in the cystic duct only; can cause hydrops of the gallbladder."],"correctIndex":0},{"stem":"What is the diagnostic and therapeutic procedure of choice for choledocholithiasis?","options":["ERCP (endoscopic retrograde cholangiopancreatography).","EUS-FNA.","MRCP.","HIDA scan.","Abdominal ultrasound alone."],"correctIndex":0},{"stem":"What does Charcot's triad consist of?","options":["Ascites, bleeding, and caput medusae.","Abdominal pain, weight loss, and painless jaundice.","Fever with chills, RUQ pain, and jaundice.","Pancreatic calcifications, st
