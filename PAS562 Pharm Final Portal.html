<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAS 562 Pharmacology II Final Exam Portal</title>
<style>
  :root{
    --navy:#0f2a4a;
    --navy-dark:#0a1c33;
    --navy-light:#1b3f6b;
    --gold:#c9a227;
    --gold-light:#e8cf7a;
    --crimson:#8c1c2b;
    --crimson-light:#c94f5c;
    --bg:#f4f5f7;
    --card:#ffffff;
    --ink:#1c2530;
    --muted:#5b6572;
    --border:#dfe3e8;
    --green:#1e7a44;
    --green-bg:#e7f5ec;
    --red:#a3202f;
    --red-bg:#fbeaec;
    --radius:10px;
    --sidebar-w:250px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Calibri','Segoe UI',Arial,sans-serif;}
  ::selection{background:#ffe792;color:#1c2530;}
  mark.user-hl{background:#ffe792;color:#1c2530;padding:0 1px;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}

  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:var(--sidebar-w);
    background:linear-gradient(180deg,var(--navy-dark),var(--navy));
    color:#fff;
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0;left:0;bottom:0;
    z-index:30;
    box-shadow:2px 0 10px rgba(0,0,0,.15);
  }
  .sidebar-header{
    padding:22px 18px 16px 18px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .sidebar-header .kicker{
    font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);font-weight:700;margin-bottom:4px;
  }
  .sidebar-header h1{
    font-size:18px;margin:0;line-height:1.25;font-weight:700;
  }
  .sidebar-header .sub{font-size:12px;color:#b9c6d8;margin-top:6px;}

  .tab-list{list-style:none;margin:14px 0;padding:0;flex:1;overflow-y:auto;}
  .tab-btn{
    display:block;width:100%;text-align:left;background:none;border:none;color:#dce4ee;
    padding:14px 18px;font-size:14.5px;font-weight:600;cursor:pointer;position:relative;
    border-left:4px solid transparent;transition:background .15s,color .15s;
  }
  .tab-btn .tlabel{display:block;}
  .tab-btn .tsub{display:block;font-size:11px;font-weight:400;color:#93a3b8;margin-top:2px;}
  .tab-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .tab-btn.active{background:rgba(201,162,39,.14);color:#fff;border-left-color:var(--gold);}
  .tab-btn.active .tsub{color:var(--gold-light);}
  .tab-btn .progress-pill{
    display:inline-block;margin-top:6px;font-size:10.5px;background:rgba(255,255,255,.1);
    padding:2px 8px;border-radius:20px;color:#cdd8e6;
  }
  .tab-btn.active .progress-pill{background:rgba(201,162,39,.25);color:#fff2cf;}

  .sidebar-footer{
    padding:14px 18px 18px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#8fa0b6;
  }
  .sidebar-footer button{
    width:100%;padding:9px;margin-top:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:#e8edf3;border-radius:7px;font-size:12px;cursor:pointer;font-weight:600;
  }
  .sidebar-footer button:hover{background:rgba(255,255,255,.16);}

  /* MAIN */
  .main{margin-left:var(--sidebar-w);flex:1;padding:28px 34px 80px 34px;max-width:980px;}

  .block-header{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 22px;margin-bottom:20px;border-top:5px solid var(--gold);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  .block-header h2{margin:0 0 4px 0;font-size:20px;color:var(--navy);}
  .block-header p{margin:0;color:var(--muted);font-size:13px;}
  .stats-footer{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 22px;margin-top:20px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  .stats-footer .stats-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .block-stats{display:flex;gap:10px;flex-wrap:wrap;}

  .completion-banner{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;border-left:5px solid var(--gold);
  }
  .completion-banner.perfect{border-left-color:var(--green);}
  .completion-banner .cb-text{font-size:14px;color:var(--ink);}
  .completion-banner .cb-text b{color:var(--navy);}
  .banner-btn{
    background:var(--navy);color:#fff;border:none;border-radius:7px;padding:10px 16px;
    font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .banner-btn:hover{background:var(--navy-light);}
  .banner-btn.secondary{background:transparent;color:var(--navy);border:1px solid var(--border);}
  .banner-btn.secondary:hover{background:var(--bg);}
  .banner-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .retake-banner{
    background:#fff8e6;border:1px solid var(--gold-light);border-radius:var(--radius);
    padding:11px 22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;
  }
  .retake-banner .rb-text{font-size:13px;color:var(--navy);font-weight:700;}
  .stat{
    background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 14px;text-align:center;min-width:64px;
  }
  .stat .n{font-size:17px;font-weight:700;color:var(--navy);display:block;}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}

  /* QUESTION NAV GRID */
  .qnav{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:20px;
  }
  .qnav button{
    height:34px;border-radius:6px;border:1px solid var(--border);background:#fafbfc;color:var(--muted);
    font-size:12px;font-weight:600;cursor:pointer;position:relative;
  }
  .qnav button.current{outline:2px solid var(--navy);outline-offset:1px;}
  .qnav button.answered-correct{background:var(--green-bg);color:var(--green);border-color:#bfe3cc;}
  .qnav button.answered-incorrect{background:var(--red-bg);color:var(--red);border-color:#f0c1c8;}
  .qnav button.flagged::after{
    content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold);
  }

  /* QUESTION CARD */
  .qcard{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;
    box-shadow:0 1px 3px rgba(20,30,50,.05);
  }
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .qnum{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;}
  .qtag{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;
    background:var(--navy-light);color:#fff;
  }
  .qtag.tag-tier2{background:#7a5b12;}
  .qtag.tag-tier3{background:var(--crimson);}
  .flag-btn{
    background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--muted);
  }
  .flag-btn.on{background:#fff6dd;border-color:var(--gold);color:#7a5b12;font-weight:700;}

  .stem{
    font-size:16px;line-height:1.55;color:var(--ink);margin:6px 0 20px 0;padding:2px;
  }
  .stem::selection, .choice-text::selection{background:#ffe792;}

  .choices{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .choice{
    display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--border);border-radius:8px;
    padding:12px 14px;cursor:pointer;background:#fdfdfe;transition:border-color .12s,background .12s;
  }
  .choice:hover{border-color:var(--navy-light);}
  .choice .letter{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);
  }
  .choice-text{font-size:14.5px;line-height:1.4;flex:1;}
  .choice .strike-btn{
    flex:0 0 auto;background:none;border:none;color:#b7bfc9;cursor:pointer;font-size:15px;padding:2px 6px;font-weight:700;
    border-radius:5px;
  }
  .choice .strike-btn:hover{background:#eef0f3;color:var(--crimson);}
  .choice.struck{opacity:.45;}
  .choice.struck .choice-text{text-decoration:line-through;}
  .choice.selected{border-color:var(--navy);background:#eef3fa;}
  .choice.selected .letter{background:var(--navy);color:#fff;border-color:var(--navy);}
  .choice.correct{border-color:var(--green);background:var(--green-bg);}
  .choice.correct .letter{background:var(--green);color:#fff;border-color:var(--green);}
  .choice.incorrect-pick{border-color:var(--red);background:var(--red-bg);}
  .choice.incorrect-pick .letter{background:var(--red);color:#fff;border-color:var(--red);}
  .choice.locked{cursor:default;}

  .feedback{
    display:none;margin-top:18px;border-top:2px dashed var(--border);padding-top:16px;
  }
  .feedback.show{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .fb-verdict{font-size:13.5px;font-weight:700;margin-bottom:10px;padding:8px 12px;border-radius:7px;display:inline-block;}
  .fb-verdict.correct{background:var(--green-bg);color:var(--green);}
  .fb-verdict.incorrect{background:var(--red-bg);color:var(--red);}
  .fb-block{margin-bottom:12px;}
  .fb-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--navy);margin-bottom:5px;
    display:flex;align-items:center;gap:6px;
  }
  .fb-label.mem{color:#7a5b12;}
  .fb-label.instr{color:var(--crimson);}
  .fb-text{font-size:13.5px;line-height:1.55;color:#2c3644;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px 13px;}
  .fb-text.mem{background:#fffaf0;border-color:#f0e0b0;}
  .fb-text.instr{background:#fdf2f3;border-color:#f0c9cd;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px;}
  .nav-btn{
    background:var(--navy);color:#fff;border:none;padding:11px 20px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .nav-btn:hover{background:var(--navy-light);}
  .nav-btn.secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .nav-btn.secondary:hover{background:#eef3fa;}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;}

  .toolbar-hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;}

  /* Score summary */
  .score-summary{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:20px;
  }
  .score-summary .big{font-size:38px;font-weight:800;color:var(--navy);}
  .score-summary .lbl{color:var(--muted);font-size:13px;}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:#c7cfd8;border-radius:10px;}

  @media (max-width:900px){
    .sidebar{position:relative;width:100%;height:auto;}
    .main{margin-left:0;padding:18px;}
    .app{flex-direction:column;}
  }

  .mock-controls{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;border-left:5px solid var(--crimson);
  }
  .mock-controls .mc-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .mock-controls label{font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;}
  .mock-controls select{
    padding:9px 14px;border-radius:7px;border:1.5px solid var(--border);font-size:13.5px;color:var(--ink);
    background:#fff;font-weight:700;cursor:pointer;
  }
  .mock-controls select:focus{outline:2px solid var(--navy-light);}
  .mock-controls .mc-desc{font-size:11.5px;color:var(--muted);width:100%;line-height:1.5;}
  .mock-controls .mc-badge{
    font-size:11px;font-weight:700;color:#fff;background:var(--crimson);padding:4px 10px;border-radius:20px;
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="kicker">PAS 562</div>
      <h1>Pharmacology II<br>Final Exam Portal</h1>
      <div class="sub">4 Systems &middot; 160 Questions</div>
    </div>
    <ul class="tab-list" id="tabList"></ul>
    <div class="sidebar-footer">
      Progress saves automatically in this browser.
      <button id="resetBtn" type="button">Reset All Progress</button>
    </div>
  </nav>
  <main class="main">
    <div id="content"></div>
  </main>
</div>

<script>
const HEME_QUESTIONS = [
  {
    "id": "ho1",
    "tier": 1,
    "stem": "Oral ferrous iron salts (ferrous sulfate, gluconate, fumarate) are most efficiently absorbed from which part of the GI tract?",
    "choices": [
      "Stomach",
      "Duodenum",
      "Ileum",
      "Jejunum only",
      "Colon"
    ],
    "correctIndex": 1,
    "rationale": "Iron is absorbed almost exclusively in the duodenum, where it binds apoferritin to form ferritin for storage or is exported via ferroportin into the blood, where transferrin carries it to the marrow.",
    "memoryTrick": "'D'uodenum for 'D'ietary iron uptake.",
    "instructorNote": "Iron absorption site and the apoferritin→ferritin→ferroportin→transferrin pathway was called out as a must-know sequence."
  },
  {
    "id": "ho2",
    "tier": 1,
    "stem": "Which parenteral iron formulation is classically administered by deep Z-track intramuscular injection to prevent staining of the skin?",
    "choices": [
      "Ferric carboxymaltose",
      "Iron sucrose",
      "Iron dextran",
      "Ferumoxytol",
      "Sodium ferric gluconate"
    ],
    "correctIndex": 2,
    "rationale": "Iron dextran is the parenteral iron product historically given by deep IM Z-track injection; the Z-track technique seals the injection tract so iron cannot leak back and stain the overlying skin (permanent brown/black discoloration if given incorrectly).",
    "memoryTrick": "Z is for 'Zero staining' — track the needle to keep iron from tracking back up.",
    "instructorNote": "Explicitly named as testable: 'which formulation are we concerned about with tissue staining' and the Z-track administration technique."
  },
  {
    "id": "ho3",
    "tier": 1,
    "stem": "Which chelating agent is used to treat acute iron overdose/toxicity?",
    "choices": [
      "Deferoxamine",
      "Penicillamine",
      "Succimer",
      "Protamine sulfate",
      "Dimercaprol"
    ],
    "correctIndex": 0,
    "rationale": "Deferoxamine is the parenteral iron chelator used for acute iron toxicity/overdose; it binds free iron so it can be excreted in urine and feces. Deferasirox (oral) is used for chronic overload rather than acute poisoning.",
    "memoryTrick": "DeferOXamine binds iron OXide (free iron) and carries it out.",
    "instructorNote": "Iron toxicity and its correction were flagged directly as testable content."
  },
  {
    "id": "ho4",
    "tier": 1,
    "stem": "A deficiency of which vitamin classically causes megaloblastic anemia WITH accompanying neurologic symptoms (paresthesias, subacute combined degeneration)?",
    "choices": [
      "Folate",
      "Vitamin B12",
      "Vitamin B6",
      "Vitamin C",
      "Vitamin K"
    ],
    "correctIndex": 1,
    "rationale": "Vitamin B12 (cobalamin) deficiency causes megaloblastic anemia plus neurologic findings because B12 is also required for myelin synthesis; folate deficiency causes the same hematologic picture WITHOUT neurologic involvement.",
    "memoryTrick": "B12 = Brain involvement; folate does not touch the nerves.",
    "instructorNote": "Distinguishing B12 vs. folate deficiency was specifically flagged as a core hematology concept."
  },
  {
    "id": "ho5",
    "tier": 1,
    "stem": "Which of the following is the most common cause of folate deficiency in adults?",
    "choices": [
      "Autoimmune destruction of parietal cells",
      "Gastrectomy",
      "Poor dietary intake / alcoholism",
      "Excess vitamin B12 intake",
      "Chronic proton pump inhibitor use"
    ],
    "correctIndex": 2,
    "rationale": "Folate has minimal body stores and is easily depleted by poor dietary intake, alcoholism, and increased demand (pregnancy), whereas B12 deficiency is more often due to loss of intrinsic factor (pernicious anemia) or gastric/ileal disease.",
    "memoryTrick": "Folate stores run out FAST — fast depletion with poor diet or alcohol.",
    "instructorNote": "Folate deficiency etiology was named directly as a concept to know."
  },
  {
    "id": "ho6",
    "tier": 1,
    "stem": "When a patient presents with megaloblastic anemia and it is unclear whether the cause is B12 or folate deficiency, what is the appropriate initial (empiric) treatment approach?",
    "choices": [
      "Folic acid alone until labs return",
      "B12 alone until labs return",
      "Empiric treatment with BOTH B12 and folic acid until the cause is confirmed",
      "Withhold all treatment until confirmatory testing is complete",
      "Immediate bone marrow biopsy before any replacement"
    ],
    "correctIndex": 2,
    "rationale": "Because folic acid alone can partially correct the anemia of B12 deficiency while allowing the neurologic damage to progress, empiric therapy should include BOTH vitamin B12 and folic acid until the specific deficiency is confirmed.",
    "memoryTrick": "Empiric = 'either could be it' — cover both bases with B12 + folate.",
    "instructorNote": "Empiric replacement with both B12 and folate was explicitly flagged as a required concept."
  },
  {
    "id": "ho7",
    "tier": 1,
    "stem": "Leucovorin (folinic acid) is administered as a 'rescue' agent after high-dose therapy with which medication?",
    "choices": [
      "Doxorubicin",
      "Cisplatin",
      "Methotrexate",
      "Cyclophosphamide",
      "Vincristine"
    ],
    "correctIndex": 2,
    "rationale": "Leucovorin is a reduced, active form of folate that bypasses the dihydrofolate reductase step blocked by methotrexate, restoring folate pools in normal cells and rescuing them from methotrexate-induced toxicity.",
    "memoryTrick": "leucoVORin = the VIP rescue after MTX blocks the folate pathway.",
    "instructorNote": "The instructor explicitly distinguished folic acid (routine supplementation) from leucovorin (the 'rescue' drug) as two separate testable facts."
  },
  {
    "id": "ho8",
    "tier": 1,
    "stem": "Filgrastim (a G-CSF agent) is most commonly associated with which patient-reported adverse effect?",
    "choices": [
      "Peripheral neuropathy",
      "Bone pain",
      "Ototoxicity",
      "Red-orange urine",
      "Pulmonary fibrosis"
    ],
    "correctIndex": 1,
    "rationale": "G-CSF agents like filgrastim stimulate rapid proliferation of granulocyte precursors in the bone marrow, and the resulting marrow expansion classically causes bone pain, most often in the low back, pelvis, and long bones.",
    "memoryTrick": "Filgrastim fills the marrow fast — and a full marrow means aching bones.",
    "instructorNote": "Explicitly flagged: 'a key side effect that patients will complain about' with the CSF agents."
  },
  {
    "id": "ho9",
    "tier": 1,
    "stem": "Oprelvekin is a recombinant form of which cytokine, used to prevent severe chemotherapy-induced thrombocytopenia?",
    "choices": [
      "Erythropoietin",
      "Interleukin-11",
      "G-CSF",
      "GM-CSF",
      "Thrombopoietin receptor agonist peptide"
    ],
    "correctIndex": 1,
    "rationale": "Oprelvekin is recombinant interleukin-11 (IL-11), a thrombopoietic growth factor that stimulates proliferation of megakaryocyte progenitors to increase platelet production and is used to prevent severe chemotherapy-induced thrombocytopenia.",
    "memoryTrick": "OprelveKIN = Kin to IL-11, the platelet-boosting interleukin.",
    "instructorNote": "Oprelvekin for platelets was one of the explicitly named must-know Heme/Onc bullet points."
  },
  {
    "id": "ho10",
    "tier": 1,
    "stem": "When monitoring a patient on epoetin alfa for chemotherapy-associated anemia, hemoglobin should generally not be allowed to exceed which threshold, and should not rise more than how much over a 2-week period?",
    "choices": [
      "Not exceed 8 g/dL; no more than 0.5 g/dL/2 weeks",
      "Not exceed 10 g/dL; no more than 1 g/dL/2 weeks",
      "Not exceed 14 g/dL; no more than 3 g/dL/2 weeks",
      "Not exceed 16 g/dL; no limit on rate of rise",
      "Not exceed 9 g/dL; no more than 2 g/dL/2 weeks"
    ],
    "correctIndex": 1,
    "rationale": "Erythropoiesis-stimulating agents carry a boxed warning: hemoglobin should not exceed 10 g/dL (some references allow up to 12), and should not rise more than 1 g/dL over a 2-week period, because faster/higher increases raise blood viscosity and the risk of thrombosis, cardiovascular events, and (in cancer patients) tumor progression.",
    "memoryTrick": "Epoetin monitoring: 'ten and one' — cap around 10 g/dL, rise no more than 1 g/dL per 2 weeks.",
    "instructorNote": "Epoetin monitoring parameters were explicitly named as a required Heme/Onc concept."
  },
  {
    "id": "ho11",
    "tier": 2,
    "stem": "A patient with a hemolytic anemia is prescribed oral ferrous sulfate by a well-meaning provider despite a normal iron panel. Which of the following best explains why iron supplementation is generally NOT indicated in this scenario?",
    "choices": [
      "Hemolysis destroys iron irreversibly, requiring higher doses than normal",
      "Iron released from destroyed RBCs is recycled and reused for new heme synthesis, so most hemolytic anemias are not iron-deficient",
      "Hemolytic anemia always coexists with GI bleeding, making oral iron dangerous",
      "Ferrous salts accelerate hemolysis directly",
      "Hemolytic anemia requires only folate, never iron"
    ],
    "correctIndex": 1,
    "rationale": "Iron liberated from destroyed red blood cells during hemolysis is recycled by macrophages and reused for new heme synthesis, so hemolytic anemias are typically NOT iron-deficient; supplementation is unnecessary and risks iron overload.",
    "memoryTrick": "Hemolysis recycles iron — the body is its own iron bank.",
    "instructorNote": "The lecture explicitly cautions that iron should not be given in hemolytic anemia because destroyed-RBC iron is recycled."
  },
  {
    "id": "ho12",
    "tier": 2,
    "stem": "A patient with severe iron-deficiency anemia cannot tolerate or absorb oral iron and requires rapid correction with intramuscular iron dextran. Which administration technique is essential to prevent permanent skin staining at the injection site?",

const MOCK_SYSTEM_POOLS = { heme: HEME_QUESTIONS, cardio: CARDIO_QUESTIONS, pulm: PULM_QUESTIONS, gi: GI_QUESTIONS };

function mockScaledCounts(total){
  const ratioTotal = Object.values(MOCK_BLUEPRINT_RATIO).reduce((a,b)=>a+b,0);
  const raw = {}, base = {};
  let sumBase = 0;
  Object.keys(MOCK_BLUEPRINT_RATIO).forEach(k=>{
    raw[k] = total * MOCK_BLUEPRINT_RATIO[k] / ratioTotal;
    base[k] = Math.floor(raw[k]);
    sumBase += base[k];
  });
  let remainder = total - sumBase;
  const order = Object.keys(MOCK_BLUEPRINT_RATIO).sort((a,b)=> (raw[b]-base[b]) - (raw[a]-base[a]));
  let i = 0;
  while(remainder > 0){
    base[order[i % order.length]]++;
    remainder--;
    i++;
  }
  return base;
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function generateMockExam(total){
  const counts = mockScaledCounts(total);
  let pool = [];
  const runTag = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  Object.keys(counts).forEach(sysId=>{
    const shuffled = shuffleArr(MOCK_SYSTEM_POOLS[sysId]);
    const picked = shuffled.slice(0, counts[sysId]);
    picked.forEach(q=>{
      const clone = Object.assign({}, q);
      clone.id = "mock_" + sysId + "_" + q.id + "_" + runTag;
      clone.sourceSystem = sysId;
      pool.push(clone);
    });
  });
  pool = shuffleArr(pool);
  currentMockQuestions = pool;
  STATE.mock = {};
  STATE.mockQuestions = currentMockQuestions;
  STATE.mockMeta = { size: total, counts: counts, generatedAt: Date.now() };
  saveState(STATE);
}

function loadOrInitMock(){
  if(STATE.mockQuestions && Array.isArray(STATE.mockQuestions) && STATE.mockQuestions.length){
    currentMockQuestions = STATE.mockQuestions;
    if(!STATE.mockMeta) STATE.mockMeta = { size: currentMockQuestions.length, counts:{}, generatedAt: Date.now() };
  } else {
    generateMockExam(75);
  }
}

const TABS = {
  heme: { label: "Heme / Onc", sub: "Hematology & Oncology", questions: HEME_QUESTIONS },
  cardio: { label: "Cardiovascular", sub: "Cardiology Pharmacology", questions: CARDIO_QUESTIONS },
  pulm: { label: "Pulmonary", sub: "Asthma, COPD & TB", questions: PULM_QUESTIONS },
  gi: { label: "Gastrointestinal", sub: "GERD, PUD, IBS & IBD", questions: GI_QUESTIONS },
  mock: {
    label: "Full Mock Exam",
    get sub(){
      const m = (typeof STATE !== "undefined" && STATE.mockMeta) ? STATE.mockMeta : { size: currentMockQuestions.length };
      return m.size + " Q \u00b7 Blueprint-Weighted \u00b7 Randomized";
    },
    get questions(){ return currentMockQuestions; }
  }
};



/* ======================================================= */

const STORAGE_KEY = "pas562_pharm_final_portal_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let STATE = loadState();
loadOrInitMock();


function ensureTabState(tabId){
  if(!STATE[tabId]) STATE[tabId] = {};
  return STATE[tabId];
}

let currentTab = Object.keys(TABS)[0];
let currentIndex = 0;
let retakeSession = null; // { tab: tabId, ids: [missed question ids] }

function getActiveList(tabId){
  const tab = TABS[tabId];
  if(retakeSession && retakeSession.tab===tabId){
    const list = tab.questions.filter(q=>retakeSession.ids.includes(q.id));
    if(list.length) return list;
  }
  return tab.questions;
}

function startRetake(ids){
  const st = ensureTabState(currentTab);
  ids.forEach(id=>{
    if(st[id]){
      st[id].pickedIndex = null;
      st[id].struck = [];
    }
  });
  retakeSession = { tab: currentTab, ids: ids.slice() };
  currentIndex = 0;
  saveState(STATE);
  render();
}

function exitRetake(){
  retakeSession = null;
  currentIndex = 0;
  render();
}

function tierLabel(tier){
  if(tier===1) return "Recall";
  if(tier===2) return "Application";
  return "Analysis";
}

function renderSidebar(){
  const list = document.getElementById('tabList');
  list.innerHTML = '';
  Object.keys(TABS).forEach(tabId=>{
    const tab = TABS[tabId];
    const st = ensureTabState(tabId);
    const answered = Object.keys(st).filter(k=>st[k] && st[k].pickedIndex!=null).length;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (tabId===currentTab ? ' active' : '');
    btn.innerHTML = `<span class="tlabel">${tab.label}</span><span class="tsub">${tab.sub}</span><span class="progress-pill">${answered}/${tab.questions.length} answered</span>`;
    btn.onclick = ()=>{ currentTab = tabId; currentIndex = 0; retakeSession = null; render(); };
    li.appendChild(btn);
    list.appendChild(li);
  });
}

function letterFor(i){ return String.fromCharCode(65+i); }

function attachHighlighting(el, qst, key){
  if(!el) return;
  const commit = ()=>{
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
    const range = sel.getRangeAt(0);
    if(range.collapsed) return;
    if(!el.contains(range.commonAncestorContainer)){ return; }
    try{
      const mark = document.createElement('mark');
      mark.className = 'user-hl';
      range.surroundContents(mark);
    }catch(err){
      sel.removeAllRanges();
      return;
    }
    sel.removeAllRanges();
    qst.highlights[key] = el.innerHTML;
    saveState(STATE);
  };
  el.addEventListener('mouseup', commit);
  el.addEventListener('touchend', commit);
}

function renderQuestion(){
  const tab = TABS[currentTab];
  const fullQuestions = tab.questions;
  const st = ensureTabState(currentTab);

  const isRetake = !!(retakeSession && retakeSession.tab===currentTab);
  const activeList = getActiveList(currentTab);
  if(currentIndex >= activeList.length) currentIndex = Math.max(0, activeList.length-1);
  const q = activeList[currentIndex];

  if(!st[q.id]) st[q.id] = { pickedIndex:null, struck:[], flagged:false, highlights:{} };
  const qst = st[q.id];
  if(!qst.highlights) qst.highlights = {};

  const sessionTotal = activeList.length;
  const fullTotal = fullQuestions.length;
  const answeredCount = Object.keys(st).filter(k=>st[k] && st[k].pickedIndex!=null && fullQuestions.some(x=>x.id===k)).length;
  let correctCount = 0;
  const missedIds = [];
  fullQuestions.forEach(qq=>{
    const s = st[qq.id];
    if(s && s.pickedIndex!=null){
      if(s.pickedIndex===qq.correctIndex) correctCount++;
      else missedIds.push(qq.id);
    }
  });
  const fullyAnswered = answeredCount===fullTotal;

  const tierClass = q.tier===1?'':(q.tier===2?'tag-tier2':'tag-tier3');

  let html = '';
  html += `<div class="block-header">
    <div>
      <h2>${tab.label}${isRetake?' <span style="color:var(--gold);font-size:14px;font-weight:700;">&middot; Retake Mode</span>':''}</h2>
      <p>${isRetake? `Reviewing ${sessionTotal} missed question${sessionTotal===1?'':'s'}` : tab.sub}</p>
    </div>
  </div>`;

  if(currentTab==='mock' && !isRetake){
    const mm = STATE.mockMeta || { size: fullTotal, counts:{} };
    const breakdown = Object.keys(MOCK_SYSTEM_LABELS).map(k=>`${MOCK_SYSTEM_LABELS[k]} ${mm.counts && mm.counts[k]!=null ? mm.counts[k] : ''}`).join(' &middot; ');
    html += `<div class="mock-controls">
      <div class="mc-left">
        <label for="mockSizeSelect">Question Count</label>
        <select id="mockSizeSelect">
          <option value="50" ${mm.size===50?'selected':''}>50 Questions</option>
          <option value="75" ${mm.size===75?'selected':''}>75 Questions</option>
          <option value="100" ${mm.size===100?'selected':''}>100 Questions</option>
        </select>
        <button class="banner-btn" id="generateMockBtn">&#127922; Generate New Mock Exam</button>
        <span class="mc-badge">${breakdown}</span>
      </div>
      <div class="mc-desc">Every time you generate, a completely new set of questions is randomly drawn from all four system tabs, held to the instructor's blueprint ratio (Heme/Onc : Cardio : Pulm : GI &asymp; 18:19:17:21, scaled to your selected count).</div>
    </div>`;
  }


  if(isRetake){
    const retakeAnsweredCount = activeList.filter(qq=>st[qq.id] && st[qq.id].pickedIndex!=null).length;
    const stillMissed = activeList.filter(qq=>st[qq.id] && st[qq.id].pickedIndex!=null && st[qq.id].pickedIndex!==qq.correctIndex).map(qq=>qq.id);
    const retakeComplete = retakeAnsweredCount===sessionTotal;
    if(!retakeComplete){
      html += `<div class="retake-banner">
        <div class="rb-text">🔁 Retake Mode &mdash; you're only seeing the ${sessionTotal} question${sessionTotal===1?'':'s'} you missed.</div>
        <div class="banner-actions"><button class="banner-btn secondary" id="exitRetakeBtn">Exit Retake Mode</button></div>
      </div>`;
    } else if(stillMissed.length===0){
      html += `<div class="completion-banner perfect">
        <div class="cb-text">🎉 <b>All caught up!</b> Every retake question is now correct.</div>
        <div class="banner-actions"><button class="banner-btn" id="exitRetakeBtn">Return to Full Tab</button></div>
      </div>`;
    } else {
      const gotRight = sessionTotal - stillMissed.length;
      html += `<div class="completion-banner">
        <div class="cb-text">✅ You got ${gotRight}/${sessionTotal} correct this round.</div>
        <div class="banner-actions">
          <button class="banner-btn" id="retakeAgainBtn" data-ids='${JSON.stringify(stillMissed)}'>Retake Missed Again (${stillMissed.length})</button>
          <button class="banner-btn secondary" id="exitRetakeBtn">Return to Full Tab</button>
        </div>
      </div>`;
    }
  } else if(fullyAnswered){
    const pct = Math.round((correctCount/fullTotal)*100);
    const perfect = missedIds.length===0;
    html += `<div class="completion-banner ${perfect?'perfect':''}">
      <div class="cb-text">${perfect? '🎉' : '✅'} <b>${tab.label} complete</b> &mdash; ${correctCount}/${fullTotal} correct (${pct}%).${perfect? ' Perfect score!' : ''}</div>
      <div class="banner-actions">
        ${perfect? '' : `<button class="banner-btn" id="retakeMissedBtn">Retake Missed Questions (${missedIds.length})</button>`}
      </div>
    </div>`;
  }

  html += `<div class="qcard">
    <div class="qmeta">
      <span class="qnum">Question ${currentIndex+1} of ${sessionTotal}</span>
      <span class="qtag ${tierClass}">${tierLabel(q.tier)}</span>
      <button class="flag-btn ${qst.flagged?'on':''}" id="flagBtn">${qst.flagged?'★ Flagged':'☆ Flag for review'}</button>
    </div>
    <div class="stem" id="stemText">${qst.highlights.stem || q.stem}</div>
    <div class="choices" id="choicesWrap"></div>
    <div class="feedback ${qst.pickedIndex!=null?'show':''}" id="feedbackWrap"></div>
    <div class="nav-row">
      <button class="nav-btn secondary" id="prevBtn" ${currentIndex===0?'disabled':''}>&larr; Previous</button>
      <div class="toolbar-hint">Highlight text with your cursor &middot; click ✕ to cross out a choice</div>
      <button class="nav-btn" id="nextBtn" ${currentIndex===sessionTotal-1?'disabled':''}>Next &rarr;</button>
    </div>
  </div>`;

  html += `<div class="qnav" id="qnavGrid"></div>`;

  html += `<div class="stats-footer">
    <div class="stats-label">${tab.label} Progress</div>
    <div class="block-stats">
      <div class="stat"><span class="n">${fullTotal}</span><span class="l">Questions</span></div>
      <div class="stat"><span class="n">${answeredCount}</span><span class="l">Answered</span></div>
      <div class="stat"><span class="n">${correctCount}</span><span class="l">Correct</span></div>
    </div>
  </div>`;

  document.getElementById('content').innerHTML = html;
  attachHighlighting(document.getElementById('stemText'), qst, 'stem');

  // choices
  const choicesWrap = document.getElementById('choicesWrap');
  q.choices.forEach((choiceText, i)=>{
    const div = document.createElement('div');
    let cls = 'choice';
    if(qst.struck.includes(i)) cls += ' struck';
    if(qst.pickedIndex!=null){
      cls += ' locked';
      if(i===q.correctIndex) cls += ' correct';
      else if(i===qst.pickedIndex) cls += ' incorrect-pick';
    } else if(qst.pickedIndex===i){
      cls += ' selected';
    }
    div.className = cls;
    const choiceHTML = qst.highlights['c'+i] || choiceText;
    div.innerHTML = `<span class="letter">${letterFor(i)}</span><span class="choice-text">${choiceHTML}</span>` +
      (qst.pickedIndex==null ? `<button class="strike-btn" data-i="${i}" title="Cross out">✕</button>` : '');
    choicesWrap.appendChild(div);

    const choiceTextEl = div.querySelector('.choice-text');
    let justHighlighted = false;
    const commitHighlight = ()=>{
      const sel = window.getSelection();
      if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
      const range = sel.getRangeAt(0);
      if(range.collapsed) return;
      if(!choiceTextEl.contains(range.commonAncestorContainer)) return;
      try{
        const mark = document.createElement('mark');
        mark.className = 'user-hl';
        range.surroundContents(mark);
      }catch(err){ sel.removeAllRanges(); return; }
      sel.removeAllRanges();
      qst.highlights['c'+i] = choiceTextEl.innerHTML;
      saveState(STATE);
      justHighlighted = true;
    };
    choiceTextEl.addEventListener('mouseup', commitHighlight);
    choiceTextEl.addEventListener('touchend', commitHighlight);

    if(qst.pickedIndex==null){
      div.addEventListener('click', (e)=>{
        if(justHighlighted){ justHighlighted = false; return; }
        if(e.target.classList.contains('strike-btn')){
          e.stopPropagation();
          const idx = qst.struck.indexOf(i);
          if(idx>-1) qst.struck.splice(idx,1); else qst.struck.push(i);
          saveState(STATE);
          renderQuestion();
          return;
        }
        if(qst.struck.includes(i)) return;
        qst.pickedIndex = i;
        saveState(STATE);
        renderQuestion();
        renderSidebar();
      });
    }
  });

  // feedback
  if(qst.pickedIndex!=null){
    const isCorrect = qst.pickedIndex===q.correctIndex;
    const fb = document.getElementById('feedbackWrap');
    fb.innerHTML = `
      <div class="fb-verdict ${isCorrect?'correct':'incorrect'}">${isCorrect?'✓ Correct':'✕ Incorrect — correct answer is '+letterFor(q.correctIndex)}</div>
      <div class="fb-block">
        <div class="fb-label">Rationale</div>
        <div class="fb-text" id="fbRationale">${qst.highlights.rationale || q.rationale}</div>
      </div>
      <div class="fb-block">
        <div class="fb-label mem">🧠 Memory Trick</div>
        <div class="fb-text mem" id="fbMemory">${qst.highlights.memoryTrick || q.memoryTrick}</div>
      </div>
      <div class="fb-block">
        <div class="fb-label instr">⭐ Instructor Emphasis</div>
        <div class="fb-text instr" id="fbInstructor">${qst.highlights.instructorNote || q.instructorNote}</div>
      </div>
    `;
    fb.classList.add('show');
    attachHighlighting(document.getElementById('fbRationale'), qst, 'rationale');
    attachHighlighting(document.getElementById('fbMemory'), qst, 'memoryTrick');
    attachHighlighting(document.getElementById('fbInstructor'), qst, 'instructorNote');
  }

  // flag button
  document.getElementById('flagBtn').onclick = ()=>{
    qst.flagged = !qst.flagged;
    saveState(STATE);
    renderQuestion();
  };

  // qnav grid
  const grid = document.getElementById('qnavGrid');
  activeList.forEach((qq,i)=>{
    const s = st[qq.id];
    const b = document.createElement('button');
    b.textContent = i+1;
    let bcls = '';
    if(s && s.pickedIndex!=null){
      bcls += s.pickedIndex===qq.correctIndex ? ' answered-correct' : ' answered-incorrect';
    }
    if(s && s.flagged) bcls += ' flagged';
    if(i===currentIndex) bcls += ' current';
    b.className = bcls.trim();
    b.onclick = ()=>{ currentIndex = i; render(); };
    grid.appendChild(b);
  });

  document.getElementById('prevBtn').onclick = ()=>{ if(currentIndex>0){ currentIndex--; render(); } };
  document.getElementById('nextBtn').onclick = ()=>{ if(currentIndex<sessionTotal-1){ currentIndex++; render(); } };

  // completion / retake banner buttons
  const retakeBtn = document.getElementById('retakeMissedBtn');
  if(retakeBtn){
    retakeBtn.onclick = ()=>{ startRetake(missedIds); };
  }
  const retakeAgainBtn = document.getElementById('retakeAgainBtn');
  if(retakeAgainBtn){
    retakeAgainBtn.onclick = ()=>{
      const ids = JSON.parse(retakeAgainBtn.getAttribute('data-ids'));
      startRetake(ids);
    };
  }
  const exitBtn = document.getElementById('exitRetakeBtn');
  if(exitBtn){
    exitBtn.onclick = exitRetake;
  }

  // mock exam generator controls
  const generateMockBtn = document.getElementById('generateMockBtn');
  if(generateMockBtn){
    generateMockBtn.onclick = ()=>{
      const sizeSelect = document.getElementById('mockSizeSelect');
      const size = parseInt(sizeSelect.value, 10);
      const mockSt = ensureTabState('mock');
      const hasProgress = Object.keys(mockSt).some(k=> mockSt[k] && mockSt[k].pickedIndex!=null);
      const proceed = ()=>{
        generateMockExam(size);
        currentIndex = 0;
        retakeSession = null;
        render();
      };
      if(hasProgress){
        if(confirm('Generating a new mock exam will discard your current mock exam progress and build a brand-new randomized set. Continue?')){
          proceed();
        }
      } else {
        proceed();
      }
    };
  }
}

function render(){
  renderSidebar();
  renderQuestion();
  window.scrollTo(0,0);
}

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('This will clear all answers, flags, and cross-outs across every tab (and generate a fresh mock exam). Continue?')){
    STATE = {};
    loadOrInitMock();
    saveState(STATE);
    currentIndex = 0;
    retakeSession = null;
    render();
  }
});

render();
</script>
